name: Agenda pública somente leitura 0.1.475

on:
  push:
    branches:
      - agent/agenda-public-read-only-0.1.475
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-public-read-only-0475-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: canonical_0468_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove source SHA and protected FAROL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          BASE=52c6887035b6d4003029d5af9cc09c93931cd83a
          FAROL=app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          git show "$BASE:$FAROL" > /tmp/farol-base.kt
          cmp -s /tmp/farol-base.kt "$FAROL"
          printf '%s\n' "${GITHUB_SHA}" | tee source_head.txt
          sha256sum "$FAROL" | tee farol.sha256

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate read-only public Agenda and canonical backend
        shell: bash
        run: |
          set -euo pipefail
          cd trip-platform/functions
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          npm run check
          node --check ../public/app.js
          node --test \
            test/agenda-public-read-only-0475.test.js \
            test/agenda-card-visual-parity-0473.test.js \
            test/backend-canonical-authority-0468.test.js \
            test/agenda-private-mirror-0434.test.js \
            test/agenda-public-timeline-reflection-0425.test.js \
            test/agenda-readback-forensics-0421.test.js \
            test/deterministic-trip-outbox-0387.test.js | tee ../../node-focused-tests.log

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run focused Android regression tests and build installable APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaAutomaticSync0397Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaTimelineAutoSync0398Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PublicMirrorAttestation0411Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaReadbackForensics0421Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaDeterministicTripOutbox0387Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaImmediateCardDelta0431Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaCollectorModules0264Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalProjectionConvergence0408Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace | tee android-focused-tests.log
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Prove final APK belongs to current SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat source_head.txt)"
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk.sha256
          grep -F 'versionCode = 5768' app/build.gradle.kts | tee app-version.txt
          grep -F 'versionName = "0.1.475"' app/build.gradle.kts | tee -a app-version.txt
          grep -Fq 'ABRIR AGENDA PÚBLICA' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaAutomaticSyncUi0397.kt
          ! grep -Fq 'ABRIR ÁREA ADMINISTRATIVA' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaAutomaticSyncUi0397.kt
          git status --short --untracked-files=no | tee tracked-status.txt
          test ! -s tracked-status.txt

      - name: Configure Firebase deployment authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-deploy-sa.json
            chmod 600 /tmp/firebase-deploy-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-deploy-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-deploy-sa.json
            chmod 600 /tmp/firebase-deploy-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-deploy-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase credential is missing." >&2
            exit 3
          fi

      - name: Deploy exact SHA backend and read-only public Agenda
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force
          fi

      - name: Live smoke exact public surface
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://rota-certa-7ccc8.web.app
          curl --retry 10 --retry-delay 3 --fail --silent --show-error "$BASE/v1/health" | tee live-health.json
          grep -Fq '"ok":true' live-health.json
          curl --retry 10 --retry-delay 3 --fail --silent --show-error "$BASE/" > live-public.html
          grep -Fq 'app.js?v=0.1.475' live-public.html
          grep -Fq 'id="agendaTrips"' live-public.html
          ! grep -Eiq 'Minha Área|Administrador|Administração da Agenda|privateAuth|accessGate|admin-0417.js|agendaVisibilityToggle0471' live-public.html
          curl --retry 10 --retry-delay 3 --fail --silent --show-error "$BASE/app.js?v=0.1.475" > live-app.js
          grep -Fq 'agendaCanonicalVisual0473' live-app.js
          grep -Fq 'PUBLIC_AGENDA_CARD_STATUSES_0469' live-app.js
          ! grep -Eiq '/v1/admin/|passengerSession|privateAuth|requestPublicAgendaAccess|agendaVisibilityToggle0471|Administrar esta viagem' live-app.js
          printf '%s\n' "${GITHUB_SHA}" | tee deployed-source-head.txt

      - name: Upload installable APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-agenda-public-read-only-0475-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            source_head.txt
            app-version.txt
            apk.sha256
            farol.sha256
            node-focused-tests.log
            android-focused-tests.log
            live-health.json
            live-public.html
            live-app.js
            deployed-source-head.txt
