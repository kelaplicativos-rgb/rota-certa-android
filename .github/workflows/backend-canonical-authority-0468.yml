name: Agenda online/offline Home 0.1.471

on:
  push:
    branches:
      - agent/agenda-public-online-toggle-0.1.471
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-public-online-toggle-0471-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: canonical_0468_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove source SHA and protected FAROL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          BASE=c34dac6d54ba1bd1c1d233701669a1c80017844c
          FAROL=app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          git show "$BASE:$FAROL" > /tmp/farol-base.kt
          cmp -s /tmp/farol-base.kt "$FAROL"
          printf '%s\n' "${GITHUB_SHA}" | tee source_head.txt
          sha256sum "$FAROL" | tee farol.sha256

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - name: Validate backend syntax and 0.1.471 visibility contracts
        shell: bash
        run: |
          set -euo pipefail
          cd trip-platform/functions
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          npm run check
          node --test test/backend-canonical-authority-0468.test.js test/agenda-contextual-admin-home-0470.test.js test/agenda-public-online-toggle-0471.test.js
          cd ../..
          rm -rf /tmp/rota-certa-base-0468
          git worktree add --detach /tmp/rota-certa-base-0468 c34dac6d54ba1bd1c1d233701669a1c80017844c
          (
            cd /tmp/rota-certa-base-0468/trip-platform/functions
            npm install --package-lock=false --ignore-scripts --no-audit --no-fund
            set +e
            npm test > /tmp/base-node-tests.log 2>&1
            BASE_STATUS=$?
            set -e
            BASE_FAIL="$(grep -E '^# fail [0-9]+' /tmp/base-node-tests.log | tail -1 | awk '{print $3}')"
            printf '%s\n' "${BASE_FAIL:-999}" > /tmp/base-fail-count
            printf 'base_status=%s base_fail=%s\n' "$BASE_STATUS" "${BASE_FAIL:-unknown}"
          )
          (
            cd trip-platform/functions
            set +e
            npm test > /tmp/current-node-tests.log 2>&1
            CURRENT_STATUS=$?
            set -e
            CURRENT_FAIL="$(grep -E '^# fail [0-9]+' /tmp/current-node-tests.log | tail -1 | awk '{print $3}')"
            printf '%s\n' "${CURRENT_FAIL:-999}" > /tmp/current-fail-count
            printf 'current_status=%s current_fail=%s\n' "$CURRENT_STATUS" "${CURRENT_FAIL:-unknown}"
          )
          BASE_FAIL="$(cat /tmp/base-fail-count)"
          CURRENT_FAIL="$(cat /tmp/current-fail-count)"
          echo "Historical suite comparison: base=$BASE_FAIL current=$CURRENT_FAIL"
          grep '^not ok ' /tmp/base-node-tests.log | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/base-failures.txt || true
          grep '^not ok ' /tmp/current-node-tests.log | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/current-failures.txt || true
          comm -13 /tmp/base-failures.txt /tmp/current-failures.txt | tee historical-new-failures.txt
          comm -23 /tmp/base-failures.txt /tmp/current-failures.txt | tee historical-resolved-failures.txt
          printf 'base=%s\ncurrent=%s\n' "$BASE_FAIL" "$CURRENT_FAIL" | tee historical-counts.txt
          if [ -s historical-new-failures.txt ]; then
            echo "New Node historical-contract failures require classification before deploy." >&2
            cat historical-new-failures.txt >&2
            exit 4
          fi
          cp /tmp/base-node-tests.log baseline-node-tests.log
          cp /tmp/current-node-tests.log current-node-tests.log
          git worktree remove /tmp/rota-certa-base-0468 --force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run focused canonical Android tests and build APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.PublicMirrorAttestation0411Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaReadbackForensics0421Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaAdminObservability0417Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaDeterministicTripOutbox0387Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaImmediateCardDelta0431Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaCollectorModules0264Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaAutomaticSync0397Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaHeaderNavigation0396Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaNavigationNotificationsProfiles0416Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaTimelineAutoSync0398Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaTimelineSurface0415Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaTouchUnfreeze0383Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalProjectionConvergence0408Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace --info
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Compare full Android historical suite with authoritative base
        shell: bash
        run: |
          set -euo pipefail
          cp app/google-services.json /tmp/google-services-0468.json
          rm -rf /tmp/rota-certa-android-base-0468
          git worktree add --detach /tmp/rota-certa-android-base-0468 c34dac6d54ba1bd1c1d233701669a1c80017844c
          cp /tmp/google-services-0468.json /tmp/rota-certa-android-base-0468/app/google-services.json
          (
            cd /tmp/rota-certa-android-base-0468
            chmod +x ./gradlew
            set +e
            ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=1 --no-parallel --stacktrace > /tmp/android-base-tests.log 2>&1
            BASE_ANDROID_STATUS=$?
            set -e
            printf '%s\n' "$BASE_ANDROID_STATUS" > /tmp/android-base-status
          )
          (
            set +e
            ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=1 --no-parallel --stacktrace > /tmp/android-current-tests.log 2>&1
            CURRENT_ANDROID_STATUS=$?
            set -e
            printf '%s\n' "$CURRENT_ANDROID_STATUS" > /tmp/android-current-status
          )
          sed -n -E 's/^[[:space:]]*(.+Test) > (.+) FAILED$/\1 > \2/p' /tmp/android-base-tests.log | sort -u > android-baseline-failures.txt
          sed -n -E 's/^[[:space:]]*(.+Test) > (.+) FAILED$/\1 > \2/p' /tmp/android-current-tests.log | sort -u > android-current-failures.txt
          comm -13 android-baseline-failures.txt android-current-failures.txt | tee android-new-failures.txt
          comm -23 android-baseline-failures.txt android-current-failures.txt | tee android-resolved-failures.txt
          printf 'base_status=%s\ncurrent_status=%s\nbase_failures=%s\ncurrent_failures=%s\n'             "$(cat /tmp/android-base-status)"             "$(cat /tmp/android-current-status)"             "$(wc -l < android-baseline-failures.txt)"             "$(wc -l < android-current-failures.txt)" | tee android-historical-counts.txt
          cp /tmp/android-base-tests.log android-baseline-tests.log
          cp /tmp/android-current-tests.log android-current-tests.log
          git worktree remove /tmp/rota-certa-android-base-0468 --force
          if [ -s android-new-failures.txt ]; then
            echo "New Android historical-contract failures require classification before deploy." >&2
            cat android-new-failures.txt >&2
            while IFS= read -r failure; do
              test -n "$failure" || continue
              grep -F -B 12 -A 30 "$failure" /tmp/android-current-tests.log || true
            done < android-new-failures.txt
            exit 4
          fi

      - name: Prove final artifact belongs to current SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat source_head.txt)"
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk.sha256
          grep -F 'versionCode = 5764' app/build.gradle.kts | tee app-version.txt
          grep -F 'versionName = "0.1.471"' app/build.gradle.kts | tee -a app-version.txt
          git status --short --untracked-files=no | tee tracked-status.txt
          test ! -s tracked-status.txt

      - name: Configure Firebase deployment authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-deploy-sa.json
            chmod 600 /tmp/firebase-deploy-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-deploy-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-deploy-sa.json
            chmod 600 /tmp/firebase-deploy-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-deploy-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase credential is missing." >&2
            exit 3
          fi

      - name: Deploy exact SHA canonical backend and public Admin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force
          fi

      - name: Live canonical backend smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://rota-certa-7ccc8.web.app
          curl --retry 10 --retry-delay 3 --fail --silent --show-error "$BASE/v1/health" | tee live-health.json
          grep -Fq '"ok":true' live-health.json
          curl --retry 10 --retry-delay 3 --fail --silent --show-error "$BASE/" > live-public.html
          grep -Fq 'Administração da Agenda' live-public.html
          grep -Fq 'adminTripBookings0468' live-public.html
          grep -Fq 'adminTripContext0470' live-public.html
          curl --retry 10 --retry-delay 3 --fail --silent --show-error "$BASE/app.js?v=0.1.471" > live-app.js
          grep -Fq 'Administrar esta viagem' live-app.js
          grep -Fq '/v1/admin/card-capabilities' live-app.js
          grep -Fq '/public-visibility' live-app.js
          grep -Fq 'agendaVisibilityToggle0471' live-app.js
          printf '%s\n' "${GITHUB_SHA}" > deployed-source-head.txt

      - name: Upload installable APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-agenda-public-online-toggle-0471-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            source_head.txt
            app-version.txt
            apk.sha256
            farol.sha256
            baseline-node-tests.log
            current-node-tests.log
            historical-new-failures.txt
            historical-resolved-failures.txt
            historical-counts.txt
            android-baseline-failures.txt
            android-current-failures.txt
            android-new-failures.txt
            android-resolved-failures.txt
            android-historical-counts.txt
            android-baseline-tests.log
            android-current-tests.log
            live-health.json
            live-public.html
            live-app.js
            deployed-source-head.txt
