name: Agenda 0.1.296 final green

on:
  push:
    branches:
      - agent/agenda-public-booking-0.1.296
    paths:
      - '.github/workflows/agenda-0296-final-green.yml'
      - '.github/scripts/agenda_0296_final_contract_repair.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agenda-0296-final-green-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-green-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/agenda-public-booking-0.1.296

      - name: Prove clean 0.1.295 source baseline and FAROL
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 5588' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.295"' app/build.gradle.kts
          grep -Fq 'object SeatAvailabilityEngine' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt
          grep -Fq 'priceToNextCents' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'require(seats in 1..999)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"

      - name: Repair materializer boundary only for generation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/agenda_0296_public_booking.py')
          text = p.read_text(encoding='utf-8')
          old = 'reserve_end = "function recomputeLoadsAfterBooking(loads, booking) {\\n"'
          new = 'reserve_end = "async function cancelReservation() {\\n"'
          if text.count(old) != 1:
              raise SystemExit(f'broken reserve boundary count={text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('agenda_0296_materializer_boundary=REPAIRED')
          PY

      - name: Materialize 0.1.296 and final contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/agenda_0296_public_booking.py
          python3 .github/scripts/agenda_0296_multi_profile_driver_ui.py
          python3 .github/scripts/agenda_0296_final_contract_repair.py
          git checkout -- .github/scripts/agenda_0296_public_booking.py
          git diff --check
          grep -Fq 'versionCode = 5589' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.296"' app/build.gradle.kts
          grep -Fq 'Text("Conta do motorista"' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'Text("Perfis vinculados"' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'BlaBlaDynamicAccountRegistry(context).list()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'publicBookingEnabled: Boolean = false' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt
          grep -Fq 'capacity > 999' trip-platform/functions/index.js
          ! grep -Fq 'capacity > 8' trip-platform/functions/index.js
          grep -Fq 'seats > 999' trip-platform/functions/index.js
          grep -Fq 'priceToNextCents' trip-platform/functions/index.js
          grep -Fq 'function fareFor' trip-platform/public/app.js
          grep -Fq 'seatsInput.max = String(Math.max(1, available))' trip-platform/public/app.js
          grep -Fq 'id="seats" type="number" min="1" step="1" value="1"' trip-platform/public/index.html
          grep -Fq 'tripDrivers' trip-platform/calendar-functions/index.js
          grep -Fq 'driverUsername' trip-platform/calendar-functions/index.js
          grep -Fq 'agendaTokenHash' trip-platform/calendar-functions/index.js
          grep -Fq 'async function cancelReservation()' trip-platform/public/app.js

      - name: Protect exact implementation scope and FAROL
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/changed.txt
          printf '%s\n' \
            'app/build.gradle.kts' \
            'app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicBookingSync0296.kt' \
            'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt' \
            'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripRemoteApi.kt' \
            'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt' \
            'app/src/test/java/br/com/mapeiaia/rotacerta/trips/PublicBooking0296Test.kt' \
            'trip-platform/calendar-functions/index.js' \
            'trip-platform/functions/index.js' \
            'trip-platform/functions/test/public-booking-0296.test.js' \
            'trip-platform/public/app.js' \
            'trip-platform/public/index.html' | sort > /tmp/expected.txt
          echo '--- changed'; cat /tmp/changed.txt
          echo '--- expected'; cat /tmp/expected.txt
          cmp /tmp/expected.txt /tmp/changed.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prove backend web calendar and booking contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/calendar-functions/index.js
          node --check trip-platform/public/app.js
          node --test trip-platform/functions/test/*.test.js | tee /tmp/backend-tests.txt
          grep -Fq 'allow read, write: if false' trip-platform/firestore.rules
          grep -Fq '"/v1/**"' trip-platform/firebase.json
          grep -Fq '"/calendar/**"' trip-platform/firebase.json
          grep -Fq 'southamerica-east1' trip-platform/firebase.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Full Android unit tests lint and APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace | tee /tmp/gradle.txt
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk.sha256
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"

      - name: Commit exactly the tested 0.1.296 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicBookingSync0296.kt \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripRemoteApi.kt \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt \
                  app/src/test/java/br/com/mapeiaia/rotacerta/trips/PublicBooking0296Test.kt \
                  trip-platform/calendar-functions/index.js \
                  trip-platform/functions/index.js \
                  trip-platform/functions/test/public-booking-0296.test.js \
                  trip-platform/public/app.js \
                  trip-platform/public/index.html
          git commit -m 'feat(agenda): finalize public booking contracts 0.1.296'
          git push origin HEAD:agent/agenda-public-booking-0.1.296
          git rev-parse HEAD | tee /tmp/source-head.txt

      - name: Prepare installable evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agenda-0296
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/agenda-0296/rota-certa-0.1.296-debug.apk
          cp /tmp/apk.sha256 /tmp/agenda-0296/apk.sha256
          cp /tmp/source-head.txt /tmp/agenda-0296/source-head.txt
          cp /tmp/backend-tests.txt /tmp/agenda-0296/backend-tests.txt
          cp /tmp/gradle.txt /tmp/agenda-0296/gradle-validation.txt
          tar -czf /tmp/agenda-0296/rota-certa-public-booking-platform-0.1.296.tar.gz trip-platform
          printf '%s\n' \
            'versionName=0.1.296' \
            'versionCode=5589' \
            'onePhysicalDriver=true' \
            'linkedProfilesDynamic=true' \
            'driverPrivateKeySharedAcrossProfiles=true' \
            'publicAgendaTokenSharedAcrossProfiles=true' \
            'publicCalendarScopedByDriverAndToken=true' \
            'profileIdentityIndependent=true' \
            'profilePositionIndependent=true' \
            'profileTripsIndependent=true' \
            'publicBookingOptIn=true' \
            'backendSegmentTransaction=true' \
            'backendIdempotency=true' \
            'dynamicVehicleCapacityUpTo999=true' \
            'dynamicPublicBookingSeats=true' \
            'segmentFarePersisted=true' \
            'segmentFareShownToPassenger=true' \
            'brazilWhatsappRequired=true' \
            'automaticRemoteBookingPull=true' \
            'existingSeatSyncEngineReused=true' \
            'selfCancellationReturnsCapacity=true' \
            'firestoreDirectAccessDenied=true' \
            'firebaseProductionDeployNotPerformed=true' \
            'physicalTestPending=true' \
            'farolUntouched=true' > /tmp/agenda-0296/public-booking-contract.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-agenda-0.1.296-final-green-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/agenda-0296
