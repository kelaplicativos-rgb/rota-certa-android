name: Agenda public published trips live

on:
  push:
    branches:
      - agent/agenda-public-published-by-default-0.1.300
    paths:
      - '.github/workflows/agenda-public-published-live.yml'
      - 'trip-platform/functions/index.js'
      - 'trip-platform/functions/test/public-booking-0296.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agenda-public-published-by-default-0.1.300

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test public booking backend
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --test trip-platform/functions/test/*.test.js

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
          else
            echo "Firebase service account secret is missing."
            exit 3
          fi
          chmod 600 /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Install Functions dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix trip-platform/functions install --no-audit --no-fund

      - name: Deploy trip API
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api --non-interactive --force

      - name: Smoke production health
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 8 --retry-delay 5 --fail --silent --show-error https://rota-certa-7ccc8.web.app/v1/health | tee /tmp/health.json
          grep -Fq '"ok":true' /tmp/health.json
          curl --retry 8 --retry-delay 5 --fail --silent --show-error 'https://rota-certa-7ccc8.web.app/v1/public/drivers/viagem-certa/WlaYvVil5AlaNHbEthN-oBbb5JSIIQgJ/agenda' > /tmp/agenda.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/agenda.json'))
          print('public_agenda_driver=', data.get('driver',{}).get('username'))
          print('public_agenda_trip_count=', len(data.get('trips',[])))
          for trip in data.get('trips',[])[:5]:
              print('trip=', trip.get('departureAtMillis'), trip.get('title'), trip.get('status'))
          PY
