name: Agenda performance and reconcile 0.1.380

on:
  pull_request:
    branches:
      - agent/blablacar-auditable-export-0.1.379
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-performance-0380-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/agenda-performance-0.1.380'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_MAPS_API_KEY: auditable_collection_ci_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout triggering direct source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record exact source and protected FAROL
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref || github.ref_name }}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s\n' "$SOURCE_SHA" | tee source_head.txt
          printf '%s\n' "$SOURCE_BRANCH" | tee source_branch.txt
          echo "ROTA_CERTA_GIT_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_BRANCH=$SOURCE_BRANCH" >> "$GITHUB_ENV"
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          test -s "$FAROL"
          sha256sum "$FAROL" | tee farol-before.sha256
          grep -Fq 'versionCode = 5673' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.380"' app/build.gradle.kts

      - name: Prove feature source boundaries
        shell: bash
        run: |
          set -euo pipefail
          FEATURE_FILES=(
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearch.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchActivity.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchUi.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaAuditableCollection.kt
          )
          grep -Fq 'BlaBlaBrowserRequest.PUBLIC_SEARCH_RESULTS' "${FEATURE_FILES[1]}"
          grep -Fq 'BlaBlaBrowserRequest.PUBLIC_SEARCH_SCROLL' "${FEATURE_FILES[1]}"
          ! grep -Fq 'executeRemoteWrite(' "${FEATURE_FILES[1]}"
          grep -Fq 'operationalSeatSummary' "${FEATURE_FILES[3]}"
          grep -Fq 'SeatAvailabilityEngine.segmentLoads' "${FEATURE_FILES[3]}"
          grep -Fq 'FileProvider.getUriForFile' "${FEATURE_FILES[3]}"
          grep -Fq 'Intent.FLAG_GRANT_READ_URI_PERMISSION' "${FEATURE_FILES[3]}"
          grep -Fq 'application/json' "${FEATURE_FILES[3]}"
          grep -Fq 'BlaBlaAuditableCollectionActions' "${FEATURE_FILES[2]}"
          if grep -Eiq 'Ezequiel|Barbosa|Santo André|São Thomé das Letras|"BRL"' "${FEATURE_FILES[@]}"; then
            echo "Personal scenario hardcode detected" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Run Agenda performance, reconcile and retained export tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaPerformance0380Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PublicAgendaSyncRegression0373Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PublicBooking0296Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaForensicBlackBox0345Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaAuditableCollection0379Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaPublicSearchTest' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace
          test -s app/build/auditable-collection-sample.json
          python3 -m json.tool app/build/auditable-collection-sample.json >/dev/null

      - name: Lint changed application
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:lintDebug --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Assemble installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify source, FAROL and output identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat source_head.txt)"
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          sha256sum "$FAROL" | tee farol-after.sha256
          cmp -s farol-before.sha256 farol-after.sha256
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk.sha256
          grep -E 'version(Code|Name) = ' app/build.gradle.kts | tee app-version.txt
          if git status --porcelain --untracked-files=no | grep -q .; then
            echo "Tracked source changed during validation" >&2
            git status --short
            exit 1
          fi

      - name: Upload APK and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.380-agenda-performance-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/auditable-collection-sample.json
            source_head.txt
            source_branch.txt
            app-version.txt
            farol-before.sha256
            farol-after.sha256
            apk.sha256
