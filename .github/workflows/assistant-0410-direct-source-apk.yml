name: Rota Certa Assistant 0.1.410 direct-source APK

on:
  push:
    branches:
      - agent/blablacar-assistant-command-registry-0.1.410
    paths:
      - 'app/**'
      - 'trip-platform/functions/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/assistant-0410-direct-source-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-0410-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOOGLE_MAPS_API_KEY: assistant_ci_dummy_key
      BASE_AUTHORITY_SHA: 09bb5779404f0e789af2d6d76f85e84a932e9a64
      EXPECTED_VERSION_CODE: '5703'
      EXPECTED_VERSION_NAME: '0.1.410'

    steps:
      - name: Checkout exact triggering HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove source authority and FAROL isolation
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_HEAD="$(git rev-parse HEAD)"
          test "$SOURCE_HEAD" = "$GITHUB_SHA"
          test -s app/src/main/java/br/com/mapeiaia/rotacerta/trips/RotaCertaCommand0410.kt
          test -s app/src/main/java/br/com/mapeiaia/rotacerta/trips/RotaCertaAssistantUi0410.kt
          test -s trip-platform/functions/assistant-command-interpreter-0410.js
          grep -Fq 'versionCode = 5703' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.410"' app/build.gradle.kts
          git diff --exit-code "$BASE_AUTHORITY_SHA" -- app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          printf '%s
' "$SOURCE_HEAD" | tee source_head.txt
          printf '%s
' 'farol_untouched=true' | tee farol-evidence.txt
          printf '%s
' 'base_authority_sha='"$BASE_AUTHORITY_SHA" >> farol-evidence.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate backend interpreter
        working-directory: trip-platform/functions
        run: |
          set -euo pipefail
          node --check index.js
          node --check assistant-command-interpreter-0410.js
          node --test test/assistant-command-interpreter-0410.test.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Run focused assistant and canonical tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest             --tests 'br.com.mapeiaia.rotacerta.trips.RotaCertaCommand0410Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaTripControl0407Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalProjectionConvergence0408Test'             --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Assemble exact-head debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code "$BASE_AUTHORITY_SHA" -- app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Inspect APK identity and SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          APK='app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          "$AAPT" dump badging "$APK" > evidence/aapt-badging.txt
          PACKAGE_LINE="$(grep '^package:' evidence/aapt-badging.txt | head -n1)"
          echo "$PACKAGE_LINE"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"
          sha256sum "$APK" | tee evidence/apk-sha256.txt
          grep -E 'version(Code|Name) = ' app/build.gradle.kts | tee evidence/app-version.txt
          cp source_head.txt evidence/source_head.txt
          cp farol-evidence.txt evidence/farol-evidence.txt

      - name: Upload exact-head APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-assistant-0.1.410-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            evidence/aapt-badging.txt
            evidence/apk-sha256.txt
            evidence/app-version.txt
            evidence/source_head.txt
            evidence/farol-evidence.txt
