name: One-time PR source apply 0.1.255

on:
  pull_request:
    branches:
      - agent/global-multitenant-foundation
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/passenger-timeline-geo-ux'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live feature HEAD directly
        uses: actions/checkout@v4
        with:
          ref: agent/passenger-timeline-geo-ux
          fetch-depth: 0

      - name: Apply persisted app/src corrections
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "agent/passenger-timeline-geo-ux"
          echo "2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560  app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/_one_time_apply_0255.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          rm .github/workflows/_one_time_apply_0255.yml"
          if start_marker not in source or end_marker not in source:
              raise SystemExit('embedded persisted-source patch markers not found')
          script = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(script), '<apply-0255>', 'exec'))
          PY
          # The Actions token has contents:write but not workflow-update permission.
          # Persist app/src/tests/version here; the normal direct-source workflow file
          # is updated separately through the GitHub connector after this commit.
          git checkout -- .github/workflows/passenger-timeline-geo-ux-direct.yml
          rm .github/workflows/_one_time_apply_0255.yml
          rm .github/workflows/_pr_apply_0255.yml
          echo "2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560  app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt" | sha256sum -c -
          git diff --check

      - name: Commit final persisted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rota-certa-source-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "Complete passenger timeline operational UX 0.1.255"
          git push origin HEAD:agent/passenger-timeline-geo-ux
