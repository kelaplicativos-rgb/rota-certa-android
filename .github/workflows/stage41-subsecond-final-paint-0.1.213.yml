name: Validate Stage41 subsecond final paint 0.1.213
on:
  pull_request:
    branches: [agent/stage40-precollect-bootstrap-bounded]
    paths:
      - '.github/workflows/stage41-subsecond-final-paint-0.1.213.yml'
      - 'scripts/apply_stage41_subsecond_final_paint.py'
      - 'scripts/apply_stage41_version.py'
      - 'stage41/FarolStage41SubsecondFinalPaintTest.kt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate-stage41-subsecond-final-paint:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_API_KEY: '${{ secrets.GOOGLE_MAPS_API_KEY }}'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          path: source
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          path: patches
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore exact Stage32 materialized runtime
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          mkdir -p bootstrap evidence
          gh run download 31703841694 --repo kelaplicativos-rgb/rota-certa-android --name rota-certa-stage34-bootstrap-materialized-stage32-source --dir bootstrap
          TGZ=$(find bootstrap -name stage32-materialized-source.tgz -print -quit)
          test -f "$TGZ"
          test "$(sha256sum "$TGZ" | awk '{print $1}')" = aa251a173e425b075f5f0508d6f042b4881949ed76e3f638f10ccab63417c5e3
          rm -rf source/app/src/main/java source/app/src/test/java
          tar -xzf "$TGZ" -C source
          grep -q 'versionCode = 5491' source/app/build.gradle.kts
          grep -q 'versionName = "0.1.207"' source/app/build.gradle.kts

      - name: Materialize Stage34 Stage36 Stage38
        run: |
          set -euo pipefail
          python patches/scripts/apply_stage34_semantic.py source
          python patches/scripts/apply_stage34_precollect.py source
          python patches/scripts/apply_stage34_binding.py source
          python patches/scripts/apply_stage34_test_semantic_contract.py source
          python patches/scripts/apply_stage34_test_candidate_contract.py source
          python patches/scripts/apply_stage34_test_frame_contract.py source
          cp patches/stage34/FarolStage34Test.kt source/app/src/test/java/br/com/mapeiaia/rotacerta/FarolStage34Test.kt
          python patches/scripts/apply_stage34_test_root_fix.py source
          python patches/scripts/apply_stage36_prepare.py source
          python patches/scripts/apply_stage36_farol_core.py source
          python patches/scripts/apply_stage36_report_compile_fix.py source
          cp patches/stage36/FarolStage36Test.kt source/app/src/test/java/br/com/mapeiaia/rotacerta/FarolStage36Test.kt
          cp patches/stage36/FarolStage36FreshnessTest.kt source/app/src/test/java/br/com/mapeiaia/rotacerta/FarolStage36FreshnessTest.kt
          cp patches/stage36/FarolStage36RuntimeTest.kt source/app/src/test/java/br/com/mapeiaia/rotacerta/FarolStage36RuntimeTest.kt
          python patches/scripts/apply_stage36_test_runtime_fix.py source
          python patches/scripts/apply_stage38_parser.py source
          python patches/scripts/apply_stage38_evaluation.py source
          python patches/scripts/apply_stage38_acquisition.py source
          python patches/scripts/apply_stage38_ocr_request.py source
          python patches/scripts/apply_stage38_ocr_result.py source
          python patches/scripts/apply_stage38_downstream.py source
          python patches/scripts/apply_stage38_report.py source
          cp patches/stage38/FarolStage38Test.kt source/app/src/test/java/br/com/mapeiaia/rotacerta/FarolStage38Test.kt
          grep -q 'versionCode = 5494' source/app/build.gradle.kts
          grep -q 'versionName = "0.1.210"' source/app/build.gradle.kts

      - name: Materialize exact Stage40 physical 0.1.212
        run: |
          set -euo pipefail
          python patches/scripts/apply_stage40_presence.py source
          python patches/scripts/apply_stage40_visual.py source
          cp patches/stage40/FarolStage40AuthorityRedContractTest.kt source/app/src/test/java/br/com/mapeiaia/rotacerta/FarolStage40AuthorityRedContractTest.kt
          python patches/scripts/apply_stage40_version.py source
          python patches/scripts/apply_stage40_precollect_bounded.py source
          cp patches/stage40/FarolStage40PreCollectBootstrapTest.kt source/app/src/test/java/br/com/mapeiaia/rotacerta/FarolStage40PreCollectBootstrapTest.kt
          python patches/scripts/apply_stage40_precollect_physical_version.py source
          grep -q 'versionCode = 5496' source/app/build.gradle.kts
          grep -q 'versionName = "0.1.212"' source/app/build.gradle.kts

      - name: Materialize Stage41 subsecond final paint 0.1.213
        run: |
          set -euo pipefail
          python patches/scripts/apply_stage41_subsecond_final_paint.py source | tee evidence/materialize-stage41.txt
          cp patches/stage41/FarolStage41SubsecondFinalPaintTest.kt source/app/src/test/java/br/com/mapeiaia/rotacerta/FarolStage41SubsecondFinalPaintTest.kt
          python patches/scripts/apply_stage41_version.py source | tee evidence/materialize-version.txt
          grep -q 'versionCode = 5497' source/app/build.gradle.kts
          grep -q 'versionName = "0.1.213"' source/app/build.gradle.kts
          test "$(grep -c '@Test' patches/stage41/FarolStage41SubsecondFinalPaintTest.kt)" -eq 10

      - name: Static Stage41 causal audit
        run: |
          set -euo pipefail
          python - <<'PY' | tee evidence/static-stage41.txt
          from pathlib import Path
          p=Path('source/app/src/main/java/br/com/mapeiaia/rotacerta')
          helper=(p/'FarolFinalPaintFreshnessStage41.kt').read_text()
          pipeline=(p/'FarolUniversalVisualPipelineStage19.kt').read_text()
          service=(p/'LiveRideAccessibilityService.kt').read_text()
          assert 'FAROL_SUBSECOND_SAME_FRAME_FINAL_PAINT_STAGE41' in helper
          assert 'HARD_END_TO_END_BUDGET_NS = 1_000_000_000L' in helper
          assert 'bindingScreenHash == currentScreenHash' in helper
          assert 'FarolFinalPaintFreshnessStage41.bindingMayPaint(' in pipeline
          assert 'return !visualVerificationPending && binding.addressSignature == currentAddressSignature' not in pipeline
          assert 'drivingDistancesFromAddressKm(' in service
          assert 'FarolVisualStateAuthorityStage40.decide(' in service
          forbidden=('Thread.sleep(', 'SystemClock.sleep(', 'Timer(', 'scheduleAtFixedRate(', 'fixedRateTimer(', 'delay(')
          assert not any(x in helper for x in forbidden)
          print('stage41_static_causal_audit=PASS')
          PY

      - name: Verify exact 986 tests
        run: |
          set -euo pipefail
          python - <<'PY' | tee evidence/test-inventory.txt
          from pathlib import Path
          n=sum(p.read_text(encoding='utf-8').count('@Test') for p in Path('source/app/src/test/java').rglob('*.kt'))
          print('total_at_test='+str(n))
          assert n==986,n
          PY

      - name: Stage41 regression 10
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests br.com.mapeiaia.rotacerta.FarolStage41SubsecondFinalPaintTest | tee ../evidence/stage41-tests.log
          python - <<'PY' | tee ../evidence/stage41-count.txt
          import xml.etree.ElementTree as E
          r=E.parse('app/build/test-results/testDebugUnitTest/TEST-br.com.mapeiaia.rotacerta.FarolStage41SubsecondFinalPaintTest.xml').getroot()
          v={k:int(r.attrib.get(k,0)) for k in ('tests','failures','errors','skipped')}
          print(v)
          assert v=={'tests':10,'failures':0,'errors':0,'skipped':0},v
          PY

      - name: Freshness and authority regression
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest \
            --tests br.com.mapeiaia.rotacerta.FarolStage40PreCollectBootstrapTest \
            --tests br.com.mapeiaia.rotacerta.FarolStage40AuthorityRedContractTest \
            --tests br.com.mapeiaia.rotacerta.FarolStage38Test \
            --tests br.com.mapeiaia.rotacerta.FarolStage36FreshnessTest \
            --tests br.com.mapeiaia.rotacerta.FarolStage34Test \
            --tests br.com.mapeiaia.rotacerta.FarolStage32Test \
            --tests br.com.mapeiaia.rotacerta.FarolCausalCorrectionStage21Test \
            --tests br.com.mapeiaia.rotacerta.FarolUniversalVisualPipelineStage19Test | tee ../evidence/freshness-regression.log

      - name: Complete suite exact 986
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --rerun-tasks testDebugUnitTest | tee ../evidence/full-tests.log
          python - <<'PY' | tee ../evidence/full-count.txt
          from pathlib import Path
          import xml.etree.ElementTree as E
          t=f=e=s=0
          for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              r=E.parse(p).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          print(t,f,e,s)
          assert (t,f,e,s)==(986,0,0,0),(t,f,e,s)
          PY

      - name: Lint and assemble physical APK
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon lintDebug | tee ../evidence/lint.log
          ./gradlew --no-daemon clean assembleDebug | tee ../evidence/assemble.log

      - name: Validate Stage41 physical APK
        run: |
          set -euo pipefail
          A=source/app/build/outputs/apk/debug/app-debug.apk
          O=evidence/Rota-Certa-Stage41-Subsecond-0.1.213.apk
          test -f "$A"
          cp "$A" "$O"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          SIGN=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$AAPT" dump badging "$O" | tee evidence/badging.txt
          grep -q "package: name='br.com.mapeiaia.rotacerta' versionCode='5497' versionName='0.1.213'" evidence/badging.txt
          "$SIGN" verify --verbose --print-certs "$O" | tee evidence/signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' evidence/signature.txt
          unzip -t "$O" | tee evidence/zip.txt
          mkdir -p evidence/dex
          unzip -Z1 "$O" | grep -E '^classes([0-9]+)?\.dex$' | tee evidence/dex-inventory.txt
          while IFS= read -r dex; do unzip -p "$O" "$dex" > "evidence/dex/$dex"; done < evidence/dex-inventory.txt
          cat evidence/dex/classes*.dex > evidence/all-classes.dex
          for m in FAROL_SUBSECOND_SAME_FRAME_FINAL_PAINT_STAGE41 PENDING_SAME_HASH_SAME_DESTINATION_CAN_PAINT_STAGE41 PENDING_CHANGED_FRAME_FAILS_CLOSED_STAGE41 FAROL_FINAL_VISUAL_STATE_AUTHORITY_STAGE40 FAROL_MAXIMUM_FORENSICS_STAGE38 FAROL_SINGLE_RUNTIME_AUTHORITY_STAGE36 FAROL_SINGLE_CARD_LEASE_STAGE34 FAROL_FORENSIC_CAUSALITY_STAGE20; do
            grep -a -q "$m" evidence/all-classes.dex
          done
          sha256sum "$O" | tee evidence/apk-sha256.txt
          sha512sum "$O" | tee evidence/apk-sha512.txt
          stat -c 'apk_bytes=%s' "$O" | tee evidence/apk-size.txt
          printf 'versionName=0.1.213\nversionCode=5497\npackage=br.com.mapeiaia.rotacerta\nhead=%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' | tee evidence/build-identity.txt
          echo 'stage41_subsecond_apk_validation=PASS' | tee evidence/apk-validation.txt

      - name: Upload Stage41 physical artifact
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.213-stage41-subsecond-final-paint
          path: evidence/
          if-no-files-found: error
          retention-days: 30
