          helpers = '''internal enum class PassengerAddressKind { BOARDING, DROPOFF }

internal fun passengerAddressEditorInitialValue(
    row: EnhancedPassengerCardRow,
    kind: PassengerAddressKind,
): String = when (kind) {
    PassengerAddressKind.BOARDING -> row.boardingAddress.trim().ifBlank { row.boarding.orEmpty().trim() }
    PassengerAddressKind.DROPOFF -> row.dropoffAddress.trim().ifBlank { row.dropoff.orEmpty().trim() }
}

@Composable
private fun PassengerAddressEditorDialog(
    row: EnhancedPassengerCardRow,
    kind: PassengerAddressKind,
    onDismiss: () -> Unit,
    onSave: (String) -> Unit,
) {
    var value by remember(row.localBookingId, row.externalReservationKey, kind) {
        mutableStateOf(passengerAddressEditorInitialValue(row, kind))
    }
    val label = if (kind == PassengerAddressKind.BOARDING) {
        "Endereço completo de embarque"
    } else {
        "Endereço completo de destino"
    }
    AlertDialog(
        onDismissRequest = onDismiss,
        title = { Text(label) },
        text = {
            Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                Text(
                    "${row.name} • ${passengerTimelineCompactPlace(row.boarding)} → ${passengerTimelineCompactPlace(row.dropoff)}",
                    maxLines = 2,
                    overflow = TextOverflow.Ellipsis,
                )
                OutlinedTextField(
                    value = value,
                    onValueChange = { value = it.take(240) },
                    label = { Text(label) },
                    supportingText = { Text("Informe rua/avenida, número, complemento e demais detalhes úteis do ponto.") },
                    singleLine = false,
                    modifier = Modifier.fillMaxWidth(),
                )
            }
        },
        confirmButton = {
            TextButton(
                enabled = value.trim().length >= 4,
                onClick = { onSave(value.trim()) },
            ) { Text("Salvar") }
        },
        dismissButton = { TextButton(onClick = onDismiss) { Text("Cancelar") } },
    )
}

private fun savePassengerAddress(
    row: EnhancedPassengerCardRow,
    kind: PassengerAddressKind,
    rawAddress: String,
    store: TripStore,
    passengerStore: PassengerIdentityStore,
): Boolean {
    val address = rawAddress.trim().takeIf { it.length >= 4 } ?: return false
    row.externalReservationKey?.let { key ->
        val current = passengerStore.externalMetadata(key) ?: ExternalPassengerMetadata(reservationKey = key)
        passengerStore.saveExternalMetadata(
            when (kind) {
                PassengerAddressKind.BOARDING -> current.copy(boardingAddress = address)
                PassengerAddressKind.DROPOFF -> current.copy(dropoffAddress = address)
            },
        )
        return true
    }
    row.localBookingId?.let { bookingId ->
        val booking = store.bookings().firstOrNull { it.id == bookingId } ?: return@let
        store.saveBooking(
            when (kind) {
                PassengerAddressKind.BOARDING -> booking.copy(boardingAddress = address, localMetadataTouched = true)
                PassengerAddressKind.DROPOFF -> booking.copy(dropoffAddress = address, localMetadataTouched = true)
            },
        )
        return true
    }
    return false
}

