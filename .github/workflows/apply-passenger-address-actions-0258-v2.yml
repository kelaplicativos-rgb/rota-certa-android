import kotlin.test.Test
import kotlin.test.assertEquals
import kotlin.test.assertNull
import kotlin.test.assertTrue

class PassengerAddressActions0258Test {
    private val uuid = "7371F028-9C55-4903-8444-308015823EFD"

    @Test
    fun queryStyleOfferHrefIsAcceptedAsExactTripTarget() {
        val href = "https://www.blablacar.com.br/rides/offer?id=ride-123"
        val target = externalTripTarget(uuid, href)!!
        assertEquals("7371f028-9c55-4903-8444-308015823efd", target.profileUuid)
        assertEquals(href, target.href)
    }

    @Test
    fun queryStyleTripHrefIsAcceptedButGenericPageIsRejected() {
        assertEquals(
            "https://www.blablacar.com.br/trip?id=ride-456",
            externalTripTarget(uuid, "https://www.blablacar.com.br/trip?id=ride-456")?.href,
        )
        assertNull(externalTripTarget(uuid, "https://www.blablacar.com.br/rides/offer"))
        assertNull(externalTripTarget(uuid, "https://www.blablacar.com.br/rides/offer/passenger/abc"))
    }

    @Test
    fun addressEditorPrefersSavedFullAddressThenFallsBackToCollectedCity() {
        val base = row().copy(boarding = "Santo André", dropoff = "Pouso Alegre")
        assertEquals("Santo André", passengerAddressEditorInitialValue(base, PassengerAddressKind.BOARDING))
        assertEquals("Pouso Alegre", passengerAddressEditorInitialValue(base, PassengerAddressKind.DROPOFF))
        val saved = base.copy(
            boardingAddress = "Rua A, 123, Centro",
            dropoffAddress = "Av. B, 456, Bairro",
        )
        assertEquals("Rua A, 123, Centro", passengerAddressEditorInitialValue(saved, PassengerAddressKind.BOARDING))
        assertEquals("Av. B, 456, Bairro", passengerAddressEditorInitialValue(saved, PassengerAddressKind.DROPOFF))
    }

    @Test
    fun pickupMapUsesManualFullAddressOncePresent() {
        val target = passengerPickupMapTarget(
            row().copy(
                boarding = "Santo André",
                boardingAddress = "Rua A, 123, Centro, Santo André",
            ),
        )
        assertEquals("Rua A, 123, Centro, Santo André", target?.query)
    }

    @Test
    fun tripActionEvidenceKeepsIconVisibleWhenHrefNeedsResync() {
        val entry = TripTimelineEntry(
            tripId = "external-test",
            profileId = uuid.lowercase(),
            profileLabel = "Conta",
            departureAtMillis = 1L,
            arrivalAtMillis = null,
            origin = "Origem",
            destination = "Destino",
            status = TripStatus.PUBLISHED,
            capacity = 4,
            blablaTripId = "ride-123",
            blablaProfileUuid = uuid.lowercase(),
        )
        assertTrue(hasExternalTripActionEvidence(entry))
    }

    private fun row() = EnhancedPassengerCardRow(
        name = "Passageiro",
        phone = null,
        seats = 1,
        boarding = null,
        dropoff = null,
        sources = setOf(BookingSource.BLABLACAR),
        bookingStatus = BookingStatus.CONFIRMED,
    )
}
''')

