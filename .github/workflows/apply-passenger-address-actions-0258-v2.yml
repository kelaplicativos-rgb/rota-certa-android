          target_code = '''internal fun externalTripTarget(profileUuid: String?, href: String?): ExternalTripTarget? {
    val profile = profileUuid?.trim()?.lowercase()?.takeIf(String::isNotEmpty) ?: return null
    if (!CANONICAL_PROFILE_UUID.matches(profile)) return null
    val targetHref = href?.trim()?.substringBefore("&search_uuid=")?.takeIf(String::isNotEmpty) ?: return null
    if (!targetHref.startsWith("https://www.blablacar.com.br/")) return null
    val externalTripId = BlaBlaTripIdentity.externalTripIdFromHref(targetHref) ?: return null
    if (externalTripId.isBlank()) return null
    val path = runCatching { java.net.URI(targetHref).path.orEmpty() }.getOrDefault("")
    if (!path.startsWith("/rides/offer") && !path.startsWith("/trip")) return null
    if (path.startsWith("/rides/offer/passenger/")) return null
    return ExternalTripTarget(profileUuid = profile, href = targetHref)
}

internal fun hasExternalTripActionEvidence(entry: TripTimelineEntry): Boolean =
    !entry.blablaProfileUuid.isNullOrBlank() &&
        (!entry.blablaTripId.isNullOrBlank() || !entry.blablaTripHref.isNullOrBlank() || entry.blablaPassengers.isNotEmpty())
'''
