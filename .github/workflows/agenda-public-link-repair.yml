name: Agenda public link repair

on:
  push:
    branches:
      - agent/agenda-firebase-live-wiring
    paths:
      - '.github/workflows/agenda-public-link-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/353336964879/locations/global/workloadIdentityPools/rota-certa-github/providers/github-actions'
          service_account: 'rota-certa-github-deploy@rota-certa-7ccc8.iam.gserviceaccount.com'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Repair public agenda token hash
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_AGENDA_HASH='d0ad1f3f2bb2f64ee7ffc5d9aa19b538226e7d0ae42a13ba106871afd71798f0'
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          cat > /tmp/patch.json <<JSON
          {
            "fields": {
              "agendaTokenHash": { "stringValue": "$EXPECTED_AGENDA_HASH" }
            }
          }
          JSON
          HTTP_CODE="$(curl -sS -o /tmp/patch-response.json -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-user-project: rota-certa-7ccc8" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/patch.json \
            "https://firestore.googleapis.com/v1/projects/rota-certa-7ccc8/databases/(default)/documents/tripDrivers/viagem-certa?updateMask.fieldPaths=agendaTokenHash")"
          echo "patch_http=$HTTP_CODE"
          test "$HTTP_CODE" = "200"

          curl -sS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-user-project: rota-certa-7ccc8" \
            "https://firestore.googleapis.com/v1/projects/rota-certa-7ccc8/databases/(default)/documents/tripDrivers/viagem-certa" > /tmp/driver.json

          python3 - <<'PY'
          import json
          expected = 'd0ad1f3f2bb2f64ee7ffc5d9aa19b538226e7d0ae42a13ba106871afd71798f0'
          with open('/tmp/driver.json', encoding='utf-8') as f:
              data = json.load(f)
          stored = data.get('fields', {}).get('agendaTokenHash', {}).get('stringValue', '')
          print('driver_document=FOUND')
          print('agenda_token_repaired=' + str(stored == expected).lower())
          if stored != expected:
              raise SystemExit(2)
          PY
