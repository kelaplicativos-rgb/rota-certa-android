name: Verify Script pending queue 0.1.561

on:
  push:
    branches:
      - agent/script-pending-queue-0.1.561
  workflow_dispatch:

concurrency:
  group: script-pending-queue-01561-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test Executor state machine and canonical regressions
        run: |
          ./gradlew testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaTripScriptExecutor0558Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaScriptEditorPolicy0561Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaScriptPendingPolicy0561Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalTripState0395Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TimelineLocalPrimary0525Test'

      - name: Verify no permanent active-slot deadlock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          activity = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaTripScriptExecutorActivity0558.kt').read_text()
          queue = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaScriptPendingQueue0561.kt').read_text()
          fresh = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaScriptFreshPendingResolver0561.kt').read_text()
          assert 'migrateCancelledActiveIfSafe' in activity
          assert 'releaseCancelledActive' in activity
          assert 'startFreshPendingReconciliation' in activity
          assert 'admin_update_now:script_executor_reconcile_0561' in activity
          assert 'pending_reconciliation_0561' in queue
          assert '.remove(storage.activeKey)' in queue
          assert 'containsScriptHash' in activity and 'containsAnyFingerprint' in activity
          assert 'completeCollectorProfileUuids0408' in fresh
          assert 'FAILED_RETRYABLE' in fresh
          assert 'fresh_external_not_found_generation_' in fresh
          assert 'PUBLISHED_AMBIGUOUS' in fresh
          assert 'republish=false' in activity
          assert 'input.setText(AgendaScriptEditorPolicy0561.initialEditorText(active))' in activity
          PY

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-script-pending-queue-0.1.561-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
