name: Validate Error1 card visual episode reentry 0.1.228
on:
  pull_request:
    branches: [agent/stage46-visual-epoch-no-result-ocr-decontamination-0.1.219]
    paths:
      - '.github/workflows/error1-card-visual-episode-reentry-0.1.228.yml'
      - 'scripts/apply_error1_card_visual_episode_reentry.py'
      - 'scripts/apply_error1_version.py'
      - 'scripts/run_error1_card_visual_episode_reentry_ci.sh'
      - 'error1/FarolCardVisualEpisodeReentryError1Test.kt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate-error1-card-reentry:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GOOGLE_MAPS_API_KEY: '${{ secrets.GOOGLE_MAPS_API_KEY }}'
      GH_TOKEN: '${{ github.token }}'
    steps:
      - name: Checkout protected canonical source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          path: source
          fetch-depth: 1
      - name: Checkout Error1 correction branch
        uses: actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          path: patches
          fetch-depth: 1
      - name: Checkout pinned Stage18 recipe
        uses: actions/checkout@v4
        with:
          ref: aa4bd10847d41a3abd5d8a9cb186d6cfa8acc88c
          path: historical19
          fetch-depth: 1
      - name: Checkout pinned Stage32 recipe
        uses: actions/checkout@v4
        with:
          ref: a4443bb6c287fcf31a56f2a3c4ba8fc211fe1f79
          path: historical34
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Reproduce exact R8 then apply only Error1 correction
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          export PS4='+ERROR1_TRACE ${BASH_SOURCE}:${LINENO}: '
          set +e
          bash -x patches/scripts/run_error1_card_visual_episode_reentry_ci.sh source patches historical19 historical34 evidence 2> >(tee evidence/error1-shell-trace.log >&2)
          rc=$?
          set -e
          printf 'error1_orchestrator_exit=%s\n' "$rc" | tee evidence/error1-orchestrator-exit.txt
          exit "$rc"
      - name: Upload Error1 installable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.228-error1-card-visual-episode-reentry
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
