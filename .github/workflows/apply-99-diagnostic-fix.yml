name: Apply 99 Diagnostic Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-99-diagnostic-fix.yml'

permissions:
  contents: write
  actions: read

jobs:
  apply:
    name: Apply 99 diagnostic card fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply patch and remove temporary files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tr -d '\n\r' < .github/rota-certa-99-fix.patch.b64 > /tmp/rota-certa-99-diagnostic-fix.patch.b64
          echo "7e44f48ad9b0308006440b5550bb1ba1ad224c9c3b5fdab078f98f07f5d3aabf  /tmp/rota-certa-99-diagnostic-fix.patch.b64" | sha256sum -c -
          base64 -d /tmp/rota-certa-99-diagnostic-fix.patch.b64 > /tmp/rota-certa-99-diagnostic-fix.patch
          git apply --check /tmp/rota-certa-99-diagnostic-fix.patch
          git apply /tmp/rota-certa-99-diagnostic-fix.patch
          rm -f .github/rota-certa-99-fix.patch.b64
          rm -f .github/workflows/apply-99-diagnostic-fix.yml
          git add -A
          git commit -m "Fix 99 diagnostic ride card detection"
          git push origin HEAD:main
