name: Apply Rota Certa Stabilization

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-rota-certa-stabilizacao.yml'

permissions:
  contents: write
  actions: read

jobs:
  apply:
    name: Apply prepared Rota Certa patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply patch and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > /tmp/rota-certa.patch.b64 <<'PATCH_B64'
...