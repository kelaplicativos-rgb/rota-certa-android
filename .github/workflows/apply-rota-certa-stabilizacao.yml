name: Apply Rota Certa Stabilization

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-rota-certa-stabilizacao.yml'

permissions:
  contents: write
  actions: read

jobs:
  apply:
    name: Apply prepared Rota Certa patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply patch and remove temporary files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          perl -0pi -e 's/PSB1bnJlYWRTZW1wbGF0ZVByaW50cywK/PSB1bnJlYWRUZW1wbGF0ZVByaW50cywK/g' .github/rota-certa-patch/part06.b64
          cat .github/rota-certa-patch/part*.b64 | tr -d '\n\r' > /tmp/rota-certa.patch.b64
          echo "4bba836bd5a209df9a14dd7461fe18afb15caec9ed6eb49e93f2ebadb7ec087a  /tmp/rota-certa.patch.b64" | sha256sum -c -
          base64 -d /tmp/rota-certa.patch.b64 > /tmp/rota-certa.patch
          git am --3way /tmp/rota-certa.patch
          rm -rf .github/rota-certa-patch
          rm -f .github/workflows/apply-rota-certa-stabilizacao.yml
          test -f .github/workflows/build-debug-apk.yml
          git add -A
          git commit -m "Remove temporary stabilization workflow"
          git push origin HEAD:main
