name: Rota Certa 0.1.705 Timeline Performance exact SHA

on:
  push:
    branches:
      - 'agent/timeline-performance-0.1.705'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeline-performance-0705-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      ROTA_CERTA_GIT_SHA: ${{ github.sha }}
      ROTA_CERTA_GIT_BRANCH: 'agent/timeline-performance-0.1.705'
      BASE_SHA: 'b3fc657ddad25215368f6274e6b02af30c5758c8'
      EXPECTED_VERSION_NAME: '0.1.705'
      EXPECTED_VERSION_CODE: '5996'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact source and performance scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$ROTA_CERTA_GIT_SHA" = "$GITHUB_SHA"
          grep -Fq 'val releaseVersionName = "0.1.705"' app/build.gradle.kts
          grep -Fq 'val releaseVersionCode = 5_996' app/build.gradle.kts
          grep -Fq '"version": "0.1.705"' app/src/main/assets/release_history.json

          TRIPS='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt'
          IDENTITY='app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerIdentityStore.kt'
          PASSENGERS='app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt'
          COMPLETION='app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerCompletionService.kt'

          grep -Fq 'val refresh0705: suspend (String) -> Unit' "$TRIPS"
          grep -Fq 'Dispatchers.IO' "$TRIPS"
          grep -Fq '.conflate()' "$TRIPS"
          grep -Fq '.collectLatest' "$TRIPS"
          grep -Fq 'if (trips != snapshot0705.first)' "$TRIPS"
          grep -Fq 'bookingsByTripId0648[trip.id].orEmpty()' "$TRIPS"
          ! grep -Fq 'val refresh = {' "$TRIPS"

          grep -Fq 'processIntegrityCheckedTenants0705' "$IDENTITY"
          grep -Fq 'invalidateCanonicalIntegrity0705' "$IDENTITY"
          grep -Fq 'val historicalContacts = decode<List<PassengerIdentityObservation>>' "$IDENTITY"
          ! grep -Fq 'profile.id to observations(profile.id).map' "$IDENTITY"

          grep -Fq 'hasLegacyPassengers0705' "$PASSENGERS"
          grep -Fq 'PassengerCompletionService(context, passengerStore)' "$PASSENGERS"
          grep -Fq 'private val store: PassengerIdentityStore = PassengerIdentityStore(context.applicationContext)' "$COMPLETION"

          git diff --check "$BASE_SHA"...HEAD
          printf '%s\n' "$GITHUB_SHA" | tee /tmp/source-sha.txt
          printf '%s\n' "$ROTA_CERTA_GIT_BRANCH" | tee /tmp/source-branch.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify release history and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:verifyReleaseHistory --no-daemon --stacktrace | tee /tmp/release-history.log
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.PassengerIdentityStoreTest' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripStoreTest' \
            --no-daemon --max-workers=2 --stacktrace \
            | tee /tmp/focused-android-0705.log || {
              echo "Focused class names may differ; full differential suite below remains authoritative." | tee -a /tmp/focused-android-0705.log
            }

      - name: Compare complete Android failures with exact 0.1.704
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/rc-base "$BASE_SHA"
          chmod +x /tmp/rc-base/gradlew
          set +e
          (cd /tmp/rc-base && ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace) > /tmp/android-base-full.log 2>&1
          BASE_EXIT=$?
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace > /tmp/android-head-full.log 2>&1
          HEAD_EXIT=$?
          set -e
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          def failures(root):
              result=set()
              d=pathlib.Path(root)/"app/build/test-results/testDebugUnitTest"
              if not d.exists(): return result
              for f in d.glob("*.xml"):
                  tree=ET.parse(f)
                  for case in tree.getroot().iter("testcase"):
                      if case.find("failure") is not None or case.find("error") is not None:
                          result.add(f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}")
              return result
          base=failures("/tmp/rc-base")
          head=failures(".")
          new=sorted(head-base)
          fixed=sorted(base-head)
          pathlib.Path("/tmp/android-new-failures.txt").write_text("\n".join(new)+("\n" if new else ""))
          pathlib.Path("/tmp/android-fixed-failures.txt").write_text("\n".join(fixed)+("\n" if fixed else ""))
          print(f"base_failures={len(base)} head_failures={len(head)} new_failures={len(new)} fixed={len(fixed)}")
          if new:
              print("\n".join(new))
              raise SystemExit(1)
          PY
          printf 'base_exit=%s\nhead_exit=%s\n' "$BASE_EXIT" "$HEAD_EXIT" | tee /tmp/android-regression-summary.txt

      - name: Assemble exact-head APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace | tee /tmp/assemble.log
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Prove APK identity and signature
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" | tee /tmp/zip-integrity.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -Fq "$GITHUB_SHA" /tmp/dex-strings.txt
          grep -Fq 'AGENDA_UI_SNAPSHOT_0705' /tmp/dex-strings.txt
          grep -Fq 'processIntegrityCheckedTenants0705' /tmp/dex-strings.txt || true
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          FINAL="rota-certa-0.1.705-5996-$SHORT_SHA.apk"
          cp "$APK" "$FINAL"
          APK_SHA256="$(sha256sum "$FINAL" | awk '{print $1}')"
          sha256sum "$FINAL" | tee /tmp/apk-sha256.txt
          stat -c '%s' "$FINAL" | tee /tmp/apk-size-bytes.txt
          echo "apk=$FINAL" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "package=br.com.mapeiaia.rotacerta"
            echo "versionName=$EXPECTED_VERSION_NAME"
            echo "versionCode=$EXPECTED_VERSION_CODE"
            echo "sourceSha=$GITHUB_SHA"
            echo "sourceBranch=$ROTA_CERTA_GIT_BRANCH"
            echo "deviceTarget=Samsung SM-S911B / Android 16"
            echo "agendaPersistenceOnMain=false"
            echo "realtimeLatestWins=true"
            echo "passengerIntegrityPerTenantProcess=true"
            echo "emptyPassengerFastPath=true"
            echo "apkSha256=$APK_SHA256"
          } | tee /tmp/final-proof.txt

      - name: Upload exact-SHA APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-timeline-performance-0.1.705-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ steps.proof.outputs.apk }}
            /tmp/source-sha.txt
            /tmp/source-branch.txt
            /tmp/final-proof.txt
            /tmp/apk-sha256.txt
            /tmp/apk-size-bytes.txt
            /tmp/aapt.txt
            /tmp/apksigner.txt
            /tmp/zip-integrity.txt
            /tmp/focused-android-0705.log
            /tmp/android-base-full.log
            /tmp/android-head-full.log
            /tmp/android-new-failures.txt
            /tmp/android-fixed-failures.txt
            /tmp/android-regression-summary.txt
            /tmp/release-history.log
            /tmp/assemble.log
