name: Agenda 0.1.310 profile name identity fix

on:
  push:
    branches:
      - agent/profile-name-identity-fix-0.1.310
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-name-identity-fix-0.1.310
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate profile name contamination regression
        shell: bash
        run: |
          set -euo pipefail
          node --test trip-platform/functions/test/profile-name-contamination-0310.test.js
          node --test trip-platform/functions/test/public-profile-stable-link-0308.test.js
          grep -Fq 'PROFILE_NAME_CONTAMINATION_CLEANED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          ! grep -Fq '[data-testid*="profile-name"], [data-testid*="driver-name"], h1' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          grep -Fq 'BlaBlaDriverProfileNamePolicy.normalize(profile.profileName)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaSettingsUi.kt

      - name: Verify FAROL was not changed
        shell: bash
        run: |
          set -euo pipefail
          BASE=4d51f9f6054c76ccd9f0c0ed17dac45e4c3655e0
          test -z "$(git diff --name-only "$BASE"..HEAD -- 'app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt' 'app/src/main/java/br/com/mapeiaia/rotacerta/Farol*.kt')"

      - name: Configure Firebase service account
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
          else
            exit 3
          fi
          chmod 600 /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Generate Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
          APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
          test -n "$APP_ID"
          npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests lint and Android build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace | tee /tmp/gradle.txt
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/aapt.txt
          grep -Fq "versionCode='5603'" /tmp/aapt.txt
          grep -Fq "versionName='0.1.310'" /tmp/aapt.txt
          sha256sum "$APK" > /tmp/apk.sha256
          mkdir -p /tmp/0310
          cp "$APK" /tmp/0310/rota-certa-0.1.310-universal.apk
          cp /tmp/apk.sha256 /tmp/0310/apk.sha256
          cp /tmp/aapt.txt /tmp/0310/aapt.txt
          cp /tmp/apksigner.txt /tmp/0310/apksigner.txt
          cp /tmp/gradle.txt /tmp/0310/gradle.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.310-profile-name-fix
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0310

      - name: Publish direct test APK candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=ci-0.1.310-profile-name-fix
          APK=/tmp/0310/rota-certa-0.1.310-universal.apk
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --prerelease --title "Rota Certa 0.1.310 — correção nome do perfil" --notes "Impede título de viagem de ser salvo/exibido como nome de perfil BlaBlaCar e limpa contaminação já persistida." --repo "$GITHUB_REPOSITORY"
          fi
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/rota-certa-0.1.310-universal.apk"
          curl --fail --location --retry 6 --retry-all-errors -o /tmp/downloaded.apk "$URL"
          test "$(sha256sum /tmp/downloaded.apk | awk '{print $1}')" = "$(sha256sum "$APK" | awk '{print $1}')"
          echo "DIRECT_APK_URL=$URL"
