name: Register validated farol phase 2

on:
  pull_request:
    branches: [agent/shortcut-audio-links-text-correction-0.1.186]
    paths:
      - .github/workflows/register-farol-phase2.yml
      - scripts/register_farol_phase2_validated.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: register-farol-phase2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  register:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Register validated phase 2
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python3 scripts/register_farol_phase2_validated.py
          if git diff --quiet; then
            echo "phase2_records=already_registered"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md docs/DECISIONS.md
          git commit -m "Document validated farol phase 2"
          git push origin "HEAD:${HEAD_BRANCH}"
