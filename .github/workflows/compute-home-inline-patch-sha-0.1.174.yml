name: Compute Home Inline Patch SHA 0.1.174

on:
  push:
    branches: [agent/home-module-launcher-0.1.174]
    paths:
      - .github/workflows/compute-home-inline-patch-sha-0.1.174.yml
      - scripts/fix_home_inline_modules_0174.patch.gz.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checksum:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-module-launcher-0.1.174
      - name: Decode and record checksum
        run: |
          set -euo pipefail
          base64 --decode scripts/fix_home_inline_modules_0174.patch.gz.b64 | gzip --decompress > /tmp/fix0174.patch
          test -s /tmp/fix0174.patch
          grep -q 'HOME_MODULE_CONTENT_INLINE_0174' /tmp/fix0174.patch
          sha256sum /tmp/fix0174.patch | tee scripts/fix_home_inline_modules_0174.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/fix_home_inline_modules_0174.sha256
          git diff --cached --quiet || git commit -m 'ci: record current 0.1.174 patch checksum'
          git push origin HEAD:agent/home-module-launcher-0.1.174
