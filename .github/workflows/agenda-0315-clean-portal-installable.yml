name: Rota Certa 0.1.315 clean portal installable

on:
  push:
    branches:
      - agent/passenger-portal-clean-search-install-0.1.315
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/passenger-portal-clean-search-install-0.1.315
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate 0.1.315 portal, search and install contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/public/app.js
          node --test trip-platform/functions/test/*.test.js
          grep -Fq 'code: "protected_booking"' trip-platform/functions/index.js
          grep -Fq 'mutateProtectedBooking' trip-platform/functions/index.js
          grep -Fq 'passengerAccounts' trip-platform/functions/index.js
          grep -Fq 'itinerary_stops' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollector.kt
          grep -Fq 'waypointsComplete' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaCollectorNetworkSourceModule.kt
          grep -Fq 'itineraryAuthoritative' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaCollectorNetworkSourceModule.kt
          grep -Fq 'root.waypoints' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaNetworkDiagnosticRecorder.kt
          grep -Fq 'updateProtectedDriverBooking' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          grep -Fq 'id="passengerPortal"' trip-platform/public/index.html
          grep -Fq 'vaga(s) até' trip-platform/public/app.js
          grep -Fq 'id="accessGate"' trip-platform/public/index.html
          grep -Fq 'id="searchFromInput"' trip-platform/public/index.html
          grep -Fq 'id="searchReturn"' trip-platform/public/index.html
          ! grep -Fq 'navigator.geolocation' trip-platform/public/app.js
          ! grep -Fq 'getCurrentPosition(' trip-platform/public/app.js
          ! grep -Fq 'Usar localização atual' trip-platform/public/index.html
          ! grep -Fq 'Usar o local digitado' trip-platform/public/index.html
          grep -Fq 'passengerAreaEntry' trip-platform/public/index.html
          grep -Fq 'Reservas e conta' trip-platform/public/index.html
          grep -Fq 'bootstrapAuthenticatedExperience' trip-platform/public/app.js
          grep -Fq 'availableForTripSegment' trip-platform/public/app.js
          grep -Fq 'passenger_invite_required' trip-platform/functions/index.js
          grep -Fq '/v1/driver/passengers/invite' trip-platform/functions/index.js
          grep -Fq '/v1/driver/passengers/reset-password' trip-platform/functions/index.js
          grep -Fq '/v1/passenger/me/credits' trip-platform/functions/index.js
          grep -Fq 'processReferralCreditsForCompletedTrip' trip-platform/functions/index.js
          grep -Fq 'BOOKING_CREDIT_USED' trip-platform/functions/index.js
          grep -Fq 'BOOKING_CREDIT_REFUND' trip-platform/functions/index.js
          grep -Fq 'PassengerAdminScreen' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerAdminUi.kt
          grep -Fq '👥 Passageiros' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'Acesso somente por convite' trip-platform/public/index.html
          grep -Fq 'Indique e ganhe créditos' trip-platform/public/index.html
          grep -Fq 'versionCode = 5608' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.315"' app/build.gradle.kts

      - name: Verify FAROL was not changed
        shell: bash
        run: |
          set -euo pipefail
          BASE=aae6bef95e6ad6195431c203a28e74f2a6df4aac
          test -z "$(git diff --name-only "$BASE"..HEAD -- 'app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt' 'app/src/main/java/br/com/mapeiaia/rotacerta/Farol*.kt')"

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase credential is missing."
            exit 3
          fi

      - name: Generate Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
          else
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
          fi
          APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
          test -n "$APP_ID"
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests lint and build APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace | tee /tmp/gradle.txt
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'certificate SHA-256 digest: d9ee577b5bb9a4c72bce115e974c9ecf1ec8c7382bcd034e88d433e01eb0e7fd' /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta'" /tmp/aapt.txt
          grep -Fq "versionCode='5608'" /tmp/aapt.txt
          grep -Fq "versionName='0.1.315'" /tmp/aapt.txt
          sha256sum "$APK" | tee /tmp/apk.sha256
          mkdir -p /tmp/0315 trip-platform/public/downloads
          cp "$APK" /tmp/0315/rota-certa-0.1.315-universal.apk
          cp "$APK" trip-platform/public/downloads/rota-certa-0.1.315-universal.apk
          cp /tmp/apk.sha256 /tmp/0315/apk.sha256
          cp /tmp/aapt.txt /tmp/0315/aapt.txt
          cp /tmp/apksigner.txt /tmp/0315/apksigner.txt
          cp /tmp/gradle.txt /tmp/0315/gradle.txt
          git rev-parse HEAD > /tmp/0315/source-head.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.315-passenger-invites-credits
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0315

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=ci-0.1.315-clean-portal-installable
          APK=/tmp/0315/rota-certa-0.1.315-universal.apk
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --prerelease --title "Rota Certa 0.1.315 — portal limpo e atualização instalável" --notes "APK de teste baseado na 0.1.314 instalada, com Minha área visível, busca web limpa sem GPS, identidade visual própria do Rota Certa e assinatura compatível para atualização." --repo "$GITHUB_REPOSITORY"
          fi
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/rota-certa-0.1.315-universal.apk"
          curl --fail --location --retry 6 --retry-all-errors -o /tmp/downloaded.apk "$URL"
          test "$(sha256sum /tmp/downloaded.apk | awk '{print $1}')" = "$(sha256sum "$APK" | awk '{print $1}')"
          echo "DIRECT_APK_URL=$URL"

      - name: Install Firebase Functions dependencies
        shell: bash
        run: npm --prefix trip-platform/functions install --no-audit --no-fund

      - name: Deploy backend portal and hosted APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force
          fi

      - name: Smoke production and direct hosted APK
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://rota-certa-7ccc8.web.app
          curl --retry 8 --retry-delay 4 --fail --silent --show-error "$BASE/v1/health" | grep -F '"ok":true'

          LIVE_OK=0
          for attempt in $(seq 1 12); do
            BUST="$(date +%s%N)-$attempt"
            if curl --fail --silent --show-error "$BASE/app.js?v=$BUST" -o /tmp/live-app.js \
              && grep -Fq 'bootstrapAuthenticatedExperience' /tmp/live-app.js \
              && ! grep -Fq 'navigator.geolocation' /tmp/live-app.js \
              && ! grep -Fq 'getCurrentPosition(' /tmp/live-app.js \
              && grep -Fq 'sharePassengerReferral' /tmp/live-app.js \
              && grep -Fq 'creditToUseCents' /tmp/live-app.js \
              && curl --fail --silent --show-error "$BASE/?v=$BUST" -o /tmp/live-index.html \
              && grep -Fq 'passengerAreaEntry' /tmp/live-index.html \
              && grep -Fq 'id="searchFromInput"' /tmp/live-index.html \
              && ! grep -Fq 'Usar localização atual' /tmp/live-index.html \
              && ! grep -Fq 'Usar o local digitado' /tmp/live-index.html; then
              LIVE_OK=1
              break
            fi
            sleep 5
          done
          test "$LIVE_OK" = "1"

          EXPECTED="$(sha256sum /tmp/0315/rota-certa-0.1.315-universal.apk | awk '{print $1}')"
          APK_OK=0
          for attempt in $(seq 1 12); do
            BUST="$(date +%s%N)-$attempt"
            if curl --fail --silent --show-error "$BASE/downloads/rota-certa-0.1.315-universal.apk?v=$BUST" -o /tmp/hosted.apk; then
              ACTUAL="$(sha256sum /tmp/hosted.apk | awk '{print $1}')"
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                APK_OK=1
                break
              fi
            fi
            sleep 5
          done
          test "$APK_OK" = "1"
          echo "HOSTED_APK_URL=$BASE/downloads/rota-certa-0.1.315-universal.apk"
