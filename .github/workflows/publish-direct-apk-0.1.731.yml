name: Publish direct APK 0.1.731

on:
  push:
    branches:
      - 'agent/publish-direct-apk-0.1.731'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  publish-direct-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '37303150395'
      SOURCE_SHA: '56169ae53b3763bd8d3d39b1fa50fc1821f901fb'
      ARTIFACT_NAME: 'rota-certa-timeline-gps-chooser-0731-56169ae53b3763bd8d3d39b1fa50fc1821f901fb'
      EXPECTED_APK: 'rota-certa-0.1.731-6022-timeline-gps-chooser-56169ae53b37.apk'
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

    steps:
      - name: Download validated APK from successful run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir package
          APK_PATH="$(find package -type f -name "$EXPECTED_APK" -print -quit)"
          test -n "$APK_PATH"
          test -s "$APK_PATH"
          printf '%s\n' "$APK_PATH" | tee apk-path.txt
          sha256sum "$APK_PATH" | tee apk-sha256.txt

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
          else
            echo "Firebase service account secret is missing."
            exit 3
          fi
          chmod 600 /tmp/firebase-sa.json
          python3 -m json.tool /tmp/firebase-sa.json >/dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Publish APK-only Firebase Hosting preview
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          CHANNEL_ID="apk-0731-56169ae53b37"

          mkdir -p .apk-hosting/public
          cp "$(cat apk-path.txt)" ".apk-hosting/public/$EXPECTED_APK"

          cat > .apk-hosting/firebase.json <<EOF
          {
            "hosting": {
              "public": "public",
              "ignore": [],
              "headers": [
                {
                  "source": "**/*.apk",
                  "headers": [
                    {
                      "key": "Content-Disposition",
                      "value": "attachment; filename=\"$EXPECTED_APK\""
                    },
                    {
                      "key": "Cache-Control",
                      "value": "public, max-age=31536000, immutable"
                    }
                  ]
                }
              ]
            }
          }
          EOF

          (
            cd .apk-hosting
            npx --yes firebase-tools@14.12.0 hosting:channel:deploy "$CHANNEL_ID" \
              --project "$PROJECT" \
              --expires 30d \
              --config firebase.json \
              --non-interactive
          ) 2>&1 | tee /tmp/firebase-hosting-channel.txt

          PREVIEW_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.web\.app' /tmp/firebase-hosting-channel.txt | tail -1)"
          test -n "$PREVIEW_URL"
          DIRECT_URL="$PREVIEW_URL/$EXPECTED_APK"

          printf '%s\n' "$PREVIEW_URL" | tee /tmp/apk-preview-url.txt
          printf '%s\n' "$DIRECT_URL" | tee /tmp/direct-apk-url.txt
          echo "url=$DIRECT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify direct APK download
        shell: bash
        run: |
          set -euo pipefail
          DIRECT_URL="$(cat /tmp/direct-apk-url.txt)"
          curl --fail --location --retry 5 --retry-delay 2 \
            --range 0-31 \
            --output /tmp/apk-prefix.bin \
            "$DIRECT_URL"
          test -s /tmp/apk-prefix.bin
          python3 - <<'PY'
          data = open("/tmp/apk-prefix.bin", "rb").read(4)
          if data[:2] != b"PK":
              raise SystemExit(f"Direct download is not an APK/ZIP prefix: {data!r}")
          PY

          {
            echo "## 📱 APK pronto para instalar"
            echo
            echo "[**Baixar somente o APK — Rota Certa 0.1.731**]($DIRECT_URL)"
            echo
            echo "Download direto do arquivo .apk, sem o pacote de diagnóstico."
            echo
            echo "- VersionName: `0.1.731`"
            echo "- VersionCode: `6022`"
            echo "- Source SHA: `$SOURCE_SHA`"
            echo "- SHA-256: `$(awk '{print $1}' apk-sha256.txt)`"
            echo "- Link direto válido por 30 dias."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare APK-only GitHub artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f apk-path.txt ]; then
            cp "$(cat apk-path.txt)" "$EXPECTED_APK"
          fi

      - name: Keep APK-only GitHub artifact as fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.731-APK-INSTALAR
          path: ${{ env.EXPECTED_APK }}
          if-no-files-found: warn
          retention-days: 30
