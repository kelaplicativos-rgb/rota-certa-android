name: Agenda 0.1.302 deploy public debug backend

on:
  push:
    branches:
      - agent/agenda-public-link-debug-0.1.302
    paths:
      - '.github/workflows/agenda-0302-deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agenda-public-link-debug-0.1.302

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase deployment credential is missing."
            exit 3
          fi

      - name: Install Functions dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix trip-platform/functions install --no-audit --no-fund

      - name: Deploy trip API first
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api --non-interactive --force --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api --non-interactive --force
          fi

      - name: Smoke production backend diagnostics
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 8 --retry-delay 5 --fail --silent --show-error https://rota-certa-7ccc8.web.app/v1/health | tee /tmp/health.json
          grep -Fq '"ok":true' /tmp/health.json
          CODE="$(curl --retry 4 --retry-delay 3 --silent --show-error -o /tmp/public-debug.out -w "%{http_code}" -X POST https://rota-certa-7ccc8.web.app/v1/public/debug/events -H 'Content-Type: application/json' --data '{"event":"PUBLIC_LINK_OPENED","sessionId":"ci-smoke-invalid-target"}')"
          test "$CODE" = "204"
          AUTH_CODE="$(curl --silent --show-error -o /tmp/driver-debug.out -w "%{http_code}" https://rota-certa-7ccc8.web.app/v1/driver/public-debug)"
          test "$AUTH_CODE" = "401"

      - name: Attempt Hosting separately
        id: hosting
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only hosting --non-interactive --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only hosting --non-interactive
          fi

      - name: Report Hosting permission separately
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "backendDeploy=success"
          echo "hostingDeployOutcome=${{ steps.hosting.outcome }}"
          if [ "${{ steps.hosting.outcome }}" != "success" ]; then
            echo "::warning::Backend public-link diagnostics are live, but Firebase Hosting deployment is blocked by the current service-account permissions."
          fi
