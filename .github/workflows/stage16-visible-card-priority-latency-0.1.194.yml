name: Validate Stage 16 visible card priority and latency 0.1.194

on:
  pull_request:
    branches:
      - agent/stage14-visible-offer-activation-0.1.194
    paths:
      - .github/workflows/stage16-visible-card-priority-latency-0.1.194.yml
      - scripts/apply_visible_card_priority_latency_stage16.py
  workflow_dispatch:

concurrency:
  group: stage16-visible-card-priority-latency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  materialize-effective-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Checkout exact Stage 16 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: patches

      - name: Verify exact Stage 14 ancestry
        working-directory: patches
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 77fefe2991f0e8926e9d429b979ec7d8d932d89a HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Materialize canonical 0.1.194 and verify exact source
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-stage16-materialize
        run: |
          set -euo pipefail
          mkdir -p stage16-materialized
          bash ../patches/scripts/build_rota_certa_0194.sh ../patches 2>&1 | tee stage16-materialized/materialize.log
          grep -Fq 'versionCode = 5478' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.194"' app/build.gradle.kts
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | awk '{print $1}')" = "d42ee18e69cc4bc98b0ac2d5a4faa1384ce1da3fcdf24632255c361e02a73749"
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/FarolRealDeviceGate0188.kt | awk '{print $1}')" = "2aaa6263c450d6218aba722915a2ceeec900728c90001625ff1513f65a39236e"
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/UniversalScreenAddressParser.kt | awk '{print $1}')" = "19088d8b110a36b8ab75b7a46b5eab6b0fc79fd17d5f2dad6608e59b7a967d4d"

      - name: Apply exact Stage 9, Stage 12 and Stage 14 source transforms
        working-directory: source
        run: |
          set -euo pipefail
          python3 ../patches/scripts/apply_farol_latency_instrumentation_stage9.py "$PWD" | tee stage16-materialized/stage9-apply.txt
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | awk '{print $1}')" = "b4fd2ff429fd72125a5ae724129c625974be313bec700b5f09d2310795ccbab6"
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/FarolLatencyProbeStage9.kt | awk '{print $1}')" = "a22cc939e147acbe019d2ead4616050419430ad7afd0e5c02aeb26e917b6c8cc"
          python3 ../patches/scripts/apply_farol_latency_manual_export_stage12.py "$PWD" | tee stage16-materialized/stage12-apply.txt
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/ManualTechnicalReportBuilder.kt | awk '{print $1}')" = "b26022c9c2fadc563376dd612baf55368e25cbdb3d6f08851d8e515097598cec"
          python3 ../patches/scripts/apply_visible_offer_activation_stage14.py "$PWD" | tee stage16-materialized/stage14-apply.txt
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/FarolRuntimeSafety0187.kt | awk '{print $1}')" = "0f7428beeeb1476c0ec4d4560c291a4c7ed9f412ef87805b49c75976551f8cba"

      - name: Capture exact Stage 16 investigation source
        working-directory: source
        run: |
          set -euo pipefail
          cp app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt stage16-materialized/
          cp app/src/main/java/br/com/mapeiaia/rotacerta/FarolRuntimeSafety0187.kt stage16-materialized/
          cp app/src/main/java/br/com/mapeiaia/rotacerta/FarolRealDeviceGate0188.kt stage16-materialized/
          cp app/src/main/java/br/com/mapeiaia/rotacerta/FarolVisualPriority0189.kt stage16-materialized/
          cp app/src/main/java/br/com/mapeiaia/rotacerta/GoogleMapsService.kt stage16-materialized/
          cp app/src/main/java/br/com/mapeiaia/rotacerta/UniversalScreenAddressParser.kt stage16-materialized/
          cp app/src/main/java/br/com/mapeiaia/rotacerta/FarolLatencyProbeStage9.kt stage16-materialized/
          cp app/src/main/java/br/com/mapeiaia/rotacerta/ManualTechnicalReportBuilder.kt stage16-materialized/
          cp app/src/test/java/br/com/mapeiaia/rotacerta/FarolRuntimeSafety0187Test.kt stage16-materialized/
          cp app/src/test/java/br/com/mapeiaia/rotacerta/FarolRealDevice0188Test.kt stage16-materialized/
          cp app/src/test/java/br/com/mapeiaia/rotacerta/FarolVisualPriority0189Test.kt stage16-materialized/
          cp app/src/test/java/br/com/mapeiaia/rotacerta/VisibleOfferActivationStage14Test.kt stage16-materialized/
          sha256sum stage16-materialized/*.kt > stage16-materialized/source.sha256

      - name: Upload materialized Stage 16 investigation source
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-stage16-materialized-investigation-source
          path: source/stage16-materialized/
          if-no-files-found: error
          retention-days: 7
