name: Agenda 0.1.301 pending seats nonblocking

on:
  push:
    branches:
      - agent/agenda-public-autosync-seat-regression-0.1.301
    paths:
      - '.github/workflows/agenda-0301-pending-seats-nonblocking.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaManualSeatAutomation.kt'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaReliableSeatSync.kt'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agenda-public-autosync-seat-regression-0.1.301
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify pending-seat regression contract
        shell: bash
        run: |
          set -euo pipefail
          UI=app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          AUTO=app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaManualSeatAutomation.kt
          REL=app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaReliableSeatSync.kt
          grep -Fq 'versionCode = 5594' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.301"' app/build.gradle.kts
          grep -Fq 'else -> "Sincronizar todas as contas"' "$UI"
          grep -Fq 'Text("Vagas pendentes: $pendingSeatCount • isso não bloqueia as outras sincronizações.")' "$UI"
          grep -Fq 'Text("Tentar vagas pendentes")' "$UI"
          grep -Fq 'Text("Limpar pendências")' "$UI"
          grep -Fq 'pendingSeatQueueDoesNotBlock=true' "$UI"
          grep -Fq 'normalSyncContinues=true' "$UI"
          grep -Fq 'fun clearAll(): List<String>' "$AUTO"
          grep -Fq 'fun clearAll()' "$REL"
          grep -Fq 'fun clearPendingStates(): Int' "$REL"
          ! grep -Fq 'manualSeatStore.peek() != null -> "Tentar vagas pendentes"' "$UI"
          ! grep -Fq 'if (!launchPendingSeatSync("manual_sync_button"))' "$UI"
          ! grep -Fq 'if (!launchPendingSeatSync("manual_sync_today_button"))' "$UI"
          grep -Fq 'PublicAgendaAutoSync0300.sync' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'publicBookingEnabled = true' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          git diff --check

      - name: Test lint and build APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace | tee /tmp/gradle.txt
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta'" /tmp/aapt.txt
          grep -Fq "versionCode='5594'" /tmp/aapt.txt
          grep -Fq "versionName='0.1.301'" /tmp/aapt.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agenda-0301
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/agenda-0301/rota-certa-0.1.301-pending-seats-nonblocking.apk
          cp /tmp/apk.sha256 /tmp/agenda-0301/apk.sha256
          cp /tmp/aapt.txt /tmp/agenda-0301/aapt.txt
          cp /tmp/apksigner.txt /tmp/agenda-0301/apksigner.txt
          cp /tmp/gradle.txt /tmp/agenda-0301/gradle.txt
          printf '%s\n'             'versionName=0.1.301'             'pendingSeatQueueDoesNotBlockNormalSync=true'             'pendingSeatRetrySeparate=true'             'pendingSeatClearUserAction=true'             'publicAgendaAutoSyncPreserved=true'             'bookingsPreservedOnPendingClear=true'             'profilesPreservedOnPendingClear=true' > /tmp/agenda-0301/contract.txt
          git rev-parse HEAD > /tmp/agenda-0301/source-head.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.301-pending-seats-nonblocking
          if-no-files-found: error
          retention-days: 30
          path: /tmp/agenda-0301
