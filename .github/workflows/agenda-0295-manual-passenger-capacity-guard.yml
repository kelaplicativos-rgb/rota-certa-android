name: Agenda 0.1.295 manual passenger capacity guard

on:
  push:
    branches:
      - agent/agenda-profile-card-colors-0.1.288
    paths:
      - '.github/workflows/agenda-0295-manual-passenger-capacity-guard.yml'
      - '.github/scripts/agenda_0295_manual_passenger_capacity_guard.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agenda-0295-manual-passenger-capacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/agenda-profile-card-colors-0.1.288

      - name: Prove real 0.1.294 baseline and existing capacity guard
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 5587' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.294"' app/build.gradle.kts
          grep -Fq 'SeatAvailabilityEngine.availability(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripQuickPassenger.kt
          grep -Fq 'require(availability.canBook)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripQuickPassenger.kt
          grep -Fq 'availability?.canBook == true' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripQuickPassengerUi.kt
          grep -Fq 'val strongExternal = timelineStrongExternalTripKey(entry)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripGlobalPassengerFlow0256.kt
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"

      - name: Materialize incomplete-roster fail-closed guard
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/agenda_0295_manual_passenger_capacity_guard.py
          git diff --check
          grep -Fq 'versionCode = 5588' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.295"' app/build.gradle.kts
          grep -Fq 'timelineManualPassengerOccupancyKnown' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripGlobalPassengerFlow0256.kt
          grep -Fq 'A ocupação BlaBlaCar deste card ainda não foi lida por completo.' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripGlobalPassengerFlow0256.kt
          test -f app/src/test/java/br/com/mapeiaia/rotacerta/trips/ManualPassengerCapacityGuard0295Test.kt

      - name: Protect FAROL and exact source scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/changed.txt
          printf '%s\n' \
            'app/build.gradle.kts' \
            'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripGlobalPassengerFlow0256.kt' \
            'app/src/test/java/br/com/mapeiaia/rotacerta/trips/ManualPassengerCapacityGuard0295Test.kt' | sort > /tmp/expected.txt
          cmp /tmp/expected.txt /tmp/changed.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Focused manual passenger capacity tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests br.com.mapeiaia.rotacerta.trips.ManualPassengerCapacityGuard0295Test \
            --tests br.com.mapeiaia.rotacerta.trips.TripQuickPassengerStage47R4Step4Test \
            --tests br.com.mapeiaia.rotacerta.trips.GlobalPassengerFlow0256Test \
            --tests br.com.mapeiaia.rotacerta.trips.TripSegmentSeatSync0292Test \
            --tests br.com.mapeiaia.rotacerta.trips.TripSeatSyncAudit0293Test \
            --no-daemon --stacktrace

      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk.sha256
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"

      - name: Commit tested 0.1.295 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripGlobalPassengerFlow0256.kt \
                  app/src/test/java/br/com/mapeiaia/rotacerta/trips/ManualPassengerCapacityGuard0295Test.kt
          git commit -m 'fix(agenda): block manual passenger when occupancy is unknown 0.1.295'
          git push origin HEAD:agent/agenda-profile-card-colors-0.1.288
          git rev-parse HEAD | tee /tmp/source-head.txt

      - name: Prepare APK evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agenda-0295
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/agenda-0295/rota-certa-0.1.295-debug.apk
          cp /tmp/apk.sha256 /tmp/agenda-0295/apk.sha256
          cp /tmp/source-head.txt /tmp/agenda-0295/source-head.txt
          printf '%s\n' \
            'versionName=0.1.295' \
            'versionCode=5588' \
            'manualPassengerSegmentCapacityGuard=true' \
            'externalIncompleteRosterFailsClosed=true' \
            'localTripsRemainBookableByLocalOccupancy=true' \
            'existingSeatAvailabilityEngineReused=true' \
            'farolUntouched=true' > /tmp/agenda-0295/guard-contract.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-agenda-0.1.295-manual-passenger-capacity-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/agenda-0295
