name: Finalize Rota Certa 0.1.177 docs

on:
  push:
    branches: [agent/fix-shortcut-module-focus-0.1.177]
    paths:
      - .github/workflows/finalize-docs-0.1.177.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-shortcut-module-focus-0.1.177
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update authoritative project records
        run: python scripts/finalize_docs_0177.py

      - name: Commit records and remove temporary finalizer
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-docs-0.1.177.yml scripts/finalize_docs_0177.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md docs/DECISIONS.md validation/0.1.177/latest.txt .github/workflows/finalize-docs-0.1.177.yml scripts/finalize_docs_0177.py
          git commit -m "docs: record validated Rota Certa 0.1.177"
          git push origin HEAD:agent/fix-shortcut-module-focus-0.1.177
