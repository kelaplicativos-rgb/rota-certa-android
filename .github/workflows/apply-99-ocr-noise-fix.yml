name: Apply 99 OCR Noise Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-99-ocr-noise-fix.yml'

permissions:
  contents: write
  actions: read

jobs:
  apply:
    name: Apply 99 OCR noise fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Patch parser/classifier and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          parser = Path('app/src/main/java/br/com/mapeiaia/rotacerta/RideTextParser.kt')
          text = parser.read_text()
          text = text.replace(
              'parou de correr|carregando)\\b.*$',
              'parou de correr|carregando|conectar)\\b.*$',
          )
          text = text.replace(
              'normalized.contains("pix") ||\n',
              'normalized.contains("pix") ||\n            normalized.contains("r$") ||\n            normalized.contains("conectar") ||\n',
              1,
          )
          parser.write_text(text)

          service = Path('app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt')
          text = service.read_text()
          old = '''val hasNinetyNinePackageSignal = normalizedPackage == PACKAGE_99_DRIVER &&
            hasPositiveFare &&
            Regex("""\\b\\d+(?:[,.]\\d+)?\\s*km\\b""", RegexOption.IGNORE_CASE).containsMatchIn(text)'''
          new = '''val hasNinetyNineTextSignal = normalizedPackage == PACKAGE_99_DRIVER ||
            Regex("""(?:^|\\s)99(?:\\s|$)""", RegexOption.IGNORE_CASE).containsMatchIn(text)
        val hasNinetyNinePackageSignal = hasNinetyNineTextSignal &&
            hasPositiveFare &&
            Regex("""\\b\\d+(?:[,.]\\d+)?\\s*km\\b""", RegexOption.IGNORE_CASE).containsMatchIn(text)'''
          if old not in text:
              raise SystemExit('expected classifier block not found')
          text = text.replace(old, new, 1)
          service.write_text(text)
          PY
          grep -F 'normalized.contains("r$")' app/src/main/java/br/com/mapeiaia/rotacerta/RideTextParser.kt
          grep -F 'normalized.contains("conectar")' app/src/main/java/br/com/mapeiaia/rotacerta/RideTextParser.kt
          grep -F 'val hasNinetyNineTextSignal' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          rm -f .github/workflows/apply-99-ocr-noise-fix.yml
          git add -A
          git commit -m "Handle 99 OCR noise in ride cards"
          git push origin HEAD:main

# retry with python patcher
