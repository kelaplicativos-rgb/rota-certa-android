name: Finalize Rota Certa 0.1.176 records

on:
  push:
    branches: [agent/fix-shortcut-single-tap-0.1.176]
    paths:
      - .github/workflows/finalize-shortcut-single-tap-0.1.176.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-shortcut-single-tap-0.1.176
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update project records
        run: |
          python - <<'PY'
          from pathlib import Path

          status_path = Path("docs/PROJECT_STATUS.md")
          decisions_path = Path("docs/DECISIONS.md")
          validation_path = Path("validation/0.1.176/latest.txt")

          status_entry = """## 02/08/2026 — 0.1.176 (5370) — toque simples da grade com despacho seguro\n\n- **Branch:** `agent/fix-shortcut-single-tap-0.1.176`; **PR:** #45, empilhada sobre `agent/home-module-bubble-grid-0.1.175`, aberta, mergeável, em rascunho e sem merge.\n- **Commit funcional validado:** `47fa9cbd4d96815794ab3db88253f984453b217d`.\n- **Pedido do usuário:** corrigir bolinhas da grade flutuante que recebiam um toque simples, fechavam a grade, mas não abriam nem executavam o módulo correspondente.\n- **Evidência real:** o relatório manual da versão 0.1.175 registrou `bubble.shortcut.clicked` para `saved_places`, `alerts`, `radars` e `quick_replies`, sem evento posterior de abertura ou execução. Isso comprovou que a área clicável e o reconhecimento do toque funcionavam e isolou a falha no despacho da ação principal.\n- **Causa:** os métodos que abriam Activities chamavam `shortcutOverlayController.hideAll()` antes de `startActivity`. No Android moderno, remover também a última janela visível antes do despacho podia retirar a condição de interação visível e fazer o sistema bloquear silenciosamente a abertura iniciada pelo usuário.\n- **Correção aplicada:**\n  - criado o lançador único `launchShortcutActivity0176`;\n  - a bolinha principal permanece visível enquanto o despacho solicitado pelo usuário é enviado;\n  - Android 14 ou superior usa `PendingIntent` com opt-in explícito do criador e do remetente para início de Activity em segundo plano;\n  - a sobreposição é escondida somente depois que o despacho foi aceito sem exceção;\n  - falhas permanecem fail-closed e registram apenas os marcadores limitados `SHORTCUT_ACTIVITY_DISPATCHED_0176` ou `SHORTCUT_ACTIVITY_DISPATCH_FAILED_0176`;\n  - Locais, Alertas, Radares, Respostas, Rota, Destino, Financeiro, Links, Diagnóstico, Aparência, Backup e demais destinos internos passaram pelo mesmo caminho seguro;\n  - ações que não abrem Activity continuaram com o comportamento original.\n- **Arquivos principais alterados/materializados:**\n  - `scripts/fix_shortcut_single_tap_0176.py`;\n  - `scripts/fix_shortcut_single_tap_0176_test_contract.py`;\n  - `.github/workflows/build-rota-certa-0.1.176.yml`;\n  - `LiveRideAccessibilityService.kt`;\n  - novo `ShortcutActivityLaunchPolicy0176.kt`;\n  - novos testes `ShortcutActivityLaunchPolicy0176Test.kt` e `ShortcutActivityLaunchContract0176Test.kt`.\n- **Fronteira protegida:** `AndroidManifest.xml`, `DecisionEngine.kt`, `GoogleMapsService.kt`, `RideTextParser.kt`, `BubbleShortcutOverlayController.kt`, `BubbleShortcutModule.kt`, `ShortcutLongPressPolicy0171.kt` e `MainActivity.kt` permaneceram idênticos por SHA-256. Manifest, permissões, catálogo, toque longo, Home, farol, parser, OCR, rota, Casa/Alfinetes, confirmação real do card, cores e km não foram alterados.\n- **Testes e validações:** materialização completa 0.1.151–0.1.175; contratos do despacho; testes unitários e de contrato aprovados; Android Lint aprovado; `clean assembleDebug` aprovado; integridade ZIP, DEX, pacote, versão, versionCode, assinatura v2 e certificado validados.\n- **Falhas intermediárias localizadas:** as duas primeiras execuções pararam em um literal incorreto do novo teste gerado. Nenhuma delas chegou a Lint ou APK. O contrato foi corrigido sem alterar o código funcional e a execução final passou integralmente.\n- **Workflow funcional validado:** `Build Rota Certa 0.1.176`, run `30749272318`, job `91500269757`; todos os passos concluídos com sucesso.\n- **Artifact:** `rota-certa-0.1.176-shortcut-single-tap-validated`, ID `8833961162`, retenção de 90 dias.\n- **Pacote e versão validados:** `br.com.mapeiaia.rotacerta`, versão `0.1.176`, versionCode `5370`.\n- **APK:** `rota-certa-0.1.176-toque-simples-grade-validado.apk`, 55.993.295 bytes.\n- **SHA-256 do APK:** `b7180112912cc0656fd41c592e23e737677a37dbdcbedeef0afef2956d04eddb`.\n- **Digest do ZIP publicado pelo GitHub Actions:** `9c9417a2e08aa5c93678c213b8a595273cdaef53def39136ef49a5c9b80c6db3`.\n- **Assinatura:** APK Signature Scheme v2 válida; certificado `CN=Rota Certa Debug, O=Kel Aplicativos, C=BR`; certificado SHA-256 `d9ee577b5bb9a4c72bce115e974c9ecf1ec8c7382bcd034e88d433e01eb0e7fd`; RSA 2048 bits.\n- **Pendências e próxima validação:** instalar no Samsung SM-S911B/Android 16 e testar toque simples nas 17 bolinhas, com prioridade para Locais, Alertas, Radares, Respostas, Rota, Destino, Financeiro, Links e Diagnóstico. Confirmar abertura imediata, retorno da bolinha, preservação do toque longo e ausência de regressão do farol. A PR #45 deve permanecer em rascunho até essa validação real.\n\n"""

          decision_entry = """## 02/08/2026 — Preservar janela visível até o despacho dos atalhos flutuantes\n\n- **Decisão:** qualquer toque da grade flutuante que precise abrir uma Activity interna deve manter a bolinha principal visível até o sistema receber o despacho solicitado pelo usuário.\n- **Motivo:** remover todas as sobreposições antes da abertura pode eliminar a condição de interação visível e permitir bloqueio silencioso da Activity em Android moderno.\n- **Implementação:** Android 14 ou superior usa `PendingIntent` com permissão explícita do criador e do remetente para início em segundo plano; versões anteriores usam `startActivity`. A sobreposição só é escondida após o envio sem exceção.\n- **Módulos afetados:** roteamento da grade para Activities internas, incluindo Locais, Alertas, Radares, Respostas, Rota, Destino, Financeiro, Links, Diagnóstico, Aparência e Backup.\n- **Fronteira:** não muda catálogo, toque longo, Home, Manifest, permissões, farol, parser, OCR, Google Maps, Casa/Alfinetes ou decisão de cores.\n- **Diagnóstico:** manter somente marcadores de evento limitados para despacho aceito ou falha; não criar polling nem log contínuo adicional.\n- **Revisão futura:** somente se nova política do Android alterar o contrato de background activity launch ou se teste real demonstrar falha residual.\n\n"""

          status = status_path.read_text(encoding="utf-8")
          if "## 02/08/2026 — 0.1.176 (5370)" not in status:
              marker = "# Rota Certa — Estado do projeto\n\n"
              if marker not in status:
                  raise SystemExit("PROJECT_STATUS header not found")
              status = status.replace(marker, marker + status_entry, 1)
              status_path.write_text(status, encoding="utf-8")

          decisions = decisions_path.read_text(encoding="utf-8")
          if "## 02/08/2026 — Preservar janela visível" not in decisions:
              first_break = decisions.find("\n\n")
              if first_break < 0:
                  raise SystemExit("DECISIONS header not found")
              decisions = decisions[:first_break + 2] + decision_entry + decisions[first_break + 2:]
              decisions_path.write_text(decisions, encoding="utf-8")

          validation_path.parent.mkdir(parents=True, exist_ok=True)
          validation_path.write_text(
              "head=47fa9cbd4d96815794ab3db88253f984453b217d\n"
              "run=30749272318\n"
              "job=91500269757\n"
              "conclusion=success\n"
              "artifact_id=8833961162\n"
              "artifact_name=rota-certa-0.1.176-shortcut-single-tap-validated\n"
              "apk_sha256=b7180112912cc0656fd41c592e23e737677a37dbdcbedeef0afef2956d04eddb\n"
              "apk_bytes=55993295\n"
              "package=br.com.mapeiaia.rotacerta\n"
              "version=0.1.176\n"
              "version_code=5370\n",
              encoding="utf-8",
          )

          for temporary in (
              Path(".github/workflows/inspect-shortcut-dispatch-0.1.176.yml"),
              Path(".github/workflows/finalize-shortcut-single-tap-0.1.176.yml"),
          ):
              if temporary.exists():
                  temporary.unlink()
          PY

      - name: Commit final records
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md docs/DECISIONS.md validation/0.1.176/latest.txt .github/workflows
          git diff --cached --check
          git commit -m "docs: finalize validated Rota Certa 0.1.176"
          git push origin HEAD:agent/fix-shortcut-single-tap-0.1.176
