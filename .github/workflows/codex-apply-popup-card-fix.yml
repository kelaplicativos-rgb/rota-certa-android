name: Codex Apply Popup Card Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-apply-popup-card-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    name: Apply popup card fix patch
    runs-on: ubuntu-latest

    steps:
