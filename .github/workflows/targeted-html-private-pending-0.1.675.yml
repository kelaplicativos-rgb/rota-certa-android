name: Targeted HTML private pending 0.1.675 APK

on:
  push:
    branches:
      - 'agent/targeted-html-private-pending-0.1.675'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: targeted-html-private-pending-0675-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_API_KEY: ''
      ROTA_CERTA_GIT_SHA: ${{ github.sha }}
      ROTA_CERTA_GIT_BRANCH: agent/targeted-html-private-pending-0.1.675

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ROTA_CERTA_GIT_SHA"
          CAP='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt'
          AG='app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt'
          grep -Fq 'releaseVersionName = "0.1.675"' app/build.gradle.kts
          grep -Fq 'releaseVersionCode = 5_966' app/build.gradle.kts
          grep -Fq '"version": "0.1.675"' app/src/main/assets/release_history.json
          grep -Fq 'TargetedHtmlAcceptance0675.CORE_COMMIT_PRIVATE_PENDING' "$CAP"
          grep -Fq 'TARGETED_HTML_PRIVATE_PENDING_ACCEPTED_0675' "$CAP"
          grep -Fq 'canonicalWrite=true sessionContentWrite=false' "$CAP"
          grep -Fq 'TARGETED_HTML_INCOMPLETE_REJECTED_0615' "$CAP"
          grep -Fq 'passengerDetailsComplete0653' "$CAP"
          grep -Fq 'preserveCanonicalPrivateFields0675' "$AG"
          grep -Fq 'TARGET_CARD_CORE_COMMIT_PRIVATE_PENDING_0675' "$AG"
          git diff --check 66a3b59bb1271d0d773378b795a01e682b086a9a HEAD

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run targeted refresh and inherited regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest             --tests 'br.com.mapeiaia.rotacerta.trips.TargetedHtmlPrivatePending0675Test'             --tests 'br.com.mapeiaia.rotacerta.trips.OperationalTripCardRefresh0663Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaPassengerArtifactCompleteness0658Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaPassengerPrivateHtml0657Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaHtmlStopTimes0672Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PassengerQuickOps0673Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PassengerSegmentTime0672Test'             --tests 'br.com.mapeiaia.rotacerta.trips.SegmentPaxTimeline0671Test'             --no-daemon --max-workers=2 --stacktrace | tee /tmp/android-0675-tests.log

      - name: Assemble exact source APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace | tee /tmp/android-0675-assemble.log
          test "$(git rev-parse HEAD)" = "$ROTA_CERTA_GIT_SHA"

      - name: Prove APK identity signing runtime markers and final SHA
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -s "$APK"
          unzip -t "$APK" | tee /tmp/android-0675-zip-integrity.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/android-0675-aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/android-0675-aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='5966'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='0.1.675'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/android-0675-apksigner.txt
          grep -Fq 'Verified' /tmp/android-0675-apksigner.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/android-0675-dex-strings.txt
          grep -Fq "$ROTA_CERTA_GIT_SHA" /tmp/android-0675-dex-strings.txt
          grep -Fq 'TARGETED_HTML_PRIVATE_PENDING_ACCEPTED_0675' /tmp/android-0675-dex-strings.txt
          grep -Fq 'TARGET_CARD_CORE_COMMIT_PRIVATE_PENDING_0675' /tmp/android-0675-dex-strings.txt
          grep -Fq 'TRIPS_CARD_HTML_DIRECT_0663' /tmp/android-0675-dex-strings.txt
          grep -Fq 'PASSENGER_QUICK_TRACKING_0674' /tmp/android-0675-dex-strings.txt

          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          FINAL="rota-certa-0.1.675-5966-$SHORT_SHA.apk"
          cp "$APK" "$FINAL"
          echo "apk=$FINAL" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

          {
            echo "package=br.com.mapeiaia.rotacerta"
            echo "versionName=0.1.675"
            echo "versionCode=5966"
            echo "branch=agent/targeted-html-private-pending-0.1.675"
            echo "commit=$ROTA_CERTA_GIT_SHA"
            echo "deviceTarget=Samsung SM-S911B / Android 16 / API 36"
            echo "targetedRefresh=TRIP_ONLY_HTML_DIRECT"
            echo "privateMissingPolicy=CORE_COMMIT_PRIVATE_PENDING"
            echo "privatePreservation=ENABLED"
            echo "globalHtmlFailClosed=PRESERVED"
            echo "apk=$FINAL"
            echo "apk_sha256=$APK_SHA256"
          } | tee targeted-html-private-pending-0675-proof.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-targeted-html-private-pending-0.1.675-${{ github.sha }}
          path: |
            ${{ steps.proof.outputs.apk }}
            targeted-html-private-pending-0675-proof.txt
            /tmp/android-0675-tests.log
            /tmp/android-0675-assemble.log
            /tmp/android-0675-aapt.txt
            /tmp/android-0675-apksigner.txt
            /tmp/android-0675-zip-integrity.txt
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30
