name: Stage19 full-suite diagnostic

on:
  push:
    branches:
      - agent/stage19-universal-visual-pipeline-0.1.200
    paths:
      - .github/workflows/stage19-suite-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose-full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: patches
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rota-certa-stage19-materialized-stage18-source
          path: bootstrap
          github-token: ${{ github.token }}
          repository: kelaplicativos-rgb/rota-certa-android
          run-id: 31612053591
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Materialize Stage19
        run: |
          set -euo pipefail
          cd source
          rm -rf app/src/main/java app/src/test/java
          tar -xzf ../bootstrap/stage18-materialized-source.tgz
          python3 ../patches/scripts/apply_universal_visual_pipeline_stage19.py "$PWD"
          mkdir -p stage19-diagnostic
      - name: Run full suite and capture every failure
        id: suite
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-stage19-diagnostic
        run: |
          set +e
          ./gradlew testDebugUnitTest --no-daemon --max-workers=1 --no-parallel --stacktrace 2>&1 | tee stage19-diagnostic/full-unit-suite.log
          GRADLE_STATUS=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY' | tee stage19-diagnostic/full-suite-summary.txt
          import glob, xml.etree.ElementTree as ET
          tests=failures=errors=skipped=0
          failed=[]
          for path in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              root=ET.parse(path).getroot()
              tests += int(root.attrib.get('tests',0))
              failures += int(root.attrib.get('failures',0))
              errors += int(root.attrib.get('errors',0))
              skipped += int(root.attrib.get('skipped',0))
              for case in root.findall('.//testcase'):
                  bad = case.find('failure') or case.find('error')
                  if bad is not None:
                      failed.append(f"{case.attrib.get('classname','')}.{case.attrib.get('name','')} :: {bad.attrib.get('message','')}")
          print(f'tests={tests}')
          print(f'failures={failures}')
          print(f'errors={errors}')
          print(f'skipped={skipped}')
          print('FAILED_TESTS_BEGIN')
          for item in failed: print(item)
          print('FAILED_TESTS_END')
          PY
          echo "$GRADLE_STATUS" > stage19-diagnostic/gradle-exit-status.txt
          exit "$GRADLE_STATUS"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage19-full-suite-diagnostic
          path: |
            source/stage19-diagnostic/
            source/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
