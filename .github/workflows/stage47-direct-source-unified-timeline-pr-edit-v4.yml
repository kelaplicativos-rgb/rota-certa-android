name: Stage47 PR direct-source Timeline wiring v4

on:
  pull_request:
    branches:
      - agent/stage47-r4-unified-occupancy-step6-validation-apk
    paths:
      - .github/workflows/stage47-direct-source-unified-timeline-pr-edit-v4.yml

permissions:
  contents: write

jobs:
  persist-unified-timeline:
    if: github.event.pull_request.head.ref == 'agent/stage47-r4-step7-automatic-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROTECTED_FAROL_SHA256: 2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage47-r4-step7-automatic-identity
          fetch-depth: 1

      - name: Apply final semantic wiring to app/src
        shell: bash
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          python3 - <<'PY'
          from pathlib import Path

          def one(lines, stripped, start=0):
              hits = [i for i in range(start, len(lines)) if lines[i].strip() == stripped]
              if len(hits) != 1:
                  raise SystemExit(f'{stripped!r}: expected one match, found {len(hits)}')
              return hits[0]

          def first(lines, stripped, start=0):
              for i in range(start, len(lines)):
                  if lines[i].strip() == stripped:
                      return i
              raise SystemExit(f'{stripped!r}: no match')

          def save(path, lines):
              Path(path).write_text('\n'.join(lines) + '\n')

          # TripsActivity: Timeline is the default operational view; local LIST remains only for managing a local Trip.
          path = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt')
          lines = path.read_text().splitlines()
          i = one(lines, 'var screen by remember { mutableStateOf(if (startCreating) TripScreen.CREATE else TripScreen.LIST) }')
          lines[i:i+1] = [
              '    var screen by remember {',
              '        mutableStateOf(',
              '            when {',
              '                startCreating -> TripScreen.CREATE',
              '                initialTripId != null -> TripScreen.LIST',
              '                else -> TripScreen.TIMELINE',
              '            },',
              '        )',
              '    }',
          ]
          cancels = [j for j, line in enumerate(lines) if line.strip() == 'onCancel = { screen = TripScreen.LIST },']
          if len(cancels) != 2:
              raise SystemExit(f'expected 2 LIST cancel paths, found {len(cancels)}')
          for j in cancels:
              lines[j] = lines[j].replace('TripScreen.LIST', 'TripScreen.TIMELINE')
          msg = one(lines, 'message = "Viagem criada. Publique quando estiver pronta."')
          if lines[msg - 1].strip() != 'screen = TripScreen.LIST':
              raise SystemExit('create save return marker missing')
          lines[msg - 1] = lines[msg - 1].replace('TripScreen.LIST', 'TripScreen.TIMELINE')
          sync = one(lines, 'onRequestBlaBlaSync = { autoBlaBlaSyncToken++ },')
          indent = lines[sync][:len(lines[sync]) - len(lines[sync].lstrip())]
          lines[sync+1:sync+1] = [
              indent + 'onCreateTrip = { screen = TripScreen.CREATE },',
              indent + 'onPinShortcut = {',
              indent + '    val requested = TripShortcutInstaller.requestPinnedCreateShortcut(activity)',
              indent + '    message = if (requested) "Pedido de atalho enviado ao Android." else "O launcher não permite fixar atalhos automaticamente."',
              indent + '},',
              indent + 'onOpenOnlineSettings = { screen = TripScreen.SETTINGS },',
          ]
          back = one(lines, 'onBack = { screen = TripScreen.LIST },')
          lines[back] = lines[back].replace('onBack = { screen = TripScreen.LIST }', 'onBack = { activity.finish() }')
          settings_save = one(lines, 'store.saveOnlineSettings(it)')
          if lines[settings_save + 1].strip() != 'screen = TripScreen.LIST':
              raise SystemExit('settings save return marker missing')
          lines[settings_save + 1] = lines[settings_save + 1].replace('TripScreen.LIST', 'TripScreen.TIMELINE')
          new_button = one(lines, 'Button(onClick = { screen = TripScreen.CREATE }) { Text("Nova viagem") }')
          menu_start = new_button - 1
          online_button = one(lines, 'OutlinedButton(onClick = { screen = TripScreen.SETTINGS }) { Text("Integração online") }', menu_start)
          menu_end = online_button + 2
          if lines[menu_end].strip() != 'val onlineSettings = store.onlineSettings()':
              raise SystemExit('LIST menu boundary missing')
          lines[menu_start:menu_end] = [
              '                    OutlinedButton(onClick = { screen = TripScreen.TIMELINE }) {',
              '                        Text("Voltar à Timeline")',
              '                    }',
          ]
          empty = one(lines, 'Text("Nenhuma viagem cadastrada. Crie a primeira para começar.")')
          lines[empty] = lines[empty].replace(
              'Nenhuma viagem cadastrada. Crie a primeira para começar.',
              'Nenhuma viagem local neste aparelho. A Timeline continua exibindo publicações sincronizadas.',
          )
          save(path, lines)

          # Timeline UI: add existing Agenda actions and presentation-only trusted Base/Casa direction geo.
          path = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt')
          lines = path.read_text().splitlines()
          request = one(lines, 'onRequestBlaBlaSync: () -> Unit,')
          indent = lines[request][:len(lines[request]) - len(lines[request].lstrip())]
          lines[request+1:request+1] = [
              indent + 'onCreateTrip: () -> Unit,',
              indent + 'onPinShortcut: () -> Unit,',
              indent + 'onOpenOnlineSettings: () -> Unit,',
          ]
          merged = one(lines, 'val merged = remember(localEntries, collectorResponse) { BlaBlaTimelineAdapter.merge(localEntries, collectorResponse) }')
          lines[merged+1:merged+1] = [
              '    val directionGeo = remember(merged, trips, appSettings) {',
              '        TripTimelineGeoResolver.resolveTrustedStops(',
              '            places = merged.flatMap { listOf(it.origin, it.destination) },',
              '            trustedStops = timelineTrustedDirectionStops(trips, appSettings),',
              '        )',
              '    }',
          ]
          actions = first(lines, 'ResponsiveTripActions(listOf(')
          sync_action = one(lines, 'ResponsiveTripAction(if (showSync) "Fechar sincronização" else "Sincronizar BlaBlaCar") { showSync = !showSync },', actions)
          lines[sync_action:sync_action] = [
              '        ResponsiveTripAction("Nova viagem", onCreateTrip),',
              '        ResponsiveTripAction("Fixar atalho", onPinShortcut),',
              '        ResponsiveTripAction("Integração online", onOpenOnlineSettings),',
          ]
          radius_arg = one(lines, 'homeRadiusKm = appSettings.homeRadiusKm,')
          lines.insert(radius_arg + 1, '            directionGeo = directionGeo,')
          radius_param = one(lines, 'homeRadiusKm: Double,')
          lines.insert(radius_param + 1, '    directionGeo: Map<String, TimelineGeoPoint>,')
          old_direction = one(lines, 'val baseDirection = timelineBaseDirection(trip, homeCoordinate, homeRadiusKm)')
          if 'directionPrefix' not in lines[old_direction + 1] or '${entry.origin} → ${entry.destination}' not in lines[old_direction + 2]:
              raise SystemExit('old direction presentation block missing')
          lines[old_direction:old_direction+3] = [
              '            val baseDirection = timelineBaseDirectionLabel(entry, trip, directionGeo, homeCoordinate, homeRadiusKm)',
              '            baseDirection?.let { Text(it, style = MaterialTheme.typography.bodySmall) }',
              '            Text("${entry.origin} → ${entry.destination}", style = MaterialTheme.typography.titleMedium)',
          ]
          save(path, lines)

          # Version follows current convention.
          build = Path('app/build.gradle.kts')
          text = build.read_text()
          if text.count('versionCode = 5532') != 1 or text.count('versionName = "0.1.239"') != 1:
              raise SystemExit('unexpected build version markers')
          build.write_text(text.replace('versionCode = 5532', 'versionCode = 5533').replace('versionName = "0.1.239"', 'versionName = "0.1.240"'))

          # Direct-source workflows: version + new focused test; preserve each file's own indentation.
          for workflow in [
              Path('.github/workflows/stage47-direct-source-physical-apk.yml'),
              Path('.github/workflows/stage47-direct-source-validation.yml'),
          ]:
              text = workflow.read_text()
              text = text.replace('0.1.239', '0.1.240')
              text = text.replace("EXPECTED_VERSION_CODE: '5532'", "EXPECTED_VERSION_CODE: '5533'")
              text = text.replace('versionCode = 5532', 'versionCode = 5533')
              text = text.replace('version=0.1.240/5532', 'version=0.1.240/5533')
              wlines = text.splitlines()
              target = "--tests 'br.com.mapeiaia.rotacerta.trips.TripTimelineExternalQuickPassengerStage47Test' \\"
              matches = [i for i, line in enumerate(wlines) if line.strip() == target]
              if len(matches) != 1:
                  raise SystemExit(f'{workflow}: expected one focused test anchor, found {len(matches)}')
              if not any('TripTimelineBaseDirectionStage47Test' in line for line in wlines):
                  j = matches[0]
                  prefix = wlines[j][:len(wlines[j]) - len(wlines[j].lstrip())]
                  wlines.insert(j + 1, prefix + "--tests 'br.com.mapeiaia.rotacerta.trips.TripTimelineBaseDirectionStage47Test' \\")
              workflow.write_text('\n'.join(wlines) + '\n')

          # Helpers must not remain in final source tree.
          for helper in Path('.github/workflows').glob('stage47-direct-source-unified-timeline*.yml'):
              helper.unlink()
          PY

          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          test -z "$(git diff --name-only -- "$FAROL")"
          grep -Fq 'else -> TripScreen.TIMELINE' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'timelineBaseDirectionLabel(entry, trip, directionGeo' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'ResponsiveTripAction("Nova viagem", onCreateTrip)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'versionCode = 5533' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.240"' app/build.gradle.kts
          grep -Fq 'TripTimelineBaseDirectionStage47Test' .github/workflows/stage47-direct-source-physical-apk.yml
          grep -Fq 'TripTimelineBaseDirectionStage47Test' .github/workflows/stage47-direct-source-validation.yml
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'stage47-direct-source-unified-timeline*.yml' -print -quit)"
          git diff --check

      - name: Commit only final direct source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt \
            app/build.gradle.kts \
            .github/workflows/stage47-direct-source-physical-apk.yml \
            .github/workflows/stage47-direct-source-validation.yml
          git add -u -- .github/workflows
          ! git diff --cached --name-only | grep -F 'LiveRideAccessibilityService.kt'
          git commit -m 'Timeline: unify agenda operational view'
          git push origin HEAD:agent/stage47-r4-step7-automatic-identity
          echo "source_head=$(git rev-parse HEAD)"
          echo 'direct_source=true'
          echo 'fixed_historical_source_checkout=false'
          echo 'stage47_materializer_used=false'
          echo 'farol_untouched=true'
