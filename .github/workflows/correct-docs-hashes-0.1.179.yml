name: Correct Rota Certa docs hashes 0.1.179

on:
  push:
    branches: [agent/customizable-shortcut-grid-0.1.179]
    paths:
      - .github/workflows/correct-docs-hashes-0.1.179.yml

permissions:
  contents: write

jobs:
  correct-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/customizable-shortcut-grid-0.1.179
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Correct final hashes
        run: python scripts/correct_docs_hashes_0179.py

      - name: Commit documentation correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md
          git commit -m "docs: corrigir hashes finais da versão 0.1.179"
          git push origin HEAD:agent/customizable-shortcut-grid-0.1.179
