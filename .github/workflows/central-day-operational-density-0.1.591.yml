name: Central do Dia operational density 0.1.591

on:
  push:
    branches:
      - agent/central-day-operational-density-0.1.591
    paths:
      - '.github/workflows/central-day-operational-density-0.1.591.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/assets/release_history.json'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/CentralDoDia0552.kt'
      - 'app/src/test/java/br/com/mapeiaia/rotacerta/trips/CentralDoDia0552Test.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: central-day-operational-density-0591-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_API_KEY: central_day_0591_ci_dummy_key
      EXPECTED_VERSION_CODE: '5882'
      EXPECTED_VERSION_NAME: '0.1.591'
      BASE_SHA: 'e2afcf82809aa1b582fd8dcda5813dc3c9022ccf'

    steps:
      - name: Checkout exact triggering HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact source and isolated UI diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check "$BASE_SHA"...HEAD
          grep -Fq 'val releaseVersionCode = 5_882' app/build.gradle.kts
          grep -Fq 'val releaseVersionName = "0.1.591"' app/build.gradle.kts
          grep -Fq '"version": "0.1.591"' app/src/main/assets/release_history.json
          grep -Fq 'expandedPassengerTripIds0591' app/src/main/java/br/com/mapeiaia/rotacerta/trips/CentralDoDia0552.kt
          grep -Fq '↻ Corrigir' app/src/main/java/br/com/mapeiaia/rotacerta/trips/CentralDoDia0552.kt
          if grep -Fq 'Text("Central do Dia", style = MaterialTheme.typography.titleLarge)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/CentralDoDia0552.kt; then
            echo "Duplicate Central do Dia title returned" >&2
            exit 1
          fi
          git diff --name-only "$BASE_SHA"...HEAD | sort | tee /tmp/changed.txt
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          test -s "$FAROL"
          sha256sum "$FAROL" | tee /tmp/farol-before.sha256
          if grep -Fqx "$FAROL" /tmp/changed.txt; then
            echo "Protected FAROL changed unexpectedly" >&2
            exit 1
          fi
          printf '%s\n' "$GITHUB_SHA" | tee /tmp/source-head.txt
          printf '%s\n' "$GITHUB_REF_NAME" | tee /tmp/source-branch.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          test -d "$SDK_ROOT/platforms/android-35"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          test -n "$BUILD_TOOLS"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Central do Dia regression tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --tests 'br.com.mapeiaia.rotacerta.trips.CentralDoDia0552Test' --no-daemon --max-workers=1 --no-parallel --stacktrace | tee /tmp/central-tests.log

      - name: Compare full Android unit-test failures against exact 0.1.590 base
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/rc-0590 "$BASE_SHA"
          chmod +x /tmp/rc-0590/gradlew

          set +e
          (
            cd /tmp/rc-0590
            ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=1 --no-parallel --stacktrace
          ) > /tmp/base-tests.log 2>&1
          BASE_EXIT=$?
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=1 --no-parallel --stacktrace > /tmp/head-tests.log 2>&1
          HEAD_EXIT=$?
          set -e

          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          def failures(root):
              result = set()
              result_dir = pathlib.Path(root) / "app/build/test-results/testDebugUnitTest"
              for file in result_dir.glob("*.xml"):
                  tree = ET.parse(file)
                  for case in tree.getroot().iter("testcase"):
                      if case.find("failure") is not None or case.find("error") is not None:
                          result.add(f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}")
              return result

          base = failures("/tmp/rc-0590")
          head = failures(".")
          new = sorted(head - base)
          pathlib.Path("/tmp/new-failures.txt").write_text("\n".join(new) + ("\n" if new else ""))
          print(f"baseline_failures={len(base)}")
          print(f"head_failures={len(head)}")
          print(f"new_failures={len(new)}")
          if new:
              print("\n".join(new))
              raise SystemExit(1)
          PY

          echo "base_gradle_exit=$BASE_EXIT" | tee /tmp/unit-regression-summary.txt
          echo "head_gradle_exit=$HEAD_EXIT" | tee -a /tmp/unit-regression-summary.txt
          echo "new_failure_count=$(wc -l < /tmp/new-failures.txt)" | tee -a /tmp/unit-regression-summary.txt

      - name: Assemble exact-head APK
        shell: bash
        run: |
          set -euo pipefail
          export ROTA_CERTA_GIT_SHA="$GITHUB_SHA"
          export ROTA_CERTA_GIT_BRANCH="$GITHUB_REF_NAME"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" > /tmp/zip-integrity.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'Verified' /tmp/apksigner.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -Fq "$GITHUB_SHA" /tmp/dex-strings.txt

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          sha256sum "$FAROL" | tee /tmp/farol-after.sha256
          diff -u /tmp/farol-before.sha256 /tmp/farol-after.sha256
          OUT=/tmp/0591
          mkdir -p "$OUT"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          FINAL="$OUT/rota-certa-$EXPECTED_VERSION_NAME-$EXPECTED_VERSION_CODE-$SHORT_SHA.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$FINAL"
          sha256sum "$FINAL" | tee "$OUT/apk.sha256"
          cp /tmp/central-tests.log /tmp/unit-regression-summary.txt /tmp/new-failures.txt /tmp/aapt.txt /tmp/apksigner.txt /tmp/zip-integrity.txt /tmp/source-head.txt /tmp/source-branch.txt /tmp/changed.txt "$OUT/"
          cat > "$OUT/final-status.txt" <<EOF
          package=br.com.mapeiaia.rotacerta
          version=$EXPECTED_VERSION_NAME/$EXPECTED_VERSION_CODE
          source_head=$GITHUB_SHA
          source_branch=$GITHUB_REF_NAME
          duplicate_title_removed=PASS
          compact_summary=PASS_BY_TEST
          passengers_collapsed_by_default=PASS_BY_TEST
          compact_trip_repair_action=PASS_BY_TEST
          farol_untouched=PASS
          physical_approval=PENDING_SAMSUNG_SM_S911B_ANDROID_16
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.591-5882-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0591
