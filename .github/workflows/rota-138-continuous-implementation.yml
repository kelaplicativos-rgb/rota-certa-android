name: Rota 0.1.138 Continuous Implementation

on:
  pull_request:
    branches:
      - codex/manual-selection-no-models-ui-staged
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: rota-138-implementation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepare patches and Git
        run: |
          set -euo pipefail
          mkdir -p ci-138/logs ci-138/evidence /tmp/rota138patches
          base64 --decode patches/rota138-patches.tar.gz.b64 | tar -xz -C /tmp/rota138patches
          for patch in /tmp/rota138patches/stage{1..6}.patch; do
            test -s "$patch"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage 1 - gesture controller
        run: |
          set -o pipefail
          git apply --check /tmp/rota138patches/stage1.patch
          git apply /tmp/rota138patches/stage1.patch
          gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee ci-138/logs/stage1-tests.log
          git add app
          git commit -m "etapa 1: separar toque simples, duplo e arraste na grade"

      - name: Stage 2 - copy all text and create reply
        run: |
          set -o pipefail
          git apply --check /tmp/rota138patches/stage2.patch
          git apply /tmp/rota138patches/stage2.patch
          gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee ci-138/logs/stage2-tests.log
          git add app
          git commit -m "etapa 2: adicionar cópia integral e criação rápida de resposta"

      - name: Stage 3 - GPS shortcut actions
        run: |
          set -o pipefail
          git apply --check /tmp/rota138patches/stage3.patch
          git apply /tmp/rota138patches/stage3.patch
          gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee ci-138/logs/stage3-tests.log
          git add app
          git commit -m "etapa 3: adicionar atalhos rápidos de radar alerta local e destino"

      - name: Stage 4 - alert distance and place search
        run: |
          set -o pipefail
          git apply --check /tmp/rota138patches/stage4.patch
          git apply /tmp/rota138patches/stage4.patch
          gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee ci-138/logs/stage4-tests.log
          git add app
          git commit -m "etapa 4: reorganizar distâncias de alerta e busca de locais"

      - name: Stage 5 - manual app and screen capture
        run: |
          set -o pipefail
          git apply --check /tmp/rota138patches/stage5.patch
          git apply /tmp/rota138patches/stage5.patch
          gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee ci-138/logs/stage5-tests.log
          git add app
          git commit -m "etapa 5: restaurar captura manual isolada do farol"

      - name: Stage 6 - consolidate Google Maps key
        run: |
          set -o pipefail
          git apply --check /tmp/rota138patches/stage6.patch
          git apply /tmp/rota138patches/stage6.patch
          sed -i 's/2_000 + it/3_000 + it/' app/build.gradle.kts
          sed -i 's/appVersionCode = ciVersionCode ?: 2_001/appVersionCode = ciVersionCode ?: 3_001/' app/build.gradle.kts
          gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee ci-138/logs/stage6-tests.log
          git add app
          git commit -m "etapa 6: centralizar chave do Maps e atualizar versão 0.1.138"

      - name: Final tests twice with immutable source
        run: |
          set -euo pipefail
          before="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee ci-138/logs/final-tests-first.log
          middle="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          gradle testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee ci-138/logs/final-tests-second.log
          after="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test "$before" = "$middle"
          test "$middle" = "$after"
          printf 'SOURCE_HASH=%s\n' "$after" > ci-138/evidence/source-tree-hash.txt

      - name: Android Lint
        run: |
          set -o pipefail
          gradle lintDebug --no-daemon --stacktrace --console=plain 2>&1 | tee ci-138/logs/lint.log

      - name: Build APK twice and keep source immutable
        run: |
          set -euo pipefail
          before="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          gradle clean assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee ci-138/logs/assemble-first.log
          middle="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          cp app/build/outputs/apk/debug/app-debug.apk ci-138/evidence/rota-certa-0.1.138-first.apk
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee ci-138/logs/assemble-second.log
          after="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test "$before" = "$middle"
          test "$middle" = "$after"
          cp app/build/outputs/apk/debug/app-debug.apk ci-138/evidence/rota-certa-0.1.138.apk
          unzip -tq ci-138/evidence/rota-certa-0.1.138.apk
          sha256sum ci-138/evidence/rota-certa-0.1.138.apk > ci-138/evidence/apk-sha256.txt

      - name: Verify APK and feature contract
        run: |
          set -euo pipefail
          APK=ci-138/evidence/rota-certa-0.1.138.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee ci-138/evidence/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee ci-138/evidence/aapt-badging.txt
          grep -q "package: name='br.com.mapeiaia.rotacerta'" ci-138/evidence/aapt-badging.txt
          grep -q "versionName='0.1.138'" ci-138/evidence/aapt-badging.txt
          VERSION_CODE="$(sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" ci-138/evidence/aapt-badging.txt | head -1)"
          test -n "$VERSION_CODE"
          test "$VERSION_CODE" -gt 2022
          printf 'VERSION_CODE=%s\n' "$VERSION_CODE" > ci-138/evidence/version.txt

          grep -q 'onSingleTapConfirmed' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt
          grep -q 'onDoubleTap' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt
          grep -q 'Texto completo copiado' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'CreateRadarAtCurrentLocation' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutModule.kt
          grep -q 'EXTRA_QUICK_REPLY_CREATE' app/src/main/java/br/com/mapeiaia/rotacerta/QuickRepliesActivity.kt
          grep -q 'ManualAppScreenCaptureStore' app/src/main/java/br/com/mapeiaia/rotacerta/ManualAppScreenCaptureStore.kt
          ! grep -q 'label = { Text("Chave Google Maps API") }' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt

          grep -RInE 'com\.app99\.driver|com\.ubercab\.driver|sinet\.startup\.indriver|InDriveCoreModule|UberCoreModule|NinetyNineCoreModule|RideCardTemplate|FastRideCardMatcher|AutomaticRideCapture|requiredRegisteredRideCard|requireRegisteredRideCard|monitor99|monitorUber|monitorInDrive' app/src/main/java > ci-138/evidence/forbidden-source.txt || true
          test ! -s ci-138/evidence/forbidden-source.txt
          unzip -p "$APK" 'classes*.dex' | strings > ci-138/evidence/dex-strings.txt
          grep -Ei 'com\.app99\.driver|com\.ubercab\.driver|sinet\.startup\.indriver|InDriveCoreModule|UberCoreModule|NinetyNineCoreModule|RideCardTemplate|FastRideCardMatcher|AutomaticRideCapture' ci-138/evidence/dex-strings.txt > ci-138/evidence/forbidden-dex.txt || true
          test ! -s ci-138/evidence/forbidden-dex.txt

      - name: Write validation report and remove migration files
        run: |
          set -euo pipefail
          cat > ci-138/evidence/final-validation.txt <<EOF
          BRANCH=$HEAD_BRANCH
          VERSION_NAME=0.1.138
          GESTURE_SINGLE_DOUBLE_DRAG=approved
          COPY_ALL_VISIBLE_TEXT=approved
          CREATE_QUICK_REPLY=approved
          CREATE_RADAR_AT_GPS=approved
          CREATE_NAMED_ALERT=approved
          CREATE_NAMED_SAVED_PLACE=approved
          DEFINE_DESTINATION_AT_GPS=approved
          ALERT_DISTANCE_200_500_1000=approved
          PLACE_SEARCH_OUTSIDE_EXPANDER=approved
          MANUAL_APP_SCREEN_CAPTURE=approved
          CAPTURE_ISOLATED_FROM_FAROL=approved
          GOOGLE_MAPS_SINGLE_LOGICAL_SOURCE=approved
          MANUAL_PACKAGE_SELECTION_ONLY=preserved
          CARD_MODELS=absent
          TESTS_AFTER_EACH_STAGE=approved
          FINAL_TESTS_TWICE=approved
          LINT=approved
          APK_BUILT_TWICE=approved
          APK_SIGNATURE=approved
          EOF
          rm -f .github/workflows/rota-138-source-snapshot.yml
          rm -f .github/workflows/rota-138-continuous-implementation.yml
          rm -f patches/0.1.138-stage1.patch patches/rota138-patches.tar.gz.b64
          rmdir patches 2>/dev/null || true
          git add -A .github patches docs
          git commit -m "ci: concluir implementação validada da versão 0.1.138"

      - name: Push validated staged commits
        run: git push origin HEAD:"$HEAD_BRANCH"

      - name: Upload validated APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.138-validated
          path: |
            ci-138/evidence
            ci-138/logs
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: error

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.138-failure
          path: |
            ci-138
            app/src
            app/build.gradle.kts
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
