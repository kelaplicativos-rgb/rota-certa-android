name: Build Rota Certa 0.1.194 universal destination boundary

on:
  pull_request:
    branches: [agent/forensic-incident-monitor-0.1.193]
    paths:
      - .github/workflows/build-rota-certa-0.1.194.yml
      - scripts/build_rota_certa_0194.sh
      - scripts/apply_farol_universal_card_fix_0194.py
  workflow_dispatch:

concurrency:
  group: rota-certa-0.1.194-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Verify protected source commit
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42"

      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
          path: patches

      - name: Verify cumulative patch commit
        working-directory: patches
        env:
          EXPECTED_PATCH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_PATCH_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate 0.1.194 transformation syntax
        working-directory: patches
        run: python3 -m py_compile scripts/apply_farol_universal_card_fix_0194.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and validate 0.1.194
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-0194
        run: |
          set -o pipefail
          bash ../patches/scripts/build_rota_certa_0194.sh ../patches 2>&1 | tee build-0.1.194.log

      - name: Upload failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.194-universal-card-failure
          path: |
            source/build-0.1.194.log
            source/app/build/reports/tests/
            source/app/build/reports/lint-results-debug.html
          retention-days: 30
          if-no-files-found: warn

      - name: Upload validated APK
        id: artifact_upload
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.194-universal-card-confirmation-validated
          path: source/artifact-0.1.194/
          retention-days: 90
          if-no-files-found: error

      - name: Publish isolated prerelease candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          APK_SOURCE='source/artifact-0.1.194/rota-certa-0.1.194-correcao-universal-cards-validada-em-ci.apk'
          APK_CANDIDATE="${RUNNER_TEMP}/rota-certa-0.1.194-candidate.apk"
          cp "$APK_SOURCE" "$APK_CANDIDATE"
          EXPECTED_SHA="$(awk '{print $1}' source/artifact-0.1.194/sha256.txt)"
          ACTUAL_SHA="$(sha256sum "$APK_CANDIDATE" | awk '{print $1}')"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          TEST_COUNT="$(awk -F= '/^tests=/{print $2}' source/artifact-0.1.194/test-count.txt)"
          cat > "${RUNNER_TEMP}/candidate-notes.md" <<NOTES
          Rota Certa 0.1.194 — correção universal do limite entre destinos

          Candidato isolado. Não substitui o link permanente latest.

          - pacote: br.com.mapeiaia.rotacerta
          - versão: 0.1.194
          - versionCode: 5478
          - head validado em CI: ${VALIDATED_HEAD}
          - testes: ${TEST_COUNT}; falhas: 0
          - Android Lint: aprovado
          - clean assembleDebug: aprovado
          - assinatura APK v2: conferida
          - SHA-256: ${ACTUAL_SHA}
          - POIs de categoria forte podem permanecer como segundo local após rua completa
          - Parque só é separado como segundo local quando traz localidade interna explícita, como Parque do Carmo (Jardim ...)
          - bairros chamados Parque continuam podendo compor o endereço anterior em vez de criar destino falso
          - endereços realmente quebrados entre linhas continuam sendo recompostos
          - nenhum reconhecimento genérico novo de POI desconhecido foi introduzido
          - gate visual, anti-mistura de cards, FailedCardRecovery, DecisionEngine, rota, serviço principal, Manifest e permissões permanecem protegidos
          NOTES
          if gh release view ci-0.1.194 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete ci-0.1.194 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create ci-0.1.194 "$APK_CANDIDATE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VALIDATED_HEAD" \
            --title 'Rota Certa 0.1.194 — correção universal do limite entre destinos' \
            --notes-file "${RUNNER_TEMP}/candidate-notes.md" \
            --prerelease

      - name: Verify public candidate byte for byte
        run: |
          set -euo pipefail
          URL='https://github.com/kelaplicativos-rgb/rota-certa-android/releases/download/ci-0.1.194/rota-certa-0.1.194-candidate.apk'
          curl --fail --location --retry 6 --retry-all-errors --output downloaded-candidate.apk "$URL"
          test "$(sha256sum downloaded-candidate.apk | awk '{print $1}')" = "$(awk '{print $1}' source/artifact-0.1.194/sha256.txt)"

      - name: Comment validated evidence
        if: success() && github.event_name == 'pull_request'
        working-directory: patches
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          TEST_COUNT="$(awk -F= '/^tests=/{print $2}' ../source/artifact-0.1.194/test-count.txt)"
          APK_SHA="$(awk '{print $1}' ../source/artifact-0.1.194/sha256.txt)"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "CI 0.1.194 concluída no run ${RUN_ID}. Correção limitada ao parser: categorias fortes de POI podem permanecer como segundo local após rua completa; Parque só é separado com localidade interna explícita, preservando bairros Parque como continuação de endereço. Gate/anti-mistura, FailedCardRecovery, DecisionEngine e rota permaneceram protegidos. Testes: ${TEST_COUNT}; falhas: 0. SHA-256: ${APK_SHA}. Validação física nos aplicativos continua obrigatória."
