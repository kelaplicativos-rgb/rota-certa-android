name: Rota Certa 0.1.512 canonical Timeline backend deploy

on:
  push:
    branches:
      - agent/canonical-segment-root-cause-0.1.509
    paths:
      - '.github/workflows/agenda-0356-backend-deploy.yml'
      - 'trip-platform/functions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-timeline-backend-0512
  cancel-in-progress: true

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout exact triggering HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact canonical source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'versionCode = 5804' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.512"' app/build.gradle.kts
          grep -Fq 'PASSENGER_PROJECTION_INCOMPLETE' trip-platform/functions/index.js
          grep -Fq 'REVISION_INCOMPATIBLE' trip-platform/functions/index.js
          grep -Fq 'PRIVATE_PROJECTION_STALE' trip-platform/functions/index.js
          grep -Fq 'tripId: canonicalTripId0499' trip-platform/functions/index.js
          printf '%s\n' "$GITHUB_SHA" | tee /tmp/backend-source-head.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate canonical backend and public privacy contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --test             trip-platform/functions/test/timeline-canonical-backend-0494.test.js             trip-platform/functions/test/backend-canonical-authority-0468.test.js             trip-platform/functions/test/agenda-public-read-only-0475.test.js             trip-platform/functions/test/agenda-public-timeline-reflection-0425.test.js             | tee /tmp/backend-tests-0512.log

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase deployment credential is missing." >&2
            exit 3
          fi

      - name: Install Functions dependencies
        shell: bash
        run: npm --prefix trip-platform/functions install --no-audit --no-fund

      - name: Deploy exact HEAD trip-api only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api:tripApi --non-interactive --force --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api:tripApi --non-interactive --force
          fi

      - name: Smoke live canonical endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://rota-certa-7ccc8.web.app
          curl --retry 12 --retry-delay 3 --fail --silent --show-error "$BASE/v1/health" | tee /tmp/live-health-0512.json
          grep -Fq '"ok":true' /tmp/live-health-0512.json
          CODE="$(curl --retry 5 --retry-delay 2 --silent --show-error -o /tmp/canonical-unauth.json -w '%{http_code}'             "$BASE/v1/driver/trips/sync-state?includePastForVerification=1&timelineProjection=1")"
          test "$CODE" = "401"
          echo "backend_source_head=$GITHUB_SHA"
          echo "canonical_endpoint_auth_guard=PASS"
          echo "hosting_deploy=NOT_PERFORMED"
