name: Rota Certa 0.1.521 canonical immediate Agenda backend

on:
  push:
    branches:
      - agent/canonical-segment-root-cause-0.1.509
    paths:
      - '.github/workflows/agenda-0356-backend-deploy.yml'
      - 'trip-platform/functions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-timeline-backend-0516
  cancel-in-progress: true

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout exact triggering HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact canonical source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'versionCode = 5813' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.521"' app/build.gradle.kts
          grep -Fq 'PASSENGER_PROJECTION_INCOMPLETE' trip-platform/functions/index.js
          grep -Fq 'REVISION_INCOMPATIBLE' trip-platform/functions/index.js
          grep -Fq 'canonicalTimelinePrivateStop0513' trip-platform/functions/index.js
          grep -Fq 'canonicalPrivateBookingMetadata0513' trip-platform/functions/index.js
          ! grep -Fq 'canonicalIssues0494.push("PRIVATE_PROJECTION_STALE")' trip-platform/functions/index.js
          grep -Fq 'tripId: canonicalTripId0499' trip-platform/functions/index.js
          grep -Fq 'collectorRead: false' trip-platform/functions/index.js
          grep -Fq 'collectorFallback: false' trip-platform/functions/index.js
          printf '%s\n' "$GITHUB_SHA" | tee /tmp/backend-source-head.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate canonical backend and public privacy contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --test             trip-platform/functions/test/timeline-canonical-backend-0494.test.js             trip-platform/functions/test/backend-canonical-authority-0468.test.js             trip-platform/functions/test/agenda-public-read-only-0475.test.js             trip-platform/functions/test/agenda-public-timeline-reflection-0425.test.js             | tee /tmp/backend-tests-0516.log

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase deployment credential is missing." >&2
            exit 3
          fi

      - name: Install Functions dependencies
        shell: bash
        run: npm --prefix trip-platform/functions install --no-audit --no-fund

      - name: Authenticate Google Cloud for direct tripApi deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Diagnose Cloud Billing write gate
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          PROJECT_JSON="$(gcloud billing projects describe "$PROJECT" --format=json 2>/tmp/billing-project.err || true)"
          BILLING_ACCOUNT="$(printf '%s' "$PROJECT_JSON" | jq -r '.billingAccountName // empty')"
          BILLING_ENABLED="$(printf '%s' "$PROJECT_JSON" | jq -r '.billingEnabled // false')"
          OPEN_ACCOUNTS="$(gcloud billing accounts list --filter='open=true' --format='value(name)' 2>/tmp/billing-list.err || true)"
          OPEN_COUNT="$(printf '%s\n' "$OPEN_ACCOUNTS" | sed '/^$/d' | wc -l | tr -d ' ')"
          LINKED_OPEN="unknown"
          if [ -n "$BILLING_ACCOUNT" ]; then
            LINKED_OPEN="$(gcloud billing accounts list --filter="name=$BILLING_ACCOUNT" --format='value(open)' 2>/tmp/billing-linked.err | head -1 || true)"
            [ -n "$LINKED_OPEN" ] || LINKED_OPEN="unknown"
          fi
          echo "billing_diagnostic_project=$PROJECT"
          echo "billing_account_linked=$([ -n "$BILLING_ACCOUNT" ] && echo true || echo false)"
          echo "billing_enabled=$BILLING_ENABLED"
          echo "linked_billing_account_open=$LINKED_OPEN"
          echo "accessible_open_billing_accounts=$OPEN_COUNT"

          PROJECT_PERMISSION=false
          TOKEN="$(gcloud auth print-access-token)"
          if curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d '{"permissions":["resourcemanager.projects.createBillingAssignment"]}'             "https://cloudresourcemanager.googleapis.com/v1/projects/$PROJECT:testIamPermissions"             | jq -e '.permissions | index("resourcemanager.projects.createBillingAssignment") != null' >/dev/null 2>&1; then
            PROJECT_PERMISSION=true
          fi
          echo "project_can_create_billing_assignment=$PROJECT_PERMISSION"

          BILLING_PERMISSION=false
          PERMISSION_ACCOUNT="$BILLING_ACCOUNT"
          if [ -z "$PERMISSION_ACCOUNT" ] && [ "$OPEN_COUNT" = "1" ]; then
            PERMISSION_ACCOUNT="$(printf '%s\n' "$OPEN_ACCOUNTS" | sed '/^$/d' | head -1)"
          fi
          if [ -n "$PERMISSION_ACCOUNT" ]; then
            if curl --fail --silent --show-error               -H "Authorization: Bearer $TOKEN"               -H 'Content-Type: application/json'               -d '{"permissions":["billing.resourceAssociations.create"]}'               "https://cloudbilling.googleapis.com/v1/$PERMISSION_ACCOUNT:testIamPermissions"               | jq -e '.permissions | index("billing.resourceAssociations.create") != null' >/dev/null 2>&1; then
              BILLING_PERMISSION=true
            fi
          fi
          echo "billing_account_can_create_resource_association=$BILLING_PERMISSION"

          if [ "$BILLING_ENABLED" = "true" ] && [ "$LINKED_OPEN" = "True" -o "$LINKED_OPEN" = "true" ]; then
            echo "billing_gate=ENABLED_OPEN"
          elif [ -n "$BILLING_ACCOUNT" ]; then
            echo "billing_gate=LINKED_BUT_DISABLED_OR_CLOSED"
          elif [ "$OPEN_COUNT" = "1" ]; then
            echo "billing_gate=UNLINKED_SINGLE_OPEN_ACCOUNT_AVAILABLE"
          elif [ "$OPEN_COUNT" -gt 1 ]; then
            echo "billing_gate=UNLINKED_MULTIPLE_OPEN_ACCOUNTS"
          else
            echo "billing_gate=NO_OPEN_BILLING_ACCOUNT_VISIBLE"
          fi

      - name: Deploy exact HEAD tripApi without Secret Manager dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          gcloud functions deploy tripApi             --gen2             --project="$PROJECT"             --region=southamerica-east1             --runtime=nodejs20             --source=trip-platform/functions             --entry-point=tripApi             --trigger-http             --allow-unauthenticated             --clear-secrets             --update-env-vars="ROTA_CERTA_BACKEND_GIT_SHA=$GITHUB_SHA"             --quiet

      - name: Smoke live canonical endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://rota-certa-7ccc8.web.app
          curl --retry 20 --retry-delay 3 --fail --silent --show-error "$BASE/v1/health" | tee /tmp/live-health-0516.json
          grep -Fq '"ok":true' /tmp/live-health-0516.json
          grep -Fq "\"backendGitSha\":\"$GITHUB_SHA\"" /tmp/live-health-0516.json
          CODE="$(curl --retry 5 --retry-delay 2 --silent --show-error -o /tmp/canonical-unauth.json -w '%{http_code}'             "$BASE/v1/driver/trips/sync-state?includePastForVerification=1&timelineProjection=1")"
          test "$CODE" = "401"
          echo "backend_source_head=$GITHUB_SHA"
          echo "canonical_endpoint_auth_guard=PASS"
          echo "secret_manager_dependency=REMOVED_FROM_TRIP_API"
          echo "hosting_deploy=NOT_PERFORMED"
