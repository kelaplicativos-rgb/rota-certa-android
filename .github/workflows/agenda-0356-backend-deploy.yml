name: Rota Certa 0.1.359 flexible public Agenda slug backend deploy

on:
  push:
    branches:
      - agent/agenda-reservation-approval-0.1.356
    paths:
      - '.github/workflows/agenda-0356-backend-deploy.yml'
      - 'trip-platform/functions/**'
      - 'trip-platform/public/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-0356-backend-deploy
  cancel-in-progress: true

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agenda-reservation-approval-0.1.356
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate reservation approval backend
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/public/app.js
          node --test trip-platform/functions/test/*.test.js
          grep -Fq 'mutateDriverBookingDecision' trip-platform/functions/index.js
          grep -Fq 'RESERVATION_REQUESTED' trip-platform/functions/index.js
          grep -Fq 'pending_reservations_require_decision' trip-platform/functions/index.js
          grep -Fq 'AGUARDANDO APROVAÇÃO DO MOTORISTA' trip-platform/public/app.js
          grep -Fq 'SOLICITAÇÃO NÃO APROVADA' trip-platform/public/app.js
          grep -Fq 'function seatLimitText' trip-platform/public/app.js
          grep -Fq 'function openTripSeatPicker' trip-platform/public/app.js
          grep -Fq 'currentSeatCapacityMessage' trip-platform/functions/index.js
          grep -Fq 'availableSeats: available' trip-platform/functions/index.js
          grep -Fq 'function publicAgendaUrlFor' trip-platform/functions/index.js
          grep -Fq 'getPublicDriverAgenda(res, req, parts[3], "", true)' trip-platform/functions/index.js
          grep -Fq 'function publicSlugFromPath' trip-platform/public/app.js
          node --test trip-platform/functions/test/public-short-agenda-link-0358.test.js

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase credential is missing."
            exit 3
          fi

      - name: Install backend dependencies
        shell: bash
        run: npm --prefix trip-platform/functions install --no-audit --no-fund

      - name: Deploy Agenda backend and hosting
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force
          fi

      - name: Smoke deployed 0.1.359 flexible-slug contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://rota-certa-7ccc8.web.app
          curl --retry 8 --retry-delay 3 --fail --silent --show-error "$BASE/v1/health" | grep -F '"ok":true'
          BUST="$(date +%s%N)"
          for attempt in $(seq 1 24); do
            curl --fail --silent --show-error "$BASE/app.js?v=$BUST-$attempt" -o /tmp/live-app.js || true
            if grep -Fq 'AGUARDANDO APROVAÇÃO DO MOTORISTA' /tmp/live-app.js \
              && grep -Fq 'SOLICITAÇÃO NÃO APROVADA' /tmp/live-app.js \
              && grep -Fq 'function seatLimitText' /tmp/live-app.js \
              && grep -Fq 'function openTripSeatPicker' /tmp/live-app.js \
              && grep -Fq 'function publicSlugFromPath' /tmp/live-app.js \
              && grep -Fq '/v1/public/agenda/' /tmp/live-app.js; then
              curl --fail --silent --show-error --dump-header /tmp/slug.headers "$BASE/viagem-certa" -o /tmp/slug.html
              grep -Fq 'Rota Certa' /tmp/slug.html
              curl --fail --silent --show-error --dump-header /tmp/agenda-slug.headers "$BASE/agenda" -o /tmp/agenda-slug.html
              grep -Fq 'Rota Certa' /tmp/agenda-slug.html
              if grep -Eiq '^location:.*(motorista=|agenda=)' /tmp/slug.headers /tmp/agenda-slug.headers; then
                echo "Short route redirected to a technical token URL."
                exit 1
              fi
              exit 0
            fi
            sleep 3
          done
          echo "Hosting 0.1.359 flexible-slug contract not observed."
          exit 1
