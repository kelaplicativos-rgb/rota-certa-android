name: Rota Certa 0.1.375 live incremental capacity backend deploy

on:
  push:
    branches:
      - agent/fix-public-sync-single-flight-0.1.373
    paths:
      - '.github/workflows/agenda-0356-backend-deploy.yml'
      - 'trip-platform/functions/**'
      - 'trip-platform/public/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-0375-live-capacity-deploy
  cancel-in-progress: true

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact source and live-capacity contract
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f trip-platform/functions/index.js
          test -f trip-platform/public/app.js
          grep -Fq 'async function reconcileDriverCapacitySnapshot' trip-platform/functions/index.js
          grep -Fq 'parts[4] === "capacity-snapshot"' trip-platform/functions/index.js
          grep -Fq 'capacity < 0' trip-platform/functions/index.js
          grep -Fq 'capacitySnapshotRevision' trip-platform/functions/index.js
          grep -Fq 'capacityReliable: true' trip-platform/functions/index.js
          grep -Fq 'function publicAvailabilityLabel' trip-platform/public/app.js
          grep -Fq '🪑 LOTADO' trip-platform/public/app.js
          grep -Fq 'Disponibilidade sendo atualizada' trip-platform/public/app.js
          echo "SOURCE_HEAD=$SOURCE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate public capacity contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/public/app.js
          node --test trip-platform/functions/test/public-capacity-fidelity-0303.test.js
          node --test trip-platform/functions/test/public-incremental-capacity-0375.test.js
          node --test trip-platform/functions/test/public-combined-capacity-0369.test.js

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase credential is missing."
            exit 3
          fi

      - name: Install Functions dependencies
        shell: bash
        run: npm --prefix trip-platform/functions install --no-audit --no-fund

      - name: Deploy exact HEAD Agenda backend and hosting
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force
          fi

      - name: Smoke live incremental capacity contract
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://rota-certa-7ccc8.web.app
          curl --retry 8 --retry-delay 3 --fail --silent --show-error "$BASE/v1/health" | tee /tmp/health.json
          grep -Fq '"ok":true' /tmp/health.json

          CODE="$(curl --retry 4 --retry-delay 2 --silent --show-error -o /tmp/capacity-probe.json -w "%{http_code}"             -X PUT "$BASE/v1/driver/trips/ci-route-probe/capacity-snapshot"             -H 'Content-Type: application/json'             --data '{"trip":{},"claims":[],"claimNamespace":"BLABLACAR_SYNC:","snapshotRevision":"ci-probe","sourceComplete":true}')"
          test "$CODE" = "401"

          BUST="$(date +%s%N)"
          curl --retry 8 --retry-delay 3 --fail --silent --show-error "$BASE/app.js?v=$BUST" -o /tmp/live-app.js
          grep -Fq 'function publicAvailabilityLabel' /tmp/live-app.js
          grep -Fq '🪑 LOTADO' /tmp/live-app.js
          grep -Fq 'Disponibilidade sendo atualizada' /tmp/live-app.js

          echo "LIVE_INCREMENTAL_CAPACITY_CONTRACT=PASS"
          echo "SOURCE_HEAD=${{ github.sha }}"
