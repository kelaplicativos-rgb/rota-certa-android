name: Sequential card collector PR persistence bridge v2

on:
  pull_request:
    branches:
      - agent/global-multitenant-foundation

permissions:
  contents: write

jobs:
  persist:
    if: github.event.pull_request.head.ref == 'agent/passenger-timeline-geo-ux'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/passenger-timeline-geo-ux
          fetch-depth: 1
      - name: Persist strict sequential source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt'
          awk '
            /python3 - <<.PY./ {inside=1; next}
            inside && /^          PY$/ {inside=0; exit}
            inside {sub(/^          /, ""); print}
          ' .github/workflows/sequential-card-collector-once.yml > /tmp/sequential_patch.py
          test -s /tmp/sequential_patch.py
          if grep -Fq 'CARD_TRAVERSAL_COMPLETE' "$SOURCE" && ! grep -Fq 'MAX_TRIPS' "$SOURCE"; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          source = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt')
          s = source.read_text()
          old = '        rideReadAttempts = 0\n        tripRosterReadAttempts = 0'
          new = '''        rideReadAttempts = 0
        completedCardTraversalKeys.clear()
        currentCardTraversalKey = ""
        ridesResumeScrollY = 0
        ridesRestorePending = false
        ridesBottomStablePasses = 0
        tripRosterReadAttempts = 0'''
          assert s.count(old) == 1, s.count(old)
          source.write_text(s.replace(old, new, 1))
          patch = Path('/tmp/sequential_patch.py')
          t = patch.read_text()
          label = t.index("'reset-state'")
          start = t.rfind('once(', 0, label)
          end = t.index('\n\n', label)
          patch.write_text(t[:start] + '# reset handled by v2 bridge\n' + t[end + 2:])
          PY
          python3 /tmp/sequential_patch.py
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | awk '{print $1}')" = '2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560'
          grep -Fq 'CARD_TRAVERSAL_COMPLETE' "$SOURCE"
          grep -Fq 'fixedTripLimit=false' "$SOURCE"
          ! grep -Fq 'MAX_TRIPS' "$SOURCE"
          git config user.name 'rota-certa-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add "$SOURCE"
          git diff --cached --quiet && exit 0
          git commit -m 'collector: restore strict sequential card traversal'
          git push origin HEAD:agent/passenger-timeline-geo-ux
