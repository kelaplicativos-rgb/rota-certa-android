name: Rota Certa Live Agenda Tool API 0.1.732 exact SHA

on:
  push:
    branches:
      - 'agent/live-agenda-tool-api-0.1.732'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-agenda-tool-api-0732-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-deploy-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      ROTA_CERTA_GIT_SHA: ${{ github.sha }}
      ROTA_CERTA_GIT_BRANCH: 'agent/live-agenda-tool-api-0.1.732'
      BASE_SHA: 'a8b2e3377ddc376f85fbfa948f8feb1b2a786f79'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prove exact source and protected FAROL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$ROTA_CERTA_GIT_SHA" = "$GITHUB_SHA"
          git diff --check "$BASE_SHA"...HEAD

          git diff --name-only "$BASE_SHA"...HEAD | tee /tmp/changed-files.txt
          if grep -Eq '^app/src/' /tmp/changed-files.txt; then
            echo "Backend-only delivery unexpectedly changed app/src." >&2
            exit 1
          fi

          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          git show "$BASE_SHA:$FAROL" | sha256sum | awk '{print $1}' | tee /tmp/farol-base-sha256.txt
          sha256sum "$FAROL" | awk '{print $1}' | tee /tmp/farol-head-sha256.txt
          test "$(cat /tmp/farol-base-sha256.txt)" = "$(cat /tmp/farol-head-sha256.txt)"

          test -s trip-platform/functions/live-agenda-tool-0732.js
          test -s trip-platform/functions/test/live-agenda-tool-0732.test.js
          grep -Fq 'createLiveAgendaTool0732' trip-platform/functions/index.js
          grep -Fq 'parts[2] === "live-query"' trip-platform/functions/index.js
          grep -Fq 'collectorValidationStatus: "PENDING_UNKNOWN"' trip-platform/functions/live-agenda-tool-0732.js
          grep -Fq 'decisionSafeForPublish: false' trip-platform/functions/live-agenda-tool-0732.js

          printf '%s\n' "$GITHUB_SHA" | tee /tmp/source-sha.txt
          printf '%s\n' "$ROTA_CERTA_GIT_BRANCH" | tee /tmp/source-branch.txt

      - name: Validate backend contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/functions/live-agenda-feed-0701.js
          node --check trip-platform/functions/live-agenda-tool-0732.js

          npm --prefix trip-platform/functions install --no-audit --no-fund

          node --test             trip-platform/functions/test/live-agenda-feed-0701.test.js             trip-platform/functions/test/live-agenda-tool-0732.test.js             trip-platform/functions/test/agenda-public-realtime-0724.test.js             | tee /tmp/backend-tests-0732.log

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy exact-head tripApi
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          gcloud functions deploy tripApi             --gen2             --project="$PROJECT"             --region=southamerica-east1             --runtime=nodejs20             --source=trip-platform/functions             --entry-point=tripApi             --trigger-http             --allow-unauthenticated             --update-env-vars="ROTA_CERTA_BACKEND_GIT_SHA=$GITHUB_SHA"             --quiet | tee /tmp/backend-deploy-0732.log
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Smoke live tool endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rota-certa-7ccc8.web.app'

          curl --retry 20 --retry-delay 3 --fail --silent --show-error             "$BASE/v1/health" | tee /tmp/live-health-0732.json
          grep -Fq '"ok":true' /tmp/live-health-0732.json
          grep -Fq "\"backendGitSha\":\"$GITHUB_SHA\"" /tmp/live-health-0732.json

          curl --retry 20 --retry-delay 2 --fail --silent --show-error             -D /tmp/live-tool-headers-0732.txt             "$BASE/v1/public/live-query/ezequiel"             -o /tmp/live-tool-0732.json

          node - <<'NODE'
          const fs = require("fs");
          const body = JSON.parse(fs.readFileSync("/tmp/live-tool-0732.json", "utf8"));
          if (body.schemaVersion !== "live-agenda-tool-v1") throw new Error("schema mismatch");
          if (!["COMPLETE", "PARTIAL"].includes(body.validationStatus)) throw new Error("invalid agenda validation status");
          if (body.collectorValidationStatus !== "PENDING_UNKNOWN") throw new Error("collector status must remain explicit");
          if (body.decisionSafeForPublish !== false) throw new Error("publish gate must remain fail-closed");
          if (!Array.isArray(body.trips)) throw new Error("trips missing");
          if (!/^[a-f0-9]{64}$/.test(body.snapshotHash || "")) throw new Error("snapshot hash missing");
          console.log(JSON.stringify({
            validationStatus: body.validationStatus,
            collectorValidationStatus: body.collectorValidationStatus,
            count: body.count,
            generatedAtIsoUtc: body.generatedAtIsoUtc,
            snapshotHash: body.snapshotHash,
          }));
          NODE

          echo '--- live tool response headers ---'
          cat /tmp/live-tool-headers-0732.txt

          grep -Eiq '^cache-control:.*no-store' /tmp/live-tool-headers-0732.txt
          grep -Eiq '^x-rota-certa-collector-status:[[:space:]]*PENDING_UNKNOWN' /tmp/live-tool-headers-0732.txt

          SNAPSHOT_HASH="$(node -e 'const fs=require("fs"); const b=JSON.parse(fs.readFileSync("/tmp/live-tool-0732.json","utf8")); process.stdout.write(b.snapshotHash || "")')"
          test -n "$SNAPSHOT_HASH"
          ETAG="$(awk 'BEGIN{IGNORECASE=1} /^etag:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' /tmp/live-tool-headers-0732.txt)"
          test -n "$ETAG"
          NORMALIZED_ETAG="${ETAG#W/}"
          EXPECTED_ETAG="\"$SNAPSHOT_HASH\""
          echo "snapshotHash=$SNAPSHOT_HASH"
          echo "etag=$ETAG"
          test "$NORMALIZED_ETAG" = "$EXPECTED_ETAG"

          : > /tmp/live-tool-304-body.txt
          STATUS="$(curl --retry 10 --retry-delay 1 --silent --show-error             -D /tmp/live-tool-304-headers-0732.txt             -o /tmp/live-tool-304-body.txt -w '%{http_code}'             "$BASE/v1/public/live-query/ezequiel?ifSnapshotHash=$SNAPSHOT_HASH")"
          echo "conditionalStatus=$STATUS"
          echo '--- hosting-safe conditional response headers ---'
          cat /tmp/live-tool-304-headers-0732.txt
          test "$STATUS" = "304"
          test ! -s /tmp/live-tool-304-body.txt

          {
            echo "source_head=$GITHUB_SHA"
            echo "source_branch=$ROTA_CERTA_GIT_BRANCH"
            echo "base_sha=$BASE_SHA"
            echo "android_app_src_changed=NO"
            echo "farol_sha256=$(cat /tmp/farol-head-sha256.txt)"
            echo "backend_tests=PASS"
            echo "tripApi_exact_sha=PASS"
            echo "live_tool_smoke=PASS"
            echo "etag_emission=PASS"
            echo "snapshot_hash_revalidation=PASS"
            echo "collector_fail_closed=PASS"
            echo "endpoint=$BASE/v1/public/live-query/ezequiel"
          } | tee /tmp/final-proof-0732.txt

      - name: Upload delivery proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-live-agenda-tool-api-0732-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/source-sha.txt
            /tmp/source-branch.txt
            /tmp/changed-files.txt
            /tmp/farol-base-sha256.txt
            /tmp/farol-head-sha256.txt
            /tmp/backend-tests-0732.log
            /tmp/backend-deploy-0732.log
            /tmp/live-health-0732.json
            /tmp/live-tool-headers-0732.txt
            /tmp/live-tool-304-headers-0732.txt
            /tmp/live-tool-304-body.txt
            /tmp/live-tool-0732.json
            /tmp/final-proof-0732.txt
