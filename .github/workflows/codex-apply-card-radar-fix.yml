name: Codex Apply Card Radar Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-apply-card-radar-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    name: Apply card radar fix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply source fix and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          printf '%s' '' | base64 -d | gzip -d > /tmp/rota-certa-card-radar.patch
          git apply --check /tmp/rota-certa-card-radar.patch
          git apply /tmp/rota-certa-card-radar.patch
          git add app/build.gradle.kts \
            app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/RideCardTemplateMatcher.kt
          git commit -m "Require registered card for live radar"
          git push origin HEAD:main
