name: Sequential card collector PR persistence bridge

on:
  pull_request:
    branches:
      - agent/global-multitenant-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/passenger-timeline-geo-ux'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/passenger-timeline-geo-ux
          fetch-depth: 1
      - name: Extract and run reviewed persistence script
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /python3 - <<.PY./ {inside=1; next}
            inside && /^          PY$/ {inside=0; exit}
            inside {sub(/^          /, ""); print}
          ' .github/workflows/sequential-card-collector-once.yml > /tmp/sequential_patch.py
          test -s /tmp/sequential_patch.py
          if grep -Fq 'CARD_TRAVERSAL_COMPLETE' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt && ! grep -Fq 'MAX_TRIPS' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt; then
            echo 'strict sequential source already persisted'
            exit 0
          fi
          python3 /tmp/sequential_patch.py
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | awk '{print $1}')" = '2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560'
          git config user.name 'rota-certa-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          git diff --cached --quiet && exit 0
          git commit -m 'collector: restore strict sequential card traversal'
          git push origin HEAD:agent/passenger-timeline-geo-ux
