name: Build Rota Certa 0.1.164

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build-rota-certa-0.1.164.yml
      - .github/validation/rota-certa-0.1.164.txt
      - scripts/fix_diagnostic_session_summary_0164.py
      - scripts/fix_diagnostic_session_summary_0164_rerun.py
      - docs/PROJECT_STATUS.md
      - docs/DECISIONS.md

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected correction source
        uses: actions/checkout@v4
        with:
          ref: codex/unified-debug-log-0.1.139
          fetch-depth: 0
          path: source

      - name: Checkout isolated 0.1.164 patch branch
        uses: actions/checkout@v4
        with:
          ref: codex/diagnostic-session-summary-0.1.164
          fetch-depth: 0
          path: patches

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Materialize protected source through 0.1.162
        working-directory: source
        run: |
          set -euo pipefail
          python scripts/fix_99_overlay_state_0151.py
          python scripts/fix_selected_package_state_0152.py
          python scripts/fix_transient_launcher_clear_0154.py
          python scripts/fix_bounded_empty_read_preservation_0155.py
          python scripts/fix_passive_churn_and_launcher_race_0156.py
          python scripts/fix_subsecond_farol_0157.py
          python scripts/remove_collector_completely_0158.py
          python scripts/run_value_finance_0159.py
          python scripts/fix_value_finance_0160.py
          python scripts/fix_value_finance_0160_compile.py
          python ../patches/scripts/fix_failed_card_autocapture_0161.py .
          python ../patches/scripts/fix_failed_card_autocapture_0161_rerun.py .
          python ../patches/scripts/fix_gigu_work_mode_session_0162.py .
          python ../patches/scripts/fix_gigu_work_mode_session_0162_rerun.py .
          grep -q 'versionName = "0.1.162"' app/build.gradle.kts
          grep -q 'versionCode = 5230' app/build.gradle.kts

      - name: Apply validated flight recorder 0.1.163
        working-directory: source
        run: |
          set -euo pipefail
          python ../patches/scripts/fix_farol_flight_recorder_0163.py .
          python ../patches/scripts/fix_farol_flight_recorder_0163_rerun.py .
          grep -q 'versionName = "0.1.163"' app/build.gradle.kts
          grep -q 'versionCode = 5240' app/build.gradle.kts

      - name: Snapshot protected 0.1.163 source
        working-directory: source
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          snapshot = {
              p.as_posix(): sha256(p.read_bytes()).hexdigest()
              for p in sorted(Path('app').rglob('*')) if p.is_file()
          }
          Path('/tmp/rota-certa-0163-source-snapshot.json').write_text(
              json.dumps(snapshot, sort_keys=True, indent=2), encoding='utf-8'
          )
          PY
          cp app/src/main/AndroidManifest.xml /tmp/AndroidManifest-0.1.163.xml
          sha256sum \
            app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/DecisionEngine.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/RideTextParser.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/GoogleMapsService.kt \
            > /tmp/protected-farol-0.1.163.sha256

      - name: Apply diagnostic session summary 0.1.164
        working-directory: source
        run: |
          set -euo pipefail
          python ../patches/scripts/fix_diagnostic_session_summary_0164.py .
          python ../patches/scripts/fix_diagnostic_session_summary_0164_rerun.py .

      - name: Verify diagnostic-only change boundary
        working-directory: source
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          before = json.loads(Path('/tmp/rota-certa-0163-source-snapshot.json').read_text(encoding='utf-8'))
          after = {
              p.as_posix(): sha256(p.read_bytes()).hexdigest()
              for p in sorted(Path('app').rglob('*')) if p.is_file()
          }
          modified = sorted(path for path in before.keys() & after.keys() if before[path] != after[path])
          added = sorted(after.keys() - before.keys())
          deleted = sorted(before.keys() - after.keys())
          expected_modified = sorted([
              'app/build.gradle.kts',
              'app/src/main/java/br/com/mapeiaia/rotacerta/ManualTechnicalReportBuilder.kt',
          ])
          expected_added = sorted([
              'app/src/main/java/br/com/mapeiaia/rotacerta/FarolDiagnosticSummary0164.kt',
              'app/src/test/java/br/com/mapeiaia/rotacerta/FarolDiagnosticSummary0164Test.kt',
          ])
          assert modified == expected_modified, (modified, expected_modified)
          assert added == expected_added, (added, expected_added)
          assert deleted == [], deleted
          print('Modified:', *modified, sep='\n- ')
          print('Added:', *added, sep='\n- ')
          PY
          cmp -s /tmp/AndroidManifest-0.1.163.xml app/src/main/AndroidManifest.xml
          sha256sum --check /tmp/protected-farol-0.1.163.sha256

      - name: Verify 0.1.164 diagnostic contracts
        working-directory: source
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.1.164"' app/build.gradle.kts
          grep -q 'versionCode = 5250' app/build.gradle.kts
          grep -q 'object FarolDiagnosticSummary0164' app/src/main/java/br/com/mapeiaia/rotacerta/FarolDiagnosticSummary0164.kt
          grep -q 'BLOQUEADA ANTES DA ROTA' app/src/main/java/br/com/mapeiaia/rotacerta/FarolDiagnosticSummary0164.kt
          grep -q 'Sessões de card registradas' app/src/main/java/br/com/mapeiaia/rotacerta/FarolDiagnosticSummary0164.kt
          grep -q 'FarolDiagnosticSummary0164.withSummary' app/src/main/java/br/com/mapeiaia/rotacerta/ManualTechnicalReportBuilder.kt
          grep -q 'FarolFlightRecorder0163.exportReport' app/src/main/java/br/com/mapeiaia/rotacerta/ManualTechnicalReportBuilder.kt
          ! grep -R -n -E 'Timer\(|scheduleAtFixedRate|while \(true\)|delay\(' app/src/main/java/br/com/mapeiaia/rotacerta/FarolDiagnosticSummary0164.kt
          test "$(grep -c '<service' app/src/main/AndroidManifest.xml)" -eq 2
          test ! -e app/src/main/java/br/com/mapeiaia/rotacerta/BlaBlaCarCollectorActivity.kt
          test ! -d app/src/main/java/br/com/mapeiaia/rotacerta/coletor
          ! grep -R -n -E 'BlaBlaCarCollector|CollectorBubbleShortcutModule|OpenCollector|displayLabel = "Coletor"|label = "Coletor"' app/src/main app/src/test
          test -n "${GOOGLE_MAPS_API_KEY:-}"

      - name: Unit and contract tests
        working-directory: source
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Android lint
        working-directory: source
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build APK
        working-directory: source
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Validate APK and diagnostic payload
        working-directory: source
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee rota-certa-0.1.164-assinatura.txt
          grep -qi 'd9ee577b5bb9a4c72bce115e974c9ecf1ec8c7382bcd034e88d433e01eb0e7fd' rota-certa-0.1.164-assinatura.txt
          BADGING=$($AAPT dump badging "$APK" | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='br.com.mapeiaia.rotacerta'"
          echo "$BADGING" | grep -q "versionCode='5250'"
          echo "$BADGING" | grep -q "versionName='0.1.164'"
          $AAPT dump xmltree "$APK" AndroidManifest.xml > apk-manifest-tree.txt
          grep -q 'LiveRideAccessibilityService' apk-manifest-tree.txt
          grep -q 'WorkTrackingService' apk-manifest-tree.txt
          for dex in $(zipinfo -1 "$APK" | grep -E '^classes([0-9]+)?\.dex$'); do unzip -p "$APK" "$dex"; done | strings > dex-strings.txt
          grep -q 'FarolFlightRecorder0163' dex-strings.txt
          grep -q 'FarolDiagnosticSummary0164' dex-strings.txt
          grep -q 'BLOQUEADA ANTES DA ROTA' dex-strings.txt
          grep -q 'WorkModePolicy0162' dex-strings.txt
          grep -E 'BlaBlaCarCollector|CollectorBubbleShortcutModule|OpenCollector' dex-strings.txt && exit 1 || true
          cp "$APK" rota-certa-0.1.164-resumo-diagnostico-validado.apk
          sha256sum rota-certa-0.1.164-resumo-diagnostico-validado.apk | tee rota-certa-0.1.164-sha256.txt
          printf 'Base protegida: Rota Certa 0.1.163 (5240)\nNova versão: Rota Certa 0.1.164 (5250)\nEscopo: resumo autoritativo da sessão no relatório manual\nFarol, parser, Google Maps e região de trabalho: inalterados\nManifesto e permissões: inalterados\nColetor: ausente\n' > rota-certa-0.1.164-comparacao.txt

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.164-diagnostic-session-summary-validated
          path: |
            source/rota-certa-0.1.164-resumo-diagnostico-validado.apk
            source/rota-certa-0.1.164-sha256.txt
            source/rota-certa-0.1.164-assinatura.txt
            source/rota-certa-0.1.164-comparacao.txt
          retention-days: 90
          if-no-files-found: error
