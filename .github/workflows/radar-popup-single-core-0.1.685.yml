name: Radar popup single-core 0.1.685 APK

on:
  push:
    branches:
      - 'agent/radar-popup-single-core-0.1.685'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-popup-single-core-0685-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      ROTA_CERTA_GIT_SHA: ${{ github.sha }}
      ROTA_CERTA_GIT_BRANCH: agent/radar-popup-single-core-0.1.685

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact single-core popup source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ROTA_CERTA_GIT_SHA"
          grep -Fq 'releaseVersionName = "0.1.685"' app/build.gradle.kts
          grep -Fq 'releaseVersionCode = 5_976' app/build.gradle.kts
          grep -Fq '"version": "0.1.685"' app/src/main/assets/release_history.json
          grep -Fq 'SINGLE_CORE_POPUP_AUTHORITY_0685' app/src/main/java/br/com/mapeiaia/rotacerta/ProximityAlertProjection0685.kt
          grep -Fq 'ProximityAlertProjection0685.publishVisual(' app/src/main/java/br/com/mapeiaia/rotacerta/BackgroundLocationCore0680.kt
          grep -Fq 'ProximityAlertProjection0685.state.collect' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -Fq 'single_core_alert_projection_0_1_685' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          ! grep -Fq 'sharedCoreOwnsGps0680' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          ! grep -Fq 'directionalAlertEngineChecklist5.check(' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -Fq 'popupTimeoutMillis: Long = 0L' app/src/main/java/br/com/mapeiaia/rotacerta/DirectionalAlertOverlayController.kt
          grep -Fq 'SUPPORTED_TIMEOUT_MILLIS_0685' app/src/main/java/br/com/mapeiaia/rotacerta/DirectionalAlertOverlayController.kt
          grep -Fq 'proximityPopupTimeoutSeconds' app/src/main/java/br/com/mapeiaia/rotacerta/Repositories.kt
          grep -Fq 'FAROL_ROUTE_ADDRESS_SANITIZER_0684' app/src/main/java/br/com/mapeiaia/rotacerta/FarolRouteAddressSanitizer0684.kt
          grep -Fq 'FAROL_CARD_LIFE_AUTHORITY_0683' app/src/main/java/br/com/mapeiaia/rotacerta/FarolCardLifeAuthority0683.kt
          git diff --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run focused popup, GPS and preserved FAROL regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.ProximityAlertProjection0685Test' \
            --tests 'br.com.mapeiaia.rotacerta.RadarPopupSingleCore0685ContractTest' \
            --tests 'br.com.mapeiaia.rotacerta.DirectionalProximityAlertEngineChecklist5Test' \
            --tests 'br.com.mapeiaia.rotacerta.PersistentLocationCore0680Test' \
            --tests 'br.com.mapeiaia.rotacerta.PermanentFamilyGps0681Test' \
            --tests 'br.com.mapeiaia.rotacerta.FarolRouteAddressSanitizer0684Test' \
            --tests 'br.com.mapeiaia.rotacerta.FarolCardLifeAuthority0683Test' \
            --tests 'br.com.mapeiaia.rotacerta.FarolTrustedRoute0682Test' \
            --no-daemon --max-workers=2 --stacktrace | tee /tmp/android-0685-tests.log

      - name: Assemble exact source APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace | tee /tmp/android-0685-assemble.log
          test "$(git rev-parse HEAD)" = "$ROTA_CERTA_GIT_SHA"

      - name: Prove APK identity signing runtime markers and final SHA
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -s "$APK"
          unzip -t "$APK" | tee /tmp/android-0685-zip-integrity.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/android-0685-aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/android-0685-aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='5976'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='0.1.685'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/android-0685-apksigner.txt
          grep -Fq 'Verified' /tmp/android-0685-apksigner.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/android-0685-dex-strings.txt
          grep -Fq "$ROTA_CERTA_GIT_SHA" /tmp/android-0685-dex-strings.txt
          grep -Fq 'SINGLE_CORE_POPUP_AUTHORITY_0685' /tmp/android-0685-dex-strings.txt
          grep -Fq 'FAROL_ROUTE_ADDRESS_SANITIZER_0684' /tmp/android-0685-dex-strings.txt
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          FINAL="rota-certa-0.1.685-5976-$SHORT_SHA.apk"
          cp "$APK" "$FINAL"
          echo "apk=$FINAL" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "package=br.com.mapeiaia.rotacerta"
            echo "versionName=0.1.685"
            echo "versionCode=5976"
            echo "branch=agent/radar-popup-single-core-0.1.685"
            echo "commit=$ROTA_CERTA_GIT_SHA"
            echo "deviceTarget=Samsung SM-S911B / Android 16"
            echo "gpsOwner=WorkTrackingService/BackgroundProximityRuntime0680"
            echo "proximityEngineCount=1"
            echo "popupAuthority=ProximityAlertProjection0685"
            echo "popupDefault=PINNED_UNTIL_ACK"
            echo "popupOptionalTimeouts=15,20,30"
            echo "notification=REDUNDANT"
            echo "farolDependency=NONE"
            echo "sharedTrackingHidesPopup=BLOCKED"
            echo "farol0684=PRESERVED"
            echo "cardLife0683=PRESERVED"
            echo "apk=$FINAL"
            echo "apk_sha256=$APK_SHA256"
          } | tee radar-popup-single-core-0685-proof.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-radar-popup-single-core-0.1.685-${{ github.sha }}
          path: |
            ${{ steps.proof.outputs.apk }}
            radar-popup-single-core-0685-proof.txt
            /tmp/android-0685-tests.log
            /tmp/android-0685-assemble.log
            /tmp/android-0685-aapt.txt
            /tmp/android-0685-apksigner.txt
            /tmp/android-0685-zip-integrity.txt
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30
