name: Update Rota Certa docs 0.1.180

on:
  push:
    branches: [agent/per-shortcut-gesture-config-0.1.180]
    paths:
      - .github/workflows/update-docs-0.1.180.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/per-shortcut-gesture-config-0.1.180
          fetch-depth: 0

      - name: Update project records
        run: python scripts/update_docs_0180.py

      - name: Commit records
        run: |
          if git diff --quiet -- docs/PROJECT_STATUS.md docs/DECISIONS.md; then
            echo "Documentation already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md docs/DECISIONS.md
          git commit -m "docs: record validated Rota Certa 0.1.180"
          git push origin HEAD:agent/per-shortcut-gesture-config-0.1.180
