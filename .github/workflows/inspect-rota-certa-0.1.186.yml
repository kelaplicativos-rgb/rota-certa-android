name: Inspect Rota Certa 0.1.186 source

on:
  push:
    branches: [agent/shortcut-audio-links-text-correction-0.1.186]
    paths:
      - .github/workflows/inspect-rota-certa-0.1.186.yml
      - scripts/**
      - patches/**
  workflow_dispatch:

concurrency:
  group: inspect-rota-certa-0.1.186
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: codex/unified-debug-log-0.1.139
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Checkout cumulative patches
        uses: actions/checkout@v4
        with:
          ref: agent/shortcut-audio-links-text-correction-0.1.186
          fetch-depth: 0
          persist-credentials: false
          path: patches

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Materialize and validate 0.1.185
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-0186-inspect
        run: |
          set -o pipefail
          bash ../patches/scripts/build_rota_certa_0185.sh ../patches 2>&1 | tee inspect-0.1.186.log

      - name: Collect exact materialized source
        if: success()
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p materialized-0.1.185
          cp app/build.gradle.kts materialized-0.1.185/
          cp app/src/main/AndroidManifest.xml materialized-0.1.185/
          cp -R app/src/main/java materialized-0.1.185/main-java
          cp -R app/src/main/res materialized-0.1.185/main-res
          cp -R app/src/test materialized-0.1.185/test
          find materialized-0.1.185 -type f -print0 | sort -z | xargs -0 sha256sum > materialized-0.1.185/source-sha256.txt
          find app/src/main/java/br/com/mapeiaia/rotacerta -maxdepth 1 -type f -printf '%f\n' | sort > materialized-0.1.185/source-files.txt
          grep -RniE 'Link|AudioAttributes|TextToSpeech|Shortcut|Bubble|Correction|Spell|Grammar|clipboard' app/src/main/java/br/com/mapeiaia/rotacerta > materialized-0.1.185/relevant-symbols.txt || true

      - name: Upload materialized source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.185-materialized-source-for-0.1.186
          path: source/materialized-0.1.185/
          retention-days: 14
          if-no-files-found: error

      - name: Upload inspection failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.186-inspection-failure
          path: source/inspect-0.1.186.log
          retention-days: 14
          if-no-files-found: warn
