name: Inspect Rota Certa 0.1.186 source

on:
  push:
    branches: [agent/shortcut-audio-links-text-correction-0.1.186]
    paths:
      - .github/workflows/inspect-rota-certa-0.1.186.yml
      - scripts/**
      - patches/**
  pull_request:
    branches: [agent/fix-indrive-card-isolation-0.1.185]
    paths:
      - .github/workflows/inspect-rota-certa-0.1.186.yml
      - scripts/**
      - patches/**
  workflow_dispatch:

concurrency:
  group: inspect-rota-certa-0.1.186-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: codex/unified-debug-log-0.1.139
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Checkout cumulative patches
        uses: actions/checkout@v4
        with:
          ref: agent/shortcut-audio-links-text-correction-0.1.186
          fetch-depth: 0
          persist-credentials: false
          path: patches

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare materialization-only copies
        working-directory: patches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path('scripts').glob('build_rota_certa_*.sh')):
              lines = path.read_text(encoding='utf-8').splitlines()
              cut = None
              for index, line in enumerate(lines):
                  if line.lstrip().startswith('./gradlew '):
                      cut = index
                      break
              if cut is None:
                  continue
              trimmed = lines[:cut]
              trimmed.extend([
                  '',
                  'echo "materialized_only=true"',
                  'exit 0',
              ])
              path.write_text('\n'.join(trimmed) + '\n', encoding='utf-8')
              print(f'materialization-only: {path}')
          PY

      - name: Materialize exact 0.1.185 source
        working-directory: source
        run: |
          set -o pipefail
          bash ../patches/scripts/build_rota_certa_0185.sh ../patches 2>&1 | tee inspect-0.1.186.log
          grep -F 'versionCode = 5460' app/build.gradle.kts
          grep -F 'versionName = "0.1.185"' app/build.gradle.kts
          test -f app/src/main/java/br/com/mapeiaia/rotacerta/RideCardConfirmationPolicy0185.kt
          test -f app/src/main/java/br/com/mapeiaia/rotacerta/ShortcutActionCatalog0184.kt

      - name: Collect exact materialized source
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p materialized-0.1.185
          cp app/build.gradle.kts materialized-0.1.185/
          cp app/src/main/AndroidManifest.xml materialized-0.1.185/
          cp -R app/src/main/java materialized-0.1.185/main-java
          cp -R app/src/main/res materialized-0.1.185/main-res
          cp -R app/src/test materialized-0.1.185/test
          find materialized-0.1.185 -type f -print0 | sort -z | xargs -0 sha256sum > materialized-0.1.185/source-sha256.txt
          find app/src/main/java/br/com/mapeiaia/rotacerta -maxdepth 1 -type f -printf '%f\n' | sort > materialized-0.1.185/source-files.txt
          grep -RniE 'Link|AudioAttributes|TextToSpeech|Shortcut|Bubble|Correction|Spell|Grammar|clipboard' app/src/main/java/br/com/mapeiaia/rotacerta > materialized-0.1.185/relevant-symbols.txt || true

      - name: Upload materialized source
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.185-materialized-source-for-0.1.186
          path: source/materialized-0.1.185/
          retention-days: 14
          if-no-files-found: error

      - name: Upload inspection failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.186-inspection-failure
          path: source/inspect-0.1.186.log
          retention-days: 14
          if-no-files-found: warn
