name: Operational evolution engine 0.1.572

on:
  push:
    branches:
      - agent/operational-evolution-engine-0.1.572
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operational-evolution-engine-0.1.572-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: operational_evolution_validation_dummy_key
      RELEASE_TAG: v0.1.572-operational-evolution
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact source and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --check HEAD^..HEAD
          grep -Fq 'val releaseVersionCode = 5_863' app/build.gradle.kts
          grep -Fq 'val releaseVersionName = "0.1.572"' app/build.gradle.kts
          grep -Fq '"version": "0.1.572"' app/src/main/assets/release_history.json
          grep -Fq 'class OperationalHealthActivity' app/src/main/java/br/com/mapeiaia/rotacerta/monitoring/OperationalHealthCenter.kt
          grep -Fq 'PeriodicWorkRequestBuilder<OperationalHealthWorker>(1, TimeUnit.HOURS)' app/src/main/java/br/com/mapeiaia/rotacerta/monitoring/OperationalHealthCenter.kt
          git rev-parse HEAD | tee validated-source-head.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run operational health engine tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest             --tests 'br.com.mapeiaia.rotacerta.monitoring.OperationalHealthEngineTest'             --no-daemon --max-workers=1 --no-parallel --stacktrace | tee operational-health-tests.log

      - name: Assemble exact debug APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace | tee assemble-debug.log
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee aapt-badging.txt
          grep -q "package: name='br.com.mapeiaia.rotacerta'" aapt-badging.txt
          grep -q "versionCode='5863'" aapt-badging.txt
          grep -q "versionName='0.1.572'" aapt-badging.txt
          cp "$APK" rota-certa-0.1.572-operational-evolution.apk
          stat -c '%s' rota-certa-0.1.572-operational-evolution.apk | tee apk-size-bytes.txt
          sha256sum rota-certa-0.1.572-operational-evolution.apk | tee apk-sha256.txt

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.572-operational-evolution-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            rota-certa-0.1.572-operational-evolution.apk
            validated-source-head.txt
            operational-health-tests.log
            assemble-debug.log
            apksigner.txt
            aapt-badging.txt
            apk-size-bytes.txt
            apk-sha256.txt
            app/build/reports/tests/testDebugUnitTest

      - name: Publish installable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(cat validated-source-head.txt)"
          cat > release-notes.md <<EOF
          Rota Certa 0.1.572 — Central de Saúde e Evolução Operacional

          Branch: agent/operational-evolution-engine-0.1.572
          Commit validado: ${SOURCE_SHA}
          Package: br.com.mapeiaia.rotacerta
          VersionName: 0.1.572
          VersionCode: 5863

          O APK foi gerado do mesmo SHA validado pelo workflow. Foram executados os testes focados do motor, build Android, verificação ZIP, assinatura, package/version e SHA-256.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG"               rota-certa-0.1.572-operational-evolution.apk               apk-sha256.txt apk-size-bytes.txt aapt-badging.txt apksigner.txt validated-source-head.txt               --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG"               --target "$SOURCE_SHA"               --title "Rota Certa 0.1.572 validado"               --notes-file release-notes.md               --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG"               rota-certa-0.1.572-operational-evolution.apk               apk-sha256.txt apk-size-bytes.txt aapt-badging.txt apksigner.txt validated-source-head.txt               --target "$SOURCE_SHA"               --title "Rota Certa 0.1.572 validado"               --notes-file release-notes.md               --repo "$GITHUB_REPOSITORY"
          fi
