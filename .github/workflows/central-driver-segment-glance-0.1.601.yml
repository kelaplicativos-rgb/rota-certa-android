name: Central driver segment glance 0.1.601

on:
  push:
    branches:
      - agent/central-driver-segment-glance-0.1.601
    paths:
      - '.github/workflows/central-driver-segment-glance-0.1.601.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/assets/release_history.json'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/CentralDoDia0552.kt'
      - 'app/src/test/java/br/com/mapeiaia/rotacerta/trips/CentralDriverSegmentGlance0601Test.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: central-driver-segment-glance-0601-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_API_KEY: central_driver_glance_0601_ci_dummy_key
      EXPECTED_VERSION_CODE: '5892'
      EXPECTED_VERSION_NAME: '0.1.601'
      BASE_SHA: '159e74c6065b199d5b8d8fd24da503681bab3ee4'

    steps:
      - name: Checkout exact triggering HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact source and isolated diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check "$BASE_SHA"...HEAD
          grep -Fq 'val releaseVersionCode = 5_892' app/build.gradle.kts
          grep -Fq 'val releaseVersionName = "0.1.601"' app/build.gradle.kts
          grep -Fq '"version": "0.1.601"' app/src/main/assets/release_history.json

          CENTRAL='app/src/main/java/br/com/mapeiaia/rotacerta/trips/CentralDoDia0552.kt'
          grep -Fq '"Vagas por trecho"' "$CENTRAL"
          grep -Fq 'load0595.occupiedSeats' "$CENTRAL"
          grep -Fq 'load0595.passengerSeats' "$CENTRAL"
          grep -Fq 'load0595.availableSeats' "$CENTRAL"
          grep -Fq 'load0595.overbookingSeats' "$CENTRAL"
          grep -Fq '0.1.601 — leitura operacional do motorista.' "$CENTRAL"
          if grep -Fq 'Reserve Já' "$CENTRAL"; then
            echo "Passenger reservation CTA leaked into Central do Dia" >&2
            exit 1
          fi
          if grep -Fq 'Indisponível' "$CENTRAL"; then
            echo "Passenger availability button label leaked into Central do Dia" >&2
            exit 1
          fi

          git diff --name-only "$BASE_SHA"...HEAD | sort | tee /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/central-driver-segment-glance-0.1.601.yml
          app/build.gradle.kts
          app/src/main/assets/release_history.json
          app/src/main/java/br/com/mapeiaia/rotacerta/trips/CentralDoDia0552.kt
          app/src/test/java/br/com/mapeiaia/rotacerta/trips/CentralDriverSegmentGlance0601Test.kt
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          comm -23 /tmp/changed.txt /tmp/allowed.txt | tee /tmp/unexpected-changed.txt
          test ! -s /tmp/unexpected-changed.txt
          printf '%s\n' "$GITHUB_SHA" | tee /tmp/source-head.txt
          printf '%s\n' "$GITHUB_REF_NAME" | tee /tmp/source-branch.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          test -d "$SDK_ROOT/platforms/android-35"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run targeted Central regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew \
            :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.CentralDriverSegmentGlance0601Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.CentralDoDia0552Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.UnifiedSegmentAvailability0596Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.CentralPassengerControls0593Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace \
            | tee /tmp/targeted-tests.log

      - name: Compare full unit-test failures against exact 0.1.600 base
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/rc-0600 "$BASE_SHA"
          chmod +x /tmp/rc-0600/gradlew

          set +e
          (
            cd /tmp/rc-0600
            ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=1 --no-parallel --stacktrace
          ) > /tmp/base-tests.log 2>&1
          BASE_EXIT=$?
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=1 --no-parallel --stacktrace > /tmp/head-tests.log 2>&1
          HEAD_EXIT=$?
          set -e

          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          def failures(root):
              result = set()
              d = pathlib.Path(root) / "app/build/test-results/testDebugUnitTest"
              for f in d.glob("*.xml"):
                  tree = ET.parse(f)
                  for case in tree.getroot().iter("testcase"):
                      if case.find("failure") is not None or case.find("error") is not None:
                          result.add(f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}")
              return result

          base = failures("/tmp/rc-0600")
          head = failures(".")
          new = sorted(head - base)
          fixed = sorted(base - head)
          pathlib.Path("/tmp/base-failures.txt").write_text("\n".join(sorted(base)) + ("\n" if base else ""))
          pathlib.Path("/tmp/head-failures.txt").write_text("\n".join(sorted(head)) + ("\n" if head else ""))
          pathlib.Path("/tmp/new-failures.txt").write_text("\n".join(new) + ("\n" if new else ""))
          pathlib.Path("/tmp/fixed-baseline-failures.txt").write_text("\n".join(fixed) + ("\n" if fixed else ""))
          print(f"baseline_failures={len(base)}")
          print(f"head_failures={len(head)}")
          print(f"new_failures={len(new)}")
          print(f"fixed_baseline_failures={len(fixed)}")
          if new:
              print("\n".join(new))
              raise SystemExit(1)
          PY

          echo "base_gradle_exit=$BASE_EXIT" | tee /tmp/unit-regression-summary.txt
          echo "head_gradle_exit=$HEAD_EXIT" | tee -a /tmp/unit-regression-summary.txt
          echo "new_failure_count=$(wc -l < /tmp/new-failures.txt)" | tee -a /tmp/unit-regression-summary.txt

      - name: Assemble exact-head installable APK
        shell: bash
        run: |
          set -euo pipefail
          export ROTA_CERTA_GIT_SHA="$GITHUB_SHA"
          export ROTA_CERTA_GIT_BRANCH="$GITHUB_REF_NAME"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" > /tmp/zip-integrity.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'Verified' /tmp/apksigner.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -Fq "$GITHUB_SHA" /tmp/dex-strings.txt

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/0601
          mkdir -p "$OUT"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          FINAL="$OUT/rota-certa-$EXPECTED_VERSION_NAME-$EXPECTED_VERSION_CODE-$SHORT_SHA.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$FINAL"
          sha256sum "$FINAL" | tee "$OUT/apk.sha256"
          cp /tmp/targeted-tests.log /tmp/unit-regression-summary.txt /tmp/base-failures.txt /tmp/head-failures.txt /tmp/new-failures.txt /tmp/fixed-baseline-failures.txt /tmp/aapt.txt /tmp/apksigner.txt /tmp/zip-integrity.txt /tmp/source-head.txt /tmp/source-branch.txt /tmp/changed.txt /tmp/unexpected-changed.txt "$OUT/"
          cat > "$OUT/final-status.txt" <<EOF
          package=br.com.mapeiaia.rotacerta
          version=$EXPECTED_VERSION_NAME/$EXPECTED_VERSION_CODE
          source_head=$GITHUB_SHA
          source_branch=$GITHUB_REF_NAME
          exact_base=$BASE_SHA
          central_segment_data_source=SeatAvailabilityEngine.segmentLoads
          central_reservation_cta=ABSENT_BY_CONTRACT_AND_TEST
          central_segment_route=VISIBLE
          central_segment_occupancy=VISIBLE
          central_segment_capacity=VISIBLE
          central_segment_vacancies=VISIBLE
          no_new_unit_failures_vs_0600=PASS_BY_TEST
          apk_signature=PASS
          apk_embeds_exact_sha=PASS
          physical_install_test=PENDING_SAMSUNG_SM_S911B_ANDROID_16
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.601-5892-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0601
