name: Timeline passenger snapshot 0.1.532

on:
  push:
    branches:
      - agent/timeline-passenger-snapshot-0.1.532

permissions:
  contents: write

jobs:
  materialize-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/timeline-passenger-snapshot-0.1.532

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Materialize causal fix if needed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ui_path = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt')
          text = ui_path.read_text(encoding='utf-8')

          old_gate = 'if (!entry.canonicalBackendAuthoritative0494 || trip == null || canonicalBookings0494 == null) return null'
          if old_gate in text:
              if text.count(old_gate) != 1:
                  raise SystemExit('unexpected authority gate count')
              text = text.replace(
                  old_gate,
                  'if (trip == null || canonicalBookings0494 == null) return null',
              )

              old_reset = '        renderSnapshot0394 = immediateCanonicalSnapshot0517\n        renderFailure0512 = null'
              new_reset = '        renderSnapshot0394 = preservePassengerTimelineSnapshotDuringRefresh0532(\n            current = renderSnapshot0394,\n            immediateCanonical = immediateCanonicalSnapshot0517,\n        )'
              if text.count(old_reset) != 1:
                  raise SystemExit('unexpected degrading refresh reset count')
              text = text.replace(old_reset, new_reset)

              failure_state = '    var renderFailure0512 by remember(entry.tripId, trip?.id) {\n        mutableStateOf<String?>(null)\n    }\n'
              if text.count(failure_state) != 1:
                  raise SystemExit('unexpected render failure state count')
              text = text.replace(failure_state, '')

              failure_assignment = '            renderFailure0512 = "PASSENGER_PROJECTION_FAILED"\n'
              if text.count(failure_assignment) != 1:
                  raise SystemExit('unexpected render failure assignment count')
              text = text.replace(failure_assignment, '')

              loading_pattern = re.compile(
                  r'    if \(renderSnapshot == null\) \{\n'
                  r'        if \(renderFailure0512 == null\) \{\n'
                  r'            Text\("Carregando passageiros…", style = MaterialTheme\.typography\.bodySmall\)\n'
                  r'        \} else \{\n'
                  r'            Text\(\n'
                  r'                "⚠️ Não foi possível resolver os passageiros desta viagem\. O card canônico foi preservado; atualize novamente\.",\n'
                  r'                style = MaterialTheme\.typography\.bodySmall,\n'
                  r'            \)\n'
                  r'        \}\n'
                  r'        return\n'
                  r'    \}'
              )
              text, count = loading_pattern.subn('    if (renderSnapshot == null) return', text)
              if count != 1:
                  raise SystemExit(f'unexpected loading block count={count}')

              legacy_source = '" source=" + if (entry.canonicalBackendAuthoritative0494) "CANONICAL_BACKEND" else "LOCAL_LEGACY",'
              if text.count(legacy_source) != 1:
                  raise SystemExit('unexpected local telemetry source count')
              text = text.replace(
                  legacy_source,
                  '" source=" + if (entry.canonicalBackendAuthoritative0494) "CANONICAL_BACKEND" else "LOCAL_CANONICAL_AGENDA",',
              )
              ui_path.write_text(text, encoding='utf-8')

              gradle_path = Path('app/build.gradle.kts')
              gradle = gradle_path.read_text(encoding='utf-8')
              if gradle.count('versionCode = 5823') != 1 or gradle.count('versionName = "0.1.531"') != 1:
                  raise SystemExit('unexpected base version metadata')
              gradle = gradle.replace('versionCode = 5823', 'versionCode = 5824')
              gradle = gradle.replace('versionName = "0.1.531"', 'versionName = "0.1.532"')
              gradle_path.write_text(gradle, encoding='utf-8')
          else:
              if 'preservePassengerTimelineSnapshotDuringRefresh0532' not in text:
                  raise SystemExit('neither base nor fixed passenger snapshot state found')
          PY

          git diff --check
          if ! git diff --quiet -- app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt app/build.gradle.kts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt app/build.gradle.kts
            git commit -m "fix: keep passenger snapshot atomic during refresh (0.1.532)"
            git push origin HEAD:agent/timeline-passenger-snapshot-0.1.532
          fi

      - name: Verify structural invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ui = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt').read_text(encoding='utf-8')
          assert 'Carregando passageiros' not in ui
          assert 'renderSnapshot0394 = immediateCanonicalSnapshot0517' not in ui
          assert 'preservePassengerTimelineSnapshotDuringRefresh0532' in ui
          assert 'if (!entry.canonicalBackendAuthoritative0494 || trip == null' not in ui
          assert 'if (trip == null || canonicalBookings0494 == null) return null' in ui
          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          assert 'versionCode = 5824' in gradle
          assert 'versionName = "0.1.532"' in gradle
          PY

      - name: Unit tests and APK build
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Package final-SHA APK evidence
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/rota-certa-0.1.532-timeline-passenger-snapshot.apk
          {
            echo "branch=agent/timeline-passenger-snapshot-0.1.532"
            echo "sha=$(git rev-parse HEAD)"
            echo "versionName=0.1.532"
            echo "versionCode=5824"
            echo "sourceLoadingTextPresent=$(grep -R -F -q 'Carregando passageiros' app/src/main/java && echo true || echo false)"
            sha256sum out/rota-certa-0.1.532-timeline-passenger-snapshot.apk
          } > out/build-evidence.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.532-timeline-passenger-snapshot-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 30
