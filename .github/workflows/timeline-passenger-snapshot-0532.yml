name: Timeline passenger snapshot 0.1.532

on:
  push:
    branches:
      - agent/timeline-passenger-snapshot-0.1.532
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-test-build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_MAPS_API_KEY: timeline_passenger_snapshot_0532_ci_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact triggering HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "ROTA_CERTA_GIT_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_BRANCH=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Firebase Android app for build only
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify structural invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          ui = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt').read_text(encoding='utf-8')
          helper = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineSnapshotState0532.kt').read_text(encoding='utf-8')
          tests = Path('app/src/test/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineSnapshotState0532Test.kt').read_text(encoding='utf-8')
          assert 'Carregando passageiros' not in ui
          assert 'renderSnapshot0394 = immediateCanonicalSnapshot0517' not in ui
          assert 'preservePassengerTimelineSnapshotDuringRefresh0532' in ui
          assert 'preservePassengerTimelineSnapshotDuringRefresh0532' in helper
          assert 'if (!entry.canonicalBackendAuthoritative0494 || trip == null' not in ui
          assert 'if (trip == null || canonicalBookings0494 == null) return null' in ui
          assert 'keepsCurrentSnapshotWhenImmediateCanonicalIsMissing' in tests
          assert 'replacesCurrentSnapshotAtomicallyWhenNewCanonicalSnapshotIsComplete' in tests
          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          assert 'versionCode = 5824' in gradle
          assert 'versionName = "0.1.532"' in gradle
          PY

      - name: Focused snapshot regression tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.PassengerTimelineSnapshotState0532Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Build final-SHA APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/tmp/zip-integrity.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='5824'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='0.1.532'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/apksigner.txt
          grep -Fq 'Verified' /tmp/apksigner.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -Fq "$GITHUB_SHA" /tmp/dex-strings.txt
          sha256sum "$APK" > /tmp/apk.sha256

      - name: Package final-SHA APK evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/rota-certa-0.1.532-timeline-passenger-snapshot.apk
          cp /tmp/aapt.txt /tmp/apksigner.txt /tmp/zip-integrity.txt /tmp/apk.sha256 out/
          {
            echo "branch=$GITHUB_REF_NAME"
            echo "sha=$GITHUB_SHA"
            echo "versionName=0.1.532"
            echo "versionCode=5824"
            echo "sourceLoadingTextPresent=$(grep -R -F -q 'Carregando passageiros' app/src/main/java && echo true || echo false)"
            echo "physicalApproval=PENDING_SAMSUNG_SM-S911B_ANDROID_16"
            cat /tmp/apk.sha256
          } > out/build-evidence.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.532-timeline-passenger-snapshot-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 30
