name: Validate Stage 12 FAROL manual latency export 0.1.194

on:
  pull_request:
    branches:
      - agent/stage9-farol-latency-instrumentation-0.1.194
    paths:
      - .github/workflows/validate-stage12-farol-latency-manual-export-0.1.194.yml
      - scripts/apply_farol_latency_manual_export_stage12.py
  workflow_dispatch:

concurrency:
  group: stage12-farol-latency-export-0194-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Checkout exact Stage 12 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: patches

      - name: Verify Stage 12 branch scope and Stage 9 identity
        working-directory: patches
        env:
          EXPECTED_PATCH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PATCH_SHA"
          git merge-base --is-ancestor 0ccf936b82f696646962a10e419f68f184493bde HEAD
          test "$(git hash-object scripts/apply_farol_latency_instrumentation_stage9.py)" = "5c0c701b46ff4af32283bf017ca9dcb474513c19"
          git diff --name-only 0ccf936b82f696646962a10e419f68f184493bde..HEAD | sort > /tmp/stage12-files.txt
          printf '%s\n' \
            '.github/workflows/validate-stage12-farol-latency-manual-export-0.1.194.yml' \
            'scripts/apply_farol_latency_manual_export_stage12.py' | sort > /tmp/stage12-expected.txt
          diff -u /tmp/stage12-expected.txt /tmp/stage12-files.txt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Materialize validated 0.1.194 cumulatively
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-stage12-base
        run: |
          set -euo pipefail
          mkdir -p stage12-evidence
          bash ../patches/scripts/build_rota_certa_0194.sh ../patches 2>&1 | tee stage12-evidence/materialize-0.1.194.log

      - name: Verify official 0.1.194 hashes before instrumentation
        working-directory: source
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 5478' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.194"' app/build.gradle.kts
          cat > stage12-evidence/official-0.1.194.sha256 <<'HASHES'
          ed8d4d8a9c93f74036b6786a09a82e2499f956cc79cfcf21d2bd00703b22a672  app/src/main/AndroidManifest.xml
          a4691bdc61409a31e46526b3588aaf28c2ff676234d8bd3ab40f936b4dbce6e9  app/src/main/java/br/com/mapeiaia/rotacerta/DecisionEngine.kt
          8e4d2a792ae03d0d1e14c7c656c50a909e14fa86bc25162ec9e9b8858c132421  app/src/main/java/br/com/mapeiaia/rotacerta/RideTextParser.kt
          2aaa6263c450d6218aba722915a2ceeec900728c90001625ff1513f65a39236e  app/src/main/java/br/com/mapeiaia/rotacerta/FarolRealDeviceGate0188.kt
          c84d1e8bfa5f22ccbeb2f0e38615c9702bb763054c8c6a00c6021bd9320b29bf  app/src/main/java/br/com/mapeiaia/rotacerta/GoogleMapsService.kt
          dfe203ebab54cd7dbce088de4109a54b0ce9a49077c152869a61aa09693efc6e  app/src/main/java/br/com/mapeiaia/rotacerta/GpsAddressResolver.kt
          e95c2215ee06696157968e827c53d0631f37a35ee2feb4f0ee1acaa2a259c33a  app/src/main/java/br/com/mapeiaia/rotacerta/RadarImport.kt
          da359a184e492a51bbe327f0acae6fbdd13f58d8c5500b8a8569ae42ce067f92  app/src/main/java/br/com/mapeiaia/rotacerta/DirectionalAlertPolicy.kt
          8415489210ee6122fcb063799336246cab1f03b0995953b1719cacbbf79c8169  app/src/main/java/br/com/mapeiaia/rotacerta/DirectionalProximityAlertEngine.kt
          4eaf62ca1369acd8489262a4be222c22937576ae2343e8f4570a4a36365d3f64  app/src/main/java/br/com/mapeiaia/rotacerta/DirectionalAlertOverlayController.kt
          d42ee18e69cc4bc98b0ac2d5a4faa1384ce1da3fcdf24632255c361e02a73749  app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          78e46dee8bf1e55ea452356c598e580f040177eb65cb639a93ece796e6b61f21  app/src/main/java/br/com/mapeiaia/rotacerta/FarolVisualPriority0189.kt
          8ea68b1fcd7880a50d4c996e231e2f00e16870d3e522f011da474fe83ddb5f1f  app/src/main/java/br/com/mapeiaia/rotacerta/ForensicIncidentMonitor0193.kt
          32d445432079c540b07b859b71337d9e010006b286275f2a7fdf814c435e3b04  app/src/main/java/br/com/mapeiaia/rotacerta/FailedCardRecovery0161.kt
          19088d8b110a36b8ab75b7a46b5eab6b0fc79fd17d5f2dad6608e59b7a967d4d  app/src/main/java/br/com/mapeiaia/rotacerta/UniversalScreenAddressParser.kt
          HASHES
          sed -i 's/^          //' stage12-evidence/official-0.1.194.sha256
          sha256sum -c stage12-evidence/official-0.1.194.sha256 | tee stage12-evidence/official-0.1.194-hash-check.txt

      - name: Run Stage 9 fail-closed controls
        working-directory: source
        run: |
          set -euo pipefail
          python3 -m py_compile ../patches/scripts/apply_farol_latency_instrumentation_stage9.py
          echo 'py_compile=passed' | tee stage12-evidence/stage9-py-compile.txt
          python3 ../patches/scripts/apply_farol_latency_instrumentation_stage9.py --self-test | tee stage12-evidence/stage9-self-test.txt
          python3 ../patches/scripts/apply_farol_latency_instrumentation_stage9.py "$PWD" --check | tee stage12-evidence/stage9-check.txt
          grep -Fxq 'farol_latency_stage9_check=passed' stage12-evidence/stage9-check.txt
          grep -Fxq 'sink=bounded_memory_only' stage12-evidence/stage9-check.txt

      - name: Snapshot neutrality before Stage 9
        working-directory: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          root=Path('.')
          service=(root/'app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt').read_text()
          gate=(root/'app/src/main/java/br/com/mapeiaia/rotacerta/FarolRealDeviceGate0188.kt').read_text()
          checks={
            'return_tokens':len(re.findall(r'\breturn\b', service)),
            'immediate_text_collect':service.count('collectImmediateVisibleTextChecklist13(rootHandle0187.node)'),
            'ocr_extract_structured':service.count('ocrService.extractStructuredText(bitmap0161)'),
            'accessibility_card_blocks':service.count('collectAccessibilityCardBlocks0188('),
            'ocr_card_blocks':service.count('collectOcrCardBlocks0188('),
            'real_device_gate':service.count('FarolRealDeviceGate0188.evaluate('),
            'authorize_route':service.count('authorizeRoute0188('),
            'bubble_duplicate_skipped':service.count('"BUBBLE_DUPLICATE_SKIPPED"'),
          }
          expected={'return_tokens':283,'immediate_text_collect':5,'ocr_extract_structured':1,'accessibility_card_blocks':2,'ocr_card_blocks':2,'real_device_gate':1,'authorize_route':2,'bubble_duplicate_skipped':1}
          if checks != expected: raise SystemExit(f'neutrality pre mismatch: {checks!r}')
          authority='val authorityIdentity = "$selected|${winner.block.windowId}|${winner.block.id}|$signature"'
          if gate.count(authority)!=1 or gate.count('screenHash = authorityIdentity.hashCode()')!=1: raise SystemExit('authority mismatch')
          (root/'stage12-evidence/neutrality-pre.txt').write_text('\n'.join(f'{k}={v}' for k,v in checks.items())+'\nauthority_identity=preserved\nscreen_hash=preserved\n')
          PY

      - name: Apply bounded-memory Stage 9 instrumentation
        working-directory: source
        run: |
          set -euo pipefail
          python3 ../patches/scripts/apply_farol_latency_instrumentation_stage9.py "$PWD" | tee stage12-evidence/stage9-apply.txt
          grep -Fxq 'farol_latency_stage9_apply=passed' stage12-evidence/stage9-apply.txt
          grep -Fxq 'sink=bounded_memory_only' stage12-evidence/stage9-apply.txt
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | awk '{print $1}')" = "b4fd2ff429fd72125a5ae724129c625974be313bec700b5f09d2310795ccbab6"
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/FarolLatencyProbeStage9.kt | awk '{print $1}')" = "a22cc939e147acbe019d2ead4616050419430ad7afd0e5c02aeb26e917b6c8cc"

      - name: Audit manual report path before Stage 12
        working-directory: source
        run: |
          set -euo pipefail
          REPORT=app/src/main/java/br/com/mapeiaia/rotacerta/ManualTechnicalReportBuilder.kt
          MAIN=app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          grep -Fq 'ForensicIncidentMonitor0193.markManualReport()' "$REPORT"
          grep -Fq 'FarolFlightRecorder0163.exportReport' "$REPORT"
          test "$(grep -Fc 'ManualTechnicalReportBuilder.build(context = context, settings = settings)' "$MAIN")" -eq 1
          test "$(grep -Fc 'supportReportFileCreator.launch("rota-certa-relatorio-depuracao.txt")' "$MAIN")" -eq 2
          ! grep -Fq 'FarolLatencyProbeStage9.dump()' "$REPORT"
          sha256sum "$MAIN" > stage12-evidence/main-pre-stage12.sha256
          sha256sum "$REPORT" > stage12-evidence/report-pre-stage12.sha256

      - name: Run Stage 12 fail-closed controls
        working-directory: source
        run: |
          set -euo pipefail
          python3 -m py_compile ../patches/scripts/apply_farol_latency_manual_export_stage12.py
          echo 'py_compile=passed' | tee stage12-evidence/stage12-py-compile.txt
          python3 ../patches/scripts/apply_farol_latency_manual_export_stage12.py --self-test | tee stage12-evidence/stage12-self-test.txt
          python3 ../patches/scripts/apply_farol_latency_manual_export_stage12.py "$PWD" --check | tee stage12-evidence/stage12-check.txt
          grep -Fxq 'farol_latency_stage12_check=passed' stage12-evidence/stage12-check.txt
          grep -Fxq 'manual_snapshot_only=true' stage12-evidence/stage12-check.txt
          grep -Fxq 'hot_path_sink=absent' stage12-evidence/stage12-check.txt

      - name: Apply Stage 12 manual export wiring
        working-directory: source
        run: |
          set -euo pipefail
          python3 ../patches/scripts/apply_farol_latency_manual_export_stage12.py "$PWD" | tee stage12-evidence/stage12-apply.txt
          grep -Fxq 'farol_latency_stage12_apply=passed' stage12-evidence/stage12-apply.txt
          grep -Fxq 'manual_snapshot_only=true' stage12-evidence/stage12-apply.txt
          grep -Fxq 'hot_path_sink=absent' stage12-evidence/stage12-apply.txt
          grep -Fxq 'buffer_auto_clear=false' stage12-evidence/stage12-apply.txt

      - name: Prove dump is manual-only and FAROL authority is unchanged
        working-directory: source
        run: |
          set -euo pipefail
          REPORT=app/src/main/java/br/com/mapeiaia/rotacerta/ManualTechnicalReportBuilder.kt
          MAIN=app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          SERVICE=app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          GATE=app/src/main/java/br/com/mapeiaia/rotacerta/FarolRealDeviceGate0188.kt
          grep -Fq -- '--- FAROL_LATENCY_STAGE9_SNAPSHOT ---' "$REPORT"
          test "$(grep -Fc 'FarolLatencyProbeStage9.dump()' "$REPORT")" -eq 1
          ! grep -Fq 'FarolLatencyProbeStage9.clear()' "$REPORT"
          grep -R -n --include='*.kt' -F 'FarolLatencyProbeStage9.dump()' app/src/main/java/br/com/mapeiaia/rotacerta | tee stage12-evidence/dump-call-sites.txt
          test "$(wc -l < stage12-evidence/dump-call-sites.txt)" -eq 1
          grep -Fq 'ManualTechnicalReportBuilder.kt:' stage12-evidence/dump-call-sites.txt
          ! grep -Fq 'FarolLatencyProbeStage9.dump()' "$SERVICE"
          ! grep -Fq 'FAROL_LATENCY_STAGE9_SNAPSHOT' "$SERVICE"
          sha256sum -c stage12-evidence/main-pre-stage12.sha256
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          service=(root/'app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt').read_text()
          gate=(root/'app/src/main/java/br/com/mapeiaia/rotacerta/FarolRealDeviceGate0188.kt').read_text()
          checks={
            'return_tokens':len(re.findall(r'\breturn\b', service)),
            'immediate_text_collect':service.count('collectImmediateVisibleTextChecklist13(rootHandle0187.node)'),
            'ocr_extract_structured':service.count('ocrService.extractStructuredText(bitmap0161)'),
            'accessibility_card_blocks':service.count('collectAccessibilityCardBlocks0188('),
            'ocr_card_blocks':service.count('collectOcrCardBlocks0188('),
            'real_device_gate':service.count('FarolRealDeviceGate0188.evaluate('),
            'authorize_route':service.count('authorizeRoute0188('),
            'bubble_duplicate_skipped':service.count('"BUBBLE_DUPLICATE_SKIPPED"'),
          }
          expected={'return_tokens':283,'immediate_text_collect':5,'ocr_extract_structured':1,'accessibility_card_blocks':2,'ocr_card_blocks':2,'real_device_gate':1,'authorize_route':2,'bubble_duplicate_skipped':1}
          if checks != expected: raise SystemExit(f'neutrality post mismatch: {checks!r}')
          authority='val authorityIdentity = "$selected|${winner.block.windowId}|${winner.block.id}|$signature"'
          if gate.count(authority)!=1 or gate.count('screenHash = authorityIdentity.hashCode()')!=1: raise SystemExit('authority mismatch after Stage12')
          (root/'stage12-evidence/neutrality-post.txt').write_text('\n'.join(f'{k}={v}' for k,v in checks.items())+'\nauthority_identity=preserved\nscreen_hash=preserved\n')
          PY
          sha256sum "$REPORT" > stage12-evidence/report-post-stage12.sha256

      - name: Run unit tests
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-stage12-final
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --no-daemon --max-workers=1 --no-parallel --stacktrace
          python3 - <<'PY' | tee stage12-evidence/test-count.txt
          import glob, xml.etree.ElementTree as ET
          tests=failures=0
          for report in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root=ET.parse(report).getroot()
              tests += int(root.attrib.get('tests',0))
              failures += int(root.attrib.get('failures',0)) + int(root.attrib.get('errors',0))
          print(f'tests={tests}')
          print(f'failures={failures}')
          if tests < 399: raise SystemExit(f'Esperados pelo menos 399 testes, encontrados {tests}')
          if failures: raise SystemExit('Há testes com falha')
          PY

      - name: Run lint
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-stage12-final
        run: |
          set -euo pipefail
          ./gradlew lintDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          echo 'lintDebug=passed' | tee stage12-evidence/lint.txt

      - name: Clean assemble debug
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-stage12-final
        run: |
          set -euo pipefail
          ./gradlew clean assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          echo 'clean_assembleDebug=passed' | tee stage12-evidence/assemble.txt

      - name: Validate technical Stage 9/12 APK
        working-directory: source
        run: |
          set -euo pipefail
          APK_SOURCE=app/build/outputs/apk/debug/app-debug.apk
          OUTPUT=artifact-stage12
          APK_NAME=rota-certa-0.1.194-stage9-stage12-latency-manual-export-ci.apk
          test -s "$APK_SOURCE"
          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"
          cp "$APK_SOURCE" "$OUTPUT/$APK_NAME"
          unzip -tqq "$OUTPUT/$APK_NAME"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$OUTPUT/$APK_NAME" | tee "$OUTPUT/apk-badging.txt"
          grep -F "package: name='br.com.mapeiaia.rotacerta' versionCode='5478' versionName='0.1.194'" "$OUTPUT/apk-badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT/$APK_NAME" | tee "$OUTPUT/apk-signature.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$OUTPUT/apk-signature.txt"
          grep -qi 'd9ee577b5bb9a4c72bce115e974c9ecf1ec8c7382bcd034e88d433e01eb0e7fd' "$OUTPUT/apk-signature.txt"
          for dex in $(zipinfo -1 "$OUTPUT/$APK_NAME" | grep -E '^classes([0-9]+)?\.dex$'); do unzip -p "$OUTPUT/$APK_NAME" "$dex"; done | strings > "$OUTPUT/dex-strings.txt"
          for marker in \
            FAROL_LATENCY_STAGE9 \
            ACCESSIBILITY_IMMEDIATE_TEXT \
            ACCESSIBILITY_CARD_BLOCKS \
            OCR_CARD_GROUPS \
            REAL_DEVICE_GATE \
            POST_AUTH_READ_BINDING_FRESH \
            OCR_EXTRACT_STRUCTURED \
            READ_TO_DUPLICATE_SKIP \
            FAROL_LATENCY_STAGE9_SNAPSHOT; do
            grep -Fq "$marker" "$OUTPUT/dex-strings.txt"
          done
          sha256sum "$OUTPUT/$APK_NAME" | tee "$OUTPUT/apk-sha256.txt"
          stat --printf='%s\n' "$OUTPUT/$APK_NAME" | tee "$OUTPUT/apk-size-bytes.txt"
          cp -a stage12-evidence/. "$OUTPUT/"
          sha256sum \
            app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/FarolLatencyProbeStage9.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/ManualTechnicalReportBuilder.kt \
            > "$OUTPUT/instrumented-source.sha256"
          cat > "$OUTPUT/validation.txt" <<'VALIDATION'
          package=br.com.mapeiaia.rotacerta
          versionName=0.1.194
          versionCode=5478
          status=technical_measurement_apk_not_for_release
          stage9_sink=bounded_memory_only
          stage12_snapshot=manual_report_only
          stage12_buffer_auto_clear=false
          hot_path_dump_call=false
          hot_path_persistence_added=false
          main_activity_changed=false
          farol_authority=preserved
          physical_test=false
          latency_measured=false
          optimization_performed=false
          VALIDATION
          sed -i 's/^          //' "$OUTPUT/validation.txt"

      - name: Upload Stage 12 evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-stage12-manual-latency-export-ci-evidence
          path: source/artifact-stage12
          if-no-files-found: error
          retention-days: 30
