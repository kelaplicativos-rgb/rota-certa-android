name: Inspect Generated Popup 120

on:
  workflow_dispatch:
  push:
    branches:
      - codex/pr5-stable-bubble-combined
      - codex/rota-certa-0.1.127-strict-final
  pull_request:
    branches: [main]

concurrency:
  group: inspect-generated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inspect:
    name: Generate and upload final patched sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Generate final sources
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: gradle :app:preBuild --no-daemon --stacktrace --console=plain

      - name: Record exact markers
        run: |
          main="app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt"
          service="app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt"
          matcher="app/src/main/java/br/com/mapeiaia/rotacerta/RideCardTemplateMatcher.kt"
          guard="app/src/main/java/br/com/mapeiaia/rotacerta/UniversalRuntimeGuards.kt"
          controller="app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt"
          engine="app/src/main/java/br/com/mapeiaia/rotacerta/ProximityAlertEngine.kt"
          {
            echo "MAIN_LINES=$(wc -l < "$main")"
            echo "SERVICE_LINES=$(wc -l < "$service")"
            echo "MATCHER_LINES=$(wc -l < "$matcher")"
            grep -nF 'BUBBLE_GROUP_CARDS' "$main" || true
            grep -nF 'Buscar por nome ou endereco' "$main" || true
            grep -nF 'Modelos de cards obrigatorios' "$main" || true
            grep -nF 'manual_registered_card_gate_0_1_127' "$service" || true
            grep -nF 'locked_popup_event_before_package_block_0_1_128' "$service" || true
            grep -nF 'automatic_capture_before_model_match_0_1_128' "$service" || true
            grep -nF 'direct_address_route_fast_path_0_1_128' "$service" || true
            grep -nF 'indrive_locked_popup_two_addresses_0_1_128' "$matcher" || true
            grep -nF 'isInDriveOpenedCardContract' "$matcher" || true
            grep -nF 'ROUTE_INFLIGHT_GRACE_MILLIS' "$guard" || true
            grep -nF 'if (alert.type != SavedPlaceType.ProximityAlert)' "$controller" || true
            grep -nF 'popupShownThisApproach' "$engine" || true
          } > generated-markers.txt
          cat generated-markers.txt

          grep -Fq 'manual_registered_card_gate_0_1_127' "$service"
          grep -Fq 'locked_popup_event_before_package_block_0_1_128' "$service"
          grep -Fq 'indrive_locked_popup_two_addresses_0_1_128' "$matcher"
          if grep -Pzo '@Composable\s*\n@Composable\s*\n' "$main" >/dev/null; then
            echo 'ERRO: @Composable duplicado nos fontes finais.'
            exit 1
          fi

      - name: Upload generated source evidence
        uses: actions/upload-artifact@v4
        with:
          name: generated-popup-120-source
          path: |
            app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/RideCardTemplateMatcher.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/UniversalRuntimeGuards.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/GoogleMapsService.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutModule.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/ProximityAlertEngine.kt
            generated-markers.txt
          if-no-files-found: error
