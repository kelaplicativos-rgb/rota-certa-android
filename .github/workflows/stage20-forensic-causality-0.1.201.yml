name: Validate Stage 20 forensic causality 0.1.201

on:
  pull_request:
    branches:
      - agent/stage19-universal-visual-pipeline-0.1.200
    paths:
      - .github/workflows/stage20-forensic-causality-0.1.201.yml
      - scripts/apply_farol_forensic_causality_stage20.py
      - stage20/**
  workflow_dispatch:

concurrency:
  group: stage20-forensic-causality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  validate-stage20:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout protected canonical source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Checkout exact Stage 20 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: patches

      - name: Restore exact materialized Stage 18 source
        uses: actions/download-artifact@v4
        with:
          name: rota-certa-stage19-materialized-stage18-source
          path: bootstrap
          github-token: ${{ github.token }}
          repository: kelaplicativos-rgb/rota-certa-android
          run-id: 31612053591

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Setup cached Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: Restore Stage 18 and apply exact Stage 19 baseline
        run: |
          set -euo pipefail
          mkdir -p source/stage20-evidence
          cd bootstrap
          EXPECTED="$(awk 'NR==1 {print $1}' stage18-materialized-source.sha256)"
          ACTUAL="$(sha256sum stage18-materialized-source.tgz | awk '{print $1}')"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED" "$ACTUAL" | tee ../source/stage20-evidence/stage18-bootstrap-sha256-check.txt
          test "$EXPECTED" = "$ACTUAL"
          cd ../source
          rm -rf app/src/main/java app/src/test/java
          tar -xzf ../bootstrap/stage18-materialized-source.tgz
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('app/src/main/res/xml/rota_certa_accessibility.xml')
          text = path.read_text(encoding='utf-8')
          text, a = re.subn(r'android:accessibilityEventTypes="[^"]+"', 'android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewTextChanged|typeWindowsChanged|typeNotificationStateChanged"', text, count=1)
          text, b = re.subn(r'android:notificationTimeout="\d+"', 'android:notificationTimeout="100"', text, count=1)
          if a != 1 or b != 1: raise SystemExit(f'accessibility resource restoration failed: events={a}, timeout={b}')
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile ../patches/scripts/apply_universal_visual_pipeline_stage19.py
          python3 ../patches/scripts/apply_universal_visual_pipeline_stage19.py --self-test | tee stage20-evidence/stage19-self-test.txt
          python3 ../patches/scripts/apply_universal_visual_pipeline_stage19.py "$PWD" | tee stage20-evidence/stage19-apply.txt
          grep -Fxq 'stage19_apply=passed' stage20-evidence/stage19-apply.txt
          grep -Fq 'versionCode = 5484' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.200"' app/build.gradle.kts
          grep -Fq 'UNIVERSAL_VISUAL_AUTHORITY_STAGE19' app/src/main/java/br/com/mapeiaia/rotacerta/FarolUniversalVisualPipelineStage19.kt
          sha256sum \
            app/src/main/java/br/com/mapeiaia/rotacerta/DecisionEngine.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/GoogleMapsService.kt \
            app/src/main/AndroidManifest.xml \
            app/src/main/res/xml/rota_certa_accessibility.xml \
            > stage20-evidence/protected-pre-stage20.sha256

      - name: Apply Stage 20 forensic causality recorder
        working-directory: source
        run: |
          set -euo pipefail
          python3 -m py_compile ../patches/scripts/apply_farol_forensic_causality_stage20.py
          python3 ../patches/scripts/apply_farol_forensic_causality_stage20.py --self-test | tee stage20-evidence/stage20-self-test.txt
          python3 ../patches/scripts/apply_farol_forensic_causality_stage20.py "$PWD" | tee stage20-evidence/stage20-apply.txt
          grep -Fxq 'stage20_apply=passed' stage20-evidence/stage20-apply.txt
          grep -Fxq 'event_cycle_id=true' stage20-evidence/stage20-apply.txt
          grep -Fxq 'trace_id=true' stage20-evidence/stage20-apply.txt
          grep -Fxq 'route_job_id=true' stage20-evidence/stage20-apply.txt
          grep -Fxq 'paint_token=true' stage20-evidence/stage20-apply.txt
          grep -Fxq 'legacy_unscoped_final_paint_detected=true' stage20-evidence/stage20-apply.txt
          grep -Fxq 'route_ready_to_paint_gap_measured=true' stage20-evidence/stage20-apply.txt
          grep -Fq 'versionCode = 5485' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.201"' app/build.gradle.kts
          grep -Fq 'FAROL_FORENSIC_CAUSALITY_STAGE20' app/src/main/java/br/com/mapeiaia/rotacerta/FarolForensicTraceStage20.kt
          grep -Fq 'stage20ExpectedPaintToken' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          test "$(grep -Fc '@Test' app/src/test/java/br/com/mapeiaia/rotacerta/FarolForensicTraceStage20Test.kt)" -eq 34
          sha256sum -c stage20-evidence/protected-pre-stage20.sha256 | tee stage20-evidence/protected-post-stage20-check.txt
          gradle --version | tee stage20-evidence/gradle-version.txt

      - name: Run Stage 20 deterministic tests
        working-directory: source
        run: |
          set +e
          gradle testDebugUnitTest --tests 'br.com.mapeiaia.rotacerta.FarolForensicTraceStage20Test' --no-daemon --max-workers=1 --no-parallel --stacktrace 2>&1 | tee stage20-evidence/stage20-specific-tests.log
          GRADLE_STATUS=${PIPESTATUS[0]}
          set -e
          echo "gradle_status=$GRADLE_STATUS" | tee stage20-evidence/stage20-specific-gradle-status.txt
          set +e
          python3 - <<'PY' | tee stage20-evidence/stage20-specific-test-count.txt
          import glob, xml.etree.ElementTree as ET
          tests=failures=errors=skipped=0; failed=[]
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root=ET.parse(path).getroot(); tests += int(root.attrib.get('tests',0)); failures += int(root.attrib.get('failures',0)); errors += int(root.attrib.get('errors',0)); skipped += int(root.attrib.get('skipped',0))
              for case in root.findall('.//testcase'):
                  for tag in ('failure','error'):
                      bad=case.find(tag)
                      if bad is not None: failed.append(f"{case.attrib.get('classname','')}.{case.attrib.get('name','')} :: {bad.attrib.get('message','')}")
          print(f'tests={tests}'); print(f'failures={failures}'); print(f'errors={errors}'); print(f'skipped={skipped}')
          for item in failed: print('FAILED=' + item)
          if tests != 34 or failures or errors or skipped: raise SystemExit(1)
          PY
          COUNT_STATUS=${PIPESTATUS[0]}
          set -e
          if [[ "$GRADLE_STATUS" != "0" || "$COUNT_STATUS" != "0" ]]; then
            echo "stage20_specific_validation=failed gradle=$GRADLE_STATUS count=$COUNT_STATUS" | tee stage20-evidence/stage20-specific-validation.txt
            exit 1
          fi
          echo 'stage20_specific_validation=passed' | tee stage20-evidence/stage20-specific-validation.txt

      - name: Run complete unit suite
        working-directory: source
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon --max-workers=1 --no-parallel --stacktrace 2>&1 | tee stage20-evidence/full-unit-suite.log
          GRADLE_STATUS=${PIPESTATUS[0]}
          set -e
          echo "gradle_status=$GRADLE_STATUS" | tee stage20-evidence/full-suite-gradle-status.txt
          set +e
          python3 - <<'PY' | tee stage20-evidence/full-test-count.txt
          import glob, xml.etree.ElementTree as ET
          tests=failures=errors=skipped=0; failed=[]
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root=ET.parse(path).getroot(); tests += int(root.attrib.get('tests',0)); failures += int(root.attrib.get('failures',0)); errors += int(root.attrib.get('errors',0)); skipped += int(root.attrib.get('skipped',0))
              for case in root.findall('.//testcase'):
                  for tag in ('failure','error'):
                      bad=case.find(tag)
                      if bad is not None: failed.append(f"{case.attrib.get('classname','')}.{case.attrib.get('name','')} :: {bad.attrib.get('message','')}")
          print(f'tests={tests}'); print(f'failures={failures}'); print(f'errors={errors}'); print(f'skipped={skipped}')
          for item in failed: print('FAILED=' + item)
          if tests != 557 or failures or errors or skipped: raise SystemExit(1)
          PY
          COUNT_STATUS=${PIPESTATUS[0]}
          set -e
          if [[ "$GRADLE_STATUS" != "0" || "$COUNT_STATUS" != "0" ]]; then
            echo "full_suite_validation=failed gradle=$GRADLE_STATUS count=$COUNT_STATUS" | tee stage20-evidence/full-suite-validation.txt
            exit 1
          fi
          echo 'full_suite_validation=passed' | tee stage20-evidence/full-suite-validation.txt

      - name: Run Android Lint
        working-directory: source
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          gradle lintDebug --no-daemon --max-workers=1 --no-parallel --stacktrace 2>&1 | tee stage20-evidence/lint-debug.log
          test -f app/build/reports/lint-results-debug.html
          cp app/build/reports/lint-results-debug.html stage20-evidence/lint-results-debug.html

      - name: Clean assembleDebug
        working-directory: source
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          gradle clean assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace 2>&1 | tee stage20-evidence/clean-assemble-debug.log

      - name: Validate APK package version signature and DEX
        working-directory: source
        run: |
          set -euo pipefail
          OUT=stage20-evidence
          APK_SRC=app/build/outputs/apk/debug/app-debug.apk
          APK="$OUT/rota-certa-0.1.201-stage20-forensic-causality-ci.apk"
          test -s "$APK_SRC"
          cp "$APK_SRC" "$APK"
          unzip -tqq "$APK"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | tee "$OUT/badging.txt"
          grep -F "package: name='br.com.mapeiaia.rotacerta' versionCode='5485' versionName='0.1.201'" "$OUT/badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$OUT/signature.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$OUT/signature.txt"
          grep -qi 'd9ee577b5bb9a4c72bce115e974c9ecf1ec8c7382bcd034e88d433e01eb0e7fd' "$OUT/signature.txt"
          sha256sum "$APK" | tee "$OUT/apk.sha256"
          stat --printf='%s\n' "$APK" | tee "$OUT/apk-size-bytes.txt"
          STAGE19=0; STAGE20=0
          for dex in $(zipinfo -1 "$APK" | grep -E '^classes[0-9]*\.dex$'); do
            unzip -p "$APK" "$dex" | strings | grep -Fq 'UNIVERSAL_VISUAL_AUTHORITY_STAGE19' && STAGE19=1 || true
            unzip -p "$APK" "$dex" | strings | grep -Fq 'FAROL_FORENSIC_CAUSALITY_STAGE20' && STAGE20=1 || true
          done
          test "$STAGE19" = 1
          test "$STAGE20" = 1
          printf 'dex_stage19_marker=true\ndex_stage20_marker=true\n' | tee "$OUT/dex-validation.txt"

      - name: Upload Stage 20 final evidence and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.201-stage20-forensic-causality-final
          path: source/stage20-evidence/
          if-no-files-found: error
          retention-days: 30
