name: Materialize tester 0.1.378

on:
  push:
    branches:
      - agent/tester-exclusive-link-0.1.378
    paths:
      - '.executor/**'
      - '.github/workflows/zz-executor-materialize-tester-0378.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/tester-exclusive-link-0.1.378
          fetch-depth: 0

      - name: Reconstruct and apply deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          cat .executor/tester-0378.patch.gz.b64.* > /tmp/tester0378.patch.gz.b64
          base64 -d /tmp/tester0378.patch.gz.b64 > /tmp/tester0378.patch.gz
          gzip -t /tmp/tester0378.patch.gz
          gzip -dc /tmp/tester0378.patch.gz > /tmp/tester0378.raw.patch
          sed -E 's#^(--- )[[:space:]]*/mnt/data/rota-certa-pristine/rota-certa-android-[^/]+/#\\1./#' /tmp/tester0378.raw.patch > /tmp/tester0378.patch
          patch -p0 --batch --forward < /tmp/tester0378.patch
          git diff --check
          node --check trip-platform/functions/index.js
          node --check trip-platform/public/app.js

      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .executor
          rm -f .github/workflows/zz-executor-materialize-tester-0378.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(agenda): add isolated tester link 0.1.378"
          git push origin HEAD:agent/tester-exclusive-link-0.1.378
