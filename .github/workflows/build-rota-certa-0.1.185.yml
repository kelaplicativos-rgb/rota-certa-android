name: Build Rota Certa 0.1.185

on:
  pull_request:
    branches: [agent/home-catalog-directional-shortcuts-0.1.184]
    paths:
      - .github/workflows/build-rota-certa-0.1.185.yml
      - scripts/build_rota_certa_0185.sh
      - scripts/document_release_0185.py
      - patches/fix-live-card-isolation-0185.patch.gz.b64
  workflow_dispatch:

concurrency:
  group: rota-certa-0.1.185-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: codex/unified-debug-log-0.1.139
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Checkout cumulative patches
        uses: actions/checkout@v4
        with:
          ref: agent/fix-indrive-card-isolation-0.1.185
          fetch-depth: 0
          persist-credentials: true
          path: patches

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test, lint and validate 0.1.185
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-0185
        run: |
          set -o pipefail
          bash ../patches/scripts/build_rota_certa_0185.sh ../patches 2>&1 | tee build-0.1.185.log

      - name: Upload failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.185-failure-diagnostic
          path: source/build-0.1.185.log
          retention-days: 14
          if-no-files-found: error

      - name: Upload validated APK
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.185-indrive-card-isolation-validated
          path: source/artifact-0.1.185/
          retention-days: 90
          if-no-files-found: error

      - name: Publish permanent latest signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="source/artifact-0.1.185/rota-certa-0.1.185-card-individual-indrive-validado.apk"
          EXPECTED_SHA="$(awk '{print $1}' source/artifact-0.1.185/sha256.txt)"
          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          STABLE_APK="${RUNNER_TEMP}/rota-certa-latest.apk"
          VERSIONED_APK="${RUNNER_TEMP}/rota-certa-0.1.185.apk"
          cp "$APK" "$STABLE_APK"
          cp "$APK" "$VERSIONED_APK"

          cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          Rota Certa 0.1.185 (5460)

          - Pacote: br.com.mapeiaia.rotacerta
          - APK assinado com assinatura v2 validada
          - SHA-256: ${ACTUAL_SHA}
          - Build, testes unitários, contratos, Android Lint e assembleDebug aprovados
          - Correção: isolamento do card individual do inDrive e contenção da leitura de acessibilidade
          - Validação em aparelho real: pendente no Samsung SM-S911B / Android 16

          O arquivo rota-certa-latest.apk mantém um endereço permanente e será substituído pela versão validada mais recente.
          EOF

          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Rota Certa — versão mais recente (0.1.185)" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
          else
            gh release create latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Rota Certa — versão mais recente (0.1.185)" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi

          gh release upload latest \
            "$STABLE_APK" \
            "$VERSIONED_APK" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release view latest --repo "$GITHUB_REPOSITORY" --json url,tagName,name,assets

      - name: Document validated release
        working-directory: patches
        env:
          ARTIFACT_ID: ${{ steps.upload_apk.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_apk.outputs.artifact-digest }}
          RUN_ID: ${{ github.run_id }}
          BRANCH_NAME: agent/fix-indrive-card-isolation-0.1.185
        run: |
          set -euo pipefail
          FUNCTIONAL_COMMIT="$(git rev-parse HEAD)"
          python scripts/document_release_0185.py \
            --artifact-dir ../source/artifact-0.1.185 \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --run-id "$RUN_ID" \
            --branch "$BRANCH_NAME" \
            --functional-commit "$FUNCTIONAL_COMMIT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md docs/DECISIONS.md validation/0.1.185/latest.txt
          if ! git diff --cached --quiet; then
            git commit -m "Document validated Rota Certa 0.1.185 [skip ci]"
            git push origin "HEAD:$BRANCH_NAME"
          fi
