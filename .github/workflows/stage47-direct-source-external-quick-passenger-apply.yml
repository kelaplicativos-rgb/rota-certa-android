name: Stage47 direct-source external quick passenger apply

on:
  push:
    branches:
      - agent/stage47-r4-step7-automatic-identity
    paths:
      - .github/workflows/stage47-direct-source-external-quick-passenger-apply.yml

permissions:
  contents: write

jobs:
  apply-direct-source-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROTECTED_FAROL_SHA256: 2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560
      PATCH_FILE: stage47/source-patches/external-quick-passenger-direct-source.patch
    steps:
      - name: Checkout current persisted Stage47 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify persisted source and apply focused patch
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          UI='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt'
          TEST='app/src/test/java/br/com/mapeiaia/rotacerta/trips/TripTimelineExternalQuickPassengerStage47Test.kt'
          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          test -s "$UI"
          test -s "$PATCH_FILE"
          grep -Fq 'val options = entries.mapNotNull' "$UI"
          git apply --check "$PATCH_FILE"
          git apply "$PATCH_FILE"
          git diff --exit-code -- "$FAROL"
          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          grep -Fq 'timelineQuickPassengerOptions(entries, trips)' "$UI"
          grep -Fq 'ExternalTripCapacitySetup(entry, store, onChanged)' "$UI"
          grep -Fq 'external_seat_write_claimed=false' "$UI"
          grep -Fq 'canonicalTimelineProfileUuid(entry)' "$UI"
          grep -Fq 'findExistingTimelineBackingTrip(entry, store.trips())' "$UI"
          test -s "$TEST"
          ! grep -Fq '7371f028-9c55-4903-8444-308015823efd' "$TEST"
          ! grep -Fq '175a7068-50d8-40c3-a27a-214b9c6e0461' "$TEST"
          echo 'stage47_direct_source_patch_static=PASS'
          echo 'farol_untouched=true'
          echo 'external_seat_write_claimed=false'
          echo 'apk_generated=false'

      - name: Commit only real app source and retire patch transport
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          UI='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt'
          TEST='app/src/test/java/br/com/mapeiaia/rotacerta/trips/TripTimelineExternalQuickPassengerStage47Test.kt'
          git config user.name 'Rota Certa Stage47 direct source'
          git config user.email 'actions@users.noreply.github.com'
          git rm -- "$PATCH_FILE" '.github/workflows/stage47-direct-source-external-quick-passenger-apply.yml'
          git add -- "$UI" "$TEST"
          git diff --cached --exit-code -- "$FAROL"
          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          git commit -m 'Stage47 support external Timeline quick passenger from persisted source'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'stage47_direct_source_commit=PASS'
          echo 'farol_sha256=2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560'
          echo 'apk_generated=false'
