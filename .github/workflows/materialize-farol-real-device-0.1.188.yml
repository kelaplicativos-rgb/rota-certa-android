name: Materialize farol real-device source 0.1.188

on:
  pull_request:
    branches: [agent/fix-farol-runtime-0.1.187]
    paths:
      - .github/workflows/materialize-farol-real-device-0.1.188.yml
      - scripts/**
      - tests/**
      - patches/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farol-real-device-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Verify protected source commit
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42"

      - name: Checkout exact functional head that built installed APK
        uses: actions/checkout@v4
        with:
          ref: 3537a13edbc0d72627d650a18b4da58da8ecb316
          fetch-depth: 0
          persist-credentials: false
          path: patches

      - name: Verify exact functional head
        working-directory: patches
        run: test "$(git rev-parse HEAD)" = "3537a13edbc0d72627d650a18b4da58da8ecb316"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Materialize and validate exact installed 0.1.187 source
        id: baseline
        continue-on-error: true
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-real-device
        run: |
          set -o pipefail
          bash -x ../patches/scripts/build_rota_certa_0187.sh ../patches 2>&1 | tee materialize-real-device.log

      - name: Package effective farol source and diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p effective-source/app-main effective-source/app-test effective-source/scripts effective-source/patches
          printf 'baseline_outcome=%s\n' '${{ steps.baseline.outcome }}' > effective-source/baseline-outcome.txt
          printf 'functional_head=%s\n' '3537a13edbc0d72627d650a18b4da58da8ecb316' > effective-source/functional-head.txt
          cp source/materialize-real-device.log effective-source/ 2>/dev/null || true
          for file in \
            LiveRideAccessibilityService.kt \
            FarolRuntimeSafety0187.kt \
            RideTextParser.kt \
            RideOfferDetector.kt \
            SimpleSavedAppFarolPolicy.kt \
            UniversalAddressTrigger.kt \
            UniversalScreenAddressParser.kt \
            UniversalTwoAddressConfirmation0185.kt \
            SelectedRideOverlayWindowPolicy.kt \
            UniversalWindowPackageResolver.kt \
            UniversalFastReadPolicy.kt; do
            find source/app/src/main/java/br/com/mapeiaia/rotacerta -maxdepth 1 -type f -name "$file" \
              -exec cp {} effective-source/app-main/ \; 2>/dev/null || true
          done
          if [[ -d source/app/src/test/java/br/com/mapeiaia/rotacerta ]]; then
            find source/app/src/test/java/br/com/mapeiaia/rotacerta -maxdepth 1 -type f \
              \( -name '*Farol*Test.kt' -o -name '*Ride*Test.kt' -o -name '*Universal*Test.kt' -o -name '*Card*Test.kt' -o -name '*Overlay*Test.kt' \) \
              -exec cp {} effective-source/app-test/ \;
          fi
          cp patches/scripts/build_rota_certa_0187.sh effective-source/scripts/
          cp patches/scripts/build_rota_certa_0186.sh effective-source/scripts/
          cp patches/scripts/inject_build_rota_certa_0187*.py effective-source/scripts/ 2>/dev/null || true
          cp patches/scripts/fix_farol_phase4_address_signature.py effective-source/scripts/ 2>/dev/null || true
          cp patches/patches/farol-runtime-0187-phase3.patch effective-source/patches/ 2>/dev/null || true
          cp patches/patches/farol-runtime-0187-phase4.patch.gz.b64 effective-source/patches/ 2>/dev/null || true
          if [[ -d source/artifact-0.1.187 ]]; then
            cp -a source/artifact-0.1.187 effective-source/
          fi
          find source/app/src/main/java/br/com/mapeiaia/rotacerta -maxdepth 1 -type f -printf '%f\n' \
            | sort > effective-source/materialized-main-files.txt
          find effective-source -type f -print0 | sort -z | xargs -0 sha256sum > effective-source/files.sha256

      - name: Upload exact effective source and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farol-effective-source-0.1.187-real-device
          path: effective-source/
          retention-days: 14
          if-no-files-found: error

      - name: Preserve baseline failure status
        if: steps.baseline.outcome != 'success'
        run: |
          echo 'A materialização do head funcional exato falhou; o artifact diagnóstico foi preservado.' >&2
          exit 1
