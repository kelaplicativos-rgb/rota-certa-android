name: Rota Certa 0.1.629 exactly-once reservation

on:
  push:
    branches:
      - agent/viagem-certa-exactly-once-0.1.629
    paths:
      - '.github/workflows/viagem-certa-exactly-once-0.1.629.yml'
      - 'trip-platform/**'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-deploy-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_API_KEY: ci_dummy_key_0629
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      SOURCE_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify exact 0.1.629 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "ROTA_CERTA_GIT_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_BRANCH=agent/viagem-certa-exactly-once-0.1.629" >> "$GITHUB_ENV"
          grep -Fq 'val releaseVersionCode = 5_920' app/build.gradle.kts
          grep -Fq 'val releaseVersionName = "0.1.629"' app/build.gradle.kts
          grep -Fq '"version": "0.1.629"' app/src/main/assets/release_history.json
          grep -Fq 'bookingIntentStorageKey0629' trip-platform/public/public-agenda-shell-0569.js
          grep -Fq 'reconcileBookingIntent0629' trip-platform/public/public-agenda-shell-0569.js
          grep -Fq 'void loadAgenda0569(true)' trip-platform/public/public-agenda-shell-0569.js
          grep -Fq 'getPassengerBookingIntent0629' trip-platform/functions/index.js
          grep -Fq 'equivalentActivePassengerBooking0629' trip-platform/functions/index.js
          grep -Fq 'clientIntentId: idempotencyKey' trip-platform/functions/index.js
          grep -Fq 'PASSENGER_DIRECTORY_BATCH_SIZE_0629 = 40' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripRemoteApi.kt
          grep -Fq 'PASSENGER_DIRECTORY_DEFERRED_0629' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicBookingSync0296.kt
          grep -Fq '0.1.629-exactly-once' trip-platform/public/index.html
          ! grep -Fq 'await loadAgenda0569(true);' trip-platform/public/public-agenda-shell-0569.js

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate booking contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/public/public-agenda-shell-0569.js
          node --check trip-platform/public/minha-area.js
          node --test             trip-platform/functions/test/reservation-approval-0356.test.js             trip-platform/functions/test/public-booking-0296.test.js             trip-platform/functions/test/public-booking-realtime-0304.test.js             trip-platform/functions/test/viagem-certa-passenger-gate-0589.test.js             trip-platform/functions/test/viagem-certa-passenger-timeline-0625.test.js             trip-platform/functions/test/viagem-certa-known-device-0626.test.js             trip-platform/functions/test/viagem-certa-trip-target-0628.test.js             trip-platform/functions/test/viagem-certa-exactly-once-0629.test.js
          npm --prefix trip-platform/functions install --no-audit --no-fund

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend exact SHA
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          gcloud functions deploy tripApi             --gen2             --project="$PROJECT"             --region=southamerica-east1             --runtime=nodejs20             --source=trip-platform/functions             --entry-point=tripApi             --trigger-http             --allow-unauthenticated             --clear-secrets             --update-env-vars="ROTA_CERTA_BACKEND_GIT_SHA=$SOURCE_SHA"             --quiet

      - name: Deploy public Agenda exact SHA
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
          chmod 600 /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          npx --yes firebase-tools@14.12.0 deploy             --only hosting             --project "$PROJECT"             --config trip-platform/firebase.json             --non-interactive

      - name: Smoke live exact SHA
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://rota-certa-7ccc8.web.app
          curl --retry 20 --retry-delay 3 --fail --silent --show-error "$BASE/v1/health" | tee /tmp/live-health.json
          grep -Fq '"ok":true' /tmp/live-health.json
          grep -Fq "\"backendGitSha\":\"$SOURCE_SHA\"" /tmp/live-health.json
          curl --retry 10 --retry-delay 2 --fail --silent --show-error "$BASE/" | tee /tmp/live-index.html
          grep -Fq '0.1.629-exactly-once' /tmp/live-index.html
          test "$(grep -o 'public-agenda-shell-0569.js' /tmp/live-index.html | wc -l)" -eq 1
          curl --retry 10 --retry-delay 2 --fail --silent --show-error "$BASE/public-agenda-shell-0569.js?v=0.1.629-exactly-once" | tee /tmp/live-shell.js
          grep -Fq 'bookingIntentStorageKey0629' /tmp/live-shell.js
          grep -Fq 'reconcileBookingIntent0629' /tmp/live-shell.js

      - name: Configure Firebase Android SDK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@14.12.0 apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@14.12.0 apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@14.12.0 apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@14.12.0 apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test Android contracts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest             --tests '*PassengerIdentityIntegrity0627Test'             --tests '*PassengerPickerCanonical0352Test'             --tests '*CanonicalPassengerSegments0491Test'             --tests '*GlobalPassengerFlow0256Test'             --tests '*ReservationApproval0356Test'             --tests '*AgendaCanonicalCentralSync0403Test'             --tests '*PublicAgendaAutoSync0300Test'             --tests '*SegmentAvailabilityTruthGate0603Test'             --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Build exact SHA APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/aapt.txt
          grep -Fq "name='br.com.mapeiaia.rotacerta'" /tmp/aapt.txt
          grep -Fq "versionCode='5920'" /tmp/aapt.txt
          grep -Fq "versionName='0.1.629'" /tmp/aapt.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/apksigner.txt
          grep -Fq 'Verified' /tmp/apksigner.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex.txt
          grep -Fq "$SOURCE_SHA" /tmp/dex.txt
          mkdir -p /tmp/0629
          SHORT_SHA="$(printf '%s' "$SOURCE_SHA" | cut -c1-12)"
          cp "$APK" "/tmp/0629/RotaCerta-0.1.629-build5920-$SHORT_SHA-SM-S911B.apk"
          sha256sum /tmp/0629/*.apk | tee /tmp/0629/apk.sha256
          printf 'source_head=%s\nversion=0.1.629/5920\npackage=br.com.mapeiaia.rotacerta\ntarget=Samsung SM-S911B\n' "$SOURCE_SHA" > /tmp/0629/final-status.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.629-5920-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0629
