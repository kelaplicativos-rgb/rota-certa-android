name: Validate Stage 30 presence authority shadow replay 0.1.206

on:
  pull_request:
    branches:
      - agent/stage28-causal-latency-stale-activation-0.1.205
    paths:
      - '.github/workflows/stage30-presence-authority-shadow-replay-0.1.206.yml'
      - 'scripts/apply_farol_presence_authority_stage30.py'
      - 'stage30/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-stage30:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected canonical source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          path: source
          fetch-depth: 1

      - name: Checkout Stage30 patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: patches
          fetch-depth: 1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore exact Stage18 materialized source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p bootstrap evidence
          gh run download 31612053591 \
            --repo kelaplicativos-rgb/rota-certa-android \
            --name rota-certa-stage19-materialized-stage18-source \
            --dir bootstrap
          TGZ="$(find bootstrap -name stage18-materialized-source.tgz -print -quit)"
          SHA_FILE="$(find bootstrap -name stage18-materialized-source.sha256 -print -quit)"
          test -n "$TGZ" -a -f "$TGZ"
          test -n "$SHA_FILE" -a -f "$SHA_FILE"
          EXPECTED="$(awk '{print $1}' "$SHA_FILE")"
          ACTUAL="$(sha256sum "$TGZ" | awk '{print $1}')"
          test "$EXPECTED" = "b6a81198842bdba9aa38fc6ec8643e4ec24bce4449e01ecc28f16940c4c977a7"
          test "$ACTUAL" = "$EXPECTED"
          printf 'required_stage18=%s\nexpected=%s\nactual=%s\n' \
            'b6a81198842bdba9aa38fc6ec8643e4ec24bce4449e01ecc28f16940c4c977a7' "$EXPECTED" "$ACTUAL" \
            | tee evidence/stage18-bootstrap-sha256-check.txt
          rm -rf source/app/src/main/java source/app/src/test/java
          tar -xzf "$TGZ" -C source
          grep -q 'versionName = "0.1.198"' source/app/build.gradle.kts

      - name: Preserve accessibility event contract
        run: |
          set -euo pipefail
          cat > source/app/src/main/res/xml/rota_certa_accessibility.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewTextChanged|typeWindowsChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="100" />
          XML

      - name: Materialize Stage19 Stage20 Stage21 Stage23
        run: |
          set -euo pipefail
          python patches/scripts/apply_universal_visual_pipeline_stage19.py --self-test | tee evidence/stage19-self-test.txt
          python patches/scripts/apply_universal_visual_pipeline_stage19.py source | tee evidence/stage19-apply.txt
          python patches/scripts/apply_farol_forensic_causality_stage20.py --self-test | tee evidence/stage20-self-test.txt
          python patches/scripts/apply_farol_forensic_causality_stage20.py source | tee evidence/stage20-apply.txt
          python patches/scripts/apply_farol_causal_corrections_stage21.py --self-test | tee evidence/stage21-self-test.txt
          python patches/scripts/apply_farol_causal_corrections_stage21.py source | tee evidence/stage21-apply.txt
          python patches/scripts/apply_farol_visual_identity_stage23.py --self-test | tee evidence/stage23-self-test.txt
          python patches/scripts/apply_farol_visual_identity_stage23.py source | tee evidence/stage23-apply.txt
          grep -q 'versionCode = 5487' source/app/build.gradle.kts
          grep -q 'versionName = "0.1.203"' source/app/build.gradle.kts

      - name: Materialize exact Stage26 and Stage28
        run: |
          set -euo pipefail
          python patches/scripts/apply_farol_reading_activation_stage26_materialized.py --self-test | tee evidence/stage26-self-test.txt
          python patches/scripts/apply_farol_reading_activation_stage26_materialized.py source | tee evidence/stage26-apply.txt
          grep -q 'versionCode = 5488' source/app/build.gradle.kts
          grep -q 'versionName = "0.1.204"' source/app/build.gradle.kts
          python patches/scripts/apply_farol_causal_latency_stage28_v2.py --self-test | tee evidence/stage28-self-test.txt
          python patches/scripts/apply_farol_causal_latency_stage28_v2.py source | tee evidence/stage28-apply.txt
          grep -q 'versionCode = 5489' source/app/build.gradle.kts
          grep -q 'versionName = "0.1.205"' source/app/build.gradle.kts
          grep -q 'FAROL_CAUSAL_LATENCY_STALE_ACTIVATION_STAGE28' source/app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt

      - name: Stage30 self-test and materialization
        run: |
          set -euo pipefail
          python patches/scripts/apply_farol_presence_authority_stage30.py --self-test | tee evidence/stage30-self-test.txt
          python patches/scripts/apply_farol_presence_authority_stage30.py source | tee evidence/stage30-apply.txt
          grep -q 'versionCode = 5490' source/app/build.gradle.kts
          grep -q 'versionName = "0.1.206"' source/app/build.gradle.kts
          grep -q 'FAROL_PRESENCE_AUTHORITY_STAGE30' source/app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'ACCESSIBILITY_DIRECT_ACTIVATES_STAGE30' source/app/src/main/java/br/com/mapeiaia/rotacerta/FarolPresenceAuthorityStage30.kt
          grep -q 'SESSION_BOUNDED_USAGE_ADAPTER_STAGE30' source/app/src/main/java/br/com/mapeiaia/rotacerta/SelectedAppPresenceStateStage30.kt
          grep -q 'RUNNING_PROCESS_NEVER_AUTHORITY_STAGE30' source/app/src/main/java/br/com/mapeiaia/rotacerta/SelectedAppPresenceStateStage30.kt
          grep -q 'FarolPresenceAuthorityStage30.Diagnostics.export()' source/app/src/main/java/br/com/mapeiaia/rotacerta/ManualTechnicalReportBuilder.kt
          grep -q 'RadarColor.Idle, distanceKm = null' source/app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'collectUniversalAccessibilitySnapshotStage28(eventStage26)' source/app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'FarolCausalLatencyStage28::trimNarrativeSuffix' source/app/src/main/java/br/com/mapeiaia/rotacerta/FarolCausalCorrectionStage21.kt
          grep -q 'drivingDistancesFromAddressKm' source/app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          python - <<'PY' | tee evidence/stage30-runtime-authority-audit.txt
          from pathlib import Path
          s=Path('source/app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt').read_text()
          a=s.index('    private fun refreshReadingActivationStage26(')
          b=s.index('    private fun applyReadingOffStage26(',a)
          r=s[a:b]
          assert 'observeAccessibility' in r
          assert 'readIncrementalUsage' in r
          assert 'authoritativeActivePackages' in r
          assert 'readProcessShadow(selectedStage30)' in r
          assert r.index('readProcessShadow(selectedStage30)') > r.index('val snapshotStage30 = stage26ReadingActivation.snapshot()')
          assert 'stage28UsageState.readCurrentExecution' not in r
          assert 'Thread.sleep(' not in r and 'SystemClock.sleep(' not in r and 'postDelayed(' not in r
          h=s[s.index('    private fun handleUniversalVisualEventStage19('):a]
          assert 'refreshReadingActivationStage26(' in h
          print('stage30_runtime_authority_audit=passed')
          print('accessibility_direct_before_activation_snapshot=true')
          print('usage_query=session_bounded_incremental=true')
          print('running_process=shadow_only_after_authority=true')
          print('work_mode_does_not_replace_stage30_activation_refresh=true')
          print('polling_or_sleep_added=false')
          PY

      - name: Verify complete test-source inventory 780
        run: |
          set -euo pipefail
          python - <<'PY' | tee evidence/test-source-inventory.txt
          from pathlib import Path
          root = Path('source/app/src/test/java')
          counts=[]; total=0
          for p in sorted(root.rglob('*.kt')):
              count=p.read_text(encoding='utf-8').count('@Test')
              if count:
                  counts.append((str(p.relative_to(root)),count)); total += count
          for name,count in counts: print(f'{count:3d} {name}')
          print(f'total_at_test={total}')
          assert total == 780, total
          PY

      - name: Stage30 deterministic tests 48
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests br.com.mapeiaia.rotacerta.FarolPresenceAuthorityStage30Test | tee ../evidence/stage30-specific-tests.log
          XML="app/build/test-results/testDebugUnitTest/TEST-br.com.mapeiaia.rotacerta.FarolPresenceAuthorityStage30Test.xml"
          test -f "$XML"
          python - "$XML" <<'PY' | tee ../evidence/stage30-specific-test-count.txt
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          vals={k:int(root.attrib.get(k,0)) for k in ('tests','failures','errors','skipped')}
          print(' '.join(f'{k}={v}' for k,v in vals.items()))
          assert vals == {'tests':48,'failures':0,'errors':0,'skipped':0}, vals
          PY

      - name: Stage28 regression tests 50
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests br.com.mapeiaia.rotacerta.FarolCausalLatencyStage28Test | tee ../evidence/stage28-regression-tests.log
          grep -q 'tests="50"' app/build/test-results/testDebugUnitTest/TEST-br.com.mapeiaia.rotacerta.FarolCausalLatencyStage28Test.xml

      - name: Stage26 regression tests 45
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests br.com.mapeiaia.rotacerta.FarolReadingActivationStage26Test | tee ../evidence/stage26-regression-tests.log
          grep -q 'tests="45"' app/build/test-results/testDebugUnitTest/TEST-br.com.mapeiaia.rotacerta.FarolReadingActivationStage26Test.xml

      - name: Stage23 regression tests 40
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests br.com.mapeiaia.rotacerta.FarolVisualIdentityStage23Test | tee ../evidence/stage23-regression-tests.log
          grep -q 'tests="40"' app/build/test-results/testDebugUnitTest/TEST-br.com.mapeiaia.rotacerta.FarolVisualIdentityStage23Test.xml

      - name: Stage21 regression tests 40
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests br.com.mapeiaia.rotacerta.FarolCausalCorrectionStage21Test | tee ../evidence/stage21-regression-tests.log
          grep -q 'tests="40"' app/build/test-results/testDebugUnitTest/TEST-br.com.mapeiaia.rotacerta.FarolCausalCorrectionStage21Test.xml

      - name: Stage20 regression tests 34
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests br.com.mapeiaia.rotacerta.FarolForensicTraceStage20Test | tee ../evidence/stage20-regression-tests.log
          grep -q 'tests="34"' app/build/test-results/testDebugUnitTest/TEST-br.com.mapeiaia.rotacerta.FarolForensicTraceStage20Test.xml

      - name: Stage19 regression tests 29
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests br.com.mapeiaia.rotacerta.FarolUniversalVisualPipelineStage19Test | tee ../evidence/stage19-regression-tests.log
          grep -q 'tests="29"' app/build/test-results/testDebugUnitTest/TEST-br.com.mapeiaia.rotacerta.FarolUniversalVisualPipelineStage19Test.xml

      - name: Complete unit suite exact 780
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --rerun-tasks testDebugUnitTest | tee ../evidence/full-unit-suite.log
          python - <<'PY' | tee ../evidence/full-test-count.txt
          from pathlib import Path
          import xml.etree.ElementTree as ET
          tests=failures=errors=skipped=0
          files=[]
          for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              r=ET.parse(p).getroot(); count=int(r.attrib.get('tests',0)); files.append((p.name,count))
              tests += count; failures += int(r.attrib.get('failures',0)); errors += int(r.attrib.get('errors',0)); skipped += int(r.attrib.get('skipped',0))
          for name,count in sorted(files): print(f'{count:3d} {name}')
          print(f'tests={tests}'); print(f'failures={failures}'); print(f'errors={errors}'); print(f'skipped={skipped}')
          assert tests == 780, tests
          assert failures == errors == skipped == 0
          PY

      - name: Android Lint
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon lintDebug | tee ../evidence/lint-debug.log
          cp app/build/reports/lint-results-debug.html ../evidence/lint-results-debug.html

      - name: Clean assembleDebug
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleDebug | tee ../evidence/clean-assemble-debug.log

      - name: Validate APK package version signature ZIP DEX manifest markers and hash
        run: |
          set -euo pipefail
          APK="source/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          OUT="evidence/rota-certa-0.1.206-stage30-presence-authority-ci.apk"
          cp "$APK" "$OUT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$AAPT" dump badging "$OUT" | tee evidence/badging.txt
          grep -q "package: name='br.com.mapeiaia.rotacerta' versionCode='5490' versionName='0.1.206'" evidence/badging.txt
          "$AAPT" dump permissions "$OUT" | tee evidence/apk-permissions.txt
          grep -q 'android.permission.PACKAGE_USAGE_STATS' evidence/apk-permissions.txt
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee evidence/signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' evidence/signature.txt
          unzip -t "$OUT" > evidence/zip-validation.txt
          unzip -l "$OUT" | grep -E 'classes([0-9]*)?\.dex' | tee evidence/dex-files.txt
          test -s evidence/dex-files.txt
          unzip -p "$OUT" 'classes*.dex' | strings > evidence/dex-strings.txt
          for marker in FAROL_PRESENCE_AUTHORITY_STAGE30 ACCESSIBILITY_DIRECT_ACTIVATES_STAGE30 SESSION_BOUNDED_USAGE_EVENTS_STAGE30 RUNNING_APP_PROCESSES_SHADOW_ONLY_STAGE30 SHADOW_AUTHORITY_STAGE30 PHYSICAL_FAILURE_REPLAY_STAGE30 NO_POLLING_NO_SLEEP_NO_DEBOUNCE_STAGE30 FAROL_CAUSAL_LATENCY_STALE_ACTIVATION_STAGE28 OLD_PAINT_UI_REVOKED_BEFORE_HEAVY_WORK_STAGE28 TWO_CURRENT_ADDRESSES_ANY_VISIBLE_PACKAGE_STAGE28 REAL_GOOGLE_ROUTE_PRESERVED_STAGE28 FAROL_READING_ACTIVATION_STAGE26 PACKAGE_IDENTITY_IS_NOT_VISUAL_AUTHORITY_STAGE19; do
            grep -q "$marker" evidence/dex-strings.txt
          done
          sha256sum "$OUT" | tee evidence/apk.sha256
          stat -c '%s' "$OUT" | tee evidence/apk-size-bytes.txt
          rm evidence/dex-strings.txt

      - name: Upload Stage30 final evidence and APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.206-stage30-presence-authority-shadow-replay-final
          path: evidence/
          if-no-files-found: error
          retention-days: 30
