name: Agenda 0.1.276 materialize

on:
  push:
    branches:
      - agent/agenda-ux-passenger-publisher-0.1.276
    paths:
      - '.github/workflows/agenda-0276-materialize.yml'
      - '.github/scripts/agenda_0276_materialize.py'

permissions:
  contents: write

jobs:
  materialize-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/agenda-ux-passenger-publisher-0.1.276

      - name: Protect FAROL and public search
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearch.kt app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchActivity.kt app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchUi.kt > /tmp/public.before

      - name: Materialize consolidated Agenda changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/agenda_0276_materialize.py
          git diff --check
          grep -Fq 'versionCode = 5569' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.276"' app/build.gradle.kts
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearch.kt app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchActivity.kt app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchUi.kt > /tmp/public.after
          cmp /tmp/public.before /tmp/public.after

      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify protected sources and APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearch.kt app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchActivity.kt app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchUi.kt > /tmp/public.final
          cmp /tmp/public.before /tmp/public.final
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk.sha256

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripPhysicalRideConsolidator.kt \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt \
                  app/src/main/AndroidManifest.xml \
                  app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m 'feat(agenda): consolidate cards passengers sync and publisher 0.1.276'
            git push origin HEAD:agent/agenda-ux-passenger-publisher-0.1.276
          fi

      - name: Build evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agenda-0276
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/agenda-0276/rota-certa-0.1.276-debug.apk
          cp /tmp/apk.sha256 /tmp/agenda-0276/apk.sha256
          git rev-parse HEAD > /tmp/agenda-0276/source-head.txt
          printf '%s\n' 'versionName=0.1.276' 'versionCode=5569' > /tmp/agenda-0276/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-agenda-0.1.276-${{ github.sha }}
          path: /tmp/agenda-0276
          retention-days: 14
