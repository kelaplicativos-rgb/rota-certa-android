name: Agenda 0.1.280 materialize
# Minimal continuation of the consolidated Agenda branch. FAROL and Public Search are protected and never materialized here.

on:
  push:
    branches:
      - agent/agenda-ux-passenger-publisher-0.1.276
    paths:
      - '.github/workflows/agenda-0276-materialize.yml'
      - '.github/scripts/agenda_0280_today_sync.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agenda-0280-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/agenda-ux-passenger-publisher-0.1.276

      - name: Prove authoritative Agenda baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'fun recoverStartupResponse(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaCollectorTimelineModule.kt
          grep -Fq 'Text("Sincronizar todas as contas")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq 'class BlaBlaDynamicSessionStore' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaCollectorSessionModule.kt
          grep -Fq 'class BlaBlaCollectorStateStore' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollector.kt
          if ! grep -Fq 'versionName = "0.1.279"' app/build.gradle.kts && ! grep -Fq 'versionName = "0.1.280"' app/build.gradle.kts; then
            echo 'Unexpected Agenda version baseline.' >&2
            exit 1
          fi

      - name: Protect FAROL and Public Search before materialization
        shell: bash
        run: |
          set -euo pipefail
          FAROL=app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          test "$(sha256sum "$FAROL" | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          sha256sum \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearch.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchActivity.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchUi.kt \
            > /tmp/public.before

      - name: Materialize Agenda 0.1.280
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/agenda_0280_today_sync.py
          git diff --check
          grep -Fq 'fun scopeResponseToDate(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaCollectorTimelineModule.kt
          grep -Fq 'if (isDateScoped(persisted)) return persisted' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaCollectorTimelineModule.kt
          grep -Fq 'Text("Sincronizar só hoje")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq 'AGENDA_TODAY_ONLY_SYNC_REQUESTED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq 'AGENDA_SYNC_SCOPE_PUBLISHED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq 'preserveOnPartial = scopeDate == null' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          test -s app/src/test/java/br/com/mapeiaia/rotacerta/trips/AgendaTodayOnlySync0280Test.kt
          grep -Fq 'versionCode = 5573' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.280"' app/build.gradle.kts

      - name: Verify protected sources remain untouched after materialization
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          sha256sum \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearch.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchActivity.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchUi.kt \
            > /tmp/public.after
          cmp /tmp/public.before /tmp/public.after

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK and protected sources after build
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          sha256sum \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearch.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchActivity.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchUi.kt \
            > /tmp/public.after-build
          cmp /tmp/public.before /tmp/public.after-build
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk.sha256

      - name: Commit tested materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaCollectorTimelineModule.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt \
            app/src/test/java/br/com/mapeiaia/rotacerta/trips/AgendaTodayOnlySync0280Test.kt \
            app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m 'feat(agenda): add today-only BlaBla sync 0.1.280'
            git push origin HEAD:agent/agenda-ux-passenger-publisher-0.1.276
          fi
          git rev-parse HEAD | tee /tmp/source-head.txt

      - name: Build evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agenda-0280
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/agenda-0280/rota-certa-0.1.280-debug.apk
          cp /tmp/apk.sha256 /tmp/agenda-0280/apk.sha256
          cp /tmp/source-head.txt /tmp/agenda-0280/source-head.txt
          printf '%s\n' \
            'versionName=0.1.280' \
            'versionCode=5573' \
            'todayOnlyAuthority=normalized_trip_date' \
            'farolSha256=884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a' \
            > /tmp/agenda-0280/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-agenda-0.1.280-${{ github.sha }}
          path: /tmp/agenda-0280
          retention-days: 14
