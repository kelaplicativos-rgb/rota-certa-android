name: Agenda 0.1.278 materialize
# Current-source continuation of the consolidated Agenda branch. Fixes Limpar Timeline without touching FAROL or Public Search.

on:
  push:
    branches:
      - agent/agenda-ux-passenger-publisher-0.1.276
    paths:
      - '.github/workflows/agenda-0276-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agenda-0278-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/agenda-ux-passenger-publisher-0.1.276

      - name: Prove authoritative Agenda baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'PASSENGER_UUID' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaCollectorPassengerModule.kt
          grep -Fq 'selectedProfiles.any { it.outboundDays.isNotBlank() }' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBatchPublisher.kt
          grep -Fq 'Quando eu estiver a caminho, envio a localização. 👍' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          grep -Fq 'ResponsiveTripAction("Limpar Timeline")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt

      - name: Protect FAROL and Public Search
        shell: bash
        run: |
          set -euo pipefail
          FAROL=app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          test "$(sha256sum "$FAROL" | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          sha256sum \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearch.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchActivity.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchUi.kt \
            > /tmp/public.before

      - name: Materialize complete Timeline clear 0.1.278
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          store = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripStore.kt')
          store_text = store.read_text()
          if 'fun clearTimelineLocalData(): Pair<Int, Int>' not in store_text:
              marker = '    fun saveBooking(booking: Booking): Booking {'
              if store_text.count(marker) != 1:
                  raise SystemExit('TripStore.kt: saveBooking anchor not unique')
              method = '''    fun clearTimelineLocalData(): Pair<Int, Int> {
                  val tripsRemoved = trips().size
                  val bookingsRemoved = bookings().size
                  prefs.edit()
                      .remove(tripsKey)
                      .remove(bookingsKey)
                      .apply()
                  return tripsRemoved to bookingsRemoved
              }

          '''
              store.write_text(store_text.replace(marker, method + marker, 1))

          timeline = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt')
          text = timeline.read_text()
          if 'val localClear = store.clearTimelineLocalData()' not in text:
              anchor = '                archiveStore.clearExternal(physical)\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f'TripTimelineUi.kt: clear anchor count={text.count(anchor)}')
              text = text.replace(anchor, anchor + '                val localClear = store.clearTimelineLocalData()\n', 1)

          old_debug = '"externalTripsRemoved=true externalArchiveStateReset=true localTripsPreserved=${trips.size} localBookingsPreserved=${bookings.size}"'
          new_debug = '"externalTripsRemoved=true externalArchiveStateReset=true localTripsRemoved=${localClear.first} localBookingsRemoved=${localClear.second} settingsPreserved=true loginPreserved=true"'
          if old_debug in text:
              text = text.replace(old_debug, new_debug, 1)
          elif new_debug not in text:
              raise SystemExit('TripTimelineUi.kt: debug clear contract not found')

          old_message = 'onChanged("Timeline sincronizada limpa. Arquivamento externo zerado; viagens locais, reservas e login foram preservados.")'
          new_message = 'onChanged("Timeline limpa por completo. Viagens locais/manuais, reservas locais e viagens sincronizadas foram excluídas; configurações e login foram preservados.")'
          if old_message in text:
              text = text.replace(old_message, new_message, 1)
          elif new_message not in text:
              raise SystemExit('TripTimelineUi.kt: user clear message not found')
          timeline.write_text(text)

          build = Path('app/build.gradle.kts')
          build_text = build.read_text()
          target = '        versionCode = 5571\n        versionName = "0.1.278"'
          if target not in build_text:
              candidates = [
                  '        versionCode = 5570\n        versionName = "0.1.277"',
                  '        versionCode = 5568\n        versionName = "0.1.275"',
              ]
              matches = [candidate for candidate in candidates if candidate in build_text]
              if len(matches) != 1:
                  raise SystemExit(f'app/build.gradle.kts: expected one known baseline, found {len(matches)}')
              build.write_text(build_text.replace(matches[0], target, 1))
          PY

          git diff --check
          grep -Fq 'fun clearTimelineLocalData(): Pair<Int, Int>' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripStore.kt
          grep -Fq '.remove(tripsKey)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripStore.kt
          grep -Fq '.remove(bookingsKey)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripStore.kt
          grep -Fq 'val localClear = store.clearTimelineLocalData()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'localTripsRemoved=${localClear.first}' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          if grep -Fq 'localTripsPreserved=${trips.size}' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt; then
            echo 'Legacy local-trip preservation is still present.' >&2
            exit 1
          fi
          grep -Fq 'versionCode = 5571' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.278"' app/build.gradle.kts

      - name: Verify protected sources remain untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          sha256sum \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearch.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchActivity.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchUi.kt \
            > /tmp/public.after
          cmp /tmp/public.before /tmp/public.after

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK and protected source after build
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk.sha256

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripStore.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt \
            app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m 'fix(agenda): clear local timeline trips 0.1.278'
            git push origin HEAD:agent/agenda-ux-passenger-publisher-0.1.276
          fi
          git rev-parse HEAD | tee /tmp/source-head.txt

      - name: Build evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agenda-0278
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/agenda-0278/rota-certa-0.1.278-debug.apk
          cp /tmp/apk.sha256 /tmp/agenda-0278/apk.sha256
          cp /tmp/source-head.txt /tmp/agenda-0278/source-head.txt
          printf '%s\n' 'versionName=0.1.278' 'versionCode=5571' > /tmp/agenda-0278/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-agenda-0.1.278-${{ github.sha }}
          path: /tmp/agenda-0278
          retention-days: 14
