name: One-time apply 0.1.255 source corrections

on:
  push:
    branches:
      - agent/passenger-timeline-geo-ux

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/passenger-timeline-geo-ux
          fetch-depth: 0

      - name: Verify starting source and FAROL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "agent/passenger-timeline-geo-ux"
          grep -q 'versionCode = 5547' app/build.gradle.kts
          grep -q 'versionName = "0.1.254"' app/build.gradle.kts
          echo "2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560  app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt" | sha256sum -c -

      - name: Persist 0.1.255 directly in app/src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_all(path, old, new, expected=None):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old[:100]!r}")
              if count == 0:
                  raise SystemExit(f"{path}: no matches: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          ui = 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt'
          replace_once(ui,
              'import androidx.compose.foundation.layout.heightIn\n',
              'import androidx.compose.foundation.layout.heightIn\nimport androidx.compose.foundation.layout.size\n')
          replace_once(ui,
              'import androidx.compose.material3.HorizontalDivider\nimport androidx.compose.material3.MaterialTheme\n',
              'import androidx.compose.material3.HorizontalDivider\nimport androidx.compose.material3.IconButton\nimport androidx.compose.material3.MaterialTheme\n')
          replace_once(ui,
              '    val externalReservationKey: String? = null,\n    val fareMinorUnits: Long? = null,\n',
              '    val externalReservationKey: String? = null,\n    val externalBookingHref: String? = null,\n    val externalProfileUuid: String? = null,\n    val bookingStatus: BookingStatus? = null,\n    val fareMinorUnits: Long? = null,\n')
          replace_once(ui,
              '''    val rows = enhancedPassengerRows(entry, trip, store, passengerStore)\n    if (rows.isEmpty()) return\n\n    val progress = trip?.let { TripPassengerRouteOrder.progress(it, currentCoordinate) }\n    val nextRowIndex = progress?.let { trustedProgress ->\n        rows.indexOfFirst { row ->\n            val order = row.boardingStopIndex ?: return@indexOfFirst false\n            TripPassengerRouteOrder.isNextBoarding(order, trustedProgress)\n        }.takeIf { it >= 0 }\n    }\n''',
              '''    val rawRows = enhancedPassengerRows(entry, trip, store, passengerStore)\n    if (rawRows.isEmpty()) return\n\n    val progress = trip?.let { TripPassengerRouteOrder.progress(it, currentCoordinate) }\n    val rows = passengerTimelineOperationalOrder(rawRows, progress)\n    val nextRowIndex = passengerTimelineNextActionIndex(rows, progress)\n''')
          replace_once(ui,
              '    var addressEdit by remember { mutableStateOf<Pair<EnhancedPassengerCardRow, Boolean>?>(null) }\n', '')
          replace_once(ui,
              '''            if (nextRowIndex == index && passenger.boardingStopIndex != null) {\n                Text("📍 PRÓXIMO EMBARQUE", style = MaterialTheme.typography.labelMedium)\n            }\n''',
              '''            passengerTimelineActionLabel(passenger, index, nextRowIndex, progress)?.let { label ->\n                Text(label, style = MaterialTheme.typography.labelMedium)\n            }\n''')
          replace_once(ui,
              '''                OutlinedButton(\n                    onClick = {\n                        if (!phone.isNullOrBlank()) {\n                            UnifiedDebugEventStore.record(\n                                "PASSENGER_WHATSAPP_OPEN",\n                                context.packageName,\n                                "timeline=true phone_present=true",\n                            )\n                            openPassengerWhatsApp(context, phone)\n                        }\n                    },\n                    enabled = !phone.isNullOrBlank(),\n                    contentPadding = COMPACT_ACTION_PADDING,\n                    modifier = Modifier.heightIn(min = 36.dp),\n                ) {\n                    Text("WA", maxLines = 1)\n                }\n''',
              '''                IconButton(\n                    onClick = {\n                        if (!phone.isNullOrBlank()) {\n                            UnifiedDebugEventStore.record(\n                                "PASSENGER_WHATSAPP_OPEN",\n                                context.packageName,\n                                "timeline=true phone_present=true",\n                            )\n                            openPassengerWhatsApp(context, phone)\n                        }\n                    },\n                    enabled = !phone.isNullOrBlank(),\n                    modifier = Modifier.size(36.dp),\n                ) {\n                    Text("☎", maxLines = 1)\n                }\n''')
          replace_once(ui,
              '''                    onClick = {\n                        if (!passenger.passengerId.isNullOrBlank() && passengerStore.profile(passenger.passengerId) != null) {\n                            profileRow = passenger\n                        } else {\n                            createProfileRow = passenger\n                        }\n                    },\n''',
              '''                    onClick = {\n                        val externalTarget = externalPassengerTarget(passenger)\n                        if (externalTarget != null) {\n                            if (!openExternalPassengerBlaBla(context, passenger)) {\n                                Toast.makeText(\n                                    context,\n                                    "Conta BlaBlaCar desta reserva não está conectada.",\n                                    Toast.LENGTH_LONG,\n                                ).show()\n                            }\n                        } else if (!passenger.passengerId.isNullOrBlank() && passengerStore.profile(passenger.passengerId) != null) {\n                            profileRow = passenger\n                        } else {\n                            createProfileRow = passenger\n                        }\n                    },\n''')
          replace_once(ui,
              '''            Row(\n                modifier = Modifier.fillMaxWidth(),\n                verticalAlignment = Alignment.CenterVertically,\n                horizontalArrangement = Arrangement.spacedBy(2.dp),\n            ) {\n                TextButton(\n                    onClick = { addressEdit = passenger to true },\n                    modifier = Modifier.weight(1f),\n                    contentPadding = COMPACT_ROUTE_PADDING,\n                ) {\n                    Text(\n                        "📍 ${passengerTimelineCompactPlace(passenger.boarding)}",\n                        maxLines = 1,\n                        overflow = TextOverflow.Ellipsis,\n                    )\n                }\n                Text("→", maxLines = 1)\n                TextButton(\n                    onClick = { addressEdit = passenger to false },\n                    modifier = Modifier.weight(1f),\n                    contentPadding = COMPACT_ROUTE_PADDING,\n                ) {\n                    Text(\n                        "🏁 ${passengerTimelineCompactPlace(passenger.dropoff)}",\n                        maxLines = 1,\n                        overflow = TextOverflow.Ellipsis,\n                    )\n                }\n            }\n''',
              '''            Text(\n                "📍 ${passengerTimelineCompactPlace(passenger.boarding)} → 🏁 ${passengerTimelineCompactPlace(passenger.dropoff)}",\n                maxLines = 1,\n                overflow = TextOverflow.Ellipsis,\n                modifier = Modifier.fillMaxWidth(),\n            )\n''')
          replace_once(ui,
              '''            Row(\n                modifier = Modifier.fillMaxWidth(),\n                verticalAlignment = Alignment.CenterVertically,\n                horizontalArrangement = Arrangement.spacedBy(2.dp),\n            ) {\n                Text(\n                    "$source • $seats$identity",\n                    style = MaterialTheme.typography.bodySmall,\n                    modifier = Modifier.weight(1f),\n                    maxLines = 1,\n                    overflow = TextOverflow.Ellipsis,\n                )\n                TextButton(\n                    enabled = passenger.boardingAddress.isNotBlank(),\n                    onClick = { openNavigation(context, passenger.boardingAddress) },\n                    contentPadding = COMPACT_NAV_PADDING,\n                ) { Text("🧭📍", maxLines = 1) }\n                TextButton(\n                    enabled = passenger.dropoffAddress.isNotBlank(),\n                    onClick = { openNavigation(context, passenger.dropoffAddress) },\n                    contentPadding = COMPACT_NAV_PADDING,\n                ) { Text("🧭🏁", maxLines = 1) }\n            }\n''',
              '''            Text(\n                "$source • $seats$identity",\n                style = MaterialTheme.typography.bodySmall,\n                modifier = Modifier.fillMaxWidth(),\n                maxLines = 1,\n                overflow = TextOverflow.Ellipsis,\n            )\n''')
          replace_once(ui,
              '''    addressEdit?.let { (row, boarding) ->\n        PassengerAddressEditorDialog(\n            row = row,\n            boarding = boarding,\n            onDismiss = { addressEdit = null },\n            onSave = { value ->\n                if (savePassengerAddress(row, boarding, value, store, passengerStore)) {\n                    onChanged(if (boarding) "Endereço exato de embarque salvo." else "Endereço exato de destino salvo.")\n                } else {\n                    Toast.makeText(context, "Reserva sem referência estável; endereço não foi salvo.", Toast.LENGTH_LONG).show()\n                }\n                addressEdit = null\n            },\n        )\n    }\n\n''', '')
          replace_once(ui,
              '''            passengerId = metadata?.passengerId?.takeIf(String::isNotBlank),\n            externalReservationKey = metadataKey,\n            fareMinorUnits = metadata?.fareMinorUnits,\n''',
              '''            passengerId = metadata?.passengerId?.takeIf(String::isNotBlank),\n            externalReservationKey = metadataKey,\n            externalBookingHref = passenger.booking_href?.trim()?.takeIf(String::isNotEmpty),\n            externalProfileUuid = entry.blablaProfileUuid?.trim()?.takeIf(String::isNotEmpty),\n            fareMinorUnits = metadata?.fareMinorUnits,\n''')
          replace_once(ui,
              '''                    localBookingId = booking.id,\n                    fareMinorUnits = booking.fareMinorUnits ?: current.fareMinorUnits,\n''',
              '''                    localBookingId = booking.id,\n                    bookingStatus = booking.status,\n                    fareMinorUnits = booking.fareMinorUnits ?: current.fareMinorUnits,\n''')
          replace_once(ui,
              '''                    localBookingId = booking.id,\n                    fareMinorUnits = booking.fareMinorUnits,\n''',
              '''                    localBookingId = booking.id,\n                    bookingStatus = booking.status,\n                    fareMinorUnits = booking.fareMinorUnits,\n''')
          replace_once(ui,
              '''private fun openPassengerWhatsApp(context: Context, raw: String) {\n''',
              '''internal data class ExternalPassengerTarget(val profileUuid: String, val href: String)\n\ninternal fun externalPassengerTarget(row: EnhancedPassengerCardRow): ExternalPassengerTarget? {\n    val profileUuid = row.externalProfileUuid?.trim()?.lowercase()?.takeIf(String::isNotEmpty) ?: return null\n    val href = row.externalBookingHref?.trim()?.takeIf(String::isNotEmpty) ?: return null\n    if (!href.startsWith("https://www.blablacar.com.br/") || !href.contains("/rides/offer/passenger/")) return null\n    return ExternalPassengerTarget(profileUuid = profileUuid, href = href)\n}\n\nprivate fun openExternalPassengerBlaBla(context: Context, row: EnhancedPassengerCardRow): Boolean {\n    val target = externalPassengerTarget(row) ?: return false\n    val account = BlaBlaDynamicAccountRegistry(context).list()\n        .firstOrNull { it.profileUuid?.trim()?.lowercase() == target.profileUuid }\n        ?: return false\n    context.startActivity(\n        BlaBlaDynamicSessionIntents.manage(context, account, target.href)\n            .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),\n    )\n    return true\n}\n\nprivate fun openPassengerWhatsApp(context: Context, raw: String) {\n''')

          order_file = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineOperationalOrder.kt')
          order_file.write_text('''package br.com.mapeiaia.rotacerta.trips\n\nimport kotlin.math.abs\n\ninternal const val PASSENGER_FARE_ACTION_LABEL = "💰"\n\ninternal enum class PassengerTimelineRoutePosition {\n    PAST_REQUIRES_REVIEW,\n    CURRENT_OR_UPCOMING,\n    UNKNOWN,\n}\n\ninternal fun passengerTimelineOperationalOrder(\n    rows: List<EnhancedPassengerCardRow>,\n    progress: TripRouteProgress?,\n): List<EnhancedPassengerCardRow> = rows.sortedWith(\n    compareBy<EnhancedPassengerCardRow> { passengerTimelineRoutePosition(it, progress).priority }\n        .thenBy { passengerTimelineDistanceFromProgress(it, progress) }\n        .thenBy { passengerTimelineReservationPriority(it.bookingStatus) }\n        .thenBy(String.CASE_INSENSITIVE_ORDER) { it.name },\n)\n\ninternal fun passengerTimelineNextActionIndex(\n    rows: List<EnhancedPassengerCardRow>,\n    progress: TripRouteProgress?,\n): Int? {\n    if (rows.isEmpty()) return null\n    val review = rows.indexOfFirst {\n        passengerTimelineRoutePosition(it, progress) == PassengerTimelineRoutePosition.PAST_REQUIRES_REVIEW\n    }\n    if (review >= 0) return review\n    val upcoming = rows.indexOfFirst {\n        passengerTimelineRoutePosition(it, progress) == PassengerTimelineRoutePosition.CURRENT_OR_UPCOMING\n    }\n    return upcoming.takeIf { it >= 0 }\n}\n\ninternal fun passengerTimelineActionLabel(\n    row: EnhancedPassengerCardRow,\n    index: Int,\n    nextActionIndex: Int?,\n    progress: TripRouteProgress?,\n): String? = when {\n    passengerTimelineRoutePosition(row, progress) == PassengerTimelineRoutePosition.PAST_REQUIRES_REVIEW ->\n        "⚠ EMBARQUE A CONFERIR"\n    nextActionIndex == index -> "📍 PRÓXIMA AÇÃO"\n    else -> null\n}\n\nprivate val PassengerTimelineRoutePosition.priority: Int\n    get() = when (this) {\n        PassengerTimelineRoutePosition.PAST_REQUIRES_REVIEW -> 0\n        PassengerTimelineRoutePosition.CURRENT_OR_UPCOMING -> 1\n        PassengerTimelineRoutePosition.UNKNOWN -> 2\n    }\n\nprivate fun passengerTimelineRoutePosition(\n    row: EnhancedPassengerCardRow,\n    progress: TripRouteProgress?,\n): PassengerTimelineRoutePosition {\n    val stop = row.boardingStopIndex ?: return PassengerTimelineRoutePosition.UNKNOWN\n    val current = progress?.stopIndexProgress ?: return PassengerTimelineRoutePosition.CURRENT_OR_UPCOMING\n    return if (stop.toDouble() < current - 0.35) {\n        PassengerTimelineRoutePosition.PAST_REQUIRES_REVIEW\n    } else {\n        PassengerTimelineRoutePosition.CURRENT_OR_UPCOMING\n    }\n}\n\nprivate fun passengerTimelineDistanceFromProgress(\n    row: EnhancedPassengerCardRow,\n    progress: TripRouteProgress?,\n): Double {\n    val stop = row.boardingStopIndex?.toDouble() ?: return Double.POSITIVE_INFINITY\n    val current = progress?.stopIndexProgress ?: return stop\n    return abs(stop - current)\n}\n\nprivate fun passengerTimelineReservationPriority(status: BookingStatus?): Int = when (status) {\n    BookingStatus.HELD -> 0\n    BookingStatus.CONFIRMED -> 1\n    BookingStatus.REQUESTED -> 2\n    null -> 3\n    BookingStatus.CANCELLED, BookingStatus.EXPIRED -> 4\n}\n''')

          fare_evidence_file = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerFareEvidence.kt')
          fare_evidence_file.write_text('''package br.com.mapeiaia.rotacerta.trips\n\nimport java.util.Currency\nimport java.util.Locale\n\ninternal fun normalizePassengerFareCurrency(raw: String?): String? {\n    val code = raw?.trim()?.uppercase(Locale.ROOT)?.takeIf { it.length == 3 && it.all(Char::isLetter) } ?: return null\n    return code.takeIf { runCatching { Currency.getInstance(it) }.isSuccess }\n}\n\ninternal fun resolvePassengerFareCurrency(pageCurrency: String?, tenantCurrency: String?): String? =\n    normalizePassengerFareCurrency(pageCurrency) ?: normalizePassengerFareCurrency(tenantCurrency)\n''')

          direction_file = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/TimelineDirectionReference.kt')
          direction_file.write_text('''package br.com.mapeiaia.rotacerta.trips\n\nimport br.com.mapeiaia.rotacerta.AppSettings\nimport br.com.mapeiaia.rotacerta.Coordinate\n\ninternal data class TimelineDirectionReference(\n    val coordinate: Coordinate?,\n    val radiusKm: Double,\n)\n\ninternal fun timelineDirectionReference(\n    explicit: TripReferenceOrigin?,\n    settings: AppSettings,\n): TimelineDirectionReference {\n    val explicitCoordinate = explicit?.takeIf(TripReferenceOrigin::isValid)?.coordinate\n    val homeCoordinate = settings.homeCoordinate?.takeIf(::validTimelineReferenceCoordinate)\n    val coordinate = explicitCoordinate ?: homeCoordinate\n    val radius = explicit?.radiusKm?.takeIf { it.isFinite() && it in TripReferenceOrigin.MIN_RADIUS_KM..TripReferenceOrigin.MAX_RADIUS_KM }\n        ?: settings.homeRadiusKm.takeIf { it.isFinite() && it in TripReferenceOrigin.MIN_RADIUS_KM..TripReferenceOrigin.MAX_RADIUS_KM }\n        ?: TripReferenceOrigin.DEFAULT_RADIUS_KM\n    return TimelineDirectionReference(coordinate = coordinate, radiusKm = radius)\n}\n\nprivate fun validTimelineReferenceCoordinate(value: Coordinate): Boolean =\n    value.latitude.isFinite() && value.longitude.isFinite() &&\n        value.latitude in -90.0..90.0 && value.longitude in -180.0..180.0\n''')

          timeline = 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt'
          replace_once(timeline,
              '''    val directionGeo = remember(merged, trips, appSettings) {\n        TripTimelineGeoResolver.resolveTrustedStops(\n            places = merged.flatMap { listOf(it.origin, it.destination) },\n            trustedStops = timelineTrustedDirectionStops(trips, appSettings),\n        )\n    }\n''',
              '''    val directionGeo = remember(merged, trips, appSettings) {\n        TripTimelineGeoResolver.resolveTrustedStops(\n            places = merged.flatMap { listOf(it.origin, it.destination) },\n            trustedStops = timelineTrustedDirectionStops(trips, appSettings),\n        )\n    }\n    val directionReference = remember(referenceOrigin, appSettings.homeCoordinate, appSettings.homeRadiusKm) {\n        timelineDirectionReference(referenceOrigin, appSettings)\n    }\n''')
          replace_once(timeline,
              '''            referenceCoordinate = referenceOrigin?.coordinate,\n            referenceRadiusKm = referenceOrigin?.radiusKm ?: TripReferenceOrigin.DEFAULT_RADIUS_KM,\n''',
              '''            referenceCoordinate = directionReference.coordinate,\n            referenceRadiusKm = directionReference.radiusKm,\n''')
          replace_once(timeline, 'Color(0xFFEAF7ED)', 'Color(0xFFDDF3E3)')
          replace_once(timeline, 'Color(0xFFFFF0E6)', 'Color(0xFFFFE4D6)')

          collector = 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt'
          replace_once(collector,
              '''private data class DynamicPassengerContactEvidence(\n    val phone: String = "",\n    val visibleName: String = "",\n)\n''',
              '''private data class DynamicPassengerContactEvidence(\n    val phone: String = "",\n    val visibleName: String = "",\n    val fareAmount: String = "",\n    val fareCurrencyCode: String = "",\n)\n''')
          replace_once(collector,
              '''    private lateinit var store: BlaBlaDynamicSessionStore\n    private lateinit var account: BlaBlaDynamicAccount\n''',
              '''    private lateinit var store: BlaBlaDynamicSessionStore\n    private lateinit var passengerIdentityStore: PassengerIdentityStore\n    private lateinit var account: BlaBlaDynamicAccount\n''')
          replace_once(collector,
              '''        registry = BlaBlaDynamicAccountRegistry(this)\n        store = BlaBlaDynamicSessionStore(this)\n        account = registry.get''',
              '''        registry = BlaBlaDynamicAccountRegistry(this)\n        store = BlaBlaDynamicSessionStore(this)\n        passengerIdentityStore = PassengerIdentityStore(this)\n        account = registry.get''')
          replace_once(collector,
              '        val missingContactLink = candidate.passengers.any { it.phone.isNullOrBlank() && it.booking_href.isNullOrBlank() }\n',
              '        val missingContactLink = candidate.passengers.any { it.booking_href.isNullOrBlank() }\n')
          replace_all(collector,
              'pendingTripPassengers.any { it.phone.isNullOrBlank() && !it.booking_href.isNullOrBlank() }',
              'pendingTripPassengers.any(::passengerNeedsReservationPage)',
              expected=2)
          replace_once(collector,
              '''    private fun loadNextPassengerContact(expectedSync: Long, expectedCandidate: Int) {\n        if (!pendingTripIsCurrent(expectedSync, expectedCandidate)) {\n            recordStale("passenger_load_pending_mismatch", expectedSync, expectedCandidate)\n            return\n        }\n        while (passengerContactIndex < pendingTripPassengers.size) {\n            val passenger = pendingTripPassengers[passengerContactIndex]\n            val href = passenger.booking_href?.trim().orEmpty()\n            if (passenger.phone.isNullOrBlank() && href.isNotBlank() && isBlaBla(href)) {\n                phase = Phase.PASSENGER_CONTACT\n                passengerContactReadAttempts = 0\n                passengerCaptureInFlight = false\n                statusView.text = "${account.displayLabel} • contato ${passengerContactIndex + 1}/${pendingTripPassengers.size}…"\n                loadTrackedUrl(href)\n                return\n            }\n            passengerContactIndex++\n        }\n        finalizeCurrentTrip(expectedSync, expectedCandidate)\n    }\n''',
              '''    private fun passengerNeedsReservationPage(passenger: BlaBlaCollectorPassenger): Boolean {\n        val href = passenger.booking_href?.trim().orEmpty()\n        if (href.isBlank() || !isBlaBla(href)) return false\n        val metadataKey = externalPassengerReservationKey(account.profileUuid, href)\n        val metadata = passengerIdentityStore.externalMetadata(metadataKey)\n        return passenger.phone.isNullOrBlank() || metadata?.fareMinorUnits == null\n    }\n\n    private fun loadNextPassengerContact(expectedSync: Long, expectedCandidate: Int) {\n        if (!pendingTripIsCurrent(expectedSync, expectedCandidate)) {\n            recordStale("passenger_load_pending_mismatch", expectedSync, expectedCandidate)\n            return\n        }\n        while (passengerContactIndex < pendingTripPassengers.size) {\n            val passenger = pendingTripPassengers[passengerContactIndex]\n            val href = passenger.booking_href?.trim().orEmpty()\n            if (passengerNeedsReservationPage(passenger)) {\n                phase = Phase.PASSENGER_CONTACT\n                passengerContactReadAttempts = 0\n                passengerCaptureInFlight = false\n                statusView.text = "${account.displayLabel} • reserva ${passengerContactIndex + 1}/${pendingTripPassengers.size}…"\n                loadTrackedUrl(href)\n                return\n            }\n            passengerContactIndex++\n        }\n        finalizeCurrentTrip(expectedSync, expectedCandidate)\n    }\n''')
          replace_once(collector,
              '''            val phone = normalizeCapturedPhone(evidence?.phone)\n            if (phone == null && passengerContactReadAttempts < 2) {\n                passengerContactReadAttempts++\n                webView.postDelayed({\n                    capturePassengerContact(expectedSync, expectedNavigation, expectedCandidate, expectedPassenger)\n                }, 700)\n                return@evaluate\n            }\n\n            val visibleName = evidence?.visibleName?.trim().orEmpty()\n            pendingTripPassengers[expectedPassenger] = current.copy(\n                name = current.name.ifBlank { visibleName },\n                phone = current.phone?.takeIf(String::isNotBlank) ?: phone,\n            )\n            UnifiedDebugEventStore.record(\n                "PASSENGER_CONTACT_CAPTURED",\n                packageName,\n                "account=${account.displayLabel} tripIndex=${expectedCandidate + 1}/${candidates.size} passengerIndex=${expectedPassenger + 1}/${pendingTripPassengers.size} phonePresent=${phone != null} bookingLinkPresent=${!current.booking_href.isNullOrBlank()}",\n            )\n''',
              '''            val capturedPhone = normalizeCapturedPhone(evidence?.phone)\n            val effectivePhone = current.phone?.takeIf(String::isNotBlank) ?: capturedPhone\n            val fareCaptured = saveCapturedPassengerFare(current.booking_href, evidence)\n            if (effectivePhone == null && passengerContactReadAttempts < 2) {\n                passengerContactReadAttempts++\n                webView.postDelayed({\n                    capturePassengerContact(expectedSync, expectedNavigation, expectedCandidate, expectedPassenger)\n                }, 700)\n                return@evaluate\n            }\n\n            val visibleName = evidence?.visibleName?.trim().orEmpty()\n            pendingTripPassengers[expectedPassenger] = current.copy(\n                name = current.name.ifBlank { visibleName },\n                phone = effectivePhone,\n            )\n            UnifiedDebugEventStore.record(\n                "PASSENGER_CONTACT_CAPTURED",\n                packageName,\n                "account=${account.displayLabel} tripIndex=${expectedCandidate + 1}/${candidates.size} passengerIndex=${expectedPassenger + 1}/${pendingTripPassengers.size} phonePresent=${effectivePhone != null} bookingLinkPresent=${!current.booking_href.isNullOrBlank()} fareCaptured=$fareCaptured",\n            )\n''')
          replace_once(collector,
              '''    private fun normalizeCapturedPhone(raw: String?): String? {\n''',
              '''    private fun saveCapturedPassengerFare(\n        href: String?,\n        evidence: DynamicPassengerContactEvidence?,\n    ): Boolean {\n        val key = externalPassengerReservationKey(account.profileUuid, href) ?: return false\n        val baseSpec = PassengerMoney.spec(this)\n        val currencyCode = resolvePassengerFareCurrency(evidence?.fareCurrencyCode, baseSpec.currencyCode) ?: return false\n        val rawAmount = evidence?.fareAmount?.trim()?.takeIf(String::isNotEmpty) ?: return false\n        val currency = runCatching { java.util.Currency.getInstance(currencyCode) }.getOrNull() ?: return false\n        val fractionDigits = currency.defaultFractionDigits.takeIf { it in 0..3 } ?: 2\n        val amount = PassengerMoney.parseMinorUnits(\n            rawAmount,\n            baseSpec.copy(currencyCode = currencyCode, fractionDigits = fractionDigits),\n        ) ?: return false\n        val current = passengerIdentityStore.externalMetadata(key) ?: ExternalPassengerMetadata(reservationKey = key)\n        passengerIdentityStore.saveExternalMetadata(\n            current.copy(fareMinorUnits = amount, fareCurrencyCode = currencyCode),\n        )\n        return true\n    }\n\n    private fun normalizeCapturedPhone(raw: String?): String? {\n''')
          replace_once(collector,
              '''              const nameNode = document.querySelector('[data-testid*="passenger-name"], [data-testid*="profile-name"], h1');\n              return JSON.stringify({\n                phone: phone,\n                visibleName: clean(nameNode && nameNode.innerText)\n              });\n''',
