name: Finalize Operational Browser 0.1.567

on:
  push:
    branches:
      - agent/operational-browser-auto-discovery-0.1.567
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operational-browser-final-01567-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare authoritative 0.1.567 build metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text()
          old_code = 'val releaseVersionCode = 5_857'
          old_name = 'val releaseVersionName = "0.1.566"'
          new_code = 'val releaseVersionCode = 5_858'
          new_name = 'val releaseVersionName = "0.1.567"'

          if new_code not in text:
              if old_code not in text:
                  raise SystemExit('unexpected releaseVersionCode; refusing blind version mutation')
              text = text.replace(old_code, new_code, 1)
          if new_name not in text:
              if old_name not in text:
                  raise SystemExit('unexpected releaseVersionName; refusing blind version mutation')
              text = text.replace(old_name, new_name, 1)
          gradle.write_text(text)

          path = Path('app/src/main/assets/release_history.json')
          data = json.loads(path.read_text())
          releases = data['releases']
          matches = [r for r in releases if r.get('version') == '0.1.567' and r.get('build') == 5858]
          if len(matches) > 1:
              raise SystemExit('duplicate 0.1.567/5858 release history records')
          if not matches:
              releases.insert(0, {
                  'version': '0.1.567',
                  'build': 5858,
                  'commit': None,
                  'branch': 'agent/operational-browser-auto-discovery-0.1.567',
                  'generatedAt': None,
                  'status': 'EM_VALIDACAO',
                  'implemented': [
                      'Ao abrir ou retomar a área de viagens, o Rota Certa solicita automaticamente ao coletor canônico a descoberta das viagens publicadas nos perfis BlaBlaCar conectados.',
                      'Uma viagem nova descoberta pelo coletor entra no estado canônico e passa a aparecer em Todas as viagens sem cadastro manual nem botão de atualização.'
                  ],
                  'fixed': [
                      'Eliminada a dependência de aguardar apenas o próximo ciclo periódico para que uma publicação nova apareça no índice operacional depois que o motorista retorna ao Rota Certa.',
                      'Retornos rápidos ao app são protegidos por debounce de ciclo de vida para evitar enfileiramento redundante de coletas.'
                  ],
                  'improved': [
                      'A implementação reutiliza AgendaBackgroundSync0392 e o pipeline coletor → reconciliação canônica → BookingRealtimeEvents, sem criar segunda fonte de verdade.',
                      'Somente perfis com UUID externo confirmado habilitam o gatilho automático; a sincronização periódica existente permanece como contingência para mudanças feitas enquanto o Rota Certa não é retomado.'
                  ],
                  'regressions': [],
                  'resolvedRegressions': [],
                  'modulesAffected': ['Todas as viagens', 'BlaBlaCar', 'Coletor', 'Sincronização canônica', 'Contas externas', 'Build'],
                  'detailsComplete': True
              })
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit final candidate metadata when needed
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/assets/release_history.json
          if git diff --cached --quiet; then
            echo '0.1.567 metadata already authoritative.'
          else
            git commit -m 'build: finalize operational browser 0.1.567 [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify operational browser and canonical regressions
        run: |
          ./gradlew testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.OperationalBrowserAutoDiscovery0567Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.OperationalTripAutoArchive0566Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.OperationalBrowserSystemBars0565Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.OperationalBrowserAttestation0564Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.OperationalAllTripsBrowser0563Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TimelineLocalPrimary0525Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalTripState0395Test'

      - name: Assemble installable debug APK
        env:
          ROTA_CERTA_GIT_SHA: ${{ steps.commit.outputs.source_sha }}
          ROTA_CERTA_GIT_BRANCH: ${{ github.ref_name }}
        run: ./gradlew assembleDebug

      - name: Record and verify APK identity
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          printf '%s\n' '${{ steps.commit.outputs.source_sha }}' > app/build/outputs/apk/debug/SOURCE_SHA.txt
          printf '%s\n' '${{ github.ref_name }}' > app/build/outputs/apk/debug/SOURCE_BRANCH.txt
          printf '%s\n' '0.1.567' > app/build/outputs/apk/debug/VERSION_NAME.txt
          printf '%s\n' '5858' > app/build/outputs/apk/debug/VERSION_CODE.txt
          grep -F 'val releaseVersionCode = 5_858' app/build.gradle.kts
          grep -F 'val releaseVersionName = "0.1.567"' app/build.gradle.kts
          test "$(git rev-parse HEAD)" = '${{ steps.commit.outputs.source_sha }}'

      - name: Upload installable APK bound to final source SHA
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-operational-browser-0.1.567-${{ steps.commit.outputs.source_sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/SOURCE_SHA.txt
            app/build/outputs/apk/debug/SOURCE_BRANCH.txt
            app/build/outputs/apk/debug/VERSION_NAME.txt
            app/build/outputs/apk/debug/VERSION_CODE.txt
          if-no-files-found: error
