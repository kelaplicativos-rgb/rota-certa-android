name: Finalize Operational Browser 0.1.565

on:
  push:
    branches:
      - agent/operational-browser-system-bars-0.1.565
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operational-browser-final-01565-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare authoritative 0.1.565 build metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text()
          old_code = 'val releaseVersionCode = 5_855'
          old_name = 'val releaseVersionName = "0.1.564"'
          new_code = 'val releaseVersionCode = 5_856'
          new_name = 'val releaseVersionName = "0.1.565"'

          if new_code not in text:
              if old_code not in text:
                  raise SystemExit('unexpected releaseVersionCode; refusing blind version mutation')
              text = text.replace(old_code, new_code, 1)
          if new_name not in text:
              if old_name not in text:
                  raise SystemExit('unexpected releaseVersionName; refusing blind version mutation')
              text = text.replace(old_name, new_name, 1)
          gradle.write_text(text)

          path = Path('app/src/main/assets/release_history.json')
          data = json.loads(path.read_text())
          releases = data['releases']
          matches = [r for r in releases if r.get('version') == '0.1.565' and r.get('build') == 5856]
          if len(matches) > 1:
              raise SystemExit('duplicate 0.1.565/5856 release history records')
          if not matches:
              releases.insert(0, {
                  'version': '0.1.565',
                  'build': 5856,
                  'commit': None,
                  'branch': 'agent/operational-browser-system-bars-0.1.565',
                  'generatedAt': None,
                  'status': 'EM_VALIDACAO',
                  'implemented': [
                      'O navegador operacional passa a aplicar insets reais das barras de sistema e do recorte de tela ao viewport da BlaBlaCar.',
                      'A área navegável da página fica contida entre a barra superior do Android e a barra inferior de navegação, inclusive em edge-to-edge obrigatório.'
                  ],
                  'fixed': [
                      'Corrigida a sobreposição do conteúdo da BlaBlaCar pela barra de status superior no Samsung/Android 16.',
                      'Corrigida a sobreposição do conteúdo e dos controles inferiores pela barra de navegação/gestos do Android.',
                      'A tela de erro do navegador operacional também passa a respeitar os mesmos insets seguros.'
                  ],
                  'improved': [
                      'Ícones das barras de status e navegação passam a usar aparência escura sobre o fundo claro do navegador.',
                      'A correção é dinâmica e reaplicada quando os insets mudam, sem hardcode de altura, modelo de aparelho ou densidade.'
                  ],
                  'regressions': [],
                  'resolvedRegressions': ['Conteúdo WebView sobreposto pelas barras do sistema na 0.1.564'],
                  'modulesAffected': ['Todas as viagens', 'BlaBlaCar', 'Navegador operacional', 'Insets Android', 'Build'],
                  'detailsComplete': True
              })
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit final candidate metadata when needed
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/assets/release_history.json
          if git diff --cached --quiet; then
            echo '0.1.565 metadata already authoritative.'
          else
            git commit -m 'build: finalize operational browser 0.1.565 [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify operational browser and canonical regressions
        run: |
          ./gradlew testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.OperationalBrowserSystemBars0565Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.OperationalBrowserAttestation0564Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.OperationalAllTripsBrowser0563Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TimelineLocalPrimary0525Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalTripState0395Test'

      - name: Assemble installable debug APK
        env:
          ROTA_CERTA_GIT_SHA: ${{ steps.commit.outputs.source_sha }}
          ROTA_CERTA_GIT_BRANCH: ${{ github.ref_name }}
        run: ./gradlew assembleDebug

      - name: Record and verify APK identity
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          printf '%s\n' '${{ steps.commit.outputs.source_sha }}' > app/build/outputs/apk/debug/SOURCE_SHA.txt
          printf '%s\n' '${{ github.ref_name }}' > app/build/outputs/apk/debug/SOURCE_BRANCH.txt
          printf '%s\n' '0.1.565' > app/build/outputs/apk/debug/VERSION_NAME.txt
          printf '%s\n' '5856' > app/build/outputs/apk/debug/VERSION_CODE.txt
          grep -F 'val releaseVersionCode = 5_856' app/build.gradle.kts
          grep -F 'val releaseVersionName = "0.1.565"' app/build.gradle.kts
          test "$(git rev-parse HEAD)" = '${{ steps.commit.outputs.source_sha }}'

      - name: Upload installable APK bound to final source SHA
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-operational-browser-0.1.565-${{ steps.commit.outputs.source_sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/SOURCE_SHA.txt
            app/build/outputs/apk/debug/SOURCE_BRANCH.txt
            app/build/outputs/apk/debug/VERSION_NAME.txt
            app/build/outputs/apk/debug/VERSION_CODE.txt
          if-no-files-found: error
