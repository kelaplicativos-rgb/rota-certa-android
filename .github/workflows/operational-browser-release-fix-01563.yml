name: Finalize Operational Browser 0.1.566

on:
  push:
    branches:
      - agent/operational-browser-auto-archive-0.1.566
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operational-browser-final-01566-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare authoritative 0.1.566 build metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text()
          old_code = 'val releaseVersionCode = 5_856'
          old_name = 'val releaseVersionName = "0.1.565"'
          new_code = 'val releaseVersionCode = 5_857'
          new_name = 'val releaseVersionName = "0.1.566"'

          if new_code not in text:
              if old_code not in text:
                  raise SystemExit('unexpected releaseVersionCode; refusing blind version mutation')
              text = text.replace(old_code, new_code, 1)
          if new_name not in text:
              if old_name not in text:
                  raise SystemExit('unexpected releaseVersionName; refusing blind version mutation')
              text = text.replace(old_name, new_name, 1)
          gradle.write_text(text)

          path = Path('app/src/main/assets/release_history.json')
          data = json.loads(path.read_text())
          releases = data['releases']
          matches = [r for r in releases if r.get('version') == '0.1.566' and r.get('build') == 5857]
          if len(matches) > 1:
              raise SystemExit('duplicate 0.1.566/5857 release history records')
          if not matches:
              releases.insert(0, {
                  'version': '0.1.566',
                  'build': 5857,
                  'commit': None,
                  'branch': 'agent/operational-browser-auto-archive-0.1.566',
                  'generatedAt': None,
                  'status': 'EM_VALIDACAO',
                  'implemented': [
                      'Todas as viagens passa a separar automaticamente viagens atuais/futuras de viagens arquivadas usando o timestamp canônico de saída.',
                      'Assim que departureAtMillis fica estritamente no passado, o card deixa a sequência ativa sem exigir pull-to-refresh ou reabertura da tela.',
                      'Viagens arquivadas permanecem acessíveis em uma seção recolhível e continuam abrindo a viagem original da BlaBlaCar quando o destino administrativo ainda estiver disponível.'
                  ],
                  'fixed': [
                      'Datas e horários já passados deixam de permanecer misturados com viagens atuais e futuras na lista operacional.',
                      'A virada temporal também atualiza o rótulo Hoje/Amanhã enquanto a tela permanece aberta.'
                  ],
                  'improved': [
                      'A lista ativa permanece em ordem cronológica crescente; o arquivo usa ordem decrescente, deixando a viagem passada mais recente primeiro.',
                      'O relógio da tela acorda no próximo limite de saída, com verificação periódica de segurança, sem hardcode de data, cidade, conta ou viagem.'
                  ],
                  'regressions': [],
                  'resolvedRegressions': [],
                  'modulesAffected': ['Todas as viagens', 'Arquivo de viagens', 'Navegador operacional', 'Ordenação temporal', 'Build'],
                  'detailsComplete': True
              })
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit final candidate metadata when needed
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/assets/release_history.json
          if git diff --cached --quiet; then
            echo '0.1.566 metadata already authoritative.'
          else
            git commit -m 'build: finalize operational browser 0.1.566 [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify operational browser and canonical regressions
        run: |
          ./gradlew testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.OperationalTripAutoArchive0566Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.OperationalBrowserSystemBars0565Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.OperationalBrowserAttestation0564Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.OperationalAllTripsBrowser0563Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TimelineLocalPrimary0525Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalTripState0395Test'

      - name: Assemble installable debug APK
        env:
          ROTA_CERTA_GIT_SHA: ${{ steps.commit.outputs.source_sha }}
          ROTA_CERTA_GIT_BRANCH: ${{ github.ref_name }}
        run: ./gradlew assembleDebug

      - name: Record and verify APK identity
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          printf '%s\n' '${{ steps.commit.outputs.source_sha }}' > app/build/outputs/apk/debug/SOURCE_SHA.txt
          printf '%s\n' '${{ github.ref_name }}' > app/build/outputs/apk/debug/SOURCE_BRANCH.txt
          printf '%s\n' '0.1.566' > app/build/outputs/apk/debug/VERSION_NAME.txt
          printf '%s\n' '5857' > app/build/outputs/apk/debug/VERSION_CODE.txt
          grep -F 'val releaseVersionCode = 5_857' app/build.gradle.kts
          grep -F 'val releaseVersionName = "0.1.566"' app/build.gradle.kts
          test "$(git rev-parse HEAD)" = '${{ steps.commit.outputs.source_sha }}'

      - name: Upload installable APK bound to final source SHA
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-operational-browser-0.1.566-${{ steps.commit.outputs.source_sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/SOURCE_SHA.txt
            app/build/outputs/apk/debug/SOURCE_BRANCH.txt
            app/build/outputs/apk/debug/VERSION_NAME.txt
            app/build/outputs/apk/debug/VERSION_CODE.txt
          if-no-files-found: error
