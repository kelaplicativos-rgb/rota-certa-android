name: Finalize Operational Browser 0.1.564

on:
  push:
    branches:
      - agent/operational-browser-attestation-0.1.564
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operational-browser-final-01564-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare authoritative 0.1.564 build metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text()
          old_code = 'val releaseVersionCode = 5_854'
          old_name = 'val releaseVersionName = "0.1.563"'
          new_code = 'val releaseVersionCode = 5_855'
          new_name = 'val releaseVersionName = "0.1.564"'

          if new_code not in text:
              if old_code not in text:
                  raise SystemExit('unexpected releaseVersionCode; refusing blind version mutation')
              text = text.replace(old_code, new_code, 1)
          if new_name not in text:
              if old_name not in text:
                  raise SystemExit('unexpected releaseVersionName; refusing blind version mutation')
              text = text.replace(old_name, new_name, 1)
          gradle.write_text(text)

          path = Path('app/src/main/assets/release_history.json')
          data = json.loads(path.read_text())
          releases = data['releases']
          matches = [r for r in releases if r.get('version') == '0.1.564' and r.get('build') == 5855]
          if len(matches) > 1:
              raise SystemExit('duplicate 0.1.564/5855 release history records')
          if not matches:
              releases.insert(0, {
                  'version': '0.1.564',
                  'build': 5855,
                  'commit': None,
                  'branch': 'agent/operational-browser-attestation-0.1.564',
                  'generatedAt': None,
                  'status': 'EM_VALIDACAO',
                  'implemented': [
                      'O navegador operacional passa a atestar a navegação ponta a ponta antes de considerar que a viagem original da BlaBlaCar foi aberta com sucesso.',
                      'Cada toque em Todas as viagens recebe uma operação sanitizada que relaciona viagem solicitada, conta proprietária, destino final e resultado da atestação.'
                  ],
                  'fixed': [
                      'O sucesso não é mais registrado imediatamente após startActivity; a confirmação exige que a navegação final corresponda à mesma viagem solicitada.',
                      'Redirecionamento para login, outra viagem ou identidade incompatível deixa de ser tratado como abertura exata da viagem.',
                      'Cancelamentos normais de lifecycle são separados de falhas operacionais de transporte.'
                  ],
                  'improved': [
                      'Viagens omitidas do índice passam a registrar motivos sanitizados de exclusão para diagnóstico sem expor dados privados.',
                      'A saúde global da sessão autenticada não é degradada artificialmente pelo navegador operacional durante a revalidação.',
                      'Agenda e estado canônico permanecem independentes; a mudança endurece somente o índice operacional e o roteamento para a BlaBlaCar original.'
                  ],
                  'regressions': [],
                  'resolvedRegressions': [],
                  'modulesAffected': ['Todas as viagens', 'BlaBlaCar', 'Contas externas', 'Sessão multiperfil', 'Navegação', 'Relatórios', 'Build'],
                  'detailsComplete': True
              })
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit final candidate metadata when needed
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/assets/release_history.json
          if git diff --cached --quiet; then
            echo '0.1.564 metadata already authoritative.'
          else
            git commit -m 'build: finalize operational browser 0.1.564 [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify operational browser and canonical regressions
        run: |
          ./gradlew testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.OperationalBrowserAttestation0564Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.OperationalAllTripsBrowser0563Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TimelineLocalPrimary0525Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalTripState0395Test'

      - name: Assemble installable debug APK
        env:
          ROTA_CERTA_GIT_SHA: ${{ steps.commit.outputs.source_sha }}
          ROTA_CERTA_GIT_BRANCH: ${{ github.ref_name }}
        run: ./gradlew assembleDebug

      - name: Record and verify APK identity
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          printf '%s\n' '${{ steps.commit.outputs.source_sha }}' > app/build/outputs/apk/debug/SOURCE_SHA.txt
          printf '%s\n' '${{ github.ref_name }}' > app/build/outputs/apk/debug/SOURCE_BRANCH.txt
          printf '%s\n' '0.1.564' > app/build/outputs/apk/debug/VERSION_NAME.txt
          printf '%s\n' '5855' > app/build/outputs/apk/debug/VERSION_CODE.txt
          grep -F 'val releaseVersionCode = 5_855' app/build.gradle.kts
          grep -F 'val releaseVersionName = "0.1.564"' app/build.gradle.kts
          test "$(git rev-parse HEAD)" = '${{ steps.commit.outputs.source_sha }}'

      - name: Upload installable APK bound to final source SHA
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-operational-browser-0.1.564-${{ steps.commit.outputs.source_sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/SOURCE_SHA.txt
            app/build/outputs/apk/debug/SOURCE_BRANCH.txt
            app/build/outputs/apk/debug/VERSION_NAME.txt
            app/build/outputs/apk/debug/VERSION_CODE.txt
          if-no-files-found: error
