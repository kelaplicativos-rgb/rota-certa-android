name: Rota Certa 0.1.712 Passenger Touch Isolation exact SHA

on:
  push:
    branches:
      - 'agent/passenger-card-touch-isolation-0.1.712'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: passenger-touch-isolation-0712-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      ROTA_CERTA_GIT_SHA: ${{ github.sha }}
      ROTA_CERTA_GIT_BRANCH: 'agent/passenger-card-touch-isolation-0.1.712'
      BASE_SHA: '11efd0c55403e9701365ff97eeb2fdcf21271e2f'
      EXPECTED_VERSION_NAME: '0.1.712'
      EXPECTED_VERSION_CODE: '6003'
      OM_TAG: '2026.08.27-18-android'
      OM_VERSION: '2026.08.27-18'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-36"             "ndk;29.0.14206865"             "cmake;3.22.1"

      - name: Build exact Organic Maps SDK locally
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 128 --branch "$OM_TAG" https://github.com/organicmaps/organicmaps.git /tmp/organicmaps
          cd /tmp/organicmaps
          git submodule update --init --recursive --depth 1 --jobs 8
          test "$(tools/unix/version.sh android_name)" = "$OM_VERSION"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          chmod +x ./gradlew
          ./gradlew             :sdk:location:core:publishToMavenLocal             :sdk:publishToMavenLocal             :sdk:maps:world:publishToMavenLocal             -Parm64 -Pnjobs=2             --no-daemon --max-workers=2 --stacktrace             | tee /tmp/organicmaps-sdk-build.log
          test -f "$HOME/.m2/repository/app/organicmaps/sdk/location-core/$OM_VERSION/location-core-$OM_VERSION.pom"
          test -f "$HOME/.m2/repository/app/organicmaps/sdk/sdk/$OM_VERSION/sdk-$OM_VERSION.pom"
          test -f "$HOME/.m2/repository/app/organicmaps/sdk/maps-world/$OM_VERSION/maps-world-$OM_VERSION.pom"

      - name: Prove exact source and touch isolation scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$ROTA_CERTA_GIT_SHA" = "$GITHUB_SHA"
          grep -Fq 'val releaseVersionName = "0.1.712"' app/build.gradle.kts
          grep -Fq 'val releaseVersionCode = 6_003' app/build.gradle.kts
          grep -Fq '"version": "0.1.712"' app/src/main/assets/release_history.json

          PASSENGERS='app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt'
          TRACKING='app/src/main/java/br/com/mapeiaia/rotacerta/LiveTrackingShare0668.kt'
          OPERATIONAL='app/src/main/java/br/com/mapeiaia/rotacerta/trips/OperationalAllTripsBrowserUi0563.kt'
          TIMELINE='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt'

          grep -Fq '.combinedClickable(' "$PASSENGERS"
          grep -Fq 'onLongClick = if (active0676) onLongPress0676 else null' "$PASSENGERS"
          ! grep -Fq 'TRACKING_LONG_PRESS_MILLIS_0676' "$PASSENGERS"
          grep -Fq 'ACTION_ENSURE_LOCATION_CORE_0681' "$PASSENGERS"
          grep -Fq 'ACTION_RECONCILE_LOCATION_CORE_0681' "$PASSENGERS"
          grep -Fq 'trackingStopInFlight0676' "$PASSENGERS"

          CLOSE_BLOCK="$(sed -n '/suspend fun closePassengerShare(passengerKey: String)/,/suspend fun closeActiveSession()/p' "$TRACKING")"
          grep -Fq 'val response = TrackingRemoteClient0668(settings).closeShare' <<< "$CLOSE_BLOCK"
          grep -Fq 'check(response.ok)' <<< "$CLOSE_BLOCK"

          grep -Fq 'OPERATIONAL_CARD_OPEN_SURFACE_0712' "$OPERATIONAL"
          ! grep -Fq '.clickable(enabled = manageable0633, onClick = onOpen)' "$OPERATIONAL"
          grep -Fq 'TIMELINE_CARD_OPEN_SURFACE_0712' "$TIMELINE"
          grep -Fq 'val toggleTimelineCard0712: () -> Unit' "$TIMELINE"

          git diff --check "$BASE_SHA"...HEAD
          printf '%s\n' "$GITHUB_SHA" | tee /tmp/source-sha.txt
          printf '%s\n' "$ROTA_CERTA_GIT_BRANCH" | tee /tmp/source-branch.txt

      - name: Verify release and focused 0.1.712 contracts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:verifyReleaseHistory --no-daemon --stacktrace | tee /tmp/release-history.log
          ./gradlew :app:testDebugUnitTest             --tests 'br.com.mapeiaia.rotacerta.trips.PassengerTouchIsolation0712Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PassengerTrackingControl0706Test'              --no-daemon --max-workers=2 --stacktrace             | tee /tmp/focused-android-0712.log

      - name: Run inherited FAROL and location regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest             --tests 'br.com.mapeiaia.rotacerta.FarolOneSecondVisualAuthority0711Test'             --tests 'br.com.mapeiaia.rotacerta.FarolFullLocalityPreservation0711Test'             --tests 'br.com.mapeiaia.rotacerta.GpsOfflineGridShortcut0710Test'             --tests 'br.com.mapeiaia.rotacerta.OrganicMapsOfflineBridge0709Test'             --tests 'br.com.mapeiaia.rotacerta.OfflineMapFilePolicy0708Test'             --tests 'br.com.mapeiaia.rotacerta.ReadingProximity0545ContractTest'             --tests 'br.com.mapeiaia.rotacerta.FarolSealed0547RegressionContractTest'             --no-daemon --max-workers=1 --no-parallel --stacktrace             | tee /tmp/inherited-regression-0712.log

      - name: Compare complete Android failures with exact 0.1.711 base
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/rc-base "$BASE_SHA"
          chmod +x /tmp/rc-base/gradlew
          set +e
          (cd /tmp/rc-base && ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace) > /tmp/android-base-full.log 2>&1
          BASE_EXIT=$?
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace > /tmp/android-head-full.log 2>&1
          HEAD_EXIT=$?
          set -e
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          def failures(root):
              result=set()
              d=pathlib.Path(root)/"app/build/test-results/testDebugUnitTest"
              if not d.exists():
                  return result
              for f in d.glob("*.xml"):
                  try:
                      tree=ET.parse(f)
                  except Exception:
                      continue
                  for case in tree.getroot().iter("testcase"):
                      if case.find("failure") is not None or case.find("error") is not None:
                          result.add(f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}")
              return result
          base=failures("/tmp/rc-base")
          head=failures(".")
          new=sorted(head-base)
          fixed=sorted(base-head)
          pathlib.Path("/tmp/android-new-failures.txt").write_text("\n".join(new)+("\n" if new else ""))
          pathlib.Path("/tmp/android-fixed-failures.txt").write_text("\n".join(fixed)+("\n" if fixed else ""))
          print(f"base_failures={len(base)} head_failures={len(head)} new_failures={len(new)} fixed={len(fixed)}")
          if new:
              print("\n".join(new))
              raise SystemExit(1)
          PY
          printf 'base_exit=%s\nhead_exit=%s\n' "$BASE_EXIT" "$HEAD_EXIT" | tee /tmp/android-regression-summary.txt

      - name: Assemble exact-head APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace | tee /tmp/assemble.log
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Prove APK identity and passenger touch isolation
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" | tee /tmp/zip-integrity.txt
          unzip -l "$APK" | tee /tmp/apk-files.txt
          grep -Eq 'lib/arm64-v8a/liborganicmaps\.so' /tmp/apk-files.txt
          grep -Eq 'assets/World\.mwm' /tmp/apk-files.txt
          grep -Eq 'assets/WorldCoasts\.mwm' /tmp/apk-files.txt

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt

          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -Fq "$GITHUB_SHA" /tmp/dex-strings.txt
          grep -Fq 'OPERATIONAL_CARD_OPEN_SURFACE_0712' /tmp/dex-strings.txt || true
          grep -Fq 'ACTION_RECONCILE_LOCATION_CORE_0681' /tmp/dex-strings.txt
          grep -Fq 'ORGANIC_MAPS_EMBEDDED_RUNTIME_0711' /tmp/dex-strings.txt

          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          FINAL="rota-certa-0.1.712-6003-$SHORT_SHA.apk"
          cp "$APK" "$FINAL"
          APK_SHA256="$(sha256sum "$FINAL" | awk '{print $1}')"
          sha256sum "$FINAL" | tee /tmp/apk-sha256.txt
          stat -c '%s' "$FINAL" | tee /tmp/apk-size-bytes.txt
          echo "apk=$FINAL" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "package=br.com.mapeiaia.rotacerta"
            echo "versionName=$EXPECTED_VERSION_NAME"
            echo "versionCode=$EXPECTED_VERSION_CODE"
            echo "sourceSha=$GITHUB_SHA"
            echo "sourceBranch=$ROTA_CERTA_GIT_BRANCH"
            echo "deviceTarget=Samsung SM-S911B / Android 16"
            echo "organicMapsSdk=$OM_VERSION"
            echo "passengerCardParentClickable=false"
            echo "trackingGesture=nativeCombinedClickable"
            echo "passengerRevocationRequiresRemoteAck=true"
            echo "trackingStopReconcilesLocationCore=true"
            echo "passengerShareDoesNotStartWorkTracking=true"
            echo "apkSha256=$APK_SHA256"
          } | tee /tmp/final-proof.txt

      - name: Upload exact-SHA APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-passenger-touch-isolation-0.1.712-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ steps.proof.outputs.apk }}
            /tmp/source-sha.txt
            /tmp/source-branch.txt
            /tmp/final-proof.txt
            /tmp/apk-sha256.txt
            /tmp/apk-size-bytes.txt
            /tmp/aapt.txt
            /tmp/apksigner.txt
            /tmp/zip-integrity.txt
            /tmp/apk-files.txt
            /tmp/focused-android-0712.log
            /tmp/inherited-regression-0712.log
            /tmp/android-base-full.log
            /tmp/android-head-full.log
            /tmp/android-new-failures.txt
            /tmp/android-fixed-failures.txt
            /tmp/android-regression-summary.txt
            /tmp/release-history.log
            /tmp/assemble.log
            /tmp/organicmaps-sdk-build.log
