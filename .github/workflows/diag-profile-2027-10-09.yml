name: Diagnose 2026-11-07 return

on:
  push:
    branches:
      - 'agent/diag-profile-2027-10-09'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query public BlaBlaCar and Barbosa source trip
        shell: bash
        run: |
          set -euo pipefail
          SEARCH='https://www.blablacar.com.br/search?fn=Tr%C3%AAs+Cora%C3%A7%C3%B5es&tn=Santo+Andr%C3%A9&db=2026-11-07&seats=1&search_origin=CARPOOL_AXIS&transport_type=CARPOOLING'
          LIVE='https://rota-certa-7ccc8.web.app/v1/public/live-query/ezequiel?date=2027-09-27&profileUuid=175a7068-50d8-40c3-a27a-214b9c6e0461'

          curl --retry 8 --retry-delay 2 --silent --show-error --location "$SEARCH" -o /tmp/blabla.html
          curl --retry 8 --retry-delay 2 --fail --silent --show-error "$LIVE" -o /tmp/barbosa.json

          echo '=== BARBOSA SOURCE ==='
          cat /tmp/barbosa.json
          echo
          echo '=== PUBLIC SEARCH MARKERS ==='
          grep -oE 'Sábado, 7 de novembro|[0-9]+ viagem disponível|[0-9]{2}:[0-9]{2}|R\$[0-9]+,[0-9]{2}|Três Corações|Santo André' /tmp/blabla.html | head -n 80 || true
          echo '=== PUBLIC SEARCH SIZE ==='
          wc -c /tmp/blabla.html
