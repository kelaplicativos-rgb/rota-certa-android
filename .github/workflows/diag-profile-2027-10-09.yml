name: Identify public ride 2026-11-12

on:
  push:
    branches:
      - 'agent/diag-profile-2027-10-09'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Open search in real browser and extract card/profile
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.blablacar.com.br/search?fn=S%C3%A3o+Paulo&tn=S%C3%A3o+Tom%C3%A9+das+Letras&db=2026-11-12&seats=1&search_origin=CARPOOL_AXIS&transport_type=CARPOOLING'

          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage             --disable-gpu --virtual-time-budget=15000 --dump-dom "$URL"             > /tmp/search.html 2>/tmp/chrome.err || true

          echo '=== SIZE ==='
          wc -c /tmp/search.html
          echo '=== TRIP LINKS ==='
          grep -oE 'https://www\.blablacar\.com\.br/trip[^" <]+' /tmp/search.html | head -n 20 || true
          grep -oE 'href="[^"]*trip[^"]*"' /tmp/search.html | head -n 20 || true
          echo '=== PROFILE LINKS ==='
          grep -oE 'href="[^"]*user/show/[^"]*"' /tmp/search.html | head -n 20 || true
          echo '=== UUIDS ==='
          grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/search.html | sort -u || true
          echo '=== CARD MARKERS ==='
          grep -oE '09:30|Wilson|São Tomé das Letras|São Thomé das Letras|R\$ ?89[^<]*' /tmp/search.html | head -n 50 || true

          cp /tmp/search.html search-2026-11-12.html
          cp /tmp/chrome.err chrome.err

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: identify-public-ride-2026-11-12
          retention-days: 7
          path: |
            search-2026-11-12.html
            chrome.err
