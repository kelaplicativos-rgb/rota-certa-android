name: Diagnose continuity Oct-Nov 2026

on:
  push:
    branches:
      - 'agent/diag-profile-2027-10-09'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query physical continuity across both BlaBla profiles
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rota-certa-7ccc8.web.app/v1/public/live-query/ezequiel'
          EZEQUIEL='7371f028-9c55-4903-8444-308015823efd'
          BARBOSA='175a7068-50d8-40c3-a27a-214b9c6e0461'

          : > /tmp/continuity.jsonl
          for DATE in 2026-10-29 2026-10-30 2026-10-31 2026-11-01; do
            for NAME_UUID in "ezequiel:$EZEQUIEL" "barbosa:$BARBOSA"; do
              NAME="${NAME_UUID%%:*}"
              UUID="${NAME_UUID#*:}"
              OUT="/tmp/${DATE}-${NAME}.json"
              curl --retry 10 --retry-delay 2 --fail --silent --show-error                 "$BASE?date=$DATE&profileUuid=$UUID" -o "$OUT"
              node - "$NAME" "$UUID" "$DATE" "$OUT" <<'NODE'
          const fs=require('fs');
          const [name,uuid,date,file]=process.argv.slice(2);
          const body=JSON.parse(fs.readFileSync(file,'utf8'));
          console.log(JSON.stringify({
            profile:name,
            profileUuid:uuid,
            date,
            validationStatus:body.validationStatus,
            collectorValidationStatus:body.collectorValidationStatus,
            count:body.count,
            trips:(body.trips||[]).map(t=>({
              id:t.id,
              localDate:t.localDate,
              localTime:t.localTime,
              title:t.title,
              status:t.status,
              departureAtMillis:t.departureAtMillis,
              stops:(t.stops||[]).map(s=>s.name)
            }))
          }));
          NODE
            done
          done | tee /tmp/continuity.jsonl

      - name: Upload diagnostic proof
        uses: actions/upload-artifact@v4
        with:
          name: diag-continuity-oct-nov-2026
          retention-days: 7
          path: |
            /tmp/continuity.jsonl
            /tmp/2026-10-29-ezequiel.json
            /tmp/2026-10-29-barbosa.json
            /tmp/2026-10-30-ezequiel.json
            /tmp/2026-10-30-barbosa.json
            /tmp/2026-10-31-ezequiel.json
            /tmp/2026-10-31-barbosa.json
            /tmp/2026-11-01-ezequiel.json
            /tmp/2026-11-01-barbosa.json
