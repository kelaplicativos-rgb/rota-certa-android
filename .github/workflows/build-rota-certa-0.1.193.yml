name: Build Rota Certa 0.1.193 forensic incident monitor

on:
  pull_request:
    branches: [agent/fix-alert-popup-hold-0.1.192]
    paths:
      - .github/workflows/build-rota-certa-0.1.193.yml
      - scripts/build_rota_certa_0193.sh
      - scripts/apply_forensic_incident_monitor_0193.py
      - scripts/enhance_forensic_popup_timing_0193.py
      - scripts/wire_manual_incident_marker_0193.py
  workflow_dispatch:

concurrency:
  group: rota-certa-0.1.193-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Verify protected source commit
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42"

      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
          path: patches

      - name: Verify cumulative patch commit
        working-directory: patches
        env:
          EXPECTED_PATCH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_PATCH_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate patch syntax
        working-directory: patches
        run: |
          python3 -m py_compile scripts/apply_forensic_incident_monitor_0193.py
          python3 -m py_compile scripts/enhance_forensic_popup_timing_0193.py
          python3 -m py_compile scripts/wire_manual_incident_marker_0193.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and validate 0.1.193
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-0193
        run: |
          set -o pipefail
          bash ../patches/scripts/build_rota_certa_0193.sh ../patches 2>&1 | tee build-0.1.193.log

      - name: Upload failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.193-forensic-incident-failure
          path: |
            source/build-0.1.193.log
            source/app/build/reports/tests/
            source/app/build/reports/lint-results-debug.html
          retention-days: 30
          if-no-files-found: warn

      - name: Upload validated APK
        id: artifact_upload
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.193-forensic-incident-validated
          path: source/artifact-0.1.193/
          retention-days: 90
          if-no-files-found: error

      - name: Publish isolated prerelease candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          APK_SOURCE='source/artifact-0.1.193/rota-certa-0.1.193-diagnostico-forense-validado-em-ci.apk'
          APK_CANDIDATE="${RUNNER_TEMP}/rota-certa-0.1.193-candidate.apk"
          cp "$APK_SOURCE" "$APK_CANDIDATE"
          EXPECTED_SHA="$(awk '{print $1}' source/artifact-0.1.193/sha256.txt)"
          ACTUAL_SHA="$(sha256sum "$APK_CANDIDATE" | awk '{print $1}')"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          TEST_COUNT="$(awk -F= '/^tests=/{print $2}' source/artifact-0.1.193/test-count.txt)"
          cat > "${RUNNER_TEMP}/candidate-notes.md" <<NOTES
          Rota Certa 0.1.193 — diagnóstico forense de incidentes

          Candidato isolado. Não substitui o link permanente latest.

          - pacote: br.com.mapeiaia.rotacerta
          - versão: 0.1.193
          - versionCode: 5477
          - head validado em CI: ${VALIDATED_HEAD}
          - testes: ${TEST_COUNT}; falhas: 0
          - Android Lint: aprovado
          - clean assembleDebug: aprovado
          - assinatura APK v2: conferida
          - SHA-256: ${ACTUAL_SHA}
          - reutiliza FarolFlightRecorder0163; não cria segundo logger
          - toque em Gerar relatório/Depurar marca o incidente antes do seletor de arquivo
          - montagem do relatório grava um segundo marcador temporal
          - detecta tempestade de eventos/OCR, resultado de geração antiga e cor final sem distância
          - ciclo pós-passagem de radar/alerta mede agendamento, cancelamento e callback real com relógio monotônico
          - sem polling, screenshot extra ou log contínuo adicional em disco

          DecisionEngine, parser, Google Maps/rota, serviço principal, Manifest e permissões permanecem inalterados.
          NOTES
          if gh release view ci-0.1.193 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete ci-0.1.193 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create ci-0.1.193 "$APK_CANDIDATE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VALIDATED_HEAD" \
            --title 'Rota Certa 0.1.193 — diagnóstico forense de incidentes' \
            --notes-file "${RUNNER_TEMP}/candidate-notes.md" \
            --prerelease

      - name: Verify public candidate byte for byte
        run: |
          set -euo pipefail
          URL='https://github.com/kelaplicativos-rgb/rota-certa-android/releases/download/ci-0.1.193/rota-certa-0.1.193-candidate.apk'
          curl --fail --location --retry 6 --retry-all-errors --output downloaded-candidate.apk "$URL"
          test "$(sha256sum downloaded-candidate.apk | awk '{print $1}')" = "$(awk '{print $1}' source/artifact-0.1.193/sha256.txt)"

      - name: Comment validated evidence
        if: success() && github.event_name == 'pull_request'
        working-directory: patches
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          TEST_COUNT="$(awk -F= '/^tests=/{print $2}' ../source/artifact-0.1.193/test-count.txt)"
          APK_SHA="$(awk '{print $1}' ../source/artifact-0.1.193/sha256.txt)"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "CI 0.1.193 concluída no run ${RUN_ID}. Diagnóstico forense reutiliza o gravador de voo existente, marca a reclamação no toque e mede o tempo real do pop-up com relógio monotônico, sem polling/screenshot extra. Testes: ${TEST_COUNT}; falhas: 0. SHA-256: ${APK_SHA}. Validação física do fluxo de relatório continua obrigatória."
