name: Stage47 PR direct-source Timeline wiring v2

on:
  pull_request:
    branches:
      - agent/stage47-r4-unified-occupancy-step6-validation-apk
    paths:
      - .github/workflows/stage47-direct-source-unified-timeline-pr-edit-v2.yml

permissions:
  contents: write

jobs:
  persist-unified-timeline:
    if: github.event.pull_request.head.ref == 'agent/stage47-r4-step7-automatic-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROTECTED_FAROL_SHA256: 2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage47-r4-step7-automatic-identity
          fetch-depth: 1

      - name: Apply disambiguated direct-source wiring
        shell: bash
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/stage47-direct-source-unified-timeline-edit.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          old = "actions = find(u, 'ResponsiveTripActions(listOf(')"
          new = "actions = next(i for i, line in enumerate(u) if line.strip() == 'ResponsiveTripActions(listOf(')"
          if script.count(old) != 1:
              raise SystemExit(f'action marker patch expected 1, found {script.count(old)}')
          script = script.replace(old, new)
          exec(compile(script, 'direct-source-timeline-editor-v2', 'exec'), {})
          PY
          rm -f \
            .github/workflows/stage47-direct-source-unified-timeline-pr-edit.yml \
            .github/workflows/stage47-direct-source-unified-timeline-pr-edit-v2.yml
          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          test -z "$(git diff --name-only -- "$FAROL")"
          grep -Fq 'else -> TripScreen.TIMELINE' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'timelineBaseDirectionLabel(entry, trip, directionGeo' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'versionName = "0.1.240"' app/build.gradle.kts
          test ! -e .github/workflows/stage47-direct-source-unified-timeline-edit.yml
          git diff --check

      - name: Commit only persisted direct source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt \
            app/build.gradle.kts \
            .github/workflows/stage47-direct-source-physical-apk.yml \
            .github/workflows/stage47-direct-source-validation.yml
          git add -u -- \
            .github/workflows/stage47-direct-source-unified-timeline-edit.yml \
            .github/workflows/stage47-direct-source-unified-timeline-pr-edit.yml \
            .github/workflows/stage47-direct-source-unified-timeline-pr-edit-v2.yml
          ! git diff --cached --name-only | grep -F 'LiveRideAccessibilityService.kt'
          git commit -m 'Timeline: unify agenda operational view'
          git push origin HEAD:agent/stage47-r4-step7-automatic-identity
          echo "source_head=$(git rev-parse HEAD)"
          echo 'direct_source=true'
          echo 'fixed_historical_source_checkout=false'
          echo 'stage47_materializer_used=false'
