name: Rota Certa 0.1.378 tester link validation APK

on:
  push:
    branches:
      - agent/tester-exclusive-link-0.1.378
    paths:
      - '.github/workflows/tester-exclusive-link-0378-validation.yml'
      - 'trip-platform/functions/index.js'
      - 'trip-platform/functions/tester-shadow-state.js'
      - 'trip-platform/functions/test/tester-exclusive-link-0378.test.js'
      - 'trip-platform/functions/test/tester-shadow-state.test.js'
      - 'trip-platform/public/app.js'
      - 'trip-platform/public/index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tester-exclusive-link-0378-validation
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact source and protected FAROL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -Fq 'versionCode = 5671' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.378"' app/build.gradle.kts
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          git diff --name-only 258d304dad908223d665d20d8aa7ea8de143c782..HEAD | tee /tmp/changed-files.txt
          ! grep -Eq '(^|/)LiveRideAccessibilityService\.kt$|(^|/)Farol[^/]*\.kt$' /tmp/changed-files.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate tester backend and portal contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/functions/tester-shadow-state.js
          node --check trip-platform/public/app.js
          node --test trip-platform/functions/test/tester-exclusive-link-0378.test.js trip-platform/functions/test/tester-shadow-state.test.js

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android unit tests and APK
        shell: bash
        run: |
          set -euo pipefail
          export ROTA_CERTA_GIT_SHA="${GITHUB_SHA}"
          export ROTA_CERTA_GIT_BRANCH="${GITHUB_REF_NAME}"
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace --console=plain | tee /tmp/gradle.txt
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p /tmp/0378
          cp "$APK" /tmp/0378/rota-certa-0.1.378-tester-link.apk
          sha256sum /tmp/0378/rota-certa-0.1.378-tester-link.apk | tee /tmp/0378/apk.sha256
          cp /tmp/gradle.txt /tmp/0378/gradle.txt
          cp /tmp/changed-files.txt /tmp/0378/changed-files.txt
          printf '%s\n' "${GITHUB_SHA}" > /tmp/0378/source-head.txt
          printf '%s\n' "${GITHUB_REF_NAME}" > /tmp/0378/source-branch.txt
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"

      - name: Validate APK package/version
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/0378/rota-certa-0.1.378-tester-link.apk
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/0378/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/0378/aapt.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta'" /tmp/0378/aapt.txt
          grep -Fq "versionCode='5671'" /tmp/0378/aapt.txt
          grep -Fq "versionName='0.1.378'" /tmp/0378/aapt.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.378-tester-exclusive-link
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0378

      - name: Configure Firebase deploy authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-deploy-sa.json
            chmod 600 /tmp/firebase-deploy-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-deploy-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-deploy-sa.json
            chmod 600 /tmp/firebase-deploy-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-deploy-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase credential is missing." >&2
            exit 3
          fi

      - name: Install Functions dependencies
        shell: bash
        run: npm --prefix trip-platform/functions install --no-audit --no-fund

      - name: Deploy exact HEAD tester backend and hosting
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force
          fi

      - name: Smoke live tester isolation contract
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://rota-certa-7ccc8.web.app
          curl --retry 8 --retry-delay 3 --fail --silent --show-error "$BASE/v1/health" | tee /tmp/0378/live-health.json
          grep -Fq '"ok":true' /tmp/0378/live-health.json

          CODE="$(curl --retry 5 --retry-delay 2 --silent --show-error -o /tmp/0378/bootstrap-invalid.json -w '%{http_code}'             -X POST "$BASE/v1/public/tester/bootstrap"             -H 'Content-Type: application/json'             --data '{"bootstrapToken":"invalid-ci-bootstrap-token"}')"
          test "$CODE" = "401"
          grep -Fq 'tester_bootstrap_invalid' /tmp/0378/bootstrap-invalid.json

          CODE="$(curl --retry 5 --retry-delay 2 --silent --show-error -o /tmp/0378/driver-auth-probe.json -w '%{http_code}'             "$BASE/v1/driver/test-link")"
          test "$CODE" = "401"
          grep -Fq 'driver_auth_required' /tmp/0378/driver-auth-probe.json

          CODE="$(curl --retry 5 --retry-delay 2 --silent --show-error -o /tmp/0378/tester-session-probe.json -w '%{http_code}'             "$BASE/v1/tester/session")"
          test "$CODE" = "401"
          grep -Fq 'tester_session_required' /tmp/0378/tester-session-probe.json

          CODE="$(curl --retry 5 --retry-delay 2 --silent --show-error -o /tmp/0378/tester-credits-probe.json -w '%{http_code}'             "$BASE/v1/tester/me/credits")"
          test "$CODE" = "401"
          grep -Fq 'tester_session_required' /tmp/0378/tester-credits-probe.json

          CODE="$(curl --retry 5 --retry-delay 2 --silent --show-error -o /tmp/0378/tester-notifications-probe.json -w '%{http_code}'             "$BASE/v1/tester/me/notifications")"
          test "$CODE" = "401"
          grep -Fq 'tester_session_required' /tmp/0378/tester-notifications-probe.json

          BUST="$(date +%s%N)"
          curl --retry 8 --retry-delay 3 --fail --silent --show-error "$BASE/app.js?v=$BUST" -o /tmp/0378/live-app.js
          curl --retry 8 --retry-delay 3 --fail --silent --show-error "$BASE/?v=$BUST" -o /tmp/0378/live-index.html
          grep -Fq 'bootstrapTesterExperience' /tmp/0378/live-app.js
          grep -Fq 'X-Rota-Certa-Tester-Session' /tmp/0378/live-app.js
          grep -Fq 'if (isTesterMode()) return continueAfterAuthentication();' /tmp/0378/live-app.js
          grep -Fq 'Nenhum serviço externo foi aberto no Modo Teste.' /tmp/0378/live-app.js
          grep -Fq '/v1/tester/me/credits' /tmp/0378/live-app.js
          grep -Fq '/v1/tester/me/notifications' /tmp/0378/live-app.js
          grep -Fq 'MODO TESTE' /tmp/0378/live-index.html
          grep -Fq '/app.js?v=0.1.378-tester-bypass-2' /tmp/0378/live-index.html
          printf '%s\n' "${GITHUB_SHA}" > /tmp/0378/deployed-source-head.txt
          echo "LIVE_TESTER_CONTRACT=PASS"

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.378-tester-exclusive-link-live
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/0378/live-health.json
            /tmp/0378/bootstrap-invalid.json
            /tmp/0378/driver-auth-probe.json
            /tmp/0378/tester-session-probe.json
            /tmp/0378/deployed-source-head.txt
