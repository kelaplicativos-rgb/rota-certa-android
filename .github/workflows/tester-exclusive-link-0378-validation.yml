name: Rota Certa 0.1.378 tester link validation APK

on:
  push:
    branches:
      - agent/tester-exclusive-link-0.1.378
    paths:
      - '.github/workflows/tester-exclusive-link-0378-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tester-exclusive-link-0378-validation
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact source and protected FAROL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -Fq 'versionCode = 5671' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.378"' app/build.gradle.kts
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          git diff --name-only 258d304dad908223d665d20d8aa7ea8de143c782..HEAD | tee /tmp/changed-files.txt
          ! grep -Eq '(^|/)LiveRideAccessibilityService\.kt$|(^|/)Farol[^/]*\.kt$' /tmp/changed-files.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate tester backend and portal contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/public/app.js
          node --test trip-platform/functions/test/tester-exclusive-link-0378.test.js

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android unit tests and APK
        shell: bash
        run: |
          set -euo pipefail
          export ROTA_CERTA_GIT_SHA="${GITHUB_SHA}"
          export ROTA_CERTA_GIT_BRANCH="${GITHUB_REF_NAME}"
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace --console=plain | tee /tmp/gradle.txt
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p /tmp/0378
          cp "$APK" /tmp/0378/rota-certa-0.1.378-tester-link.apk
          sha256sum /tmp/0378/rota-certa-0.1.378-tester-link.apk | tee /tmp/0378/apk.sha256
          cp /tmp/gradle.txt /tmp/0378/gradle.txt
          cp /tmp/changed-files.txt /tmp/0378/changed-files.txt
          printf '%s\n' "${GITHUB_SHA}" > /tmp/0378/source-head.txt
          printf '%s\n' "${GITHUB_REF_NAME}" > /tmp/0378/source-branch.txt
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"

      - name: Validate APK package/version
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/0378/rota-certa-0.1.378-tester-link.apk
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/0378/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/0378/aapt.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta'" /tmp/0378/aapt.txt
          grep -Fq "versionCode='5671'" /tmp/0378/aapt.txt
          grep -Fq "versionName='0.1.378'" /tmp/0378/aapt.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.378-tester-exclusive-link
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0378
