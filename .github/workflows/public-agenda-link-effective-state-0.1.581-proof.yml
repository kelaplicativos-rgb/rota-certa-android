name: Public Agenda effective link state 0.1.581 proof

on:
  push:
    branches:
      - agent/public-agenda-link-effective-state-0.1.581
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-agenda-link-effective-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_MAPS_API_KEY: effective_link_validation_dummy_key
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact source and protected FAROL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git diff --name-only d599e7725b43958bae42bfa6a4e217fc089d9fef "$GITHUB_SHA" -- app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt)"
          git diff --check d599e7725b43958bae42bfa6a4e217fc089d9fef...HEAD
          grep -Fq 'persistedTrips = store.read(account)?.trips.orEmpty()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          grep -Fq 'persistedByIdentity' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDateScopeScriptSelection0449.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run focused public-link regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaPublicLinkCompleteness0585Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaRidesPublicLinkCapture0582Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Compile Android app/src
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin --no-daemon --max-workers=1 --no-parallel --stacktrace
