name: Rota Certa 0.1.547 exact-head APK

on:
  push:
    branches:
      - agent/reading-geocode-resilience-0.1.547
    paths:
      - '.github/workflows/reading-0547-exact-head-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reading-0547-exact-head-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_VERSION_CODE: '5839'
      EXPECTED_VERSION_NAME: '0.1.547'
      SEALED_SHA: 535ad0217c38c7bd98c6eea7f839a94c64b5c2dd
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      GOOGLE_MAPS_API_KEY: ''

    steps:
      - name: Checkout exact triggering HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove source identity and sealed FAROL authority
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_HEAD="$(git rev-parse HEAD)"
          test "$SOURCE_HEAD" = "$GITHUB_SHA"
          grep -Fq 'versionCode = 5839' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.547"' app/build.gradle.kts
          git cat-file -e "${SEALED_SHA}^{commit}"
          grep -Fq "$SEALED_SHA" .github/farol-seal-0.1.547.md
          git diff --exit-code "$SEALED_SHA" -- app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          git diff --exit-code "$SEALED_SHA" -- app/src/test/java/br/com/mapeiaia/rotacerta/ReadingProximity0545ContractTest.kt
          git diff --exit-code "$SEALED_SHA" -- app/src/test/java/br/com/mapeiaia/rotacerta/ReadingFreePrimary0546ContractTest.kt
          git diff --exit-code "$SEALED_SHA" -- app/src/test/java/br/com/mapeiaia/rotacerta/ReadingGeocodeResilience0547ContractTest.kt
          mkdir -p evidence
          printf '%s\n' "$SOURCE_HEAD" | tee evidence/source-head.txt
          printf '%s\n' "$GITHUB_REF_NAME" | tee evidence/source-branch.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then exit 0; fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run sealed 0.1.547 regression contracts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.ReadingProximity0545ContractTest' \
            --tests 'br.com.mapeiaia.rotacerta.ReadingGeocodeResilience0547ContractTest' \
            --tests 'br.com.mapeiaia.rotacerta.FarolSealed0547RegressionContractTest' \
            --tests 'br.com.mapeiaia.rotacerta.FarolStage44SemanticFinalLeaseTest' \
            --tests 'br.com.mapeiaia.rotacerta.FarolStage46ImmediateAddressRouteR7Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Assemble exact-head debug APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK identity and preserve evidence
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > evidence/aapt-badging.txt
          PACKAGE_LINE="$(grep '^package:' evidence/aapt-badging.txt | head -n1)"
          echo "$PACKAGE_LINE"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"
          test "$(cat evidence/source-head.txt)" = "$GITHUB_SHA"
          sha256sum "$APK" | tee evidence/apk-sha256.txt
          grep -E 'version(Code|Name) = ' app/build.gradle.kts | tee evidence/app-version.txt
          cp "$APK" "evidence/rota-certa-0.1.547-reading-geocode-resilience.apk"

      - name: Upload exact-head installable APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.547-reading-geocode-resilience-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            evidence/rota-certa-0.1.547-reading-geocode-resilience.apk
            evidence/source-head.txt
            evidence/source-branch.txt
            evidence/aapt-badging.txt
            evidence/apk-sha256.txt
            evidence/app-version.txt
