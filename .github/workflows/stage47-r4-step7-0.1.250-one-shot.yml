              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          def region(text, start, end, replacement, label):
              a = text.find(start)
              b = text.find(end, a + len(start)) if a >= 0 else -1
              if a < 0 or b < 0:
