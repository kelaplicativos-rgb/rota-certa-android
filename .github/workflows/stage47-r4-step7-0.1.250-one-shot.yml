name: Stage47 one-shot direct-source physical fixes 0.1.250

on:
  push:
    branches:
      - agent/stage47-r4-step7-automatic-identity
    paths:
      - .github/workflows/stage47-r4-step7-0.1.250-one-shot.yml

permissions:
  contents: write

env:
  GOOGLE_MAPS_API_KEY: stage47_ci_dummy_key
  PROTECTED_FAROL_SHA256: 2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560
  BASE_SOURCE_HEAD: 6d0579b5d4760c4ed7cbb3b99f18eb71d0c15c95
  EXPECTED_VERSION_CODE: '5543'
  EXPECTED_VERSION_NAME: '0.1.250'

jobs:
  apply-test-build-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout current branch directly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify exact predecessor and protected FAROL
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SOURCE_HEAD"
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          grep -Fq 'versionCode = 5542' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.249"' app/build.gradle.kts
          echo "predecessor=$(git rev-parse HEAD^)"
          echo "transport_commit=$(git rev-parse HEAD)"
          echo 'direct_source_precheck=PASS'

      - name: Apply only the three physical-test corrections
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path('.')
          AUTO = ROOT / 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaManualSeatAutomation.kt'
          COLLECTOR = ROOT / 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollector.kt'
          DYNAMIC = ROOT / 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt'
          DOM = ROOT / 'app/src/main/java/br/com/mapeia/rotacerta/trips/BlaBlaDomParsing.kt'
          if not DOM.exists():
              DOM = ROOT / 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDomParsing.kt'
          TIMELINE = ROOT / 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimeline.kt'
          TIMELINE_UI = ROOT / 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt'
          BUILD = ROOT / 'app/build.gradle.kts'
          VALIDATION = ROOT / '.github/workflows/stage47-direct-source-validation.yml'
          PHYSICAL = ROOT / '.github/workflows/stage47-direct-source-physical-apk.yml'
          TEST = ROOT / 'app/src/test/java/br/com/mapeiaia/rotacerta/trips/Stage47PhysicalFixes0250Test.kt'

