name: Document Rota Certa 0.1.182 validation

on:
  push:
    branches: [agent/direct-shortcut-grid-0.1.182]
    paths:
      - .github/workflows/document-rota-certa-0.1.182.yml

permissions:
  contents: write
  actions: read

jobs:
  document:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RC_BRANCH: agent/direct-shortcut-grid-0.1.182
      RC_COMMIT: 4094b598dab6374067ef1f480bf3f70d7684ccab
      RC_RUN_ID: '30850540090'
      RC_JOB_ID: '91809194366'
      RC_ARTIFACT_NAME: rota-certa-0.1.182-direct-shortcut-grid-validated
      RC_ARTIFACT_ID: '8871170435'
      RC_ARTIFACT_SIZE: '33732084'
      RC_ARTIFACT_DIGEST: sha256:470a7ed0cdaa599a70ae578bc2b56b7c6e30110a52e861bd478efc01852f78d7
      RC_APK_NAME: rota-certa-0.1.182-grade-atalhos-dois-toques-validado.apk
      RC_APK_SIZE: '56058835'
      RC_APK_SHA256: 1d654096731fec7e8fb0c66500066305b0ee6658ebf0c101352cf239d1f401f7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/direct-shortcut-grid-0.1.182
          fetch-depth: 0

      - name: Revalidate published artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/rc182
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RC_ARTIFACT_ID}/zip" > /tmp/rc182.zip
          test "$(sha256sum /tmp/rc182.zip | awk '{print $1}')" = "${RC_ARTIFACT_DIGEST#sha256:}"
          unzip -tqq /tmp/rc182.zip
          unzip -q /tmp/rc182.zip -d /tmp/rc182
          APK="$(find /tmp/rc182 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test "$(basename "$APK")" = "$RC_APK_NAME"
          test "$(stat --printf='%s' "$APK")" = "$RC_APK_SIZE"
          test "$(sha256sum "$APK" | awk '{print $1}')" = "$RC_APK_SHA256"
          grep -F 'package=br.com.mapeiaia.rotacerta' /tmp/rc182/validation.txt
          grep -F 'versionName=0.1.182' /tmp/rc182/validation.txt
          grep -F 'versionCode=5430' /tmp/rc182/validation.txt
          grep -F 'maximum_taps_main_to_action=2' /tmp/rc182/validation.txt
          grep -F 'triple_tap_window_removed=true' /tmp/rc182/validation.txt
          grep -F 'generic_intermediate_popup_on_primary=false' /tmp/rc182/validation.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/rc182/signature.txt
          grep -Fi 'd9ee577b5bb9a4c72bce115e974c9ecf1ec8c7382bcd034e88d433e01eb0e7fd' /tmp/rc182/signature.txt

      - name: Update project status and decisions
        run: python scripts/update_docs_0182.py

      - name: Commit validated records
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATUS.md docs/DECISIONS.md validation/0.1.182/latest.txt
          git diff --cached --check
          git commit -m 'docs: registrar validação 0.1.182 [skip ci]'
          git push origin HEAD:agent/direct-shortcut-grid-0.1.182
