name: HTML transaction heartbeat 0.1.678 APK

on:
  push:
    branches:
      - 'agent/html-transaction-heartbeat-0.1.678'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: html-transaction-heartbeat-0678-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_API_KEY: ''
      ROTA_CERTA_GIT_SHA: ${{ github.sha }}
      ROTA_CERTA_GIT_BRANCH: agent/html-transaction-heartbeat-0.1.678

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ROTA_CERTA_GIT_SHA"
          S='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaCollectorSessionModule.kt'
          C='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaRidesSnapshot0526.kt'
          D='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDirectAccountCapture0608.kt'
          U='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt'
          grep -Fq 'releaseVersionName = "0.1.678"' app/build.gradle.kts
          grep -Fq 'releaseVersionCode = 5_969' app/build.gradle.kts
          grep -Fq '"version": "0.1.678"' app/src/main/assets/release_history.json
          grep -Fq 'KEY_LAST_HEARTBEAT' "$S"
          grep -Fq 'htmlCaptureLeaseExpired0678' "$S"
          grep -Fq 'fun heartbeat(' "$S"
          grep -Fq 'transaction0610 = transaction' "$C"
          grep -Fq 'expectedTransaction0610 = transaction' "$C"
          grep -Fq 'BlaBlaHtmlCaptureTransaction0610.end(app, transaction)' "$C"
          grep -Fq 'transaction0610: BlaBlaHtmlCaptureTransactionState0610? = null' "$D"
          grep -Fq 'expectedTransaction0610: BlaBlaHtmlCaptureTransactionState0610? = null' "$U"
          grep -Fq 'transaction_not_active_or_owner_lost_0678' "$U"
          git diff --check 5b5d9668570156f886927302ad97b2b8ebda2f36 HEAD

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run heartbeat and inherited regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaHtmlTransactionHeartbeat0678Test'             --tests 'br.com.mapeiaia.rotacerta.trips.TripDetailScriptResilience0677Test'             --tests 'br.com.mapeiaia.rotacerta.trips.RidesIndexDetailPipeline0676Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaLiveHtmlCommit0617Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaDirectAccountCapture0608Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaRidesForensicEvidence0528Test'             --tests 'br.com.mapeiaia.rotacerta.trips.TargetedHtmlPrivatePending0675Test'             --no-daemon --max-workers=2 --stacktrace | tee /tmp/android-0678-tests.log

      - name: Assemble exact source APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace | tee /tmp/android-0678-assemble.log
          test "$(git rev-parse HEAD)" = "$ROTA_CERTA_GIT_SHA"

      - name: Prove APK identity signing runtime markers and final SHA
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -s "$APK"
          unzip -t "$APK" | tee /tmp/android-0678-zip-integrity.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/android-0678-aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/android-0678-aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='5969'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='0.1.678'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/android-0678-apksigner.txt
          grep -Fq 'Verified' /tmp/android-0678-apksigner.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/android-0678-dex-strings.txt
          grep -Fq "$ROTA_CERTA_GIT_SHA" /tmp/android-0678-dex-strings.txt
          grep -Fq 'transaction_not_active_or_owner_lost_0678' /tmp/android-0678-dex-strings.txt
          grep -Fq 'TRIP_DETAIL_SCRIPT_ERROR_0677' /tmp/android-0678-dex-strings.txt
          grep -Fq 'BLABLACAR_RIDES_INDEX_LINKS_PERSISTED_0676' /tmp/android-0678-dex-strings.txt

          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          FINAL="rota-certa-0.1.678-5969-$SHORT_SHA.apk"
          cp "$APK" "$FINAL"
          echo "apk=$FINAL" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "package=br.com.mapeiaia.rotacerta"
            echo "versionName=0.1.678"
            echo "versionCode=5969"
            echo "branch=agent/html-transaction-heartbeat-0.1.678"
            echo "commit=$ROTA_CERTA_GIT_SHA"
            echo "deviceTarget=Samsung SM-S911B / Android 16 / API 36"
            echo "transactionLease=HEARTBEAT_LAST_ACTIVITY"
            echo "transactionOwner=captureId+generation"
            echo "abandonedLeaseExpiry=15min_inactivity"
            echo "apk=$FINAL"
            echo "apk_sha256=$APK_SHA256"
          } | tee html-transaction-heartbeat-0678-proof.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-html-transaction-heartbeat-0.1.678-${{ github.sha }}
          path: |
            ${{ steps.proof.outputs.apk }}
            html-transaction-heartbeat-0678-proof.txt
            /tmp/android-0678-tests.log
            /tmp/android-0678-assemble.log
            /tmp/android-0678-aapt.txt
            /tmp/android-0678-apksigner.txt
            /tmp/android-0678-zip-integrity.txt
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30
