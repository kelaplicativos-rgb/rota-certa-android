name: Timeline 0.1.539 pull visual feedback

on:
  push:
    branches:
      - agent/timeline-pull-visual-feedback-0.1.539
    paths:
      - '.github/triggers/timeline-0539.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timeline-0539-pull-visual-feedback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: timeline_pull_visual_0539_ci_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/timeline-pull-visual-feedback-0.1.539

      - name: Prove exact 0.1.538 baseline and protected invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 5830' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.538"' app/build.gradle.kts
          grep -Fq 'TIMELINE_PULL_REFRESH_ALL_COLLECTOR_0538' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'origin = BlaBlaCommandOrigin0407.SYSTEM_RECONCILIATION' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'origin = BlaBlaCommandOrigin0407.CARD' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          ! grep -Fq 'Carregando passageiros' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          ! grep -Fq 'CircularProgressIndicator' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaPullRefreshGesture0388.kt
          test -f .github/scripts/timeline_0539_pull_visual_feedback.py
          sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt > /tmp/farol.before
          sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt > /tmp/timeline-ui.before

      - name: Materialize visible release-to-refresh feedback
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/timeline_0539_pull_visual_feedback.py
          git diff --check
          grep -Fq 'CircularProgressIndicator(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaPullRefreshGesture0388.kt
          grep -Fq 'Puxe para atualizar' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaPullRefreshGesture0388.kt
          grep -Fq 'Solte para atualizar' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaPullRefreshGesture0388.kt
          grep -Fq 'Atualizando viagens…' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaPullRefreshGesture0388.kt
          grep -Fq 'shouldDispatchAgendaRefreshOnRelease0388(accepted, refreshRunningAtStart)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaPullRefreshGesture0388.kt
          grep -Fq 'versionCode = 5831' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.539"' app/build.gradle.kts

      - name: Protect global collector path FAROL and exact source scope
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt > /tmp/farol.after
          cmp /tmp/farol.before /tmp/farol.after
          sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt > /tmp/timeline-ui.after
          cmp /tmp/timeline-ui.before /tmp/timeline-ui.after
          grep -Fq 'TIMELINE_PULL_REFRESH_ALL_COLLECTOR_0538' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'origin = BlaBlaCommandOrigin0407.CARD' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'origin = BlaBlaCommandOrigin0407.SYSTEM_RECONCILIATION' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/changed.txt
          printf '%s\n' \
            'app/build.gradle.kts' \
            'app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaPullRefreshGesture0388.kt' \
            'app/src/test/java/br/com/mapeiaia/rotacerta/trips/AgendaPullRefreshGesture0388Test.kt' | sort > /tmp/expected.txt
          cmp /tmp/expected.txt /tmp/changed.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Firebase Android app for build only
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Focused release-to-refresh regression and pre-commit APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaPullRefreshGesture0388Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TimelineGlobalPullSync0538Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripTimelineProfile0536Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Commit tested materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaPullRefreshGesture0388.kt \
                  app/src/test/java/br/com/mapeiaia/rotacerta/trips/AgendaPullRefreshGesture0388Test.kt
          git commit -m 'feat(timeline): visible pull refresh 0.1.539'
          git push origin HEAD:agent/timeline-pull-visual-feedback-0.1.539
          FINAL_SHA="$(git rev-parse HEAD)"
          printf '%s\n' "$FINAL_SHA" | tee /tmp/source-head.txt
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_BRANCH=agent/timeline-pull-visual-feedback-0.1.539" >> "$GITHUB_ENV"
          git diff --exit-code

      - name: Rebuild exact final SHA APK and verify package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          ./gradlew :app:clean :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='5831'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='0.1.539'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'Verified' /tmp/apksigner.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -Fq "$FINAL_SHA" /tmp/dex-strings.txt
          grep -Fq 'Puxe para atualizar' /tmp/dex-strings.txt
          grep -Fq 'Solte para atualizar' /tmp/dex-strings.txt
          grep -Fq 'TIMELINE_PULL_REFRESH_ALL_COLLECTOR_0538' /tmp/dex-strings.txt
          sha256sum "$APK" | tee /tmp/apk.sha256
          sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt > /tmp/farol.final
          cmp /tmp/farol.before /tmp/farol.final

      - name: Prepare final-SHA APK evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          mkdir -p /tmp/timeline-0539
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/timeline-0539/rota-certa-0.1.539-debug.apk
          cp /tmp/apk.sha256 /tmp/timeline-0539/apk.sha256
          cp /tmp/source-head.txt /tmp/timeline-0539/source-head.txt
          cp /tmp/aapt.txt /tmp/apksigner.txt /tmp/timeline-0539/
          printf '%s\n' \
            'package=br.com.mapeiaia.rotacerta' \
            'versionName=0.1.539' \
            'versionCode=5831' \
            "sourceSha=$FINAL_SHA" \
            'pullVisual=down-arrow then release label then spinning indicator' \
            'refreshDispatch=on release after threshold' \
            'globalCollectorPath=preserved from 0.1.538' \
            'perCardRadar=preserved' \
            'farolUntouched=true' \
            'physicalApproval=PENDING_SAMSUNG_SM_S911B_ANDROID_16' > /tmp/timeline-0539/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-timeline-0.1.539-${{ env.FINAL_SHA }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/timeline-0539
