name: Operational health root-cause 0.1.573

on:
  push:
    branches:
      - agent/operational-health-rootcause-0.1.573
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-health-rootcause-0.1.573-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: operational_evolution_validation_dummy_key
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact source and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --check HEAD^..HEAD
          grep -Fq 'val releaseVersionCode = 5_864' app/build.gradle.kts
          grep -Fq 'val releaseVersionName = "0.1.573"' app/build.gradle.kts
          grep -Fq '"version": "0.1.573"' app/src/main/assets/release_history.json
          grep -Fq 'class OperationalHealthActivity' app/src/main/java/br/com/mapeiaia/rotacerta/monitoring/OperationalHealthCenter.kt
          grep -Fq 'PeriodicWorkRequestBuilder<OperationalHealthWorker>(1, TimeUnit.HOURS)' app/src/main/java/br/com/mapeiaia/rotacerta/monitoring/OperationalHealthCenter.kt
          git rev-parse HEAD | tee validated-source-head.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1 | tee android-build-tools-dir.txt
          test -s android-build-tools-dir.txt

      - uses: gradle/actions/setup-gradle@v4

      - name: Run operational health engine tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ! grep -Fq '(?U)' app/src/main/java/br/com/mapeiaia/rotacerta/TextCorrectionEngine0186.kt
          grep -Fq 'recoverPersistedCrashIntoUnifiedDebug' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace.kt
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.monitoring.OperationalHealthEngineTest' \
            --tests 'br.com.mapeiaia.rotacerta.TextCorrectionEngine0186Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace | tee rootcause-tests.log

      - name: Assemble exact debug APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace | tee assemble-debug.log
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee aapt-badging.txt
          grep -q "package: name='br.com.mapeiaia.rotacerta'" aapt-badging.txt
          grep -q "versionCode='5864'" aapt-badging.txt
          grep -q "versionName='0.1.573'" aapt-badging.txt
          cp "$APK" rota-certa-0.1.573-operational-health-rootcause.apk
          stat -c '%s' rota-certa-0.1.573-operational-health-rootcause.apk | tee apk-size-bytes.txt
          sha256sum rota-certa-0.1.573-operational-health-rootcause.apk | tee apk-sha256.txt

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.573-operational-evolution-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            rota-certa-0.1.573-operational-health-rootcause.apk
            validated-source-head.txt
            rootcause-tests.log
            assemble-debug.log
            apksigner.txt
            aapt-badging.txt
            apk-size-bytes.txt
            apk-sha256.txt
            app/build/reports/tests/testDebugUnitTest

      - name: Confirm installable artifact publication
        shell: bash
        run: |
          set -euo pipefail
          test -s rota-certa-0.1.573-operational-health-rootcause.apk
          test -s apk-sha256.txt
          test -s validated-source-head.txt
          test "$(cat validated-source-head.txt)" = "$GITHUB_SHA"
          echo "APK published as GitHub Actions artifact for exact SHA $GITHUB_SHA"
