name: Rota Certa 0.1.306 APK

on:
  push:
    branches:
      - agent/agenda-link-actions-0.1.306
    paths:
      - '.github/workflows/agenda-0306-build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agenda-link-actions-0.1.306

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Firebase service account
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
          else
            echo "Firebase service account secret is missing."
            exit 3
          fi
          chmod 600 /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Generate Firebase Android SDK config
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/android-apps.txt
          APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/android-apps.txt | head -1)"
          test -n "$APP_ID"
          npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace | tee /tmp/gradle.txt
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"

          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          grep -Fq "versionCode='5599'" /tmp/aapt.txt
          grep -Fq "versionName='0.1.306'" /tmp/aapt.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

          mkdir -p /tmp/rota-certa-0306
          cp "$APK" /tmp/rota-certa-0306/rota-certa-0.1.306.apk
          cp /tmp/apk.sha256 /tmp/rota-certa-0306/apk.sha256
          cp /tmp/aapt.txt /tmp/rota-certa-0306/aapt.txt
          cp /tmp/apksigner.txt /tmp/rota-certa-0306/apksigner.txt
          git rev-parse HEAD > /tmp/rota-certa-0306/source-head.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.306
          if-no-files-found: error
          retention-days: 30
          path: /tmp/rota-certa-0306
