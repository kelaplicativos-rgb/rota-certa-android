name: Apply passenger address actions 0.1.258

on:
  push:
    branches:
      - agent/passenger-timeline-geo-ux

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/passenger-timeline-geo-ux
          fetch-depth: 1

      - name: Patch real app/src for 0.1.258
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          passenger_path = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt')
          text = passenger_path.read_text()

          text = replace_once(
              text,
              '    var fareEditRow by remember { mutableStateOf<EnhancedPassengerCardRow?>(null) }\n',
              '    var fareEditRow by remember { mutableStateOf<EnhancedPassengerCardRow?>(null) }\n    var boardingAddressEditRow by remember { mutableStateOf<EnhancedPassengerCardRow?>(null) }\n    var dropoffAddressEditRow by remember { mutableStateOf<EnhancedPassengerCardRow?>(null) }\n',
              'address editor state',
          )

          per_passenger_trip_action = '''\n                externalTripTarget(entry.blablaProfileUuid, entry.blablaTripHref)?.let {\n                    IconButton(\n                        onClick = {\n                            if (!openExternalTripBlaBla(context, entry.blablaProfileUuid, entry.blablaTripHref)) {\n                                Toast.makeText(\n                                    context,\n                                    "Conta BlaBlaCar desta viagem não está conectada.",\n                                    Toast.LENGTH_LONG,\n                                ).show()\n                            }\n                        },\n                        modifier = Modifier.size(36.dp),\n                    ) {\n                        Icon(\n                            painter = painterResource(R.drawable.ic_blablacar_action),\n                            contentDescription = "Abrir viagem no BlaBlaCar",\n                            tint = Color.Unspecified,\n                            modifier = Modifier.size(22.dp),\n                        )\n                    }\n                }\n'''
          text = replace_once(text, per_passenger_trip_action, '\n', 'remove repeated BlaBla trip action')

          old_route = '''            Text(\n                "📍 ${passengerTimelineCompactPlace(passenger.boarding)} → 🏁 ${passengerTimelineCompactPlace(passenger.dropoff)}",\n                maxLines = 1,\n                overflow = TextOverflow.Ellipsis,\n                modifier = Modifier.fillMaxWidth(),\n            )\n'''
          new_route = '''            Row(\n                modifier = Modifier.fillMaxWidth(),\n                verticalAlignment = Alignment.CenterVertically,\n                horizontalArrangement = Arrangement.spacedBy(2.dp),\n            ) {\n                TextButton(\n                    onClick = { boardingAddressEditRow = passenger },\n                    modifier = Modifier.weight(1f),\n                    contentPadding = ADDRESS_PLACE_PADDING,\n                ) {\n                    Text(\n                        "📍 ${passengerTimelineCompactPlace(passenger.boarding)}",\n                        maxLines = 1,\n                        overflow = TextOverflow.Ellipsis,\n                    )\n                }\n                Text("→")\n                TextButton(\n                    onClick = { dropoffAddressEditRow = passenger },\n                    modifier = Modifier.weight(1f),\n                    contentPadding = ADDRESS_PLACE_PADDING,\n                ) {\n                    Text(\n                        "🏁 ${passengerTimelineCompactPlace(passenger.dropoff)}",\n                        maxLines = 1,\n                        overflow = TextOverflow.Ellipsis,\n                    )\n                }\n            }\n'''
          text = replace_once(text, old_route, new_route, 'clickable route places')

          fare_dialog_tail = '''    fareEditRow?.let { row ->\n        PassengerFareEditorDialog(\n            row = row,\n            onDismiss = { fareEditRow = null },\n            onSave = { amount, currency ->\n                if (savePassengerFare(row, amount, currency, store, passengerStore)) {\n                    copyPassengerFareValue(\n                        context,\n                        row.copy(\n                            fareMinorUnits = amount,\n                            fareCurrencyCode = currency,\n                        ),\n                    )\n                    onChanged("Valor salvo e copiado.")\n                } else {\n                    Toast.makeText(context, "Reserva sem referência estável; valor não foi salvo.", Toast.LENGTH_LONG).show()\n                }\n                fareEditRow = null\n            },\n        )\n    }\n}\n'''
          dialogs_new = '''    fareEditRow?.let { row ->\n        PassengerFareEditorDialog(\n            row = row,\n            onDismiss = { fareEditRow = null },\n            onSave = { amount, currency ->\n                if (savePassengerFare(row, amount, currency, store, passengerStore)) {\n                    copyPassengerFareValue(\n                        context,\n                        row.copy(\n                            fareMinorUnits = amount,\n                            fareCurrencyCode = currency,\n                        ),\n                    )\n                    onChanged("Valor salvo e copiado.")\n                } else {\n                    Toast.makeText(context, "Reserva sem referência estável; valor não foi salvo.", Toast.LENGTH_LONG).show()\n                }\n                fareEditRow = null\n            },\n        )\n    }\n\n    boardingAddressEditRow?.let { row ->\n        PassengerAddressEditorDialog(\n            title = "Endereço completo de embarque",\n            initialValue = passengerAddressEditorInitialValue(row.boardingAddress, row.boarding),\n            onDismiss = { boardingAddressEditRow = null },\n            onSave = { address ->\n                if (savePassengerAddress(row, address, true, store, passengerStore)) {\n                    onChanged("Endereço de embarque salvo.")\n                } else {\n                    Toast.makeText(context, "Reserva sem referência estável; endereço não foi salvo.", Toast.LENGTH_LONG).show()\n                }\n                boardingAddressEditRow = null\n            },\n        )\n    }\n\n    dropoffAddressEditRow?.let { row ->\n        PassengerAddressEditorDialog(\n            title = "Endereço completo de destino",\n            initialValue = passengerAddressEditorInitialValue(row.dropoffAddress, row.dropoff),\n            onDismiss = { dropoffAddressEditRow = null },\n            onSave = { address ->\n                if (savePassengerAddress(row, address, false, store, passengerStore)) {\n                    onChanged("Endereço de destino salvo.")\n                } else {\n                    Toast.makeText(context, "Reserva sem referência estável; endereço não foi salvo.", Toast.LENGTH_LONG).show()\n                }\n                dropoffAddressEditRow = null\n            },\n        )\n    }\n}\n'''
          text = replace_once(text, fare_dialog_tail, dialogs_new, 'address dialogs')

          marker = '''@Composable\nprivate fun PassengerFareEditorDialog(\n'''
          address_helpers = '''internal fun passengerAddressEditorInitialValue(savedAddress: String?, collectedPlace: String?): String =\n    savedAddress?.trim()?.takeIf(String::isNotEmpty)\n        ?: collectedPlace?.trim()?.takeIf(String::isNotEmpty)\n        ?: ""\n\n@Composable\nprivate fun PassengerAddressEditorDialog(\n    title: String,\n    initialValue: String,\n    onDismiss: () -> Unit,\n    onSave: (String) -> Unit,\n) {\n    var value by remember(title, initialValue) { mutableStateOf(initialValue) }\n    val normalized = value.trim()\n    AlertDialog(\n        onDismissRequest = onDismiss,\n        title = { Text(title) },\n        text = {\n            Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {\n                OutlinedTextField(\n                    value = value,\n                    onValueChange = { value = it.take(240) },\n                    label = { Text("Rua, número, bairro, cidade") },\n                    singleLine = false,\n                    modifier = Modifier.fillMaxWidth(),\n                )\n                Text(\n                    "Este endereço pertence a esta reserva/viagem. O atalho do Maps usa o endereço completo de embarque quando ele estiver salvo.",\n                    style = MaterialTheme.typography.bodySmall,\n                )\n            }\n        },\n        confirmButton = {\n            TextButton(\n                enabled = normalized.isNotBlank(),\n                onClick = { onSave(normalized) },\n            ) { Text("Salvar") }\n        },\n        dismissButton = { TextButton(onClick = onDismiss) { Text("Cancelar") } },\n    )\n}\n\n'''
          text = replace_once(text, marker, address_helpers + marker, 'insert address helper')

          save_fare_marker = '''private fun savePassengerFare(\n'''
          save_address = '''private fun savePassengerAddress(\n    row: EnhancedPassengerCardRow,\n    addressRaw: String,\n    boarding: Boolean,\n    store: TripStore,\n    passengerStore: PassengerIdentityStore,\n): Boolean {\n    val address = addressRaw.trim().takeIf(String::isNotEmpty) ?: return false\n    row.localBookingId?.let { bookingId ->\n        val booking = store.bookings().firstOrNull { it.id == bookingId } ?: return@let\n        store.saveBooking(\n            if (boarding) {\n                booking.copy(boardingAddress = address, localMetadataTouched = true)\n            } else {\n                booking.copy(dropoffAddress = address, localMetadataTouched = true)\n            },\n        )\n        return true\n    }\n    val key = row.externalReservationKey ?: return false\n    val current = passengerStore.externalMetadata(key) ?: ExternalPassengerMetadata(reservationKey = key)\n    passengerStore.saveExternalMetadata(\n        if (boarding) current.copy(boardingAddress = address) else current.copy(dropoffAddress = address),\n    )\n    return true\n}\n\n'''
          text = replace_once(text, save_fare_marker, save_address + save_fare_marker, 'save address persistence')

          old_target = '''internal fun externalTripTarget(profileUuid: String?, href: String?): ExternalTripTarget? {\n    val profile = profileUuid?.trim()?.lowercase()?.takeIf(String::isNotEmpty) ?: return null\n    if (!CANONICAL_PROFILE_UUID.matches(profile)) return null\n    val targetHref = href?.trim()?.substringBefore("&search_uuid=")?.takeIf(String::isNotEmpty) ?: return null\n    if (!targetHref.startsWith("https://www.blablacar.com.br/")) return null\n    if (!targetHref.contains("/rides/offer/") && !targetHref.contains("/trip/")) return null\n    return ExternalTripTarget(profileUuid = profile, href = targetHref)\n}\n'''
          new_target = '''internal fun externalTripTarget(profileUuid: String?, href: String?): ExternalTripTarget? {\n    val profile = profileUuid?.trim()?.lowercase()?.takeIf(String::isNotEmpty) ?: return null\n    if (!CANONICAL_PROFILE_UUID.matches(profile)) return null\n    val rawHref = href?.trim()?.takeIf(String::isNotEmpty) ?: return null\n    val uri = runCatching { java.net.URI(rawHref) }.getOrNull() ?: return null\n    if (uri.scheme != "https" || uri.host != "www.blablacar.com.br") return null\n    val path = uri.path.orEmpty().trimEnd('/')\n    val pathIdentity = Regex("^/rides/offer/(?!edit(?:/|$)|passenger(?:/|$))[^/?#]+$", RegexOption.IGNORE_CASE).matches(path) ||\n        Regex("^/trip/[^/?#]+$", RegexOption.IGNORE_CASE).matches(path)\n    val rawQuery = uri.rawQuery.orEmpty()\n    val queryId = rawQuery.split('&')\n        .firstOrNull { it.substringBefore('=') == "id" }\n        ?.substringAfter('=', "")\n        ?.trim()\n        ?.takeIf(String::isNotEmpty)\n    val queryIdentity = path in setOf("/rides/offer", "/trip") && queryId != null\n    if (!pathIdentity && !queryIdentity) return null\n    val keptQuery = rawQuery.split('&')\n        .filter(String::isNotBlank)\n        .filterNot { it.substringBefore('=') == "search_uuid" }\n        .joinToString("&")\n        .takeIf(String::isNotBlank)\n    val canonicalHref = runCatching {\n        java.net.URI(uri.scheme, uri.authority, uri.path, keptQuery, null).toString()\n    }.getOrNull() ?: return null\n    return ExternalTripTarget(profileUuid = profile, href = canonicalHref)\n}\n\ninternal fun hasExternalTripActionEvidence(entry: TripTimelineEntry): Boolean =\n    entry.sourcePassengerSeats[BookingSource.BLABLACAR]?.let { it > 0 } == true ||\n        !entry.blablaTripId.isNullOrBlank() ||\n        !entry.blablaTripHref.isNullOrBlank() ||\n        !entry.blablaProfileUuid.isNullOrBlank()\n\n@Composable\ninternal fun TripSourceLineWithBlaBlaAction(entry: TripTimelineEntry, sourceLine: String) {\n    val context = LocalContext.current\n    Row(\n        modifier = Modifier.fillMaxWidth(),\n        verticalAlignment = Alignment.CenterVertically,\n        horizontalArrangement = Arrangement.spacedBy(4.dp),\n    ) {\n        Text(\n            sourceLine,\n            style = MaterialTheme.typography.bodySmall,\n            modifier = Modifier.weight(1f),\n            maxLines = 1,\n            overflow = TextOverflow.Ellipsis,\n        )\n        if (hasExternalTripActionEvidence(entry)) {\n            IconButton(\n                onClick = {\n                    if (!openExternalTripBlaBla(context, entry.blablaProfileUuid, entry.blablaTripHref)) {\n                        Toast.makeText(\n                            context,\n                            "Link direto da viagem indisponível. Sincronize o BlaBlaCar para recuperar a referência desta publicação.",\n                            Toast.LENGTH_LONG,\n                        ).show()\n                    }\n                },\n                modifier = Modifier.size(36.dp),\n            ) {\n                Icon(\n                    painter = painterResource(R.drawable.ic_blablacar_action),\n                    contentDescription = "Abrir viagem no BlaBlaCar",\n                    tint = Color.Unspecified,\n                    modifier = Modifier.size(24.dp),\n                )\n            }\n        }\n    }\n}\n'''
          text = replace_once(text, old_target, new_target, 'strong external trip URL forms')

          text = replace_once(
              text,
              'private val COMPACT_ACTION_PADDING = PaddingValues(horizontal = 8.dp, vertical = 0.dp)\nprivate val COMPACT_NAME_PADDING = PaddingValues(horizontal = 4.dp, vertical = 0.dp)\n',
              'private val COMPACT_ACTION_PADDING = PaddingValues(horizontal = 8.dp, vertical = 0.dp)\nprivate val COMPACT_NAME_PADDING = PaddingValues(horizontal = 4.dp, vertical = 0.dp)\nprivate val ADDRESS_PLACE_PADDING = PaddingValues(horizontal = 0.dp, vertical = 0.dp)\n',
              'address padding',
          )
          passenger_path.write_text(text)

          timeline_path = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt')
          timeline = timeline_path.read_text()
          timeline = replace_once(
              timeline,
              '            if (sourceLine.isNotBlank()) Text(sourceLine, style = MaterialTheme.typography.bodySmall)\n',
              '            if (sourceLine.isNotBlank()) TripSourceLineWithBlaBlaAction(entry, sourceLine)\n',
              'single BlaBla trip action in source line',
          )
          timeline_path.write_text(timeline)

          gradle_path = Path('app/build.gradle.kts')
          gradle = gradle_path.read_text()
          gradle = replace_once(gradle, 'versionCode = 5550', 'versionCode = 5551', 'version code')
          gradle = replace_once(gradle, 'versionName = "0.1.257"', 'versionName = "0.1.258"', 'version name')
          gradle_path.write_text(gradle)

          test_path = Path('app/src/test/java/br/com/mapeiaia/rotacerta/trips/PassengerCardActions0258Test.kt')
          test_path.write_text(r'''package br.com.mapeiaia.rotacerta.trips

import kotlin.test.Test
import kotlin.test.assertEquals
import kotlin.test.assertNotNull
import kotlin.test.assertNull
import kotlin.test.assertTrue

class PassengerCardActions0258Test {
    private val uuid = "7371f028-9c55-4903-8444-308015823efd"

    @Test
    fun tripTargetAcceptsStrongQueryIdOfferAndRemovesSearchUuid() {
        val target = externalTripTarget(
            uuid,
            "https://www.blablacar.com.br/rides/offer?id=trip-123&search_uuid=volatile",
        )
        assertNotNull(target)
        assertEquals(uuid, target.profileUuid)
        assertEquals("https://www.blablacar.com.br/rides/offer?id=trip-123", target.href)
    }

    @Test
    fun tripTargetAcceptsStrongQueryIdTrip() {
        val target = externalTripTarget(uuid, "https://www.blablacar.com.br/trip?id=trip-456")
        assertNotNull(target)
        assertEquals("https://www.blablacar.com.br/trip?id=trip-456", target.href)
    }

    @Test
    fun tripTargetRejectsGenericOfferWithoutStrongIdentity() {
        assertNull(externalTripTarget(uuid, "https://www.blablacar.com.br/rides/offer"))
        assertNull(externalTripTarget(uuid, "https://www.blablacar.com.br/trip"))
    }

    @Test
    fun addressEditorPrefersSavedReservationAddress() {
        assertEquals(
            "Av. Industrial, 1000, Santo André",
            passengerAddressEditorInitialValue(" Av. Industrial, 1000, Santo André ", "Santo André"),
        )
    }

    @Test
    fun addressEditorFallsBackToCollectedPlaceWithoutInventing() {
        assertEquals("Pouso Alegre", passengerAddressEditorInitialValue("", " Pouso Alegre "))
        assertEquals("", passengerAddressEditorInitialValue(null, null))
    }

    @Test
    fun externalTripEvidenceCanKeepActionVisibleWhileHrefNeedsResync() {
        val entry = TripTimelineEntry(
            tripId = "x",
            profileId = uuid,
            profileLabel = "Conta",
            departureAtMillis = 1L,
            arrivalAtMillis = 2L,
            origin = "A",
            destination = "B",
            status = TripStatus.PUBLISHED,
            capacity = 4,
            sourcePassengerSeats = mapOf(BookingSource.BLABLACAR to 1),
        )
        assertTrue(hasExternalTripActionEvidence(entry))
    }
}
''')
          PY

      - name: Verify source edit and protected FAROL
        shell: bash
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          test "$(sha256sum "$FAROL" | awk '{print $1}')" = '2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560'
          grep -Fq 'versionCode = 5551' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.258"' app/build.gradle.kts
          grep -Fq 'PassengerAddressEditorDialog' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          grep -Fq 'TripSourceLineWithBlaBlaAction(entry, sourceLine)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          test -s app/src/test/java/br/com/mapeiaia/rotacerta/trips/PassengerCardActions0258Test.kt
          ! grep -Fq 'externalTripTarget(entry.blablaProfileUuid, entry.blablaTripHref)?.let' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt

      - name: Commit persisted app source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src app/build.gradle.kts
          git diff --cached --quiet && exit 0
          git commit -m 'Passenger address editing and single BlaBla trip action 0.1.258'
          git push origin HEAD:agent/passenger-timeline-geo-ux
