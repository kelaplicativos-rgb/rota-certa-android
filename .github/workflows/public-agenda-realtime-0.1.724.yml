name: Rota Certa 0.1.724 Public Agenda lossless realtime exact SHA

on:
  push:
    branches:
      - 'agent/public-agenda-lossless-realtime-0.1.724'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-agenda-realtime-0724-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-deploy-build-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      ROTA_CERTA_GIT_SHA: ${{ github.sha }}
      ROTA_CERTA_GIT_BRANCH: 'agent/public-agenda-lossless-realtime-0.1.724'
      BASE_SHA: 'd9ae7bffc108fd4be038b114833d6830bb643f3e'
      EXPECTED_VERSION_NAME: '0.1.724'
      EXPECTED_VERSION_CODE: '6015'
      OM_TAG: '2026.08.27-18-android'
      OM_VERSION: '2026.08.27-18'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-36"             "ndk;29.0.14206865"             "cmake;3.22.1"

      - name: Prove exact 0.1.724 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'val releaseVersionName = "0.1.724"' app/build.gradle.kts
          grep -Fq 'val releaseVersionCode = 6_015' app/build.gradle.kts
          grep -Fq '"version": "0.1.724"' app/src/main/assets/release_history.json
          grep -Fq 'PASSENGER_PASSWORD_CLEARED' trip-platform/functions/index.js
          grep -Fq 'password_clear_verification_failed' trip-platform/functions/index.js
          grep -Fq 'password_reset_session_invalidated' trip-platform/functions/index.js
          grep -Fq 'PASSENGER_PASSWORD_CLEAR_CONFIRMED_0723' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerAdminUi.kt
          grep -Fq 'response.cleared && response.verified' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerAdminUi.kt
          grep -Fq 'reloadRemote(syncDirectory = false, silentErrors = true)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerAdminUi.kt
          grep -Fq 'val verified: Boolean = false' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripRemoteApi.kt
          grep -Fq 'canonicalAgendaChangeToken0724' trip-platform/functions/index.js
          grep -Fq 'agendaReloadPending0724' trip-platform/public/public-agenda-shell-0569.js
          grep -Fq '0.1.724-lossless-realtime' trip-platform/public/index.html
          grep -Fq '"source": "/public-agenda-shell-0569.js"' trip-platform/firebase.json
          git diff --check "$BASE_SHA"...HEAD
          printf '%s\n' "$GITHUB_SHA" | tee /tmp/source-sha.txt
          printf '%s\n' "$ROTA_CERTA_GIT_BRANCH" | tee /tmp/source-branch.txt

      - name: Validate backend password integrity
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          npm --prefix trip-platform/functions install --no-audit --no-fund
          node --test             trip-platform/functions/test/passenger-password-integrity-0723.test.js             trip-platform/functions/test/passenger-password-recovery-0650.test.js             trip-platform/functions/test/passenger-password-recovery-e2e-0651.test.js             trip-platform/functions/test/viagem-certa-passenger-gate-0589.test.js             trip-platform/functions/test/viagem-certa-known-device-0626.test.js             | tee /tmp/backend-password-0724.log
          node --check trip-platform/public/public-agenda-shell-0569.js
          node --test trip-platform/functions/test/agenda-public-realtime-0724.test.js | tee /tmp/public-agenda-realtime-0724.log

      - name: Build exact Organic Maps SDK locally
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 128 --branch "$OM_TAG" https://github.com/organicmaps/organicmaps.git /tmp/organicmaps
          cd /tmp/organicmaps
          git submodule update --init --recursive --depth 1 --jobs 8
          test "$(tools/unix/version.sh android_name)" = "$OM_VERSION"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          chmod +x ./gradlew
          ./gradlew             :sdk:location:core:publishToMavenLocal             :sdk:publishToMavenLocal             :sdk:maps:world:publishToMavenLocal             -Parm64 -Pnjobs=2             --no-daemon --max-workers=2 --stacktrace             | tee /tmp/organicmaps-sdk-build.log

      - name: Verify release and focused Android regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:verifyReleaseHistory --no-daemon --stacktrace | tee /tmp/release-history.log
          ./gradlew :app:testDebugUnitTest             --tests 'br.com.mapeiaia.rotacerta.trips.PassengerPasswordIntegrity0723Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PassengerPasswordRecovery0650Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PassengerPasswordRecoveryE2e0651Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PassengerIdentityIntegrity0627Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PassengerOperationalIntegrity0714Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PassengerMessageVehicle0719Test'             --tests 'br.com.mapeiaia.rotacerta.trips.UniversalTripSearch0687Test'             --tests 'br.com.mapeiaia.rotacerta.trips.TripDetailReadiness0721Test'             --tests 'br.com.mapeiaia.rotacerta.trips.TimelineAgendaAtomicSync0632Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaPublicTimelineReflection0425Test'             --no-daemon --max-workers=2 --stacktrace             | tee /tmp/focused-android-0724.log

      - name: Compare complete Android failures with exact 0.1.723 base
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/rc-base "$BASE_SHA"
          chmod +x /tmp/rc-base/gradlew
          set +e
          (cd /tmp/rc-base && ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace) > /tmp/android-base-full.log 2>&1
          BASE_EXIT=$?
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace > /tmp/android-head-full.log 2>&1
          HEAD_EXIT=$?
          set -e
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          def failures(root):
              result=set()
              d=pathlib.Path(root)/"app/build/test-results/testDebugUnitTest"
              if not d.exists():
                  return result
              for f in d.glob("*.xml"):
                  try:
                      tree=ET.parse(f)
                  except Exception:
                      continue
                  for case in tree.getroot().iter("testcase"):
                      if case.find("failure") is not None or case.find("error") is not None:
                          result.add(f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}")
              return result
          base=failures("/tmp/rc-base")
          head=failures(".")
          new=sorted(head-base)
          fixed=sorted(base-head)
          pathlib.Path("/tmp/android-new-failures.txt").write_text("\n".join(new)+("\n" if new else ""))
          pathlib.Path("/tmp/android-fixed-failures.txt").write_text("\n".join(fixed)+("\n" if fixed else ""))
          print(f"base_failures={len(base)} head_failures={len(head)} new_failures={len(new)} fixed={len(fixed)}")
          if new:
              print("\n".join(new))
              raise SystemExit(1)
          PY
          printf 'base_exit=%s\nhead_exit=%s\n' "$BASE_EXIT" "$HEAD_EXIT" | tee /tmp/android-regression-summary.txt

      - name: Assemble exact-head APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace | tee /tmp/assemble.log
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Prove APK identity
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" | tee /tmp/zip-integrity.txt
          unzip -l "$APK" | tee /tmp/apk-files.txt
          grep -Eq 'lib/arm64-v8a/liborganicmaps\.so' /tmp/apk-files.txt
          grep -Eq 'assets/World\.mwm' /tmp/apk-files.txt
          grep -Eq 'assets/WorldCoasts\.mwm' /tmp/apk-files.txt

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt

          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -Fq "$GITHUB_SHA" /tmp/dex-strings.txt
          grep -Fq 'PASSENGER_PASSWORD_CLEAR_CONFIRMED_0723' /tmp/dex-strings.txt

          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          FINAL="rota-certa-0.1.724-6015-$SHORT_SHA.apk"
          cp "$APK" "$FINAL"
          APK_SHA256="$(sha256sum "$FINAL" | awk '{print $1}')"
          sha256sum "$FINAL" | tee /tmp/apk-sha256.txt
          echo "apk=$FINAL" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy exact-head tripApi
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          gcloud functions deploy tripApi             --gen2             --project="$PROJECT"             --region=southamerica-east1             --runtime=nodejs20             --source=trip-platform/functions             --entry-point=tripApi             --trigger-http             --allow-unauthenticated             --clear-secrets             --update-env-vars="ROTA_CERTA_BACKEND_GIT_SHA=$GITHUB_SHA"             --quiet | tee /tmp/backend-deploy-0724.log

      - name: Stage exact APK and hosting SHA proof
        id: hosted
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trip-platform/public/downloads
          cp "${{ steps.proof.outputs.apk }}" "trip-platform/public/downloads/${{ steps.proof.outputs.apk }}"
          printf '%s\n' "$GITHUB_SHA" > trip-platform/public/build-sha.txt
          test "$(sha256sum "trip-platform/public/downloads/${{ steps.proof.outputs.apk }}" | awk '{print $1}')" = "${{ steps.proof.outputs.apk_sha256 }}"
          echo "url=https://rota-certa-7ccc8.web.app/downloads/${{ steps.proof.outputs.apk }}" >> "$GITHUB_OUTPUT"

      - name: Deploy exact-head Firebase Hosting
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
          chmod 600 /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          npx --yes firebase-tools@14.12.0 deploy             --only hosting             --project "$PROJECT"             --config trip-platform/firebase.json             --non-interactive | tee /tmp/hosting-deploy-0724.log

      - name: Smoke exact live backend hosting and APK
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rota-certa-7ccc8.web.app'
          curl --retry 20 --retry-delay 3 --fail --silent --show-error "$BASE/v1/health" | tee /tmp/live-health-0724.json
          grep -Fq '"ok":true' /tmp/live-health-0724.json
          grep -Fq "\"backendGitSha\":\"$GITHUB_SHA\"" /tmp/live-health-0724.json

          curl --retry 20 --retry-delay 2 --fail --silent --show-error "$BASE/build-sha.txt" | tee /tmp/live-hosting-sha-0724.txt
          test "$(tr -d '\r\n' < /tmp/live-hosting-sha-0724.txt)" = "$GITHUB_SHA"

          curl --retry 20 --retry-delay 2 --fail --silent --show-error "$BASE/ezequiel" | tee /tmp/live-vip-0724.html
          grep -Fq 'vipForgotPassword0651' /tmp/live-vip-0724.html
          grep -Fq '/public-agenda-shell-0569.js?v=0.1.724-lossless-realtime' /tmp/live-vip-0724.html

          curl --retry 20 --retry-delay 2 --fail --silent --show-error \
            -D /tmp/live-shell-headers-0724.txt \
            "$BASE/public-agenda-shell-0569.js?v=$GITHUB_SHA" \
            -o /tmp/live-shell-0724.js
          grep -Fq 'canonical' /tmp/live-shell-0724.js || true
          grep -Fq 'agendaChangeToken0724' /tmp/live-shell-0724.js
          grep -Fq 'agendaReloadPending0724' /tmp/live-shell-0724.js
          grep -Fq 'agendaLoadPromise0724' /tmp/live-shell-0724.js
          grep -Eiq '^cache-control:.*no-cache' /tmp/live-shell-headers-0724.txt

          curl --retry 20 --retry-delay 2 --fail --silent --show-error             "${{ steps.hosted.outputs.url }}" -o /tmp/live.apk
          test "$(sha256sum /tmp/live.apk | awk '{print $1}')" = "${{ steps.proof.outputs.apk_sha256 }}"

          {
            echo "sourceSha=$GITHUB_SHA"
            echo "sourceBranch=$ROTA_CERTA_GIT_BRANCH"
            echo "package=br.com.mapeiaia.rotacerta"
            echo "versionName=$EXPECTED_VERSION_NAME"
            echo "versionCode=$EXPECTED_VERSION_CODE"
            echo "deviceTarget=Samsung SM-S911B / Android 16"
            echo "backendExactSha=PASS"
            echo "hostingExactSha=PASS"
            echo "publicAgendaLosslessInvalidation0724=PASS"
            echo "canonicalChangeToken0724=PASS"
            echo "publicShellNoCache0724=PASS"
            echo "vipPasswordIntegrityRegression=PASS"
            echo "hostedApk=${{ steps.hosted.outputs.url }}"
            echo "apkSha256=${{ steps.proof.outputs.apk_sha256 }}"
          } | tee /tmp/final-proof.txt

      - name: Upload exact-SHA APK and proof
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-public-agenda-lossless-realtime-0.1.724-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ steps.proof.outputs.apk }}
            /tmp/source-sha.txt
            /tmp/source-branch.txt
            /tmp/final-proof.txt
            /tmp/apk-sha256.txt
            /tmp/aapt.txt
            /tmp/apksigner.txt
            /tmp/zip-integrity.txt
            /tmp/apk-files.txt
            /tmp/backend-password-0724.log
            /tmp/public-agenda-realtime-0724.log
            /tmp/live-shell-0724.js
            /tmp/live-shell-headers-0724.txt
            /tmp/focused-android-0724.log
            /tmp/android-base-full.log
            /tmp/android-head-full.log
            /tmp/android-new-failures.txt
            /tmp/android-fixed-failures.txt
            /tmp/android-regression-summary.txt
            /tmp/backend-deploy-0724.log
            /tmp/hosting-deploy-0724.log
            /tmp/live-health-0724.json
            /tmp/live-hosting-sha-0724.txt
            /tmp/live-vip-0724.html
            /tmp/release-history.log
            /tmp/assemble.log
            /tmp/organicmaps-sdk-build.log
