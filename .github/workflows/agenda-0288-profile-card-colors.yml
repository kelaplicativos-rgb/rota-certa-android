name: Agenda 0.1.288 profile card colors

on:
  push:
    branches: [agent/agenda-profile-card-colors-0.1.288]
    paths:
      - '.github/workflows/agenda-0288-profile-card-colors.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agenda-0288-profile-card-colors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/agenda-profile-card-colors-0.1.288

      - name: Prove exact Agenda baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 5580' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.287"' app/build.gradle.kts
          grep -Fq 'val cardColor = when (direction)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'border = BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"

      - name: Materialize minimal profile color UX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt')
          gradle = Path('app/build.gradle.kts')
          test = Path('app/src/test/java/br/com/mapeiaia/rotacerta/trips/TripTimelineProfileColors0288Test.kt')

          text = ui.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one UI match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '''    val visibleEntries = remember(entries, trips, bookings, searchQuery) {
        filterTimelineEntries(entries, trips, bookings, searchQuery)
    }
    val formatter = remember { DateTimeFormatter.ofPattern("EEE, dd MMM yyyy • HH:mm", Locale.getDefault()) }
''',
              '''    val visibleEntries = remember(entries, trips, bookings, searchQuery) {
        filterTimelineEntries(entries, trips, bookings, searchQuery)
    }
    val registeredProfileUuids = BlaBlaDynamicAccountRegistry(context).list().mapNotNull { it.profileUuid }
    val profileColorSlots = remember(entries, registeredProfileUuids) {
        timelineProfileColorSlots(
            registeredProfileUuids = registeredProfileUuids,
            observedProfileIdentities = entries.map(::timelineProfileIdentity),
        )
    }
    val formatter = remember { DateTimeFormatter.ofPattern("EEE, dd MMM yyyy • HH:mm", Locale.getDefault()) }
''',
          )

          replace_once(
              '''            formatter = formatter,
            archived = archived,
''',
              '''            formatter = formatter,
            profileColorSlot = profileColorSlots[timelineProfileIdentity(entry)] ?: 0,
            archived = archived,
''',
          )

          replace_once(
              '''internal fun timelineOccupancyReadState(entry: TripTimelineEntry): TimelineOccupancyReadState = when {
    entry.capacity > 0 && hasExternalPublication(entry) && entry.blablaPassengerRosterComplete != true && entry.maximumOccupiedSeats <= 0 ->
        TimelineOccupancyReadState.CAPACITY_CONFIGURED_ROSTER_PENDING
    entry.capacity > 0 -> TimelineOccupancyReadState.CAPACITY_CONFIGURED
    entry.maximumOccupiedSeats > 0 -> TimelineOccupancyReadState.RESERVED
    entry.blablaPassengerRosterComplete == true -> TimelineOccupancyReadState.COMPLETE_EMPTY
    else -> TimelineOccupancyReadState.PENDING
}

@Composable
private fun TimelineEntryCard(
''',
              '''internal fun timelineOccupancyReadState(entry: TripTimelineEntry): TimelineOccupancyReadState = when {
    entry.capacity > 0 && hasExternalPublication(entry) && entry.blablaPassengerRosterComplete != true && entry.maximumOccupiedSeats <= 0 ->
        TimelineOccupancyReadState.CAPACITY_CONFIGURED_ROSTER_PENDING
    entry.capacity > 0 -> TimelineOccupancyReadState.CAPACITY_CONFIGURED
    entry.maximumOccupiedSeats > 0 -> TimelineOccupancyReadState.RESERVED
    entry.blablaPassengerRosterComplete == true -> TimelineOccupancyReadState.COMPLETE_EMPTY
    else -> TimelineOccupancyReadState.PENDING
}

internal fun timelineProfileIdentity(entry: TripTimelineEntry): String =
    entry.blablaProfileUuid?.trim()?.lowercase()?.takeIf(String::isNotEmpty)
        ?: entry.profileId.trim().lowercase().takeIf(String::isNotEmpty)
        ?: entry.profileLabel.trim().lowercase()

internal fun timelineProfileColorSlots(
    registeredProfileUuids: List<String>,
    observedProfileIdentities: List<String>,
): Map<String, Int> {
    val ordered = linkedSetOf<String>()
    registeredProfileUuids
        .map { it.trim().lowercase() }
        .filter(String::isNotEmpty)
        .forEach { ordered += it }
    observedProfileIdentities
        .map { it.trim().lowercase() }
        .filter(String::isNotEmpty)
        .forEach { ordered += it }
    return ordered.withIndex().associate { indexed -> indexed.value to indexed.index }
}

private data class TimelineProfileCardColors(
    val background: Color,
    val border: Color,
)

private fun timelineProfileCardColors(slot: Int, dark: Boolean): TimelineProfileCardColors = when (slot % 12) {
    0 -> if (dark) TimelineProfileCardColors(Color(0xFF172A46), Color(0xFF6EA0E8)) else TimelineProfileCardColors(Color(0xFFE7F0FF), Color(0xFF4F7FC7))
    1 -> if (dark) TimelineProfileCardColors(Color(0xFF183221), Color(0xFF6CAE7C)) else TimelineProfileCardColors(Color(0xFFE3F4E8), Color(0xFF4F8A62))
    2 -> if (dark) TimelineProfileCardColors(Color(0xFF2D2140), Color(0xFFA886DD)) else TimelineProfileCardColors(Color(0xFFF0E8FF), Color(0xFF7A5DB4))
    3 -> if (dark) TimelineProfileCardColors(Color(0xFF3B2A14), Color(0xFFD5A052)) else TimelineProfileCardColors(Color(0xFFFFF0D9), Color(0xFFB47728))
    4 -> if (dark) TimelineProfileCardColors(Color(0xFF3A1F2A), Color(0xFFD47E9D)) else TimelineProfileCardColors(Color(0xFFFCE7EE), Color(0xFFAD5C7A))
    5 -> if (dark) TimelineProfileCardColors(Color(0xFF163432), Color(0xFF65AAA4)) else TimelineProfileCardColors(Color(0xFFDFF4F2), Color(0xFF4B8B86))
    6 -> if (dark) TimelineProfileCardColors(Color(0xFF222640), Color(0xFF858ED6)) else TimelineProfileCardColors(Color(0xFFE8E9FF), Color(0xFF626BB5))
    7 -> if (dark) TimelineProfileCardColors(Color(0xFF2B3019), Color(0xFFA3B665)) else TimelineProfileCardColors(Color(0xFFEFF3DA), Color(0xFF7B8A44))
    8 -> if (dark) TimelineProfileCardColors(Color(0xFF15313A), Color(0xFF63A9BE)) else TimelineProfileCardColors(Color(0xFFE0F3F8), Color(0xFF4E8798))
    9 -> if (dark) TimelineProfileCardColors(Color(0xFF39251D), Color(0xFFC88E72)) else TimelineProfileCardColors(Color(0xFFF8EAE3), Color(0xFFA96D50))
    10 -> if (dark) TimelineProfileCardColors(Color(0xFF30223A), Color(0xFFB184C9)) else TimelineProfileCardColors(Color(0xFFF3E8F8), Color(0xFF8D5EA5))
    else -> if (dark) TimelineProfileCardColors(Color(0xFF29302F), Color(0xFF8FA7A3)) else TimelineProfileCardColors(Color(0xFFE9F0EF), Color(0xFF6E8984))
}

@Composable
private fun TimelineEntryCard(
''',
          )

          replace_once(
              '''    formatter: DateTimeFormatter,
    archived: Boolean,
''',
              '''    formatter: DateTimeFormatter,
    profileColorSlot: Int,
    archived: Boolean,
''',
          )

          replace_once(
              '''    val dark = isSystemInDarkTheme()
    val cardColor = when (direction) {
        TimelineDirectionState.OUTBOUND -> if (dark) Color(0xFF17351F) else Color(0xFFDDF3E3)
        TimelineDirectionState.INBOUND -> if (dark) Color(0xFF3B291F) else Color(0xFFFFE4D6)
        TimelineDirectionState.NEUTRAL,
        TimelineDirectionState.UNKNOWN,
        -> MaterialTheme.colorScheme.surface
    }

    Card(
''',
              '''    val dark = isSystemInDarkTheme()
    val profileColors = timelineProfileCardColors(profileColorSlot, dark)

    Card(
''',
          )

          replace_once(
              '''        colors = CardDefaults.cardColors(containerColor = cardColor),
        border = BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant),
''',
              '''        colors = CardDefaults.cardColors(containerColor = profileColors.background),
        border = BorderStroke(1.dp, profileColors.border),
''',
          )

          ui.write_text(text)

          gradle_text = gradle.read_text()
          old_version = '        versionCode = 5580\n        versionName = "0.1.287"'
          new_version = '        versionCode = 5581\n        versionName = "0.1.288"'
          if gradle_text.count(old_version) != 1:
              raise SystemExit('version baseline mismatch')
          gradle.write_text(gradle_text.replace(old_version, new_version, 1))

          test.write_text('''package br.com.mapeiaia.rotacerta.trips

import org.junit.Assert.assertEquals
import org.junit.Test

class TripTimelineProfileColors0288Test {
    @Test
    fun registeredProfilesKeepSequentialStableSlots() {
        val slots = timelineProfileColorSlots(
            registeredProfileUuids = listOf(" EZEQUIEL-UUID ", "BARBOSA-UUID"),
            observedProfileIdentities = listOf(
                "barbosa-uuid",
                "ezequiel-uuid",
                "terceiro-perfil",
                "ezequiel-uuid",
                "quarto-perfil",
            ),
        )

        assertEquals(0, slots["ezequiel-uuid"])
        assertEquals(1, slots["barbosa-uuid"])
        assertEquals(2, slots["terceiro-perfil"])
        assertEquals(3, slots["quarto-perfil"])
        assertEquals(4, slots.size)
    }

    @Test
    fun duplicateAndBlankIdentitiesDoNotConsumeExtraColors() {
        val slots = timelineProfileColorSlots(
            registeredProfileUuids = listOf("perfil-a", "", "PERFIL-A"),
            observedProfileIdentities = listOf("perfil-a", " perfil-b ", "", "PERFIL-B"),
        )

        assertEquals(mapOf("perfil-a" to 0, "perfil-b" to 1), slots)
    }
}
''')
          PY

          git diff --check
          grep -Fq 'val profileColors = timelineProfileCardColors(profileColorSlot, dark)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'profileColorSlot = profileColorSlots[timelineProfileIdentity(entry)] ?: 0' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'border = BorderStroke(1.dp, profileColors.border)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'versionCode = 5581' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.288"' app/build.gradle.kts

      - name: Protect FAROL and exact scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' \
            'app/build.gradle.kts' \
            'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt' \
            'app/src/test/java/br/com/mapeiaia/rotacerta/trips/TripTimelineProfileColors0288Test.kt' | sort > /tmp/expected.txt
          cmp /tmp/expected.txt /tmp/changed.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Focused regression and debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests 'br.com.mapeiaia.rotacerta.trips.TripTimelineProfileColors0288Test' :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk.sha256

      - name: Commit tested source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt \
                  app/src/test/java/br/com/mapeiaia/rotacerta/trips/TripTimelineProfileColors0288Test.kt
          git commit -m 'feat(agenda): color timeline cards by profile 0.1.288'
          git push origin HEAD:agent/agenda-profile-card-colors-0.1.288
          git rev-parse HEAD | tee /tmp/source-head.txt

      - name: Prepare APK evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agenda-0288
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/agenda-0288/rota-certa-0.1.288-debug.apk
          cp /tmp/apk.sha256 /tmp/agenda-0288/apk.sha256
          cp /tmp/source-head.txt /tmp/agenda-0288/source-head.txt
          printf '%s\n' \
            'versionName=0.1.288' \
            'versionCode=5581' \
            'ux=profile-specific soft background plus matching border' \
            'directionChipPreserved=true' \
            'profileOrder=dynamic account registry order then observed profiles' \
            'paletteSlots=12' \
            'farolUntouched=true' > /tmp/agenda-0288/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-agenda-0.1.288-profile-colors-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/agenda-0288
