name: Rota Certa ride-app learning 0.1.700 APK + assistant backend

on:
  push:
    branches:
      - 'agent/ride-app-learning-openai-0.1.700'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ride-app-learning-0700-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate-build-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      BASE_SHA: '0893bf9fb270e7d1fa6dad0959e97d30482c5e2e'
      EXPECTED_VERSION_NAME: '0.1.700'
      EXPECTED_VERSION_CODE: '5991'
      ROTA_CERTA_GIT_SHA: ${{ github.sha }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'val releaseVersionName = "0.1.700"' app/build.gradle.kts
          grep -Fq 'val releaseVersionCode = 5_991' app/build.gradle.kts
          grep -Fq '"version": "0.1.700"' app/src/main/assets/release_history.json
          grep -Fq 'RIDE_APP_LEARNING_PROFILE_STORE_0700' app/src/main/java/br/com/mapeiaia/rotacerta/RideAppLearning0700.kt
          grep -Fq 'LEARNED_RIDE_READER_0700' app/src/main/java/br/com/mapeiaia/rotacerta/RideAppLearning0700.kt
          grep -Fq 'LEARNED_PROFILE_EXECUTES_LOCALLY_0700' app/src/main/java/br/com/mapeiaia/rotacerta/RideAppLearning0700.kt
          grep -Fq 'RIDE_APK_STATIC_ANALYZER_0700' app/src/main/java/br/com/mapeiaia/rotacerta/RideApkAnalyzer0700.kt
          grep -Fq 'IMPORTED_APK_NEVER_EXECUTED_0700' app/src/main/java/br/com/mapeiaia/rotacerta/RideApkAnalyzer0700.kt
          grep -Fq 'ONLY_REDUCED_SEMANTIC_DOSSIER_SENT_0700' app/src/main/java/br/com/mapeiaia/rotacerta/RideApkAnalyzer0700.kt
          grep -Fq 'ActivityResultContracts.OpenDocument' app/src/main/java/br/com/mapeiaia/rotacerta/RideAppLearningActivity0700.kt
          grep -Fq 'Aprender aplicativo por APK / IA' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          grep -Fq 'RideAppLearningActivity0700' app/src/main/AndroidManifest.xml
          grep -Fq 'LearnedRideReader0700.apply' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -Fq '/v1/assistant/learn-ride-app' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripRemoteApi.kt
          grep -Fq 'RIDE_APP_OPENAI_LEARNING_0700' trip-platform/functions/ride-app-learning-0700.js
          grep -Fq 'DECLARATIVE_READER_PROFILE_NO_EXECUTABLE_CODE_0700' trip-platform/functions/ride-app-learning-0700.js
          grep -Fq '/v1/assistant/learn-ride-app' trip-platform/functions/index.js
          grep -Fq 'FAROL_NETWORK_FAILURE_ISOLATION_0699' app/src/main/java/br/com/mapeiaia/rotacerta/FarolNetworkFailureIsolation0699.kt
          git diff --check "$BASE_SHA"...HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate focused backend
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/functions/ride-app-learning-0700.js
          node --test             trip-platform/functions/test/ride-app-learning-0700.test.js             trip-platform/functions/test/farol-paid-address-0695.test.js             | tee /tmp/node-0700-focused.log

      - name: Compare complete backend failures with exact 0.1.699
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/rc-node-base "$BASE_SHA"
          npm --prefix trip-platform/functions install --no-audit --no-fund
          npm --prefix /tmp/rc-node-base/trip-platform/functions install --no-audit --no-fund
          set +e
          npm --prefix /tmp/rc-node-base/trip-platform/functions test > /tmp/node-base-full.log 2>&1
          BASE_EXIT=$?
          npm --prefix trip-platform/functions test > /tmp/node-head-full.log 2>&1
          HEAD_EXIT=$?
          set -e
          python3 - <<'PY'
          import pathlib, re
          pattern = re.compile(r"^not ok\s+\d+\s+-\s+(.+?)\s*$")
          def failures(path):
              out = set()
              for line in pathlib.Path(path).read_text(errors="replace").splitlines():
                  match = pattern.match(line.strip())
                  if match:
                      out.add(match.group(1))
              return out
          base = failures("/tmp/node-base-full.log")
          head = failures("/tmp/node-head-full.log")
          new = sorted(head - base)
          print(f"base_failures={len(base)} head_failures={len(head)} new_failures={len(new)}")
          if new:
              print("\n".join(new))
              raise SystemExit(1)
          PY
          printf 'base_node_exit=%s\nhead_node_exit=%s\n' "$BASE_EXIT" "$HEAD_EXIT" | tee /tmp/node-0700-regression-summary.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run focused Android tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest             --tests 'br.com.mapeiaia.rotacerta.RideAppLearning0700Test'             --tests 'br.com.mapeiaia.rotacerta.FarolNetworkFailureIsolation0699Test'             --tests 'br.com.mapeiaia.rotacerta.FarolLocalSemanticFreshness0698Test'             --tests 'br.com.mapeiaia.rotacerta.FarolCoordinateResilience0697ContractTest'             --tests 'br.com.mapeiaia.rotacerta.FarolCoordinateResolution0697Test'             --tests 'br.com.mapeiaia.rotacerta.FarolTemporalUiNoise0697Test'             --tests 'br.com.mapeiaia.rotacerta.FarolLocalDecisionAuthority0696Test'             --tests 'br.com.mapeiaia.rotacerta.FarolAddressFirst0695Test'             --tests 'br.com.mapeiaia.rotacerta.FarolPaidAiGate0695Test'             --no-daemon --max-workers=2 --stacktrace | tee /tmp/android-0700-focused.log

      - name: Compare complete Android failures with exact 0.1.699
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/rc-android-base "$BASE_SHA"
          chmod +x /tmp/rc-android-base/gradlew
          set +e
          (cd /tmp/rc-android-base && ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace) > /tmp/android-base-full.log 2>&1
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace > /tmp/android-head-full.log 2>&1
          set -e
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          def failures(root):
              out=set()
              d=pathlib.Path(root)/"app/build/test-results/testDebugUnitTest"
              if d.exists():
                  for f in d.glob("*.xml"):
                      tree=ET.parse(f)
                      for case in tree.getroot().iter("testcase"):
                          if case.find("failure") is not None or case.find("error") is not None:
                              out.add(f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}")
              return out
          base=failures("/tmp/rc-android-base")
          head=failures(".")
          new=sorted(head-base)
          print(f"base_failures={len(base)} head_failures={len(head)} new_failures={len(new)}")
          if new:
              print("\n".join(new))
              raise SystemExit(1)
          PY

      - name: Assemble exact APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace | tee /tmp/android-0700-assemble.log
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Prove APK identity
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt-0700.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt-0700.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='5991'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='0.1.700'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner-0700.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner-0700.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-0700.txt
          for marker in             "$ROTA_CERTA_GIT_SHA"             'RIDE_APP_LEARNING_PROFILE_STORE_0700'             'LEARNED_RIDE_READER_0700'             'LEARNED_PROFILE_EXECUTES_LOCALLY_0700'             'RIDE_APK_STATIC_ANALYZER_0700'             'IMPORTED_APK_NEVER_EXECUTED_0700'             'ONLY_REDUCED_SEMANTIC_DOSSIER_SENT_0700'             'FAROL_NETWORK_FAILURE_ISOLATION_0699'             'FAROL_LOCAL_SEMANTIC_FRESHNESS_0698'; do
            grep -Fq "$marker" /tmp/dex-0700.txt
          done
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          FINAL="rota-certa-0.1.700-5991-$SHORT_SHA.apk"
          cp "$APK" "$FINAL"
          echo "apk=$FINAL" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          printf 'versionName=0.1.700\nversionCode=5991\ncommit=%s\napk_sha256=%s\ndevice=Samsung SM-S911B Android 16\n' "$GITHUB_SHA" "$APK_SHA256" | tee ride-app-learning-0700-proof.txt

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy assistant API with OpenAI learning
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          gcloud secrets versions access latest --secret=OPENAI_API_KEY --project="$PROJECT" >/dev/null
          gcloud secrets versions access latest --secret=ROTA_CERTA_DRIVER_TOKEN --project="$PROJECT" >/dev/null
          gcloud functions deploy assistantApi             --gen2             --project="$PROJECT"             --region=southamerica-east1             --runtime=nodejs20             --source=trip-platform/functions             --entry-point=assistantApi             --trigger-http             --allow-unauthenticated             --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,ROTA_CERTA_DRIVER_TOKEN=ROTA_CERTA_DRIVER_TOKEN:latest             --quiet

      - name: Smoke live OpenAI ride-app learning
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          LEGACY_TOKEN="$(gcloud secrets versions access latest --secret=ROTA_CERTA_DRIVER_TOKEN --project="$PROJECT")"
          test -n "$LEGACY_TOKEN"
          SHA64="$(printf 'a%.0s' {1..64})"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error             -H "Content-Type: application/json"             -H "X-Rota-Certa-Driver-Token: $LEGACY_TOKEN"             --data "{\"packageName\":\"br.com.tkx.taxi.drivermachine\",\"versionName\":\"workflow\",\"versionCode\":1,\"apkSha256\":\"$SHA64\",\"dossier\":\"contract=RIDE_APK_STATIC_DOSSIER_0700\\npackage=br.com.tkx.taxi.drivermachine\\nentries:\\n- res/layout/aceitar_corrida.xml\\n- res/layout/corrida_taxista_detalhe.xml\\nsemantic_strings:\\n- ENDERECO_DESTINO\\n- ORIGEM\\n- DISTANCIA\\n- DISTANCIA_KM\\n- GCM_FIELD_VALOR\\n- CorridasDisponiveis\\n- aceitar corrida\"}"             "https://rota-certa-7ccc8.web.app/v1/assistant/learn-ride-app" | tee /tmp/live-ride-app-learning-0700.json
          unset LEGACY_TOKEN
          grep -Fq '"provider":"openai"' /tmp/live-ride-app-learning-0700.json
          grep -Fq '"contract":"RIDE_APP_OPENAI_LEARNING_0700"' /tmp/live-ride-app-learning-0700.json
          grep -Fq '"status":"LEARNED"' /tmp/live-ride-app-learning-0700.json

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-ride-app-learning-0.1.700-${{ github.sha }}
          path: |
            ${{ steps.proof.outputs.apk }}
            ride-app-learning-0700-proof.txt
            /tmp/node-0700-focused.log
            /tmp/node-base-full.log
            /tmp/node-head-full.log
            /tmp/node-0700-regression-summary.txt
            /tmp/android-0700-focused.log
            /tmp/android-base-full.log
            /tmp/android-head-full.log
            /tmp/android-0700-assemble.log
            /tmp/aapt-0700.txt
            /tmp/apksigner-0700.txt
            /tmp/live-ride-app-learning-0700.json
          if-no-files-found: error
          retention-days: 30
