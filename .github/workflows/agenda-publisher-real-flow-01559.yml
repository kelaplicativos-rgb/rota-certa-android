name: Verify Agenda publisher real flow 0.1.559

on:
  push:
    branches:
      - agent/agenda-publisher-real-flow-0.1.559
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-publisher-real-flow-01559-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact triggering HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Stamp release version 0.1.559
        run: |
          sed -i 's/val releaseVersionCode = 5_849/val releaseVersionCode = 5_850/' app/build.gradle.kts
          sed -i 's/val releaseVersionName = "0.1.558"/val releaseVersionName = "0.1.559"/' app/build.gradle.kts
          grep -n 'releaseVersionCode\|releaseVersionName' app/build.gradle.kts | head -2
      - name: Verify real publisher flow and executor regressions
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests 'br.com.mapeiaia.rotacerta.trips.AgendaBatchPublisherRealFlow0559Test'
          --tests 'br.com.mapeiaia.rotacerta.trips.AgendaTripScriptExecutor0558Test'
          --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalTripState0395Test'
          --tests 'br.com.mapeiaia.rotacerta.trips.TimelineLocalPrimary0525Test'
          --stacktrace --no-daemon
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-agenda-publisher-real-flow-0.1.559-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
