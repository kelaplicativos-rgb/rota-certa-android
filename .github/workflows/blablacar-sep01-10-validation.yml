name: BlaBlaCar Sep 01-10 public validation

on:
  push:
    paths:
      - '.github/workflows/blablacar-sep01-10-validation.yml'
      - 'tools/blablacar-public-search/batch-sep01-10.mjs'
  workflow_dispatch:

jobs:
  collect:
    if: github.ref == 'refs/heads/agent/blablacar-public-search-collector'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install collector package
        working-directory: tools/blablacar-public-search
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium

      - name: Run 20 exact public searches
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: node tools/blablacar-public-search/batch-sep01-10.mjs

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: blablacar-sep01-10-validation-${{ github.run_id }}
          path: collector/batch-sep01-10
          if-no-files-found: error
          retention-days: 30
