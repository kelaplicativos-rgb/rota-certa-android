name: Stage47 direct-source unified Timeline wiring

on:
  push:
    branches:
      - agent/stage47-r4-step7-automatic-identity
    paths:
      - .github/workflows/stage47-direct-source-unified-timeline-edit.yml

permissions:
  contents: write

jobs:
  wire-unified-timeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROTECTED_FAROL_SHA256: 2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage47-r4-step7-automatic-identity
          fetch-depth: 1

      - name: Edit only persisted direct-source files
        shell: bash
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          python3 - <<'PY'
          from pathlib import Path

          def find(lines, text, start=0):
              hits = [i for i in range(start, len(lines)) if lines[i].strip() == text]
              if len(hits) != 1:
                  raise SystemExit(f'{text!r}: expected one match, found {len(hits)}')
              return hits[0]

          def write(path, lines):
              Path(path).write_text('\n'.join(lines) + '\n')

          activity_path = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt')
          a = activity_path.read_text().splitlines()
          i = find(a, 'var screen by remember { mutableStateOf(if (startCreating) TripScreen.CREATE else TripScreen.LIST) }')
          a[i:i+1] = [
              '    var screen by remember {',
              '        mutableStateOf(',
              '            when {',
              '                startCreating -> TripScreen.CREATE',
              '                initialTripId != null -> TripScreen.LIST',
              '                else -> TripScreen.TIMELINE',
              '            },',
              '        )',
              '    }',
          ]
          cancel = [j for j, line in enumerate(a) if line.strip() == 'onCancel = { screen = TripScreen.LIST },']
          if len(cancel) != 2:
              raise SystemExit(f'cancel paths expected 2, found {len(cancel)}')
          for j in cancel:
              a[j] = a[j].replace('TripScreen.LIST', 'TripScreen.TIMELINE')
          created = find(a, 'message = "Viagem criada. Publique quando estiver pronta."')
          if a[created - 1].strip() != 'screen = TripScreen.LIST':
              raise SystemExit('create return marker missing')
          a[created - 1] = a[created - 1].replace('TripScreen.LIST', 'TripScreen.TIMELINE')
          cb = find(a, 'onRequestBlaBlaSync = { autoBlaBlaSyncToken++ },')
          ind = a[cb][:len(a[cb]) - len(a[cb].lstrip())]
          a[cb+1:cb+1] = [
              ind + 'onCreateTrip = { screen = TripScreen.CREATE },',
              ind + 'onPinShortcut = {',
              ind + '    val requested = TripShortcutInstaller.requestPinnedCreateShortcut(activity)',
              ind + '    message = if (requested) "Pedido de atalho enviado ao Android." else "O launcher não permite fixar atalhos automaticamente."',
              ind + '},',
              ind + 'onOpenOnlineSettings = { screen = TripScreen.SETTINGS },',
          ]
          back = find(a, 'onBack = { screen = TripScreen.LIST },')
          a[back] = a[back].replace('onBack = { screen = TripScreen.LIST }', 'onBack = { activity.finish() }')
          saved = find(a, 'store.saveOnlineSettings(it)')
          if a[saved + 1].strip() != 'screen = TripScreen.LIST':
              raise SystemExit('settings return marker missing')
          a[saved + 1] = a[saved + 1].replace('TripScreen.LIST', 'TripScreen.TIMELINE')
          new_btn = find(a, 'Button(onClick = { screen = TripScreen.CREATE }) { Text("Nova viagem") }')
          menu_start = new_btn - 1
          online_btn = find(a, 'OutlinedButton(onClick = { screen = TripScreen.SETTINGS }) { Text("Integração online") }', menu_start)
          menu_end = online_btn + 2
          if a[menu_end].strip() != 'val onlineSettings = store.onlineSettings()':
              raise SystemExit('local LIST menu boundary missing')
          a[menu_start:menu_end] = [
              '                    OutlinedButton(onClick = { screen = TripScreen.TIMELINE }) {',
              '                        Text("Voltar à Timeline")',
              '                    }',
          ]
          empty = find(a, 'Text("Nenhuma viagem cadastrada. Crie a primeira para começar.")')
          a[empty] = a[empty].replace(
              'Nenhuma viagem cadastrada. Crie a primeira para começar.',
              'Nenhuma viagem local neste aparelho. A Timeline continua exibindo publicações sincronizadas.',
          )
          write(activity_path, a)

          ui_path = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt')
          u = ui_path.read_text().splitlines()
          req = find(u, 'onRequestBlaBlaSync: () -> Unit,')
          ind = u[req][:len(u[req]) - len(u[req].lstrip())]
          u[req+1:req+1] = [
              ind + 'onCreateTrip: () -> Unit,',
              ind + 'onPinShortcut: () -> Unit,',
              ind + 'onOpenOnlineSettings: () -> Unit,',
          ]
          merged = find(u, 'val merged = remember(localEntries, collectorResponse) { BlaBlaTimelineAdapter.merge(localEntries, collectorResponse) }')
          u[merged+1:merged+1] = [
              '    val directionGeo = remember(merged, trips, appSettings) {',
              '        TripTimelineGeoResolver.resolveTrustedStops(',
              '            places = merged.flatMap { listOf(it.origin, it.destination) },',
              '            trustedStops = timelineTrustedDirectionStops(trips, appSettings),',
              '        )',
              '    }',
          ]
          actions = find(u, 'ResponsiveTripActions(listOf(')
          sync = find(u, 'ResponsiveTripAction(if (showSync) "Fechar sincronização" else "Sincronizar BlaBlaCar") { showSync = !showSync },', actions)
          u[sync:sync] = [
              '        ResponsiveTripAction("Nova viagem", onCreateTrip),',
              '        ResponsiveTripAction("Fixar atalho", onPinShortcut),',
              '        ResponsiveTripAction("Integração online", onOpenOnlineSettings),',
          ]
          radius_arg = find(u, 'homeRadiusKm = appSettings.homeRadiusKm,')
          u.insert(radius_arg + 1, '            directionGeo = directionGeo,')
          radius_param = find(u, 'homeRadiusKm: Double,')
          u.insert(radius_param + 1, '    directionGeo: Map<String, TimelineGeoPoint>,')
          base = find(u, 'val baseDirection = timelineBaseDirection(trip, homeCoordinate, homeRadiusKm)')
          if 'directionPrefix' not in u[base + 1]:
              raise SystemExit('old direction prefix missing')
          u[base:base+3] = [
              '            val baseDirection = timelineBaseDirectionLabel(entry, trip, directionGeo, homeCoordinate, homeRadiusKm)',
              '            baseDirection?.let { Text(it, style = MaterialTheme.typography.bodySmall) }',
              '            Text("${entry.origin} → ${entry.destination}", style = MaterialTheme.typography.titleMedium)',
          ]
          write(ui_path, u)

          build = Path('app/build.gradle.kts')
          text = build.read_text()
          if text.count('versionCode = 5532') != 1 or text.count('versionName = "0.1.239"') != 1:
              raise SystemExit('unexpected app version markers')
          build.write_text(text.replace('versionCode = 5532', 'versionCode = 5533').replace('versionName = "0.1.239"', 'versionName = "0.1.240"'))

          for workflow in [
              Path('.github/workflows/stage47-direct-source-physical-apk.yml'),
              Path('.github/workflows/stage47-direct-source-validation.yml'),
          ]:
              text = workflow.read_text()
              text = text.replace('0.1.239', '0.1.240').replace("'5532'", "'5533'").replace('versionCode = 5532', 'versionCode = 5533')
              target = "              --tests 'br.com.mapeiaia.rotacerta.trips.TripTimelineExternalQuickPassengerStage47Test' \\\n"
              if target not in text:
                  raise SystemExit(f'test target marker missing in {workflow}')
              text = text.replace(
                  target,
                  target + "              --tests 'br.com.mapeiaia.rotacerta.trips.TripTimelineBaseDirectionStage47Test' \\\n",
                  1,
              )
              workflow.write_text(text)

          Path('.github/workflows/stage47-direct-source-unified-timeline-edit.yml').unlink()
          PY
          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          test -z "$(git diff --name-only -- "$FAROL")"
          grep -Fq 'else -> TripScreen.TIMELINE' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'timelineBaseDirectionLabel(entry, trip, directionGeo' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'versionName = "0.1.240"' app/build.gradle.kts
          test ! -e .github/workflows/stage47-direct-source-unified-timeline-edit.yml
          git diff --check

      - name: Commit direct source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt \
            app/build.gradle.kts \
            .github/workflows/stage47-direct-source-physical-apk.yml \
            .github/workflows/stage47-direct-source-validation.yml
          git add -u -- .github/workflows/stage47-direct-source-unified-timeline-edit.yml
          ! git diff --cached --name-only | grep -F 'LiveRideAccessibilityService.kt'
          git commit -m 'Timeline: unify agenda operational view'
          git push origin HEAD:agent/stage47-r4-step7-automatic-identity
          echo "source_head=$(git rev-parse HEAD)"
          echo 'direct_source=true'
          echo 'fixed_historical_source_checkout=false'
          echo 'stage47_materializer_used=false'
