            test "$attempt" -lt 24
            sleep 3
          done
          CODE="$(curl --retry 4 --retry-delay 2 --silent --show-error -o /tmp/sync-state.json -w "%{http_code}" "$BASE/v1/driver/trips/sync-state")"
