name: Rota Certa Assistant and canonical convergence 0.1.410

on:
  push:
    branches:
      - agent/blablacar-assistant-command-registry-0.1.410
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-operational-timeline-blablacar-0400-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: agenda_operational_timeline_ci_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove source version scope and FAROL
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ github.sha }}"
          SOURCE_BRANCH="${{ github.ref_name }}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s\n' "$SOURCE_SHA" | tee source_head.txt
          printf '%s\n' "$SOURCE_BRANCH" | tee source_branch.txt
          echo "ROTA_CERTA_GIT_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_BRANCH=$SOURCE_BRANCH" >> "$GITHUB_ENV"

          BASE='07ae6bdaf4f8c191feca3b871a5e99df03312b7e'
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          sha256sum "$FAROL" | tee farol-head.sha256
          git show "$BASE:$FAROL" | sha256sum | awk '{print $1}' > farol-base.sha256
          awk '{print $1}' farol-head.sha256 > farol-current.sha256
          cmp -s farol-base.sha256 farol-current.sha256

          grep -Fq 'versionCode = 5703' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.410"' app/build.gradle.kts

          git diff --name-only "$BASE"...HEAD | tee changed-files.txt
          ! grep -Fxq "$FAROL" changed-files.txt
          grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt' changed-files.txt
          grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaAutomaticCollection0400.kt' changed-files.txt
          grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt' changed-files.txt
          grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollector.kt' changed-files.txt
          grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt' changed-files.txt
          grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaTripControl0407.kt' changed-files.txt
          grep -Fxq 'app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaTripControl0407Test.kt' changed-files.txt
          ! grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt' changed-files.txt
          grep -Fxq 'app/src/test/java/br/com/mapeiaia/rotacerta/trips/AgendaOperationalTimeline0400Test.kt' changed-files.txt

          # Timeline is now a canonical TripStore projection; the collector is input-only.
          grep -Fq 'canonicalCollectorResponse0403' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'BlaBlaTimelineAdapter.merge(emptyList(), canonicalCollectorResponseForTimeline0403)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'resolvedTripRecordOrigin(it) == TripRecordOrigin.EXTERNAL_BACKING' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          ! grep -Fq 'collectorStore.lastResponseRecoveringDynamicSessions()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          ! grep -Fq 'BlaBlaCollectorTimelineEvents0400.revision.collectAsState()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          ! grep -Fq 'TripTimelineEngine.fromLocalAgenda(trips, bookings)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'val publicResponseForTimeline: BlaBlaPublicSearchResponse? = null' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'val externalSnapshot: BlaBlaCollectorTrip?' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt
          grep -Fq 'externalSnapshotFingerprint' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt

          # Central scheduler calls the existing collector, commits per-trip canonical deltas, then drains one outbox.
          grep -Fq 'requestAutomaticCollector0400' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'reconcileCollectedExternalTrips0403' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'EXTERNAL_CANONICAL_SKIP_0403' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'EXTERNAL_CANONICAL_MISSING_PRESERVED_0403' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'recordExternalCollectionMutation' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripPublicationOutbox0387.kt
          grep -Fq 'eventSource = if (remoteProjectionDivergenceObserved) "PROJECTION_RECONCILER" else "EXTERNAL_COLLECTION"' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripPublicationOutbox0387.kt
          grep -Fq 'shouldDeduplicatePublicationEvent0410' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripPublicationOutbox0387.kt
          grep -Fq 'remoteProjectionDivergenceObserved && latest.status == TripPublicationStatus0387.DELIVERED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripPublicationOutbox0387.kt
          grep -Fq 'PUBLIC_PROJECTION_REMOTE_MISSING_RECREATED_0410' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'val reconcileAllCanonicalTrips = mode == AgendaBackgroundSyncMode0392.FULL_RECONCILE' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'reason == "periodic" -> AgendaBackgroundSyncMode0392.COLLECTOR_RECONCILE' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'BlaBlaAutomaticCollectionCoordinator0400.runPendingHeadless' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'cycle.collectorPending -> "COLLECTOR_PENDING"' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'BlaBlaDynamicSessionIntents.syncPayload' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaAutomaticCollection0400.kt
          grep -Fq 'visualHost = null' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaAutomaticCollection0400.kt
          ! grep -Fq 'startActivity(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaAutomaticCollection0400.kt
          ! grep -Fq 'FLAG_ACTIVITY_NEW_TASK' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaAutomaticCollection0400.kt
          ! grep -Fq 'WebView(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaAutomaticCollection0400.kt
          grep -Fq 'BlaBlaDynamicAccountSessionController0401' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          grep -Fq 'private val headlessDelayedHandler0405 = Handler(Looper.getMainLooper())' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          grep -Fq 'headlessDelayedHandler0405.postDelayed(guarded, delayMs)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          ! grep -Fq 'view.postDelayed(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          grep -Fq 'PUBLIC_CAPACITY_SERVER_SHAPE_REUSED_0402' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'PUBLIC_CAPACITY_REMOTE_REVISION_NO_OP_0402' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'listDriverTripSyncStates0402' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripRemoteApi.kt
          grep -Fq 'setForeground(agendaBackgroundSyncForegroundInfo0402' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'FOREGROUND_SERVICE_DATA_SYNC' app/src/main/AndroidManifest.xml
          ! grep -Fq 'BlaBlaCollectorStateStore(context).lastResponseRecoveringDynamicSessions()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'PUBLIC_AGENDA_CANONICAL_SOURCE_0406' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'reconcileCanonicalIntegrity0406' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripStore.kt
          grep -Fq 'PROJECTION_RECONCILER_0408' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'PROJECTION_CAPACITY_MISMATCH_0408' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'recordProjectionTombstone0408' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripPublicationOutbox0387.kt
          grep -Fq 'adoptedCanonicalIdentity' trip-platform/functions/index.js
          grep -Fq 'externalCollectorAllowsTombstones0406' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'canonicalStateHash' trip-platform/functions/index.js
          grep -Fq 'saveProgressSnapshot("card_complete")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          grep -Fq 'REQUIRED_STABLE_BOTTOM_PASSES' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          grep -Fq 'tenantScope.key(KEY_RESPONSE)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollector.kt

          # No manual synchronization regression.
          ! grep -Fq 'AgendaHeaderAction0396("Sincronizar agora")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          ! grep -Fq 'AgendaHeaderAction0396("Sincronizar BlaBlaCar")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          ! grep -Fq 'AgendaHeaderAction0396("Publicar agenda")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          ! grep -Fq 'AgendaHeaderAction0396("Limpar Timeline")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          ! grep -Fq 'BlaBlaAutomaticCollectionCoordinator0400.tryLaunchPending' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          ! grep -Fq 'trips_activity_resume' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt

          # tripId control surface reuses the existing headless collector and central worker.
          grep -Fq 'reverifyTripHeadless0407' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaAutomaticCollection0400.kt
          grep -Fq 'enqueueTripReverify0407' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'resolveBlaBlaTripTarget0407' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaTripControl0407.kt
          grep -Fq 'BlaBlaTripActionPalette0407' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaTripControl0407.kt
          grep -Fq 'write_not_verified_for_current_runtime' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaTripControl0407.kt
          ! grep -Fq 'SET_TRIP_BOOST(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'internal object RotaCertaCommandRegistry0410' app/src/main/java/br/com/mapeiaia/rotacerta/trips/RotaCertaCommand0410.kt
          grep -Fq 'RotaCertaAssistantPanel0410(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'path = "/v1/assistant/interpret"' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripRemoteApi.kt
          grep -Fq 'path === "/v1/assistant/interpret"' trip-platform/functions/index.js
          grep -Fq 'OPENAI_API_KEY' trip-platform/functions/index.js

      - name: Validate canonical booking, notification and sync-state contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/functions/assistant-command-interpreter-0410.js
          node --test trip-platform/functions/test/assistant-command-interpreter-0410.test.js
          node --check trip-platform/public/app.js
          node --check app/src/main/assets/blablacar/scripts/trip_detail.js
          node --check app/src/main/assets/blablacar/scripts/trip_public_share.js
          node --test trip-platform/functions/test/public-simple-reservation-0361.test.js
          node --test trip-platform/functions/test/public-blablacar-link-0409.test.js
          node --test trip-platform/functions/test/driver-trip-sync-state-0402.test.js
          node --test trip-platform/functions/test/deterministic-trip-outbox-0387.test.js
          node --test trip-platform/functions/test/public-booking-0296.test.js
          node --test trip-platform/functions/test/public-booking-realtime-0304.test.js
          node --test trip-platform/functions/test/bidirectional-notifications-0349.test.js
          node --test trip-platform/functions/test/reservation-approval-0356.test.js
          node --test trip-platform/functions/test/stage47-unified-capacity-r4-step2.test.js

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Run operational Timeline and collector regression tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalIntegrity0406Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalProjectionConvergence0408Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalCentralSync0403Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalTripState0395Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaDeterministicTripOutbox0387Test'             --tests 'br.com.mapeiaia.rotacerta.trips.TripUnifiedInventory0372Test'             --tests 'br.com.mapeiaia.rotacerta.trips.TripUnifiedOccupancyStage47R4Test'             --tests 'br.com.mapeiaia.rotacerta.trips.TripInventorySourceTruth0374Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PublicBooking0296Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PublicBookingRealtime0304Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaAutomaticSyncPhysicalFix0402Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaHeadlessCollector0401Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaOperationalTimeline0400Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaTimelineAutoSync0398Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaAutomaticSync0397Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaBackgroundSync0392Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaFixedHeaderAccountsBrowsers0399Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaCollectorModules0264Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaCollectorBoundaries0265Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaDirectCollector0261Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaDirectCollector0262Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaDirectCollector0263Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaBrowserOrchestrator0318Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaCaptureOrchestrator0368Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaDatePeriodSync0377Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaTripControl0407Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaPublicLinkCanonical0409Test'             --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Assemble APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify exact APK identity and FAROL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat source_head.txt)"
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          sha256sum "$FAROL" | tee farol-after.sha256
          cmp -s farol-head.sha256 farol-after.sha256
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk.sha256
          grep -E 'version(Code|Name) = ' app/build.gradle.kts | tee app-version.txt
          if git status --porcelain --untracked-files=no | grep -q .; then
            git status --short
            exit 1
          fi

      - name: Upload exact SHA APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.409-blablacar-public-link-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            source_head.txt
            source_branch.txt
            app-version.txt
            farol-base.sha256
            farol-current.sha256
            farol-head.sha256
            farol-after.sha256
            apk.sha256
            changed-files.txt


  deploy-backend:
    if: github.ref_name == 'agent/blablacar-public-link-canonical-0.1.409'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            exit 3
          fi
      - name: Install Functions dependencies
        run: npm --prefix trip-platform/functions install --no-audit --no-fund
      - name: Deploy exact SHA trip API
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force
          fi
      - name: Smoke live canonical sync-state route
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://rota-certa-7ccc8.web.app
          curl --retry 8 --retry-delay 3 --fail --silent --show-error "$BASE/v1/health" | grep -Fq '"ok":true'
          BUST="$(date +%s%N)"
          for attempt in $(seq 1 24); do
            curl --retry 2 --fail --silent --show-error "$BASE/app.js?v=$BUST-$attempt" -o /tmp/live-app.js || true
