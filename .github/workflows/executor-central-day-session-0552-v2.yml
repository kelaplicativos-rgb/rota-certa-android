name: Executor Central Day Session 0.1.552 v2

on:
  push:
    branches: [agent/central-day-session-0.1.552]
    paths:
      - '.github/workflows/executor-central-day-session-0552-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GOOGLE_MAPS_API_KEY: ci_dummy_key
      TARGET_BRANCH: agent/central-day-session-0.1.552
      EXPECTED_VERSION_NAME: '0.1.552'
      EXPECTED_VERSION_CODE: '5844'

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/central-day-session-0.1.552
          fetch-depth: 0

      - name: Materialize surgical integration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/executor_materialize_0552.py
          git diff --check
          grep -Fq 'CENTRAL_DAY("Central do Dia")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaHeaderNavigation0396.kt
          grep -Fq 'TripScreen.CENTRAL_DAY -> CentralDoDiaScreen0552' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'Desconectado • login necessário' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq 'BlaBlaCarSessionKeeper0552.observeNavigation' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          grep -Fq 'val releaseVersionCode = 5_844' app/build.gradle.kts
          grep -Fq 'val releaseVersionName = "0.1.552"' app/build.gradle.kts

      - name: Commit exact materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kelaplicativos-rgb'
          git config user.email 'kel.aplicativos@gmail.com'
          git add app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaHeaderNavigation0396.kt \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaAccountsBrowsersUi0399.kt \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt \
                  app/build.gradle.kts app/src/main/assets/release_history.json
          git commit -m 'feat: Central do Dia and persistent multiprofile sessions 0.1.552'
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Focused Central/session/public-link tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.CentralDoDia0552Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaCarSessionKeeper0552Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaCollectorPublicLinkProof0551Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Full inherited unit suite evidence
        id: inherited_tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Assemble final APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK identity and collect evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT='/tmp/central-day-session-0552'
          mkdir -p "$OUT"
          APK='app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          "$AAPT" dump badging "$APK" > "$OUT/aapt-badging.txt"
          PACKAGE_LINE="$(grep '^package:' "$OUT/aapt-badging.txt" | head -n1)"
          echo "$PACKAGE_LINE"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"
          FINAL_APK="$OUT/rota-certa-${EXPECTED_VERSION_NAME}-build-${EXPECTED_VERSION_CODE}-${FINAL_SHA}.apk"
          cp "$APK" "$FINAL_APK"
          sha256sum "$FINAL_APK" | tee "$OUT/apk-sha256.txt"
          printf '%s\n' \
            "versionName=$EXPECTED_VERSION_NAME" \
            "versionCode=$EXPECTED_VERSION_CODE" \
            "package=br.com.mapeiaia.rotacerta" \
            "branch=$TARGET_BRANCH" \
            "finalSha=$FINAL_SHA" \
            "focusedTests=success" \
            "inheritedUnitSuite=${{ steps.inherited_tests.outcome }}" \
            "physicalDeviceValidation=PENDING_SAMSUNG_SM_S911B_ANDROID_16" \
            > "$OUT/build-evidence.txt"

      - name: Push tested exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Upload APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.552-build-5844-central-day-session
          if-no-files-found: error
          retention-days: 14
          path: /tmp/central-day-session-0552/
