# one-shot compile validation; google-services fixture is ephemeral and non-operational
name: Version Center 0.1.550 CI validation

on:
  push:
    branches: [agent/version-center-0.1.550]
    paths:
      - '.github/workflows/version-center-0550-ci-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/version-center-0.1.550
          fetch-depth: 0

      - name: Prove source under validation
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA='222d88dfff1f86e8a5fc44ebb50aacda3d84bb19'
          git cat-file -e "$SOURCE_SHA^{commit}"
          mapfile -t delta < <(git diff --name-only "$SOURCE_SHA"..HEAD)
          if [[ ${#delta[@]} -ne 1 || "${delta[0]}" != '.github/workflows/version-center-0550-ci-validate.yml' ]]; then
            printf 'Unexpected source delta from validated integration commit:\n%s\n' "${delta[*]}" >&2
            exit 1
          fi
          grep -Fq 'br.com.mapeiaia.rotacerta.versioncenter.VersionCenterCard()' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          grep -Fq 'val releaseVersionName = "0.1.550"' app/build.gradle.kts
          grep -Fq 'val releaseVersionCode = 5_842' app/build.gradle.kts
          grep -Fq '"version": "0.1.550"' app/src/main/assets/release_history.json
          grep -Fq '"build": 5842' app/src/main/assets/release_history.json

      - name: Create ephemeral non-operational Google Services fixture
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app/google-services.json
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "rota-certa-ci-validation-only",
              "storage_bucket": "rota-certa-ci-validation-only.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "br.com.mapeiaia.rotacerta"
                  }
                },
                "oauth_client": [],
                "api_key": [],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          git status --short app/google-services.json
          git check-ignore -q app/google-services.json || {
            echo 'Ephemeral google-services.json is not ignored; refusing to continue.' >&2
            exit 1
          }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        shell: bash
        env:
          ROTA_CERTA_GIT_SHA: 222d88dfff1f86e8a5fc44ebb50aacda3d84bb19
          ROTA_CERTA_GIT_BRANCH: agent/version-center-0.1.550
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        shell: bash
        env:
          ROTA_CERTA_GIT_SHA: 222d88dfff1f86e8a5fc44ebb50aacda3d84bb19
          ROTA_CERTA_GIT_BRANCH: agent/version-center-0.1.550
        run: |
          set -euo pipefail
          ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Assemble compile-validation APK
        shell: bash
        env:
          ROTA_CERTA_GIT_SHA: 222d88dfff1f86e8a5fc44ebb50aacda3d84bb19
          ROTA_CERTA_GIT_BRANCH: agent/version-center-0.1.550
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p /tmp/version-center-0550-validation
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/version-center-0550-validation/rota-certa-0.1.550-ci-validation-only.apk
          sha256sum /tmp/version-center-0550-validation/rota-certa-0.1.550-ci-validation-only.apk > /tmp/version-center-0550-validation/apk.sha256
          cat > /tmp/version-center-0550-validation/evidence.txt <<'EOF'
          purpose=compile-validation-only
          operationalFirebaseConfig=false
          installableProductionArtifact=false
          versionName=0.1.550
          versionCode=5842
          sourceSha=222d88dfff1f86e8a5fc44ebb50aacda3d84bb19
          branch=agent/version-center-0.1.550
          semanticSource=app/src/main/assets/release_history.json
          objectiveBuildMetadata=BuildConfig->AppBuildInfo
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-version-center-0.1.550-ci-validation-only
          path: /tmp/version-center-0550-validation
          retention-days: 7
