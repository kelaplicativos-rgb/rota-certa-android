name: Stage19 specific-test diagnostic

on:
  push:
    branches:
      - agent/stage19-universal-visual-pipeline-0.1.200
    paths:
      - .github/workflows/stage19-specific-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose-stage19-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: patches
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rota-certa-stage19-materialized-stage18-source
          path: bootstrap
          github-token: ${{ github.token }}
          repository: kelaplicativos-rgb/rota-certa-android
          run-id: 31612053591
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Materialize exact Stage19 input
        run: |
          set -euo pipefail
          cd source
          rm -rf app/src/main/java app/src/test/java
          tar -xzf ../bootstrap/stage18-materialized-source.tgz
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('app/src/main/res/xml/rota_certa_accessibility.xml')
          text = path.read_text(encoding='utf-8')
          text, a = re.subn(r'android:accessibilityEventTypes="[^"]+"', 'android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewTextChanged|typeWindowsChanged|typeNotificationStateChanged"', text, count=1)
          text, b = re.subn(r'android:notificationTimeout="\d+"', 'android:notificationTimeout="100"', text, count=1)
          if a != 1 or b != 1: raise SystemExit((a,b))
          path.write_text(text, encoding='utf-8')
          PY
          python3 ../patches/scripts/apply_universal_visual_pipeline_stage19.py "$PWD"
          mkdir -p stage19-specific-diagnostic
      - name: Run Stage19 tests and capture XML
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-stage19-specific-diagnostic
        run: |
          set +e
          ./gradlew testDebugUnitTest --tests 'br.com.mapeiaia.rotacerta.FarolUniversalVisualPipelineStage19Test' --no-daemon --max-workers=1 --no-parallel --stacktrace 2>&1 | tee stage19-specific-diagnostic/stage19-specific-tests.log
          STATUS=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY' | tee stage19-specific-diagnostic/summary.txt
          import glob, xml.etree.ElementTree as ET
          tests=failures=errors=skipped=0
          for path in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              root=ET.parse(path).getroot()
              tests += int(root.attrib.get('tests',0)); failures += int(root.attrib.get('failures',0)); errors += int(root.attrib.get('errors',0)); skipped += int(root.attrib.get('skipped',0))
              for case in root.findall('.//testcase'):
                  for tag in ('failure','error'):
                      bad=case.find(tag)
                      if bad is not None:
                          print(f"FAILED={case.attrib.get('classname','')}.{case.attrib.get('name','')}")
                          print(f"MESSAGE={bad.attrib.get('message','')}")
                          if bad.text: print(bad.text[:12000])
          print(f'tests={tests}'); print(f'failures={failures}'); print(f'errors={errors}'); print(f'skipped={skipped}')
          PY
          echo "$STATUS" > stage19-specific-diagnostic/gradle-exit-status.txt
          exit "$STATUS"
      - name: Upload Stage19 specific diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage19-specific-diagnostic
          path: |
            source/stage19-specific-diagnostic/
            source/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
