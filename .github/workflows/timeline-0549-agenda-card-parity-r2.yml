name: Timeline Agenda card parity 0.1.549 r2

on:
  push:
    branches:
      - agent/timeline-agenda-card-parity-0.1.549
    paths:
      - '.github/triggers/timeline-agenda-card-parity-0549-r2.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timeline-agenda-card-parity-0549-r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: timeline_agenda_parity_0549_ci_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/timeline-agenda-card-parity-0.1.549

      - name: Prove exact 0.1.548 baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 5840' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.548"' app/build.gradle.kts
          sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt > /tmp/farol.before
          sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt > /tmp/agenda-sync.before

      - name: Materialize Agenda card parity
        shell: bash
        run: |
          set -euo pipefail
          sed -i "/'timelineProfileCardColors(profileColorSlot, dark)',/d" .github/scripts/timeline_0549_agenda_card_parity.py
          python3 .github/scripts/timeline_0549_agenda_card_parity.py
          git diff --check
          grep -Fq 'versionCode = 5841' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.549"' app/build.gradle.kts
          grep -Fq 'Vagas por trecho' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'Recolher trajeto' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'showTripActions0549 = false' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'leadingActions0549?.invoke()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          grep -Fq 'trailingActions0549?.invoke()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt

      - name: Prove surgical boundary
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt > /tmp/farol.after
          sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt > /tmp/agenda-sync.after
          cmp /tmp/farol.before /tmp/farol.after
          cmp /tmp/agenda-sync.before /tmp/agenda-sync.after
          git checkout -- .github/scripts/timeline_0549_agenda_card_parity.py
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/changed.txt
          printf '%s\n' \
            'app/build.gradle.kts' \
            'app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt' \
            'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt' \
            'app/src/test/java/br/com/mapeiaia/rotacerta/trips/TimelineAgendaCardParity0549Test.kt' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Firebase Android app for build only
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Focused contract test and debug build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.TimelineAgendaCardParity0549Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Commit tested 0.1.549 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt \
            app/src/test/java/br/com/mapeiaia/rotacerta/trips/TimelineAgendaCardParity0549Test.kt
          git commit -m 'fix(timeline): mirror Agenda card surface 0.1.549'
          git push origin HEAD:agent/timeline-agenda-card-parity-0.1.549
          FINAL_SHA="$(git rev-parse HEAD)"
          printf '%s\n' "$FINAL_SHA" | tee /tmp/source-head.txt
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_BRANCH=agent/timeline-agenda-card-parity-0.1.549" >> "$GITHUB_ENV"
          git diff --exit-code

      - name: Clean rebuild exact final SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          ./gradlew :app:clean :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='5841'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='0.1.549'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'Verified' /tmp/apksigner.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Prepare evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/timeline-agenda-card-parity-0549
          mkdir -p "$OUT"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT/rota-certa-0.1.549-debug.apk"
          cp /tmp/apk.sha256 /tmp/source-head.txt /tmp/aapt.txt /tmp/apksigner.txt "$OUT/"
          printf '%s\n' \
            'package=br.com.mapeiaia.rotacerta' \
            'versionName=0.1.549' \
            'versionCode=5841' \
            "sourceSha=$FINAL_SHA" \
            'timelineCardVisualAuthority=AGENDA_STYLE' \
            'cardDriverShortcuts=TOP_ROW' \
            'legacyDerivedDiagnosticsVisible=false' \
            'physicalApproval=PENDING_SAMSUNG_SM_S911B_ANDROID_16' > "$OUT/version.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-timeline-agenda-card-parity-0.1.549-${{ env.FINAL_SHA }}
          path: /tmp/timeline-agenda-card-parity-0549
          if-no-files-found: error
          retention-days: 14
