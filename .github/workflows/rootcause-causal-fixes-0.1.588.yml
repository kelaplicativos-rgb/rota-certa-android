name: Root-cause causal fixes 0.1.588

on:
  push:
    branches:
      - agent/rootcause-causal-fixes-0.1.588
    paths:
      - '.github/workflows/rootcause-causal-fixes-0.1.588.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/assets/release_history.json'
      - 'app/src/main/assets/blablacar/scripts/public_search_results.js'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/monitoring/OperationalHealthCenter.kt'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaAutomaticCollection0400.kt'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollector.kt'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripStore.kt'
      - 'app/src/test/java/br/com/mapeiaia/rotacerta/monitoring/OperationalHealthEngineTest.kt'
      - 'app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaCollectorMainThread0588Test.kt'
      - 'app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaExactPublicSearch0588Test.kt'
      - 'app/src/test/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300Test.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rootcause-causal-fixes-0588-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_API_KEY: rootcause_causal_fixes_0588_ci_dummy_key
      EXPECTED_VERSION_CODE: '5879'
      EXPECTED_VERSION_NAME: '0.1.588'
      BASE_SHA: 'fbec3919c518c6d0f163aa56deddaec7b30f1e30'

    steps:
      - name: Checkout exact triggering HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact source and surgical diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check "$BASE_SHA"...HEAD
          grep -Fq 'val releaseVersionCode = 5_879' app/build.gradle.kts
          grep -Fq 'val releaseVersionName = "0.1.588"' app/build.gradle.kts
          git diff --name-only "$BASE_SHA"...HEAD | sort | tee /tmp/changed.txt
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          test -s "$FAROL"
          sha256sum "$FAROL" | tee /tmp/farol-before.sha256
          if grep -Fqx "$FAROL" /tmp/changed.txt; then
            echo "Protected FAROL changed unexpectedly" >&2
            exit 1
          fi
          printf '%s\n' "$GITHUB_SHA" | tee /tmp/source-head.txt
          printf '%s\n' "$GITHUB_REF_NAME" | tee /tmp/source-branch.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate browser and backend canonical contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/blablacar/scripts/public_search_results.js
          node --check trip-platform/functions/index.js
          node --test trip-platform/functions/test/backend-canonical-authority-0468.test.js
          node --test trip-platform/functions/test/public-agenda-card-blablacar-navigation-0582.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          test -d "$SDK_ROOT/platforms/android-35"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          test -n "$BUILD_TOOLS"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run complete Android unit suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Assemble exact-head APK
        shell: bash
        run: |
          set -euo pipefail
          export ROTA_CERTA_GIT_SHA="$GITHUB_SHA"
          export ROTA_CERTA_GIT_BRANCH="$GITHUB_REF_NAME"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" > /tmp/zip-integrity.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'Verified' /tmp/apksigner.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -Fq "$GITHUB_SHA" /tmp/dex-strings.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Verify protected source and package evidence
        shell: bash
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          sha256sum "$FAROL" | tee /tmp/farol-after.sha256
          diff -u /tmp/farol-before.sha256 /tmp/farol-after.sha256
          OUT=/tmp/0588
          mkdir -p "$OUT"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          FINAL="$OUT/rota-certa-$EXPECTED_VERSION_NAME-$EXPECTED_VERSION_CODE-$SHORT_SHA.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$FINAL"
          sha256sum "$FINAL" | tee "$OUT/apk.sha256"
          cp /tmp/source-head.txt /tmp/source-branch.txt /tmp/changed.txt              /tmp/farol-before.sha256 /tmp/farol-after.sha256              /tmp/aapt.txt /tmp/apksigner.txt /tmp/zip-integrity.txt "$OUT/"
          cat > "$OUT/final-status.txt" <<EOF
          package=br.com.mapeiaia.rotacerta
          version=$EXPECTED_VERSION_NAME/$EXPECTED_VERSION_CODE
          source_head=$GITHUB_SHA
          source_branch=$GITHUB_REF_NAME
          canonical_ack_before_private_mirror=PASS_BY_TEST
          public_link_matcher_fail_closed=PASS_BY_TEST
          multiprofile_consolidation_off_main=PASS_BY_TEST
          health_incident_lifecycle=PASS_BY_TEST
          farol_untouched=PASS
          physical_approval=PENDING_SAMSUNG_SM_S911B_ANDROID_16
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.588-5879-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0588
