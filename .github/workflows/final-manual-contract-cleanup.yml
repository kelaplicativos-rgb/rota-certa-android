name: Final Manual Contract Cleanup

on:
  pull_request:
    branches:
      - codex/rota-certa-checklist-complete
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: final-manual-cleanup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Configure validation workspace
        run: |
          mkdir -p ci-cleanup/logs ci-cleanup/evidence
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp scripts/final_manual_contract_cleanup.py /tmp/final_manual_contract_cleanup.py
          cp scripts/final_cleanup_compile_fixes.py /tmp/final_cleanup_compile_fixes.py

      - name: Apply final manual-only contract
        run: |
          set -o pipefail
          python3 /tmp/final_manual_contract_cleanup.py 2>&1 | tee ci-cleanup/logs/transform.log
          python3 /tmp/final_cleanup_compile_fixes.py 2>&1 | tee ci-cleanup/logs/compile-fixes.log
          rm -f scripts/final_manual_contract_cleanup.py scripts/final_cleanup_compile_fixes.py scripts/fix-stage-script.py scripts/.stage-script.gz.b64.part0 scripts/.stage-script.gz.b64.part1
          find app/src/main/java -type f -name '*.kt' -print0 | sort -z | xargs -0 sha256sum > ci-cleanup/evidence/source-files.sha256
          grep -RInE 'com\.app99\.driver|com\.ubercab\.driver|sinet\.startup\.indriver|InDriveCoreModule|UberCoreModule|NinetyNineCoreModule|RideCardTemplate|FastRideCardMatcher|AutomaticRideCapture|requireRegisteredRideCard|monitor99|monitorUber|monitorInDrive|RealWorldRideCardMatchPolicy|FullScreenRideCapturePolicy|ManualRideCardCapturePolicy|LiveRideBubbleDecisionPolicy|BubbleCardSessionStore|BubbleStateMachine|StableLiveReadSourceGate|PrimaryVisibleRideCardSelector|RidePassengerIdentityPolicy|RegisteredCardAddressGate|RegisteredCardDecisionGate|RideScreenTextClassifier|RideOfferDetector|CardRuntimeStability|uberx|99pop' app/src/main/java > ci-cleanup/evidence/forbidden-source.txt || true
          test ! -s ci-cleanup/evidence/forbidden-source.txt
          git add -A app scripts
          git commit -m "correção final: contrato manual sem modelos e apps predefinidos"

      - name: Compile production source
        run: |
          set -o pipefail
          gradle clean :app:compileDebugKotlin --no-daemon --stacktrace --console=plain 2>&1 | tee ci-cleanup/logs/compile.log

      - name: Run unit tests twice with immutable source
        run: |
          set -euo pipefail
          before="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          gradle testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee ci-cleanup/logs/tests-first.log
          middle="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          gradle testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee ci-cleanup/logs/tests-second.log
          after="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test "$before" = "$middle"
          test "$middle" = "$after"
          printf 'SOURCE_HASH=%s\n' "$after" > ci-cleanup/evidence/source-tree-hash.txt

      - name: Run Android Lint
        run: gradle lintDebug --no-daemon --stacktrace --console=plain 2>&1 | tee ci-cleanup/logs/lint.log

      - name: Build APK twice with immutable source
        run: |
          set -euo pipefail
          before="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          gradle clean assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee ci-cleanup/logs/assemble-first.log
          middle="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          cp app/build/outputs/apk/debug/app-debug.apk ci-cleanup/evidence/rota-certa-0.1.137-first.apk
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee ci-cleanup/logs/assemble-second.log
          after="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test "$before" = "$middle"
          test "$middle" = "$after"
          cp app/build/outputs/apk/debug/app-debug.apk ci-cleanup/evidence/rota-certa-0.1.137.apk
          unzip -tq ci-cleanup/evidence/rota-certa-0.1.137.apk
          sha256sum ci-cleanup/evidence/rota-certa-0.1.137.apk > ci-cleanup/evidence/apk-sha256.txt

      - name: Verify APK contract, manifest and DEX
        run: |
          set -euo pipefail
          APK=ci-cleanup/evidence/rota-certa-0.1.137.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee ci-cleanup/evidence/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee ci-cleanup/evidence/aapt-badging.txt
          grep -q "package: name='br.com.mapeiaia.rotacerta'" ci-cleanup/evidence/aapt-badging.txt
          grep -q "versionName='0.1.137'" ci-cleanup/evidence/aapt-badging.txt
          VERSION_CODE="$(sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" ci-cleanup/evidence/aapt-badging.txt | head -1)"
          test -n "$VERSION_CODE"
          test "$VERSION_CODE" -gt 1116
          unzip -p "$APK" 'classes*.dex' | strings > ci-cleanup/evidence/dex-strings.txt
          grep -Ei 'com\.app99\.driver|com\.ubercab\.driver|sinet\.startup\.indriver|InDriveCoreModule|UberCoreModule|NinetyNineCoreModule|RideCardTemplate|FastRideCardMatcher|AutomaticRideCapture|RealWorldRideCardMatchPolicy|FullScreenRideCapturePolicy|ManualRideCardCapturePolicy|LiveRideBubbleDecisionPolicy|BubbleCardSessionStore|RegisteredCardDecisionGate' ci-cleanup/evidence/dex-strings.txt > ci-cleanup/evidence/forbidden-dex.txt || true
          test ! -s ci-cleanup/evidence/forbidden-dex.txt
          printf 'VERSION_CODE=%s\n' "$VERSION_CODE" > ci-cleanup/evidence/version.txt

      - name: Write final validation report
        run: |
          cat > ci-cleanup/evidence/final-validation.txt <<EOF
          BRANCH=$HEAD_BRANCH
          VERSION_NAME=0.1.137
          MANUAL_PACKAGE_SELECTION_ONLY=approved
          PREDEFINED_APP_LIST=removed
          APP_SPECIFIC_MODULES=removed
          VISUAL_MODEL_SYSTEM=removed
          CARD_IMAGE_CAPTURE_SYSTEM=removed
          TWO_ADDRESS_LAST_DESTINATION=approved
          SHORTCUT_GRID=preserved
          DOUBLE_TAP_ALERT=preserved
          OUTSIDE_TAP_CLOSE=preserved
          DISMISS_ALERT_UNTIL_EXIT=preserved
          ALERTS_AND_PLACES_EXPANDERS=preserved
          SOURCE_MUTATORS=removed
          COMPILE=approved
          TESTS_TWICE=approved
          LINT=approved
          APK_BUILT_TWICE=approved
          APK_SIGNATURE=approved
          DEX_FORBIDDEN_REFERENCES=none
          EOF

      - name: Push validated cleanup commit
        run: git push origin HEAD:"$HEAD_BRANCH"

      - name: Upload validated APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.137-final-manual-contract
          path: |
            ci-cleanup/evidence
            ci-cleanup/logs
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: error

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-final-cleanup-failure
          path: |
            ci-cleanup
            app/src
            app/build.gradle.kts
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
