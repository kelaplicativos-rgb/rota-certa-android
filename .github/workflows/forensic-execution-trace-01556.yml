name: Verify forensic execution trace work branch

on:
  push:
    branches:
      - agent/forensic-execution-trace-0.1.556
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forensic-execution-trace-01556-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact triggering HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify canonical and session regressions
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaCarSessionKeeper0552Test'
          --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaAuthenticatedSessionStage47Test'
          --tests 'br.com.mapeiaia.rotacerta.trips.AgendaHeadlessCollector0401Test'
          --tests 'br.com.mapeiaia.rotacerta.trips.TimelineLocalPrimary0525Test'
          --stacktrace --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-forensic-execution-trace-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
