name: Keep screen awake 0.1.688 APK

on:
  push:
    branches:
      - 'agent/keep-screen-awake-0.1.688'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-screen-awake-0688-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      ROTA_CERTA_GIT_SHA: ${{ github.sha }}
      ROTA_CERTA_GIT_BRANCH: agent/keep-screen-awake-0.1.688

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact keep-screen source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ROTA_CERTA_GIT_SHA"
          grep -Fq 'releaseVersionName = "0.1.688"' app/build.gradle.kts
          grep -Fq 'releaseVersionCode = 5_979' app/build.gradle.kts
          grep -Fq '"version": "0.1.688"' app/src/main/assets/release_history.json
          grep -Fq 'KEEP_SCREEN_AWAKE_TOGGLE_0688' app/src/main/java/br/com/mapeiaia/rotacerta/KeepScreenAwake0688.kt
          grep -Fq 'FLAG_KEEP_SCREEN_ON' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -Fq 'action_keep_screen_awake' app/src/main/java/br/com/mapeiaia/rotacerta/KeepScreenAwake0688.kt
          grep -Fq 'applyKeepScreenAwake0688Migration' app/src/main/java/br/com/mapeiaia/rotacerta/ShortcutGridCustomization0179.kt
          git diff --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run keep-screen and preserved safety regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.KeepScreenAwakeContract0688Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.UniversalTripSearch0687Test' \
            --tests 'br.com.mapeiaia.rotacerta.RadarSafetyPolicy0686Test' \
            --tests 'br.com.mapeiaia.rotacerta.FarolRouteAddressSanitizer0684Test' \
            --no-daemon --max-workers=2 --stacktrace | tee /tmp/android-0688-tests.log

      - name: Assemble exact source APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace | tee /tmp/android-0688-assemble.log
          test "$(git rev-parse HEAD)" = "$ROTA_CERTA_GIT_SHA"

      - name: Prove APK identity signing and exact final SHA
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -s "$APK"
          unzip -t "$APK" | tee /tmp/android-0688-zip-integrity.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/android-0688-aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/android-0688-aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='5979'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='0.1.688'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/android-0688-apksigner.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/android-0688-apksigner.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/android-0688-dex-strings.txt
          grep -Fq "$ROTA_CERTA_GIT_SHA" /tmp/android-0688-dex-strings.txt
          grep -Fq 'KEEP_SCREEN_AWAKE_TOGGLE_0688' /tmp/android-0688-dex-strings.txt
          grep -Fq 'action_keep_screen_awake' /tmp/android-0688-dex-strings.txt
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          FINAL="rota-certa-0.1.688-5979-$SHORT_SHA.apk"
          cp "$APK" "$FINAL"
          echo "apk=$FINAL" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "package=br.com.mapeiaia.rotacerta"
            echo "versionName=0.1.688"
            echo "versionCode=5979"
            echo "branch=agent/keep-screen-awake-0.1.688"
            echo "commit=$ROTA_CERTA_GIT_SHA"
            echo "deviceTarget=Samsung SM-S911B / Android 16"
            echo "keepScreenShortcut=ACTIVE"
            echo "shortcutId=action_keep_screen_awake"
            echo "windowFlag=FLAG_KEEP_SCREEN_ON"
            echo "globalScreenTimeoutMutation=NONE"
            echo "manualPowerButton=UNCHANGED"
            echo "statePersistence=ACTIVE"
            echo "dynamicLabel=TELA_ON_OFF"
            echo "apk=$FINAL"
            echo "apk_sha256=$APK_SHA256"
          } | tee keep-screen-awake-0688-proof.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-keep-screen-awake-0.1.688-${{ github.sha }}
          path: |
            ${{ steps.proof.outputs.apk }}
            keep-screen-awake-0688-proof.txt
            /tmp/android-0688-tests.log
            /tmp/android-0688-assemble.log
            /tmp/android-0688-aapt.txt
            /tmp/android-0688-apksigner.txt
            /tmp/android-0688-zip-integrity.txt
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30
