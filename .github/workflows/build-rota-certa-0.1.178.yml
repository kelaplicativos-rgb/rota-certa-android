name: Build Rota Certa 0.1.178

on:
  push:
    branches: [agent/radar-edit-delete-dismiss-0.1.178]
    paths:
      - .github/workflows/build-rota-certa-0.1.178.yml
      - scripts/build_rota_certa_0178.sh
      - patches/radar-edit-delete-dismiss-0178.patch.gz.b64.part00
      - patches/radar-edit-delete-dismiss-0178.patch.gz.b64.part01
      - patches/radar-edit-delete-dismiss-0178.patch.gz.b64.part02
      - patches/radar-editor-compile-fix-0178.patch
  pull_request:
    branches: [agent/fix-shortcut-module-focus-0.1.177]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: codex/unified-debug-log-0.1.139
          fetch-depth: 0
          path: source

      - name: Checkout cumulative patches
        uses: actions/checkout@v4
        with:
          ref: agent/radar-edit-delete-dismiss-0.1.178
          fetch-depth: 0
          path: patches

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test, lint and validate 0.1.178
        working-directory: source
        run: bash ../patches/scripts/build_rota_certa_0178.sh ../patches

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.178-radar-edit-delete-dismiss-validated
          path: source/artifact-0.1.178/
          retention-days: 90
          if-no-files-found: error
