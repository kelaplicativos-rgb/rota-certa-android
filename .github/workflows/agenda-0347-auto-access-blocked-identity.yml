name: Rota Certa 0.1.347 Acesso automatico e bloqueio canonico

on:
  push:
    branches:
      - agent/agenda-auto-access-blocked-identity-0.1.347
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-0347-auto-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate 0.1.347 causal scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=f7abc23f040c90d85a3d0099d7ac76f09f60a2de
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -Fq 'versionCode = 5640' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.347"' app/build.gradle.kts

          grep -Fq 'agendaAccessContact()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'blocked = it.blocked' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripRemoteApi.kt
          grep -Fq 'item.blocked ? "BLOCKED" : "AUTHORIZED"' trip-platform/functions/index.js
          grep -Fq 'cancelActiveBookingsForBlockedPassenger' trip-platform/functions/index.js
          grep -Fq 'invalidatePassengerIdentitySessions' trip-platform/functions/index.js
          grep -Fq '⛔ NÃO ACEITO NO MEU CARRO' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          grep -Fq 'Acesso automático pela base unificada' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerAdminUi.kt
          ! grep -Fq 'Aprovar e autorizar' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerAdminUi.kt
          ! grep -Fq 'Suspender acesso' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerAdminUi.kt

          CHANGED_FAROL="$(git diff --name-only "$BASE"..HEAD -- app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt 'app/src/main/java/br/com/mapeiaia/rotacerta/Farol*.kt' || true)"
          test -z "$CHANGED_FAROL"

          ALLOWED='^(.github/workflows/agenda-0347-auto-access-blocked-identity.yml|app/build.gradle.kts|app/src/main/java/br/com/mapeiaia/rotacerta/trips/(PassengerIdentityStore.kt|TripRemoteApi.kt|PublicAgendaAutoSync0300.kt|PassengerAdminUi.kt|PassengerTimelineUi.kt|TripsActivity.kt)|app/src/test/java/br/com/mapeiaia/rotacerta/trips/(PassengerAdmin0314Test.kt|PassengerPublicAccess0342Test.kt|PassengerAutoAccessBlock0347Test.kt)|trip-platform/functions/index.js|trip-platform/functions/test/(public-whatsapp-private-auth-0342.test.js|passenger-auto-access-block-0347.test.js)|trip-platform/public/app.js)$'
          UNEXPECTED="$(git diff --name-only "$BASE"..HEAD | grep -Ev "$ALLOWED" || true)"
          test -z "$UNEXPECTED"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Focused server contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/public/app.js
          node --test             trip-platform/functions/test/passenger-auto-access-block-0347.test.js             trip-platform/functions/test/public-whatsapp-private-auth-0342.test.js             trip-platform/functions/test/passenger-invites-credits-0314.test.js             trip-platform/functions/test/passenger-portal-admin-segments-0311.test.js             trip-platform/functions/test/public-search-login-0313.test.js             trip-platform/functions/test/public-booking-0296.test.js

      - name: Configure Firebase authentication for Android build
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase credential is missing."
            exit 3
          fi

      - name: Generate Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
          else
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
          fi
          APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
          test -n "$APP_ID"
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and installable APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace | tee /tmp/gradle.txt
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'certificate SHA-256 digest: d9ee577b5bb9a4c72bce115e974c9ecf1ec8c7382bcd034e88d433e01eb0e7fd' /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta'" /tmp/aapt.txt
          grep -Fq "versionCode='5640'" /tmp/aapt.txt
          grep -Fq "versionName='0.1.347'" /tmp/aapt.txt
          sha256sum "$APK" | tee /tmp/apk.sha256
          mkdir -p /tmp/0347
          cp "$APK" /tmp/0347/rota-certa-0.1.347-agenda-auto-access-blocked-identity.apk
          cp /tmp/apk.sha256 /tmp/0347/apk.sha256
          cp /tmp/aapt.txt /tmp/0347/aapt.txt
          cp /tmp/apksigner.txt /tmp/0347/apksigner.txt
          cp /tmp/gradle.txt /tmp/0347/gradle.txt
          git rev-parse HEAD > /tmp/0347/source-head.txt
          git diff --name-only f7abc23f040c90d85a3d0099d7ac76f09f60a2de..HEAD > /tmp/0347/changed-files.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.347-agenda-auto-access-blocked-identity
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0347
