name: Build Rota Certa 0.1.173

on:
  pull_request:
    branches: [agent/accessibility-resilience-and-tools-0.1.172]
    paths:
      - .github/workflows/build-rota-certa-0.1.173.yml
      - scripts/fix_deterministic_shortcut_grid_0173.patch.gz.b64
      - scripts/fix_deterministic_shortcut_grid_0173_test_contract.py
      - docs/PROJECT_STATUS.md
      - docs/DECISIONS.md
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: codex/unified-debug-log-0.1.139
          fetch-depth: 0
          path: source

      - name: Checkout cumulative patches
        uses: actions/checkout@v4
        with:
          ref: agent/deterministic-shortcut-grid-0.1.173
          fetch-depth: 0
          path: patches

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Materialize source through 0.1.171
        working-directory: source
        run: |
          set -euo pipefail
          python scripts/fix_99_overlay_state_0151.py
          python scripts/fix_selected_package_state_0152.py
          python scripts/fix_transient_launcher_clear_0154.py
          python scripts/fix_bounded_empty_read_preservation_0155.py
          python scripts/fix_passive_churn_and_launcher_race_0156.py
          python scripts/fix_subsecond_farol_0157.py
          python scripts/remove_collector_completely_0158.py
          python scripts/run_value_finance_0159.py
          python scripts/fix_value_finance_0160.py
          python scripts/fix_value_finance_0160_compile.py
          python ../patches/scripts/fix_failed_card_autocapture_0161.py .
          python ../patches/scripts/fix_failed_card_autocapture_0161_rerun.py .
          python ../patches/scripts/fix_gigu_work_mode_session_0162.py .
          python ../patches/scripts/fix_gigu_work_mode_session_0162_rerun.py .
          python ../patches/scripts/fix_farol_flight_recorder_0163.py .
          python ../patches/scripts/fix_farol_flight_recorder_0163_rerun.py .
          python ../patches/scripts/fix_diagnostic_session_summary_0164.py .
          python ../patches/scripts/fix_diagnostic_session_summary_0164_rerun.py .
          python ../patches/scripts/fix_diagnostic_attempt_timeline_0165.py .
          python ../patches/scripts/fix_diagnostic_attempt_timeline_0165_rerun.py .
          python ../patches/scripts/fix_farol_selected_apps_0166.py .
          python ../patches/scripts/fix_farol_selected_apps_0166_rerun.py .
          python ../patches/scripts/fix_farol_realtime_0167.py .
          python ../patches/scripts/fix_farol_realtime_0167_rerun.py .
          python ../patches/scripts/run_fix_farol_unified_visual_0168.py .
          python ../patches/scripts/fix_farol_unified_visual_0168_compile.py .
          python ../patches/scripts/fix_uber_notification_wakeup_0169.py .
          python ../patches/scripts/fix_notification_wakeup_crash_containment_0170.py .
          cat ../patches/scripts/fix_home_modules_long_press_0171.py.part0{0,1,2,3,4} > /tmp/fix0171.py
          python -m py_compile /tmp/fix0171.py
          python /tmp/fix0171.py .

      - name: Apply 0.1.172
        working-directory: source
        run: |
          set -euo pipefail
          cat ../patches/scripts/fix_accessibility_resilience_tools_0172.patch.gz.b64.part0{0,1,2,3,4} > /tmp/fix0172.b64
          base64 --decode /tmp/fix0172.b64 | gzip --decompress > /tmp/fix0172.patch
          echo 'c22d3884779f17f9fff7b42dd6f3450cf3c416c62f33ac219e4611d55d345ae7  /tmp/fix0172.patch' | sha256sum --check
          git apply --check /tmp/fix0172.patch
          git apply /tmp/fix0172.patch
          python ../patches/scripts/fix_accessibility_resilience_tools_0172_test_contract.py .
          grep -q 'versionName = "0.1.172"' app/build.gradle.kts
          grep -q 'versionCode = 5330' app/build.gradle.kts

      - name: Snapshot protected contracts
        working-directory: source
        run: |
          set -euo pipefail
          sha256sum \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/br/com/mapeiaia/rotacerta/DecisionEngine.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/GoogleMapsService.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/RideTextParser.kt \
            > /tmp/protected-0173.sha256

      - name: Apply restored grid 0.1.173
        working-directory: source
        run: |
          set -euo pipefail
          base64 --decode ../patches/scripts/fix_deterministic_shortcut_grid_0173.patch.gz.b64 \
            | gzip --decompress > /tmp/fix0173.patch
          echo 'acb4ddf9d31d942c9cff86f40965fe2b2910ffee6090cd8c2b804a7530317a6c  /tmp/fix0173.patch' | sha256sum --check
          git apply --check --verbose /tmp/fix0173.patch
          git apply --verbose /tmp/fix0173.patch
          python ../patches/scripts/fix_deterministic_shortcut_grid_0173_test_contract.py .
          sha256sum --check /tmp/protected-0173.sha256

      - name: Verify restored shortcut contract
        working-directory: source
        run: |
          set -euo pipefail
          test -n "${GOOGLE_MAPS_API_KEY:-}"
          grep -q 'versionName = "0.1.173"' app/build.gradle.kts || { echo FALHA_VERSION_NAME_0173; exit 1; }
          grep -q 'versionCode = 5340' app/build.gradle.kts || { echo FALHA_VERSION_CODE_0173; exit 1; }
          grep -q 'object ShortcutGridPolicy0173' app/src/main/java/br/com/mapeiaia/rotacerta/ShortcutLongPressPolicy0171.kt || { echo FALHA_POLITICA_FIXA_0173; exit 1; }
          grep -q 'ShortcutLongPressResolved0173.Secondary' app/src/main/java/br/com/mapeiaia/rotacerta/ShortcutLongPressPolicy0171.kt || { echo FALHA_SECUNDARIA_RESTAURADA_0173; exit 1; }
          grep -q 'ShortcutLongPressResolved0173.Primary' app/src/main/java/br/com/mapeiaia/rotacerta/ShortcutLongPressPolicy0171.kt || { echo FALHA_FALLBACK_PRIMARIO_0173; exit 1; }
          grep -q 'executeShortcutLongPress0173' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt || { echo FALHA_DESPACHO_FIXO_0173; exit 1; }
          grep -q 'SHORTCUT_LONG_PRESS_FIXED_0173' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt || { echo FALHA_EVENTO_FIXO_0173; exit 1; }
          grep -q 'Ações fixas na grade' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt || { echo FALHA_HOME_FIXA_0173; exit 1; }
          grep -q 'quando não existe ação secundária, repete a principal' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt || { echo FALHA_TEXTO_FALLBACK_0173; exit 1; }
          ! grep -q 'ShortcutLongPressPreferenceStore0171' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt || { echo FALHA_STORE_LEGADO_SERVICO_0173; exit 1; }
          ! grep -q 'Salvar ação do toque longo' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt || { echo FALHA_UI_PERSONALIZACAO_0173; exit 1; }
          ! grep -q 'Ação ao manter pressionado o atalho' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt || { echo FALHA_UI_ESCOLHA_0173; exit 1; }
          grep -q 'ClearApplicationCache' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutModule.kt
          grep -q 'CopyAllVisibleText' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutModule.kt
          grep -q 'OpenPrimaryQuickLink' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutModule.kt

      - name: Unit and contract tests
        working-directory: source
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Android lint
        working-directory: source
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build APK
        working-directory: source
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Validate APK
        working-directory: source
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=rota-certa-0.1.173-atalhos-grade-restaurados-validado.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee rota-certa-0.1.173-assinatura.txt
          grep -qi 'd9ee577b5bb9a4c72bce115e974c9ecf1ec8c7382bcd034e88d433e01eb0e7fd' rota-certa-0.1.173-assinatura.txt || { echo FALHA_CERTIFICADO_0173; exit 1; }
          BADGING=$($AAPT dump badging "$APK" | head -1)
          echo "$BADGING" | tee rota-certa-0.1.173-badging.txt
          echo "$BADGING" | grep -q "name='br.com.mapeiaia.rotacerta'" || { echo FALHA_PACOTE_0173; exit 1; }
          echo "$BADGING" | grep -q "versionCode='5340'" || { echo FALHA_BADGING_CODE_0173; exit 1; }
          echo "$BADGING" | grep -q "versionName='0.1.173'" || { echo FALHA_BADGING_NAME_0173; exit 1; }
          for dex in $(zipinfo -1 "$APK" | grep -E '^classes([0-9]+)?\.dex$'); do unzip -p "$APK" "$dex"; done | strings > dex-strings.txt
          grep -q 'SHORTCUT_LONG_PRESS_FIXED_0173' dex-strings.txt || { echo FALHA_DEX_EVENTO_0173; exit 1; }
          ! grep -q 'ShortcutLongPressPreferenceStore0171' dex-strings.txt || { echo FALHA_DEX_STORE_LEGADO_0173; exit 1; }
          ! grep -q 'Salvar ação do toque longo' dex-strings.txt || { echo FALHA_DEX_UI_PERSONALIZACAO_0173; exit 1; }
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee rota-certa-0.1.173-sha256.txt
          stat -c '%n %s bytes' "$OUT" | tee rota-certa-0.1.173-tamanho.txt
          printf 'Versao: 0.1.173 (5340)\nPacote: br.com.mapeiaia.rotacerta\nEscopo: grade restaurada; toque simples principal; toque longo secundário original ou fallback principal; personalização removida\nContrato da bolinha: preservado\n' > rota-certa-0.1.173-validacao.txt

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.173-restored-shortcut-grid-validated
          path: |
            source/rota-certa-0.1.173-atalhos-grade-restaurados-validado.apk
            source/rota-certa-0.1.173-sha256.txt
            source/rota-certa-0.1.173-assinatura.txt
            source/rota-certa-0.1.173-badging.txt
            source/rota-certa-0.1.173-tamanho.txt
            source/rota-certa-0.1.173-validacao.txt
          retention-days: 90
          if-no-files-found: error
