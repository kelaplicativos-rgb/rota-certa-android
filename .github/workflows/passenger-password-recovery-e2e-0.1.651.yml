name: Passenger password recovery E2E 0.1.651 APK

on:
  push:
    branches:
      - 'agent/passenger-password-recovery-e2e-0.1.651'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: passenger-recovery-e2e-0651-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-deploy-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      GOOGLE_MAPS_API_KEY: ''

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact 0.1.651 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "ROTA_CERTA_GIT_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_BRANCH=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          grep -Fq 'releaseVersionName = "0.1.651"' app/build.gradle.kts
          grep -Fq 'releaseVersionCode = 5_942' app/build.gradle.kts
          grep -Fq 'id="vipForgotPassword0651"' trip-platform/public/index.html
          grep -Fq 'id="vipForcedPasswordChange0651"' trip-platform/public/index.html
          grep -Fq '/v1/public/passenger-password-recovery/request' trip-platform/public/public-agenda-shell-0569.js
          grep -Fq 'passwordChangeRequired0651' trip-platform/functions/index.js
          grep -Fq 'passwordRecoveryStatus: "REQUESTED"' trip-platform/functions/index.js
          grep -Fq 'passwordRecoveryStatus: "ISSUED"' trip-platform/functions/index.js
          grep -Fq 'passwordRecoveryStatus: "COMPLETED"' trip-platform/functions/index.js
          grep -Fq 'password_recovery_requested' app/src/main/java/br/com/mapeiaia/rotacerta/trips/RotaCertaBookingMessagingService.kt
          grep -Fq 'ACTION_OPEN_PASSENGERS' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripAndroidEntryPoints.kt
          grep -Fq 'Gerar senha solicitada' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerAdminUi.kt
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate recovery backend and portals
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/public/public-agenda-shell-0569.js
          node --check trip-platform/public/minha-area.js
          node --test \
            trip-platform/functions/test/passenger-password-recovery-e2e-0651.test.js \
            trip-platform/functions/test/passenger-password-recovery-0650.test.js \
            trip-platform/functions/test/viagem-certa-passenger-gate-0589.test.js \
            trip-platform/functions/test/viagem-certa-known-device-0626.test.js \
            trip-platform/functions/test/passenger-invites-credits-0314.test.js \
            trip-platform/functions/test/passenger-area-auth-ux-0492.test.js \
            | tee /tmp/passenger-recovery-0651-node-tests.log

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android passenger recovery regression suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.PassengerPasswordRecoveryE2e0651Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PassengerPasswordRecovery0650Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.ManageTripInstantOpen0648Test' \
            --no-daemon --max-workers=2 --stacktrace | tee /tmp/android-0651-tests.log

      - name: Assemble exact source APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace | tee /tmp/android-0651-assemble.log
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Prove APK identity and signing
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -s "$APK"
          unzip -t "$APK" | tee /tmp/android-0651-zip-integrity.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/android-0651-aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/android-0651-aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='5942'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='0.1.651'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/android-0651-apksigner.txt
          grep -Fq 'Verified' /tmp/android-0651-apksigner.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/android-0651-dex-strings.txt
          grep -Fq "$GITHUB_SHA" /tmp/android-0651-dex-strings.txt
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          FINAL="rota-certa-0.1.651-5942-$SHORT_SHA.apk"
          cp "$APK" "$FINAL"
          echo "apk=$FINAL" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "package=br.com.mapeiaia.rotacerta"
            echo "versionName=0.1.651"
            echo "versionCode=5942"
            echo "branch=$GITHUB_REF_NAME"
            echo "commit=$GITHUB_SHA"
            echo "deviceTarget=Samsung SM-S911B / Android 16 / API 36"
            echo "forgotPasswordVip0651=PASS"
            echo "recoveryLifecycleRequestedIssuedCompleted0651=PASS"
            echo "temporarySessionRestricted0651=PASS"
            echo "mandatoryPasswordReplacement0651=PASS"
            echo "passwordRecoveryPush0651=PASS"
            echo "passengerAdminNoGlobalRefresh0650=PASS"
            echo "apk=$FINAL"
            echo "apk_sha256=$APK_SHA256"
          } | tee passenger-recovery-e2e-0651-proof.txt

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend exact SHA
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          gcloud functions deploy tripApi \
            --gen2 \
            --project="$PROJECT" \
            --region=southamerica-east1 \
            --runtime=nodejs20 \
            --source=trip-platform/functions \
            --entry-point=tripApi \
            --trigger-http \
            --allow-unauthenticated \
            --clear-secrets \
            --update-env-vars="ROTA_CERTA_BACKEND_GIT_SHA=$GITHUB_SHA" \
            --quiet

      - name: Deploy Viagem Certa Hosting exact SHA
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "$PROJECT" \
            --config trip-platform/firebase.json \
            --non-interactive

      - name: Smoke live backend and web exact SHA
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://rota-certa-7ccc8.web.app
          curl --retry 20 --retry-delay 3 --fail --silent --show-error "$BASE/v1/health" | tee /tmp/live-health-0651.json
          grep -Fq '"ok":true' /tmp/live-health-0651.json
          grep -Fq "\"backendGitSha\":\"$GITHUB_SHA\"" /tmp/live-health-0651.json
          curl --retry 10 --retry-delay 2 --fail --silent --show-error "$BASE/" | tee /tmp/live-vip-0651.html
          grep -Fq 'id="vipForgotPassword0651"' /tmp/live-vip-0651.html
          grep -Fq '0.1.651-password-recovery' /tmp/live-vip-0651.html
          curl --retry 10 --retry-delay 2 --fail --silent --show-error "$BASE/public-agenda-shell-0569.js?v=0.1.651-password-recovery" | tee /tmp/live-vip-shell-0651.js
          grep -Fq '/v1/public/passenger-password-recovery/request' /tmp/live-vip-shell-0651.js
          grep -Fq 'showForcedPasswordChange0651' /tmp/live-vip-shell-0651.js
          curl --retry 10 --retry-delay 2 --fail --silent --show-error "$BASE/minha-area.js?v=0.1.651-password-recovery" | tee /tmp/live-private-0651.js
          grep -Fq 'passwordChangeRequired0651' /tmp/live-private-0651.js

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-passenger-recovery-e2e-0.1.651-${{ github.sha }}
          path: |
            ${{ steps.proof.outputs.apk }}
            passenger-recovery-e2e-0651-proof.txt
            /tmp/passenger-recovery-0651-node-tests.log
            /tmp/android-0651-tests.log
            /tmp/android-0651-assemble.log
            /tmp/android-0651-aapt.txt
            /tmp/android-0651-apksigner.txt
            /tmp/android-0651-zip-integrity.txt
            /tmp/live-health-0651.json
            /tmp/live-vip-0651.html
            /tmp/live-vip-shell-0651.js
            /tmp/live-private-0651.js
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30
