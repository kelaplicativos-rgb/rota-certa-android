name: Diagnose 0.1.128 Generated Sources

on:
  workflow_dispatch:
  push:
    branches:
      - codex/rota-certa-0.1.128-fast-cache-screenoff
    paths:
      - 'app/**'
      - '.github/workflows/diagnose-0.1.128-generated.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Generate sources even when final patch fails
        continue-on-error: true
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -o pipefail
          gradle :app:preBuild --no-daemon --stacktrace --console=plain 2>&1 | tee generated-source.log
      - name: Upload generated matcher and service
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-0.1.128-generated-source
          path: |
            generated-source.log
            app/src/main/java/br/com/mapeiaia/rotacerta/RideCardTemplateMatcher.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/core/CoreCardMatchEngine.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          if-no-files-found: warn
