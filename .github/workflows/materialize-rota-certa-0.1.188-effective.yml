name: Materialize exact Rota Certa 0.1.188 effective source

on:
  push:
    branches: [agent/fix-farol-priority-latency-0.1.189]
    paths:
      - .github/workflows/materialize-rota-certa-0.1.188-effective.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rota-certa-0188-effective-source
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Checkout exact cumulative head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: patches

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Reproduce exact 0.1.188 source and validation
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-0188-effective
        run: |
          set -o pipefail
          bash ../patches/scripts/build_rota_certa_0188_canonical.sh ../patches 2>&1 | tee effective-0188.log

      - name: Package effective source
        run: |
          set -euo pipefail
          mkdir -p effective-0188
          cp -a source/app/src/main/java/br/com/mapeiaia/rotacerta effective-0188/main
          cp -a source/app/src/test/java/br/com/mapeiaia/rotacerta effective-0188/test
          cp -a source/app/src/main/res/xml effective-0188/xml
          cp source/app/build.gradle.kts effective-0188/build.gradle.kts
          cp source/app/src/main/AndroidManifest.xml effective-0188/AndroidManifest.xml
          cp source/effective-0188.log effective-0188/
          cp -a source/artifact-0.1.188 effective-0188/validated-artifact
          printf 'head=%s\n' '${{ github.sha }}' > effective-0188/head.txt
          find effective-0188 -type f -print0 | sort -z | xargs -0 sha256sum > effective-0188/files.sha256

      - name: Upload exact effective source
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.188-effective-source
          path: effective-0188/
          retention-days: 14
          if-no-files-found: error
