name: Apply Manual Clipboard Cleaner

on:
  workflow_dispatch:
  push:
    branches: [codex/radar-txt-approach-alert-fix]
    paths:
      - '.github/workflows/apply-manual-clipboard-cleaner.yml'

permissions:
  contents: write

jobs:
  patch:
    name: Patch manual clipboard cleaner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Kotlin patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              return text.replace(old, new, 1)

          cleaner_path = Path("app/src/main/java/br/com/mapeiaia/rotacerta/ClipboardCleaner.kt")
          cleaner_path.write_text('''package br.com.mapeiaia.rotacerta

import android.content.ClipData
import android.content.ClipboardManager
import android.content.Context
import android.os.Build

class ClipboardCleaner(private val context: Context) {
    fun clear(): Boolean = runCatching {
        val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
            clipboard.clearPrimaryClip()
        } else {
            clipboard.setPrimaryClip(ClipData.newPlainText("", ""))
        }
    }.isSuccess
}
''')

