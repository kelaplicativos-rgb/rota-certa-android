name: Stage34 bootstrap exact Stage32 runtime
on:
  push:
    branches: [agent/stage34-farol-card-lease-0.1.208]
    paths: ['.github/workflows/stage34-bootstrap-materialized-stage32.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  materialize-stage32:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42, path: source, fetch-depth: 1}
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', path: patches, fetch-depth: 1}
      - name: Restore exact Stage18 and materialize Stage30
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p bootstrap evidence
          gh run download 31612053591 --repo kelaplicativos-rgb/rota-certa-android --name rota-certa-stage19-materialized-stage18-source --dir bootstrap
          TGZ=$(find bootstrap -name stage18-materialized-source.tgz -print -quit)
          test -f "$TGZ"
          test "$(sha256sum "$TGZ"|awk '{print $1}')" = b6a81198842bdba9aa38fc6ec8643e4ec24bce4449e01ecc28f16940c4c977a7
          rm -rf source/app/src/main/java source/app/src/test/java
          tar -xzf "$TGZ" -C source
          cat > source/app/src/main/res/xml/rota_certa_accessibility.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewTextChanged|typeWindowsChanged" android:accessibilityFeedbackType="feedbackGeneric" android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows" android:canRetrieveWindowContent="true" android:canTakeScreenshot="true" android:description="@string/accessibility_service_description" android:notificationTimeout="100" />
          XML
          for x in \
            apply_universal_visual_pipeline_stage19.py \
            apply_farol_forensic_causality_stage20.py \
            apply_farol_causal_corrections_stage21.py \
            apply_farol_visual_identity_stage23.py \
            apply_farol_reading_activation_stage26_materialized.py \
            apply_farol_causal_latency_stage28_v2.py \
            apply_farol_presence_authority_stage30.py; do python patches/scripts/$x source; done
          python patches/scripts/apply_farol_semantic_ocr_blackbox_print_stage32.py source
          grep -q 'versionCode = 5491' source/app/build.gradle.kts
          grep -q 'FAROL_SEMANTIC_CARD_GENERATION_STAGE32' source/app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
      - name: Export exact materialized Stage32 source
        run: |
          set -euo pipefail
          tar -czf evidence/stage32-materialized-source.tgz -C source \
            app/src/main/java \
            app/src/test/java \
            app/src/main/AndroidManifest.xml \
            app/src/main/res/xml/rota_certa_accessibility.xml \
            app/build.gradle.kts
          sha256sum evidence/stage32-materialized-source.tgz | tee evidence/stage32-materialized-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-stage34-bootstrap-materialized-stage32-source
          path: evidence/
          retention-days: 3
