name: BlaBlaCar script workspace 0.1.487

on:
  push:
    branches:
      - agent/blablacar-script-workspace-0.1.486
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blablacar-script-workspace-0486-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GOOGLE_MAPS_API_KEY: blablacar_script_workspace_0487_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      BASE_AUTHORITY_SHA: fd9b633c183ea820ce2184f05452bba6bbb9d9d6

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove authority and protected scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --name-only "$BASE_AUTHORITY_SHA"...HEAD | tee changed-files.txt
          git diff --exit-code "$BASE_AUTHORITY_SHA"...HEAD -- app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt

          git diff --name-only "$BASE_AUTHORITY_SHA"...HEAD -- app/src/main/java > /tmp/app-main.txt
          cat > /tmp/expected-main.txt <<'EOF'
          app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaAutomaticSyncUi0397.kt
          app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaHeaderNavigation0396.kt
          app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaBrowserScriptRegistry.kt
          app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaScriptWorkspace0486.kt
          app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          EOF
          sort -u /tmp/app-main.txt -o /tmp/app-main.txt
          sort -u /tmp/expected-main.txt -o /tmp/expected-main.txt
          diff -u /tmp/expected-main.txt /tmp/app-main.txt

          grep -Fq 'SCRIPTS("Scripts")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaHeaderNavigation0396.kt
          grep -Fq 'Text("Abrir Agenda Pública"' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaHeaderNavigation0396.kt
          grep -Fq 'message = openPublicAgenda0397(activity, store)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'val url = store.onlineSettings().publicAgendaUrl' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaAutomaticSyncUi0397.kt
          grep -Fq 'BlaBlaScriptsScreen0486' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'workspace.overrideScript(request) ?: originalTemplate(request)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaBrowserScriptRegistry.kt
          grep -Fq 'dateScopeSelectedScripts0449 = scriptWorkspace0486.dateScopeEnabledRequests()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          ! grep -Fq 'BlaBlaDateScopeScriptCatalog0449.groups.forEach' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          printf '%s\n' "${{ github.sha }}" | tee source-head.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Firebase deployment authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase credential is missing."
            exit 3
          fi

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Run focused script workspace regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaScriptWorkspace0486Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaOrchestratorScriptSelection0449Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaHeaderNavigation0396Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaPublicOpenDrawer0487Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaSyncMenuRestore0424Test'             --no-daemon --max-workers=1 --no-parallel --stacktrace | tee tests.log

      - name: Assemble exact-SHA APK
        shell: bash
        run: |
          set -euo pipefail
          export ROTA_CERTA_GIT_SHA="${{ github.sha }}"
          export ROTA_CERTA_GIT_BRANCH="${{ github.ref_name }}"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace | tee assemble.log

          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee aapt.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta'" aapt.txt
          grep -Fq "versionCode='5779'" aapt.txt
          grep -Fq "versionName='0.1.487'" aapt.txt
          unzip -p "$APK" 'classes*.dex' | strings | grep -Fq "${{ github.sha }}"
          sha256sum "$APK" | tee apk.sha256

          mkdir -p evidence
          cp "$APK" evidence/rota-certa-0.1.487-blablacar-script-workspace-agenda-public.apk
          cp source-head.txt changed-files.txt tests.log assemble.log apksigner.txt aapt.txt apk.sha256 evidence/

      - name: Upload exact-SHA APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-script-workspace-0487-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: evidence/
