name: Rota Certa 0.1.731 Timeline GPS chooser exact SHA

on:
  push:
    branches:
      - 'agent/timeline-gps-chooser-0.1.731'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timeline-gps-chooser-0731-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      ROTA_CERTA_GIT_SHA: ${{ github.sha }}
      ROTA_CERTA_GIT_BRANCH: 'agent/timeline-gps-chooser-0.1.731'
      BASE_SHA: '409d4ee655380c188e5bf76d402a87a7be53c3ee'
      EXPECTED_VERSION_NAME: '0.1.731'
      EXPECTED_VERSION_CODE: '6022'
      OM_TAG: '2026.08.27-18-android'
      OM_VERSION: '2026.08.27-18'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-36"             "ndk;29.0.14206865"             "cmake;3.22.1"

      - name: Prove exact 0.1.731 source and GPS chooser contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'val releaseVersionName = "0.1.731"' app/build.gradle.kts
          grep -Fq 'val releaseVersionCode = 6_022' app/build.gradle.kts
          grep -Fq '"version": "0.1.731"' app/src/main/assets/release_history.json
          grep -Fq '"build": 6022' app/src/main/assets/release_history.json

          QUICK='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripQuickPassengerUi.kt'
          STORE='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripStore.kt'
          PASSENGER_UI='app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt'
          TRACKING='app/src/main/java/br/com/mapeiaia/rotacerta/LiveTrackingShare0668.kt'

          grep -Fq 'persistRemoteConfirmedBooking0730(confirmedCache0730)' "$QUICK"
          grep -Fq 'persistRemoteConfirmedBooking0730(cancelledCache0730)' "$QUICK"
          grep -Fq 'readYourWrite0730=true' "$QUICK"
          grep -Fq 'internal fun persistRemoteConfirmedBooking0730(' "$STORE"
          grep -Fq 'tripRevisionPreserved=true' "$STORE"
          grep -Fq 'activePassengerTrackingKeys0730' "$PASSENGER_UI"
          grep -Fq 'activePassengerKeysSnapshot0730()' "$PASSENGER_UI"
          grep -Fq 'fun activePassengerKeysSnapshot0730(' "$TRACKING"

          # 0.1.731: every Timeline boarding/dropoff shortcut must use Android's GPS chooser.
          grep -Fq 'fun openPassengerPickupShortcut0731(' "$PASSENGER_UI"
          grep -Fq 'fun openPassengerDropoffShortcut0731(' "$PASSENGER_UI"
          grep -Fq 'Intent.createChooser(navigationIntent0731, title)' "$PASSENGER_UI"
          grep -Fq 'Escolher app de navegação' "$PASSENGER_UI"
          ! grep -Fq 'setPackage("com.google.android.apps.maps")' "$PASSENGER_UI"
          ! grep -Fq 'else boardingAddressEditRow =' "$PASSENGER_UI"
          ! grep -Fq 'else dropoffAddressEditRow =' "$PASSENGER_UI"
          grep -Fq 'val selectedStop = row.boarding?.trim()?.takeIf(String::isNotEmpty)' "$PASSENGER_UI"
          grep -Fq 'val selectedStop = row.dropoff?.trim()?.takeIf(String::isNotEmpty)' "$PASSENGER_UI"

          UI='app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt'
          OPERATIONAL='app/src/main/java/br/com/mapeiaia/rotacerta/trips/OperationalAllTripsBrowserUi0563.kt'
          FLOW='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripGlobalPassengerFlow0256.kt'
          QUICK='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripQuickPassengerUi.kt'
          ACTIVITY='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt'

          # Root-cause regression: the live Viagens surface must render the shortcuts itself.
          grep -Fq 'OperationalAllTripsBrowserScreen0563(' "$ACTIVITY"
          grep -Fq 'OperationalTripBrowserCard0563(' "$OPERATIONAL"
          grep -Fq 'TIMELINE_MANUAL_PASSENGER_SHORTCUT_0728' "$OPERATIONAL"
          grep -Fq 'TIMELINE_PUBLIC_BLABLACAR_SHORTCUT_0728' "$OPERATIONAL"
          grep -Fq 'contentDescription = "Adicionar passageiro por fora"' "$OPERATIONAL"
          grep -Fq 'contentDescription = "Ver anúncio público na BlaBlaCar"' "$OPERATIONAL"
          grep -Fq 'openManualPassenger0729' "$OPERATIONAL"
          grep -Fq 'TimelineCardQuickPassengerDialog(' "$OPERATIONAL"
          grep -Fq 'canonicalBookings0494 = bookings0654' "$OPERATIONAL"

          # Public shortcut must stay bound to the canonical PUBLIC BlaBlaCar URL.
          grep -Fq 'canonicalTimelineBlaBlaPublicHref0490(entry)' "$OPERATIONAL"
          grep -Fq 'openPublicTripBlaBla(context0729, canonicalPublicHref0729)' "$OPERATIONAL"
          grep -Fq 'enabled = canonicalPublicHref0729 != null' "$OPERATIONAL"

          # The embedded passenger section keeps individual shortcuts but must not render a duplicate card bar.
          grep -Fq 'showTripActions0549 = false' "$OPERATIONAL"

          # Manual passenger remains the same canonical Booking flow, not a parallel model.
          grep -Fq 'source = BookingSource.PRIVATE' "$QUICK"
          grep -Fq 'QuickPassengerEngine.buildCanonicalBackendCommand0494' "$QUICK"
          grep -Fq 'TripRemoteApi(settings).upsertDriverBooking' "$QUICK"
          grep -Fq 'BookingRealtimeEvents0356.notifyChanged()' "$QUICK"
          grep -Fq 'timelineManualPassengerOccupancyKnown(entry)' "$FLOW"
          grep -Fq 'SeatAvailabilityEngine.availability' "$QUICK"

          # Inherit the exact 0.1.727 startup/loading guarantees.
          grep -Fq 'OperationalTimelineContentState0727' app/src/main/java/br/com/mapeiaia/rotacerta/trips/OperationalAllTripsBrowserUi0563.kt
          grep -Fq 'initialLoadComplete0727 = localTimelineLoaded0705' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt

          test -s app/src/test/java/br/com/mapeiaia/rotacerta/trips/OperationalCardShortcuts0729Test.kt
          test -s app/src/test/java/br/com/mapeiaia/rotacerta/trips/CanonicalPassengerReadYourWrite0730Test.kt
          test -s app/src/test/java/br/com/mapeiaia/rotacerta/trips/TimelineGpsChooser0731Test.kt
          git diff --check "$BASE_SHA"...HEAD
          printf '%s\n' "$GITHUB_SHA" | tee /tmp/source-sha.txt
          printf '%s\n' "$ROTA_CERTA_GIT_BRANCH" | tee /tmp/source-branch.txt

      - name: Build exact Organic Maps SDK locally
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 128 --branch "$OM_TAG" https://github.com/organicmaps/organicmaps.git /tmp/organicmaps
          cd /tmp/organicmaps
          git submodule update --init --recursive --depth 1 --jobs 8
          test "$(tools/unix/version.sh android_name)" = "$OM_VERSION"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          chmod +x ./gradlew
          ./gradlew             :sdk:location:core:publishToMavenLocal             :sdk:publishToMavenLocal             :sdk:maps:world:publishToMavenLocal             -Parm64 -Pnjobs=2             --no-daemon --max-workers=2 --stacktrace             | tee /tmp/organicmaps-sdk-build.log

      - name: Verify release history and focused shortcut regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:verifyReleaseHistory --no-daemon --stacktrace | tee /tmp/release-history.log
          ./gradlew :app:testDebugUnitTest             --tests 'br.com.mapeiaia.rotacerta.trips.TimelineGpsChooser0731Test'             --tests 'br.com.mapeiaia.rotacerta.trips.CanonicalPassengerReadYourWrite0730Test'             --tests 'br.com.mapeiaia.rotacerta.trips.OperationalCardShortcuts0729Test'             --tests 'br.com.mapeiaia.rotacerta.trips.TimelineCardShortcutGlyphs0728Test'             --tests 'br.com.mapeiaia.rotacerta.trips.TripTimelineCardActions0289Test'             --tests 'br.com.mapeiaia.rotacerta.trips.ManualPassengerCapacityGuard0295Test'             --tests 'br.com.mapeiaia.rotacerta.trips.TripQuickPassengerStage47R4Step4Test'             --tests 'br.com.mapeiaia.rotacerta.trips.OperationalTimelineLoadingState0727Test'             --tests 'br.com.mapeiaia.rotacerta.trips.TimelineAgendaAtomicSync0632Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaPublicTimelineReflection0425Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PublicProjectionVehicleHashParity0725Test'             --no-daemon --max-workers=2 --stacktrace             | tee /tmp/focused-android-0731.log

      - name: Compare complete Android failures with exact 0.1.730 base
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/rc-base "$BASE_SHA"
          chmod +x /tmp/rc-base/gradlew
          set +e
          (cd /tmp/rc-base && ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace) > /tmp/android-base-full.log 2>&1
          BASE_EXIT=$?
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace > /tmp/android-head-full.log 2>&1
          HEAD_EXIT=$?
          set -e
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          def failures(root):
              result=set()
              d=pathlib.Path(root)/"app/build/test-results/testDebugUnitTest"
              if not d.exists():
                  return result
              for f in d.glob("*.xml"):
                  try:
                      tree=ET.parse(f)
                  except Exception:
                      continue
                  for case in tree.getroot().iter("testcase"):
                      if case.find("failure") is not None or case.find("error") is not None:
                          result.add(f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}")
              return result
          base=failures("/tmp/rc-base")
          head=failures(".")
          new=sorted(head-base)
          fixed=sorted(base-head)
          pathlib.Path("/tmp/android-new-failures.txt").write_text("\n".join(new)+("\n" if new else ""))
          pathlib.Path("/tmp/android-fixed-failures.txt").write_text("\n".join(fixed)+("\n" if fixed else ""))
          print(f"base_failures={len(base)} head_failures={len(head)} new_failures={len(new)} fixed={len(fixed)}")
          if new:
              print("\n".join(new))
              raise SystemExit(1)
          PY
          printf 'base_exit=%s\nhead_exit=%s\n' "$BASE_EXIT" "$HEAD_EXIT" | tee /tmp/android-regression-summary.txt

      - name: Assemble exact-head APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace | tee /tmp/assemble.log
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Prove APK identity
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" | tee /tmp/zip-integrity.txt
          unzip -l "$APK" | tee /tmp/apk-files.txt
          grep -Eq 'lib/arm64-v8a/liborganicmaps\.so' /tmp/apk-files.txt
          grep -Eq 'assets/World\.mwm' /tmp/apk-files.txt
          grep -Eq 'assets/WorldCoasts\.mwm' /tmp/apk-files.txt

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt

          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -Fq "$GITHUB_SHA" /tmp/dex-strings.txt

          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          FINAL="rota-certa-0.1.731-6022-timeline-gps-chooser-$SHORT_SHA.apk"
          cp "$APK" "$FINAL"
          APK_SHA256="$(sha256sum "$FINAL" | awk '{print $1}')"
          sha256sum "$FINAL" | tee /tmp/apk-sha256.txt
          echo "apk=$FINAL" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

          {
            echo "sourceSha=$GITHUB_SHA"
            echo "sourceBranch=$ROTA_CERTA_GIT_BRANCH"
            echo "baseSha=$BASE_SHA"
            echo "package=br.com.mapeiaia.rotacerta"
            echo "versionName=$EXPECTED_VERSION_NAME"
            echo "versionCode=$EXPECTED_VERSION_CODE"
            echo "deviceTarget=Samsung SM-S911B / Android 16"
            echo "timelineGpsChooser0731=PASS"
            echo "manualPassengerStopNavigation0731=PASS"
            echo "noForcedGoogleMaps0731=PASS"
            echo "manualPassengerSegmentCapacityGuard0295=PASS"
            echo "timelineLoadingState0727=PASS"
            echo "fullRegressionDelta=ZERO_NEW_FAILURES"
            echo "apkSha256=$APK_SHA256"
          } | tee /tmp/final-proof.txt

      - name: Upload exact-SHA APK and proof
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-timeline-gps-chooser-0731-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ steps.proof.outputs.apk }}
            /tmp/source-sha.txt
            /tmp/source-branch.txt
            /tmp/final-proof.txt
            /tmp/apk-sha256.txt
            /tmp/aapt.txt
            /tmp/apksigner.txt
            /tmp/zip-integrity.txt
            /tmp/apk-files.txt
            /tmp/focused-android-0731.log
            /tmp/android-base-full.log
            /tmp/android-head-full.log
            /tmp/android-new-failures.txt
            /tmp/android-fixed-failures.txt
            /tmp/android-regression-summary.txt
            /tmp/release-history.log
            /tmp/assemble.log
            /tmp/organicmaps-sdk-build.log

      - name: Publish direct-install APK and link
        id: direct_apk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_FILE: ${{ steps.proof.outputs.apk }}
          APK_SHA256: ${{ steps.proof.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          test -s "$APK_FILE"

          DISTRIBUTION_TAG="latest"
          APK_NAME="$(basename "$APK_FILE")"

          # Reuse the repository's existing permanent distribution release.
          # Do not replace rota-certa-latest.apk here; add only this exact-SHA APK.
          gh release view "$DISTRIBUTION_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$DISTRIBUTION_TAG" "$APK_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release view "$DISTRIBUTION_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' \
            | grep -Fx "$APK_NAME"

          DIRECT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${DISTRIBUTION_TAG}/${APK_NAME}"
          echo "url=$DIRECT_URL" >> "$GITHUB_OUTPUT"
          echo "tag=$DISTRIBUTION_TAG" >> "$GITHUB_OUTPUT"

          {
            echo "## 📱 APK pronto para instalar"
            echo
            echo "[**Baixar somente o APK — Rota Certa ${EXPECTED_VERSION_NAME}**](${DIRECT_URL})"
            echo
            echo "Download direto do APK, sem o pacote de diagnóstico do artifact."
            echo
            echo "- VersionName: \`${EXPECTED_VERSION_NAME}\`"
            echo "- VersionCode: \`${EXPECTED_VERSION_CODE}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- SHA-256: \`${APK_SHA256}\`"
            echo "- Arquivo: \`${APK_NAME}\`"
            echo
            echo "O artifact completo continua disponível separadamente para diagnóstico e auditoria."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK-only install artifact
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-${{ env.EXPECTED_VERSION_NAME }}-APK-INSTALAR-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ steps.proof.outputs.apk }}
