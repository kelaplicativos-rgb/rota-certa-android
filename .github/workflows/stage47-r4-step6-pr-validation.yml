name: Stage47 R4 Step6 PR validation

on:
  pull_request:
    branches:
      - agent/stage47-r4-unified-occupancy-step5

permissions:
  contents: read
  actions: read

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          path: source
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: patches
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: aa4bd10847d41a3abd5d8a9cb186d6cfa8acc88c
          path: historical19
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: a4443bb6c287fcf31a56f2a3c4ba8fc211fe1f79
          path: historical34
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Step6 validation
        run: bash patches/scripts/run_stage47_r4_step6_validation.sh source patches historical19 historical34 evidence
      - name: Deployment readiness
        if: always()
        run: |
          if [[ -n "${{ secrets.GCP_PROJECT_ID }}" && -n "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" ]]; then
            echo 'collector_deploy_credentials=present' | tee evidence/collector-deploy-status.txt
          else
            echo 'collector_deploy_credentials=missing live_deploy=BLOCKED' | tee evidence/collector-deploy-status.txt
          fi
      - name: Upload APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-stage47-r4-step6-0.1.231
          path: evidence/
          if-no-files-found: error
          retention-days: 30
