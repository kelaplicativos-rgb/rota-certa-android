          grep -Fq 'globalHtmlAtomicCommitEligible0609' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          grep -Fq 'htmlCanonicalResponseStatusAccepted0611' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          grep -Fq 'status.lowercase() in setOf("validated", "complete")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          ! grep -Fq 'response.status != "complete"' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          grep -Fq 'validatedStatusWithCompleteHtmlCoverageIsCommitEligible0611' app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605Test.kt
          grep -Fq 'existing?.deleted == true && incomingComplete' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'snapshotHtmlRollback0612' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripStore.kt
          grep -Fq 'snapshotHtmlRollback0612' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripPublicationOutbox0387.kt
          grep -Fq 'BLABLACAR_GLOBAL_HTML_ROLLBACK_0612' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          grep -Fq 'BLABLACAR_GLOBAL_HTML_CANONICAL_IDENTITY_FAILED_0612' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          grep -Fq 'passengerSegmentsResolved' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          grep -Fq 'RELATIVE_YESTERDAY' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaRidesExternalTimeline0535.kt
          grep -Fq 'indexPayload.tripIds.isEmpty() && indexPayload.tripLinks.isEmpty()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaRidesForensicEvidence0528.kt
          ! grep -Fq 'indexPayload.tripLinks.isEmpty() ||' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaRidesForensicEvidence0528.kt
          grep -Fq 'currentRideRemainsCapturableThroughArrivalPlusOneHour0612' app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605Test.kt
          grep -Fq 'relativeRideDatesResolveFromCaptureDate0612' app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaRidesExternalTimeline0535Test.kt
          grep -Fq 'cityOnlyPassengerLabelsResolveAgainstUniqueHtmlStopAddresses0612' app/src/test/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300Test.kt
          grep -Fq 'nonEmptyInventoryRequiresExplicitValidatedTripLinks0612' app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaRidesForensicEvidence0528Test.kt
          grep -Fq 'BLABLACAR_GLOBAL_HTML_COMMIT_0610' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          grep -Fq 'globalCommitPending=true' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          grep -Fq 'BLABLACAR_GLOBAL_HTML_TRANSACTION_STARTED_0610' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaRidesSnapshot0526.kt
          grep -Fq 'replaceHtmlSnapshotsAtomically0610' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaCollectorSessionModule.kt
          grep -Fq 'effectiveSkippedTrips0610' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaCollectorSessionModule.kt
          grep -Fq 'TARGETED_HTML_BLOCKED_BY_GLOBAL_TRANSACTION_0610' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          grep -Fq 'HTML_CANONICAL_RECONCILE_BLOCKED_0610' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'LEGACY_COLLECTOR_DELTA_DISABLED_0610' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'val reconcileCollectorSnapshot = false' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          ! grep -Fq 'stageProfile0609' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          ! grep -Fq 'persistProgress0605' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          test "$(grep -Fc 'AgendaBackgroundSync0392.enqueueCollectorDelta0431(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt)" -eq 0
