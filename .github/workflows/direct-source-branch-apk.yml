          grep -Fq 'burstOfRevisionsForSameTripCollapsesBeforeSerialization0609' app/src/test/java/br/com/mapeiaia/rotacerta/trips/OperationalOutboxCompaction0600Test.kt
          git diff --check "$BASE_SHA" HEAD

      - name: Configure Firebase Android app for build only
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unified capture unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests '*AgendaCanonicalCentralSync0403Test' \
            --tests '*BlaBlaDirectAccountCapture0608Test' \
            --tests '*BlaBlaUnifiedHtmlCapture0605Test' \
            --tests '*BlaBlaRidesExternalTimeline0535Test' \
            --tests '*BlaBlaRidesForensicEvidence0528Test' \
            --tests '*PublicAgendaAutoSync0300Test' \
            --tests '*SegmentAvailabilityTruthGate0603Test' \
            --tests '*OperationalOutboxCompaction0600Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace | tee /tmp/tests.log

      - name: Assemble exact-head APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace | tee /tmp/assemble.log
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" | tee /tmp/zip-integrity.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'Verified' /tmp/apksigner.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -Fq "$GITHUB_SHA" /tmp/dex-strings.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Verify FAROL and package evidence
        shell: bash
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          sha256sum "$FAROL" | tee /tmp/farol-after.sha256
          diff -u /tmp/farol-before.sha256 /tmp/farol-after.sha256
          OUT=/tmp/0614
          mkdir -p "$OUT"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          FINAL_APK="$OUT/rota-certa-$EXPECTED_VERSION_NAME-$EXPECTED_VERSION_CODE-$SHORT_SHA.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$FINAL_APK"
          sha256sum "$FINAL_APK" | tee "$OUT/apk.sha256"
          cp /tmp/source-head.txt /tmp/source-branch.txt /tmp/farol-before.sha256 /tmp/farol-after.sha256 "$OUT/"
          cp /tmp/tests.log /tmp/assemble.log /tmp/aapt.txt /tmp/apksigner.txt /tmp/zip-integrity.txt /tmp/dex-strings.txt "$OUT/"
          cat > "$OUT/final-status.txt" <<EOF
          package=br.com.mapeiaia.rotacerta
          version=$EXPECTED_VERSION_NAME/$EXPECTED_VERSION_CODE
          source_head=$GITHUB_SHA
          source_branch=$GITHUB_REF_NAME
          unified_html_capture=PASS
          global_html_atomic_commit=PASS
          html_validated_complete_contract=PASS
          html_canonical_tombstone_revival=PASS
          html_canonical_rollback=PASS
          rides_index_full_coverage=PASS
          relative_ride_dates=PASS
          active_ride_arrival_plus_1h=PASS
          passenger_segment_resolution_required=PASS
          private_html_staging=PASS
          shared_session_write_during_global_capture=ABSENT
          skipped_history_reset_on_authoritative_complete=PASS
          background_blablacar_canonical_write=DISABLED
          targeted_refresh_during_global_capture=BLOCKED
          direct_n_of_n_canonical_reconcile=PASS
          per_trip_canonical_enqueue=ABSENT
          outbox_revision_coalescing=PASS
          current_dom_itinerary_fallback=PASS
          current_dom_roster_fallback=PASS
          spa_hydration_wait=PASS
          direct_seat_options=PASS
          html_authority_firewall=PASS
          legacy_session_write=BLOCKED
          legacy_persisted_response=BLOCKED
          non_html_tripstore_ingest=BLOCKED
          background_automatic_collector=DISABLED
          targeted_card_refresh=HTML_ONLY
          remote_blablacar_trip_merge=BLOCKED
          legacy_trip_render_without_html=BLOCKED
          legacy_field_inheritance_into_html=BLOCKED
          remote_blablacar_occupancy_merge=BLOCKED
          direct_rides_page_capture=PASS
          rides_list_exhaustion_probe=PASS
          accumulated_trip_inventory_parity=PASS
          transient_bottom_false_complete=BLOCKED
          same_date_distinct_tripids=PASS
          legacy_deterministic_identity_promotion=PASS
          legacy_revision_collision_150=BLOCKED
          legacy_public_binding_promotion=PASS
          html_55_to_54_regression=BLOCKED
          legacy_snapshot_controller=ABSENT
          legacy_identity_probe=ABSENT
          global_mhtml_requirement=DISABLED
          old_snapshot_headless_reverify=ABSENT
          automatic_collector_acquisition=ABSENT
          browser_orchestrator_acquisition=ABSENT
          per_trip_html_evidence=PASS
          published_seat_fail_closed=PASS
          farol_untouched=PASS
          physical_approval=PENDING_SAMSUNG_SM_S911B_ANDROID_16
          EOF
          cat "$OUT/final-status.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.614-5905-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0614
