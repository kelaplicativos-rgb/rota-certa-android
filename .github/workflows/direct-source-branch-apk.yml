name: Rota Certa 0.1.621 HTML network recovery exact SHA
# trigger: html-network-recovery-0621-r1

on:
  push:
    branches:
      - agent/html-network-recovery-0.1.621
    paths:
      - '.github/workflows/direct-source-branch-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/direct-source-branch-apk.yml'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: html-network-recovery-0621-${{ github.ref }}
  cancel-in-progress: true

