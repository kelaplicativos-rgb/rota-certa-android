name: Rota Certa 0.1.679 Global HTML refresh exact SHA

on:
  push:
    branches:
      - agent/global-html-refresh-0.1.679
  pull_request:
    branches:
      - agent/global-html-refresh-0.1.679
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-html-refresh-0679-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_API_KEY: global_html_refresh_0679_ci_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      EXPECTED_VERSION_CODE: '5970'
      EXPECTED_VERSION_NAME: '0.1.679'
      BASE_SHA: 'b038657b200223aa40cbb02beec3ee0e900e1421'
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      SOURCE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Prove source identity and global HTML contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "ROTA_CERTA_GIT_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_BRANCH=$SOURCE_BRANCH" >> "$GITHUB_ENV"
          printf '%s\n' "$SOURCE_SHA" | tee /tmp/source-head.txt
          printf '%s\n' "$SOURCE_BRANCH" | tee /tmp/source-branch.txt

          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          test -s "$FAROL"
          sha256sum "$FAROL" | tee /tmp/farol-before.sha256
          git diff --quiet "$BASE_SHA" HEAD -- "$FAROL"

          grep -Fq 'val releaseVersionCode = 5_970' app/build.gradle.kts
          grep -Fq 'val releaseVersionName = "0.1.679"' app/build.gradle.kts
          grep -Fq 'BlaBlaGlobalHtmlRefreshWorker0679' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaGlobalHtmlRefresh0679.kt
          grep -Fq 'BlaBlaRidesSnapshotCoordinator0526.captureAll(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaGlobalHtmlRefresh0679.kt
          grep -Fq 'ExistingWorkPolicy.KEEP' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaGlobalHtmlRefresh0679.kt
          grep -Fq 'setForeground(foregroundInfo0679(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaGlobalHtmlRefresh0679.kt
          grep -Fq 'ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaGlobalHtmlRefresh0679.kt
          grep -Fq 'CANONICAL_FINAL_COMMIT_NOT_CONFIRMED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaGlobalHtmlRefresh0679.kt
          grep -Fq 'MULTI_PROFILE_UNAVAILABLE' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaGlobalHtmlRefresh0679.kt
          grep -Fq 'onGlobalCommitResult0679(committed)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaRidesSnapshot0526.kt
          grep -Fq 'Icons.Filled.Refresh' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaHeaderNavigation0396.kt
          grep -Fq 'text = "⚠️?"' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaHeaderNavigation0396.kt
          grep -Fq 'BlaBlaGlobalHtmlRefresh0679.enqueue(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaAccountsBrowsersUi0399.kt
          ! grep -Fq 'BlaBlaRidesSnapshotCoordinator0526.captureAll(context)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaAccountsBrowsersUi0399.kt
          grep -Fq 'globalHtmlRefreshState0679 = globalHtmlRefresh0679' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'android:foregroundServiceType="dataSync"' app/src/main/AndroidManifest.xml
          grep -Fq '"version": "0.1.679"' app/src/main/assets/release_history.json
          git diff --check "$BASE_SHA" HEAD

      - name: Configure Firebase Android app for build
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run global HTML and inherited capture tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests '*BlaBlaGlobalHtmlRefresh0679Test' \
            --tests '*BlaBlaLiveHtmlCommit0617Test' \
            --tests '*BlaBlaUnifiedHtmlCapture0605Test' \
            --tests '*BlaBlaDirectAccountCapture0608Test' \
            --tests '*AgendaHeaderNavigation0396Test' \
            --tests '*AgendaNavigationNotificationsProfiles0416Test' \
            --tests '*AgendaCanonicalCentralSync0403Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace | tee /tmp/tests.log

      - name: Assemble exact-head APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace | tee /tmp/assemble.log
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" | tee /tmp/zip-integrity.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'Verified' /tmp/apksigner.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -Fq "$SOURCE_SHA" /tmp/dex-strings.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Package exact-SHA Samsung validation artifact
        shell: bash
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          sha256sum "$FAROL" | tee /tmp/farol-after.sha256
          diff -u /tmp/farol-before.sha256 /tmp/farol-after.sha256

          OUT=/tmp/0679
          mkdir -p "$OUT"
          SHORT_SHA="${SOURCE_SHA:0:12}"
          FINAL_APK="$OUT/rota-certa-$EXPECTED_VERSION_NAME-$EXPECTED_VERSION_CODE-$SHORT_SHA.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$FINAL_APK"
          sha256sum "$FINAL_APK" | tee "$OUT/apk.sha256"
          cp /tmp/source-head.txt /tmp/source-branch.txt /tmp/farol-before.sha256 /tmp/farol-after.sha256 "$OUT/"
          cp /tmp/tests.log /tmp/assemble.log /tmp/aapt.txt /tmp/apksigner.txt /tmp/zip-integrity.txt /tmp/dex-strings.txt "$OUT/"
          cat > "$OUT/final-status.txt" <<EOF
          package=br.com.mapeiaia.rotacerta
          version=$EXPECTED_VERSION_NAME/$EXPECTED_VERSION_CODE
          source_head=$SOURCE_SHA
          source_branch=$SOURCE_BRANCH
          global_header_refresh=PASS
          notification_bell_preserved=PASS
          existing_capture_button_shared_worker=PASS
          workmanager_background=PASS
          foreground_data_sync=PASS
          duplicate_global_runs=BLOCKED
          all_configured_accounts=REQUIRED
          all_target_html_cards=REQUIRED
          canonical_final_commit=REQUIRED
          incomplete_attention_icon=PASS
          html_authority_single_source=PASS
          per_profile_serial_capture=PASS
          per_card_sequential_capture=PASS
          previous_canonical_on_partial=PRESERVED
          farol_untouched=PASS
          apk_exact_source_sha=PASS
          physical_validation=PENDING_SAMSUNG_SM_S911B_ANDROID_16
          EOF
          cat "$OUT/final-status.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.679-5970-${{ env.SOURCE_SHA }}
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0679
