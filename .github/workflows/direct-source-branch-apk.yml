name: Rota Certa 0.1.614 HTML legacy identity promotion exact SHA
# trigger: html-legacy-identity-promotion-0614

on:
  push:
    branches:
      - agent/html-legacy-identity-promotion-0.1.614
    paths:
      - '.github/workflows/direct-source-branch-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: html-legacy-identity-promotion-0614-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_API_KEY: html_legacy_identity_promotion_0614_ci_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      EXPECTED_VERSION_CODE: '5905'
      EXPECTED_VERSION_NAME: '0.1.614'
      BASE_SHA: '3690f161386dd2e1df93853eacf6f84b2e92f16d'

    steps:
      - name: Checkout exact triggering HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact source and unified acquisition contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "ROTA_CERTA_GIT_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_BRANCH=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" | tee /tmp/source-head.txt
          printf '%s\n' "$GITHUB_REF_NAME" | tee /tmp/source-branch.txt

          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          test -s "$FAROL"
          sha256sum "$FAROL" | tee /tmp/farol-before.sha256
          git diff --quiet "$BASE_SHA" HEAD -- "$FAROL"

          grep -Fq 'val releaseVersionCode = 5_905' app/build.gradle.kts
          grep -Fq 'val releaseVersionName = "0.1.614"' app/build.gradle.kts
          grep -Fq 'writeTripHtml0605' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaRidesSnapshot0526.kt
          ! grep -Fq 'reverifyTripHeadless0407' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaRidesSnapshot0526.kt
          ! grep -Fq 'BlaBlaAutomaticCollectionCoordinator0400' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          ! grep -Fq 'BlaBlaBrowserOrchestrator' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          grep -Fq 'published_offer_href' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          grep -Fq 'TRIP_READY_0606' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          grep -Fq 'capturePublishedSeats0606' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          grep -Fq 'strongPassengerLinks' app/src/main/assets/blablacar/scripts/trip_detail.js
          grep -Fq 'fallbackItineraryStops' app/src/main/assets/blablacar/scripts/trip_detail.js
          grep -Fq 'optionsHref' app/src/main/assets/blablacar/scripts/trip_detail.js
          grep -Fq 'HTML_DIRECT_0607' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaCollectorSessionModule.kt
          grep -Fq 'LEGACY_SESSION_WRITE_BLOCKED_0607' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaCollectorSessionModule.kt
          grep -Fq 'LEGACY_COLLECTOR_RESPONSE_BLOCKED_0607' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollector.kt
          grep -Fq 'NON_HTML_CANONICAL_INGEST_BLOCKED_0607' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'captureSingleTrip0607' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'captureSingleTrip0607' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          ! grep -Fq 'BlaBlaAutomaticCollectionCoordinator0400' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          ! grep -Fq 'runPendingHeadless' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'if (!expanded) queueTargetHtmlRefresh0607()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'requestAgendaTripHtmlRefresh0607' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'remoteIsBlaBla' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimeline.kt
          grep -Fq 'externalSnapshotAuthority0607' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt
          grep -Fq 'htmlAuthorityVisible0607' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimeline.kt
          grep -Fq 'htmlAuthorityVisible0607' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'existingHtmlAuthority0607' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'htmlBackedTripIds0607' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripStore.kt
          grep -Fq 'BlaBlaDirectAccountCapture0608.capture' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaRidesSnapshot0526.kt
          ! grep -Fq 'BlaBlaDynamicAccountSessionController0401' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaRidesSnapshot0526.kt
          grep -Fq 'oldController=false oldIdentityProbe=false' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDirectAccountCapture0608.kt
          ! grep -Fq 'BlaBlaBrowserOrchestrator' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDirectAccountCapture0608.kt
          ! grep -Fq 'BlaBlaAutomaticCollectionCoordinator0400' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDirectAccountCapture0608.kt
          grep -Fq 'mhtmlSupported = false' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDirectAccountCapture0608.kt
          grep -Fq 'directRidesStabilizer0613' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDirectAccountCapture0608.kt
          grep -Fq 'RIDES_OBSERVED_INVENTORY_MISMATCH_0613' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDirectAccountCapture0608.kt
          grep -Fq 'observedTripHrefs' app/src/main/assets/blablacar/scripts/ride_list.js
          grep -Fq 'initialTenCardBottomCannotCompleteBeforeLazyListFinishes0613' app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDirectAccountCapture0608Test.kt
          grep -Fq 'sameDateDoesNotCollapseDistinctStrongTripIds0613' app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDirectAccountCapture0608Test.kt
          grep -Fq 'HTML_LEGACY_IDENTITY_PROMOTED_0614' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'htmlLegacyIdentityPromotionEligible0614' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'store.promoteExternalIdentity0472(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
