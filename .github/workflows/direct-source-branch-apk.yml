name: Rota Certa Timeline operational direct-source APK 0.1.483

on:
  push:
    branches:
      - agent/timeline-operational-restore-0.1.483
    paths:
      - 'app/**'
      - '.github/workflows/direct-source-branch-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeline-operational-0483-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GOOGLE_MAPS_API_KEY: timeline_operational_0483_ci_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      BASE_AUTHORITY_SHA: 51d588f460609a37fb2f48795967fceb21094f68
      EXPECTED_VERSION_CODE: '5776'
      EXPECTED_VERSION_NAME: '0.1.483'

    steps:
      - name: Checkout exact triggering HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact source scope and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_HEAD="$(git rev-parse HEAD)"
          test "$SOURCE_HEAD" = "$GITHUB_SHA"
          printf '%s\n' "$SOURCE_HEAD" | tee source_head.txt
          printf '%s\n' "$GITHUB_REF_NAME" | tee source_branch.txt
          echo "ROTA_CERTA_GIT_SHA=$SOURCE_HEAD" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_BRANCH=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

          grep -Fq "versionCode = $EXPECTED_VERSION_CODE" app/build.gradle.kts
          grep -Fq "versionName = \"$EXPECTED_VERSION_NAME\"" app/build.gradle.kts

          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          git diff --exit-code "$BASE_AUTHORITY_SHA" -- "$FAROL"
          git diff --exit-code "$BASE_AUTHORITY_SHA" -- trip-platform/public trip-platform/firebase.json trip-platform/firestore.rules

          git diff --name-only "$BASE_AUTHORITY_SHA"...HEAD | tee changed-files.txt
          ! grep -Fxq "$FAROL" changed-files.txt
          ! grep -E '^trip-platform/public/' changed-files.txt
          ! grep -Fxq 'trip-platform/firebase.json' changed-files.txt
          ! grep -Fxq 'trip-platform/firestore.rules' changed-files.txt

          grep -Fq 'TripScreen.TIMELINE -> "Todas as viagens"' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'else -> TripScreen.TIMELINE' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          ! grep -Fq 'Timeline antiga · somente migração' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          ! grep -Fq 'A Timeline local foi retirada da operação' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'ALL_TRIPS("Todas as viagens")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaHeaderNavigation0396.kt
          grep -Fq 'AgendaRootSection0396.ALL_TRIPS' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaHeaderNavigation0396.kt
          grep -Fq 'canonicalCollectorResponse0403' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'EnhancedPassengerTimelineSection(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'VAGAS POR TRECHO' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'openPassengerWhatsApp' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          grep -Fq 'boardingAddress' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          grep -Fq 'dropoffAddress' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          grep -Fq 'com.google.android.apps.maps' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          grep -Fq 'AgendaBackgroundSync0392.enqueueImmediate(activity, "trip_mutation")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'canonicalOperationalSnapshot0434' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'availableSeatsMinimum' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'availableSeatsMaximum' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt

          bash .github/scripts/verify-agenda-public-freeze-0482.sh
          sha256sum "$FAROL" | tee farol.sha256

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi

          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi

          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Run Timeline and per-segment capacity regression suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaTimelineSurface0415Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaHeaderNavigation0396Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaOperationalTimeline0400Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.ManualPassengerCapacityGuard0295Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripSegmentSeatSync0292Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PublicAgendaIncrementalAvailability0375Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripTimelineCardActions0289Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PassengerTimeline0253Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PassengerTimeline0254RegressionTest' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PassengerTimeline0255RegressionTest' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace | tee focused-tests.log

      - name: Assemble exact-head installable APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace | tee assemble.log
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code "$BASE_AUTHORITY_SHA" -- app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          git diff --exit-code "$BASE_AUTHORITY_SHA" -- trip-platform/public trip-platform/firebase.json trip-platform/firestore.rules
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" | tee zip-integrity.txt

      - name: Validate package version signature and final SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          APK='app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          SIGN="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$AAPT"
          test -x "$SIGN"

          "$AAPT" dump badging "$APK" | tee evidence/aapt-badging.txt
          PACKAGE_LINE="$(grep '^package:' evidence/aapt-badging.txt | head -n1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"

          "$SIGN" verify --verbose --print-certs "$APK" | tee evidence/apksigner.txt
          grep -Fq 'Verified' evidence/apksigner.txt

          cp "$APK" "evidence/rota-certa-${EXPECTED_VERSION_NAME}-timeline-operacional.apk"
          sha256sum "evidence/rota-certa-${EXPECTED_VERSION_NAME}-timeline-operacional.apk" | tee evidence/apk-sha256.txt
          cp source_head.txt source_branch.txt changed-files.txt farol.sha256 focused-tests.log assemble.log zip-integrity.txt evidence/

          cat > evidence/final-status.txt <<EOF
          timeline_operational_restore=PASS
          package=br.com.mapeiaia.rotacerta
          version=$EXPECTED_VERSION_NAME/$EXPECTED_VERSION_CODE
          source_head=$GITHUB_SHA
          source_branch=$GITHUB_REF_NAME
          timeline_home=RESTORED
          collector_to_canonical_timeline=VERIFIED_BY_SOURCE_AND_TESTS
          manual_passenger_per_segment_capacity=VERIFIED_BY_TESTS
          immediate_public_delta_outbox=VERIFIED_BY_SOURCE_AND_TESTS
          agenda_public_frozen=PASS
          farol_untouched=PASS
          merge=false
          release=false
          latest=false
          EOF
          cat evidence/final-status.txt

      - name: Upload final Timeline APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.483-timeline-operacional-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: evidence/
