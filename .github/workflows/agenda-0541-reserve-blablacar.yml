name: Agenda 0.1.541 - Reservar vaga na publicação BlaBlaCar

on:
  push:
    branches:
      - agent/public-reserve-blablacar-0.1.541
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar alteração cirúrgica 0.1.541
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('trip-platform/public/app.js')
          app = app_path.read_text()
          old_top = '''let agendaChangeCursor0495 = 0;
          let agendaChangeWatchRunning0495 = false;
          let publicDriverWhatsapp0519 = "";

          function whatsappDigits0519(raw) {
            const digits = String(raw || "").replace(/\\D/g, "");
            return digits.length >= 10 && digits.length <= 15 ? digits : "";
          }

          function driverWhatsappHref0519(item, from, to) {
            const digits = whatsappDigits0519(publicDriverWhatsapp0519);
            if (!digits) return "";
            const when = [
              agendaDateLabel0473(item?.departureAtMillis, item?.timezoneId),
              agendaTripTime0496(item?.departureAtMillis, item?.timezoneId),
            ].filter(Boolean).join(" às ");
            const message = "Olá! Vi a viagem " + from + " → " + to +
              (when ? " (" + when + ")" : "") +
              " na Agenda Rota Certa e gostaria de reservar uma vaga.";
            return "https://wa.me/" + digits + "?text=" + encodeURIComponent(message);
          }
          '''
          new_top = '''let agendaChangeCursor0495 = 0;
          let agendaChangeWatchRunning0495 = false;

          function isOfficialBlaBlaHost0541(hostname) {
            const labels = String(hostname || "").toLowerCase().replace(/^\\.+|\\.+$/g, "").split(".").filter(Boolean);
            const root = labels[0] === "www" ? labels.slice(1) : labels;
            if (root[0] !== "blablacar") return false;
            const suffix = root.slice(1);
            if (suffix.length === 1) return suffix[0] === "com" || /^[a-z]{2}$/.test(suffix[0]);
            if (suffix.length === 2) return ["com", "co"].includes(suffix[0]) && /^[a-z]{2}$/.test(suffix[1]);
            return false;
          }

          function validatedBlaBlaReservationUrl0541(raw) {
            const value = String(raw || "").trim().slice(0, 1200);
            if (!value) return "";
            try {
              const url = new URL(value);
              if (url.protocol !== "https:" || !isOfficialBlaBlaHost0541(url.hostname)) return "";
              if (url.username || url.password || (url.port && url.port !== "443")) return "";
              const path = url.pathname.replace(/\\/+$/, "").toLowerCase();
              if (!path.startsWith("/trip/")) return "";
              const match = url.pathname.match(/\\/trip\\/([^/?#]+)/i);
              if (!match || !String(match[1] || "").trim()) return "";
              url.searchParams.delete("search_uuid");
              url.hash = "";
              return url.toString();
            } catch (_) {
              return "";
            }
          }

          function agendaReservationTelemetry0541(eventName, item, reason) {
            const canonicalTripRef = publicAgendaTripKey0506(item);
            const detail = {
              event: eventName,
              canonicalTripRef: canonicalTripRef || "unavailable",
              source: "PUBLIC_AGENDA_UI",
              reason,
              hasCanonicalBlaBlaPublicUrl: Boolean(validatedBlaBlaReservationUrl0541(item?.blablaPublicUrl)),
              privateDataLogged: false,
            };
            console.info("[RotaCertaAgendaReservation0541]", detail);
            try {
              window.dispatchEvent(new CustomEvent("rota-certa-agenda-reservation-0541", { detail }));
            } catch (_) {
              // Console estruturado permanece como telemetria sanitizada mínima.
            }
          }
          '''
          if 'validatedBlaBlaReservationUrl0541' not in app:
              if old_top not in app:
                  raise SystemExit('bloco WhatsApp 0519 não localizado')
              app = app.replace(old_top, new_top, 1)

          old_action = '''    const whatsappHref0519 = driverWhatsappHref0519(item, from, to);
              if (whatsappHref0519) {
                const actions0519 = document.createElement("div");
                actions0519.className = "agendaDriverActions0519";
                const whatsapp0519 = document.createElement("a");
                whatsapp0519.className = "agendaWhatsapp0519";
                whatsapp0519.href = whatsappHref0519;
                whatsapp0519.target = "_blank";
                whatsapp0519.rel = "noopener noreferrer";
                whatsapp0519.textContent = "💬 Fazer reserva com o motorista";
                whatsapp0519.setAttribute("aria-label", "Fazer reserva com o motorista pelo WhatsApp");
                actions0519.appendChild(whatsapp0519);
                card.appendChild(actions0519);
              }
          '''
          new_action = '''    const reservationHref0541 = validatedBlaBlaReservationUrl0541(item?.blablaPublicUrl);
              const actions0541 = document.createElement("div");
              actions0541.className = "agendaTripActions0541";
              if (reservationHref0541) {
                const reserve0541 = document.createElement("a");
                reserve0541.className = "agendaReserve0541";
                reserve0541.href = reservationHref0541;
                reserve0541.rel = "noopener noreferrer";
                reserve0541.textContent = "🟢 Reservar vaga";
                reserve0541.setAttribute("aria-label", "Reservar vaga na publicação BlaBlaCar desta viagem");
                reserve0541.addEventListener("click", () => {
                  agendaReservationTelemetry0541("AGENDA_RESERVATION_PUBLICATION_OPENED_0541", item, "CANONICAL_BLABLACAR_PUBLICATION");
                });
                actions0541.appendChild(reserve0541);
              } else {
                const unavailable0541 = document.createElement("button");
                unavailable0541.className = "agendaReserve0541 agendaReserveUnavailable0541";
                unavailable0541.type = "button";
                unavailable0541.disabled = true;
                unavailable0541.textContent = "Reserva temporariamente indisponível";
                unavailable0541.setAttribute("aria-label", "Reserva temporariamente indisponível: publicação BlaBlaCar não validada");
                actions0541.appendChild(unavailable0541);
                agendaReservationTelemetry0541("AGENDA_RESERVATION_UNAVAILABLE_0541", item, item?.blablaPublicUrl ? "PUBLICATION_URL_REJECTED" : "PUBLICATION_URL_ABSENT");
              }
              card.appendChild(actions0541);
          '''
          if 'AGENDA_RESERVATION_PUBLICATION_OPENED_0541' not in app:
              if old_action not in app:
                  raise SystemExit('ação WhatsApp 0519 não localizada')
              app = app.replace(old_action, new_action, 1)

          app = app.replace('  publicDriverWhatsapp0519 = String(body?.driver?.whatsapp || "").trim();\n', '')
          if 'https://wa.me/' in app or 'driverWhatsappHref0519' in app or 'publicDriverWhatsapp0519' in app:
              raise SystemExit('WhatsApp público de reserva ainda presente em app.js')
          app_path.write_text(app)

          html_path = Path('trip-platform/public/index.html')
          html = html_path.read_text()
          html = html.replace('.agendaDriverActions0519{', '.agendaTripActions0541{')
          html = html.replace('.agendaWhatsapp0519{', '.agendaReserve0541{')
          html = html.replace('.agendaWhatsapp0519:focus-visible{', '.agendaReserve0541:focus-visible{')
          html = html.replace('.agendaWhatsapp0519:active{', '.agendaReserve0541:active{')
          if '.agendaReserveUnavailable0541{' not in html:
              html = html.replace('.agendaReserve0541:active{transform:translateY(1px)}', '.agendaReserve0541:active{transform:translateY(1px)}\n    .agendaReserveUnavailable0541{background:#d5d9df;color:#5d626a;border:0;cursor:not-allowed;transform:none}')
          html = html.replace('/app.js?v=0.1.519-global-extra-seats-whatsapp0519', '/app.js?v=0.1.541-reserve-blablacar0541')
          html_path.write_text(html)

          test_path = Path('trip-platform/functions/test/agenda-public-read-only-0475.test.js')
          test = test_path.read_text()
          test = test.replace('/app\\.js\\?v=0\\.1\\.519-global-extra-seats-whatsapp0519/', '/app\\.js\\?v=0\\.1\\.541-reserve-blablacar0541/')
          old_assertions = '''  assert.match(app, /agendaWhatsapp0519/);
            assert.match(app, /Fazer reserva com o motorista/);
            assert.match(app, /https:\\/\\/wa\\.me\\//);
          '''
          new_assertions = '''  assert.match(app, /validatedBlaBlaReservationUrl0541/);
            assert.match(app, /item\\?\\.blablaPublicUrl/);
            assert.match(app, /🟢 Reservar vaga/);
            assert.match(app, /Reserva temporariamente indisponível/);
            assert.match(app, /AGENDA_RESERVATION_PUBLICATION_OPENED_0541/);
            assert.match(app, /AGENDA_RESERVATION_UNAVAILABLE_0541/);
            assert.match(app, /url\\.protocol !== "https:"/);
            assert.match(app, /path\\.startsWith\\("\\/trip\\/"\\)/);
            assert.doesNotMatch(app, /https:\\/\\/wa\\.me\\//);
            assert.doesNotMatch(app, /Fazer reserva com o motorista/);
            assert.doesNotMatch(app, /blablacar:\\/\\//i);
            assert.doesNotMatch(app, /\\/search|search_uuid=.*href/i);
          '''
          if old_assertions in test:
              test = test.replace(old_assertions, new_assertions, 1)
          elif 'AGENDA_RESERVATION_PUBLICATION_OPENED_0541' not in test:
              raise SystemExit('assertions WhatsApp antigas não localizadas')
          test = test.replace('"Reservar pelo WhatsApp", "Reservar na BlaBlaCar", "startBooking",', '"Reservar pelo WhatsApp", "startBooking",')
          test = test.replace('assert.match(gradle, /versionCode = 5823/);', 'assert.match(gradle, /versionCode = 5833/);')
          test = test.replace('assert.match(gradle, /versionName = "0\\.1\\.531"/);', 'assert.match(gradle, /versionName = "0\\.1\\.541"/);')
          test_path.write_text(test)

          gradle_path = Path('app/build.gradle.kts')
          gradle = gradle_path.read_text()
          gradle = gradle.replace('versionCode = 5832\n        versionName = "0.1.540"', 'versionCode = 5833\n        versionName = "0.1.541"', 1)
          gradle_path.write_text(gradle)

          # Provas estáticas de segurança: o backend público já transporta o permalink canônico,
          # e o cliente jamais cria booking nem mutação por clique.
          api = Path('trip-platform/functions/index.js').read_text()
          projection = api[api.index('function publicTripProjection0491'):api.index('async function getPublicDriverAgenda')]
          if '"blablaPublicUrl"' not in projection:
              raise SystemExit('blablaPublicUrl não está autorizado na projeção pública existente')
          if 'normalizeCanonicalBoundBlaBlaPublicUrl0423' not in api:
              raise SystemExit('binding canônico BlaBlaCar ausente')
          PY

          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add trip-platform/public/app.js trip-platform/public/index.html trip-platform/functions/test/agenda-public-read-only-0475.test.js app/build.gradle.kts
            git commit -m "feat: route public reservation to canonical BlaBlaCar publication"
            git push origin HEAD:agent/public-reserve-blablacar-0.1.541
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Testar Agenda pública
        run: node --test trip-platform/functions/test/agenda-public-read-only-0475.test.js

      - name: Testes Android e APK debug do SHA materializado
        shell: bash
        run: |
          FINAL_SHA="$(git rev-parse HEAD)"
          ROTA_CERTA_GIT_SHA="$FINAL_SHA" \
          ROTA_CERTA_GIT_BRANCH="agent/public-reserve-blablacar-0.1.541" \
          ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Metadados finais
        id: meta
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          grep -n 'versionCode = 5833\|versionName = "0.1.541"' app/build.gradle.kts
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK instalável
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.541-${{ steps.meta.outputs.short_sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
