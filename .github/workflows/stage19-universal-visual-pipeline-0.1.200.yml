name: Validate Stage 19 universal visual pipeline 0.1.200

on:
  pull_request:
    branches:
      - agent/stage18-app-identity-isolation-0.1.198
    paths:
      - .github/workflows/stage19-universal-visual-pipeline-0.1.200.yml
      - scripts/apply_universal_visual_pipeline_stage19.py
      - stage19/**
  workflow_dispatch:

concurrency:
  group: stage19-universal-visual-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  validate-stage19-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected canonical source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Checkout exact Stage 19 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: patches

      - name: Restore exact materialized Stage 18 source
        uses: actions/download-artifact@v4
        with:
          name: rota-certa-stage19-materialized-stage18-source
          path: bootstrap
          github-token: ${{ github.token }}
          repository: kelaplicativos-rgb/rota-certa-android
          run-id: 31612053591

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify and restore Stage 18 baseline
        run: |
          set -euo pipefail
          mkdir -p source/stage19-evidence
          cd bootstrap
          EXPECTED_STAGE18_SHA="$(awk 'NR==1 {print $1}' stage18-materialized-source.sha256)"
          ACTUAL_STAGE18_SHA="$(sha256sum stage18-materialized-source.tgz | awk '{print $1}')"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_STAGE18_SHA" "$ACTUAL_STAGE18_SHA" | tee ../source/stage19-evidence/stage18-bootstrap-sha256-check.txt
          test "$EXPECTED_STAGE18_SHA" = "$ACTUAL_STAGE18_SHA"
          cd ../source
          # The Stage18 artifact intentionally contains only the materialized Android
          # sources/tests/manifest/build file. Keep canonical res/, assets and other
          # static Android inputs, while replacing all generated Kotlin/JVM source.
          rm -rf app/src/main/java app/src/test/java
          tar -xzf ../bootstrap/stage18-materialized-source.tgz
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/res/values/styles.xml
          test -f app/src/main/res/xml/rota_certa_accessibility.xml
          test -f app/src/main/res/xml/file_paths.xml
          grep -Fq 'versionCode = 5482' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.198"' app/build.gradle.kts
          test -f app/src/main/java/br/com/mapeiaia/rotacerta/FarolAppIdentityIsolationStage18.kt
          sha256sum \
            app/src/main/java/br/com/mapeiaia/rotacerta/DecisionEngine.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/GoogleMapsService.kt \
            app/src/main/AndroidManifest.xml \
            > stage19-evidence/protected-pre-stage19.sha256

      - name: Apply Stage 19 universal visual pipeline
        working-directory: source
        run: |
          set -euo pipefail
          python3 -m py_compile ../patches/scripts/apply_universal_visual_pipeline_stage19.py
          python3 ../patches/scripts/apply_universal_visual_pipeline_stage19.py --self-test | tee stage19-evidence/stage19-self-test.txt
          python3 ../patches/scripts/apply_universal_visual_pipeline_stage19.py "$PWD" | tee stage19-evidence/stage19-apply.txt
          grep -Fxq 'stage19_apply=passed' stage19-evidence/stage19-apply.txt
          grep -Fxq 'visual_fast_path_precedes_package_gates=true' stage19-evidence/stage19-apply.txt
          grep -Fxq 'accessibility_empty_uses_immediate_ocr=true' stage19-evidence/stage19-apply.txt
          grep -Fxq 'exact_cache_before_network=true' stage19-evidence/stage19-apply.txt
          grep -Fq 'versionCode = 5484' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.200"' app/build.gradle.kts
          grep -Fq 'UNIVERSAL_VISUAL_AUTHORITY_STAGE19' app/src/main/java/br/com/mapeiaia/rotacerta/FarolUniversalVisualPipelineStage19.kt
          grep -Fq 'if (handleUniversalVisualEventStage19(eventPackage)) return' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          test "$(grep -Fc '@Test' app/src/test/java/br/com/mapeiaia/rotacerta/FarolUniversalVisualPipelineStage19Test.kt)" -ge 29
          sha256sum -c stage19-evidence/protected-pre-stage19.sha256 | tee stage19-evidence/protected-post-stage19-check.txt

      - name: Run Stage 19 deterministic tests
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-stage19
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.FarolUniversalVisualPipelineStage19Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace 2>&1 | tee stage19-evidence/stage19-specific-tests.log
          python3 - <<'PY' | tee stage19-evidence/stage19-specific-test-count.txt
          import glob, xml.etree.ElementTree as ET
          tests=failures=errors=0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root=ET.parse(path).getroot()
              tests += int(root.attrib.get('tests',0)); failures += int(root.attrib.get('failures',0)); errors += int(root.attrib.get('errors',0))
          print(f'tests={tests}'); print(f'failures={failures}'); print(f'errors={errors}')
          if tests < 29 or failures or errors: raise SystemExit(1)
          PY

      - name: Run complete unit suite
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-stage19
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --no-daemon --max-workers=1 --no-parallel --stacktrace 2>&1 | tee stage19-evidence/full-unit-suite.log
          python3 - <<'PY' | tee stage19-evidence/full-test-count.txt
          import glob, xml.etree.ElementTree as ET
          tests=failures=errors=0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root=ET.parse(path).getroot()
              tests += int(root.attrib.get('tests',0)); failures += int(root.attrib.get('failures',0)); errors += int(root.attrib.get('errors',0))
          print(f'tests={tests}'); print(f'failures={failures}'); print(f'errors={errors}')
          if tests < 523 or failures or errors: raise SystemExit(1)
          PY

      - name: Run Android Lint
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-stage19
        run: |
          set -euo pipefail
          ./gradlew lintDebug --no-daemon --max-workers=1 --no-parallel --stacktrace 2>&1 | tee stage19-evidence/lint-debug.log
          test -f app/build/reports/lint-results-debug.html
          cp app/build/reports/lint-results-debug.html stage19-evidence/lint-results-debug.html

      - name: Clean assembleDebug
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-stage19
        run: |
          set -euo pipefail
          ./gradlew clean assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace 2>&1 | tee stage19-evidence/clean-assemble-debug.log

      - name: Validate APK package version signature and DEX
        working-directory: source
        run: |
          set -euo pipefail
          OUT=stage19-evidence
          APK_SRC=app/build/outputs/apk/debug/app-debug.apk
          APK="$OUT/rota-certa-0.1.200-stage19-universal-visual-ci.apk"
          test -s "$APK_SRC"
          cp "$APK_SRC" "$APK"
          unzip -tqq "$APK"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | tee "$OUT/badging.txt"
          grep -F "package: name='br.com.mapeiaia.rotacerta' versionCode='5484' versionName='0.1.200'" "$OUT/badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$OUT/signature.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$OUT/signature.txt"
          grep -qi 'd9ee577b5bb9a4c72bce115e974c9ecf1ec8c7382bcd034e88d433e01eb0e7fd' "$OUT/signature.txt"
          sha256sum "$APK" | tee "$OUT/apk.sha256"
          stat --printf='%s\n' "$APK" | tee "$OUT/apk-size-bytes.txt"
          DEX_FOUND=0
          for dex in $(zipinfo -1 "$APK" | grep -E '^classes[0-9]*\.dex$'); do
            if unzip -p "$APK" "$dex" | strings | grep -Fq 'UNIVERSAL_VISUAL_AUTHORITY_STAGE19'; then DEX_FOUND=1; break; fi
          done
          test "$DEX_FOUND" = 1
          echo 'dex_stage19_marker=true' | tee "$OUT/dex-validation.txt"

      - name: Upload Stage 19 final evidence and APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.200-stage19-universal-visual-final
          path: source/stage19-evidence/
          if-no-files-found: error
          retention-days: 30
