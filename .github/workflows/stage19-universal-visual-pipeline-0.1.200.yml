name: Validate Stage 19 universal visual pipeline 0.1.200

on:
  pull_request:
    branches:
      - agent/stage18-app-identity-isolation-0.1.198
    paths:
      - .github/workflows/stage19-universal-visual-pipeline-0.1.200.yml
      - scripts/apply_universal_visual_pipeline_stage19.py
  workflow_dispatch:

concurrency:
  group: stage19-universal-visual-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  validate-stage19-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout protected canonical source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Checkout exact Stage 19 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: patches

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add materialize-only guards after validated 0.1.186 base
        working-directory: patches
        run: |
          set -euo pipefail
          python3 - <<'PYGUARD'
          from pathlib import Path
          for version in range(187, 195):
              path = Path('scripts') / f'build_rota_certa_0{version}.sh'
              if not path.is_file():
                  raise SystemExit(f'missing builder {path}')
              text = path.read_text(encoding='utf-8')
              marker = 'ROTA_CERTA_MATERIALIZE_ONLY_STAGE19'
              if marker in text:
                  continue
              lines = text.splitlines(keepends=True)
              insert_at = None
              for i, line in enumerate(lines):
                  stripped = line.lstrip()
                  if stripped.startswith('./gradlew ') or stripped.startswith('if ! ./gradlew '):
                      insert_at = i
                      break
              if insert_at is None:
                  raise SystemExit(f'no final Gradle anchor in {path}')
              guard = (
                  'if [[ "${ROTA_CERTA_MATERIALIZE_ONLY:-0}" == "1" ]]; then\n'
                  f'  echo "{marker}={path.name}"\n'
                  '  exit 0\n'
                  'fi\n\n'
              )
              lines.insert(insert_at, guard)
              path.write_text(''.join(lines), encoding='utf-8')
          PYGUARD
          for version in 0187 0188 0189 0190 0191 0192 0193 0194; do
            bash -n "scripts/build_rota_certa_${version}.sh"
          done

      - name: Materialize exact Stage 18 source baseline fast
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p stage19-evidence
          export ROTA_CERTA_MATERIALIZE_ONLY=1
          bash ../patches/scripts/build_rota_certa_0194.sh ../patches 2>&1 | tee stage19-evidence/materialize-0.1.194.log
          unset ROTA_CERTA_MATERIALIZE_ONLY
          grep -Fq 'versionCode = 5478' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.194"' app/build.gradle.kts
          python3 ../patches/scripts/apply_farol_latency_instrumentation_stage9.py "$PWD"
          python3 ../patches/scripts/apply_farol_latency_manual_export_stage12.py "$PWD"
          python3 ../patches/scripts/apply_visible_offer_activation_stage14.py "$PWD"
          python3 ../patches/scripts/apply_visible_card_priority_latency_stage16.py "$PWD"
          python3 ../patches/scripts/apply_app_identity_isolation_stage18.py "$PWD"
          grep -Fq 'versionCode = 5482' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.198"' app/build.gradle.kts
          grep -Fq 'BUBBLE_IDENTITY_FAIL_CLOSED_STAGE18' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          test -f app/src/main/java/br/com/mapeiaia/rotacerta/FarolAppIdentityIsolationStage18.kt

      - name: Package materialized Stage 18 source for Stage 19 engineering
        working-directory: source
        run: |
          set -euo pipefail
          cp app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt stage19-evidence/
          cp app/src/main/java/br/com/mapeiaia/rotacerta/FarolRealDeviceGate0188.kt stage19-evidence/
          cp app/src/main/java/br/com/mapeiaia/rotacerta/UniversalScreenAddressParser.kt stage19-evidence/
          cp app/src/main/java/br/com/mapeiaia/rotacerta/AndroidServices.kt stage19-evidence/
          cp app/build.gradle.kts stage19-evidence/
          tar -czf stage19-evidence/stage18-materialized-source.tgz \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/br/com/mapeiaia/rotacerta \
            app/src/test/java/br/com/mapeiaia/rotacerta
          sha256sum stage19-evidence/stage18-materialized-source.tgz > stage19-evidence/stage18-materialized-source.sha256

      - name: Upload Stage 19 bootstrap evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-stage19-materialized-stage18-source
          path: source/stage19-evidence/
          if-no-files-found: error
          retention-days: 30
