name: Stage47 persisted source import run locator

on:
  pull_request:
    branches:
      - agent/stage47-r4-unified-occupancy-step6-validation-apk
    types: [synchronize, opened, reopened]

permissions:
  actions: read
  contents: read

jobs:
  locate-persist-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 9b74ca0674f98f1e1ac50c0688ead96dbb78680b
    steps:
      - name: Locate one-shot persisted source import
        run: |
          set -euo pipefail
          RUN_ID=""
          STATUS=""
          CONCLUSION=""
          for _ in $(seq 1 30); do
            LINE="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow stage47-r4-step7-persist-materialized-source.yml \
              --branch agent/stage47-r4-step7-automatic-identity \
              --event push \
              --limit 20 \
              --json databaseId,headSha,status,conclusion \
              --jq '.[] | select(.headSha == env.TARGET_SHA) | [.databaseId,.status,(.conclusion // "")] | @tsv' | head -n1)"
            if [[ -n "$LINE" ]]; then
              IFS=$'\t' read -r RUN_ID STATUS CONCLUSION <<< "$LINE"
              break
            fi
            sleep 2
          done
          echo "stage47_persist_run_id=${RUN_ID:-not-found}"
          echo "stage47_persist_status=${STATUS:-unknown}"
          echo "stage47_persist_conclusion=${CONCLUSION:-pending}"
          echo 'apk_generated=false'
          test -n "$RUN_ID"
