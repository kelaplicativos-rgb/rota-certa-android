name: Rota Certa 0.1.353 BlaBlaCar booking seat sync

on:
  push:
    branches:
      - agent/agenda-blablacar-seat-sync-0.1.353
  pull_request:
    branches:
      - agent/passenger-picker-canonical-0.1.352
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-0353-blablacar-seat-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate 0.1.353 causal scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=aa46fa6e98e356a156cd5ff136daa8b9936613c9
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -Fq 'versionCode = 5646' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.353"' app/build.gradle.kts
          grep -Fq 'PERSISTED_STRONG_BINDING' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicBookingSync0296.kt
          grep -Fq 'BOOKING_SEAT_SYNC_ENQUEUED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicBookingSync0296.kt
          grep -Fq 'PUBLIC_BOOKING_SEAT_SYNC_SOURCE' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaManualSeatAutomation.kt
          grep -Fq 'SEAT_SYNC_MUTATION_START' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaReliableSeatSync.kt
          grep -Fq 'SEAT_SYNC_READBACK_RESULT' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaReliableSeatSync.kt
          grep -Fq '"CAPACITY_REMOTE_CONFIRMATION"' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaReliableSeatSync.kt
          ! grep -Fq '"CAPACITY_REMOTE_CONFIRMATION"' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'CAPACITY_PUBLIC_AGENDA_SYNC_RESULT' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'automatic_queue_continuation' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq 'no_applicable_claims' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          test -f app/src/test/java/br/com/mapeiaia/rotacerta/trips/BookingExternalSeatSync0353Test.kt

          CHANGED_FAROL="$(git diff --name-only "$BASE"..HEAD -- app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt 'app/src/main/java/br/com/mapeiaia/rotacerta/Farol*.kt' || true)"
          test -z "$CHANGED_FAROL"

          ALLOWED='^(.github/workflows/agenda-0353-blablacar-seat-sync.yml|app/build.gradle.kts|app/src/main/java/br/com/mapeiaia/rotacerta/trips/(PublicBookingSync0296.kt|BlaBlaManualSeatAutomation.kt|BlaBlaReliableSeatSync.kt|TripBlaBlaCollectorUi.kt|TripsActivity.kt|PublicAgendaAutoSync0300.kt)|app/src/test/java/br/com/mapeiaia/rotacerta/trips/(AgendaForensicBlackBox0345Test.kt|BookingExternalSeatSync0353Test.kt))$'
          UNEXPECTED="$(git diff --name-only "$BASE"..HEAD | grep -Ev "$ALLOWED" || true)"
          test -z "$UNEXPECTED"

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase credential is missing."
            exit 3
          fi

      - name: Generate Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
          else
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
          fi
          APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
          test -n "$APP_ID"
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and installable APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace | tee /tmp/gradle.txt
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta'" /tmp/aapt.txt
          grep -Fq "versionCode='5646'" /tmp/aapt.txt
          grep -Fq "versionName='0.1.353'" /tmp/aapt.txt
          mkdir -p /tmp/0353
          cp "$APK" /tmp/0353/rota-certa-0.1.353-blablacar-booking-seat-sync.apk
          sha256sum /tmp/0353/rota-certa-0.1.353-blablacar-booking-seat-sync.apk | tee /tmp/0353/apk.sha256
          cp /tmp/aapt.txt /tmp/0353/aapt.txt
          cp /tmp/apksigner.txt /tmp/0353/apksigner.txt
          cp /tmp/gradle.txt /tmp/0353/gradle.txt
          git rev-parse HEAD > /tmp/0353/source-head.txt
          git diff --name-only aa46fa6e98e356a156cd5ff136daa8b9936613c9..HEAD > /tmp/0353/changed-files.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.353-blablacar-booking-seat-sync
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0353
