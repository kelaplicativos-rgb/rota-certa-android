name: Passenger timeline geo UX causal patch materializer

on:
  push:
    branches:
      - agent/passenger-timeline-geo-ux

permissions:
  contents: read

jobs:
  validate-build-0548:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_SHA: 27b1a28ac0d3c3220fdca3e0a9116af7af77d29c
      BASE_SOURCE_SHA: 432bcb9035fbbfab6912b6288a0553a89bcfc8fc
      EXPECTED_VERSION_CODE: '5840'
      EXPECTED_VERSION_NAME: '0.1.548'
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      GOOGLE_MAPS_API_KEY: ''

    steps:
      - name: Checkout exact corrected Timeline source
        uses: actions/checkout@v4
        with:
          ref: 27b1a28ac0d3c3220fdca3e0a9116af7af77d29c
          fetch-depth: 0

      - name: Prove exact source and surgical scope
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_HEAD="$(git rev-parse HEAD)"
          test "$SOURCE_HEAD" = "$EXPECTED_SOURCE_SHA"
          git diff --name-only "$BASE_SOURCE_SHA" "$SOURCE_HEAD" | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt)" -eq 4
          grep -Fxq 'app/build.gradle.kts' /tmp/changed.txt
          grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineTemporalCutoff0548.kt' /tmp/changed.txt
          grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt' /tmp/changed.txt
          grep -Fxq 'app/src/test/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineTemporalCutoff0548Test.kt' /tmp/changed.txt
          grep -Fq 'versionCode = 5840' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.548"' app/build.gradle.kts
          mkdir -p evidence
          printf '%s\n' "$SOURCE_HEAD" | tee evidence/source-head.txt
          git diff --stat "$BASE_SOURCE_SHA" "$SOURCE_HEAD" | tee evidence/source-diff-stat.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then exit 0; fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Run focused Timeline temporal-cutoff test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.PassengerTimelineTemporalCutoff0548Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Assemble exact corrected APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          "$AAPT" dump badging "$APK" > evidence/aapt-badging.txt
          PACKAGE_LINE="$(grep '^package:' evidence/aapt-badging.txt | head -n1)"
          echo "$PACKAGE_LINE"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"
          sha256sum "$APK" | tee evidence/apk-sha256.txt
          cp "$APK" evidence/rota-certa-0.1.548-timeline-temporal-cutoff.apk

      - name: Upload corrected APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.548-timeline-temporal-cutoff-27b1a28
          retention-days: 14
          if-no-files-found: error
          path: |
            evidence/rota-certa-0.1.548-timeline-temporal-cutoff.apk
            evidence/source-head.txt
            evidence/source-diff-stat.txt
            evidence/aapt-badging.txt
            evidence/apk-sha256.txt
