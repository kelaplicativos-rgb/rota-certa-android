name: Diagnose persisted BlaBla URL chain 0.1.542

on:
  push:
    branches:
      - agent/build-public-reserve-blablacar-0.1.541
    paths:
      - '.github/workflows/passenger-timeline-geo-ux-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-persisted-url-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 45e5c8be37a155567f4e29a0307fa65c52767060
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

    steps:
      - name: Checkout exact 0.1.542 SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prove public failure and server normalization boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          grep -Fq 'versionCode = 5834' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.542"' app/build.gradle.kts
          grep -Fq 'blablaPublicUrl: normalizeBlaBlaPublicUrl(data.blablaPublicUrl, cleanText(data.blablaTripId, 160)) || null' trip-platform/functions/index.js
          grep -Fq 'blablaPublicUrl: normalizeCanonicalBoundBlaBlaPublicUrl0423(payload.blablaPublicUrl, cleanText(payload.blablaTripId, 160))' trip-platform/functions/index.js
          grep -Fq 'blablaPublicUrl = canonicalBoundBlaBlaPublicUrl0423(trip.blablaPublicUrl, trip.blablaTripId).orEmpty()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PrivateAgendaMirror0434.kt

      - name: Configure Firebase service account
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
          else
            echo 'Firebase service account credential is missing.' >&2
            exit 3
          fi
          chmod 600 /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Install existing Functions dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix trip-platform/functions ci --ignore-scripts --no-audit --no-fund

      - name: Classify persisted URL presence without logging URL or identity values
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$PWD/trip-platform/functions/node_modules" node <<'JS'
          const fs = require('fs');
          const { initializeApp, applicationDefault } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');
          initializeApp({ credential: applicationDefault() });
          const db = getFirestore();
          const present = (v) => typeof v === 'string' && v.trim().length > 0;
          (async () => {
            const tripSnap = await db.collection('trips').where('driverUsername', '==', 'ezequiel').limit(300).get();
            const mirrorSnap = await db.collection('tripPrivateMirrors0434').where('driverUsername', '==', 'ezequiel').limit(300).get();
            const stats = {
              tripsTotal: tripSnap.size,
              rootBlaBlaTripIdPresent: 0,
              rootBlaBlaPublicUrlPresent: 0,
              rootBlaBlaManageUrlPresent: 0,
              canonicalProjectionPresent: 0,
              canonicalProjectionBlaBlaTripIdPresent: 0,
              canonicalProjectionBlaBlaPublicUrlPresent: 0,
              privateMirrorsTotal: mirrorSnap.size,
              privateMirrorBlaBlaTripIdPresent: 0,
              privateMirrorBlaBlaPublicUrlPresent: 0,
            };
            for (const doc of tripSnap.docs) {
              const d = doc.data() || {};
              if (present(d.blablaTripId)) stats.rootBlaBlaTripIdPresent++;
              if (present(d.blablaPublicUrl)) stats.rootBlaBlaPublicUrlPresent++;
              if (present(d.blablaManageUrl)) stats.rootBlaBlaManageUrlPresent++;
              const p = d.canonicalPublicProjection0434;
              if (p && typeof p === 'object') {
                stats.canonicalProjectionPresent++;
                if (present(p.blablaTripId)) stats.canonicalProjectionBlaBlaTripIdPresent++;
                if (present(p.blablaPublicUrl)) stats.canonicalProjectionBlaBlaPublicUrlPresent++;
              }
            }
            for (const doc of mirrorSnap.docs) {
              const d = doc.data() || {};
              const p = d.payload && typeof d.payload === 'object' ? d.payload : {};
              if (present(p.blablaTripId)) stats.privateMirrorBlaBlaTripIdPresent++;
              if (present(p.blablaPublicUrl)) stats.privateMirrorBlaBlaPublicUrlPresent++;
            }
            fs.writeFileSync('/tmp/persisted-url-chain.json', JSON.stringify(stats, null, 2));
            console.log(JSON.stringify(stats));
            if (stats.tripsTotal < 1) process.exit(4);
          })().catch((error) => {
            console.error('diagnostic_failed', error && error.name);
            process.exit(5);
          });
          JS

      - name: Reconfirm live public API absence without logging response body
        shell: bash
        run: |
          set -euo pipefail
          curl -L --retry 5 --retry-delay 2 --fail --silent --show-error 'https://rota-certa-7ccc8.web.app/v1/public/agenda/ezequiel?diag=0542-persisted-chain' -o /tmp/live-agenda.json
          node <<'JS'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/live-agenda.json','utf8'));
          const trips = Array.isArray(body.trips) ? body.trips : [];
          const stats = {
            totalTrips: trips.length,
            publicBlaBlaUrlPresent: trips.filter((t) => String(t?.blablaPublicUrl || '').trim()).length,
          };
          fs.writeFileSync('/tmp/live-public-url-count.json', JSON.stringify(stats, null, 2));
          console.log(JSON.stringify(stats));
          if (stats.totalTrips < 1) process.exit(6);
          JS

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.542-persisted-blablacar-url-chain
          path: |
            /tmp/persisted-url-chain.json
            /tmp/live-public-url-count.json
          retention-days: 3
          if-no-files-found: error
