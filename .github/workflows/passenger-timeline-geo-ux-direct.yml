name: Diagnose public BlaBla URL shape 0.1.542

on:
  push:
    branches:
      - agent/build-public-reserve-blablacar-0.1.541
    paths:
      - '.github/workflows/passenger-timeline-geo-ux-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-public-url-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 45e5c8be37a155567f4e29a0307fa65c52767060
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      PREVIEW_CHANNEL: reserve-request-diag-0542

    steps:
      - name: Checkout exact 0.1.542 SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prove exact source and current validator contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          grep -Fq 'versionCode = 5834' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.542"' app/build.gradle.kts
          grep -Fq 'if (!path.startsWith("/trip/")) return "";' trip-platform/public/app.js
          grep -Fq 'const queryId = cleanText(url.searchParams.get("id"), 160);' trip-platform/functions/index.js
          grep -Fq 'if (publicOnly && path !== "/trip" && !path.startsWith("/trip/")) return "";' trip-platform/functions/index.js

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo 'Firebase credential is missing.' >&2
            exit 3
          fi

      - name: Deploy exact 0.1.542 source to isolated preview
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest hosting:channel:deploy "$PREVIEW_CHANNEL" --project "$PROJECT" --expires 1d --non-interactive --token "$FIREBASE_TOKEN" | tee /tmp/firebase-preview.txt
          else
            npx --yes firebase-tools@latest hosting:channel:deploy "$PREVIEW_CHANNEL" --project "$PROJECT" --expires 1d --non-interactive | tee /tmp/firebase-preview.txt
          fi
          PREVIEW_URL="$(grep -oE 'https://[A-Za-z0-9._-]+\.web\.app' /tmp/firebase-preview.txt | tail -1)"
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          printf '%s\n' "$PREVIEW_URL" > /tmp/preview-url.txt

      - name: Fetch live public Agenda and classify URL shapes without logging URLs
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 20); do
            code="$(curl -L -sS -o /tmp/agenda.json -w '%{http_code}' "$PREVIEW_URL/v1/public/agenda/ezequiel?diag=$TARGET_SHA" || true)"
            if [ "$code" = '200' ]; then
              ok=1
              break
            fi
            echo "agenda API not ready yet: attempt=$i http=$code"
            sleep 2
          done
          test "$ok" = '1'
          node <<'JS'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/agenda.json','utf8'));
          const trips = Array.isArray(body.trips) ? body.trips : [];
          const stats = {
            totalTrips: trips.length,
            blablaPublicUrlPresent: 0,
            blablaPublicUrlMissing: 0,
            rootTripWithIdQuery: 0,
            pathTripToken: 0,
            otherTripShape: 0,
            invalidUrl: 0,
            blablaTripIdPresent: 0,
          };
          for (const trip of trips) {
            if (String(trip?.blablaTripId || '').trim()) stats.blablaTripIdPresent += 1;
            const raw = String(trip?.blablaPublicUrl || '').trim();
            if (!raw) {
              stats.blablaPublicUrlMissing += 1;
              continue;
            }
            stats.blablaPublicUrlPresent += 1;
            try {
              const u = new URL(raw);
              const path = u.pathname.replace(/\/+$/, '').toLowerCase();
              const id = String(u.searchParams.get('id') || '').trim();
              if (path === '/trip' && id) stats.rootTripWithIdQuery += 1;
              else if (path.startsWith('/trip/') && path.split('/').filter(Boolean).length >= 2) stats.pathTripToken += 1;
              else stats.otherTripShape += 1;
            } catch (_) {
              stats.invalidUrl += 1;
            }
          }
          fs.writeFileSync('/tmp/agenda-url-shape.json', JSON.stringify(stats, null, 2));
          console.log(JSON.stringify(stats));
          if (stats.totalTrips < 1) process.exit(4);
          JS

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.542-public-url-shape-diagnostic
          path: |
            /tmp/agenda-url-shape.json
            /tmp/preview-url.txt
            /tmp/firebase-preview.txt
          retention-days: 3
          if-no-files-found: error
