name: Passenger timeline geo UX sequential persistence bridge

on:
  push:
    branches:
      - agent/passenger-timeline-geo-ux
  pull_request:
    branches:
      - agent/global-multitenant-foundation

permissions:
  contents: write

jobs:
  persist-sequential-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/passenger-timeline-geo-ux
          fetch-depth: 1
      - name: Persist reviewed sequential collector into app/src
        shell: bash
        run: |
          set -u
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          SOURCE='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt'
          RESULT='.github/sequential-persistence-result.txt'
          status=0
          python3 .github/sequential_card_patch.py > /tmp/sequential.out 2>&1 || status=$?
          {
            echo "patch_exit=$status"
            echo "source_head_before=$(git rev-parse HEAD)"
            cat /tmp/sequential.out
          } > "$RESULT"
          if [ "$status" -eq 0 ]; then
            farol_sha="$(sha256sum "$FAROL" | awk '{print $1}')"
            echo "farol_sha=$farol_sha" >> "$RESULT"
            [ "$farol_sha" = '2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560' ] || status=91
            grep -Fq 'CARD_TRAVERSAL_START' "$SOURCE" || status=92
            grep -Fq 'CARD_TRAVERSAL_COMPLETE' "$SOURCE" || status=93
            grep -Fq 'CARD_TRAVERSAL_BLOCKED' "$SOURCE" || status=94
            grep -Fq 'fixedTripLimit=false' "$SOURCE" || status=95
            if grep -Fq 'MAX_TRIPS' "$SOURCE"; then status=96; fi
          fi
          echo "final_status=$status" >> "$RESULT"
          git config user.name 'rota-certa-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add "$RESULT"
          if [ "$status" -eq 0 ]; then git add "$SOURCE"; fi
          if git diff --cached --quiet; then exit "$status"; fi
          git commit -m 'collector: persist sequential card traversal result'
          git push origin HEAD:agent/passenger-timeline-geo-ux
          exit "$status"
