name: Timeline temporal cutoff 0.1.548 materializer

on:
  push:
    branches:
      - agent/timeline-temporal-cutoff-0.1.548
    paths:
      - '.github/workflows/passenger-timeline-geo-ux-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/timeline-temporal-cutoff-0.1.548
          fetch-depth: 1

      - name: Apply Timeline UI cutoff only
        run: python3 .github/scripts/materialize-timeline-temporal-cutoff-0548.py

      - name: Prove surgical diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt"
          grep -Fq 'timelineNowMillis0548' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'isPassengerTimelineCurrentOrUpcoming0548' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt

      - name: Persist Timeline UI correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          git commit -m 'fix(timeline): hide ended trips from operational view 0.1.548'
          git push origin HEAD:agent/timeline-temporal-cutoff-0.1.548
