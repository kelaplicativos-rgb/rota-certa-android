name: Verify build public reserve request 0.1.542

on:
  push:
    branches:
      - agent/build-public-reserve-blablacar-0.1.541
    paths:
      - '.github/workflows/passenger-timeline-geo-ux-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_BRANCH: agent/public-reserve-request-0.1.542
      TARGET_SHA: 45e5c8be37a155567f4e29a0307fa65c52767060
      BASE_SHA: 0f727e58bf22fd0d6ad9e8e6c58c101c2cf58d3c
      ROTA_CERTA_GIT_SHA: 45e5c8be37a155567f4e29a0307fa65c52767060
      ROTA_CERTA_GIT_BRANCH: agent/public-reserve-request-0.1.542
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      PREVIEW_CHANNEL: reserve-request-0542
      GOOGLE_MAPS_API_KEY: public_reserve_request_0542_ci_dummy_key

    steps:
      - name: Checkout exact final SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prove surgical final source and tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$TARGET_SHA")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          printf '%s\n' "${changed[@]}" | grep -Fxq 'app/build.gradle.kts'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'trip-platform/functions/test/agenda-public-read-only-0475.test.js'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'trip-platform/public/app.js'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'trip-platform/public/index.html'
          test "$(git diff --name-only "$BASE_SHA" "$TARGET_SHA" -- app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt)" = ''
          test "$(git diff --name-only "$BASE_SHA" "$TARGET_SHA" -- app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt)" = ''
          grep -Fq 'versionCode = 5834' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.542"' app/build.gradle.kts
          grep -Fq 'reserve0541.textContent = "Fazer pedido de reserva";' trip-platform/public/app.js
          ! grep -Fq '🟢 Reservar vaga' trip-platform/public/app.js
          grep -Fq 'background:#0071eb;color:#fff' trip-platform/public/index.html
          grep -Fq '/app.js?v=0.1.542-reserve-request0542' trip-platform/public/index.html
          ! grep -Fq 'https://wa.me/' trip-platform/public/app.js
          ! grep -Fq 'Fazer reserva com o motorista' trip-platform/public/app.js
          node --check trip-platform/public/app.js
          node --test trip-platform/functions/test/agenda-public-read-only-0475.test.js

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo 'Firebase credential is missing.' >&2
            exit 3
          fi

      - name: Redeploy exact final source to preview channel only
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest hosting:channel:deploy "$PREVIEW_CHANNEL" --project "$PROJECT" --expires 1d --non-interactive --token "$FIREBASE_TOKEN" | tee /tmp/firebase-preview.txt
          else
            npx --yes firebase-tools@latest hosting:channel:deploy "$PREVIEW_CHANNEL" --project "$PROJECT" --expires 1d --non-interactive | tee /tmp/firebase-preview.txt
          fi
          PREVIEW_URL="$(grep -oE 'https://[A-Za-z0-9._-]+\.web\.app' /tmp/firebase-preview.txt | tail -1)"
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          printf '%s\n' "$PREVIEW_URL" > /tmp/preview-url.txt

      - name: Smoke preview with propagation wait
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 20); do
            code="$(curl -L -sS -o /tmp/live-app.js -w '%{http_code}' "$PREVIEW_URL/app.js?sha=$TARGET_SHA" || true)"
            if [ "$code" = '200' ] && grep -Fq 'reserve0541.textContent = "Fazer pedido de reserva";' /tmp/live-app.js; then
              ok=1
              break
            fi
            echo "preview app.js not ready yet: attempt=$i http=$code"
            sleep 2
          done
          test "$ok" = '1'
          grep -Fq 'validatedBlaBlaReservationUrl0541(item?.blablaPublicUrl)' /tmp/live-app.js
          ! grep -Fq '🟢 Reservar vaga' /tmp/live-app.js
          ! grep -Fq 'https://wa.me/' /tmp/live-app.js
          ! grep -Fq 'Fazer reserva com o motorista' /tmp/live-app.js
          ok=0
          for i in $(seq 1 20); do
            code="$(curl -L -sS -o /tmp/live-index.html -w '%{http_code}' "$PREVIEW_URL/ezequiel?sha=$TARGET_SHA" || true)"
            if [ "$code" = '200' ] && grep -Fq '/app.js?v=0.1.542-reserve-request0542' /tmp/live-index.html; then
              ok=1
              break
            fi
            echo "preview index not ready yet: attempt=$i http=$code"
            sleep 2
          done
          test "$ok" = '1'
          grep -Fq 'background:#0071eb;color:#fff' /tmp/live-index.html

      - name: Configure Firebase Android app for build only
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build exact final-SHA debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:clean :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"

      - name: Verify exact final-SHA APK identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          APK='app/build/outputs/apk/debug/app-debug.apk'
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='5834'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='0.1.542'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'Verified' /tmp/apksigner.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -Fq "$TARGET_SHA" /tmp/dex-strings.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Package final evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/rota-certa-0.1.542
          mkdir -p "$OUT"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT/rota-certa-0.1.542-5834-45e5c8be-debug.apk"
          cp /tmp/apk.sha256 /tmp/aapt.txt /tmp/apksigner.txt /tmp/preview-url.txt /tmp/firebase-preview.txt "$OUT/"
          printf '%s\n' \
            'branch=agent/public-reserve-request-0.1.542' \
            'sha=45e5c8be37a155567f4e29a0307fa65c52767060' \
            'versionName=0.1.542' \
            'versionCode=5834' \
            'package=br.com.mapeiaia.rotacerta' \
            'ctaText=Fazer pedido de reserva' \
            'ctaColor=#0071EB' \
            'reservationAuthority=BLABLACAR' \
            'whatsappReservationCta=false' \
            'productionHosting=UNCHANGED' \
            "previewUrl=$PREVIEW_URL" \
            'physicalApproval=PENDING_SAMSUNG_SM_S911B_ANDROID_16' \
            > "$OUT/build-evidence.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.542-5834-45e5c8be
          path: /tmp/rota-certa-0.1.542
          retention-days: 14
          if-no-files-found: error
