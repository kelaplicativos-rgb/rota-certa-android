name: Update Rota Certa docs 0.1.179

on:
  push:
    branches: [agent/customizable-shortcut-grid-0.1.179]
    paths:
      - .github/workflows/update-docs-0.1.179.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/customizable-shortcut-grid-0.1.179
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update project documentation
        run: python scripts/update_docs_0179.py

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md docs/DECISIONS.md
          if git diff --cached --quiet; then
            echo "Documentation already up to date"
            exit 0
          fi
          git commit -m "docs: registrar validação da versão 0.1.179"
          git push origin HEAD:agent/customizable-shortcut-grid-0.1.179
