name: Stage47 persist validated materialized app source

on:
  push:
    branches:
      - agent/stage47-r4-step7-automatic-identity
    paths:
      - .github/workflows/stage47-r4-step7-persist-materialized-source.yml

permissions:
  contents: write
  actions: read

jobs:
  persist-materialized-app-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SNAPSHOT_RUN_ID: '32403049962'
      SNAPSHOT_ARTIFACT: rota-certa-stage47-materialized-source-0.1.238-v2
      PROTECTED_FAROL_SHA256: 2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560
    steps:
      - name: Checkout current Stage47 branch source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: repo
          fetch-depth: 1

      - name: Download validated source-only snapshot
        run: |
          set -euo pipefail
          mkdir -p snapshot
          gh run download "$SNAPSHOT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SNAPSHOT_ARTIFACT" \
            --dir snapshot
          test -s snapshot/source-status.txt
          grep -Fxq 'stage47_materialized_source_v2=PASS version=0.1.238/5531 farol_untouched=true apk_generated=false' snapshot/source-status.txt
          grep -Fxq 'source_snapshot_only=true' snapshot/snapshot-metadata.txt
          grep -Fxq 'apk_generated=false' snapshot/snapshot-metadata.txt
          grep -Fxq 'patch_head=07d0997b0dbf8db051dfb648aec002a32febcf79' snapshot/snapshot-metadata.txt
          TAR=snapshot/stage47-materialized-source-0.1.238-v2.tar.gz
          test -s "$TAR"
          EXPECTED="$(awk '{print $1}' snapshot/source-archive.sha256)"
          ACTUAL="$(sha256sum "$TAR" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          echo "validated_source_archive_sha256=$ACTUAL"

      - name: Persist exact materialized app tree without touching FAROL
        run: |
          set -euo pipefail
          mkdir -p materialized
          tar -xzf snapshot/stage47-materialized-source-0.1.238-v2.tar.gz -C materialized
          FAROL_REL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          test "$(sha256sum "repo/$FAROL_REL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          test "$(sha256sum "materialized/$FAROL_REL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          rsync -a --delete \
            --exclude='src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt' \
            materialized/app/ repo/app/
          test "$(sha256sum "repo/$FAROL_REL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          git -C repo diff --exit-code -- "$FAROL_REL"
          grep -Fq 'versionCode = 5531' repo/app/build.gradle.kts
          grep -Fq 'versionName = "0.1.238"' repo/app/build.gradle.kts
          test -s repo/app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          test -s repo/app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq '+ Passageiro rápido' repo/app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'TIMELINE_EXTERNAL_ENTRY' repo/app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollector.kt
          git -C repo status --short
          test -n "$(git -C repo status --porcelain -- app)"

      - name: Commit persisted app source to this branch
        run: |
          set -euo pipefail
          cd repo
          git config user.name 'Rota Certa Stage47 source materializer'
          git config user.email 'actions@users.noreply.github.com'
          git add app
          git diff --cached --exit-code -- app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          git commit -m 'Stage47 persist validated materialized app source'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'stage47_persisted_app_source=PASS'
          echo 'source_snapshot_run=32403049962'
          echo 'apk_generated=false'
