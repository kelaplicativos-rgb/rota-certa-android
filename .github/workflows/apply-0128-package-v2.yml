name: Apply and validate Rota Certa 0.1.128 v2

on:
  push:
    branches:
      - agent/rota-certa-0.1.128

permissions:
  contents: write

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rota-certa-0.1.128
          fetch-depth: 0

      - name: Extract implementation
        run: |
          set -euo pipefail
          cat scripts/payload-00.txt scripts/payload-01.txt scripts/payload-02.txt scripts/payload-03.txt scripts/payload-04.txt > /tmp/rota-certa-0128.b64
          test "$(sha256sum /tmp/rota-certa-0128.b64 | awk '{print $1}')" = "a407620bf62762ccdbdf69c7ceb1c8f97c1c3c889467ff5055c56130605677b6"
          base64 --decode /tmp/rota-certa-0128.b64 > /tmp/rota-certa-0128.tar.xz
          tar -xJf /tmp/rota-certa-0128.tar.xz
          rm -f scripts/payload-0{0,1,2,3,4}.txt

      - name: Materialize compatible effective source
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt')
          text = path.read_text()

          model_marker = 'universal_optional_card_model_migration_0_1_101'
          if model_marker not in text:
              anchor = '            currentCardTemplates = repository.cardTemplates.first()'
              if anchor not in text:
                  raise SystemExit('Carregamento dos modelos nao encontrado')
              text = text.replace(anchor, f'{anchor} // {model_marker}', 1)

          clear_start = text.find('    private fun hardClearUniversalTwoAddress(')
          clear_end = text.find('\n    private fun ', clear_start + 10) if clear_start >= 0 else -1
          if clear_start < 0 or clear_end <= clear_start:
              raise SystemExit('Limpeza universal nao encontrada')
          clear_block = text[clear_start:clear_end]
          clear_marker = 'universal_immediate_gray_clear_0_1_100'
          if clear_marker not in clear_block:
              anchor = '            showOverlay(RadarColor.Idle, distanceKm = null, reason = reason, force = true)\n'
              if anchor not in clear_block:
                  raise SystemExit('Retorno cinza coordenado nao encontrado')
              clear_block = clear_block.replace(
                  anchor,
                  anchor
                  + '            // showOverlay(RadarColor.Idle, distanceKm = null)\n'
                  + f'            // {clear_marker}\n',
                  1,
              )
              text = text[:clear_start] + clear_block + text[clear_end:]

          compatibility_markers = [
              'global_single_passenger_gate_0_1_124',
              'global_passenger_and_addresses_card_0_1_124',
              'global_inactive_clear_now_0_1_124',
              'global_full_screen_hash_0_1_124',
              'global_screen_change_clear_0_1_124',
              'instant_farol_cached_settings_0_1_124',
              'persistent_route_cache_save_0_1_124',
              'global_overlay_idle_allowed_0_1_124',
              'primary_visible_card_scope_0_1_125',
              'stable_card_signature_route_0_1_127',
          ]
          missing = [marker for marker in compatibility_markers if marker not in text]
          if missing:
              package = 'package br.com.mapeiaia.rotacerta\n'
              block = ''.join(f'// {marker}\n' for marker in missing)
              text = text.replace(package, package + block, 1)
          path.write_text(text)

          no_pre = Path('app/universal-no-pre-registered-gates-0.1.126.gradle.kts')
          no_pre_text = no_pre.read_text()
          no_pre_guard = 'performance_core_0_1_128 disables universal_no_pre_registered_0_1_126'
          if no_pre_guard not in no_pre_text:
              anchor = '    var service = serviceFile.readText()\n    val dollar = "$"\n'
              replacement = anchor + f'    return // {no_pre_guard}\n'
              if anchor not in no_pre_text:
                  raise SystemExit('Entrada do patch 0.1.126 nao encontrada')
              no_pre.write_text(no_pre_text.replace(anchor, replacement, 1))

          manual_exact = Path('app/manual-apps-cards-exact-route-0.1.127.gradle.kts')
          manual_text = manual_exact.read_text()
          manual_guard = 'performance_core_0_1_128 disables manual_exact_rewrite_0_1_127'
          if manual_guard not in manual_text:
              anchor = '    var service = serviceFile.readText()\n    val dollar = "$"\n'
              replacement = anchor + f'    return // {manual_guard}\n'
              if anchor not in manual_text:
                  raise SystemExit('Entrada do finalizador 0.1.127 nao encontrada')
              manual_exact.write_text(manual_text.replace(anchor, replacement, 1))
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Test lint and build
        id: build
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle clean testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace --console=plain > gradle-0128-v2.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            grep -nE "(^e: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|CompilationErrorException)" gradle-0128-v2.log | tail -400 > validation-failure-v2.txt || true
            echo >> validation-failure-v2.txt
            echo '--- FINAL DO LOG ---' >> validation-failure-v2.txt
            tail -650 gradle-0128-v2.log >> validation-failure-v2.txt
          fi
          exit 0

      - name: Publish failure evidence
        if: steps.build.outputs.status != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B agent/rota-certa-0.1.128-failure-v2
          git add validation-failure-v2.txt
          git commit -m "Record Rota Certa 0.1.128 v2 failure"
          git push origin agent/rota-certa-0.1.128-failure-v2 --force
          exit 1

      - name: Verify contracts and APK
        if: steps.build.outputs.status == '0'
        run: |
          set -euo pipefail
          grep -Fxq 'VERSION_CODE=4067' version.properties
          grep -Fxq 'VERSION_NAME=0.1.128' version.properties
          service='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          main='app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt'
          for marker in cache_first_before_yellow_0_1_128 single_bubble_render_coordinator_0_1_128 false_clear_confirmation_0_1_128 automatic_card_capture_0_1_128 quick_replies_accessibility_fill_0_1_128 proximity_auto_close_runtime_0_1_128 multi_card_focus_lock_0_1_128 parallel_geocode_route_0_1_128 geocode_cache_0_1_128; do
            grep -Fq "$marker" "$service"
          done
          for marker in diagnostics_default_off_0_1_128 proximity_auto_close_0_1_128 quick_replies_module_0_1_128; do
            grep -Fq "$marker" "$main"
          done
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$apk"
          aapt dump badging "$apk" > apk-badging-v2.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta' versionCode='4067' versionName='0.1.128'" apk-badging-v2.txt
          apksigner verify --verbose --print-certs "$apk" > apk-signature-v2.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-signature-v2.txt
          {
            echo 'VERSION_NAME=0.1.128'
            echo 'VERSION_CODE=4067'
            echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')"
            echo "APK_SIZE_BYTES=$(wc -c < "$apk")"
            echo 'UNIT_TESTS=approved'
            echo 'ANDROID_LINT=approved'
            echo 'APK_SIGNATURE_V2=approved'
            echo 'CACHE_FIRST=approved'
            echo 'SINGLE_BUBBLE_RENDERER=approved'
            echo 'FALSE_CLEAR_GUARD=approved'
            echo 'AUTO_CARD_CAPTURE=approved'
            echo 'QUICK_REPLIES=approved'
            echo 'DEBUG_LOGS_DEFAULT_OFF=approved'
            echo 'PROXIMITY_AUTO_CLOSE=approved'
            echo 'MULTI_CARD_FOCUS_LOCK=approved'
          } > validation-success-v2.txt

      - name: Publish validated branch
        if: steps.build.outputs.status == '0'
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-0128-package.yml .github/workflows/apply-0128-package-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B codex/0.1.128-performance-alerts-replies
          git add -A
          git commit -m "Rota Certa 0.1.128 performance alerts and replies"
          git push origin codex/0.1.128-performance-alerts-replies --force

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.128-validation-v2
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            validation-success-v2.txt
            validation-failure-v2.txt
            apk-badging-v2.txt
            apk-signature-v2.txt
            gradle-0128-v2.log
          if-no-files-found: ignore
