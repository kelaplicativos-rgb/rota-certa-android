name: Agenda global trace contract once

on:
  push:
    branches:
      - agent/passenger-timeline-geo-ux
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-agenda-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kelaplicativos-rgb/rota-certa-android
          ref: agent/passenger-timeline-geo-ux
          fetch-depth: 1

      - name: Verify protected FAROL before patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"

      - name: Apply Agenda global trace contract
        shell: bash
        run: |
          set -euo pipefail
          if test -f app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaTrace.kt \
             && grep -Fq 'versionName = "0.1.273"' app/build.gradle.kts \
             && grep -Fq '.agendaInteractionTrace(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt; then
            echo 'Agenda global trace contract already materialized.'
            exit 0
          fi
          echo ' SFRNTCBlIHJlY29uY2lsaWHDp8OjbyBkZSB2YWdhcyBjb250aW51YW0gdXNhbmRvIHNldXMgZXZlbnRvcyBlc3BlY8OtZmljb3MuIEV4ZW1wb3M6XG4tIGBTWU5DX1NUQVJUYCAvIGBTWU5DX0VORGA7XG4tIGBCTEFCTEF DQVJfTkVUV09SS19SRVNQT05TRV9DQVBUVVJF RGA7XG4tIGBCTEFCTEF                cpCgpyZXBsYWNlX29uY2UoJ2FwcC9zcmMvbWFpbi9qYXZhL2JyL2NvbS9tYXBlaWFpYS9yb3RhY2VydGEvdHJpcHMvUGFzc2VuZ2VyVGltZWxpbmVVaS5rdCcsICcgICAgICAgICAgICAgICAgICAgIG9uQ2xpY2sgPSB7IGJvYXJkaW5nQWRkcmVzc0VkaXRSb3cgPSBwYXNzZW5nZXIgfSxcbi  ' | base64 -d > /tmp/agenda_trace_patch.py
          python3 /tmp/agenda_trace_patch.py
          git diff --check
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"

      - name: Commit exact Agenda trace patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No materialization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/build.gradle.kts \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaTrace.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/ResponsiveTripActions.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripRoutePlannerUi.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripQuickPassengerUi.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripGlobalPassengerFlow0256.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripAndroidEntryPoints.kt \
            app/src/test/java/br/com/mapeiaia/rotacerta/trips/AgendaTraceContract0273Test.kt \
            docs/AGENDA_GLOBAL_TRACE_CONTRACT.md \
            .github/workflows/direct-source-branch-apk.yml
          git diff --cached --check
          git commit -m 'feat(agenda): global forensic trace contract 0.1.273'
          git push origin HEAD:agent/passenger-timeline-geo-ux
