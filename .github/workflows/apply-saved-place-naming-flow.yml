name: Apply Saved Place Naming Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-saved-place-naming-flow.yml'

permissions:
  contents: write

jobs:
  patch-build:
    name: Patch naming flow and build APK
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Kotlin patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              return text.replace(old, new, 1)

          main_path = Path("app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt")
          main = main_path.read_text()

          main = replace_once(
              main,
              '''class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContent {
            MaterialTheme(colorScheme = darkColorScheme()) {
                RotaCertaApp()
            }
        }
    }
}

@Composable
fun RotaCertaApp() {''',
