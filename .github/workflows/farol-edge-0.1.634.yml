name: FAROL Edge 0.1.634 APK

on:
  push:
    branches:
      - 'agent/farol-edge-0.1.634'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      GOOGLE_MAPS_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then exit 0; fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -x "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/cmdline-tools/latest/bin/sdkmanager" || true
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit regression stress benchmark
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace

      - name: Assemble exact source APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Prove source and APK identity
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -s "$APK"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'releaseVersionName = "0.1.634"' app/build.gradle.kts
          grep -Fq 'releaseVersionCode = 5_925' app/build.gradle.kts
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "branch=$GITHUB_REF_NAME"
            echo "commit=$GITHUB_SHA"
            echo "versionName=0.1.634"
            echo "versionCode=5925"
            echo "variant=debug"
            echo "package=br.com.mapeiaia.rotacerta"
            echo "apk=$APK"
            echo "apk_sha256=$APK_SHA256"
          } | tee farol-edge-proof.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-farol-edge-0.1.634-${{ github.sha }}
          path: |
            ${{ steps.proof.outputs.apk }}
            farol-edge-proof.txt
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 14
