name: Stage47 one-shot persist harvester navigation watchdog

on:
  pull_request:
    branches:
      - agent/stage47-r4-unified-occupancy-step6-validation-apk

permissions:
  contents: write

jobs:
  persist-navigation-watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR head directly
        uses: actions/checkout@v4
        with:
          ref: agent/stage47-r4-step7-automatic-identity
          fetch-depth: 0

      - name: Persist focused harvester navigation watchdog
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaManualSeatAutomation.kt')
          text = p.read_text(encoding='utf-8')
          if 'HARVEST_NAVIGATION_TIMEOUT' in text:
              print('navigation watchdog already persisted')
              raise SystemExit(0)

          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one marker, got {count}')
              text = text.replace(old, new, 1)

          once(
          '''    private var passengerCallActionTriggered = false
              private var interceptedPassengerPhone: String? = null
          ''',
          '''    private var passengerCallActionTriggered = false
              private var interceptedPassengerPhone: String? = null
              private var navigationGeneration = 0
              private var navigationPending = false
              private var ridesNavigationTimeouts = 0
          ''',
          'navigation state')

          once(
          '''            override fun onPageFinished(view: WebView, url: String) {
                      super.onPageFinished(view, url)
                      if (!isBlaBla(url) || busy) return
                      view.postDelayed({ handlePage() }, 900)
                  }
          ''',
          '''            override fun onPageFinished(view: WebView, url: String) {
                      super.onPageFinished(view, url)
                      if (!isBlaBla(url)) return
                      navigationPending = false
                      if (phase == Phase.RIDES) ridesNavigationTimeouts = 0
                      if (busy) return
                      view.postDelayed({ handlePage() }, 900)
                  }
          ''',
          'page finished watchdog release')

          once(
          '''        setContentView(root)
              webView.loadUrl(RIDES_URL)
          }

              private fun interceptPhoneNavigation''',
          '''        setContentView(root)
              loadHarvestUrl(RIDES_URL, "rides")
          }

              private fun loadHarvestUrl(url: String, label: String) {
                  navigationGeneration++
                  val generation = navigationGeneration
                  val expectedPhase = phase
                  navigationPending = true
                  webView.loadUrl(url)
                  webView.postDelayed({
                      if (!navigationPending || navigationGeneration != generation || phase != expectedPhase || isFinishing) return@postDelayed
                      navigationPending = false
                      busy = false
                      UnifiedDebugEventStore.record(
                          "HARVEST_NAVIGATION_TIMEOUT",
                          packageName,
                          "account=${account.displayLabel} phase=${expectedPhase.name.lowercase()} label=$label tripIndex=$tripIndex passengerIndex=$passengerIndex editIndex=$editIndex optionIndex=$optionIndex",
                      )
                      when (expectedPhase) {
                          Phase.RIDES -> {
                              if (ridesNavigationTimeouts < MAX_RIDES_NAVIGATION_TIMEOUTS) {
                                  ridesNavigationTimeouts++
                                  loadHarvestUrl(RIDES_URL, "rides_retry")
                              } else {
                                  UnifiedDebugEventStore.record(
                                      "MHTML_HARVEST_ABORTED",
                                      packageName,
                                      "account=${account.displayLabel} reason=rides_navigation_timeout",
                                  )
                                  finishHarvest()
                              }
                          }
                          Phase.TRIP -> {
                              val tripId = tripHrefs.getOrNull(tripIndex)?.let(::tripIdFromHref).orEmpty()
                              UnifiedDebugEventStore.record(
                                  "HARVEST_BLOCK_UNREADABLE",
                                  packageName,
                                  "account=${account.displayLabel} block=trip tripId=$tripId reason=navigation_timeout",
                              )
                              tripIndex++
                              loadNextTrip()
                          }
                          Phase.PASSENGER_CARD, Phase.PASSENGER -> {
                              val target = passengerTargets.getOrNull(passengerIndex)
                              UnifiedDebugEventStore.record(
                                  "HARVEST_BLOCK_UNREADABLE",
                                  packageName,
                                  "account=${account.displayLabel} block=passenger tripId=${target?.tripId.orEmpty()} reason=navigation_timeout",
                              )
                              passengerIndex++
                              passengerCallActionTriggered = false
                              interceptedPassengerPhone = null
                              loadNextPassenger()
                          }
                          Phase.EDIT -> {
                              val tripId = editUrls.getOrNull(editIndex)?.let(::tripIdFromEditHref).orEmpty()
                              UnifiedDebugEventStore.record(
                                  "HARVEST_BLOCK_UNREADABLE",
                                  packageName,
                                  "account=${account.displayLabel} block=edit tripId=$tripId reason=navigation_timeout",
                              )
                              editIndex++
                              loadNextEdit()
                          }
                          Phase.OPTIONS -> {
                              val tripId = optionUrls.getOrNull(optionIndex)?.let(::tripIdFromOptionsHref).orEmpty()
                              UnifiedDebugEventStore.record(
                                  "HARVEST_BLOCK_UNREADABLE",
                                  packageName,
                                  "account=${account.displayLabel} block=options tripId=$tripId reason=navigation_timeout",
                              )
                              optionIndex++
                              loadNextOption()
                          }
                      }
                  }, NAVIGATION_TIMEOUT_MS)
              }

              private fun interceptPhoneNavigation''',
          'watchdog helper')

          once(
          '''            statusView.text = "${account.displayLabel} • resumo ${tripIndex + 1}/${tripHrefs.size}"
                  webView.loadUrl(href)
          ''',
          '''            statusView.text = "${account.displayLabel} • resumo ${tripIndex + 1}/${tripHrefs.size}"
                  loadHarvestUrl(href, "trip")
          ''',
          'trip tracked load')

          once(
          '''            if (target.href.isNotBlank()) {
                      phase = Phase.PASSENGER
                      webView.loadUrl(target.href)
                  } else if (target.cardIndex >= 0) {
                      phase = Phase.PASSENGER_CARD
                      webView.loadUrl(target.tripHref)
          ''',
          '''            if (target.href.isNotBlank()) {
                      phase = Phase.PASSENGER
                      loadHarvestUrl(target.href, "passenger")
                  } else if (target.cardIndex >= 0) {
                      phase = Phase.PASSENGER_CARD
                      loadHarvestUrl(target.tripHref, "passenger_card")
          ''',
          'passenger tracked load')

          once(
          '''            statusView.text = "${account.displayLabel} • editar ${editIndex + 1}/${editUrls.size}"
                  webView.loadUrl(href)
          ''',
          '''            statusView.text = "${account.displayLabel} • editar ${editIndex + 1}/${editUrls.size}"
                  loadHarvestUrl(href, "edit")
          ''',
          'edit tracked load')

          once(
          '''            statusView.text = "${account.displayLabel} • lugares ${optionIndex + 1}/${optionUrls.size}"
                  webView.loadUrl(href)
          ''',
          '''            statusView.text = "${account.displayLabel} • lugares ${optionIndex + 1}/${optionUrls.size}"
                  loadHarvestUrl(href, "options")
          ''',
          'options tracked load')

          once(
          '''        private const val MAX_EDIT_LINK_READ_ATTEMPTS = 6
                  private const val RETRY_MS = 800L
          ''',
          '''        private const val MAX_EDIT_LINK_READ_ATTEMPTS = 6
                  private const val MAX_RIDES_NAVIGATION_TIMEOUTS = 1
                  private const val NAVIGATION_TIMEOUT_MS = 12_000L
                  private const val RETRY_MS = 800L
          ''',
          'watchdog constants')

          for marker in (
              'HARVEST_NAVIGATION_TIMEOUT',
              'NAVIGATION_TIMEOUT_MS = 12_000L',
              'loadHarvestUrl(href, "edit")',
              'reason=navigation_timeout',
          ):
              if marker not in text:
                  raise SystemExit(f'missing watchdog marker: {marker}')

          p.write_text(text, encoding='utf-8')
          PY

          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | awk '{print $1}')" = '2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560'
          git config user.name 'Rota Certa CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaManualSeatAutomation.kt
          if git diff --cached --quiet; then
            echo 'no source change needed'
            exit 0
          fi
          git commit -m 'fix(stage47): advance harvester after navigation timeout'
          git push origin HEAD:agent/stage47-r4-step7-automatic-identity
