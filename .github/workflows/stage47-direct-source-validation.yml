name: Stage47 direct persisted-source validation

on:
  pull_request:
    branches:
      - agent/stage47-r4-unified-occupancy-step6-validation-apk

permissions:
  contents: read

jobs:
  validate-direct-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOOGLE_MAPS_API_KEY: stage47_ci_dummy_key
      PROTECTED_FAROL_SHA256: 2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560
    steps:
      - name: Checkout PR source directly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify persisted Stage47 source authority
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          UI='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt'
          QUICK='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripQuickPassengerUi.kt'
          ACTIVITY='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt'
          DIRECTION='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineBaseDirection.kt'
          COLLECTOR='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt'
          PARSER='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDomParsing.kt'
          AUTOMATION='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaManualSeatAutomation.kt'
          TEST='app/src/test/java/br/com/mapeiaia/rotacerta/trips/TripTimelineExternalQuickPassengerStage47Test.kt'
          DIRECTION_TEST='app/src/test/java/br/com/mapeiaia/rotacerta/trips/TripTimelineBaseDirectionStage47Test.kt'
          AUTOMATION_TEST='app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaManualSeatAutomationStage47Test.kt'
          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          grep -Fq 'versionCode = 5537' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.244"' app/build.gradle.kts
          test -s "$UI"
          test -s "$QUICK"
          test -s "$ACTIVITY"
          test -s "$DIRECTION"
          test -s "$COLLECTOR"
          test -s "$PARSER"
          test -s "$AUTOMATION"
          test -s "$TEST"
          test -s "$DIRECTION_TEST"
          test -s "$AUTOMATION_TEST"
          grep -Fq 'timelineQuickPassengerOptions(entries, trips)' "$UI"
          grep -Fq 'ExternalTripCapacitySetup(entry, store, onChanged)' "$UI"
          grep -Fq 'canonicalTimelineProfileUuid(entry)' "$UI"
          grep -Fq 'findExistingTimelineBackingTrip(entry, store.trips())' "$UI"
          grep -Fq 'ResponsiveTripAction("Nova viagem", onClick = onCreateTrip)' "$UI"
          grep -Fq 'timelineBaseDirectionLabel(entry, trip, directionGeo' "$UI"
          grep -Fq 'PASSENGER_WHATSAPP_OPEN' "$UI"
          grep -Fq 'https://wa.me/' "$UI"
          grep -Fq 'BlaBlaManualSeatSyncCoordinator.enqueueForManualBooking' "$QUICK"
          grep -Fq 'seatDelta = -plan.passenger.seats' "$QUICK"
          grep -Fq 'seatDelta = booking.seats' "$QUICK"
          grep -Fq 'else -> TripScreen.TIMELINE' "$ACTIVITY"
          grep -Fq 'Ida • saindo da base' "$DIRECTION"
          grep -Fq 'Volta • retornando à base' "$DIRECTION"
          grep -Fq 'Neutra • não envolve a base' "$DIRECTION"
          grep -Fq 'RIDES_BATCH_EVIDENCE' "$COLLECTOR"
          grep -Fq 'TRIP_BATCH_READY' "$COLLECTOR"
          grep -Fq 'TRIP_DETAIL_FALLBACK' "$COLLECTOR"
          grep -Fq 'passengerRosterReportedComplete' "$PARSER"
          grep -Fq 'get() = passengerRosterReportedComplete' "$PARSER"
          grep -Fq 'passenger_roster_complete = candidate.passengerRosterComplete || detail.passengerRosterComplete' "$PARSER"
          ! grep -Fq 'passenger_roster_complete = false' "$PARSER"
          grep -Fq 'MHTML_ARCHIVE_SAVED' "$AUTOMATION"
          grep -Fq 'MHTML_ARCHIVE_TIMEOUT' "$AUTOMATION"
          grep -Fq 'MHTML_HARVEST_COMPLETE' "$AUTOMATION"
          grep -Fq 'HARVEST_RIDES_CAPTURED' "$AUTOMATION"
          grep -Fq 'HARVEST_TRIP_CAPTURED' "$AUTOMATION"
          grep -Fq 'HARVEST_PASSENGER_CAPTURED' "$AUTOMATION"
          grep -Fq 'HARVEST_EDIT_CAPTURED' "$AUTOMATION"
          grep -Fq 'SEAT_OPTIONS_CAPTURED' "$AUTOMATION"
          grep -Fq 'HARVEST_TRIP_ENRICHED' "$AUTOMATION"
          grep -Fq 'HARVEST_BLOCK_UNREADABLE' "$AUTOMATION"
          grep -Fq 'reason=options_link_missing' "$AUTOMATION"
          grep -Fq 'MAX_EDIT_LINK_READ_ATTEMPTS = 6' "$AUTOMATION"
          ! grep -Fq 'optionUrlByTrip[it] = optionsUrlForTrip(it)' "$AUTOMATION"
          grep -Fq 'EXTERNAL_SEAT_SYNC_QUEUED' "$AUTOMATION"
          grep -Fq 'EXTERNAL_SEAT_SYNC_VERIFIED' "$AUTOMATION"
          grep -Fq 'BookingSource.PRIVATE' "$AUTOMATION"
          grep -Fq 'BookingSource.OTHER' "$AUTOMATION"
          grep -Fq 'options-before' "$AUTOMATION"
          grep -Fq 'options-after' "$AUTOMATION"
          grep -Fq 'BlaBlaMhtmlHarvestActivity' app/src/main/AndroidManifest.xml
          grep -Fq 'BlaBlaManualSeatSyncActivity' app/src/main/AndroidManifest.xml
          ! grep -Fq 'val options = entries.mapNotNull' "$UI"
          test ! -e stage47/source-patches/external-quick-passenger-direct-source.patch
          test ! -e .github/workflows/stage47-direct-source-external-quick-passenger-apply.yml
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'stage47-direct-source-unified-timeline*.yml' -print -quit)"
          echo 'stage47_direct_source_authority=PASS version=0.1.244/5537'
          echo 'fixed_historical_source_checkout=false'
          echo 'stage47_materializer_used=false'
          echo 'manual_external_seat_ui_sync_experimental=true'
          echo 'official_blablacar_write_api_claimed=false'
          echo 'mhtml_private_archive=true'
          echo 'harvester_real_options_link_only=true'
          echo 'mhtml_archive_timeout_guard=true'
          echo 'harvester_blocks_verified_by_source=true'
          echo 'whatsapp_passenger_link_preserved=true'
          echo 'farol_untouched=true'
          echo 'apk_generated=false'

      - name: Compile and run direct-source unit tests
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripTimelineExternalQuickPassengerStage47Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripTimelineBaseDirectionStage47Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripQuickPassengerStage47R4Step4Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripBlaBlaCollectorStage47R4Step5Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaManualSeatAutomationStage47Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace
          echo 'stage47_direct_source_tests=PASS'
          echo 'apk_generated=false'

      - name: Reconfirm FAROL after direct-source compile
        run: |
          set -euo pipefail
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          echo 'farol_sha256=2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560'
          echo 'stage47_direct_source_validation=PASS version=0.1.244/5537'
          echo 'apk_generated=false'
