name: Stage47 direct persisted-source validation 0.1.249

on:
  pull_request:
    branches:
      - agent/stage47-r4-unified-occupancy-step6-validation-apk

permissions:
  contents: read

jobs:
  validate-direct-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOOGLE_MAPS_API_KEY: stage47_ci_dummy_key
      PROTECTED_FAROL_SHA256: 2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560
    steps:
      - name: Checkout PR source directly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify deterministic persisted Stage47 source authority
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          AUTOMATION='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaManualSeatAutomation.kt'
          DYNAMIC='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt'
          WATCHDOG='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaHarvestNavigationWatchdogProvider.kt'
          MANIFEST='app/src/main/AndroidManifest.xml'
          ASSOCIATION_TEST='app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaHarvestAssociationTest.kt'

          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          grep -Fq 'versionCode = 5542' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.249"' app/build.gradle.kts
          test -s "$AUTOMATION"
          test -s "$DYNAMIC"
          test -s "$WATCHDOG"
          test -s "$ASSOCIATION_TEST"

          grep -Fq 'MHTML_ARCHIVE_TIMEOUT' "$AUTOMATION"
          grep -Fq 'MHTML_HARVEST_COMPLETE' "$AUTOMATION"
          grep -Fq 'HARVEST_PASSENGER_CAPTURED' "$AUTOMATION"
          grep -Fq 'HARVEST_EDIT_CAPTURED' "$AUTOMATION"
          grep -Fq 'SEAT_OPTIONS_CAPTURED' "$AUTOMATION"
          grep -Fq 'PASSENGER_TEL_INTERCEPTED' "$AUTOMATION"
          grep -Fq 'externalDialerOpened=false' "$AUTOMATION"
          grep -Fq 'HARVEST_EVALUATION_TIMEOUT' "$AUTOMATION"
          grep -Fq 'HARVEST_USER_BACK_RECOVERY' "$AUTOMATION"
          grep -Fq 'EVALUATION_TIMEOUT_MS = 6_000L' "$AUTOMATION"
          grep -Fq 'cancel=false partialEvidencePreserved=true' "$AUTOMATION"

          grep -Fq 'navigationGeneration++' "$AUTOMATION"
          grep -Fq 'loadTrackedUrl(' "$AUTOMATION"
          grep -Fq 'HARVEST_STALE_CALLBACK_IGNORED' "$AUTOMATION"
          grep -Fq 'HARVEST_PAGE_IDENTITY_MISMATCH' "$AUTOMATION"
          grep -Fq 'association_conflict' "$AUTOMATION"
          grep -Fq 'fun passengerEvidenceKey(accountId: String, tripId: String, passengerKey: String)' "$AUTOMATION"
          grep -Fq 'enrichPassenger(tripId, passenger)' "$AUTOMATION"
          grep -Fq 'preservedIncomplete=0' "$AUTOMATION"
          grep -Fq 'deterministicHarvest=true' "$AUTOMATION"
          grep -Fq 'deterministicJoin=true' "$AUTOMATION"
          grep -Fq 'requiresSemanticProof' "$AUTOMATION"
          grep -Fq 'editHref: String = ""' "$AUTOMATION"
          grep -Fq 'tripIdFromEditHref(href) == target.tripId' "$AUTOMATION"
          grep -Fq 'tripIdFromOptionsHref(optionHref) == target.tripId' "$AUTOMATION"
          ! grep -Fq 'passengerEvidence[canonicalHref' "$AUTOMATION"
          ! grep -Fq 'Intent(Intent.ACTION_CALL' "$AUTOMATION"
          ! grep -Fq 'Intent(Intent.ACTION_DIAL' "$AUTOMATION"

          grep -Fq 'MAX_TRIP_ROSTER_READ_ATTEMPTS = 5' "$AUTOMATION"
          grep -Fq 'result.passengers.isEmpty() && !result.rosterComplete' "$AUTOMATION"
          grep -Fq 'rosterContainers.length > 0 && !hasMore' "$AUTOMATION"
          grep -Fq 'rosterContainers.length > 0 && !hasMore' "$DYNAMIC"
          grep -Fq 'MAX_PASSENGER_PAGE_RELOAD_ATTEMPTS = 1' "$AUTOMATION"
          grep -Fq 'PASSENGER_PAGE_RELOAD' "$AUTOMATION"
          grep -Fq 'passenger_evidence_not_ready' "$AUTOMATION"

          grep -Fq 'HARVEST_NAVIGATION_WATCHDOG_ATTACHED' "$WATCHDOG"
          grep -Fq 'HARVEST_NAVIGATION_TIMEOUT' "$WATCHDOG"
          grep -Fq 'HARVEST_STALE_PAGE_FINISHED_IGNORED' "$WATCHDOG"
          grep -Fq 'NAVIGATION_TIMEOUT_MS = 12_000L' "$WATCHDOG"
          grep -Fq 'delegate.onPageFinished(webView, current)' "$WATCHDOG"
          grep -Fq 'syntheticPageFinished=true' "$WATCHDOG"
          grep -Fq 'externalNavigation=false' "$WATCHDOG"
          ! grep -Fq 'ACTION_CALL' "$WATCHDOG"
          ! grep -Fq 'ACTION_DIAL' "$WATCHDOG"
          grep -Fq 'BlaBlaHarvestNavigationWatchdogProvider' "$MANIFEST"
          grep -Fq '${applicationId}.blablacar.harvest.watchdog' "$MANIFEST"

          test ! -e .github/workflows/stage47-persist-passenger-phone.yml
          test ! -e .github/workflows/stage47-apply-harvester-recovery.yml
          test ! -e .github/workflows/stage47-export-authoritative-source.yml
          test ! -e .github/patches/stage47-harvester-recovery.patch
          test ! -e .github/workflows/stage47-apply-roster-readiness-0.1.248.yml
          test ! -e .github/patches/stage47-roster-readiness-0.1.248.patch
          test ! -e stage47/source-patches/external-quick-passenger-direct-source.patch

          echo 'stage47_direct_source_authority=PASS version=0.1.249/5542'
          echo 'fixed_historical_source_checkout=false'
          echo 'stage47_materializer_used=false'
          echo 'harvester_navigation_watchdog=true'
          echo 'harvester_evaluation_timeout=true'
          echo 'harvester_back_recovery=true'
          echo 'deterministic_trip_page_identity=true'
          echo 'deterministic_passenger_trip_scope=true'
          echo 'stale_callback_fail_closed=true'
          echo 'unproven_roster_preserved=false'
          echo 'passenger_card_semantic_proof=true'
          echo 'real_edit_and_options_links_only=true'
          echo 'external_dialer_opened=false'
          echo 'farol_untouched=true'

      - name: Compile and run direct-source unit tests
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripTimelineExternalQuickPassengerStage47Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripTimelineBaseDirectionStage47Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripQuickPassengerStage47R4Step4Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripBlaBlaCollectorStage47R4Step5Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaManualSeatAutomationStage47Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaHarvestAssociationTest' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace
          echo 'stage47_direct_source_tests=PASS'

      - name: Reconfirm FAROL after direct-source compile
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          echo 'farol_sha256=2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560'
          echo 'stage47_direct_source_validation=PASS version=0.1.249/5542'