name: Stage 14 unit test diagnostics

on:
  pull_request:
    branches:
      - agent/stage12-manual-latency-export-0.1.194
    paths:
      - .github/workflows/stage14-unit-test-diagnostics.yml
      - scripts/apply_visible_offer_activation_stage14.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Checkout Stage 14 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: patches

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Materialize validated 0.1.194
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-stage14-diag-base
        run: |
          set -euo pipefail
          bash ../patches/scripts/build_rota_certa_0194.sh ../patches

      - name: Reapply Stage 9 and Stage 12
        working-directory: source
        run: |
          set -euo pipefail
          python3 ../patches/scripts/apply_farol_latency_instrumentation_stage9.py "$PWD" --check
          python3 ../patches/scripts/apply_farol_latency_instrumentation_stage9.py "$PWD"
          python3 ../patches/scripts/apply_farol_latency_manual_export_stage12.py "$PWD" --check
          python3 ../patches/scripts/apply_farol_latency_manual_export_stage12.py "$PWD"

      - name: Apply Stage 14
        working-directory: source
        run: |
          set -euo pipefail
          python3 ../patches/scripts/apply_visible_offer_activation_stage14.py "$PWD" --check
          python3 ../patches/scripts/apply_visible_offer_activation_stage14.py "$PWD"

      - name: Run unit suite for diagnostics
        id: tests
        continue-on-error: true
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-stage14-diag-final
        run: ./gradlew testDebugUnitTest --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Summarize failing tests
        if: always()
        working-directory: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          failures=[]
          tests=0
          for fn in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root=ET.parse(fn).getroot()
              tests += int(root.attrib.get('tests',0))
              for tc in root.findall('.//testcase'):
                  bad=tc.find('failure') or tc.find('error')
                  if bad is not None:
                      failures.append((tc.attrib.get('classname'),tc.attrib.get('name'),bad.attrib.get('message',''),(bad.text or '')[:4000]))
          print(f'tests={tests}')
          print(f'failures={len(failures)}')
          for i,item in enumerate(failures,1):
              print(f'FAILURE_{i}={item[0]}::{item[1]}')
              print(item[2])
              print(item[3])
          with open('stage14-unit-test-summary.txt','w',encoding='utf-8') as f:
              f.write(f'tests={tests}\nfailures={len(failures)}\n')
              for i,item in enumerate(failures,1):
                  f.write(f'FAILURE_{i}={item[0]}::{item[1]}\n{item[2]}\n{item[3]}\n')
          PY

      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage14-unit-test-diagnostics
          path: |
            source/stage14-unit-test-summary.txt
            source/app/build/test-results/testDebugUnitTest/
            source/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 7

      - name: Preserve failure status
        if: steps.tests.outcome != 'success'
        run: exit 1
