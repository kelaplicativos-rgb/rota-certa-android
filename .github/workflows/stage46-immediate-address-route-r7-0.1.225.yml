name: Validate Stage46 immediate-address route R7 0.1.225
on:
  pull_request:
    branches: [agent/stage45-ocr-multiline-address-reconstruction-0.1.218]
    paths:
      - '.github/workflows/stage46-immediate-address-route-r7-0.1.225.yml'
      - 'scripts/run_stage46_r7_reproducible_ci.sh'
      - 'scripts/apply_stage46_immediate_address_route_r7.py'
      - 'scripts/apply_stage46_r7_version.py'
      - 'scripts/apply_stage46_r7_test_compat.py'
      - 'stage46/FarolImmediateAddressRouteStage46R7.kt'
      - 'stage46/FarolStage46ImmediateAddressRouteR7Test.kt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate-stage46-immediate-address-r7:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GOOGLE_MAPS_API_KEY: '${{ secrets.GOOGLE_MAPS_API_KEY }}'
      GH_TOKEN: '${{ github.token }}'
    steps:
      - name: Checkout protected canonical source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          path: source
          fetch-depth: 1
      - name: Checkout current Stage46 patches
        uses: actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          path: patches
          fetch-depth: 1
      - name: Checkout pinned Stage18 recipe
        uses: actions/checkout@v4
        with:
          ref: aa4bd10847d41a3abd5d8a9cb186d6cfa8acc88c
          path: historical19
          fetch-depth: 1
      - name: Checkout pinned Stage32 recipe
        uses: actions/checkout@v4
        with:
          ref: a4443bb6c287fcf31a56f2a3c4ba8fc211fe1f79
          path: historical34
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Reproduce R6, materialize R7, test and build
        run: |
          set -euo pipefail
          mkdir -p evidence
          bash patches/scripts/run_stage46_r7_reproducible_ci.sh source patches historical19 historical34 evidence
      - name: Upload Stage46 R7 physical artifact
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.225-stage46-immediate-address-route-r7
          path: evidence/
          if-no-files-found: error
          retention-days: 30