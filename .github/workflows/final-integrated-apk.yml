name: Final Integrated APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: final-integrated-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_PACKAGE: br.com.mapeiaia.rotacerta
  EXPECTED_VERSION: 0.1.135
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

jobs:
  build-test-validate-release:
    name: Test, validate and publish final APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify integrated source contracts
        run: |
          set -euo pipefail
          grep -q 'TARGET_RESULT_MILLIS = 850L' app/src/main/java/br/com/mapeiaia/rotacerta/FarolCriticalPathPolicy.kt
          grep -q 'OCR_FALLBACK_DELAY_MILLIS = 40L' app/src/main/java/br/com/mapeiaia/rotacerta/FarolCriticalPathPolicy.kt
          grep -q 'FarolDisplayStabilityPolicy' app/src/main/java/br/com/mapeiaia/rotacerta/FarolDisplayStabilityPolicy.kt
          grep -q 'CardPackageLifecyclePolicy' app/src/main/java/br/com/mapeiaia/rotacerta/CardPackageLifecyclePolicy.kt
          grep -q 'StrictSelectedAppReadPolicy' app/src/main/java/br/com/mapeiaia/rotacerta/StrictSelectedAppReadPolicy.kt
          grep -q 'UniversalScreenAddressParser' app/src/main/java/br/com/mapeiaia/rotacerta/UniversalScreenAddressParser.kt
          grep -q 'saveToDownloads' app/src/main/java/br/com/mapeiaia/rotacerta/ManualTechnicalReportExporter.kt
          grep -q 'MediaStore.Downloads.EXTERNAL_CONTENT_URI' app/src/main/java/br/com/mapeiaia/rotacerta/ManualTechnicalReportExporter.kt
          grep -q 'universal-manual-package-no-flicker-final-checklist-15.gradle.kts' app/patch-universal-two-address-compat.gradle.kts
          grep -q 'checklist-15-universal-manual-package-final-contract.gradle.kts' app/patch-universal-two-address-compat.gradle.kts
          grep -q 'version-0.1.135.gradle.kts' app/patch-universal-two-address-compat.gradle.kts

      - name: Run all debug unit tests
        run: ./gradlew clean :app:testDebugUnitTest --stacktrace

      - name: Restore exact clean sources
        run: |
          git reset --hard "$TARGET_SHA"
          git clean -fd

      - name: Build final signed debug APK
        run: ./gradlew clean :app:assembleDebug --stacktrace

      - name: Validate package, version, API key, signature and APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SERVICE="app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt"
          STRICT="app/src/main/java/br/com/mapeiaia/rotacerta/StrictSelectedAppReadPolicy.kt"
          STABILITY="app/src/main/java/br/com/mapeiaia/rotacerta/FarolDisplayStabilityPolicy.kt"
          PARSER="app/src/main/java/br/com/mapeiaia/rotacerta/UniversalScreenAddressParser.kt"
          REPOSITORY="app/src/main/java/br/com/mapeiaia/rotacerta/SettingsRepository.kt"
          MAIN="app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          test -n "${GOOGLE_MAPS_API_KEY:-}"

          grep -q 'manual_package_overrides_legacy_classification_checklist_15' "$STRICT"
          grep -q 'destination_only_stability_checklist_15' "$STABILITY"
          grep -q 'PARTIAL_ABSENCE_CONFIRM_MILLIS = 500L' "$STABILITY"
          grep -q 'no_via_app_false_address_checklist_15' "$PARSER"
          grep -q 'overlay_idempotent_same_value_checklist_15' "$SERVICE"
          grep -q 'valid_read_cancels_absence_checklist_15' "$SERVICE"
          grep -q 'same_destination_no_ocr_no_repaint_checklist_15' "$SERVICE"
          grep -q 'last_card_removes_package_checklist_15' "$REPOSITORY"
          grep -q 'delete_capture_prunes_package_checklist_15' "$MAIN"
          ! grep -q 'requireRegisteredRideCard = true' "$SERVICE"

          mkdir -p dist
          cp "$APK" dist/rota-certa-final.apk

          BADGING="$($AAPT dump badging "$APK")"
          PACKAGE_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"

          test "$PACKAGE_NAME" = "$EXPECTED_PACKAGE"
          test "$VERSION_NAME" = "$EXPECTED_VERSION"
          test -n "$VERSION_CODE"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist/signature.txt
          unzip -t "$APK" | tee dist/unzip-test.txt
          unzip -l "$APK" | tee dist/apk-files.txt
          grep -q 'AndroidManifest.xml' dist/apk-files.txt
          grep -q 'classes.dex' dist/apk-files.txt

          unzip -p "$APK" classes.dex > dist/classes.dex
          DEX_SIZE_BYTES="$(stat -c%s dist/classes.dex)"
          test "$DEX_SIZE_BYTES" -gt 1000000
          rm -f dist/classes.dex

          APK_SHA256="$(sha256sum dist/rota-certa-final.apk | awk '{print $1}')"
          APK_SIZE_BYTES="$(stat -c%s dist/rota-certa-final.apk)"
          APK_SIZE_MB="$(awk -v bytes="$APK_SIZE_BYTES" 'BEGIN { printf "%.2f", bytes / 1048576 }')"

          {
            echo "Rota Certa — validação final"
            echo "Commit: $TARGET_SHA"
            echo "Pacote: $PACKAGE_NAME"
            echo "Versão: $VERSION_NAME"
            echo "Version code: $VERSION_CODE"
            echo "Tamanho: $APK_SIZE_BYTES bytes ($APK_SIZE_MB MB)"
            echo "SHA-256: $APK_SHA256"
            echo "Google Maps API: incluída no BuildConfig"
            echo "Pacotes: qualquer pacote capturado manualmente usa o gatilho universal"
            echo "Aplicativos predefinidos: nenhum"
            echo "Gatilho: dois ou mais endereços; o último é o destino"
            echo "Falso destino Via app: bloqueado"
            echo "Mesmo destino: sem OCR, sem limpeza e sem nova renderização"
            echo "Ausência parcial: confirmação fixa de 500 ms"
            echo "Mudança real de pacote ou destino: invalidação imediata"
            echo "Cards/Aplicativos: último card removido também remove o pacote"
            echo "Relatório técnico: salvo em Downloads/Rota Certa"
            echo "Testes unitários: aprovados"
            echo "Assinatura: verificada pelo apksigner"
            echo "Estrutura ZIP: íntegra"
            echo "DEX principal: $DEX_SIZE_BYTES bytes"
          } | tee dist/validation.txt

          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "apk_sha256=$APK_SHA256"
            echo "apk_size_bytes=$APK_SIZE_BYTES"
            echo "apk_size_mb=$APK_SIZE_MB"
          } >> "$GITHUB_OUTPUT"
        id: validate

      - name: Upload final APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-final-apk
          path: dist/rota-certa-final.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-final-validation
          path: |
            dist/validation.txt
            dist/signature.txt
            dist/unzip-test.txt
            dist/apk-files.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.validate.outputs.version_name }}
          VERSION_CODE: ${{ steps.validate.outputs.version_code }}
          APK_SHA256: ${{ steps.validate.outputs.apk_sha256 }}
          APK_SIZE_MB: ${{ steps.validate.outputs.apk_size_mb }}
        run: |
          set -euo pipefail
          TAG="rota-certa-v${VERSION_NAME}-build-${GITHUB_RUN_NUMBER}"
          {
            echo "## Rota Certa ${VERSION_NAME}"
            echo
            echo "Pacote manual universal e correção definitiva da repintura da bolinha."
            echo
            echo "- Pacote: \`$EXPECTED_PACKAGE\`"
            echo "- Version code: \`$VERSION_CODE\`"
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Tamanho: \`${APK_SIZE_MB} MB\`"
            echo "- SHA-256: \`$APK_SHA256\`"
            echo "- Qualquer pacote capturado manualmente pode ser lido"
            echo "- Nenhum aplicativo nasce predefinido"
            echo "- Dois endereços acionam o farol e o último é o destino"
            echo "- Mesmo destino não apaga, não executa OCR e não redesenha"
            echo "- Via app não é mais aceito como endereço"
            echo "- Excluir o último card também remove o pacote de Aplicativos"
            echo "- APK assinado, testado e verificado"
          } > dist/release-notes.md

          gh release create "$TAG" \
            "dist/rota-certa-final.apk#rota-certa-final.apk" \
            "dist/validation.txt#validation.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Rota Certa ${VERSION_NAME}" \
            --notes-file dist/release-notes.md \
            --latest
