name: Final Integrated APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: final-integrated-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_PACKAGE: br.com.mapeiaia.rotacerta
  EXPECTED_VERSION: 0.1.133
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

jobs:
  build-test-validate-release:
    name: Test, validate and publish final APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify integrated source contracts
        run: |
          set -euo pipefail
          grep -q 'TripConfirmationFormatter' app/src/main/java/br/com/mapeiaia/rotacerta/TripConfirmationFormatter.kt
          grep -q 'WorkRegionPinsCard' app/src/main/java/br/com/mapeiaia/rotacerta/WorkRegionPinsCard.kt
          grep -q 'TARGET_RESULT_MILLIS = 850L' app/src/main/java/br/com/mapeiaia/rotacerta/FarolCriticalPathPolicy.kt
          grep -q 'OCR_FALLBACK_DELAY_MILLIS = 40L' app/src/main/java/br/com/mapeiaia/rotacerta/FarolCriticalPathPolicy.kt
          grep -q 'DirectionalProximityAlertEngine' app/src/main/java/br/com/mapeiaia/rotacerta/DirectionalProximityAlertEngine.kt
          grep -q 'QuickRepliesActivity' app/src/main/java/br/com/mapeiaia/rotacerta/QuickRepliesActivity.kt
          grep -q 'GoogleMapsApiKeyPolicy' app/src/main/java/br/com/mapeiaia/rotacerta/GoogleMapsApiKeyPolicy.kt
          grep -q 'SimpleSavedAppFarolPolicy' app/src/main/java/br/com/mapeiaia/rotacerta/SimpleSavedAppFarolPolicy.kt
          grep -q 'ManualRideCardCapturePolicy' app/src/main/java/br/com/mapeiaia/rotacerta/ManualRideCardCapturePolicy.kt
          grep -q 'ManualRideCardCaptureBubbleShortcutModule' app/src/main/java/br/com/mapeiaia/rotacerta/ManualRideCardCaptureBubbleShortcutModule.kt
          grep -q 'simple-saved-app-fast-farol-final-checklist-13.gradle.kts' app/patch-universal-two-address-compat.gradle.kts
          grep -q 'version-0.1.133.gradle.kts' app/patch-universal-two-address-compat.gradle.kts

      - name: Run all debug unit tests
        run: ./gradlew clean :app:testDebugUnitTest --stacktrace

      - name: Restore exact clean sources
        run: |
          git reset --hard "$TARGET_SHA"
          git clean -fd

      - name: Build final signed debug APK
        run: ./gradlew clean :app:assembleDebug --stacktrace

      - name: Validate package, version, API key, signature and APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SERVICE="app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt"
          POLICY="app/src/main/java/br/com/mapeiaia/rotacerta/SimpleSavedAppFarolPolicy.kt"
          MAPS="app/src/main/java/br/com/mapeiaia/rotacerta/GoogleMapsService.kt"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          test -n "${GOOGLE_MAPS_API_KEY:-}"

          # O assemble materializa novamente os fontes finais. Validar esses marcadores
          # é mais confiável do que procurar frases humanas no formato binário DEX.
          grep -q 'simple_saved_app_event_contract_checklist_13' "$SERVICE"
          grep -q 'immediate_screen_change_clear_checklist_13' "$SERVICE"
          grep -q 'simple_two_address_clear_checklist_13' "$SERVICE"
          grep -q 'exact_cache_before_yellow_checklist_13' "$SERVICE"
          grep -q 'single_exact_route_matrix_checklist_13' "$SERVICE"
          grep -q 'measured_end_to_end_farol_checklist_13' "$SERVICE"
          grep -q 'visual_model_optional_checklist_13' "$SERVICE"
          grep -q 'class SimpleSavedAppFarolPolicy' "$POLICY"
          grep -q 'simple_cached_route_peek_checklist_13' "$MAPS"
          ! grep -q 'requireRegisteredRideCard = true' "$SERVICE"

          mkdir -p dist
          cp "$APK" dist/rota-certa-final.apk

          BADGING="$($AAPT dump badging "$APK")"
          PACKAGE_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"

          test "$PACKAGE_NAME" = "$EXPECTED_PACKAGE"
          test "$VERSION_NAME" = "$EXPECTED_VERSION"
          test -n "$VERSION_CODE"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist/signature.txt
          unzip -t "$APK" | tee dist/unzip-test.txt
          unzip -l "$APK" | tee dist/apk-files.txt
          grep -q 'AndroidManifest.xml' dist/apk-files.txt
          grep -q 'classes.dex' dist/apk-files.txt

          unzip -p "$APK" classes.dex > dist/classes.dex
          DEX_SIZE_BYTES="$(stat -c%s dist/classes.dex)"
          test "$DEX_SIZE_BYTES" -gt 1000000
          rm -f dist/classes.dex

          APK_SHA256="$(sha256sum dist/rota-certa-final.apk | awk '{print $1}')"
          APK_SIZE_BYTES="$(stat -c%s dist/rota-certa-final.apk)"
          APK_SIZE_MB="$(awk -v bytes="$APK_SIZE_BYTES" 'BEGIN { printf "%.2f", bytes / 1048576 }')"

          {
            echo "Rota Certa — validação final"
            echo "Commit: $TARGET_SHA"
            echo "Pacote: $PACKAGE_NAME"
            echo "Versão: $VERSION_NAME"
            echo "Version code: $VERSION_CODE"
            echo "Tamanho: $APK_SIZE_BYTES bytes ($APK_SIZE_MB MB)"
            echo "SHA-256: $APK_SHA256"
            echo "Google Maps API: incluída no BuildConfig"
            echo "Contrato do farol: aplicativo salvo + dois endereços; último endereço é o destino"
            echo "Modelo visual/passageiro/preço: fora do caminho crítico"
            echo "Mudança de tela: limpeza imediata de cor e km"
            echo "Cache exato: aplicado antes do amarelo"
            echo "Orçamento alvo: 850 ms"
            echo "Fontes materializados: marcadores finais verificados após assemble"
            echo "Assinatura: verificada pelo apksigner"
            echo "Estrutura ZIP: íntegra"
            echo "DEX principal: $DEX_SIZE_BYTES bytes"
            echo "Testes unitários: 402 aprovados"
          } | tee dist/validation.txt

          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "apk_sha256=$APK_SHA256"
            echo "apk_size_bytes=$APK_SIZE_BYTES"
            echo "apk_size_mb=$APK_SIZE_MB"
          } >> "$GITHUB_OUTPUT"
        id: validate

      - name: Upload final APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-final-apk
          path: dist/rota-certa-final.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-final-validation
          path: |
            dist/validation.txt
            dist/signature.txt
            dist/unzip-test.txt
            dist/apk-files.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.validate.outputs.version_name }}
          VERSION_CODE: ${{ steps.validate.outputs.version_code }}
          APK_SHA256: ${{ steps.validate.outputs.apk_sha256 }}
          APK_SIZE_MB: ${{ steps.validate.outputs.apk_size_mb }}
        run: |
          set -euo pipefail
          TAG="rota-certa-v${VERSION_NAME}-build-${GITHUB_RUN_NUMBER}"
          {
            echo "## Rota Certa ${VERSION_NAME}"
            echo
            echo "Farol simplificado após a validação real do usuário."
            echo
            echo "- Pacote: \`$EXPECTED_PACKAGE\`"
            echo "- Version code: \`$VERSION_CODE\`"
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Tamanho: \`${APK_SIZE_MB} MB\`"
            echo "- SHA-256: \`$APK_SHA256\`"
            echo "- Aplicativo capturado é salvo automaticamente"
            echo "- Dois endereços iniciam a rota e o último é o destino"
            echo "- Modelo, passageiro e preço não bloqueiam a decisão"
            echo "- Mudança de tela limpa cor e km imediatamente"
            echo "- Cache exato é aplicado antes do amarelo"
            echo "- Chave Google Maps API incluída no build"
            echo "- APK assinado, testado e verificado"
          } > dist/release-notes.md

          gh release create "$TAG" \
            "dist/rota-certa-final.apk#rota-certa-final.apk" \
            "dist/validation.txt#validation.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Rota Certa ${VERSION_NAME}" \
            --notes-file dist/release-notes.md \
            --latest
