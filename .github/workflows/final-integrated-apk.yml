name: Final Integrated APK 0.1.146

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: final-integrated-0146-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_PACKAGE: br.com.mapeiaia.rotacerta
  EXPECTED_VERSION: 0.1.146
  EXPECTED_VERSION_CODE: '5070'
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

jobs:
  build-test-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Verify 0.1.146 source contract
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.1.146"' app/build.gradle.kts
          grep -q 'versionCode = 5070' app/build.gradle.kts
          grep -q 'Aplicativos e cards autorizados' app/src/main/java/br/com/mapeiaia/rotacerta/InstalledRideAppPickerActivity.kt
          grep -q 'removePackage' app/src/main/java/br/com/mapeiaia/rotacerta/ManualAppScreenCaptureStore.kt
          grep -q 'postDelayed(longPressAction, 1_500L)' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt
          ! grep -q 'onDoubleTap(event' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt
          ! grep -q 'Text("Salvar Casa")' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          ! test -e app/src/main/java/br/com/mapeiaia/rotacerta/RegisteredCardDecisionGate.kt
          ! test -e app/src/main/java/br/com/mapeiaia/rotacerta/RideCardTemplateMatcher.kt
      - name: Run tests and lint
        run: |
          gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain
          gradle lintDebug --no-daemon --stacktrace --console=plain
      - name: Build APK
        run: gradle clean assembleDebug --no-daemon --stacktrace --console=plain
      - name: Validate APK
        id: validate
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee aapt-badging.txt
          grep -q "package: name='$EXPECTED_PACKAGE'" aapt-badging.txt
          grep -q "versionName='$EXPECTED_VERSION'" aapt-badging.txt
          grep -q "versionCode='$EXPECTED_VERSION_CODE'" aapt-badging.txt
          unzip -p "$APK" 'classes*.dex' | strings > dex-strings.txt
          grep -q 'Aplicativos e cards autorizados' dex-strings.txt
          grep -q 'Excluir somente este card' dex-strings.txt
          grep -q 'bubble.shortcut.long_press' dex-strings.txt
          ! grep -q 'bubble.shortcut.double_tap' dex-strings.txt
          mkdir -p dist
          cp "$APK" dist/rota-certa-0.1.146-autorizados-validado.apk
          sha256sum dist/rota-certa-0.1.146-autorizados-validado.apk | tee dist/apk-sha256.txt
          stat -c '%s' dist/rota-certa-0.1.146-autorizados-validado.apk | tee dist/apk-size-bytes.txt
          git rev-parse HEAD | tee dist/validated-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.146-authorized-apps-validated
          path: |
            dist/
            aapt-badging.txt
            apksigner.txt
          retention-days: 90
          if-no-files-found: error
