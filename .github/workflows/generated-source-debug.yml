name: Generated Source Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Materialize sources
        run: ./gradlew :app:preBuild --stacktrace
      - name: Pack generated evidence
        if: always()
        run: |
          mkdir -p generated-evidence
          cp app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt generated-evidence/ || true
          cp app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt generated-evidence/ || true
          cp app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt generated-evidence/ || true
          cp app/src/main/java/br/com/mapeiaia/rotacerta/QuickRepliesActivity.kt generated-evidence/ || true
          cp app/src/main/java/br/com/mapeiaia/rotacerta/WorkRegionPinsCard.kt generated-evidence/ || true
      - name: Upload generated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-source-evidence
          path: generated-evidence
          if-no-files-found: error
          retention-days: 7
