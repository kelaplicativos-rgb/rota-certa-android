name: Rota Certa 0.1.360 installed build identification

on:
  push:
    branches:
      - agent/build-identification-0.1.360
  pull_request:
    branches:
      - agent/agenda-reservation-approval-0.1.356
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-identification-0360-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate causal scope and contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE=9f74bd41015377655046f8a80fe7687c1a14c6c5
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -Fq 'versionCode = 5653' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.360"' app/build.gradle.kts
          grep -Fq 'REJECTED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt
          grep -Fq 'decideDriverBooking' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripRemoteApi.kt
          grep -Fq 'Aguardando aprovação' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          grep -Fq 'ReservationRequestsHomeAlert0356' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          grep -Fq 'RESERVATION_REQUESTED' trip-platform/functions/index.js
          grep -Fq 'mutateDriverBookingDecision' trip-platform/functions/index.js
          grep -Fq 'AGUARDANDO APROVAÇÃO DO MOTORISTA' trip-platform/public/app.js
          grep -Fq 'seatPickerAvailability' trip-platform/public/index.html
          grep -Fq 'currentSeatCapacityMessage' trip-platform/functions/index.js
          grep -Fq 'otherRecords = records.filter((record) => record.id !== bookingId)' trip-platform/functions/index.js
          test -f app/src/test/java/br/com/mapeiaia/rotacerta/trips/ReservationApproval0356Test.kt
          test -f trip-platform/functions/test/reservation-approval-0356.test.js
          test -f trip-platform/functions/test/public-search-capacity-0356.test.js
          test -f trip-platform/functions/test/public-short-agenda-link-0358.test.js
          grep -Fq 'publicSlugFromPath' trip-platform/public/app.js
          grep -Fq '/v1/public/agenda/' trip-platform/public/app.js
          grep -Fq 'Trocar credencial interna' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaSettingsUi.kt
          test -f app/src/main/java/br/com/mapeiaia/rotacerta/AppBuildInfo.kt
          test -f app/src/test/java/br/com/mapeiaia/rotacerta/AppBuildInfoTest.kt
          grep -Fq 'BUILD_GIT_SHA' app/build.gradle.kts
          grep -Fq 'BUILD_GIT_BRANCH' app/build.gradle.kts
          grep -Fq 'BUILD_GENERATED_AT' app/build.gradle.kts
          grep -Fq 'Sobre o Rota Certa' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          grep -Fq 'Copiar informações da versão' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          grep -Fq 'AppBuildInfo.reportHeader(context)' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt

          CHANGED_FAROL="$(git diff --name-only "$BASE"..HEAD -- app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt 'app/src/main/java/br/com/mapeiaia/rotacerta/Farol*.kt' || true)"
          test -z "$CHANGED_FAROL"

      - name: Backend and web syntax/tests
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/public/app.js
          node --test trip-platform/functions/test/reservation-approval-0356.test.js
          node --test trip-platform/functions/test/public-search-capacity-0356.test.js
          node --test trip-platform/functions/test/stable-agenda-link-0307.test.js
          node --test trip-platform/functions/test/driver-username-alias-0351.test.js
          node --test trip-platform/functions/test/public-short-agenda-link-0358.test.js

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase credential is missing."
            exit 3
          fi

      - name: Generate Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
          else
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
          fi
          APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
          test -n "$APP_ID"
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests lint and installable APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace | tee /tmp/gradle.txt
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta'" /tmp/aapt.txt
          grep -Fq "versionCode='5653'" /tmp/aapt.txt
          grep -Fq "versionName='0.1.360'" /tmp/aapt.txt
          mkdir -p /tmp/0360
          cp "$APK" /tmp/0360/rota-certa-0.1.360-build-identification.apk
          sha256sum /tmp/0360/rota-certa-0.1.360-build-identification.apk | tee /tmp/0360/apk.sha256
          cp /tmp/aapt.txt /tmp/0360/aapt.txt
          cp /tmp/apksigner.txt /tmp/0360/apksigner.txt
          cp /tmp/gradle.txt /tmp/0360/gradle.txt
          git rev-parse HEAD > /tmp/0360/source-head.txt
          git diff --name-only 9f74bd41015377655046f8a80fe7687c1a14c6c5..HEAD > /tmp/0360/changed-files.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/0360/dex-strings.txt
          grep -Fq "${GITHUB_SHA}" /tmp/0360/dex-strings.txt
          EXPECTED_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          if [ -n "$EXPECTED_BRANCH" ]; then
            grep -Fq "$EXPECTED_BRANCH" /tmp/0360/dex-strings.txt
          fi
          grep -Fq 'Sobre o Rota Certa' /tmp/0360/dex-strings.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.360-build-identification
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0360
