name: Agenda 0.1.284 reliable seat save completion fix

on:
  push:
    branches: [agent/agenda-ux-passenger-publisher-0.1.276]
    paths:
      - '.github/workflows/agenda-0282-all-accounts-direct-sync.yml'
      - '.github/scripts/agenda_0284_reliable_seat_save_completion_fix.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agenda-0284-seat-save-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/agenda-ux-passenger-publisher-0.1.276

      - name: Prove physical failure baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 5576' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.283"' app/build.gradle.kts
          grep -Fq 'phase = Phase.VERIFY' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaReliableSeatSync.kt
          grep -Fq '1_700L + distance * 320L' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaReliableSeatSync.kt
          grep -Fq 'if (!BlaBlaCollectorUrlModule.isAllowed(url) || busy) return' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaReliableSeatSync.kt
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"

      - name: Materialize minimal save-completion correction
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/agenda_0284_reliable_seat_save_completion_fix.py
          git diff --check
          grep -Fq 'private enum class Phase { BEFORE, SAVING, VERIFY }' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaReliableSeatSync.kt
          grep -Fq 'scheduleVerificationReload("save_navigation")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaReliableSeatSync.kt
          grep -Fq 'RELIABLE_SAVE_COMPLETION_TIMEOUT_MS = 7_000L' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaReliableSeatSync.kt
          grep -Fq 'EXTERNAL_SEAT_SYNC_RELIABLE_VERIFY_RETRY' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaReliableSeatSync.kt
          grep -Fq 'writeRepeated=false' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaReliableSeatSync.kt
          if grep -Fq '1_700L + distance * 320L' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaReliableSeatSync.kt; then
            echo 'premature fixed reload is still present' >&2
            exit 1
          fi
          grep -Fq 'versionCode = 5577' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.284"' app/build.gradle.kts

      - name: Protect FAROL and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' 'app/build.gradle.kts' 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaReliableSeatSync.kt' | sort > /tmp/expected.txt
          cmp /tmp/expected.txt /tmp/changed.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk.sha256

      - name: Commit tested source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaReliableSeatSync.kt
          git commit -m 'fix(agenda): wait for reliable seat save completion 0.1.284'
          git push origin HEAD:agent/agenda-ux-passenger-publisher-0.1.276
          git rev-parse HEAD | tee /tmp/source-head.txt

      - name: Build evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agenda-0284
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/agenda-0284/rota-certa-0.1.284-debug.apk
          cp /tmp/apk.sha256 /tmp/agenda-0284/apk.sha256
          cp /tmp/source-head.txt /tmp/agenda-0284/source-head.txt
          printf '%s\n' \
            'versionName=0.1.284' \
            'versionCode=5577' \
            'cause=fixed reload could interrupt BlaBlaCar save before navigation completed' \
            'fix=wait for save navigation; bounded timeout only verifies; no repeated write' \
            'verifyReread=true' \
            'idempotencyPolicyPreserved=true' \
            'farolUntouched=true' > /tmp/agenda-0284/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-agenda-0.1.284-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/agenda-0284
