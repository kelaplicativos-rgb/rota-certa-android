name: Rota Certa 0.1.324 Agenda parent crash trace

on:
  push:
    branches:
      - agent/agenda-parent-crash-trace-0.1.324
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-0324-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agenda-parent-crash-trace-0.1.324
          fetch-depth: 0

      - name: Validate 0.1.324 parent Agenda crash diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -Fq 'versionCode = 5617' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.324"' app/build.gradle.kts
          grep -Fq 'AGENDA_SYNC_TOOLBAR_REQUESTED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'scope=all_accounts source=timeline_toolbar' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'onRequestBlaBlaSync()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'timelineToolbarSyncStartsAllAccountsInsteadOfOnlyOpeningPanel' app/src/test/java/br/com/mapeiaia/rotacerta/trips/PassengerCanonical0317Test.kt
          grep -Fq 'PullToRefreshBox' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'AGENDA_PULL_REFRESH_ALL_REQUESTED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'PublicBookingRemoteSync0296.pullAndReconcile' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'AGENDA_PULL_REFRESH_BLABLACAR_ALL_ARMED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'timelinePullRefreshSynchronizesAllAccountsBookingsAndPublicAgenda' app/src/test/java/br/com/mapeiaia/rotacerta/trips/PassengerCanonical0317Test.kt
          grep -Fq '__rotaCertaNetworkTripSource' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaNetworkDiagnosticRecorder.kt
          grep -Fq 'blablaItineraryStops: List<String> = emptyList()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimeline.kt
          grep -Fq 'AgendaSyncCrashGuard.install' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          grep -Fq 'AgendaSyncCrashTraceStore.export(context)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaNetworkDiagnosticRecorder.kt
          grep -Fq 'class AgendaSyncCrashTrace0322Test' app/src/test/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace0322Test.kt
          grep -Fq 'Thread.setDefaultUncaughtExceptionHandler(handler)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace.kt
          grep -Fq 'CHECKPOINT_FILE_NAME' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace.kt
          grep -Fq 'persistCheckpoint(context, lastCheckpoint)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace.kt
          ! grep -Fq 'traceFile(context).delete()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace.kt
          grep -Fq 'AgendaTimelineCrashGuard.install(this)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'timeline_pull_requested' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'timeline_pull_before_public_booking_reconcile' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'timeline_pull_after_blabla_token' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'timeline_public_agenda_effect_begin' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'BREADCRUMB_FILE_NAME' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace.kt
          grep -Fq -- '--- AGENDA SYNC BREADCRUMBS ---' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace.kt

      - name: Verify FAROL unchanged from 0.1.320
        shell: bash
        run: |
          set -euo pipefail
          BASE=a5f81588194fb2451c7ed531e4d93db390b78534
          test -z "$(git diff --name-only "$BASE"..HEAD --             'app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'             'app/src/main/java/br/com/mapeiaia/rotacerta/Farol*.kt')"

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase credential is missing."
            exit 3
          fi

      - name: Generate Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
          else
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
          fi
          APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
          test -n "$APP_ID"
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and build APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace | tee /tmp/gradle.txt
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'certificate SHA-256 digest: d9ee577b5bb9a4c72bce115e974c9ecf1ec8c7382bcd034e88d433e01eb0e7fd' /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta'" /tmp/aapt.txt
          grep -Fq "versionCode='5617'" /tmp/aapt.txt
          grep -Fq "versionName='0.1.324'" /tmp/aapt.txt
          sha256sum "$APK" | tee /tmp/apk.sha256
          mkdir -p /tmp/0324
          cp "$APK" /tmp/0324/rota-certa-0.1.324-agenda-parent-crash-trace.apk
          cp /tmp/apk.sha256 /tmp/0324/apk.sha256
          cp /tmp/aapt.txt /tmp/0324/aapt.txt
          cp /tmp/apksigner.txt /tmp/0324/apksigner.txt
          cp /tmp/gradle.txt /tmp/0324/gradle.txt
          git rev-parse HEAD > /tmp/0324/source-head.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.324-agenda-parent-crash-trace
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0324
