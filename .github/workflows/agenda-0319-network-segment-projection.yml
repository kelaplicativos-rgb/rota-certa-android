name: Rota Certa 0.1.342 WhatsApp publico e auth privada

on:
  push:
    branches:
      - agent/public-whatsapp-view-private-auth-0.1.342
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-0342-${{ github.ref }}
  cancel-in-progress: true

