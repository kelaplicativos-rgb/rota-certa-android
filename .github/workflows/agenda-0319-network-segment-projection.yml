name: Rota Certa 0.1.332 Agenda public search starts today

on:
  push:
    branches:
      - agent/agenda-public-search-today-start-0.1.332
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-0332-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agenda-public-search-today-start-0.1.332
          fetch-depth: 0

      - name: Validate 0.1.332 public-search today start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -Fq 'versionCode = 5625' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.332"' app/build.gradle.kts
          grep -Fq 'AGENDA_SYNC_PANEL_OPENED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'autoSyncStarted=false' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          ! grep -Fq 'AGENDA_SYNC_TOOLBAR_REQUESTED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'timelineToolbarOnlyOpensManualSyncPanel' app/src/test/java/br/com/mapeiaia/rotacerta/trips/PassengerCanonical0317Test.kt
          grep -Fq 'PullToRefreshBox' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'AGENDA_PULL_REFRESH_ALL_REQUESTED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'PublicBookingRemoteSync0296.pullAndReconcile' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'AGENDA_PULL_REFRESH_BLABLACAR_ALL_ARMED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'timelinePullRefreshSynchronizesAllAccountsBookingsAndPublicAgenda' app/src/test/java/br/com/mapeiaia/rotacerta/trips/PassengerCanonical0317Test.kt
          grep -Fq '__rotaCertaNetworkTripSource' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaNetworkDiagnosticRecorder.kt
          grep -Fq 'blablaItineraryStops: List<String> = emptyList()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimeline.kt
          grep -Fq 'AgendaSyncCrashGuard.install' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          grep -Fq 'AgendaSyncCrashTraceStore.export(context)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaNetworkDiagnosticRecorder.kt
          grep -Fq 'class AgendaSyncCrashTrace0322Test' app/src/test/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace0322Test.kt
          grep -Fq 'Thread.setDefaultUncaughtExceptionHandler(handler)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace.kt
          grep -Fq 'CHECKPOINT_FILE_NAME' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace.kt
          grep -Fq 'persistCheckpoint(context, lastCheckpoint)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace.kt
          ! grep -Fq 'traceFile(context).delete()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace.kt
          grep -Fq 'AgendaTimelineCrashGuard.install(this)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'timeline_pull_requested' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'timeline_pull_before_public_booking_reconcile' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'timeline_pull_after_blabla_token' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'timeline_public_agenda_effect_begin' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'BREADCRUMB_FILE_NAME' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace.kt
          grep -Fq -- '--- AGENDA SYNC BREADCRUMBS ---' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace.kt
          grep -Fq 'Regex("\\{\\{[A-Z0-9_]+\\}\\}")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaBrowserScriptRegistry.kt
          ! grep -Fq 'Regex("\\{\\{[A-Z0-9_]+}}")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaBrowserScriptRegistry.kt
          grep -Fq 'Text("+ Adicionar conta")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq 'Text("Contas BlaBlaCar")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq 'Sincronizar todas as contas' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq 'Text("Sincronizar só hoje")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq 'BlaBlaCollectorPanel(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'returnPartial=true' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          grep -Fq 'completeSync(collected.size)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          grep -Fq 'unreadableRideListReturnsPartialInsteadOfHangingInIdle' app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaBrowserOrchestrator0318Test.kt
          grep -Fq 'var syncSessionInFlight by remember { mutableStateOf(false) }' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq 'if (!syncing || archiving || syncSessionInFlight) return@LaunchedEffect' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq 'AGENDA_SYNC_SESSION_LAUNCH' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq 'allAccountSyncKeepsOnlyOneSessionActivityInFlight' app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaBrowserOrchestrator0318Test.kt
          grep -Fq 'PUBLIC_AGENDA_EXTERNAL_PUBLISH_RETRY' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'PUBLIC_AGENDA_EXTERNAL_SYNC_FAILED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'failureStage = "update_after_publish_failure"' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'failureStage = "capacity_claims"' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'externalPublicationFailuresExposeStageWithoutPassengerPii' app/src/test/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300Test.kt
          grep -Fq 'PUBLIC_AGENDA_EXTERNAL_SHAPE_PRESERVED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'PUBLIC_AGENDA_EXTERNAL_SYNC_CANCELLED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'preserveExternalBindingShape' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'remapExternalClaimsToBindingStructure' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'bookedExternalTripPreservesExistingBindingShapeAndRemapsClaims' app/src/test/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300Test.kt
          grep -Fq 'cancellationIsNeverCountedAsExternalPublicationFailure' app/src/test/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300Test.kt
          grep -Fq 'RoundedCornerShape(12.dp)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaCalendarDayLines.kt
          grep -Fq 'BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaCalendarDayLines.kt
          ! grep -Fq 'HorizontalDivider' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaCalendarDayLines.kt
          grep -Fq 'Consulta pública • $publicDateLabel' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          ! grep -Fq 'agendaCalendarDaysForPeriod<TripTimelineEntry>' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'publicSearchPeriodDoesNotInjectEmptyDaysIntoOperationalTimeline' app/src/test/java/br/com/mapeiaia/rotacerta/trips/AgendaCalendarDayLines0294Test.kt
          grep -Fq 'publicSearchWithoutOperationalTripsAddsOnlyDatesThatHaveRealCards' app/src/test/java/br/com/mapeiaia/rotacerta/trips/AgendaCalendarDayLines0294Test.kt
          grep -Fq 'timelineDayVisualIsBorderedCardWithoutLooseHorizontalDivider' app/src/test/java/br/com/mapeiaia/rotacerta/trips/AgendaCalendarDayLines0294Test.kt
          grep -Fq 'publicSearchDoesNotRenderStandaloneDayHeaders' app/src/test/java/br/com/mapeiaia/rotacerta/trips/AgendaCalendarDayLines0294Test.kt
          grep -Fq 'emptyPublicSearchMonthDoesNotPolluteTimelineWithDayHeaders' app/src/test/java/br/com/mapeiaia/rotacerta/trips/PassengerCanonical0317Test.kt
          ! grep -Fq 'emptyPublicSearchMonthStillProducesVisibleDayLines' app/src/test/java/br/com/mapeiaia/rotacerta/trips/PassengerCanonical0317Test.kt
          grep -Fq 'archiveStore.archiveLocalVisualEntries(physical)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'publicSearchStore.clearResponse()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'publicSearchResponse = null' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'publicSearchClearToken++' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'manualVisualHidden=' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'publicSearchCleared=' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'LaunchedEffect(publicSearchClearToken)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/ResponsiveTripActions.kt
          grep -Fq 'showPublicSearch = false' app/src/main/java/br/com/mapeiaia/rotacerta/trips/ResponsiveTripActions.kt
          grep -Fq 'shouldRenderTimelineEmptyDayCard(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'operationalCardCount = day.items.size' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'publicCardCount = dayPublicCards.size' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'dateCardAppearsOnlyWhenThatCalendarDayHasNoTravelCard' app/src/test/java/br/com/mapeiaia/rotacerta/trips/AgendaCalendarDayLines0294Test.kt
          grep -Fq 'clearAllRemovesEveryTimelineVisualLayerButPreservesPermanentData' app/src/test/java/br/com/mapeiaia/rotacerta/trips/PassengerCanonical0317Test.kt
          grep -Fq 'clearAllArchivesHybridLocalIdentityBeforeExternalHalfDisappears' app/src/test/java/br/com/mapeiaia/rotacerta/trips/PassengerCanonical0317Test.kt
          grep -Fq 'val startDay = maxOf(firstDay, today)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearch.kt
          grep -Fq 'if (startDay.isAfter(lastDay)) return emptyList()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearch.kt
          grep -Fq 'currentMonthWithoutDayStartsAtTodayAndNeverScansPastDays' app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchTest.kt
          grep -Fq 'pastMonthHasNoAutomaticTasksButExplicitPastDayRemainsAllowed' app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchTest.kt

      - name: Verify FAROL unchanged from 0.1.320
        shell: bash
        run: |
          set -euo pipefail
          BASE=a5f81588194fb2451c7ed531e4d93db390b78534
          test -z "$(git diff --name-only "$BASE"..HEAD --             'app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'             'app/src/main/java/br/com/mapeiaia/rotacerta/Farol*.kt')"

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase credential is missing."
            exit 3
          fi

      - name: Generate Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
          else
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
          fi
          APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
          test -n "$APP_ID"
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and build APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace | tee /tmp/gradle.txt
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'certificate SHA-256 digest: d9ee577b5bb9a4c72bce115e974c9ecf1ec8c7382bcd034e88d433e01eb0e7fd' /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta'" /tmp/aapt.txt
          grep -Fq "versionCode='5625'" /tmp/aapt.txt
          grep -Fq "versionName='0.1.332'" /tmp/aapt.txt
          sha256sum "$APK" | tee /tmp/apk.sha256
          mkdir -p /tmp/0332
          cp "$APK" /tmp/0332/rota-certa-0.1.332-agenda-public-search-today-start.apk
          cp /tmp/apk.sha256 /tmp/0332/apk.sha256
          cp /tmp/aapt.txt /tmp/0332/aapt.txt
          cp /tmp/apksigner.txt /tmp/0332/apksigner.txt
          cp /tmp/gradle.txt /tmp/0332/gradle.txt
          git rev-parse HEAD > /tmp/0332/source-head.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.332-agenda-public-search-today-start
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0332
