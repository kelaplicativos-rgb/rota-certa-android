name: Rota Certa 0.1.337 Agenda full-screen date selector

on:
  push:
    branches:
      - agent/agenda-public-search-date-fullscreen-ux-0.1.337
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-0337-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agenda-public-search-date-fullscreen-ux-0.1.337
          fetch-depth: 0

      - name: Validate 0.1.337 full-screen date selector
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -Fq 'versionCode = 5630' app/build.gradle.kts
