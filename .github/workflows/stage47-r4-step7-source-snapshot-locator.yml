name: Stage47 source snapshot run locator

on:
  push:
    branches:
      - agent/stage47-r4-step7-automatic-identity

permissions:
  actions: read
  issues: write

jobs:
  locate-source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish matching source snapshot run id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow stage47-r4-step7-source-snapshot.yml \
              --branch "$GITHUB_REF_NAME" \
              --event push \
              --limit 20 \
              --json databaseId,headSha \
              --jq '.[] | select(.headSha == env.GITHUB_SHA) | .databaseId' | head -n1)"
            [[ -n "$RUN_ID" ]] && break
            sleep 2
          done
          gh pr comment 112 --repo "$GITHUB_REPOSITORY" \
            --body "Stage47 persisted-source snapshot run: ${RUN_ID:-not-found} • head ${GITHUB_SHA} • source-only • apk_generated=false"
          test -n "$RUN_ID"
