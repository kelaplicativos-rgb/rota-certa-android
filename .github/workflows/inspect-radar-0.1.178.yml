name: Inspect radar sources 0.1.178

on:
  push:
    branches: [agent/radar-edit-delete-dismiss-0.1.178]
    paths:
      - .github/workflows/inspect-radar-0.1.178.yml
      - scripts/inspect_radar_0178.sh
  pull_request:
    branches: [agent/fix-shortcut-module-focus-0.1.177]
    paths:
      - .github/workflows/inspect-radar-0.1.178.yml
      - scripts/inspect_radar_0178.sh
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: codex/unified-debug-log-0.1.139
          fetch-depth: 0
          path: source

      - name: Checkout cumulative patches
        uses: actions/checkout@v4
        with:
          ref: agent/radar-edit-delete-dismiss-0.1.178
          fetch-depth: 0
          path: patches

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Materialize 0.1.177 and collect radar sources
        working-directory: source
        run: bash ../patches/scripts/inspect_radar_0178.sh ../patches

      - name: Upload inspection bundle
        uses: actions/upload-artifact@v4
        with:
          name: inspection-radar-0.1.178
          path: source/inspection-radar-0178.tar.gz
          retention-days: 7
          if-no-files-found: error
