name: Apply Bubble Idle Fix

on:
  push:
    branches:
      - codex/radar-txt-approach-alert-fix
    paths:
      - .github/workflows/apply-bubble-idle-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/radar-txt-approach-alert-fix

      - name: Patch bubble idle behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt')
          text = path.read_text()
          old = '''    private fun resetToDefaultForNonRideScreen(reason: String, record: Boolean = false) {
        resetToDefault(reason = reason, record = record)
    }
'''
          new = '''    private fun resetToDefaultForNonRideScreen(reason: String, record: Boolean = false) {
        resetToIdle(reason = reason, record = record)
    }
'''
          if old not in text and new not in text:
              raise SystemExit('Target resetToDefaultForNonRideScreen block not found')
          text = text.replace(old, new)
          text = text.replace(
              'Tela passiva detectada fora do card cadastrado; bolinha voltou para amarelo.',
              'Tela passiva detectada fora do card cadastrado; bolinha em espera.',
          )
          text = text.replace(
              'O pop-up de corrida nao esta mais visivel; bolinha voltou para amarelo.',
              'O pop-up de corrida nao esta mais visivel; bolinha em espera.',
          )
          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          git commit -m "Fix bubble idle state outside monitored apps"
          git push
