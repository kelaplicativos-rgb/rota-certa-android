name: Build Rota Certa 0.1.148

on:
  pull_request:
    branches: [codex/rota-certa-0.1.146-base]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false
      - name: Apply 0.1.148 fixes
        run: python3 -u scripts/apply_user_fixes_0148.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Verify correction contract
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.1.148"' app/build.gradle.kts
          grep -q 'versionCode = 5090' app/build.gradle.kts
          grep -q 'authorized_apps_first_0_1_148' app/src/main/java/br/com/mapeiaia/rotacerta/InstalledRideAppPickerActivity.kt
          grep -q 'compareByDescending<InstalledRideAppInfo>' app/src/main/java/br/com/mapeiaia/rotacerta/InstalledRideAppPickerActivity.kt
          grep -q 'bubble_size_live_render_0_1_148' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'params.width = sizePx' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'params.height = sizePx' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
      - name: Unit tests
        run: gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain
      - name: Android lint
        run: gradle lintDebug --no-daemon --stacktrace --console=plain
      - name: Build and validate APK
        run: |
          set -euo pipefail
          gradle clean assembleDebug --no-daemon --stacktrace --console=plain
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='br.com.mapeiaia.rotacerta'" badging.txt
          grep -q "versionName='0.1.148'" badging.txt
          grep -q "versionCode='5090'" badging.txt
          mkdir -p validated
          cp "$APK" validated/rota-certa-0.1.148-estavel-validado.apk
          sha256sum validated/rota-certa-0.1.148-estavel-validado.apk > validated/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.148-estavel-validado
          path: validated/
          retention-days: 90
          if-no-files-found: error
