name: Rota Certa 0.1.569 public Agenda shell + BlaBlaCar + WhatsApp

on:
  push:
    branches:
      - agent/public-agenda-shell-blablacar-whatsapp-0.1.569
    paths:
      - '.github/workflows/public-agenda-shell-0569.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-agenda-shell-0569-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-validate-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout branch HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/public-agenda-shell-blablacar-whatsapp-0.1.569

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Materialize public shell contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app_path = Path('trip-platform/public/app.js')
          index_path = Path('trip-platform/public/index.html')
          test_path = Path('trip-platform/functions/test/agenda-public-read-only-0475.test.js')
          gradle_path = Path('app/build.gradle.kts')

          app = app_path.read_text()
          if 'PUBLIC_AGENDA_SHELL_0569' not in app:
              needle = 'let agendaChangeWatchRunning0495 = false;\n'
              assert needle in app
              app = app.replace(needle, needle + '''let publicDriverWhatsapp0569 = "";\nlet publicDriverDisplayName0569 = "";\n\nconst PUBLIC_AGENDA_SHELL_0569 = true;\n\nfunction whatsappDigits0569(raw) {\n  const digits = String(raw || "").replace(/\\D/g, "");\n  return digits.length >= 10 && digits.length <= 15 ? digits : "";\n}\n\nfunction publicWhatsappHref0569() {\n  const digits = whatsappDigits0569(publicDriverWhatsapp0569);\n  if (!digits) return "";\n  const message = "Olá! Vi suas viagens na Agenda Rota Certa e gostaria de falar sobre uma reserva.";\n  return "https://wa.me/" + digits + "?text=" + encodeURIComponent(message);\n}\n\nfunction syncPublicWhatsappFab0569() {\n  const fab = $("whatsappFab0569");\n  if (!fab) return;\n  const href = publicWhatsappHref0569();\n  if (!href) {\n    fab.removeAttribute("href");\n    fab.classList.add("hidden");\n    fab.setAttribute("aria-hidden", "true");\n    return;\n  }\n  fab.href = href;\n  fab.rel = "noopener noreferrer";\n  fab.classList.remove("hidden");\n  fab.setAttribute("aria-hidden", "false");\n}\n\nfunction publicPassengerCount0569(item) {\n  const direct = Number(item?.confirmedPassengerSeats);\n  if (Number.isFinite(direct) && direct >= 0) return Math.floor(direct);\n  const values = publicSegmentRows0484(item)\n    .map((segment) => Number(segment.passengerSeats))\n    .filter((value) => Number.isFinite(value) && value >= 0);\n  return values.length ? Math.max(...values.map(Math.floor)) : null;\n}\n\n''', 1)

              render_start = app.index('function renderAgendaCards(entries, container) {')
              render_end = app.index('\nlet agendaLoadInFlight0491 = false;', render_start)
              render = r'''function renderAgendaCards(entries, container) {
  entries.forEach((item) => {
    const stops = orderedStops(item);
    const fromIndex = 0;
    const toIndex = stops.length - 1;
    const from = String(stops[fromIndex]?.name || "Origem").trim();
    const to = String(stops[toIndex]?.name || "Destino").trim();
    const startStop = stops[fromIndex];
    const endStop = stops[toIndex];
    const startMillis = Number(item.departureAtMillis || 0) ||
      agendaSegmentMoment0473(item, startStop, 0, item.departureAtMillis);
    const endMillis = agendaSegmentMoment0473(item, endStop, toIndex, 0);
    const duration = agendaDurationBetween0473(startMillis, endMillis);
    const reservationHref0569 = validatedBlaBlaReservationUrl0541(item?.blablaPublicUrl);
    const passengerCount0569 = publicPassengerCount0569(item);

    const card = document.createElement(reservationHref0569 ? "a" : "article");
    card.className = "agendaTrip agendaTripShell0569" + (reservationHref0569 ? "" : " agendaTripUnavailable0569");
    card.setAttribute("data-card-surface", "public-shell-0569");
    if (reservationHref0569) {
      card.href = reservationHref0569;
      card.rel = "noopener noreferrer";
      card.setAttribute("aria-label", "Abrir a viagem de " + from + " para " + to + " na BlaBlaCar");
      card.addEventListener("click", () => {
        agendaReservationTelemetry0541(
          "AGENDA_RESERVATION_PUBLICATION_OPENED_0541",
          item,
          "CANONICAL_BLABLACAR_PUBLICATION",
        );
      });
    } else {
      card.setAttribute("aria-disabled", "true");
      card.setAttribute("aria-label", "Viagem de " + from + " para " + to + ". Publicação BlaBlaCar indisponível.");
      agendaReservationTelemetry0541(
        "AGENDA_RESERVATION_UNAVAILABLE_0541",
        item,
        item?.blablaPublicUrl ? "PUBLICATION_URL_REJECTED" : "PUBLICATION_URL_ABSENT",
      );
    }

    const top0569 = document.createElement("div");
    top0569.className = "agendaShellTop0569";

    const date0569 = document.createElement("strong");
    date0569.className = "agendaShellDate0569";
    date0569.textContent = agendaDateLabel0473(item.departureAtMillis, item.timezoneId);

    const driver0569 = document.createElement("span");
    driver0569.className = "agendaShellDriver0569";
    driver0569.textContent = publicDriverDisplayName0569 || driverUsername;

    top0569.append(date0569, driver0569);

    const journey0569 = document.createElement("div");
    journey0569.className = "agendaJourney0473 agendaJourneyShell0569";

    const startTime0569 = document.createElement("div");
    startTime0569.className = "agendaJourneyTime0473 agendaJourneyStart0473";
    const startClock0569 = document.createElement("strong");
    startClock0569.textContent = agendaTripTime0496(startMillis || item.departureAtMillis, item.timezoneId);
    startTime0569.appendChild(startClock0569);
    if (duration) {
      const duration0569 = document.createElement("small");
      duration0569.className = "agendaJourneyDuration0473";
      duration0569.textContent = duration;
      startTime0569.appendChild(duration0569);
    }

    const rail0569 = document.createElement("div");
    rail0569.className = "agendaJourneyRail0473";
    rail0569.innerHTML = '<span class="agendaJourneyDot0473"></span><span class="agendaJourneyLine0473"></span><span class="agendaJourneyDot0473"></span>';
    rail0569.setAttribute("aria-hidden", "true");

    const startCity0569 = document.createElement("div");
    startCity0569.className = "agendaJourneyCity0473 agendaJourneyStartCity0473";
    startCity0569.textContent = from;

    const endTime0569 = document.createElement("div");
    endTime0569.className = "agendaJourneyTime0473 agendaJourneyEnd0473";
    const endClock0569 = document.createElement("strong");
    endClock0569.textContent = agendaTripTime0496(endMillis, item.timezoneId);
    endTime0569.appendChild(endClock0569);

    const endCity0569 = document.createElement("div");
    endCity0569.className = "agendaJourneyCity0473 agendaJourneyEndCity0473";
    endCity0569.textContent = to;

    journey0569.append(startTime0569, rail0569, startCity0569, endTime0569, endCity0569);

    const occupancy0569 = document.createElement("div");
    occupancy0569.className = "agendaShellOccupancy0569";
    const car0569 = document.createElement("span");
    car0569.setAttribute("aria-hidden", "true");
    car0569.textContent = "🚗";
    const passengerText0569 = document.createElement("span");
    if (passengerCount0569 == null) {
      passengerText0569.textContent = "Viagem publicada";
    } else if (passengerCount0569 === 1) {
      passengerText0569.textContent = "1 passageiro";
    } else {
      passengerText0569.textContent = passengerCount0569 + " passageiros";
    }
    occupancy0569.append(car0569, passengerText0569);

    card.append(top0569, journey0569, occupancy0569);
    container.appendChild(card);
  });
}

function renderAgenda(trips) {
  const visibleTrips = trips
    .filter(publicCardEligible0475)
    .sort((a, b) => Number(a.departureAtMillis || 0) - Number(b.departureAtMillis || 0));

  $("agendaTrips").innerHTML = "";
  if (!visibleTrips.length) {
    const empty = document.createElement("div");
    empty.className = "card muted";
    empty.textContent = "Nenhuma próxima viagem encontrada.";
    $("agendaTrips").appendChild(empty);
  } else {
    renderAgendaCards(visibleTrips, $("agendaTrips"));
  }
  show("loading", false);
  show("error", false);
  show("agenda", true);
}
'''
              app = app[:render_start] + render + app[render_end:]

              config_start = app.index('function configurePassengerAreaLink0491() {')
              config_end = app.index('\nlet agendaStaticFailoverActive0517', config_start)
              app = app[:config_start] + app[config_end:]
              app = app.replace('configurePassengerAreaLink0491();\n', '')

              old_apply = '''function applyPublicAgendaBody0517(body, fromStaticFailover0517 = false) {\n  const displayName = String(body?.driver?.displayName || driverUsername || "").trim();\n  $("driverName").textContent = displayName ? "Viagens com " + displayName : "";\n'''
              new_apply = '''function applyPublicAgendaBody0517(body, fromStaticFailover0517 = false) {\n  publicDriverDisplayName0569 = String(body?.driver?.displayName || driverUsername || "").trim();\n  publicDriverWhatsapp0569 = String(body?.driver?.whatsapp || "").trim();\n  syncPublicWhatsappFab0569();\n'''
              assert old_apply in app
              app = app.replace(old_apply, new_apply, 1)
              app_path.write_text(app)

          index = r'''<!doctype html>
<html lang="pt-BR">
<head>
