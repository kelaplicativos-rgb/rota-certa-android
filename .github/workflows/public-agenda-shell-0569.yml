test("0569 card shell opens only the canonical BlaBlaCar publication and has no internal CTA", () => {
  assert.equal((app.match(/function renderAgendaCards/g) || []).length, 1);
  const render = between(app, "function renderAgendaCards", "function renderAgenda(trips)");
  assert.match(render, /agendaTripShell0569/);
