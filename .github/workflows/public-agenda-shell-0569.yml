    .agendaShellOccupancy0569{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:20px;line-height:1.2;color:#514b54}
    .agendaShellOccupancy0569 span:first-child{font-size:25px}
    .whatsappFab0569{position:fixed;z-index:1000;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:9px;min-height:56px;max-width:calc(100vw - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));padding:14px 19px;border-radius:999px;background:#128c4a;color:#fff;font-size:17px;line-height:1;font-weight:850;text-decoration:none;box-shadow:0 8px 28px #0003;touch-action:manipulation;white-space:nowrap}
    .whatsappFab0569:focus-visible{outline:3px solid #0b6033;outline-offset:3px}
