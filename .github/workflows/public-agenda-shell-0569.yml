</main>
<a id="whatsappFab0569" class="whatsappFab0569 hidden" aria-hidden="true" aria-label="Falar com o motorista pelo WhatsApp">💬 <span>WhatsApp</span></a>
<script src="/app.js?v=0.1.569-public-shell0569" defer></script>
</body>
</html>
'''
          index_path.write_text(index)

          test = test_path.read_text()
          first = test.index('test("0475 public HTML contains only the read-only trip list surface"')
          second = test.index('test("0475 browser bundle is read-only and keeps the canonical 0473 card hierarchy"', first)
          third = test.index('test("0475 public backend lists every future committed canonical profile without login or legacy admin switches"', second)
          replacement = r'''test("0569 public HTML is only the trip shell plus fixed WhatsApp", () => {
  assert.match(html, /id="agendaTrips"/);
  assert.match(html, /app\.js\?v=0\.1\.569-public-shell0569/);
  assert.match(html, /id="whatsappFab0569"/);
  assert.match(html, /position:fixed/);
  assert.match(html, /safe-area-inset-bottom/);
  assert.doesNotMatch(html, /passengerAreaLink0491/);
