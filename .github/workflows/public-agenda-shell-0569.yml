    .agendaJourneyCity0473{grid-column:3;font-size:27px;line-height:1.13;font-weight:850;letter-spacing:-.015em;padding:0 0 10px;overflow-wrap:anywhere}
    .agendaJourneyStartCity0473{grid-row:1}
