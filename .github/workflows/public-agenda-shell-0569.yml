    @media(max-width:480px){
      main{padding-left:12px;padding-right:12px}
      .agendaTrip{padding:20px 18px 22px;border-radius:24px}
      .agendaShellDate0569{font-size:26px}
      .agendaShellDriver0569{font-size:19px}
      .agendaJourney0473{grid-template-columns:72px 25px minmax(0,1fr);column-gap:8px}
      .agendaJourneyTime0473 strong{font-size:23px}
      .agendaJourneyDuration0473{font-size:18px}
