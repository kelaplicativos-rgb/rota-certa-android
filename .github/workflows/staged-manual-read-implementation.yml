name: Staged Manual Read Implementation

on:
  pull_request:
    branches:
      - codex/rota-certa-checklist-complete
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: staged-manual-read-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Materialize current generated sources once
        run: gradle :app:preBuild --no-daemon --stacktrace --console=plain

      - name: Restore staged implementation script
        run: |
          cat scripts/.stage-script.gz.b64.part0 scripts/.stage-script.gz.b64.part1 \
            | base64 --decode | gzip --decompress > scripts/apply_staged_manual_contract.py
          chmod +x scripts/apply_staged_manual_contract.py
          rm scripts/.stage-script.gz.b64.part0 scripts/.stage-script.gz.b64.part1

      - name: Stage 1 - materialize stable source
        run: |
          python3 scripts/apply_staged_manual_contract.py stage1
          gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Stage 2 - manual packages and no model gate
        run: |
          python3 scripts/apply_staged_manual_contract.py stage2
          gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Stage 3 - real expanders for alerts and places
        run: |
          python3 scripts/apply_staged_manual_contract.py stage3
          gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Stage 4 - bubble gestures and confirmations
        run: |
          python3 scripts/apply_staged_manual_contract.py stage4
          gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Stage 5 - remove source mutators
        run: |
          python3 scripts/apply_staged_manual_contract.py stage5 verify
          test -z "$(grep -R 'apply(from' -n app/build.gradle.kts || true)"
          test -z "$(find app -maxdepth 1 -name '*.gradle.kts' ! -name 'build.gradle.kts' -print -quit)"

      - name: Run final unit tests twice without source mutation
        run: |
          set -euo pipefail
          before="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain
          middle="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          gradle testDebugUnitTest --no-daemon --stacktrace --console=plain
          after="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test "$before" = "$middle"
          test "$middle" = "$after"

      - name: Run Android Lint
        run: gradle lintDebug --no-daemon --stacktrace --console=plain

      - name: Build APK twice and verify unchanged source tree
        run: |
          set -euo pipefail
          gradle assembleDebug --no-daemon --stacktrace --console=plain
          source_hash_1="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          cp app/build/outputs/apk/debug/app-debug.apk first.apk
          gradle assembleDebug --no-daemon --stacktrace --console=plain
          source_hash_2="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test "$source_hash_1" = "$source_hash_2"
          cp app/build/outputs/apk/debug/app-debug.apk rota-certa-0.1.137.apk
          sha256sum rota-certa-0.1.137.apk > apk-sha256.txt

      - name: Write validation report
        run: |
          cat > staged-validation.txt <<EOF
          BRANCH=$HEAD_BRANCH
          VERSION=0.1.137
          STAGE_1_STABLE_SOURCE=approved
          STAGE_2_MANUAL_SELECTION_ONLY=approved
          STAGE_2_PREDEFINED_AUTHORIZATION_LIST=removed
          STAGE_2_CARD_MODEL_GATE=removed
          STAGE_2_TWO_ADDRESS_TRIGGER=approved
          STAGE_3_REAL_EXPANDERS=approved
          STAGE_4_DOUBLE_TAP_ALERT=approved
          STAGE_4_OUTSIDE_TAP_CLOSE=approved
          STAGE_4_DISMISS_UNTIL_EXIT=approved
          STAGE_5_SOURCE_MUTATORS=removed
          UNIT_TESTS_EACH_STAGE=approved
          UNIT_TESTS_FINAL_TWICE=approved
          LINT=approved
          APK_TWICE=approved
          EOF

      - name: Push validated staged commits
        run: git push origin HEAD:"$HEAD_BRANCH"

      - name: Upload validated APK and report
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.137-staged
          path: |
            rota-certa-0.1.137.apk
            apk-sha256.txt
            staged-validation.txt
          if-no-files-found: error

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staged-manual-read-failure
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
