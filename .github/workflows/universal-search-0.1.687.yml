name: Universal search 0.1.687 APK

on:
  push:
    branches:
      - 'agent/universal-search-0.1.687'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-search-0687-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      ROTA_CERTA_GIT_SHA: ${{ github.sha }}
      ROTA_CERTA_GIT_BRANCH: agent/universal-search-0.1.687

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact universal search source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ROTA_CERTA_GIT_SHA"
          grep -Fq 'releaseVersionName = "0.1.687"' app/build.gradle.kts
          grep -Fq 'releaseVersionCode = 5_978' app/build.gradle.kts
          grep -Fq '"version": "0.1.687"' app/src/main/assets/release_history.json
          grep -Fq 'UNIVERSAL_SEARCH_ENGINE_0687' app/src/main/java/br/com/mapeiaia/rotacerta/trips/UniversalTripSearch0687.kt
          grep -Fq 'onUniversalSearchClick0687' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaHeaderNavigation0396.kt
          grep -Fq 'TripScreen.SEARCH' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'Busca universal em Timeline, Agenda e Central' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaHeaderNavigation0396.kt
          git diff --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run universal search and preserved safety regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest             --tests 'br.com.mapeiaia.rotacerta.trips.UniversalTripSearch0687Test'             --tests 'br.com.mapeiaia.rotacerta.RadarSafetyPolicy0686Test'             --tests 'br.com.mapeiaia.rotacerta.FarolRouteAddressSanitizer0684Test'             --no-daemon --max-workers=2 --stacktrace | tee /tmp/android-0687-tests.log

      - name: Assemble exact source APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace | tee /tmp/android-0687-assemble.log
          test "$(git rev-parse HEAD)" = "$ROTA_CERTA_GIT_SHA"

      - name: Prove APK identity signing and exact final SHA
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -s "$APK"
          unzip -t "$APK" | tee /tmp/android-0687-zip-integrity.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/android-0687-aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/android-0687-aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='5978'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='0.1.687'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/android-0687-apksigner.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/android-0687-apksigner.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/android-0687-dex-strings.txt
          grep -Fq "$ROTA_CERTA_GIT_SHA" /tmp/android-0687-dex-strings.txt
          grep -Fq 'UNIVERSAL_SEARCH_ENGINE_0687' /tmp/android-0687-dex-strings.txt
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          FINAL="rota-certa-0.1.687-5978-$SHORT_SHA.apk"
          cp "$APK" "$FINAL"
          echo "apk=$FINAL" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "package=br.com.mapeiaia.rotacerta"
            echo "versionName=0.1.687"
            echo "versionCode=5978"
            echo "branch=agent/universal-search-0.1.687"
            echo "commit=$ROTA_CERTA_GIT_SHA"
            echo "deviceTarget=Samsung SM-S911B / Android 16"
            echo "universalSearch=ACTIVE"
            echo "searchSurfaces=TIMELINE,AGENDA,CENTRAL_DAY"
            echo "minimumQueryLength=1"
            echo "substringMatch=ANY_POSITION"
            echo "accentCaseNormalization=ACTIVE"
            echo "phoneDigitAlias=ACTIVE"
            echo "dateTimeMoneyAliases=ACTIVE"
            echo "offlineLocalSearch=ACTIVE"
            echo "apk=$FINAL"
            echo "apk_sha256=$APK_SHA256"
          } | tee universal-search-0687-proof.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-universal-search-0.1.687-${{ github.sha }}
          path: |
            ${{ steps.proof.outputs.apk }}
            universal-search-0687-proof.txt
            /tmp/android-0687-tests.log
            /tmp/android-0687-assemble.log
            /tmp/android-0687-aapt.txt
            /tmp/android-0687-apksigner.txt
            /tmp/android-0687-zip-integrity.txt
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30
