name: Verify Agenda trip script executor

on:
  push:
    branches:
      - agent/agenda-trip-script-executor-0.1.558
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-trip-script-executor-01558-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact triggering HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Verify script executor and canonical regressions
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests 'br.com.mapeiaia.rotacerta.trips.AgendaTripScriptExecutor0558Test'
          --tests 'br.com.mapeiaia.rotacerta.trips.AgendaDeterministicTripOutbox0387Test'
          --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalTripState0395Test'
          --tests 'br.com.mapeiaia.rotacerta.trips.TimelineLocalPrimary0525Test'
          --stacktrace --no-daemon
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-agenda-trip-script-executor-0.1.558-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
