name: Rota Certa Agenda consolidation 0.1.416
# exact-SHA build for physical Samsung validation

on:
  push:
    branches:
      - agent/agenda-navigation-notifications-profiles-0.1.416
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-navigation-notifications-profiles-0416-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: agenda_0416_ci_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          grep -Fq 'versionCode = 5709' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.416"' app/build.gradle.kts
          printf '%s\n' "${{ github.sha }}" > source_head.txt
          printf '%s\n' "${{ github.ref_name }}" > source_branch.txt
          git diff --name-only 47d8254feddc0f879feac68d598ea477c22b7c25...HEAD > changed-files.txt

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Run focused 0.1.416 tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaNavigationNotificationsProfiles0416Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaHeaderNavigation0396Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaFixedHeaderAccountsBrowsers0399Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaTimelineSurface0415Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaVehiclePanelCollapsed0354Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.OnlineSettingsVehicleUsername0351Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaPublicSearchTest' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalTripState0395Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripUnifiedInventory0372Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripInventorySourceTruth0374Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Compile all debug unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Assemble APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat source_head.txt)"
          sha256sum app/build/outputs/apk/debug/app-debug.apk > apk.sha256
          grep -E 'version(Code|Name) = ' app/build.gradle.kts > app-version.txt

      - name: Upload exact SHA APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.416-agenda-consolidation-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            source_head.txt
            source_branch.txt
            app-version.txt
            apk.sha256
            changed-files.txt
