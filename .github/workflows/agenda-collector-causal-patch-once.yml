name: Agenda collector causal patch once

on:
  push:
    branches:
      - agent/passenger-timeline-geo-ux

permissions:
  contents: write

jobs:
  apply-causal-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kelaplicativos-rgb/rota-certa-android
          ref: agent/passenger-timeline-geo-ux
          fetch-depth: 1

      - name: Apply exact existing Agenda patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'AUTOMATIC_SEAT_LOOKUP_SKIPPED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt; then
            echo 'causal patch already present'
            exit 0
          fi
          echo '' | base64 -d > /tmp/agenda_patch.py
          python3 /tmp/agenda_patch.py
          git diff --check
          grep -Fq 'AUTOMATIC_SEAT_LOOKUP_SKIPPED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          grep -Fq 'versionCode = 5565' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.272"' app/build.gradle.kts

      - name: Persist patch on work branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'no patch to persist'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDirectCollector0262Test.kt app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaCollectorModules0264Test.kt app/build.gradle.kts
          git commit -m '[agenda-auto-seat-fix] fix(agenda): keep network-first trips without automatic seat lookup'
          git push origin HEAD:agent/passenger-timeline-geo-ux
