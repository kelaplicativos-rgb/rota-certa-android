          anchor = '          test -s app/src/test/java/br/com/mapeiaia/rotacerta/trips/PassengerTimeline0253Test.kt\n'
          if anchor not in w:
              raise SystemExit('workflow test anchor missing')
          w = w.replace(anchor, '          test -s app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDirectCollectorP0.kt\n          test -s app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDirectCollector0261Test.kt\n' + anchor, 1)
          wf.write_text(w)
          PY

      - name: Verify source contract, remove one-time workflow, commit
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
