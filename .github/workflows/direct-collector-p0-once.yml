          grep -Fq 'addressPresent=' "$DYNAMIC"
          grep -Fq 'coordinatePresent=' "$DYNAMIC"
          grep -Fq 'dataCoverage=' "$DYNAMIC"
          grep -Fq 'versionCode = 5554' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.261"' app/build.gradle.kts
          git diff --check
          git rm .github/workflows/direct-collector-p0-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDirectCollectorP0.kt \
