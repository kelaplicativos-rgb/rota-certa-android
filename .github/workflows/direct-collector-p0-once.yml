name: Apply direct collector P0 once

on:
  push:
    branches:
      - agent/passenger-timeline-geo-ux
    paths:
      - .github/workflows/direct-collector-p0-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/passenger-timeline-geo-ux
          fetch-depth: 0

      - name: Verify starting point and protected FAROL
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ada652324377af879a475faab5e16c1041f5b34f"
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560"

      - name: Add direct collector state helpers and regressions
        run: |
          set -euo pipefail
          cat > app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDirectCollectorP0.kt <<'EOF'
          package br.com.mapeiaia.rotacerta.trips

          internal enum class BlaBlaDirectRosterState {
              UNKNOWN,
              COMPLETE_EMPTY,
              COMPLETE_WITH_PASSENGERS,
          }

          internal fun blaBlaDirectRosterState(
              passengerCount: Int,
              rosterComplete: Boolean,
              explicitEmpty: Boolean,
          ): BlaBlaDirectRosterState = when {
              explicitEmpty && passengerCount == 0 -> BlaBlaDirectRosterState.COMPLETE_EMPTY
              rosterComplete && passengerCount > 0 -> BlaBlaDirectRosterState.COMPLETE_WITH_PASSENGERS
              else -> BlaBlaDirectRosterState.UNKNOWN
          }

          internal enum class BlaBlaDirectPassengerStep {
              RESERVATION_URL,
              PASSENGER_CARD,
              SKIP,
              FINISH,
          }

          internal fun blaBlaDirectPassengerStep(
              passengerPresent: Boolean,
              hasBookingHref: Boolean,
              needsReservationPage: Boolean,
              hasPassengerCard: Boolean,
          ): BlaBlaDirectPassengerStep = when {
              !passengerPresent -> BlaBlaDirectPassengerStep.FINISH
              hasBookingHref && needsReservationPage -> BlaBlaDirectPassengerStep.RESERVATION_URL
              !hasBookingHref && hasPassengerCard -> BlaBlaDirectPassengerStep.PASSENGER_CARD
              else -> BlaBlaDirectPassengerStep.SKIP
          }

          internal fun blaBlaDirectCollectorStatus(
              accountCount: Int,
              verifiedAccountCount: Int,
              identityConflictCount: Int,
              rosterIncompleteCount: Int,
              skippedCount: Int,
          ): String = when {
              accountCount <= 0 -> "empty"
              verifiedAccountCount <= 0 -> "blocked"
              identityConflictCount > 0 || rosterIncompleteCount > 0 || skippedCount > 0 -> "partial"
              verifiedAccountCount == accountCount -> "validated"
              else -> "partial"
          }

          internal fun blaBlaDirectCoverageComplete(
              accountCount: Int,
              verifiedAccountCount: Int,
              identityConflictCount: Int,
              rosterIncompleteCount: Int,
              skippedCount: Int,
          ): Boolean = blaBlaDirectCollectorStatus(
              accountCount = accountCount,
              verifiedAccountCount = verifiedAccountCount,
              identityConflictCount = identityConflictCount,
              rosterIncompleteCount = rosterIncompleteCount,
              skippedCount = skippedCount,
          ) == "validated"

          internal fun blaBlaDirectCallbackMatches(
              expectedSyncGeneration: Long,
              expectedNavigationGeneration: Long,
              expectedCandidateIndex: Int,
              expectedTripId: String?,
              currentSyncGeneration: Long,
              currentNavigationGeneration: Long,
              currentCandidateIndex: Int,
              currentTripId: String?,
          ): Boolean =
              expectedSyncGeneration == currentSyncGeneration &&
                  expectedNavigationGeneration == currentNavigationGeneration &&
                  expectedCandidateIndex == currentCandidateIndex &&
                  !expectedTripId.isNullOrBlank() &&
                  expectedTripId == currentTripId
          EOF

          cat > app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDirectCollector0261Test.kt <<'EOF'
          package br.com.mapeiaia.rotacerta.trips

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class BlaBlaDirectCollector0261Test {
              @Test
              fun incompleteEmptyRosterRemainsUnknown() {
                  assertEquals(
                      BlaBlaDirectRosterState.UNKNOWN,
                      blaBlaDirectRosterState(0, rosterComplete = false, explicitEmpty = false),
                  )
              }

              @Test
              fun explicitEmptyRosterCanFinalize() {
                  assertEquals(
                      BlaBlaDirectRosterState.COMPLETE_EMPTY,
                      blaBlaDirectRosterState(0, rosterComplete = true, explicitEmpty = true),
                  )
              }

              @Test
              fun positiveRosterMustBeReportedComplete() {
                  assertEquals(
                      BlaBlaDirectRosterState.UNKNOWN,
                      blaBlaDirectRosterState(2, rosterComplete = false, explicitEmpty = false),
                  )
                  assertEquals(
                      BlaBlaDirectRosterState.COMPLETE_WITH_PASSENGERS,
                      blaBlaDirectRosterState(2, rosterComplete = true, explicitEmpty = false),
                  )
              }

              @Test
              fun bookingHrefStartsIndividualReservationStep() {
                  assertEquals(
                      BlaBlaDirectPassengerStep.RESERVATION_URL,
                      blaBlaDirectPassengerStep(true, hasBookingHref = true, needsReservationPage = true, hasPassengerCard = false),
                  )
              }

              @Test
              fun passengerCardIsUsedWhenHrefIsNotExposed() {
                  assertEquals(
                      BlaBlaDirectPassengerStep.PASSENGER_CARD,
                      blaBlaDirectPassengerStep(true, hasBookingHref = false, needsReservationPage = false, hasPassengerCard = true),
                  )
              }

              @Test
              fun staleCallbackCannotMatchNextCandidate() {
                  assertFalse(
                      blaBlaDirectCallbackMatches(7, 11, 2, "trip-a", 7, 12, 3, "trip-b"),
                  )
                  assertTrue(
                      blaBlaDirectCallbackMatches(7, 11, 2, "trip-a", 7, 11, 2, "trip-a"),
                  )
              }

              @Test
              fun validatedIdentityWithIncompleteDataIsPartial() {
                  assertEquals(
                      "partial",
                      blaBlaDirectCollectorStatus(2, 2, 0, rosterIncompleteCount = 3, skippedCount = 2),
                  )
                  assertFalse(
                      blaBlaDirectCoverageComplete(2, 2, 0, rosterIncompleteCount = 3, skippedCount = 2),
                  )
              }
          }
          EOF

