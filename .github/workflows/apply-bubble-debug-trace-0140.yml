name: Apply bubble debug trace 0.1.140

on:
  push:
    branches:
      - codex/unified-debug-log-0.1.139
    paths:
      - scripts/apply_bubble_debug_trace_0140.py
      - .github/workflows/apply-bubble-debug-trace-0140.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[applied-0.1.140]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unified-debug-log-0.1.139
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply complete bubble trace
        run: python scripts/apply_bubble_debug_trace_0140.py
      - name: Verify trace contract
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.1.140"' app/build.gradle.kts
          grep -q 'BUBBLE_TEXT_COLLECTED' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'BUBBLE_ADDRESS_EVALUATION' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'BUBBLE_DECISION_PAINTED' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'BUBBLE_CLEAR_PAINTED' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          ./gradlew testDebugUnitTest --no-daemon
      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app scripts/apply_bubble_debug_trace_0140.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Captura cadeia completa da bolinha [applied-0.1.140]'
          git push origin HEAD:codex/unified-debug-log-0.1.139

