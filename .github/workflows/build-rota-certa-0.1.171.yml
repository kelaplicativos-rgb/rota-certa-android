name: Build Rota Certa 0.1.171

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build-rota-certa-0.1.171.yml
      - scripts/fix_home_modules_long_press_0171.py.part00
      - scripts/fix_home_modules_long_press_0171.py.part01
      - scripts/fix_home_modules_long_press_0171.py.part02
      - scripts/fix_home_modules_long_press_0171.py.part03
      - scripts/fix_home_modules_long_press_0171.py.part04
      - docs/PROJECT_STATUS.md
      - docs/DECISIONS.md

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: codex/unified-debug-log-0.1.139
          fetch-depth: 0
          path: source

      - name: Checkout cumulative patches
        uses: actions/checkout@v4
        with:
          ref: agent/customizable-shortcut-long-press-0.1.171
          fetch-depth: 0
          path: patches

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Materialize protected source through 0.1.170
        working-directory: source
        run: |
          set -euo pipefail
          python scripts/fix_99_overlay_state_0151.py
          python scripts/fix_selected_package_state_0152.py
          python scripts/fix_transient_launcher_clear_0154.py
          python scripts/fix_bounded_empty_read_preservation_0155.py
          python scripts/fix_passive_churn_and_launcher_race_0156.py
          python scripts/fix_subsecond_farol_0157.py
          python scripts/remove_collector_completely_0158.py
          python scripts/run_value_finance_0159.py
          python scripts/fix_value_finance_0160.py
          python scripts/fix_value_finance_0160_compile.py
          python ../patches/scripts/fix_failed_card_autocapture_0161.py .
          python ../patches/scripts/fix_failed_card_autocapture_0161_rerun.py .
          python ../patches/scripts/fix_gigu_work_mode_session_0162.py .
          python ../patches/scripts/fix_gigu_work_mode_session_0162_rerun.py .
          python ../patches/scripts/fix_farol_flight_recorder_0163.py .
          python ../patches/scripts/fix_farol_flight_recorder_0163_rerun.py .
          python ../patches/scripts/fix_diagnostic_session_summary_0164.py .
          python ../patches/scripts/fix_diagnostic_session_summary_0164_rerun.py .
          python ../patches/scripts/fix_diagnostic_attempt_timeline_0165.py .
          python ../patches/scripts/fix_diagnostic_attempt_timeline_0165_rerun.py .
          python ../patches/scripts/fix_farol_selected_apps_0166.py .
          python ../patches/scripts/fix_farol_selected_apps_0166_rerun.py .
          python ../patches/scripts/fix_farol_realtime_0167.py .
          python ../patches/scripts/fix_farol_realtime_0167_rerun.py .
          python ../patches/scripts/run_fix_farol_unified_visual_0168.py .
          python ../patches/scripts/fix_farol_unified_visual_0168_compile.py .
          python ../patches/scripts/fix_uber_notification_wakeup_0169.py .
          python ../patches/scripts/fix_notification_wakeup_crash_containment_0170.py .
          grep -q 'versionName = "0.1.170"' app/build.gradle.kts
          grep -q 'versionCode = 5310' app/build.gradle.kts

      - name: Snapshot protected 0.1.170 tree
        working-directory: source
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          snapshot = {p.as_posix(): sha256(p.read_bytes()).hexdigest() for p in sorted(Path('app').rglob('*')) if p.is_file()}
          Path('/tmp/rota-certa-0170-source-snapshot.json').write_text(json.dumps(snapshot, sort_keys=True, indent=2), encoding='utf-8')
          PY
          cp app/src/main/AndroidManifest.xml /tmp/AndroidManifest-0.1.170.xml
          sha256sum \
            app/src/main/java/br/com/mapeiaia/rotacerta/DecisionEngine.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/GoogleMapsService.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/RideTextParser.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/FarolSelectedAppInputPolicy0166.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/FarolRealtimeEventGate0167.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/FarolUnifiedVisual0168.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/FarolNotificationWakeup0169.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/FarolNotificationFailureCircuit0170.kt \
            > /tmp/protected-0.1.170.sha256

      - name: Apply Home and long-press customization 0.1.171 twice
        working-directory: source
        run: |
          set -euo pipefail
          cat \
            ../patches/scripts/fix_home_modules_long_press_0171.py.part00 \
            ../patches/scripts/fix_home_modules_long_press_0171.py.part01 \
            ../patches/scripts/fix_home_modules_long_press_0171.py.part02 \
            ../patches/scripts/fix_home_modules_long_press_0171.py.part03 \
            ../patches/scripts/fix_home_modules_long_press_0171.py.part04 \
            > /tmp/fix_home_modules_long_press_0171.py
          python -m py_compile /tmp/fix_home_modules_long_press_0171.py
          python /tmp/fix_home_modules_long_press_0171.py .
          python /tmp/fix_home_modules_long_press_0171.py .

      - name: Verify isolated change boundary
        working-directory: source
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          before = json.loads(Path('/tmp/rota-certa-0170-source-snapshot.json').read_text(encoding='utf-8'))
          after = {p.as_posix(): sha256(p.read_bytes()).hexdigest() for p in sorted(Path('app').rglob('*')) if p.is_file()}
          modified = sorted(path for path in before.keys() & after.keys() if before[path] != after[path])
          added = sorted(after.keys() - before.keys())
          deleted = sorted(before.keys() - after.keys())
          expected_modified = sorted([
              'app/build.gradle.kts',
              'app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutModule.kt',
              'app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt',
              'app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt',
              'app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt',
          ])
          expected_added = sorted([
              'app/src/main/java/br/com/mapeiaia/rotacerta/ShortcutLongPressPolicy0171.kt',
              'app/src/test/java/br/com/mapeiaia/rotacerta/ShortcutLongPressPolicy0171Test.kt',
              'app/src/test/java/br/com/mapeiaia/rotacerta/ShortcutLongPressContract0171Test.kt',
          ])
          assert modified == expected_modified, (modified, expected_modified)
          assert added == expected_added, (added, expected_added)
          assert deleted == [], deleted
          print('Modified:', *modified, sep='\n- ')
          print('Added:', *added, sep='\n- ')
          PY
          cmp -s /tmp/AndroidManifest-0.1.170.xml app/src/main/AndroidManifest.xml
          sha256sum --check /tmp/protected-0.1.170.sha256

      - name: Verify Home and long-press contracts
        working-directory: source
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.1.171"' app/build.gradle.kts
          grep -q 'versionCode = 5320' app/build.gradle.kts
          grep -q 'ShortcutModulesHome0171' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          grep -q 'BubbleShortcutCatalog.modules.forEach' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          grep -q 'Ação ao manter pressionado o atalho' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          grep -q 'executeShortcutLongPress0171' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'showShortcutConfirmation0171' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt
          ! grep -q '(doubleAction ?: singleAction).invoke()' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt
          python -m py_compile /tmp/fix_home_modules_long_press_0171.py
          test -n "${GOOGLE_MAPS_API_KEY:-}"

      - name: Unit and contract tests
        working-directory: source
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Android lint
        working-directory: source
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build APK
        working-directory: source
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Validate APK
        working-directory: source
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee rota-certa-0.1.171-assinatura.txt
          grep -qi 'd9ee577b5bb9a4c72bce115e974c9ecf1ec8c7382bcd034e88d433e01eb0e7fd' rota-certa-0.1.171-assinatura.txt
          BADGING=$($AAPT dump badging "$APK" | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='br.com.mapeiaia.rotacerta'"
          echo "$BADGING" | grep -q "versionCode='5320'"
          echo "$BADGING" | grep -q "versionName='0.1.171'"
          cmp -s /tmp/AndroidManifest-0.1.170.xml app/src/main/AndroidManifest.xml
          for dex in $(zipinfo -1 "$APK" | grep -E '^classes([0-9]+)?\.dex$'); do unzip -p "$APK" "$dex"; done | strings > dex-strings.txt
          grep -q 'ShortcutLongPressPolicy0171' dex-strings.txt
          grep -q 'SHORTCUT_LONG_PRESS_0171' dex-strings.txt
          cp "$APK" rota-certa-0.1.171-home-modulos-toque-longo-personalizado-validado.apk
          sha256sum rota-certa-0.1.171-home-modulos-toque-longo-personalizado-validado.apk | tee rota-certa-0.1.171-sha256.txt
          printf 'Versao: 0.1.171 (5320)\nPacote: br.com.mapeiaia.rotacerta\nEscopo: módulos na Home e toque longo configurável por atalho\nManifest e permissões: inalterados\nFarol, parser, rota e decisão: preservados\n' > rota-certa-0.1.171-validacao.txt

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.171-home-modules-custom-long-press-validated
          path: |
            source/rota-certa-0.1.171-home-modulos-toque-longo-personalizado-validado.apk
            source/rota-certa-0.1.171-sha256.txt
            source/rota-certa-0.1.171-assinatura.txt
            source/rota-certa-0.1.171-validacao.txt
          retention-days: 90
          if-no-files-found: error
