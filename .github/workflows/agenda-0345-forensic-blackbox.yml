name: Rota Certa 0.1.345 Caixa Preta Forense Agenda

on:
  push:
    branches:
      - agent/agenda-forensic-blackbox-0.1.345
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-0345-forensic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate forensic contracts and version
        shell: bash
        run: |
          set -euo pipefail
          BASE=461296090fa243977ad6e389bde7d3764cf615a8
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -Fq 'versionCode = 5638' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.345"' app/build.gradle.kts

          grep -Fq 'fun recordAlways(' app/src/main/java/br/com/mapeiaia/rotacerta/UnifiedDebugLog.kt
          grep -Fq 'const val MAX_EVENTS = 6_000' app/src/main/java/br/com/mapeiaia/rotacerta/UnifiedDebugLog.kt
          grep -Fq 'droppedEvents += 1L' app/src/main/java/br/com/mapeiaia/rotacerta/UnifiedDebugLog.kt
          grep -Fq 'recordP95Ns' app/src/main/java/br/com/mapeiaia/rotacerta/UnifiedDebugLog.kt

          grep -Fq 'AGENDA_OPEN_TOTAL_MS' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaTrace.kt
          grep -Fq 'OPERATION_CANCELLED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaTrace.kt
          grep -Fq 'AGENDA_JANK_FREEZE' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaTrace.kt
          grep -Fq 'AGENDA_EMPTY_VISUAL_STATE_LONG' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaTrace.kt

          grep -Fq -- '--- RESUMO FORENSE DA AGENDA ---' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaForensicReport.kt
          grep -Fq -- '--- CADEIA CAUSAL DA AGENDA ---' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaForensicReport.kt
          grep -Fq -- '--- EVENTOS DETALHADOS DA AGENDA ---' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaForensicReport.kt
          grep -Fq 'AgendaForensicReportBuilder.freezeSnapshot()' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt

          grep -Fq 'CAPACITY_FIRST_VALUE_MS' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'TIMELINE_PUBLIC_BOOKING_RECONCILE_START' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'TIMELINE_PHYSICAL_CONSOLIDATION' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'BOOKING_RECONCILE_SLOW_' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicBookingSync0296.kt
          grep -Fq 'PUBLIC_AGENDA_SYNC_RESULT' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt

          grep -Fq 'checkpointPersistence=memory_hot_path_async_coalesced' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace.kt
          grep -Fq 'OPERATION_INCOMPLETE_DUE_PROCESS_TERMINATION' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace.kt
          ! grep -Fq 'readLines(Charsets.UTF_8)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace.kt

          grep -Fq 'sanitizeDetailsForExport' app/src/main/java/br/com/mapeiaia/rotacerta/FarolMaximumForensicsStage38.kt
          grep -Fq 'eventText|accessibilityText|rawText|messageText|typedText' app/src/main/java/br/com/mapeiaia/rotacerta/FarolMaximumForensicsStage38.kt

          grep -Fq 'PUBLIC_ACCESS_CONTACT_SUBMITTED' trip-platform/public/app.js
          grep -Fq 'PUBLIC_PRIVATE_AUTH_SUCCESS' trip-platform/public/app.js
          grep -Fq 'PUBLIC_PASSENGER_PORTAL_OPENED' trip-platform/public/app.js
          grep -Fq 'tripRefHash' trip-platform/functions/index.js
          grep -Fq 'agendaRefHash' trip-platform/functions/index.js

          TEST_COUNT="$(grep -c '@Test' app/src/test/java/br/com/mapeiaia/rotacerta/trips/AgendaForensicBlackBox0345Test.kt)"
          test "$TEST_COUNT" -ge 20

          CHANGED_FAROL="$(git diff --name-only "$BASE"..HEAD --             app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt             'app/src/main/java/br/com/mapeiaia/rotacerta/Farol*.kt'             | grep -v '^app/src/main/java/br/com/mapeiaia/rotacerta/FarolMaximumForensicsStage38.kt$' || true)"
          test -z "$CHANGED_FAROL"

          ALLOWED='^(app/build.gradle.kts|app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt|app/src/main/java/br/com/mapeiaia/rotacerta/UnifiedDebugLog.kt|app/src/main/java/br/com/mapeiaia/rotacerta/FarolMaximumForensicsStage38.kt|app/src/main/java/br/com/mapeiaia/rotacerta/trips/(AgendaTrace.kt|AgendaSyncCrashTrace.kt|AgendaForensicReport.kt|TripsActivity.kt|TripTimelineUi.kt|PublicBookingSync0296.kt|PublicAgendaAutoSync0300.kt)|app/src/test/java/br/com/mapeiaia/rotacerta/trips/(AgendaSyncCrashTrace0322Test.kt|AgendaForensicBlackBox0345Test.kt)|trip-platform/(functions/index.js|public/app.js)|.github/workflows/agenda-0345-forensic-blackbox.yml)$'
          UNEXPECTED="$(git diff --name-only "$BASE"..HEAD | grep -Ev "$ALLOWED" || true)"
          test -z "$UNEXPECTED"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test public portal contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/public/app.js
          node --test trip-platform/functions/test/*.test.js

      - name: Configure Firebase authentication for Android build
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase credential is missing."
            exit 3
          fi

      - name: Generate Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
          else
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
          fi
          APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
          test -n "$APP_ID"
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and build installable APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace | tee /tmp/gradle.txt
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'certificate SHA-256 digest: d9ee577b5bb9a4c72bce115e974c9ecf1ec8c7382bcd034e88d433e01eb0e7fd' /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta'" /tmp/aapt.txt
          grep -Fq "versionCode='5638'" /tmp/aapt.txt
          grep -Fq "versionName='0.1.345'" /tmp/aapt.txt
          sha256sum "$APK" | tee /tmp/apk.sha256
          mkdir -p /tmp/0345
          cp "$APK" /tmp/0345/rota-certa-0.1.345-agenda-forensic-blackbox.apk
          cp /tmp/apk.sha256 /tmp/0345/apk.sha256
          cp /tmp/aapt.txt /tmp/0345/aapt.txt
          cp /tmp/apksigner.txt /tmp/0345/apksigner.txt
          cp /tmp/gradle.txt /tmp/0345/gradle.txt
          git rev-parse HEAD > /tmp/0345/source-head.txt
          git diff --name-only 461296090fa243977ad6e389bde7d3764cf615a8..HEAD > /tmp/0345/changed-files.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.345-agenda-forensic-blackbox
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0345
