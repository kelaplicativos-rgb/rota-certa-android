name: FAROL coordinate resilience 0.1.697 APK

on:
  push:
    branches:
      - 'agent/farol-coordinate-0.1.697'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farol-coordinate-0697-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      BASE_SHA: '53bf6288ddcbd2a53963234a33ec85f53f9cd681'
      EXPECTED_VERSION_NAME: '0.1.697'
      EXPECTED_VERSION_CODE: '5988'
      ROTA_CERTA_GIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'val releaseVersionName = "0.1.697"' app/build.gradle.kts
          grep -Fq 'val releaseVersionCode = 5_988' app/build.gradle.kts
          grep -Fq '"version": "0.1.697"' app/src/main/assets/release_history.json
          grep -Fq 'FAROL_LOCAL_DECISION_AUTHORITY_0696' app/src/main/java/br/com/mapeiaia/rotacerta/FarolLocalDecisionAuthority0696.kt
          grep -Fq 'FAROL_TEMPORAL_UI_NOISE_0697' app/src/main/java/br/com/mapeiaia/rotacerta/FarolTemporalUiNoise0697.kt
          grep -Fq 'FAROL_COORDINATE_RESOLUTION_0697' app/src/main/java/br/com/mapeiaia/rotacerta/FarolCoordinateResolution0697.kt
          grep -Fq 'geocodeBounded0697' app/src/main/java/br/com/mapeiaia/rotacerta/AndroidServices.kt
          grep -Fq 'resolveFarolCoordinateResilient0697' app/src/main/java/br/com/mapeiaia/rotacerta/GoogleMapsService.kt
          grep -Fq 'stableSanitizedAddressSignature0697' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          git diff --check "$BASE_SHA"...HEAD

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run focused FAROL tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest             --tests 'br.com.mapeiaia.rotacerta.FarolTemporalUiNoise0697Test'             --tests 'br.com.mapeiaia.rotacerta.FarolCoordinateResolution0697Test'             --tests 'br.com.mapeiaia.rotacerta.FarolCoordinateResilience0697ContractTest'             --tests 'br.com.mapeiaia.rotacerta.FarolLocalDecisionAuthority0696Test'             --tests 'br.com.mapeiaia.rotacerta.FarolAddressFirst0695Test'             --tests 'br.com.mapeiaia.rotacerta.FarolPaidAiGate0695Test'             --no-daemon --max-workers=2 --stacktrace | tee /tmp/android-0697-focused.log

      - name: Compare complete Android failures with exact 0.1.696
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/rc-base "$BASE_SHA"
          chmod +x /tmp/rc-base/gradlew
          set +e
          (cd /tmp/rc-base && ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace) > /tmp/base-full.log 2>&1
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace > /tmp/head-full.log 2>&1
          set -e
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          def failures(root):
              out=set(); d=pathlib.Path(root)/"app/build/test-results/testDebugUnitTest"
              if d.exists():
                  for f in d.glob("*.xml"):
                      tree=ET.parse(f)
                      for case in tree.getroot().iter("testcase"):
                          if case.find("failure") is not None or case.find("error") is not None:
                              out.add(f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}")
              return out
          base=failures("/tmp/rc-base"); head=failures("."); new=sorted(head-base)
          print(f"base_failures={len(base)} head_failures={len(head)} new_failures={len(new)}")
          if new:
              print("\n".join(new)); raise SystemExit(1)
          PY

      - name: Assemble exact APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace | tee /tmp/android-0697-assemble.log
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Prove APK identity
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt-0697.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt-0697.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='5988'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='0.1.697'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner-0697.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner-0697.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-0697.txt
          for marker in             "$ROTA_CERTA_GIT_SHA"             'FAROL_LOCAL_DECISION_AUTHORITY_0696'             'FAROL_TEMPORAL_UI_NOISE_0697'             'FAROL_COORDINATE_RESOLUTION_0697'             'FAROL_PLATFORM_GEOCODER_TIMEOUT_0697'; do
            grep -Fq "$marker" /tmp/dex-0697.txt
          done
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          FINAL="rota-certa-0.1.697-5988-$SHORT_SHA.apk"
          cp "$APK" "$FINAL"
          echo "apk=$FINAL" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          printf 'versionName=0.1.697\nversionCode=5988\ncommit=%s\napk_sha256=%s\ndevice=Samsung SM-S911B Android 16\n' "$GITHUB_SHA" "$APK_SHA256" | tee farol-coordinate-0697-proof.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-farol-coordinate-0.1.697-${{ github.sha }}
          path: |
            ${{ steps.proof.outputs.apk }}
            farol-coordinate-0697-proof.txt
            /tmp/android-0697-focused.log
            /tmp/android-0697-assemble.log
            /tmp/aapt-0697.txt
            /tmp/apksigner-0697.txt
          if-no-files-found: error
          retention-days: 30
