name: Observe isolated phase 4 runs

on:
  push:
    branches: [agent/phase4-validation-base]
    paths-ignore:
      - phase4-validation-result.json

permissions:
  contents: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Record workflow runs for this push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 10
          RUNS_JSON="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --limit 20 --json databaseId,workflowName,status,conclusion,headSha,event,url,createdAt)"
          gh auth setup-git
          mkdir control
          cd control
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin agent/phase4-validation-base
          git checkout -B agent/phase4-validation-base FETCH_HEAD
          RUNS_JSON="$RUNS_JSON" python3 - <<'PY'
          import json, os
          payload = {
              "state": "started",
              "observer_run_id": os.environ["GITHUB_RUN_ID"],
              "trigger_sha": os.environ["GITHUB_SHA"],
              "functional_head_sha": "e818395276965ba59a6598e83affc63c42694721",
              "runs": json.loads(os.environ["RUNS_JSON"]),
          }
          with open("phase4-validation-result.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2, sort_keys=True)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase4-validation-result.json
          git commit -m "Record phase 4 validation start"
          git push origin HEAD:agent/phase4-validation-base
