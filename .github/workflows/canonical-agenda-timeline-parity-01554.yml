name: Verify canonical Agenda Timeline parity 0.1.554

on:
  push:
    branches:
      - agent/canonical-agenda-timeline-parity-0.1.554
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-agenda-timeline-parity-01554
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify canonical Timeline unit tests
        run: ./gradlew :app:testDebugUnitTest --tests 'br.com.mapeiaia.rotacerta.trips.TimelineLocalPrimary0525Test' --stacktrace --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.554-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
