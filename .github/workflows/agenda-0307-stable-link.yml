name: Agenda 0.1.307 stable public link

on:
  push:
    branches:
      - agent/agenda-stable-link-0.1.307
    paths:
      - '.github/workflows/agenda-0307-stable-link.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripRemoteApi.kt'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt'
      - 'trip-platform/functions/index.js'
      - 'trip-platform/functions/test/stable-agenda-link-0307.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agenda-stable-link-0.1.307

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Firebase service account
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
          else
            exit 3
          fi
          chmod 600 /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Validate stable-link contract
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --test trip-platform/functions/test/stable-agenda-link-0307.test.js
          grep -Fq 'agenda_token_mismatch' trip-platform/functions/index.js
          grep -Fq 'REGENERATE_PUBLIC_AGENDA_LINK' trip-platform/functions/index.js
          grep -Fq 'Token público da agenda de viagens — fixo' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt

      - name: Generate Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
          APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
          test -n "$APP_ID"
          npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test lint and build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace | tee /tmp/gradle.txt
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/aapt.txt
          grep -Fq "versionCode='5600'" /tmp/aapt.txt
          grep -Fq "versionName='0.1.307'" /tmp/aapt.txt
          sha256sum "$APK" > /tmp/apk.sha256
          mkdir -p /tmp/0307
          cp "$APK" /tmp/0307/rota-certa-0.1.307.apk
          cp /tmp/apk.sha256 /tmp/0307/apk.sha256
          cp /tmp/aapt.txt /tmp/0307/aapt.txt
          cp /tmp/apksigner.txt /tmp/0307/apksigner.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.307-stable-link
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0307

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agenda-stable-link-0.1.307

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Firebase service account
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
          else
            exit 3
          fi
          chmod 600 /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Install functions dependencies
        shell: bash
        run: npm --prefix trip-platform/functions install --no-audit --no-fund

      - name: Deploy trip API only
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api --non-interactive --force

      - name: Confirm existing agenda link still works
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://rota-certa-7ccc8.web.app
          DRIVER=viagem-certa
          AGENDA=JA5o3L0KjPSbdM1m01jXhsNpoZZsXOiE
          HTTP="$(curl --retry 8 --retry-delay 3 --silent --show-error -o /tmp/agenda.json -w '%{http_code}' "$BASE/v1/public/drivers/$DRIVER/$AGENDA/agenda")"
          echo "EXISTING_LINK_HTTP=$HTTP"
          test "$HTTP" = "200"
          node -e 'const x=require("/tmp/agenda.json"); console.log("EXISTING_LINK_DRIVER="+String(x.driver?.username||"")); console.log("EXISTING_LINK_TRIPS="+String(Array.isArray(x.trips)?x.trips.length:0));'
          echo "EXISTING_LINK_PRESERVED=PASS"
