name: Agenda header navigation 0.1.396

on:
  push:
    branches:
      - agent/agenda-chatgpt-header-nav-0.1.396
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-header-navigation-0396-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GOOGLE_MAPS_API_KEY: agenda_header_navigation_ci_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove source scope version retained canonical state and FAROL
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ github.sha }}"
          SOURCE_BRANCH="${{ github.ref_name }}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s\n' "$SOURCE_SHA" | tee source_head.txt
          printf '%s\n' "$SOURCE_BRANCH" | tee source_branch.txt
          echo "ROTA_CERTA_GIT_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_BRANCH=$SOURCE_BRANCH" >> "$GITHUB_ENV"

          BASE='49628eb4f1bfe8018858e39a41109c1518774641'
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          sha256sum "$FAROL" | tee farol-head.sha256
          git show "$BASE:$FAROL" | sha256sum | awk '{print $1}' > farol-base.sha256
          awk '{print $1}' farol-head.sha256 > farol-current.sha256
          cmp -s farol-base.sha256 farol-current.sha256

          grep -Fq 'versionCode = 5689' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.396"' app/build.gradle.kts

          git diff --name-only "$BASE"...HEAD | tee changed-files.txt
          ! grep -Fxq "$FAROL" changed-files.txt
          grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaHeaderNavigation0396.kt' changed-files.txt
          grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt' changed-files.txt
          grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt' changed-files.txt
          grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerAdminUi.kt' changed-files.txt
          grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaPublicSearchUi.kt' changed-files.txt
          grep -Fxq 'app/src/test/java/br/com/mapeiaia/rotacerta/trips/AgendaHeaderNavigation0396Test.kt' changed-files.txt

          grep -Fq 'AgendaModuleDrawer0396(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'AgendaModuleHeader0396(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'TripScreen.PUBLIC_SEARCH -> AgendaPublicSearchRoot0396(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'showHeader = false' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          ! grep -Fq 'ResponsiveTripAction("👥 Passageiros"' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          ! grep -Fq 'source=timeline_header' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          ! grep -Fq 'publicSearchClearToken' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          ! grep -Fq 'Voltar à Timeline' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          ! grep -Fq 'horizontalScroll' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaHeaderNavigation0396.kt

          # Retain 0.1.395 canonical per-trip state and 0.1.394 performance corrections.
          grep -Fq 'val canonicalRevision: Long = 0L' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt
          grep -Fq 'reconcileTenantSeatAllocation0395' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaBackgroundSync0392.kt
          grep -Fq 'stableInternalTripId' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'externalMetadataSnapshot0394' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerIdentityStore.kt
          grep -Fq 'renderSnapshot0394 = withContext(Dispatchers.IO)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          grep -Fq 'label = { Text("Buscar na Timeline") }' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq '"Nenhuma viagem sincronizada."' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'canonicalTripId =' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Run deterministic backend contract
        working-directory: trip-platform/functions
        run: node --test test/deterministic-trip-outbox-0387.test.js

      - name: Run navigation and retained Android tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaHeaderNavigation0396Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalTripState0395Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaMainThreadPerformance0394Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaTimelineAccess0393Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaBackgroundSync0392Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaPullRefreshGesture0388Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaDeterministicTripOutbox0387Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaTouchUnfreeze0383Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCombinedSeatPools0369Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PassengerAdmin0314Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PublicBooking0296Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PublicAgendaIncrementalAvailability0375Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaPublicSearchTest' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Assemble APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK identity and FAROL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat source_head.txt)"
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          sha256sum "$FAROL" | tee farol-after.sha256
          cmp -s farol-head.sha256 farol-after.sha256
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk.sha256
          grep -E 'version(Code|Name) = ' app/build.gradle.kts | tee app-version.txt
          if git status --porcelain --untracked-files=no | grep -q .; then
            git status --short
            exit 1
          fi

      - name: Upload exact SHA APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.396-agenda-header-navigation-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            source_head.txt
            source_branch.txt
            app-version.txt
            farol-base.sha256
            farol-current.sha256
            farol-head.sha256
            farol-after.sha256
            apk.sha256
            changed-files.txt
