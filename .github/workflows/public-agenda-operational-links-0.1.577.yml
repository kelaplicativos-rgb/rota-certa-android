name: Public Agenda operational links 0.1.577

on:
  push:
    branches:
      - agent/public-agenda-operational-links-0.1.577
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-agenda-operational-links-0.1.577-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-deploy-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: operational_links_validation_dummy_key
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact source and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --check 52a0153932b2c9809899c741842d7eac0f623a23...HEAD
          grep -Fq 'val releaseVersionCode = 5_868' app/build.gradle.kts
          grep -Fq 'val releaseVersionName = "0.1.577"' app/build.gradle.kts
          grep -Fq '"version": "0.1.577"' app/src/main/assets/release_history.json
          grep -Fq 'OPERATIONAL_TRIP_ARRIVAL_GRACE_MILLIS_0577' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'reconciledPublicHref0577' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'PUBLIC_AGENDA_ARRIVAL_GRACE_MILLIS_0577' trip-platform/functions/index.js
          grep -Fq 'card.href = publicUrl' trip-platform/public/public-agenda-shell-0569.js
          ! grep -Fq 'card.href = item.blablaManageUrl' trip-platform/public/public-agenda-shell-0569.js
          git rev-parse HEAD | tee validated-source-head.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate backend and public shell contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/public/public-agenda-shell-0569.js
          node --test trip-platform/functions/test/public-agenda-operational-window-0577.test.js | tee public-window-tests.log
          node --test trip-platform/functions/test/public-agenda-shell-0569.test.js | tee public-shell-tests.log

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1 | tee android-build-tools-dir.txt
          test -s android-build-tools-dir.txt

      - uses: gradle/actions/setup-gradle@v4

      - name: Run targeted Android regression tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.PassengerTimelineTemporalCutoff0548Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PublicAgendaAutoSync0300Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaPublicLinkCanonical0409Test' \
            --tests 'br.com.mapeiaia.rotacerta.monitoring.OperationalHealthEngineTest' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace | tee operational-links-tests.log

      - name: Assemble exact debug APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace | tee assemble-debug.log
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee aapt-badging.txt
          grep -q "package: name='br.com.mapeiaia.rotacerta'" aapt-badging.txt
          grep -q "versionCode='5868'" aapt-badging.txt
          grep -q "versionName='0.1.577'" aapt-badging.txt
          cp "$APK" rota-certa-0.1.577-public-agenda-operational-links.apk
          stat -c '%s' rota-certa-0.1.577-public-agenda-operational-links.apk | tee apk-size-bytes.txt
          sha256sum rota-certa-0.1.577-public-agenda-operational-links.apk | tee apk-sha256.txt

      - name: Install trip-api dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix trip-platform/functions install --no-audit --no-fund

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "USE_FIREBASE_TOKEN=1" >> "$GITHUB_ENV"
          else
            echo "Firebase deployment credential is missing." >&2
            exit 3
          fi

      - name: Deploy public Agenda backend
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          AUTH_ARGS=()
          if [ "${USE_FIREBASE_TOKEN:-0}" = "1" ]; then AUTH_ARGS+=(--token "$FIREBASE_TOKEN"); fi
          npx --yes firebase-tools@latest deploy \
            --project "$PROJECT" \
            --only functions:trip-api \
            --non-interactive \
            --force \
            "${AUTH_ARGS[@]}"

      - name: Prove live backend and public navigation contract
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rota-certa-7ccc8.web.app'
          curl --retry 10 --retry-delay 4 --retry-all-errors --fail --silent --show-error "$BASE/v1/health?proof=$GITHUB_RUN_ID" | tee live-health.json
          grep -Fq '"ok":true' live-health.json
          curl --retry 8 --retry-delay 3 --retry-all-errors --fail --silent --show-error "$BASE/v1/public/agenda/ezequiel?proof=$GITHUB_RUN_ID" > live-agenda.json
          node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('live-agenda.json','utf8'));
          const trips = Array.isArray(body.trips) ? body.trips : [];
          let valid = 0;
          let invalid = 0;
          for (const trip of trips) {
            const raw = String(trip && trip.blablaPublicUrl || '').trim();
            if (!raw) continue;
            try {
              const u = new URL(raw);
              const path = u.pathname.replace(/\/+$/, '').toLowerCase();
              const official = u.protocol === 'https:' && /(^|\.)blablacar\.(com|com\.br|fr|co\.uk|[a-z]{2})$/i.test(u.hostname.replace(/^www\./i,''));
              const publicPath = path === '/trip' || path.startsWith('/trip/');
              const forbidden = /\/rides\/offer|\/edit|\/manage|\/search/.test(path);
              if (official && publicPath && !forbidden) valid += 1;
              else invalid += 1;
            } catch (_) { invalid += 1; }
          }
          console.log('LIVE_PUBLIC_TRIPS=' + trips.length);
          console.log('LIVE_VALID_PUBLIC_LINKS=' + valid);
          console.log('LIVE_INVALID_PUBLIC_LINKS=' + invalid);
          if (invalid !== 0) throw new Error('public Agenda exposes non-public/non-official BlaBlaCar destination');
          NODE
          curl --retry 8 --retry-delay 3 --retry-all-errors --fail --silent --show-error "$BASE/public-agenda-shell-0569.js?proof=$GITHUB_RUN_ID" > live-shell.js
          grep -Fq 'card.href = publicUrl' live-shell.js
          ! grep -Fq 'card.href = item.blablaManageUrl' live-shell.js

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.577-public-agenda-operational-links-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            rota-certa-0.1.577-public-agenda-operational-links.apk
            validated-source-head.txt
            public-window-tests.log
            public-shell-tests.log
            operational-links-tests.log
            assemble-debug.log
            apksigner.txt
            aapt-badging.txt
            apk-size-bytes.txt
            apk-sha256.txt
            live-health.json
            live-agenda.json
            live-shell.js
            app/build/reports/tests/testDebugUnitTest

      - name: Confirm exact SHA artifact publication
        shell: bash
        run: |
          set -euo pipefail
          test -s rota-certa-0.1.577-public-agenda-operational-links.apk
          test -s apk-sha256.txt
          test -s validated-source-head.txt
          test "$(cat validated-source-head.txt)" = "$GITHUB_SHA"
          echo "APK published for exact SHA $GITHUB_SHA"
