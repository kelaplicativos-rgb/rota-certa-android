name: Stage47 one-shot roster readiness source apply 0.1.248

on:
  push:
    branches:
      - agent/stage47-r4-step7-automatic-identity
    paths:
      - .github/workflows/stage47-apply-roster-readiness-0.1.248.yml

permissions:
  contents: write

jobs:
  apply-persisted-source-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current branch HEAD directly
        uses: actions/checkout@v4
        with:
          ref: agent/stage47-r4-step7-automatic-identity
          fetch-depth: 1

      - name: Apply focused patch to authoritative app source
        env:
          EXPECTED_FAROL_SHA256: 2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560
          EXPECTED_AUTOMATION_BLOB: 266825400820fde78f5d4d6e7c92464b4925b4c4
          EXPECTED_PATCH_SHA256: f08b0d780622172b4f79c8248ade8505c1e8f3ab66a42f57fc8fc36fcab16c62
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          AUTOMATION='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaManualSeatAutomation.kt'
          PATCH='.github/patches/stage47-roster-readiness-0.1.248.patch'

          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$EXPECTED_FAROL_SHA256"
          test "$(git hash-object "$AUTOMATION")" = "$EXPECTED_AUTOMATION_BLOB"
          test "$(sha256sum "$PATCH" | awk '{print $1}')" = "$EXPECTED_PATCH_SHA256"

          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check

          grep -Fq 'MAX_TRIP_ROSTER_READ_ATTEMPTS = 5' "$AUTOMATION"
          grep -Fq 'MAX_PASSENGER_PAGE_RELOAD_ATTEMPTS = 1' "$AUTOMATION"
          grep -Fq 'PASSENGER_PAGE_RELOAD' "$AUTOMATION"
          grep -Fq 'reason=passenger_evidence_not_ready' "$AUTOMATION"
          grep -Fq 'rosterContainers.length > 0 && !hasMore' "$AUTOMATION"
          grep -Fq 'result.passengers.isEmpty() && !result.rosterComplete' "$AUTOMATION"
          grep -Fq 'HARVEST_EVALUATION_TIMEOUT' "$AUTOMATION"
          grep -Fq 'HARVEST_USER_BACK_RECOVERY' "$AUTOMATION"
          grep -Fq 'PASSENGER_TEL_INTERCEPTED' "$AUTOMATION"
          ! grep -Fq 'Intent(Intent.ACTION_CALL' "$AUTOMATION"
          ! grep -Fq 'Intent(Intent.ACTION_DIAL' "$AUTOMATION"
          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$EXPECTED_FAROL_SHA256"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$AUTOMATION"
          test "$(git diff --cached --name-only)" = "$AUTOMATION"
          git commit -m 'fix(stage47): bound roster readiness and reload blank passenger once'
          git push origin HEAD:agent/stage47-r4-step7-automatic-identity

          echo 'stage47_roster_readiness_source_apply=PASS'
          echo 'authoritative_source=app/src'
          echo 'materializer_used=false'
          echo "farol_sha256=$EXPECTED_FAROL_SHA256"
