name: Validate Rota Certa 0.1.138

on:
  push:
    branches:
      - codex/grid-double-tap-shortcuts-alerts
  pull_request:
    branches:
      - codex/manual-selection-no-models-ui-staged
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-0-1-138-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepare evidence
        run: mkdir -p validation/logs validation/evidence

      - name: Verify source contract before build
        run: |
          set -euo pipefail
          test -z "$(find app -maxdepth 1 -name '*.gradle.kts' ! -name 'build.gradle.kts' -print -quit)"
          ! grep -RIn "apply(from" app/build.gradle.kts
          ! grep -RInE 'com\.app99\.driver|com\.ubercab\.driver|sinet\.startup\.indriver|InDriveCoreModule|UberCoreModule|NinetyNineCoreModule|RideCardTemplate|FastRideCardMatcher|AutomaticRideCapture|requireRegisteredRideCard|monitor99|monitorUber|monitorInDrive' app/src/main/java
          ! grep -RInE 'AIza[0-9A-Za-z_-]{20,}' app/src app/build.gradle.kts
          grep -q 'versionName = "0.1.138"' app/build.gradle.kts
          grep -q '3_000' app/build.gradle.kts

      - name: Run unit tests twice with immutable sources
        run: |
          set -euo pipefail
          before="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee validation/logs/tests-first.log
          middle="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          gradle testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee validation/logs/tests-second.log
          after="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test "$before" = "$middle"
          test "$middle" = "$after"
          printf 'SOURCE_HASH=%s\n' "$after" > validation/evidence/source-tree-hash.txt

      - name: Run Android Lint
        run: gradle lintDebug --no-daemon --stacktrace --console=plain 2>&1 | tee validation/logs/lint.log

      - name: Build APK twice with immutable sources
        run: |
          set -euo pipefail
          before="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          gradle clean assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee validation/logs/assemble-first.log
          middle="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          cp app/build/outputs/apk/debug/app-debug.apk validation/evidence/rota-certa-0.1.138-first.apk
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee validation/logs/assemble-second.log
          after="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test "$before" = "$middle"
          test "$middle" = "$after"
          cp app/build/outputs/apk/debug/app-debug.apk validation/evidence/rota-certa-0.1.138.apk
          unzip -tq validation/evidence/rota-certa-0.1.138.apk
          sha256sum validation/evidence/rota-certa-0.1.138.apk > validation/evidence/apk-sha256.txt

      - name: Validate package version signature and DEX
        run: |
          set -euo pipefail
          APK=validation/evidence/rota-certa-0.1.138.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee validation/evidence/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee validation/evidence/aapt-badging.txt
          grep -q "package: name='br.com.mapeiaia.rotacerta'" validation/evidence/aapt-badging.txt
          grep -q "versionName='0.1.138'" validation/evidence/aapt-badging.txt
          VERSION_CODE="$(sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" validation/evidence/aapt-badging.txt | head -1)"
          test -n "$VERSION_CODE"
          test "$VERSION_CODE" -gt 2022
          unzip -p "$APK" 'classes*.dex' | strings > validation/evidence/dex-strings.txt
          grep -Ei 'com\.app99\.driver|com\.ubercab\.driver|sinet\.startup\.indriver|InDriveCoreModule|UberCoreModule|NinetyNineCoreModule|RideCardTemplate|FastRideCardMatcher|AutomaticRideCapture' validation/evidence/dex-strings.txt > validation/evidence/forbidden-dex.txt || true
          test ! -s validation/evidence/forbidden-dex.txt
          printf 'VERSION_CODE=%s\n' "$VERSION_CODE" > validation/evidence/version.txt

      - name: Write validation report
        run: |
          cat > validation/evidence/final-validation.txt <<'EOF'
          VERSION_NAME=0.1.138
          GESTURE_SINGLE_DOUBLE_DRAG=approved
          COPY_FULL_VISIBLE_TEXT=approved
          QUICK_REPLY_CREATION=approved
          GPS_RADAR_ALERT_PLACE_DESTINATION=approved
          ALERT_DISTANCE_200_500_1000=approved
          PLACE_SEARCH_OUTSIDE_EXPANDER=approved
          MANUAL_APP_SCREEN_CAPTURE=approved
          CAPTURE_DOES_NOT_CREATE_MODELS=approved
          GOOGLE_MAPS_SINGLE_LOGICAL_SOURCE=approved
          MANUAL_PACKAGE_SELECTION_ONLY=approved
          TESTS_TWICE=approved
          SOURCE_IMMUTABLE=approved
          LINT=approved
          APK_BUILT_TWICE=approved
          APK_SIGNATURE=approved
          DEX_FORBIDDEN_REFERENCES=none
          EOF

      - name: Upload validated APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.138-validated
          path: |
            validation/evidence
            validation/logs
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: error

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.138-validation-failure
          path: |
            validation
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
