          --- a/app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          +++ b/app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          @@ -56,6 +56,7 @@ class LiveRideAccessibilityService : AccessibilityService() {
               private var lastAnalyzedHash: Int? = null
               private var lastSavedReadHash: Int? = null
               private var lastDiagnosticSignature: String? = null
          +    private var pendingAnalysis: PendingLiveAnalysis? = null
