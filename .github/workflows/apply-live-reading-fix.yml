name: Apply Live Reading Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fix and remove workflow
        shell: bash
        run: |
          set -euo pipefail

          if grep -q 'pendingAnalysis' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt && grep -q 'versionName = "0.1.35"' app/build.gradle.kts; then
            echo "Live reading fix already applied."
          else
            git apply <<'PATCH'
          diff --git a/app/build.gradle.kts b/app/build.gradle.kts
