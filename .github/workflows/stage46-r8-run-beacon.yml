name: Stage46 R8 run beacon

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read

jobs:
  beacon:
    if: >-
      github.event.issue.number == 98 &&
      github.event.comment.body == 'QUERY_STAGE46_R8_RUN_2406B539'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: '${{ github.token }}'
      TARGET_SHA: '2406b539721d71fa051bb9697c16a8c461232ef9'
      TARGET_BRANCH: 'agent/stage46-visual-epoch-no-result-ocr-decontamination-0.1.219'
      TARGET_WORKFLOW_NAME: 'Validate Stage46 positive-location evidence R8 0.1.226'
      BRIDGE_WORKFLOW_NAME: 'Stage46 R8 exact one-shot dispatch bridge'
      SELF_PATH: '.github/workflows/stage46-r8-run-beacon.yml'
      BEACON_PATH: 'stage46-r8-dispatch-beacon.txt'
    steps:
      - name: Remove beacon workflow immediately
        shell: bash
        run: |
          set -Eeuo pipefail
          self_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$SELF_PATH?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$SELF_PATH" \
            -f message='ci: remove one-shot Stage46 R8 run beacon [skip ci]' \
            -f sha="$self_sha" \
            -f branch='main' >/dev/null

      - name: Query Actions history and publish beacon file
        shell: bash
        run: |
          set -Eeuo pipefail

          target_row="$(gh run list \
            --branch "$TARGET_BRANCH" \
            --event workflow_dispatch \
            --limit 100 \
            --json databaseId,headSha,name,status,conclusion,url,createdAt \
            --jq ".[] | select(.headSha == \"$TARGET_SHA\" and .name == \"$TARGET_WORKFLOW_NAME\") | [.databaseId,.status,(.conclusion // \"\"),.url,.createdAt] | @tsv" \
            | head -n1 || true)"

          bridge_row="$(gh run list \
            --limit 100 \
            --json databaseId,headSha,name,event,status,conclusion,url,createdAt \
            --jq ".[] | select(.name == \"$BRIDGE_WORKFLOW_NAME\") | [.databaseId,.event,.status,(.conclusion // \"\"),.headSha,.url,.createdAt] | @tsv" \
            | head -n1 || true)"

          if [ -z "$target_row" ]; then target_row='NONE'; fi
          if [ -z "$bridge_row" ]; then bridge_row='NONE'; fi

          cat > beacon.txt <<EOF
          target_sha=$TARGET_SHA
          target_branch=$TARGET_BRANCH
          target_workflow=$TARGET_WORKFLOW_NAME
          target_run=$target_row
          bridge_run=$bridge_row
          EOF

          old_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$BEACON_PATH?ref=main" --jq .sha 2>/dev/null || true)"
          encoded="$(base64 -w0 beacon.txt)"
          if [ -n "$old_sha" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$BEACON_PATH" \
              -f message='ci: refresh Stage46 R8 dispatch beacon [skip ci]' \
              -f content="$encoded" \
              -f sha="$old_sha" \
              -f branch='main' >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$BEACON_PATH" \
              -f message='ci: write Stage46 R8 dispatch beacon [skip ci]' \
              -f content="$encoded" \
              -f branch='main' >/dev/null
          fi
