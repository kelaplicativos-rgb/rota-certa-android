name: Build Rota Certa 0.1.150

on:
  pull_request:
    branches: [codex/rota-certa-0.1.146-base]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false
      - name: Apply 0.1.150 fix
        id: applyfix
        continue-on-error: true
        run: python3 -u scripts/apply_user_fixes_0150.py > apply-0150.log 2>&1
      - name: Upload apply log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.150-apply-log
          path: apply-0150.log
          retention-days: 7
      - name: Stop on apply failure
        if: steps.applyfix.outcome == 'failure'
        run: exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Verify source contract
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.1.150"' app/build.gradle.kts
          grep -q 'versionCode = 5110' app/build.gradle.kts
          grep -q 'expose_hidden_authorized_packages_0_1_150' app/src/main/java/br/com/mapeiaia/rotacerta/InstalledRideAppPickerActivity.kt
          grep -q 'main_bubble_size_persistent_0_1_150' app/src/main/java/br/com/mapeiaia/rotacerta/MainBubbleSizeStore.kt
          grep -q 'main_bubble_size_live_receiver_0_1_150' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
      - name: Unit tests
        run: gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain
      - name: Android lint
        run: gradle lintDebug --no-daemon --stacktrace --console=plain
      - name: Build and validate APK
        run: |
          set -euo pipefail
          gradle clean assembleDebug --no-daemon --stacktrace --console=plain
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='br.com.mapeiaia.rotacerta'" badging.txt
          grep -q "versionName='0.1.150'" badging.txt
          grep -q "versionCode='5110'" badging.txt
          mkdir -p validated
          cp "$APK" validated/rota-certa-0.1.150-estavel-validado.apk
          sha256sum validated/rota-certa-0.1.150-estavel-validado.apk > validated/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.150-estavel-validado
          path: validated/
          retention-days: 90
          if-no-files-found: error
