name: Validate Bubble Stability 0.1.146

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Verify current stability contract
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.1.146"' app/build.gradle.kts
          grep -q 'versionCode = 5070' app/build.gradle.kts
          grep -q 'preserveRecentValidatedCard144' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'postDelayed(longPressAction, 1_500L)' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt
          ! grep -q 'onDoubleTap(event' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt
      - name: Run tests and lint
        run: |
          gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain
          gradle lintDebug --no-daemon --stacktrace --console=plain
      - name: Build and validate APK
        run: |
          set -euo pipefail
          gradle clean assembleDebug --no-daemon --stacktrace --console=plain
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='br.com.mapeiaia.rotacerta'" badging.txt
          grep -q "versionName='0.1.146'" badging.txt
          grep -q "versionCode='5070'" badging.txt
          mkdir -p validated
          cp "$APK" validated/Rota-Certa-0.1.146-validado.apk
          sha256sum "$APK" > validated/sha256.txt
          git rev-parse HEAD > validated/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.146-installable
          path: validated/
          retention-days: 90
          if-no-files-found: error
