name: Stage32 bootstrap exact Stage30 materialized source

on:
  pull_request:
    branches:
      - agent/stage30-presence-authority-shadow-replay-0.1.206
    paths:
      - '.github/workflows/stage32-bootstrap-materialized-source.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  materialize-stage30:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout protected canonical source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          path: source
          fetch-depth: 1

      - name: Checkout Stage32 patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: patches
          fetch-depth: 1

      - name: Restore exact Stage18 materialized source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p bootstrap
          gh run download 31612053591 \
            --repo kelaplicativos-rgb/rota-certa-android \
            --name rota-certa-stage19-materialized-stage18-source \
            --dir bootstrap
          TGZ="$(find bootstrap -name stage18-materialized-source.tgz -print -quit)"
          SHA_FILE="$(find bootstrap -name stage18-materialized-source.sha256 -print -quit)"
          test -n "$TGZ" -a -f "$TGZ"
          test -n "$SHA_FILE" -a -f "$SHA_FILE"
          EXPECTED="$(awk '{print $1}' "$SHA_FILE")"
          ACTUAL="$(sha256sum "$TGZ" | awk '{print $1}')"
          test "$EXPECTED" = "b6a81198842bdba9aa38fc6ec8643e4ec24bce4449e01ecc28f16940c4c977a7"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf source/app/src/main/java source/app/src/test/java
          tar -xzf "$TGZ" -C source
          grep -q 'versionName = "0.1.198"' source/app/build.gradle.kts

      - name: Preserve accessibility event contract
        run: |
          set -euo pipefail
          cat > source/app/src/main/res/xml/rota_certa_accessibility.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewTextChanged|typeWindowsChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="100" />
          XML

      - name: Materialize Stage19 Stage20 Stage21 Stage23 Stage26 Stage28 Stage30
        run: |
          set -euo pipefail
          python patches/scripts/apply_universal_visual_pipeline_stage19.py source
          python patches/scripts/apply_farol_forensic_causality_stage20.py source
          python patches/scripts/apply_farol_causal_corrections_stage21.py source
          python patches/scripts/apply_farol_visual_identity_stage23.py source
          python patches/scripts/apply_farol_reading_activation_stage26_materialized.py source
          python patches/scripts/apply_farol_causal_latency_stage28_v2.py source
          python patches/scripts/apply_farol_presence_authority_stage30.py source
          grep -q 'versionCode = 5490' source/app/build.gradle.kts
          grep -q 'versionName = "0.1.206"' source/app/build.gradle.kts
          grep -q 'FAROL_PRESENCE_AUTHORITY_STAGE30' source/app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt

      - name: Pack exact materialized source
        run: |
          set -euo pipefail
          mkdir -p out
          tar -czf out/stage30-materialized-source.tgz \
            -C source \
            app/src/main \
            app/src/test \
            app/build.gradle.kts \
            build.gradle.kts \
            settings.gradle.kts \
            gradle.properties \
            gradlew \
            gradle
          sha256sum out/stage30-materialized-source.tgz > out/stage30-materialized-source.sha256

      - name: Upload exact materialized source
        uses: actions/upload-artifact@v4
        with:
          name: stage32-bootstrap-stage30-materialized-source
          path: out/*
          if-no-files-found: error
          retention-days: 2
