name: Validate Stage46 positive-location evidence R8 0.1.226
on:
  pull_request:
    branches: [agent/stage45-ocr-multiline-address-reconstruction-0.1.218]
    paths:
      - '.github/workflows/stage46-positive-location-evidence-r8-0.1.226.yml'
      - 'scripts/run_stage46_r8_reproducible_ci.sh'
      - 'scripts/apply_stage46_route_location_evidence_r8.py'
      - 'scripts/apply_stage46_r8_version.py'
      - 'scripts/apply_stage46_r8_test_compat.py'
      - 'stage46/FarolRouteLocationEvidenceStage46R8.kt'
      - 'stage46/FarolStage46PositiveLocationEvidenceR8Test.kt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate-stage46-positive-location-r8:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GOOGLE_MAPS_API_KEY: '${{ secrets.GOOGLE_MAPS_API_KEY }}'
      GH_TOKEN: '${{ github.token }}'
    steps:
      - name: Checkout protected canonical source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          path: source
          fetch-depth: 1
      - name: Checkout current Stage46 patches
        uses: actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          path: patches
          fetch-depth: 1
      - name: Checkout pinned Stage18 recipe
        uses: actions/checkout@v4
        with:
          ref: aa4bd10847d41a3abd5d8a9cb186d6cfa8acc88c
          path: historical19
          fetch-depth: 1
      - name: Checkout pinned Stage32 recipe
        uses: actions/checkout@v4
        with:
          ref: a4443bb6c287fcf31a56f2a3c4ba8fc211fe1f79
          path: historical34
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Reproduce R7, materialize R8, test and build
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          export PS4='+R8_TRACE ${BASH_SOURCE}:${LINENO}: '
          set +e
          bash -x patches/scripts/run_stage46_r8_reproducible_ci.sh source patches historical19 historical34 evidence 2> >(tee evidence/r8-shell-trace.log >&2)
          rc=$?
          set -e
          printf 'r8_orchestrator_exit=%s\n' "$rc" | tee evidence/r8-orchestrator-exit.txt
          exit "$rc"
      - name: Upload Stage46 R8 physical artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.226-stage46-positive-location-evidence-r8
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
