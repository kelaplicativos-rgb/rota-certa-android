name: Publish validated Rota Certa 0.1.128 source

on:
  push:
    branches:
      - codex/pr5-stable-bubble-combined

permissions:
  contents: write

jobs:
  publish-validated-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rota-certa-0.1.128-materialized-build
          fetch-depth: 0

      - name: Confirm already validated candidate
        run: test "$(git rev-parse HEAD)" = "5ec9c900b020022ce68607839c12b31a874d903c"

      - name: Extract implementation
        run: |
          set -euo pipefail
          cat scripts/payload-00.txt scripts/payload-01.txt scripts/payload-02.txt scripts/payload-03.txt scripts/payload-04.txt > /tmp/rota-certa-0128.b64
          test "$(sha256sum /tmp/rota-certa-0128.b64 | awk '{print $1}')" = "a407620bf62762ccdbdf69c7ceb1c8f97c1c3c889467ff5055c56130605677b6"
          base64 --decode /tmp/rota-certa-0128.b64 > /tmp/rota-certa-0128.tar.xz
          tar -xJf /tmp/rota-certa-0128.tar.xz

      - name: Resolve effective finalizer
        run: |
          python3 <<'PY'
          from pathlib import Path
          script = Path('scripts/materialize_0128.py')
          text = script.read_text()
          needle = 'PATCH_FINALIZER = APP / "patch-pr5-finalizer.gradle.kts"'
          replacement = '''FINALIZER_STATE = ROOT / ".materializer-finalizer-path"

          def resolve_patch_finalizer() -> Path:
              if FINALIZER_STATE.exists():
                  stored = Path(FINALIZER_STATE.read_text().strip())
                  if stored.exists():
                      return stored
              candidates = []
              for path in APP.rglob("*.gradle.kts"):
                  content = path.read_text(errors="ignore")
                  is_current_finalizer = (
                      "// Ultima porta da cadeia de geracao." in content
                      and "finalizeRotaCerta0128EffectiveSource" in content
                  )
                  is_materialized_chain = (
                      'apply(from = "version-0.1.127.gradle.kts")' in content
                      and 'apply(from = "manual-models-optional-finalizer-0.1.127.gradle.kts")' in content
                  )
                  if is_current_finalizer or is_materialized_chain:
                      candidates.append(path)
              unique = list(dict.fromkeys(candidates))
              if len(unique) != 1:
                  raise SystemExit(f"Finalizador 0.1.128 ambiguo ou ausente: {unique}")
              FINALIZER_STATE.write_text(str(unique[0]))
              return unique[0]

          PATCH_FINALIZER = resolve_patch_finalizer()'''
          if needle not in text:
              raise SystemExit('Declaracao fixa do finalizador nao encontrada')
          script.write_text(text.replace(needle, replacement, 1))
          PY
          python3 scripts/materialize_0128.py prepare

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Materialize validated source
        run: |
          set -euo pipefail
          gradle preBuild --no-daemon --console=plain
          python3 scripts/materialize_0128.py finalize
          python3 scripts/apply_0128_behavior_fixes.py
          python3 scripts/materialize_build_gradle_0128.py
          grep -Fxq 'VERSION_CODE=4067' version.properties
          grep -Fxq 'VERSION_NAME=0.1.128' version.properties
          grep -Fq 'quick_reply_receiver_not_exported_0_1_128' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -Fq 'markerless_opened_indrive_contract_0_1_128' app/src/main/java/br/com/mapeiaia/rotacerta/RideCardTemplateMatcher.kt

      - name: Publish source-only validated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B codex/0.1.128-performance-alerts-replies
          git add -A -- app version.properties
          git diff --cached --quiet && { echo 'Nenhuma alteracao materializada para publicar.'; exit 1; }
          git commit -m "Rota Certa 0.1.128 performance alerts replies and automatic cards"
          git push origin codex/0.1.128-performance-alerts-replies --force
