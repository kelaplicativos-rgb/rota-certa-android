name: Publish Stable APK 0.1.146

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/publish-stable-apk.yml'

permissions:
  contents: write

jobs:
  publish-stable:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      EXPECTED_PACKAGE: br.com.mapeiaia.rotacerta
      EXPECTED_VERSION: 0.1.146
      EXPECTED_VERSION_CODE: '5070'
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Test, lint and build
        run: |
          gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain
          gradle lintDebug --no-daemon --stacktrace --console=plain
          gradle clean assembleDebug --no-daemon --stacktrace --console=plain
      - name: Validate metadata and APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee aapt-badging.txt
          grep -q "package: name='$EXPECTED_PACKAGE'" aapt-badging.txt
          grep -q "versionName='$EXPECTED_VERSION'" aapt-badging.txt
          grep -q "versionCode='$EXPECTED_VERSION_CODE'" aapt-badging.txt
          mkdir -p published
          cp "$APK" published/rota-certa-stable-debug.apk
          sha256sum published/rota-certa-stable-debug.apk > published/rota-certa-stable-debug.apk.sha256
          stat -c '%s' published/rota-certa-stable-debug.apk > published/stable-size.txt
          git rev-parse HEAD > published/validated-commit.txt
      - name: Publish or update stable release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=rota-certa-stable-debug
          cat > release-notes.md <<EOF
          Rota Certa 0.1.146

          Package: $EXPECTED_PACKAGE
          VersionCode: $EXPECTED_VERSION_CODE
          Commit: $TARGET_SHA
          SHA-256: $(awk '{print $1}' published/rota-certa-stable-debug.apk.sha256)
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Rota Certa 0.1.146" --notes-file release-notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --title "Rota Certa 0.1.146" --notes-file release-notes.md
          fi
          gh release upload "$TAG" published/rota-certa-stable-debug.apk published/rota-certa-stable-debug.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: stable-apk-publication-verification
          path: |
            published/
            aapt-badging.txt
            apksigner.txt
          retention-days: 90
          if-no-files-found: error
