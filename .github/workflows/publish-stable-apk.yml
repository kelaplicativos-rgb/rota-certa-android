name: Publish Stable APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/publish-stable-apk.yml'

permissions:
  contents: write

jobs:
  publish-stable:
    name: Build, publish and verify stable APK
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'codex/pr5-stable-bubble-combined')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout authorized branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build tested APK with monotonic version code
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          publisher_run="$GITHUB_RUN_NUMBER"
          gradle_run_number="$((3000 + publisher_run))"
          expected_version_code="$((1000 + gradle_run_number))"
          echo "PUBLISHER_RUN_NUMBER=$publisher_run" >> "$GITHUB_ENV"
          echo "GRADLE_RUN_NUMBER=$gradle_run_number" >> "$GITHUB_ENV"
          echo "EXPECTED_VERSION_CODE=$expected_version_code" >> "$GITHUB_ENV"
          GITHUB_RUN_NUMBER="$gradle_run_number" gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace --console=plain

      - name: Validate universal policy, version and APK contents
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          metadata="app/build/outputs/apk/debug/output-metadata.json"
          service="app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt"
          main="app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt"
          test -f "$apk"
          test -f "$metadata"

          python3 - "$metadata" "$EXPECTED_VERSION_CODE" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          element = data['elements'][0]
          actual = int(element['versionCode'])
          expected = int(sys.argv[2])
          if actual != expected:
              raise SystemExit(f'versionCode incorreto: atual={actual} esperado={expected}')
          version_name = element['versionName']
          if version_name != '0.1.126':
              raise SystemExit(f'versionName incorreto: {version_name}')
          Path('version-name.txt').write_text(str(version_name))
          Path('version-code.txt').write_text(str(actual))
          PY

          grep -Fq 'universal_package_content_gate_0_1_126' "$service"
          grep -Fq 'CorePackageMonitor.classify(' "$service"
          grep -Fq 'classification.canScan' "$service"
          grep -Fq 'pre_registered_runtime_cleanup_0_1_126' "$service"
          grep -Fq 'SelectedRideAppStore.save(applicationContext, emptySet())' "$service"
          grep -Fq 'currentCardTemplates = emptyList()' "$service"
          grep -Fq 'universal.card.scope selected_index=' "$service"
          grep -Fq 'subsecond_exact_red_lower_bound_0_1_125' "$service"
          if grep -Fq 'normalized in selectedPackages' "$service"; then
            echo 'ERRO: lista de aplicativos ainda controla a bolinha.'
            exit 1
          fi
          if grep -Fq 'Aplicativo fora da selecao do usuario.' "$service"; then
            echo 'ERRO: motivo cego antigo ainda existe.'
            exit 1
          fi
          grep -Fq 'Filtro por aplicativos pre-cadastrados: removido' "$main"
          grep -Fq 'Modelos de cards como requisito: removidos' "$main"
          grep -Fq 'Nao existem aplicativos pre-cadastrados' "$main"
          grep -Fq 'Cards pre-cadastrados foram apagados' "$main"

          tmp_dir="$(mktemp -d)"
          unzip -q "$apk" 'classes*.dex' -d "$tmp_dir"
          strings "$tmp_dir"/classes*.dex > stable-apk-strings.txt
          for expected in \
            "Rota" \
            "Destino" \
            "Alertas" \
            "Locais" \
            "Radares" \
            "Depurar" \
            "Leitura ao vivo ATIVADA" \
            "universal.card.scope selected_index=" \
            "universal.fast_red exact_lower_bound=true" \
            "pre_registered_gates.removed cards=" \
            "Filtro por aplicativos pre-cadastrados: removido" \
            "Modelos de cards como requisito: removidos" \
            "popup_navigation_service_0_1_120"
          do
            grep -Fq -- "$expected" stable-apk-strings.txt
          done

          cp "$apk" rota-certa-stable-debug.apk
          sha256sum rota-certa-stable-debug.apk > rota-certa-stable-debug.apk.sha256
          wc -c < rota-certa-stable-debug.apk > stable-size.txt

      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          tag="rota-certa-stable-debug"
          version_name="$(cat version-name.txt)"
          version_code="$(cat version-code.txt)"
          apk_sha="$(awk '{print $1}' rota-certa-stable-debug.apk.sha256)"
          apk_size="$(cat stable-size.txt)"

          cat > stable-release-notes.md <<EOF
          Rota Certa Stable Debug APK

          Version: ${version_name}
          VersionCode: ${version_code}
          Publisher workflow run: ${PUBLISHER_RUN_NUMBER}
          Commit: ${RELEASE_TARGET_SHA}
          APK SHA-256: ${apk_sha}
          APK size: ${apk_size} bytes

          Recursos 0.1.126:
          - Remove a lista de aplicativos do caminho critico da bolinha.
          - Apaga selecoes antigas de apps e modelos de cards armazenados na primeira inicializacao.
          - Remove 99, Uber e inDrive como opcoes fixas pre-cadastradas.
          - Pacotes comuns sao avaliados pelo conteudo real do card.
          - Sistema, launcher, teclado, Google Maps e Waze continuam bloqueados.
          - Substitui o motivo generico de app fora da selecao pelo motivo real do bloqueio.
          - Mantem o primeiro card completo visivel, cache exato e vermelho antecipado seguro.
          - O relatorio informa explicitamente a politica universal sem aumentar o volume de logs.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Rota Certa Stable Debug" --notes-file stable-release-notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET_SHA" --title "Rota Certa Stable Debug" --notes-file stable-release-notes.md
          fi

          published=false
          for attempt in 1 2 3; do
            if gh release upload "$tag" rota-certa-stable-debug.apk rota-certa-stable-debug.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber; then
              published=true
              break
            fi
            sleep "$((attempt * 5))"
          done
          test "$published" = true

      - name: Download release asset and verify published bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download rota-certa-stable-debug \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'rota-certa-stable-debug.apk' \
            --dir published \
            --clobber
          local_sha="$(sha256sum rota-certa-stable-debug.apk | awk '{print $1}')"
          published_sha="$(sha256sum published/rota-certa-stable-debug.apk | awk '{print $1}')"
          test "$local_sha" = "$published_sha"
          cmp --silent rota-certa-stable-debug.apk published/rota-certa-stable-debug.apk

          cat > stable-publication-verification.txt <<EOF
          STABLE_RELEASE=approved
          VERSION_NAME=$(cat version-name.txt)
          VERSION_CODE=$(cat version-code.txt)
          COMMIT=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          APK_SHA256=${published_sha}
          APK_SIZE_BYTES=$(wc -c < published/rota-certa-stable-debug.apk)
          DOWNLOAD_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/rota-certa-stable-debug/rota-certa-stable-debug.apk
          EOF
          cat stable-publication-verification.txt

      - name: Upload publication proof and stable APK
        uses: actions/upload-artifact@v4
        with:
          name: stable-apk-publication-verification
          path: |
            published/rota-certa-stable-debug.apk
            rota-certa-stable-debug.apk.sha256
            stable-publication-verification.txt
            stable-release-notes.md
          if-no-files-found: error
