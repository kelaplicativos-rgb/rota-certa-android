name: Diagnose Rota Certa 0.1.128 materializer

on:
  push:
    branches:
      - codex/pr5-stable-bubble-combined
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rota-certa-0.1.128-materialized-build
          fetch-depth: 0

      - name: Extract implementation
        run: |
          set -euo pipefail
          cat scripts/payload-00.txt scripts/payload-01.txt scripts/payload-02.txt scripts/payload-03.txt scripts/payload-04.txt > /tmp/rota-certa-0128.b64
          sha256sum /tmp/rota-certa-0128.b64 | tee prepare-payload-sha.txt
          base64 --decode /tmp/rota-certa-0128.b64 > /tmp/rota-certa-0128.tar.xz
          tar -xJf /tmp/rota-certa-0128.tar.xz

      - name: Capture prepare result
        run: |
          set +e
          python3 scripts/materialize_0128.py prepare > prepare-0128.log 2>&1
          status=$?
          echo "PREPARE_STATUS=$status" > prepare-0128-status.txt
          {
            echo '--- SCRIPT ---'
            sed -n '1,260p' scripts/materialize_0128.py
            echo '--- FINALIZER HEAD ---'
            if [ -f app/patch-pr5-finalizer.gradle.kts ]; then
              sed -n '1,220p' app/patch-pr5-finalizer.gradle.kts
            else
              echo 'app/patch-pr5-finalizer.gradle.kts AUSENTE'
            fi
            echo '--- PREPARE LOG ---'
            cat prepare-0128.log
          } > prepare-0128-evidence.txt
          exit 0

      - name: Publish preparation evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B agent/rota-certa-0.1.128-prepare-evidence
          git add prepare-0128-status.txt prepare-0128-evidence.txt prepare-payload-sha.txt
          git commit -m "Record Rota Certa 0.1.128 materializer evidence"
          git push origin agent/rota-certa-0.1.128-prepare-evidence --force

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.128-prepare-evidence
          path: |
            prepare-0128-status.txt
            prepare-0128-evidence.txt
            prepare-payload-sha.txt
