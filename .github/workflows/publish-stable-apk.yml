name: Diagnose Rota Certa 0.1.128 finalizer

on:
  push:
    branches:
      - codex/pr5-stable-bubble-combined
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rota-certa-0.1.128-materialized-build
          fetch-depth: 0

      - name: Extract implementation
        run: |
          set -euo pipefail
          cat scripts/payload-00.txt scripts/payload-01.txt scripts/payload-02.txt scripts/payload-03.txt scripts/payload-04.txt > /tmp/rota-certa-0128.b64
          base64 --decode /tmp/rota-certa-0128.b64 > /tmp/rota-certa-0128.tar.xz
          tar -xJf /tmp/rota-certa-0128.tar.xz

      - name: Resolve finalizer path
        run: |
          python3 <<'PY'
          from pathlib import Path
          script = Path('scripts/materialize_0128.py')
          text = script.read_text()
          needle = 'PATCH_FINALIZER = APP / "patch-pr5-finalizer.gradle.kts"'
          replacement = '''def resolve_patch_finalizer() -> Path:
              candidates = []
              for path in APP.rglob("*.gradle.kts"):
                  content = path.read_text(errors="ignore")
                  if "// Ultima porta da cadeia de geracao." in content and "finalizeRotaCerta0128EffectiveSource" in content:
                      candidates.append(path)
              if len(candidates) != 1:
                  raise SystemExit(f"Finalizador 0.1.128 ambiguo ou ausente: {candidates}")
              return candidates[0]

          PATCH_FINALIZER = resolve_patch_finalizer()'''
          if needle not in text:
              raise SystemExit('Declaracao fixa do finalizador nao encontrada')
          script.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Prepare materialization
        run: python3 scripts/materialize_0128.py prepare

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Materialize historical source
        run: gradle preBuild --no-daemon --stacktrace --console=plain

      - name: Capture finalizer result
        run: |
          set +e
          python3 scripts/materialize_0128.py finalize > finalize-0128.log 2>&1
          status=$?
          echo "FINALIZE_STATUS=$status" > finalize-0128-status.txt
          service='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          {
            echo '--- FINALIZE LOG ---'
            cat finalize-0128.log
            echo '--- FEATURE MARKERS ---'
            for marker in \
              QuickReplyAccessibilityFiller.apply \
              automatic_card_capture_0_1_128 \
              cache_first_before_yellow_0_1_128 \
              single_bubble_render_coordinator_0_1_128 \
              false_clear_confirmation_0_1_128 \
              proximity_auto_close_runtime_0_1_128 \
              multi_card_focus_lock_0_1_128 \
              parallel_geocode_route_0_1_128 \
              geocode_cache_0_1_128
            do
              if grep -Fq "$marker" "$service"; then
                echo "$marker=present"
              else
                echo "$marker=missing"
              fi
            done
            echo '--- REGEX LINES ---'
            grep -n 'Regex(' "$service" | tail -80 || true
            echo '--- QUICK REPLY LINES ---'
            grep -n 'QuickReply\|applyQuickReply' "$service" | tail -80 || true
          } > finalize-0128-evidence.txt
          exit 0

      - name: Publish finalizer evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B agent/rota-certa-0.1.128-finalizer-evidence
          git add finalize-0128-status.txt finalize-0128-evidence.txt
          git commit -m "Record Rota Certa 0.1.128 finalizer evidence"
          git push origin agent/rota-certa-0.1.128-finalizer-evidence --force

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.128-finalizer-evidence
          path: |
            finalize-0128-status.txt
            finalize-0128-evidence.txt
