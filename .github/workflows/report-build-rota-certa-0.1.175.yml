name: Report Rota Certa 0.1.175 Build

on:
  push:
    branches: [agent/home-module-bubble-grid-0.1.175]
    paths:
      - .github/workflows/build-rota-certa-0.1.175.yml
      - .github/workflows/report-build-rota-certa-0.1.175.yml
      - scripts/fix_home_bubble_grid_0175.py
      - docs/PROJECT_STATUS.md
      - docs/DECISIONS.md

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-module-bubble-grid-0.1.175
          fetch-depth: 0
      - name: Wait for build and persist result
        run: |
          set -euo pipefail
          RUN_ID=""
          CONCLUSION=""
          for attempt in $(seq 1 120); do
            RUN_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-rota-certa-0.1.175.yml/runs?branch=agent/home-module-bubble-grid-0.1.175&per_page=20")
            RUN_ID=$(echo "$RUN_JSON" | jq -r --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .id' | head -1)
            if [ -n "$RUN_ID" ]; then
              STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.status')
              if [ "$STATUS" = "completed" ]; then
                CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion')
                break
              fi
            fi
            sleep 15
          done

          mkdir -p validation/0.1.175
          if [ -z "$RUN_ID" ] || [ -z "$CONCLUSION" ]; then
            printf 'head=%s\nconclusion=not_found\n' "$GITHUB_SHA" > validation/0.1.175/latest.txt
          else
            JOB_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" --jq '.jobs[0].id')
            if [ "$CONCLUSION" != "success" ]; then
              FIRST_FAILED=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" --jq '.jobs[0].steps[] | select(.conclusion=="failure") | .name' | head -1)
              printf 'head=%s\nrun=%s\njob=%s\nconclusion=%s\nfirst_failed=%s\n' "$GITHUB_SHA" "$RUN_ID" "$JOB_ID" "$CONCLUSION" "$FIRST_FAILED" > validation/0.1.175/latest.txt
            else
              ARTIFACT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.name=="rota-certa-0.1.175-home-bubble-grid-validated") | .id' | head -1)
              rm -rf /tmp/rota175 && mkdir -p /tmp/rota175
              gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n rota-certa-0.1.175-home-bubble-grid-validated -D /tmp/rota175
              SHA=$(awk '{print $1}' /tmp/rota175/rota-certa-0.1.175-sha256.txt)
              SIZE=$(awk '{print $(NF-1)}' /tmp/rota175/rota-certa-0.1.175-tamanho.txt)
              printf 'head=%s\nrun=%s\njob=%s\nconclusion=success\nartifact_id=%s\nartifact_name=rota-certa-0.1.175-home-bubble-grid-validated\napk_sha256=%s\napk_bytes=%s\n' "$GITHUB_SHA" "$RUN_ID" "$JOB_ID" "$ARTIFACT_ID" "$SHA" "$SIZE" > validation/0.1.175/latest.txt
            fi
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/0.1.175/latest.txt
          git commit -m 'ci: record 0.1.175 validation result'
          git push origin HEAD:agent/home-module-bubble-grid-0.1.175

          if grep -q '^conclusion=success$' validation/0.1.175/latest.txt; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/44/comments" -f body="<!-- VALIDATION_0175_REPORT -->\n✅ Validação 0.1.175 registrada no arquivo \`validation/0.1.175/latest.txt\`."
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/44/comments" -f body="<!-- VALIDATION_0175_REPORT -->\n❌ Validação 0.1.175 falhou. Consulte \`validation/0.1.175/latest.txt\`."
            exit 1
          fi
