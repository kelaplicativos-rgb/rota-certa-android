name: Agenda stale public URL enrichment stage 1

on:
  push:
    branches:
      - agent/stale-public-url-enrichment-stage1
    paths:
      - '.github/workflows/stale-public-url-enrichment-stage1.yml'
      - 'trip-platform/functions/scripts/patch-stale-public-url-enrichment-stage1.js'
      - 'trip-platform/functions/test/stale-public-url-enrichment-stage1.test.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stale-public-url-enrichment-stage1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-materialize-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GOOGLE_MAPS_API_KEY: stale_public_url_stage1_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove isolated stage-1 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          BASE=5123a2b45f3ce4417f814415cab7c1554211e901
          FAROL=app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          test "$(git rev-parse "$BASE:$FAROL")" = "$(git hash-object "$FAROL")"
          grep -Fq 'releaseVersionName = "0.1.569"' app/build.gradle.kts
          ! grep -Fq 'val canonicalAckStage1 = PublicAgendaAutoSync0300.syncExternalTripIncremental' \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripPublicationOutbox0387.kt
          ! grep -Fq 'function staleTransportPublicUrlEnrichmentDecisionStage1' trip-platform/functions/index.js
          printf '%s\n' "${GITHUB_SHA}" | tee triggering-source-head.txt
          sha256sum "$FAROL" | tee farol-before.sha256

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Materialize only stage 1
        shell: bash
        run: |
          set -euo pipefail
          node trip-platform/functions/scripts/patch-stale-public-url-enrichment-stage1.js
          git diff --check
          grep -Fq 'function staleTransportPublicUrlEnrichmentDecisionStage1' trip-platform/functions/index.js
          grep -Fq 'publicUrlEnrichedStage1: true' trip-platform/functions/index.js
          grep -Fq 'TRANSPORT_REVISION_ADOPTION_STAGE1' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripPublicationOutbox0387.kt
          node --check trip-platform/functions/index.js
          printf '%s\n' \
            'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripPublicationOutbox0387.kt' \
            'trip-platform/functions/index.js' | sort > /tmp/expected-stage1.txt
          git diff --name-only | sort > /tmp/actual-stage1.txt
          cmp /tmp/expected-stage1.txt /tmp/actual-stage1.txt
          test "$(git rev-parse 5123a2b45f3ce4417f814415cab7c1554211e901:app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt)" = \
               "$(git hash-object app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt)"

      - name: Prove stale-transport authority matrix
        shell: bash
        run: |
          set -euo pipefail
          cd trip-platform/functions
          node --test \
            test/stale-public-url-enrichment-stage1.test.js \
            test/backend-canonical-authority-0468.test.js \
            test/deterministic-trip-outbox-0387.test.js | tee ../../stage1-node-focused.log
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          npm run check | tee ../../stage1-node-full.log
          node --check index.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Prove Android publication/readback regressions and build APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.PublicMirrorAttestation0411Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaImmediateCardDelta0431Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalProjectionConvergence0408Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace | tee stage1-android-focused.log
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee stage1-apk.sha256

      - name: Re-run materializer for idempotency
        shell: bash
        run: |
          set -euo pipefail
          cp trip-platform/functions/index.js /tmp/index-before.js
          cp app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripPublicationOutbox0387.kt /tmp/outbox-before.kt
          node trip-platform/functions/scripts/patch-stale-public-url-enrichment-stage1.js
          cmp /tmp/index-before.js trip-platform/functions/index.js
          cmp /tmp/outbox-before.kt app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripPublicationOutbox0387.kt

      - name: Commit exact tested stage-1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            trip-platform/functions/index.js \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripPublicationOutbox0387.kt
          git commit -m 'fix(agenda): accept isolated stale public URL enrichment stage1'
          git push origin HEAD:agent/stale-public-url-enrichment-stage1
          git rev-parse HEAD | tee tested-source-head.txt
          sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | tee farol-after.sha256
          cmp farol-before.sha256 farol-after.sha256

      - name: Configure Firebase deployment authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-deploy-sa.json
            chmod 600 /tmp/firebase-deploy-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-deploy-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-deploy-sa.json
            chmod 600 /tmp/firebase-deploy-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-deploy-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo 'Firebase deployment credential is missing.' >&2
            exit 3
          fi

      - name: Deploy tested trip API only
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api --non-interactive --force --token "$FIREBASE_TOKEN" | tee ../stage1-firebase-deploy.log
          else
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api --non-interactive --force | tee ../stage1-firebase-deploy.log
          fi
          grep -Eiq 'deploy complete|successful|function.*successful' ../stage1-firebase-deploy.log

      - name: Smoke public Agenda after backend deploy
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 10 --retry-delay 3 --fail --silent --show-error \
            'https://rota-certa-7ccc8.web.app/ezequiel' -o stage1-live-agenda.html
          test -s stage1-live-agenda.html
          grep -Fq 'Rota Certa' stage1-live-agenda.html

      - name: Upload stage-1 evidence and APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-stale-public-url-stage1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            triggering-source-head.txt
            tested-source-head.txt
            farol-before.sha256
            farol-after.sha256
            stage1-node-focused.log
            stage1-node-full.log
            stage1-android-focused.log
            stage1-apk.sha256
            stage1-firebase-deploy.log
            stage1-live-agenda.html
