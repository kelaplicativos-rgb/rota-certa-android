name: Stage46 R8 focused diagnostic
on:
  push:
    branches: [diag/stage46-r8-focused-be6b3b47]
    paths:
      - '.github/workflows/stage46-r8-focused-diagnostic.yml'
permissions:
  contents: read
  actions: read
jobs:
  focused-r8:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOOGLE_MAPS_API_KEY: '${{ secrets.GOOGLE_MAPS_API_KEY }}'
      GH_TOKEN: '${{ github.token }}'
      STAGE46_DIAG_SKIP_HISTORICAL_GRADLE: '1'
    steps:
      - name: Checkout protected canonical source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          path: source
          fetch-depth: 1
      - name: Checkout diagnostic R8 patches
        uses: actions/checkout@v4
        with:
          ref: '${{ github.sha }}'
          path: patches
          fetch-depth: 1
      - name: Checkout pinned Stage18 recipe
        uses: actions/checkout@v4
        with:
          ref: aa4bd10847d41a3abd5d8a9cb186d6cfa8acc88c
          path: historical19
          fetch-depth: 1
      - name: Checkout pinned Stage32 recipe
        uses: actions/checkout@v4
        with:
          ref: a4443bb6c287fcf31a56f2a3c4ba8fc211fe1f79
          path: historical34
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Remove historical validation-only Gradle loops
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('historical19/scripts')
          patched = []
          for path in sorted(root.glob('build_rota_certa_*.sh')):
              text = path.read_text(encoding='utf-8')
              needle = './gradlew '
              idx = text.find(needle)
              if idx < 0:
                  continue
              line_start = text.rfind('\n', 0, idx) + 1
              guard = (
                  'if [[ "${STAGE46_DIAG_SKIP_HISTORICAL_GRADLE:-0}" == "1" ]]; then\n'
                  '  printf "historical_source_materialized_without_validation_gradle=%s\\n" "' + path.name + '"\n'
                  '  exit 0\n'
                  'fi\n'
              )
              text = text[:line_start] + guard + text[line_start:]
              path.write_text(text, encoding='utf-8')
              patched.append(path.name)
          if len(patched) < 2:
              raise SystemExit(f'expected multiple historical bootstrap scripts with Gradle, patched={patched}')
          print('historical_validation_gradle_guards=PASS count=' + str(len(patched)))
          print('\n'.join(patched))
          PY

      - name: Materialize R8 and run pre-Gradle audits only
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - patches/scripts/run_stage46_r8_reproducible_ci.sh /tmp/r8-materialize-only.sh <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text(encoding='utf-8')
          anchor = 'cd "$SOURCE"\n./gradlew --no-daemon --rerun-tasks testDebugUnitTest lintDebug assembleDebug'
          if text.count(anchor) != 1:
              raise SystemExit(f'diagnostic anchor expected once, got {text.count(anchor)}')
          prefix = text.split(anchor, 1)[0]
          Path(sys.argv[2]).write_text(prefix + '\ncd "$SOURCE"\nprintf "stage46_r8_materialize_only=PASS\\n"\n', encoding='utf-8')
          PY
          bash /tmp/r8-materialize-only.sh source patches historical19 historical34 evidence

      - name: Compile R8 main Kotlin only
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --rerun-tasks compileDebugKotlin

      - name: Run only Stage46 R8 unit tests
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --rerun-tasks testDebugUnitTest --tests 'br.com.mapeiaia.rotacerta.FarolStage46PositiveLocationEvidenceR8Test'

      - name: Focused diagnostic summary
        if: success()
        run: |
          printf 'stage46_r8_focused_diagnostic=PASS materialize=true compile=true r8_tests=17/17 historical_validation_gradles_skipped=true\n'
