name: Agenda Firebase live wiring

on:
  push:
    branches:
      - agent/agenda-firebase-live-wiring
    paths:
      - 'trip-platform/**'
      - '.github/workflows/agenda-firebase-live-wiring.yml'
      - 'docs/AGENDA_FIREBASE_LIVE_WIRING.md'
  pull_request:
    branches:
      - agent/agenda-public-booking-0.1.296
    paths:
      - 'trip-platform/**'
      - '.github/workflows/agenda-firebase-live-wiring.yml'
      - 'docs/AGENDA_FIREBASE_LIVE_WIRING.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-firebase-live-wiring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agenda-firebase-live-wiring
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript and Firebase contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/calendar-functions/index.js
          node --check trip-platform/public/app.js
          node --check trip-platform/public/firebase-security.js
          node --test trip-platform/functions/test/*.test.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('trip-platform/firebase.json').read_text())
          rc=json.loads(Path('trip-platform/.firebaserc').read_text())
          assert rc['projects']['default']=='rota-certa-7ccc8'
          assert cfg['hosting']['public']=='public'
          assert any(r.get('source')=='/v1/**' for r in cfg['hosting']['rewrites'])
          assert any(r.get('source')=='/calendar/**' for r in cfg['hosting']['rewrites'])
          print('firebase_source_contract=PASS')
          PY

      - name: Resolve Firebase backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix trip-platform/functions --ignore-scripts --no-audit --no-fund
          node -e "require('./trip-platform/functions/node_modules/firebase-admin/app-check'); require('./trip-platform/functions/node_modules/firebase-admin/auth'); console.log('firebase_admin_security_modules=PASS')"

      - name: Prove security boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'allow read, write: if false' trip-platform/firestore.rules
          grep -Fq 'getAppCheck().verifyToken(appCheckToken)' trip-platform/functions/index.js
          grep -Fq 'getAuth().verifyIdToken(match[1])' trip-platform/functions/index.js
          grep -Fq '1:353336964879:web:e7e6924d865a221d99f07a' trip-platform/functions/index.js
          grep -Fq 'ReCaptchaEnterpriseProvider' trip-platform/public/firebase-security.js
          grep -Fq 'signInAnonymously()' trip-platform/public/firebase-security.js
          grep -Fq '/__/firebase/init.js' trip-platform/public/index.html
          ! grep -R -E 'AIza[0-9A-Za-z_-]{20,}' trip-platform/public
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          echo 'security_boundaries=PASS'

      - name: Confirm no production deploy in CI
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'firebase[[:space:]]+deploy' .github/workflows/agenda-firebase-live-wiring.yml
          echo 'production_deploy=false'
