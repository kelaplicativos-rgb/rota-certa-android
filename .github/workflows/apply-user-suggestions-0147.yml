name: Apply and Build Rota Certa 0.1.147

on:
  push:
    branches: [codex/rota-certa-0.1.147-final]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          show-progress: false
      - name: Apply requested features
        id: apply
        continue-on-error: true
        run: |
          mkdir -p validation
          python3 -u scripts/apply_user_suggestions_0147_v2.py > validation/apply-0.1.147.log 2>&1
      - name: Upload apply diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.147-apply-diagnostic
          path: validation/apply-0.1.147.log
          retention-days: 7
          if-no-files-found: error
      - name: Stop after apply failure
        if: steps.apply.outcome == 'failure'
        run: |
          cat validation/apply-0.1.147.log
          exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Verify source contract
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.1.147"' app/build.gradle.kts
          grep -q 'versionCode = 5080' app/build.gradle.kts
          grep -q 'bubbleSizeDp: Int = 66' app/src/main/java/br/com/mapeiaia/rotacerta/Models.kt
          grep -q 'Tamanho da bolinha central' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          grep -q 'sortedByDescending { it.createdAtMillis }' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          grep -q 'delay(1_500L)' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'passenger_fare_copy_0_1_147' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'Extrair viagem pelo link' app/src/main/java/br/com/mapeiaia/rotacerta/BlaBlaCarCollectorActivity.kt
      - name: Run tests and lint
        run: gradle clean testDebugUnitTest lintDebug --no-daemon --stacktrace --console=plain
      - name: Build and validate APK
        run: |
          set -euo pipefail
          gradle clean assembleDebug --no-daemon --stacktrace --console=plain
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='br.com.mapeiaia.rotacerta'" badging.txt
          grep -q "versionName='0.1.147'" badging.txt
          grep -q "versionCode='5080'" badging.txt
          mkdir -p validated
          cp "$APK" validated/rota-certa-0.1.147-sugestoes-validado.apk
          sha256sum validated/rota-certa-0.1.147-sugestoes-validado.apk > validated/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.147-sugestoes-validado
          path: validated/
          retention-days: 90
          if-no-files-found: error
