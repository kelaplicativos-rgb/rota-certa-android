name: Build Rota Certa 0.1.188 canonical

on:
  pull_request:
    branches: [agent/fix-farol-runtime-0.1.187]
    paths:
      - .github/workflows/build-rota-certa-0.1.188-canonical.yml
      - scripts/build_rota_certa_0188_canonical.sh
      - scripts/harden_farol_real_device_0188.py
      - scripts/build_rota_certa_0188.sh
      - scripts/verify_farol_real_device_0188.py
      - patches/farol-real-device-0188.patch.gz.b64
      - docs/REAL_DEVICE_FAILURE_0187.md
  workflow_dispatch:

concurrency:
  group: rota-certa-0.1.188-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Verify protected source commit
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42"

      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
          path: patches

      - name: Verify cumulative patch commit
        working-directory: patches
        env:
          EXPECTED_PATCH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_PATCH_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Canonical materialization, tests, lint, assemble and APK checks
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-0188-canonical
        run: |
          set -o pipefail
          bash ../patches/scripts/build_rota_certa_0188_canonical.sh ../patches 2>&1 | tee build-0.1.188-canonical.log

      - name: Upload canonical failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.188-canonical-failure
          path: |
            source/build-0.1.188-canonical.log
            source/app/build/reports/tests/
            source/app/build/reports/lint-results-debug.html
          retention-days: 30
          if-no-files-found: warn

      - name: Upload canonical CI APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.188-real-device-safety-canonical
          path: source/artifact-0.1.188/
          retention-days: 90
          if-no-files-found: error

      - name: Register canonical evidence and retire superseded workflows
        if: success() && github.event_name == 'pull_request'
        working-directory: patches
        env:
          HEAD_REF: ${{ github.head_ref }}
          VALIDATED_HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          TEST_COUNT="$(awk -F= '/^tests=/{print $2}' ../source/artifact-0.1.188/test-count.txt)"
          APK_SHA="$(awk '{print $1}' ../source/artifact-0.1.188/sha256.txt)"
          APK_SIZE="$(stat -c%s ../source/artifact-0.1.188/rota-certa-0.1.188-farol-real-device-validado-em-ci.apk)"
          python3 - "$VALIDATED_HEAD" "$RUN_ID" "$TEST_COUNT" "$APK_SHA" "$APK_SIZE" <<'PY'
          from pathlib import Path
          import sys

          head, run_id, tests, apk_sha, apk_size = sys.argv[1:]
          status_path = Path('docs/PROJECT_STATUS.md')
          decisions_path = Path('docs/DECISIONS.md')
          status = status_path.read_text(encoding='utf-8')
          decisions = decisions_path.read_text(encoding='utf-8')

          status_marker = '<!-- FAROL_0188_CI_PENDING_DEVICE_START -->'
          if status_marker not in status:
              status_block = f'''{status_marker}
          ## 06/08/2026 — 0.1.188 aprovada em CI, validação física obrigatória pendente

          - **Branch:** `agent/fix-farol-real-device-0.1.188`; **base:** `agent/fix-farol-runtime-0.1.187`.
          - **Head validado em CI:** `{head}`; **workflow run:** `{run_id}`.
          - **Versão:** `0.1.188`; **versionCode:** 5472; **pacote:** `br.com.mapeiaia.rotacerta`.
          - **Reprovação anterior:** a 0.1.187 pintou decisões sem tentativa reconhecida no Samsung SM-S911B/Android 16 e não é funcionalmente aprovada.
          - **Correção:** captura por janela/subárvore, OCR espacial, segmentação de cards e autorização obrigatória antes da rota; a recuperação antiga ficou somente diagnóstica.
          - **Testes CI:** tests={tests}; failures=0; Android Lint e `clean assembleDebug` aprovados.
          - **APK de teste:** `rota-certa-0.1.188-farol-real-device-validado-em-ci.apk`, {apk_size} bytes.
          - **SHA-256:** `{apk_sha}`.
          - **Distribuição:** o link permanente não foi substituído. Este APK só pode ser chamado de aprovado após teste físico com 99, Uber, inDrive, aplicativo desconhecido, múltiplos cards, pop-up, SystemUI, tela vazia e troca rápida de janelas.
          <!-- FAROL_0188_CI_PENDING_DEVICE_END -->

          '''
              status_path.write_text(status_block + status, encoding='utf-8')

          decision_marker = '<!-- FAROL_0188_DECISION_START -->'
          if decision_marker not in decisions:
              decision_block = f'''{decision_marker}
          ## 06/08/2026 — nenhuma rota sem card coerente atual

          - O pacote selecionado autoriza observar, mas nunca autoriza verde ou vermelho sozinho.
          - Acessibilidade e OCR preservam pacote, janela, limites e bloco de origem de cada texto.
          - Dois ou mais endereços só autorizam rota quando pertencem ao mesmo card/modal coerente.
          - O destino final é o último endereço confirmado dentro desse card, nunca o último endereço do texto global da tela.
          - Recuperação, cache, OCR ou modelo não podem criar uma decisão se o card atual não estiver confirmado.
          - Telas passivas, login, segurança, reconhecimento facial, status, documentos e carregamento falham fechado em amarelo, sem quilômetros.
          - Compilação e testes não substituem validação física do farol.
          <!-- FAROL_0188_DECISION_END -->

          '''
              decisions_path.write_text(decision_block + decisions, encoding='utf-8')
          PY

          for superseded in \
            .github/workflows/build-rota-certa-0.1.188.yml \
            .github/workflows/build-rota-certa-0.1.188-final.yml; do
            if [[ -f "$superseded" ]]; then
              git rm "$superseded"
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATUS.md docs/DECISIONS.md
          if git diff --cached --quiet; then
            echo 'canonical_project_records_already_registered=true'
          else
            git commit -m 'Record 0.1.188 canonical CI pending device [skip ci]'
            git push origin "HEAD:${HEAD_REF}"
          fi
