name: Build Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Check Google Maps secret
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY secret is empty. Stable farol validation cannot run."
          else
            echo "GOOGLE_MAPS_API_KEY secret found."
          fi

      - name: Run unit tests
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon --stacktrace --console=plain > gradle-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -nE "(^e: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|Conflicting declarations|patch-|MainActivity|LiveRideAccessibilityService|Models|GradleScriptException|CompilationErrorException)" gradle-test.log || true
            echo "--- gradle-test.log tail ---"
            tail -320 gradle-test.log
          fi
          exit "$status"

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-log
          path: gradle-test.log
          if-no-files-found: ignore

      - name: Run real farol route simulation
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          REAL_FAROL_REPORT: real-farol-validation.txt
        run: |
          python3 scripts/real_farol_route_gate.py

      - name: Upload real farol validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-farol-validation
          path: real-farol-validation.txt
          if-no-files-found: error

      - name: Build debug APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --console=plain > gradle-assemble.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- assemble failure summary ---"
            grep -nE "(^e: |^w: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|Conflicting declarations|patch-|MainActivity|LiveRideAccessibilityService|Models|GradleScriptException|CompilationErrorException)" gradle-assemble.log || true
          fi
          exit "$status"

      - name: Upload Gradle assemble failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-assemble-log
          path: gradle-assemble.log
          if-no-files-found: ignore

      - name: Validate final universal reader and bubble controls
        run: |
          set -euo pipefail
          service="app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt"
          main="app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt"
          trigger="app/src/main/java/br/com/mapeiaia/rotacerta/UniversalAddressTrigger.kt"
          test -f "$service"
          test -f "$main"
          test -f "$trigger"

          grep -Fq 'const val MINIMUM_VISIBLE_ADDRESSES = 2' "$trigger"
          grep -Fq 'UniversalAddressTrigger.evaluate(snapshotText)' "$service"
          grep -Fq 'trigger.addresses.size' "$service"
          grep -Fq 'trigger.destination' "$service"
          grep -Fq 'showOverlay(RadarColor.Default, distanceKm = null)' "$service"
          grep -Fq 'hardClearUniversalTwoAddress' "$service"
          grep -Fq 'universalRouteCache.get' "$service"
          grep -Fq 'universalRouteCache.put' "$service"
          grep -Fq 'const val SCAN_LOOP_MS = 120L' "$service"

          process_block="$(sed -n '/private suspend fun processRideText(/,/private fun resolveRidePackageForText(/p' "$service")"
          if printf '%s' "$process_block" | grep -Fq 'RideCardTemplateMatcher.match'; then
            echo "ERRO: o leitor universal ainda exige modelo cadastrado."
            exit 1
          fi
          if printf '%s' "$process_block" | grep -Fq 'RideOfferDetector'; then
            echo "ERRO: o leitor universal ainda exige classificacao de corrida."
            exit 1
          fi

          grep -Fq 'newView.setOnClickListener { onMainBubbleClick() }' "$service"
          grep -Fq 'private fun onMainBubbleClick()' "$service"
          grep -Fq 'GridLayout(this)' "$service"
          grep -Fq 'quickToggleBubbleButton("Rota"' "$service"
          grep -Fq 'quickToggleBubbleButton("Leitura"' "$service"
          overlay_block="$(sed -n '/private fun showOverlay(/,/private fun removeOverlay()/p' "$service")"
          if printf '%s' "$overlay_block" | grep -Fq 'setOnClickListener { openApp'; then
            echo "ERRO: a bolinha principal ainda abre o aplicativo diretamente."
            exit 1
          fi

          grep -Fq 'Central de bolinhas' "$main"
          grep -Fq 'Acessibilidade OFF: toque em Acesso OFF ou Leitura OFF' "$main"
          grep -Fq 'AppControlBubble("Acesso", liveEnabled, onOpenAccessibility)' "$main"
          grep -Fq 'settings.liveReadingEnabled && liveEnabled' "$main"
          grep -Fq 'bottomBar = {}' "$main"

          {
            echo "UNIVERSAL_SCREEN_READING=enabled"
            echo "MINIMUM_VISIBLE_ADDRESSES=2"
            echo "TRIGGER_COLOR=yellow"
            echo "DESTINATION_RULE=last_visible_address"
            echo "PACKAGE_FILTER=removed"
            echo "REGISTERED_CARD_FILTER=removed"
            echo "RIDE_OFFER_FILTER=removed"
            echo "SCREEN_CHANGE_INVALIDATION=immediate"
            echo "STALE_RESULT_GUARD=generation_hash_signature"
            echo "ROUTE_CACHE=enabled"
            echo "SCAN_LOOP_MS=120"
            echo "IN_APP_CENTER=always_visible"
            echo "MAIN_BUBBLE_TAP=opens_control_grid"
            echo "SECOND_TAP=closes_control_grid"
            echo "TOGGLE_BUTTONS=Rota,Leitura,Alertas,Escuro,Casa,Alfinete"
            echo "ACTION_BUTTONS=WA,Salvar,Acesso,Relat.,Backup,Fechar"
          } > universal-two-address-validation.txt
          cp universal-two-address-validation.txt bubble-menu-validation.txt
          cat universal-two-address-validation.txt

      - name: Validate debug APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          {
            echo "APK: $apk"
            echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')"
            echo "APK_SIZE_BYTES=$(wc -c < "$apk")"
          } > apk-validation.txt
          tmp_dir="$(mktemp -d)"
          unzip -q "$apk" 'classes*.dex' -d "$tmp_dir"
          strings "$tmp_dir"/classes*.dex > apk-strings.txt

          for expected in \
            "Central de bolinhas" \
            "Acessibilidade OFF: toque em Acesso OFF ou Leitura OFF" \
            "Menos de dois enderecos visiveis; dado anterior removido." \
            "universal.trigger source=" \
            "universal.screen.changed hash=" \
            "universal.route.cache hit=true" \
            "universal.route.cache stored=true" \
            "universal.result discarded_stale=true" \
            "universal.clear immediate=true reason=" \
            "Leitura ao vivo desligada pela bolinha" \
            "Casa e Alfinete estao desligados" \
            "bubble.tap.menu_contract_0_1_96" \
            "bubble.menu.opened grid=true"
          do
            if grep -Fq -- "$expected" apk-strings.txt; then
              echo "FOUND=$expected" >> apk-validation.txt
            else
              echo "MISSING=$expected" >> apk-validation.txt
              cat apk-validation.txt
              exit 1
            fi
          done

          cat universal-two-address-validation.txt >> apk-validation.txt
          cat apk-validation.txt

      - name: Upload universal reader validation
        uses: actions/upload-artifact@v4
        with:
          name: universal-two-address-validation
          path: universal-two-address-validation.txt
          if-no-files-found: error

      - name: Upload bubble menu validation
        uses: actions/upload-artifact@v4
        with:
          name: bubble-menu-validation
          path: bubble-menu-validation.txt
          if-no-files-found: error

      - name: Upload APK validation
        uses: actions/upload-artifact@v4
        with:
          name: apk-validation
          path: apk-validation.txt
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish stable GitHub Release APK
        if: >
          (github.event_name == 'push' && github.ref == 'refs/heads/codex/pr5-stable-bubble-combined') ||
          (github.event_name == 'pull_request' && github.head_ref == 'codex/pr5-stable-bubble-combined')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          stable_apk="rota-certa-stable-debug.apk"
          stable_sha="rota-certa-stable-debug.apk.sha256"
          tag="rota-certa-stable-debug"
          version_name="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          version_code="$((1000 + GITHUB_RUN_NUMBER))"
          cp "$apk" "$stable_apk"
          sha256sum "$stable_apk" > "$stable_sha"
          notes_file="stable-release-notes.md"
          {
            echo "Rota Certa Stable Debug APK"
            echo
            echo "Version: ${version_name}"
            echo "VersionCode: ${version_code}"
            echo "Run: ${GITHUB_RUN_NUMBER}"
            echo "Commit: ${RELEASE_TARGET_SHA}"
            echo
            echo "Stable download asset: ${stable_apk}"
            echo
            cat universal-two-address-validation.txt
            echo
            cat apk-validation.txt
            echo
            cat real-farol-validation.txt
          } > "$notes_file"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Rota Certa Stable Debug" --notes-file "$notes_file"
          else
            gh release create "$tag" --target "$RELEASE_TARGET_SHA" --title "Rota Certa Stable Debug" --notes-file "$notes_file"
          fi
          gh release upload "$tag" "$stable_apk" "$stable_sha" --clobber
