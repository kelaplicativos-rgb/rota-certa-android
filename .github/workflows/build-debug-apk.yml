name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply pending card radar fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f"Missing expected block: {label}")

          build_path = Path("app/build.gradle.kts")
          build = build_path.read_text()
          build = replace_once(
              build,
              '        versionCode = 36\n        versionName = "0.1.35"',
              '        versionCode = 37\n        versionName = "0.1.36"',
              "version bump",
          )
          build_path.write_text(build)

          matcher_path = Path("app/src/main/java/br/com/mapeiaia/rotacerta/RideCardTemplateMatcher.kt")
          matcher = matcher_path.read_text()
          matcher = replace_once(
              matcher,
              '''                val structuralMatch = samePackage && structuralFeatures.all { it in match.matchedFeatures }
                structuralMatch || (match.score >= MIN_SCORE && match.matchedFeatures.size >= MIN_FEATURES)''',
              '''                val required = match.template.requiredFeatures.toSet()
                val requiredStructuralFeatures = structuralFeatures.intersect(required)
                samePackage &&
                    match.score >= MIN_SCORE &&
                    match.matchedFeatures.size >= MIN_FEATURES &&
                    requiredStructuralFeatures.all { it in match.matchedFeatures }''',
              "strict template match",
          )
          matcher = replace_once(matcher, "    private const val MIN_SCORE = 0.72", "    private const val MIN_SCORE = 0.75", "min score")
          matcher_path.write_text(matcher)

          main_path = Path("app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt")
          main = main_path.read_text()
          main = replace_once(
              main,
              '''        SettingsSwitchRow(
            label = "Exigir card cadastrado para farol",
            checked = settings.requireRegisteredRideCard,
            onCheckedChange = { onChange(settings.copy(requireRegisteredRideCard = it)) },
        )
        Text(
            "Ligado: telas desconhecidas ficam amarelas e viram amostra. Desligado: usa o classificador antigo.",''',
              '''        Text(
            "Farol ao vivo: verde/vermelho somente quando a tela bater com um card cadastrado manualmente. Telas desconhecidas ficam amarelas e viram amostra.",''',
              "mandatory registered card UI",
          )
          main_path.write_text(main)

          live_path = Path("app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt")
          live = live_path.read_text()
          replacements = [
              (
                  '''    private var lastScreenshotMillis: Long = 0L
    private var continuousScanStarted = false''',
                  '''    private var lastScreenshotMillis: Long = 0L
    private var lastRegisteredCardSeenAtMillis: Long = 0L
    private var continuousScanStarted = false''',
                  "last registered card timestamp",
              ),
              (
                  '''                    requestScreenshotAnalysis()
                } else if (!isPassiveDiagnosticPackage(packageName)) {''',
                  '''                    requestScreenshotAnalysis()
                } else if (isPassiveDiagnosticPackage(packageName)) {
                    resetStaleRegisteredCardDecision()
                } else if (!isPassiveDiagnosticPackage(packageName)) {''',
                  "stale card reset loop",
              ),
              (
                  '''                    speakProximityAlert(alert)
                    runtime.spokenCount += 1
                    runtime.lastSpokenAtMillis = now
                    recordDiagnostic(
                        stage = "proximity_alert_spoken",
                        color = currentRadarColor,
                        reason = "Alerta de proximidade falado: ${proximityAlertSpeech(alert)} a ${distanceMeters.roundToInt()} metros.",
                    )''',
                  '''                    if (speakProximityAlert(alert)) {
                        runtime.spokenCount += 1
                        runtime.lastSpokenAtMillis = now
                        recordDiagnostic(
                            stage = "proximity_alert_spoken",
                            color = currentRadarColor,
                            reason = "Alerta de proximidade falado: ${proximityAlertSpeech(alert)} a ${distanceMeters.roundToInt()} metros.",
                        )
                    }''',
                  "saved proximity speak counter",
              ),
              (
                  '''        val nearest = radars.asSequence()
            .map { radar -> radar to distanceMeters(coordinate, radar.coordinate) }
            .filter { (_, distance) -> distance <= threshold }
            .minByOrNull { (_, distance) -> distance }
            ?: return
        val radar = nearest.first
        val distanceMeters = nearest.second
        val runtime = proximityAlertRuntime.getOrPut("imported-${radar.id}") { ProximityAlertRuntime() }
        if (
            runtime.spokenCount < MAX_PROXIMITY_ALERT_SPEECH_COUNT &&
            now - runtime.lastSpokenAtMillis >= PROXIMITY_ALERT_REPEAT_GAP_MS
        ) {
            speakImportedRadar(radar, distanceMeters)
            runtime.spokenCount += 1
            runtime.lastSpokenAtMillis = now
            recordDiagnostic(
                stage = "imported_radar_spoken",
                color = currentRadarColor,
                reason = "Radar importado falado: ${importedRadarSpeech(radar, distanceMeters)}",
            )
        }''',
                  '''        var nearestRadar: ImportedRadar? = null
        var nearestDistanceMeters = Double.MAX_VALUE
        radars.forEach { radar ->
            val distanceMeters = distanceMeters(coordinate, radar.coordinate)
            val key = "imported-${radar.id}"
            if (distanceMeters > threshold + PROXIMITY_ALERT_RESET_BUFFER_METERS) {
                proximityAlertRuntime[key]?.reset()
            }
            if (distanceMeters <= threshold && distanceMeters < nearestDistanceMeters) {
                nearestRadar = radar
                nearestDistanceMeters = distanceMeters
            }
        }
        val radar = nearestRadar ?: return
        val distanceMeters = nearestDistanceMeters
        val runtime = proximityAlertRuntime.getOrPut("imported-${radar.id}") { ProximityAlertRuntime() }
        runtime.insideAlertZone = true
        if (
            runtime.spokenCount < MAX_PROXIMITY_ALERT_SPEECH_COUNT &&
            now - runtime.lastSpokenAtMillis >= PROXIMITY_ALERT_REPEAT_GAP_MS
        ) {
            if (speakImportedRadar(radar, distanceMeters)) {
                runtime.spokenCount += 1
                runtime.lastSpokenAtMillis = now
                recordDiagnostic(
                    stage = "imported_radar_spoken",
                    color = currentRadarColor,
                    reason = "Radar importado falado: ${importedRadarSpeech(radar, distanceMeters)}",
                )
            }
        }''',
                  "imported radar nearest and reset",
              ),
              (
                  '''        if (snapshotText.isBlank()) {
            traceEvent("process.empty_text source=$source")
            resetToDefault''',
                  '''        if (snapshotText.isBlank()) {
            traceEvent("process.empty_text source=$source")
            lastRegisteredCardSeenAtMillis = 0L
            resetToDefault''',
                  "empty text clears card",
              ),
              (
                  '''            lastSnapshotHash = snapshotHash
            lastAnalyzedHash = null
            resetToDefault(reason = reason, text = snapshotText, record = !isPassiveDiagnosticPackage(activePackageName))''',
                  '''            lastSnapshotHash = snapshotHash
            lastAnalyzedHash = null
            lastRegisteredCardSeenAtMillis = 0L
            resetToDefault(reason = reason, text = snapshotText, record = !isPassiveDiagnosticPackage(activePackageName))''',
                  "ignored screen clears card",
              ),
              (
                  '''            lastSnapshotHash = snapshotHash
            lastAnalyzedHash = null
            recordDiagnostic(
                stage = "screen_changed",
                reason = "A imagem/texto da tela mudou; mantendo a bolinha atual ate concluir a nova leitura.",''',
                  '''            lastSnapshotHash = snapshotHash
            lastAnalyzedHash = null
            showOverlay(RadarColor.Default)
            recordDiagnostic(
                stage = "screen_changed",
                reason = "A imagem/texto da tela mudou; aguardando confirmar o card cadastrado.",''',
                  "screen changed yellow",
              ),
              (
                  '''            val reason = rideOfferRejectReason(fields)
            traceEvent("classifier.ride_offer=false reason=$reason")
            saveCapturedReadToHistory''',
                  '''            val reason = rideOfferRejectReason(fields)
            traceEvent("classifier.ride_offer=false reason=$reason")
            lastRegisteredCardSeenAtMillis = 0L
            saveCapturedReadToHistory''',
                  "non offer clears card",
              ),
              (
                  '''        if (currentSettings.requireRegisteredRideCard && cardMatch == null) {
            val reason = "Tela parece card de corrida, mas ainda nao bate com nenhum card cadastrado. Salvei a amostra; cadastre o modelo para liberar o farol."
            traceEvent("card_model.missing package=${packageName.orEmpty()} templates=${currentCardTemplates.size}")
            saveCapturedCardScreen''',
                  '''        if (cardMatch == null) {
            val reason = "Tela parece card de corrida, mas ainda nao bate com nenhum card cadastrado. Salvei a amostra; cadastre o modelo para liberar o farol."
            traceEvent("card_model.missing package=${packageName.orEmpty()} templates=${currentCardTemplates.size}")
            lastRegisteredCardSeenAtMillis = 0L
            saveCapturedCardScreen''',
                  "card match mandatory",
              ),
              (
                  '''        traceEvent("card_model.match name=${cardMatch?.template?.name ?: "disabled"} score=${cardMatch?.score ?: 0.0}")''',
                  '''        lastRegisteredCardSeenAtMillis = System.currentTimeMillis()
        traceEvent("card_model.match name=${cardMatch.template.name} score=${cardMatch.score}")''',
                  "card match trace",
              ),
              (
                  '''        lastSnapshotHash = null
        lastAnalyzedHash = null
        showOverlay(RadarColor.Default)''',
                  '''        lastSnapshotHash = null
        lastAnalyzedHash = null
        lastRegisteredCardSeenAtMillis = 0L
        showOverlay(RadarColor.Default)''',
                  "default clears card",
              ),
              (
                  '''    private fun resetToIdle(
        reason: String,
        record: Boolean = false,
    ) {
        lastSnapshotHash = null
        lastAnalyzedHash = null
        lastAccessibilityText = ""''',
                  '''    private fun resetStaleRegisteredCardDecision() {
        val hasDecisionColor = currentRadarColor == RadarColor.Green || currentRadarColor == RadarColor.Red
        if (!hasDecisionColor || lastRegisteredCardSeenAtMillis <= 0L) return
        val elapsed = System.currentTimeMillis() - lastRegisteredCardSeenAtMillis
        if (elapsed >= REGISTERED_CARD_STALE_RESET_MS) {
            lastRegisteredCardSeenAtMillis = 0L
            resetToDefault(
                reason = "Card cadastrado nao esta mais visivel; bolinha voltou para amarelo.",
                record = false,
            )
        }
    }

    private fun resetToIdle(
        reason: String,
        record: Boolean = false,
    ) {
        lastSnapshotHash = null
        lastAnalyzedHash = null
        lastRegisteredCardSeenAtMillis = 0L
        lastAccessibilityText = ""''',
                  "stale reset function",
              ),
              (
                  '''            registeredCardRequired = settings.requireRegisteredRideCard,''',
                  '''            registeredCardRequired = true,''',
                  "diagnostic registered card required",
              ),
              (
                  '''    private fun speakImportedRadar(radar: ImportedRadar, distanceMeters: Double) {
        if (!textToSpeechReady) return
        textToSpeech?.speak(
            importedRadarSpeech(radar, distanceMeters),
            TextToSpeech.QUEUE_ADD,
            null,
            "imported-radar-${radar.id}-${System.currentTimeMillis()}",
        )
    }

    private fun speakProximityAlert(place: SavedPlace) {
        if (!textToSpeechReady) return
        textToSpeech?.speak(
            proximityAlertSpeech(place),
            TextToSpeech.QUEUE_ADD,
            null,
            "proximity-alert-${place.id}-${System.currentTimeMillis()}",
        )
    }''',
                  '''    private fun speakImportedRadar(radar: ImportedRadar, distanceMeters: Double): Boolean {
        if (!textToSpeechReady) {
            traceEvent("tts.not_ready imported_radar=${radar.id}")
            return false
        }
        val result = textToSpeech?.speak(
            importedRadarSpeech(radar, distanceMeters),
            TextToSpeech.QUEUE_FLUSH,
            null,
            "imported-radar-${radar.id}-${System.currentTimeMillis()}",
        ) ?: TextToSpeech.ERROR
        return result == TextToSpeech.SUCCESS
    }

    private fun speakProximityAlert(place: SavedPlace): Boolean {
        if (!textToSpeechReady) {
            traceEvent("tts.not_ready proximity_alert=${place.id}")
            return false
        }
        val result = textToSpeech?.speak(
            proximityAlertSpeech(place),
            TextToSpeech.QUEUE_FLUSH,
            null,
            "proximity-alert-${place.id}-${System.currentTimeMillis()}",
        ) ?: TextToSpeech.ERROR
        return result == TextToSpeech.SUCCESS
    }''',
                  "tts boolean speak",
              ),
              (
                  '''    private data class ProximityAlertRuntime(
        var spokenCount: Int = 0,
        var insideAlertZone: Boolean = false,
        var lastSpokenAtMillis: Long = 0L,
    )''',
                  '''    private data class ProximityAlertRuntime(
        var spokenCount: Int = 0,
        var insideAlertZone: Boolean = false,
        var lastSpokenAtMillis: Long = 0L,
    ) {
        fun reset() {
            spokenCount = 0
            insideAlertZone = false
            lastSpokenAtMillis = 0L
        }
    }''',
                  "runtime reset helper",
              ),
              (
                  '''        const val SCREENSHOT_INTERVAL_MS = 650L
        const val PROXIMITY_ALERT_LOOP_MS = 15_000L''',
                  '''        const val SCREENSHOT_INTERVAL_MS = 650L
        const val REGISTERED_CARD_STALE_RESET_MS = 900L
        const val PROXIMITY_ALERT_LOOP_MS = 15_000L''',
                  "stale reset constant",
              ),
          ]
          for old, new, label in replacements:
              live = replace_once(live, old, new, label)
          live_path.write_text(live)
          PY
          cat > .github/workflows/build-debug-apk.yml <<'BUILDYAML'
          name: Build Debug APK

          on:
            workflow_dispatch:
            push:
              branches: [main]

          permissions:
            contents: write

          jobs:
            build:
              name: Build debug APK
              runs-on: ubuntu-latest

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Set up Java 17
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'

                - name: Set up Android SDK
                  uses: android-actions/setup-android@v3

                - name: Set up Gradle
                  uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: 8.10.2

                - name: Check Google Maps secret
                  env:
                    GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
                  run: |
                    if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
                      echo "GOOGLE_MAPS_API_KEY secret is empty. APK will still build; configure the key inside the app."
                    else
                      echo "GOOGLE_MAPS_API_KEY secret found."
                    fi

                - name: Record debug APK run start
                  run: |
                    set -euo pipefail
                    CURRENT_SHA="$(git rev-parse HEAD)"
                    mkdir -p .github
                    {
                      echo "Build Debug APK run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                      echo "Artifact: pending"
                      echo "Commit: ${CURRENT_SHA}"
                    } > .github/latest-debug-apk-run.txt
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add .github/latest-debug-apk-run.txt
                    git commit -m "Record debug APK run start" || exit 0
                    git push

                - name: Run unit tests
                  env:
                    GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
                  run: gradle testDebugUnitTest --no-daemon --stacktrace

                - name: Build debug APK
                  env:
                    GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
                  run: gradle assembleDebug --no-daemon --stacktrace

                - name: Upload debug APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: rota-certa-debug-apk
                    path: app/build/outputs/apk/debug/app-debug.apk
                    if-no-files-found: error

                - name: Record latest APK run link
                  run: |
                    set -euo pipefail
                    CURRENT_SHA="$(git rev-parse HEAD)"
                    mkdir -p .github
                    {
                      echo "Build Debug APK run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                      echo "Artifact: rota-certa-debug-apk"
                      echo "Commit: ${CURRENT_SHA}"
                    } > .github/latest-debug-apk-run.txt
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add .github/latest-debug-apk-run.txt
                    git commit -m "Record latest debug APK run" || exit 0
                    git push
          BUILDYAML
          sed -i 's/^          //' .github/workflows/build-debug-apk.yml
          rm -f .github/workflows/codex-apply-card-radar-fix.yml
          git add app/build.gradle.kts app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt app/src/main/java/br/com/mapeiaia/rotacerta/RideCardTemplateMatcher.kt .github/workflows/build-debug-apk.yml .github/workflows/codex-apply-card-radar-fix.yml
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "Require registered card for live radar"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Check Google Maps secret
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY secret is empty. APK will still build; configure the key inside the app."
          else
            echo "GOOGLE_MAPS_API_KEY secret found."
          fi

      - name: Record debug APK run start
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          mkdir -p .github
          {
            echo "Build Debug APK run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Artifact: pending"
            echo "Commit: ${CURRENT_SHA}"
          } > .github/latest-debug-apk-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest-debug-apk-run.txt
          git commit -m "Record debug APK run start" || exit 0
          git push

      - name: Run unit tests
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Record latest APK run link
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          mkdir -p .github
          {
            echo "Build Debug APK run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Artifact: rota-certa-debug-apk"
            echo "Commit: ${CURRENT_SHA}"
          } > .github/latest-debug-apk-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest-debug-apk-run.txt
          git commit -m "Record latest debug APK run" || exit 0
          git push