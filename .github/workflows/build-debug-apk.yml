name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout the exact source under validation
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test artifact validation regressions
        run: python3 -B -m unittest discover -s scripts/tests -v

      - name: Test, lint, build and validate the same source
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python3 -B scripts/build_validated_apk.py

      - name: Upload the validated APK and its evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-debug-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/validated-apk/
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 90
          if-no-files-found: error

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-validation-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/validated-apk.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
