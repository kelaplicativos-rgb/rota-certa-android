name: Build Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Check Google Maps secret
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY secret is empty. Stable farol validation cannot run."
          else
            echo "GOOGLE_MAPS_API_KEY secret found."
          fi

      - name: Run unit tests
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon --stacktrace --console=plain > gradle-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -nE "(^e: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|Conflicting declarations|registered-card|StableLiveRead|RegisteredCardAddress|LiveRideAccessibilityService|GradleScriptException|CompilationErrorException)" gradle-test.log || true
            echo "--- gradle-test.log tail ---"
            tail -360 gradle-test.log
          fi
          exit "$status"

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-log
          path: gradle-test.log
          if-no-files-found: ignore

      - name: Run real farol route simulation
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          REAL_FAROL_REPORT: real-farol-validation.txt
        run: python3 scripts/real_farol_route_gate.py

      - name: Upload real farol validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-farol-validation
          path: real-farol-validation.txt
          if-no-files-found: error

      - name: Build debug APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --console=plain > gradle-assemble.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- assemble failure summary ---"
            grep -nE "(^e: |^w: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|Conflicting declarations|registered-card|StableLiveRead|RegisteredCardAddress|LiveRideAccessibilityService|GradleScriptException|CompilationErrorException)" gradle-assemble.log || true
            tail -360 gradle-assemble.log
          fi
          exit "$status"

      - name: Upload Gradle assemble failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-assemble-log
          path: gradle-assemble.log
          if-no-files-found: ignore

      - name: Validate registered card and numbered address runtime
        run: |
          set -euo pipefail
          service="app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt"
          main="app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt"
          parser="app/src/main/java/br/com/mapeiaia/rotacerta/UniversalScreenAddressParser.kt"
          card_gate="app/src/main/java/br/com/mapeiaia/rotacerta/RegisteredCardAddressGate.kt"
          source_gate="app/src/main/java/br/com/mapeiaia/rotacerta/StableLiveReadSourceGate.kt"

          for file in "$service" "$main" "$parser" "$card_gate" "$source_gate"; do
            test -f "$file"
          done

          grep -Fq 'registered_stable_process_0_1_99' "$service"
          grep -Fq 'RideCardTemplateMatcher.match(it, packageName, currentCardTemplates)' "$service"
          grep -Fq 'RegisteredCardAddressGate.evaluate(parsed.fields)' "$service"
          grep -Fq 'StableLiveReadSourceGate()' "$service"
          grep -Fq 'normalized in selectedRidePackages(currentSettings)' "$service"
          grep -Fq 'registered.history duplicate_skipped=true' "$service"
          grep -Fq 'const val SCAN_LOOP_MS = 250L' "$service"
          grep -Fq 'const val SCREENSHOT_INTERVAL_MS = 500L' "$service"
          grep -Fq 'isCompleteNumberedAddress' "$card_gate"
          grep -Fq 'explicitHouseNumberRegex' "$parser"
          grep -Fq 'noNumberRegex' "$parser"

          process_block="$(sed -n '/private suspend fun processRideText(/,/private fun resolveRidePackageForText(/p' "$service")"
          if printf '%s' "$process_block" | grep -Fq 'UniversalAddressTrigger.evaluate(snapshotText)'; then
            echo "ERRO: o processo final ainda usa o ultimo endereco da tela inteira."
            exit 1
          fi
          if ! printf '%s' "$process_block" | grep -Fq 'RideCardTemplateMatcher.match'; then
            echo "ERRO: modelo cadastrado nao esta sendo exigido."
            exit 1
          fi
          if ! printf '%s' "$process_block" | grep -Fq 'parser.parseWithMetadata'; then
            echo "ERRO: parser do primeiro card nao esta ligado ao runtime."
            exit 1
          fi

          grep -Fq 'newView.setOnClickListener { onMainBubbleClick() }' "$service"
          grep -Fq 'private fun onMainBubbleClick()' "$service"
          grep -Fq 'GridLayout(this)' "$service"
          grep -Fq 'Central de bolinhas' "$main"
          grep -Fq 'Acessibilidade OFF: toque em Acesso OFF ou Leitura OFF' "$main"
          grep -Fq 'bottomBar = {}' "$main"

          {
            echo "REGISTERED_CARD_RUNTIME=enabled"
            echo "PACKAGE_FILTER=selected_ride_apps"
            echo "REGISTERED_CARD_FILTER=required"
            echo "MINIMUM_COMPLETE_NUMBERED_ADDRESSES=2"
            echo "ADDRESS_SCOPE=first_parsed_card"
            echo "DESTINATION_RULE=last_complete_numbered_endpoint_in_card"
            echo "SOURCE_ARBITRATION=single_owner_accessibility_or_ocr"
            echo "INACTIVE_OTHER_SOURCE=ignored"
            echo "ADDRESS_LOSS_CLEAR=immediate_by_active_source"
            echo "HISTORY_DEDUPE_WINDOW_MS=30000"
            echo "STALE_RESULT_GUARD=generation_hash_package_template_signature"
            echo "ROUTE_CACHE=package_and_card_scoped"
            echo "SCAN_LOOP_MS=250"
            echo "SCREENSHOT_INTERVAL_MS=500"
            echo "MAIN_BUBBLE_TAP=opens_control_grid"
          } > registered-card-address-validation.txt
          cp registered-card-address-validation.txt universal-two-address-validation.txt
          cp registered-card-address-validation.txt bubble-menu-validation.txt
          cat registered-card-address-validation.txt

      - name: Validate debug APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          {
            echo "APK: $apk"
            echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')"
            echo "APK_SIZE_BYTES=$(wc -c < "$apk")"
          } > apk-validation.txt
          tmp_dir="$(mktemp -d)"
          unzip -q "$apk" 'classes*.dex' -d "$tmp_dir"
          strings "$tmp_dir"/classes*.dex > apk-strings.txt

          for expected in \
            "Central de bolinhas" \
            "registered.trigger source=" \
            "Card atual nao corresponde a nenhum modelo cadastrado" \
            "Card perdeu um dos dois enderecos completos e numerados" \
            "registered.history duplicate_skipped=true" \
            "registered.result discarded_stale=true" \
            "registered.clear immediate=true reason=" \
            "Leitura ao vivo desligada pela bolinha" \
            "Casa e Alfinete estao desligados" \
            "bubble.tap.menu_contract_0_1_96" \
            "bubble.menu.opened grid=true"
          do
            if grep -Fq -- "$expected" apk-strings.txt; then
              echo "FOUND=$expected" >> apk-validation.txt
            else
              echo "MISSING=$expected" >> apk-validation.txt
              cat apk-validation.txt
              exit 1
            fi
          done

          cat registered-card-address-validation.txt >> apk-validation.txt
          cat apk-validation.txt

      - name: Upload registered card validation
        uses: actions/upload-artifact@v4
        with:
          name: registered-card-address-validation
          path: registered-card-address-validation.txt
          if-no-files-found: error

      - name: Upload compatibility validation
        uses: actions/upload-artifact@v4
        with:
          name: universal-two-address-validation
          path: universal-two-address-validation.txt
          if-no-files-found: error

      - name: Upload bubble menu validation
        uses: actions/upload-artifact@v4
        with:
          name: bubble-menu-validation
          path: bubble-menu-validation.txt
          if-no-files-found: error

      - name: Upload APK validation
        uses: actions/upload-artifact@v4
        with:
          name: apk-validation
          path: apk-validation.txt
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish stable GitHub Release APK
        if: >
          (github.event_name == 'push' && github.ref == 'refs/heads/codex/pr5-stable-bubble-combined') ||
          (github.event_name == 'pull_request' && github.head_ref == 'codex/pr5-stable-bubble-combined')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          stable_apk="rota-certa-stable-debug.apk"
          stable_sha="rota-certa-stable-debug.apk.sha256"
          tag="rota-certa-stable-debug"
          version_name="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          version_code="$((1000 + GITHUB_RUN_NUMBER))"
          cp "$apk" "$stable_apk"
          sha256sum "$stable_apk" > "$stable_sha"
          notes_file="stable-release-notes.md"
          {
            echo "Rota Certa Stable Debug APK"
            echo
            echo "Version: ${version_name}"
            echo "VersionCode: ${version_code}"
            echo "Run: ${GITHUB_RUN_NUMBER}"
            echo "Commit: ${RELEASE_TARGET_SHA}"
            echo
            echo "Stable download asset: ${stable_apk}"
            echo
            cat registered-card-address-validation.txt
            echo
            cat apk-validation.txt
            echo
            cat real-farol-validation.txt
          } > "$notes_file"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Rota Certa Stable Debug" --notes-file "$notes_file"
          else
            gh release create "$tag" --target "$RELEASE_TARGET_SHA" --title "Rota Certa Stable Debug" --notes-file "$notes_file"
          fi
          gh release upload "$tag" "$stable_apk" "$stable_sha" --clobber
