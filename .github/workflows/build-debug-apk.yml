name: Build Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'codex/**'

# Este workflow apenas testa e entrega artefato. A release estavel pertence ao
# publish-stable-apk.yml, evitando dois builds disputando o mesmo download.
permissions:
  contents: read

jobs:
  build:
    name: Build and validate debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Run unit tests
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon --stacktrace --console=plain > gradle-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -nE "(^e: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|CompilationErrorException)" gradle-test.log || true
            tail -400 gradle-test.log
          fi
          exit "$status"

      - name: Upload unit-test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-log
          path: gradle-test.log
          if-no-files-found: ignore

      - name: Run real farol route simulation
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          REAL_FAROL_REPORT: real-farol-validation.txt
        run: python3 scripts/real_farol_route_gate.py

      - name: Upload real farol validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-farol-validation
          path: real-farol-validation.txt
          if-no-files-found: error

      - name: Build debug APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --console=plain > gradle-assemble.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -nE "(^e: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|CompilationErrorException)" gradle-assemble.log || true
            tail -400 gradle-assemble.log
          fi
          exit "$status"

      - name: Upload assemble failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-assemble-log
          path: gradle-assemble.log
          if-no-files-found: ignore

      - name: Validate strict manual reading and saved places search
        run: |
          set -euo pipefail
          service="app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt"
          main="app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt"
          store="app/src/main/java/br/com/mapeiaia/rotacerta/SelectedRideAppStore.kt"
          maps="app/src/main/java/br/com/mapeiaia/rotacerta/GoogleMapsService.kt"
          catalog="app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutModule.kt"
          controller="app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt"
          engine="app/src/main/java/br/com/mapeiaia/rotacerta/ProximityAlertEngine.kt"

          for file in "$service" "$main" "$store" "$maps" "$catalog" "$controller" "$engine"; do
            test -f "$file"
          done

          # Aplicativos: instalacao zerada e nenhuma leitura fora da selecao manual.
          grep -Fq 'manual_selection_no_legacy_fallback_0_1_127' "$store"
          grep -Fq 'SelectedRideAppStore.save(applicationContext, emptySet())' "$service"
          grep -Fq 'manual_selected_apps_gate_0_1_127' "$service"
          grep -Fq 'normalized in selectedPackages' "$service"
          grep -Fq 'Nenhum aplicativo vem marcado' "$main"
          grep -Fq 'Buscar aplicativos instalados' "$main"

          # Cards: nenhum modelo nasce pronto e o match do mesmo pacote e obrigatorio.
          grep -Fq 'manual_registered_card_required_migration_0_1_127' "$service"
          grep -Fq 'manual_registered_card_gate_0_1_127' "$service"
          grep -Fq 'templates = packageCardTemplates' "$service"
          grep -Fq 'manual.card.gate accepted=false reason=no_template' "$service"
          grep -Fq 'manual.card.gate accepted=false reason=no_match' "$service"
          grep -Fq 'manual.card.gate accepted=true' "$service"
          grep -Fq 'manual_registered_card_freshness_0_1_127' "$service"
          grep -Fq 'Modelos de cards obrigatorios' "$main"
          grep -Fq 'Nenhum modelo nasce cadastrado' "$main"
          grep -Fq 'Anexar modelos de cards (prints)' "$main"
          if grep -Fq 'removedTemplates126.forEach' "$service"; then
            echo 'ERRO: a inicializacao ainda apaga modelos do usuario.'
            exit 1
          fi

          # Busca em locais e alertas: nome/endereco, mantendo editar, apagar e GPS.
          grep -Fq 'saved_places_search_name_address_0_1_127' "$main"
          grep -Fq 'Buscar por nome ou endereco' "$main"
          grep -Fq 'place.name.lowercase(Locale.ROOT).contains(query)' "$main"
          grep -Fq 'place.address.lowercase(Locale.ROOT).contains(query)' "$main"
          grep -Fq 'Text("GPS")' "$main"
          grep -Fq 'Text("Salvar")' "$main"
          grep -Fq 'Text("Apagar")' "$main"

          # Correcoes do levantamento tecnico.
          grep -Fq 'const val SCAN_LOOP_MS = 350L' "$service"
          grep -Fq 'internal fun geocodeQueries' "$maps"
          grep -Fq 'containsExplicitLocality' "$maps"
          grep -Fq 'compile_final_cleanup_0_1_127' "$main"
          if grep -Fq 'const val SCAN_LOOP_MS = 120L' "$service"; then
            echo 'ERRO: polling agressivo de 120 ms voltou.'
            exit 1
          fi
          if grep -Fq 'defaultCity' "$maps" || grep -Fq 'São Paulo - SP, $country' "$maps"; then
            echo 'ERRO: vies fixo para Sao Paulo voltou a geocodificacao.'
            exit 1
          fi
          if grep -Pzo '@Composable\s*\n@Composable\s*\n' "$main" >/dev/null; then
            echo 'ERRO: anotacao @Composable duplicada voltou.'
            exit 1
          fi

          grep -Fq 'modules.size == 15' "$catalog"
          grep -Fq 'BubbleShortcutCatalog.modules.forEach' "$controller"
          grep -Fq 'popupShownThisApproach' "$engine"

          cat > strict-reading-validation.txt <<'EOF'
          MANUAL_APP_SELECTION=required
          PRESELECTED_APPS=0
          REGISTERED_CARD_MODEL=required
          SAME_PACKAGE_MODEL_MATCH=required
          ROUTE_WITHOUT_MODEL=blocked
          SAVED_PLACES_SEARCH=name_and_address
          SAVED_PLACE_ACTIONS=edit_delete_gps
          FALLBACK_SCAN_INTERVAL_MS=350
          HARDCODED_SAO_PAULO_GEOCODING=removed
          DUPLICATE_COMPOSABLE=removed
          DEBUG_WORKFLOW_RELEASE_PUBLICATION=disabled
          EOF
          cat strict-reading-validation.txt

      - name: Validate debug APK contents
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          tmp_dir="$(mktemp -d)"
          unzip -q "$apk" 'classes*.dex' -d "$tmp_dir"
          strings "$tmp_dir"/classes*.dex > apk-strings.txt

          for expected in \
            "Buscar aplicativos instalados" \
            "Nenhum aplicativo vem marcado" \
            "Modelos de cards obrigatorios" \
            "Anexar modelos de cards (prints)" \
            "Buscar por nome ou endereco" \
            "Nenhum local encontrado por nome ou endereco" \
            "manual.card.gate accepted=false reason=no_template" \
            "manual.card.gate accepted=false reason=no_match" \
            "manual.card.gate accepted=true" \
            "adaptive_fallback_scan_0_1_127" \
            "saved_places_search_name_address_0_1_127"
          do
            grep -Fq -- "$expected" apk-strings.txt
          done

          {
            echo "APK=$apk"
            echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')"
            echo "APK_SIZE_BYTES=$(wc -c < "$apk")"
            cat strict-reading-validation.txt
          } > apk-validation.txt
          cat apk-validation.txt

      - name: Upload validations
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-validations
          path: |
            strict-reading-validation.txt
            apk-validation.txt
            real-farol-validation.txt
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
