name: Build Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Check Google Maps secret
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY secret is empty. Stable farol validation cannot run."
          else
            echo "GOOGLE_MAPS_API_KEY secret found."
          fi

      - name: Run unit tests
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon --stacktrace --console=plain > gradle-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -nE "(^e: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|Conflicting declarations|UniversalAddressTrigger|UniversalScreenAddressParser|LiveRideAccessibilityService|MainActivity|GradleScriptException|CompilationErrorException)" gradle-test.log || true
            echo "--- gradle-test.log tail ---"
            tail -360 gradle-test.log
          fi
          exit "$status"

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-log
          path: gradle-test.log
          if-no-files-found: ignore

      - name: Run real farol route simulation
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          REAL_FAROL_REPORT: real-farol-validation.txt
        run: python3 scripts/real_farol_route_gate.py

      - name: Upload real farol validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-farol-validation
          path: real-farol-validation.txt
          if-no-files-found: error

      - name: Build debug APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --console=plain > gradle-assemble.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- assemble failure summary ---"
            grep -nE "(^e: |^w: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|Conflicting declarations|UniversalAddressTrigger|UniversalScreenAddressParser|LiveRideAccessibilityService|MainActivity|GradleScriptException|CompilationErrorException)" gradle-assemble.log || true
            tail -360 gradle-assemble.log
          fi
          exit "$status"

      - name: Upload Gradle assemble failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-assemble-log
          path: gradle-assemble.log
          if-no-files-found: ignore

      - name: Validate universal address runtime and grouped Home
        run: |
          set -euo pipefail
          service="app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt"
          main="app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt"
          trigger="app/src/main/java/br/com/mapeiaia/rotacerta/UniversalAddressTrigger.kt"
          parser="app/src/main/java/br/com/mapeiaia/rotacerta/UniversalScreenAddressParser.kt"

          for file in "$service" "$main" "$trigger" "$parser"; do
            test -f "$file"
          done

          grep -Fq 'const val MINIMUM_VISIBLE_ADDRESSES = 2' "$trigger"
          grep -Fq 'const val MINIMUM_RECOGNIZED_ADDRESSES = MINIMUM_VISIBLE_ADDRESSES' "$trigger"
          grep -Fq 'fun isRecognizedAddress' "$parser"
          grep -Fq 'UniversalAddressTrigger.evaluate(snapshotText)' "$service"
          grep -Fq 'trigger.addresses.size' "$service"
          grep -Fq 'trigger.destination' "$service"
          grep -Fq 'showOverlay(RadarColor.Default, distanceKm = null)' "$service"
          grep -Fq 'hardClearUniversalTwoAddress' "$service"
          grep -Fq 'universalRouteCache.get' "$service"
          grep -Fq 'universalRouteCache.put' "$service"
          grep -Fq 'const val SCAN_LOOP_MS = 120L' "$service"
          grep -Fq 'explicitHouseNumberRegex' "$parser"
          grep -Fq 'noNumberRegex' "$parser"

          process_block="$(sed -n '/private suspend fun processRideText(/,/private fun resolveRidePackageForText(/p' "$service")"
          if printf '%s' "$process_block" | grep -Fq 'RideCardTemplateMatcher.match'; then
            echo "ERRO: o leitor universal ainda exige modelo cadastrado."
            exit 1
          fi
          if printf '%s' "$process_block" | grep -Fq 'RegisteredCardAddressGate'; then
            echo "ERRO: o leitor universal ainda depende do gate de card cadastrado."
            exit 1
          fi
          if printf '%s' "$process_block" | grep -Fq 'selectedRidePackages'; then
            echo "ERRO: o leitor universal ainda filtra aplicativos monitorados."
            exit 1
          fi

          grep -Fq 'newView.setOnClickListener { onMainBubbleClick() }' "$service"
          grep -Fq 'private fun onMainBubbleClick()' "$service"
          grep -Fq 'bubble.tap.home_direct_0_1_114' "$service"
          grep -Fq 'floating_bubble_popup_removed_0_1_114' "$service"
          click_block="$(sed -n '/private fun onMainBubbleClick()/,/private fun toggleActionMenu()/p' "$service" | sed '$d')"
          show_block="$(sed -n '/private fun showOverlay(/,/private fun removeOverlay()/p' "$service" | sed '$d')"
          menu_block="$(sed -n '/private fun showActionMenu()/,/private fun hideActionMenu()/p' "$service" | sed '$d')"
          if ! printf '%s' "$click_block" | grep -Fq 'openApp()'; then
            echo "ERRO: o toque principal nao abre a Home."
            exit 1
          fi
          if printf '%s' "$click_block" | grep -Eq 'toggleActionMenu\(\)|showActionMenu\(\)'; then
            echo "ERRO: o clique principal ainda chama o popup."
            exit 1
          fi
          if printf '%s' "$show_block" | grep -Eq 'toggleActionMenu\(\)|showActionMenu\(\)'; then
            echo "ERRO: o listener da bolinha ainda chama o popup."
            exit 1
          fi
          if printf '%s' "$menu_block" | grep -Eq 'GridLayout\(this\)|manager\.addView\(menu'; then
            echo "ERRO: a grade flutuante ainda pode criar uma segunda janela."
            exit 1
          fi
          if grep -Fq 'bubble.tap.menu_contract_0_1_96' "$service" || grep -Fq 'bubble.menu.opened grid=true' "$service"; then
            echo "ERRO: o contrato antigo do popup ainda esta no runtime."
            exit 1
          fi

          grep -Fq 'Central de bolinhas' "$main"
          grep -Fq 'grouped_bubble_home_0_1_115' "$main"
          grep -Fq 'grouped_bubble_navigation_0_1_115' "$main"
          grep -Fq 'grouped_settings_screen_0_1_115' "$main"
          grep -Fq 'grouped_card_always_open_0_1_115' "$main"
          grep -Fq '"Rota" to BUBBLE_GROUP_GENERAL' "$main"
          grep -Fq '"Leitura" to BUBBLE_GROUP_READING' "$main"
          grep -Fq '"Destino" to BUBBLE_GROUP_DESTINATION' "$main"
          grep -Fq '"Alertas" to BUBBLE_GROUP_ALERTS' "$main"
          grep -Fq '"Aparencia" to BUBBLE_GROUP_APPEARANCE' "$main"
          grep -Fq '"Permissoes" to BUBBLE_GROUP_ACCESS' "$main"
          grep -Fq '"Relatorios" to BUBBLE_GROUP_REPORTS' "$main"
          grep -Fq '"Backup" to BUBBLE_GROUP_BACKUP' "$main"
          grep -Fq '"Ferramentas" to BUBBLE_GROUP_TOOLS' "$main"
          grep -Fq 'bottomBar = {}' "$main"
          if grep -Fq 'AppControlBubble("Mais"' "$main"; then
            echo "ERRO: bolinha Mais ainda duplica toda a tela de configuracao."
            exit 1
          fi
          if grep -Fq 'Text(if (expanded) "Fechar" else "Abrir")' "$main"; then
            echo "ERRO: grupos ainda exigem segundo toque em Abrir."
            exit 1
          fi
          if grep -Fq 'label + "\n" + if (active)' "$main"; then
            echo "ERRO: textos ON/OFF ainda quebram dentro das bolinhas pequenas."
            exit 1
          fi

          {
            echo "UNIVERSAL_SCREEN_READING=enabled"
            echo "PACKAGE_FILTER=removed"
            echo "REGISTERED_CARD_FILTER=removed"
            echo "MINIMUM_RECOGNIZED_ADDRESSES=2"
            echo "ADDRESS_SCOPE=all_visible_content"
            echo "DESTINATION_RULE=last_recognized_address"
            echo "TRIGGER_COLOR=yellow"
            echo "ADDRESS_WITHOUT_NUMBER=accepted"
            echo "LESS_THAN_TWO_RECOGNIZED_ADDRESSES=gray"
            echo "SCREEN_CHANGE_INVALIDATION=immediate"
            echo "STALE_RESULT_GUARD=generation_hash_signature"
            echo "ROUTE_CACHE=enabled"
            echo "SCAN_LOOP_MS=120"
            echo "MAIN_BUBBLE_TAP=opens_home_directly"
            echo "FLOATING_BUBBLE_POPUP=removed"
            echo "POPUP_RUNTIME_SOURCE=absent"
            echo "IN_APP_GROUPS=9"
            echo "SETTINGS_DUPLICATION=removed"
            echo "GROUP_CARD_SECOND_TAP=removed"
            echo "BUBBLE_LABEL_WRAP=clean"
          } > universal-two-address-validation.txt
          cp universal-two-address-validation.txt bubble-tap-validation.txt
          cat universal-two-address-validation.txt

      - name: Validate debug APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          {
            echo "APK: $apk"
            echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')"
            echo "APK_SIZE_BYTES=$(wc -c < "$apk")"
          } > apk-validation.txt
          tmp_dir="$(mktemp -d)"
          unzip -q "$apk" 'classes*.dex' -d "$tmp_dir"
          strings "$tmp_dir"/classes*.dex > apk-strings.txt

          for expected in \
            "Central de bolinhas" \
            "Cada bolinha abre um grupo" \
            "Destino, Casa e Alfinete" \
            "Bolinha e aparencia" \
            "Permissoes e GPS continuo" \
            "Menos de dois enderecos visiveis; dado anterior removido." \
            "universal.trigger source=" \
            "universal.screen.changed hash=" \
            "universal.route.cache hit=true" \
            "universal.route.cache stored=true" \
            "universal.result discarded_stale=true" \
            "universal.clear immediate=true reason=" \
            "Leitura ao vivo desligada pela bolinha" \
            "bubble.tap.home_direct_0_1_114"
          do
            if grep -Fq -- "$expected" apk-strings.txt; then
              echo "FOUND=$expected" >> apk-validation.txt
            else
              echo "MISSING=$expected" >> apk-validation.txt
              cat apk-validation.txt
              exit 1
            fi
          done

          echo "POPUP_ACTIVE_RUNTIME=validated_in_source_and_android" >> apk-validation.txt
          echo "GROUPED_HOME_RUNTIME=validated_in_source_and_android" >> apk-validation.txt

          cat universal-two-address-validation.txt >> apk-validation.txt
          cat apk-validation.txt

      - name: Upload universal reader validation
        uses: actions/upload-artifact@v4
        with:
          name: universal-two-address-validation
          path: universal-two-address-validation.txt
          if-no-files-found: error

      - name: Upload bubble tap validation
        uses: actions/upload-artifact@v4
        with:
          name: bubble-tap-validation
          path: bubble-tap-validation.txt
          if-no-files-found: error

      - name: Upload APK validation
        uses: actions/upload-artifact@v4
        with:
          name: apk-validation
          path: apk-validation.txt
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish stable GitHub Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/pr5-stable-bubble-combined'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          stable_apk="rota-certa-stable-debug.apk"
          stable_sha="rota-certa-stable-debug.apk.sha256"
          tag="rota-certa-stable-debug"
          version_name="$(find app -maxdepth 1 -name 'version-*.gradle.kts' -printf '%f\n' | sed -E 's/^version-(.*)\.gradle\.kts$/\1/' | sort -V | tail -1)"
          version_code="$((1000 + GITHUB_RUN_NUMBER))"
          cp "$apk" "$stable_apk"
          sha256sum "$stable_apk" > "$stable_sha"
          notes_file="stable-release-notes.md"
          {
            echo "Rota Certa Stable Debug APK"
            echo
            echo "Version: ${version_name}"
            echo "VersionCode: ${version_code}"
            echo "Run: ${GITHUB_RUN_NUMBER}"
            echo "Commit: ${RELEASE_TARGET_SHA}"
            echo
            echo "Stable download asset: ${stable_apk}"
            echo
            cat universal-two-address-validation.txt
            echo
            cat apk-validation.txt
            echo
            cat real-farol-validation.txt
          } > "$notes_file"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Rota Certa Stable Debug" --notes-file "$notes_file"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET_SHA" --title "Rota Certa Stable Debug" --notes-file "$notes_file"
          fi

          published=false
          for attempt in 1 2 3; do
            if gh release upload "$tag" "$stable_apk" "$stable_sha" --repo "$GITHUB_REPOSITORY" --clobber; then
              published=true
              break
            fi
            sleep "$((attempt * 5))"
          done
          test "$published" = true
