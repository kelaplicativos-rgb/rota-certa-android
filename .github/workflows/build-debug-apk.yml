name: Build Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Run unit tests
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon --stacktrace --console=plain > gradle-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -nE "(^e: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|CompilationErrorException|BubbleShortcut|ProfessionalBubble|ProximityAlert)" gradle-test.log || true
            tail -400 gradle-test.log
          fi
          exit "$status"

      - name: Upload unit-test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-log
          path: gradle-test.log
          if-no-files-found: ignore

      - name: Run real farol route simulation
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          REAL_FAROL_REPORT: real-farol-validation.txt
        run: python3 scripts/real_farol_route_gate.py

      - name: Upload real farol validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-farol-validation
          path: real-farol-validation.txt
          if-no-files-found: error

      - name: Build debug APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --console=plain > gradle-assemble.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -nE "(^e: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|CompilationErrorException|BubbleShortcut|ProfessionalBubble|ProximityAlert)" gradle-assemble.log || true
            tail -400 gradle-assemble.log
          fi
          exit "$status"

      - name: Upload assemble failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-assemble-log
          path: gradle-assemble.log
          if-no-files-found: ignore

      - name: Validate separated popup architecture
        run: |
          set -euo pipefail
          service="app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt"
          main="app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt"
          controller="app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt"
          catalog="app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutModule.kt"
          position="app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutPositionPolicy.kt"
          engine="app/src/main/java/br/com/mapeiaia/rotacerta/ProximityAlertEngine.kt"
          trigger="app/src/main/java/br/com/mapeiaia/rotacerta/UniversalAddressTrigger.kt"
          external_modules=(
            app/src/main/java/br/com/mapeiaia/rotacerta/DestinationBubbleShortcutModule.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/ReadingBubbleShortcutModule.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/WhatsAppBubbleShortcutModule.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/StopBubbleShortcutModule.kt
          )

          for file in "$service" "$main" "$controller" "$catalog" "$position" "$engine" "$trigger" "${external_modules[@]}"; do
            test -f "$file"
          done

          grep -Fq 'const val MINIMUM_VISIBLE_ADDRESSES = 2' "$trigger"
          grep -Fq 'UniversalAddressTrigger.evaluate(snapshotText)' "$service"
          grep -Fq 'hardClearUniversalTwoAddress' "$service"
          grep -Fq 'const val SCAN_LOOP_MS = 120L' "$service"
          grep -Fq 'bubble_instant_drag_0_1_116' "$service"
          grep -Fq 'newView.setOnClickListener { toggleResourceShortcuts() }' "$service"
          grep -Fq 'onShortcut = ::executeShortcutModule' "$service"
          grep -Fq 'BubbleShortcutCatalog.modules.joinToString' "$service"
          grep -Fq 'KEY_RUNTIME_SHORTCUTS_OPEN' "$service"
          grep -Fq 'BubbleShortcutAction.OpenRoute' "$service"
          grep -Fq 'BubbleShortcutAction.OpenDestination' "$service"
          grep -Fq 'BubbleShortcutAction.OpenAlerts' "$service"
          grep -Fq 'BubbleShortcutAction.OpenSavedPlaces' "$service"
          grep -Fq 'BubbleShortcutAction.OpenRadars' "$service"
          grep -Fq 'BubbleShortcutAction.OpenCards' "$service"
          grep -Fq 'BubbleShortcutAction.ToggleReading -> toggleLiveReadingFromBubble()' "$service"
          grep -Fq 'BubbleShortcutAction.OpenScreenWhatsApp -> capturePhoneAndOpenWhatsApp118()' "$service"
          grep -Fq 'BubbleShortcutAction.OpenCollector -> openCollectorFromBubble()' "$service"
          grep -Fq 'BubbleShortcutAction.ClearClipboard -> clearClipboardFromBubble()' "$service"
          grep -Fq 'BubbleShortcutAction.ExportDiagnostic -> exportDiagnosticFromBubble()' "$service"
          grep -Fq 'BubbleShortcutAction.StopApplication -> stopApplicationFromBubble()' "$service"
          grep -Fq 'popup_navigation_service_0_1_120' "$service"
          grep -Fq 'popup_close_only_on_drag_0_1_120' "$service"
          grep -Fq 'reading_visible_feedback_0_1_120' "$service"
          grep -Fq 'Leitura ao vivo ATIVADA' "$service"
          grep -Fq 'Leitura ao vivo PAUSADA' "$service"
          grep -Fq 'if (place.type == SavedPlaceType.ProximityAlert) "alerts" else "saved_places"' "$service"
          if grep -Fq $'hideResourceShortcuts()\n                    bubbleGestureActive = true' "$service"; then
            echo "ERRO: ACTION_DOWN ainda fecha o popup e provoca a reabertura/piscada."
            exit 1
          fi

          grep -Fq 'interface BubbleShortcutModule' "$catalog"
          grep -Fq 'object BubbleShortcutCatalog' "$catalog"
          grep -Fq 'modules.size == 15' "$catalog"
          grep -Fq 'RouteBubbleShortcutModule' "$catalog"
          grep -Fq 'AlertsManagementBubbleShortcutModule' "$catalog"
          grep -Fq 'SavedPlacesManagementBubbleShortcutModule' "$catalog"
          grep -Fq 'RadarsManagementBubbleShortcutModule' "$catalog"
          grep -Fq 'AppearanceBubbleShortcutModule' "$catalog"
          grep -Fq 'PermissionsBubbleShortcutModule' "$catalog"
          grep -Fq 'BackupBubbleShortcutModule' "$catalog"
          grep -Fq 'CollectorBubbleShortcutModule' "$catalog"
          grep -Fq 'ClearClipboardBubbleShortcutModule' "$catalog"
          grep -Fq 'DiagnosticBubbleShortcutModule' "$catalog"
          grep -Fq 'CardsManagementBubbleShortcutModule' "$catalog"
          modules_block="$(sed -n '/val modules: List/,/^    )/p' "$catalog")"
          for forbidden in ReportsBubbleShortcutModule AlertBubbleShortcutModule SavedPlaceBubbleShortcutModule RideCardBubbleShortcutModule; do
            if grep -Fq "$forbidden" <<<"$modules_block"; then
              echo "ERRO: modulo duplicado ou removido ainda esta no popup: $forbidden"
              exit 1
            fi
          done

          grep -Fq 'BubbleShortcutCatalog.modules.forEach' "$controller"
          grep -Fq 'onShortcut(module.spec)' "$controller"
          grep -Fq 'contentDescription = spec.label' "$controller"
          grep -Fq 'BubbleShortcutPositionPolicy.place' "$controller"
          grep -Fq 'rightX + menuWidth' "$position"
          grep -Fq 'leftX >= safe' "$position"

          grep -Fq 'popup_navigation_main_0_1_120' "$main"
          grep -Fq 'startup_permissions_0_1_120' "$main"
          grep -Fq 'mutableStateOf(TAB_CONFIG)' "$main"
          grep -Fq 'mutableStateOf(BUBBLE_GROUP_ACCESS)' "$main"
          grep -Fq 'BUBBLE_GROUP_SAVED_PLACES' "$main"
          grep -Fq 'BUBBLE_GROUP_RADARS' "$main"
          grep -Fq 'BUBBLE_GROUP_CARDS' "$main"
          grep -Fq 'BUBBLE_GROUP_ALERTS -> SavedPlacesModuleCard(' "$main"
          grep -Fq 'BUBBLE_GROUP_SAVED_PLACES -> SavedPlacesModuleCard(' "$main"
          grep -Fq 'BUBBLE_GROUP_RADARS -> RadarImportCard(' "$main"
          grep -Fq 'BUBBLE_GROUP_CARDS -> CardModelsCard(' "$main"
          grep -Fq 'val items = savedPlaces.filter { it.type == type }' "$main"
          grep -Fq 'Somente pontos que geram aviso de aproximacao.' "$main"
          grep -Fq 'Somente locais salvos para consultar ou voltar depois. Nao geram alerta.' "$main"
          if grep -Fq '            ProfessionalBubbleDashboard(' "$main"; then
            echo "ERRO: a grade circular ainda aparece na Home."
            exit 1
          fi

          grep -Fq 'if (alert.type != SavedPlaceType.ProximityAlert)' "$controller"
          grep -Fq 'popupButton("Editar")' "$controller"
          grep -Fq 'popupButton("Excluir")' "$controller"
          grep -Fq 'popupShownThisApproach' "$engine"
          grep -Fq 'onSavedPlacePopup(alert, distanceMeters)' "$engine"

          cat > universal-two-address-validation.txt <<'EOF'
          UNIVERSAL_SCREEN_READING=enabled
          MINIMUM_RECOGNIZED_ADDRESSES=2
          SCREEN_CHANGE_INVALIDATION=immediate
          INSTANT_DRAG=preserved
          MAIN_BUBBLE_TAP=toggles_resource_shortcuts
          SECOND_TAP_CLOSE=validated
          RESOURCE_SHORTCUTS=15
          SHORTCUT_MODULES=15_independent
          REPORT_SHORTCUT=removed
          DUPLICATE_ALERT_SHORTCUT=removed
          ROUTE_MODULE=general_control
          DESTINATION_MODULE=destination_radius
          ALERTS_MODULE=proximity_only
          SAVED_PLACES_MODULE=places_only
          RADARS_MODULE=independent
          CARDS_MODULE=registered_models
          APP_START=permissions
          READING_SHORTCUT=visible_feedback
          WHATSAPP_SHORTCUT=capture_phone_from_screen
          COLLECTOR_SHORTCUT=open_directly
          CLIPBOARD_SHORTCUT=clear_directly
          DIAGNOSTIC_SHORTCUT=export_directly
          STOP_SHORTCUT=pause_and_open_android_app_details
          ALERT_POPUP_ACTIONS=close_edit_delete
          ALERT_POPUP_REPEAT=once_per_approach
          EOF
          cp universal-two-address-validation.txt bubble-tap-validation.txt
          cat universal-two-address-validation.txt

      - name: Validate debug APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          {
            echo "APK: $apk"
            echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')"
            echo "APK_SIZE_BYTES=$(wc -c < "$apk")"
          } > apk-validation.txt
          tmp_dir="$(mktemp -d)"
          unzip -q "$apk" 'classes*.dex' -d "$tmp_dir"
          strings "$tmp_dir"/classes*.dex > apk-strings.txt
          for expected in \
            "Rota" \
            "Destino" \
            "Alertas" \
            "Locais" \
            "Radares" \
            "Aparencia" \
            "Permissoes" \
            "Backup" \
            "WhatsApp da tela" \
            "Coletor" \
            "Limpar area de transferencia" \
            "Depurar" \
            "Encerrar Rota Certa" \
            "Cards cadastrados" \
            "Leitura ao vivo ATIVADA" \
            "Leitura ao vivo PAUSADA" \
            "Somente pontos que geram aviso de aproximacao." \
            "Somente locais salvos para consultar ou voltar depois. Nao geram alerta." \
            "popup_navigation_service_0_1_120" \
            "universal.trigger source="
          do
            grep -Fq -- "$expected" apk-strings.txt || {
              echo "MISSING=$expected" >> apk-validation.txt
              cat apk-validation.txt
              exit 1
            }
            echo "FOUND=$expected" >> apk-validation.txt
          done
          cat universal-two-address-validation.txt >> apk-validation.txt
          cat apk-validation.txt

      - name: Upload validations
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-validations
          path: |
            universal-two-address-validation.txt
            bubble-tap-validation.txt
            apk-validation.txt
            real-farol-validation.txt
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish stable GitHub Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/pr5-stable-bubble-combined'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          stable_apk="rota-certa-stable-debug.apk"
          stable_sha="rota-certa-stable-debug.apk.sha256"
          tag="rota-certa-stable-debug"
          version_name="$(find app -maxdepth 1 -name 'version-*.gradle.kts' -printf '%f\n' | sed -E 's/^version-(.*)\.gradle\.kts$/\1/' | sort -V | tail -1)"
          version_code="$((1000 + GITHUB_RUN_NUMBER))"
          cp "$apk" "$stable_apk"
          sha256sum "$stable_apk" > "$stable_sha"
          cat > stable-release-notes.md <<EOF
          Rota Certa Stable Debug APK

          Version: ${version_name}
          VersionCode: ${version_code}
          Run: ${GITHUB_RUN_NUMBER}
          Commit: ${RELEASE_TARGET_SHA}

          Recursos 0.1.120:
          - Quinze atalhos independentes no popup da bolinha principal.
          - Segundo toque fecha o popup sem piscar ou reabrir.
          - Aplicativo inicia em Permissoes para liberar a Acessibilidade.
          - Rota e Destino abrem modulos diferentes.
          - Alertas, Locais, Radares e Cards possuem modulos separados.
          - Relatorios e atalhos duplicados de Alerta, Local e Card foram removidos.
          - Leitura mostra confirmacao visivel ao ativar ou pausar.
          EOF
          cat universal-two-address-validation.txt >> stable-release-notes.md
          cat apk-validation.txt >> stable-release-notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Rota Certa Stable Debug" --notes-file stable-release-notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET_SHA" --title "Rota Certa Stable Debug" --notes-file stable-release-notes.md
          fi
          published=false
          for attempt in 1 2 3; do
            if gh release upload "$tag" "$stable_apk" "$stable_sha" --repo "$GITHUB_REPOSITORY" --clobber; then
              published=true
              break
            fi
            sleep "$((attempt * 5))"
          done
          test "$published" = true
