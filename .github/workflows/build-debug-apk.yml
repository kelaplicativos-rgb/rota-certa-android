name: Build Corrected APK 0.1.145

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build corrected APK 0.1.145
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: codex/unified-debug-log-0.1.139
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Apply complete 0.1.145 correction
        run: python scripts/apply_long_press_shortcuts_0145.py

      - name: Verify corrected source contract
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.1.145"' app/build.gradle.kts
          grep -q 'versionCode = 5060' app/build.gradle.kts
          grep -q 'preserveRecentValidatedCard144' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'postDelayed(longPressAction, 1_500L)' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt
          grep -q 'bubble.shortcut.long_press' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt
          ! grep -q 'onDoubleTap(event' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt
          test -n "${GOOGLE_MAPS_API_KEY:-}"

      - name: Run unit tests and preserve report
        id: unit_tests
        continue-on-error: true
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee unit-tests.log
          TEST_EXIT=${PIPESTATUS[0]}
          echo "exit_code=${TEST_EXIT}" >> "$GITHUB_OUTPUT"
          exit ${TEST_EXIT}

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.145-unit-test-report
          path: |
            unit-tests.log
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          retention-days: 30
          if-no-files-found: warn

      - name: Run Android lint
        run: gradle lintDebug --no-daemon --stacktrace

      - name: Build corrected APK
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Validate package version signature and correction markers
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee aapt-badging.txt
          grep -q "package: name='br.com.mapeiaia.rotacerta'" aapt-badging.txt
          grep -q "versionCode='5060'" aapt-badging.txt
          grep -q "versionName='0.1.145'" aapt-badging.txt
          unzip -p "$APK" 'classes*.dex' | strings > dex-strings.txt
          grep -q 'bubble.shortcut.long_press' dex-strings.txt
          grep -q 'OCR/card validado preservado' dex-strings.txt
          ! grep -q 'bubble.shortcut.double_tap' dex-strings.txt
          cp "$APK" rota-certa-0.1.145-corrigido-validado.apk
          sha256sum rota-certa-0.1.145-corrigido-validado.apk | tee rota-certa-0.1.145-sha256.txt
          echo "Unit tests exit code: ${{ steps.unit_tests.outputs.exit_code }}" | tee unit-test-status.txt

      - name: Upload corrected validated APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.145-corrected-validated
          path: |
            rota-certa-0.1.145-corrigido-validado.apk
            rota-certa-0.1.145-sha256.txt
            aapt-badging.txt
            apksigner.txt
            unit-test-status.txt
            unit-tests.log
          retention-days: 90
          if-no-files-found: error
