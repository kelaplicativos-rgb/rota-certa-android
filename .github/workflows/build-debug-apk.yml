name: Build Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Check Google Maps secret
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY secret is empty. Stable farol validation cannot run."
          else
            echo "GOOGLE_MAPS_API_KEY secret found."
          fi

      - name: Run unit tests
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon --stacktrace --console=plain > gradle-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -nE "(^e: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|Conflicting declarations|patch-|MainActivity|LiveRideAccessibilityService|Models|GradleScriptException|CompilationErrorException)" gradle-test.log || true
            echo "--- gradle-test.log tail ---"
            tail -320 gradle-test.log
          fi
          exit "$status"

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-log
          path: gradle-test.log
          if-no-files-found: ignore

      - name: Run real farol route simulation
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          REAL_FAROL_REPORT: real-farol-validation.txt
        run: |
          python3 scripts/real_farol_route_gate.py

      - name: Upload real farol validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-farol-validation
          path: real-farol-validation.txt
          if-no-files-found: error

      - name: Build debug APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --console=plain > gradle-assemble.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- assemble failure summary ---"
            grep -nE "(^e: |^w: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|Conflicting declarations|patch-|MainActivity|LiveRideAccessibilityService|Models|GradleScriptException|CompilationErrorException)" gradle-assemble.log || true
          fi
          exit "$status"

      - name: Upload Gradle assemble failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-assemble-log
          path: gradle-assemble.log
          if-no-files-found: ignore

      - name: Validate debug APK
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          {
            echo "APK: $apk"
            echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')"
            echo "APK_SIZE_BYTES=$(wc -c < "$apk")"
          } > apk-validation.txt
          tmp_dir="$(mktemp -d)"
          unzip -q "$apk" 'classes*.dex' -d "$tmp_dir"
          strings "$tmp_dir"/classes*.dex > apk-strings.txt
          for expected in \
            "Relatorio manual de falha" \
            "Gerar relatorio para anexar" \
            "ROTA CERTA RELATORIO MANUAL" \
            "rota-certa-relatorio-falha.txt" \
            "passive_event_preserves_monitored_root_0_1_88"
          do
            if grep -Fq -- "$expected" apk-strings.txt; then
              echo "FOUND=$expected" >> apk-validation.txt
            else
              echo "MISSING=$expected" >> apk-validation.txt
              exit 1
            fi
          done
          for forbidden in \
            "ROTA CERTA DIAGNOSTICO" \
            "Diagnostico tecnico" \
            "Copiar diagnostico" \
            "Diagnostico copiado" \
            "--- LOGS ---" \
            "Rota Certa diagnostico" \
            "Historico de analises" \
            "Copiar historico"
          do
            if grep -Fq -- "$forbidden" apk-strings.txt; then
              echo "FORBIDDEN_FOUND=$forbidden" >> apk-validation.txt
              cat apk-validation.txt
              exit 1
            else
              echo "ABSENT=$forbidden" >> apk-validation.txt
            fi
          done
          cat apk-validation.txt

      - name: Upload APK validation
        uses: actions/upload-artifact@v4
        with:
          name: apk-validation
          path: apk-validation.txt
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish stable GitHub Release APK
        if: >
          (github.event_name == 'push' && github.ref == 'refs/heads/codex/pr5-stable-bubble-combined') ||
          (github.event_name == 'pull_request' && github.head_ref == 'codex/pr5-stable-bubble-combined')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          stable_apk="rota-certa-stable-debug.apk"
          stable_sha="rota-certa-stable-debug.apk.sha256"
          tag="rota-certa-stable-debug"
          version_name="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          version_code="$((1000 + GITHUB_RUN_NUMBER))"
          cp "$apk" "$stable_apk"
          sha256sum "$stable_apk" > "$stable_sha"
          notes_file="stable-release-notes.md"
          {
            echo "Rota Certa Stable Debug APK"
            echo
            echo "Version: ${version_name}"
            echo "VersionCode: ${version_code}"
            echo "Run: ${GITHUB_RUN_NUMBER}"
            echo "Commit: ${RELEASE_TARGET_SHA}"
            echo
            echo "Stable download asset: ${stable_apk}"
            echo
            cat apk-validation.txt
            echo
            cat real-farol-validation.txt
          } > "$notes_file"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Rota Certa Stable Debug" --notes-file "$notes_file"
          else
            gh release create "$tag" --target "$RELEASE_TARGET_SHA" --title "Rota Certa Stable Debug" --notes-file "$notes_file"
          fi
          gh release upload "$tag" "$stable_apk" "$stable_sha" --clobber
