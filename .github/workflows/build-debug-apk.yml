name: Build Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'codex/**'

# O build de diagnostico nao publica releases. Somente o workflow
# publish-stable-apk.yml pode promover o APK estavel validado.
permissions:
  contents: read

jobs:
  build:
    name: Build and validate debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Run unit tests
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon --stacktrace --console=plain > gradle-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -nE "(^e: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|CompilationErrorException)" gradle-test.log || true
            tail -400 gradle-test.log
          fi
          exit "$status"

      - name: Upload unit-test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-log
          path: gradle-test.log
          if-no-files-found: ignore

      - name: Run real farol route simulation
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          REAL_FAROL_REPORT: real-farol-validation.txt
        run: python3 scripts/real_farol_route_gate.py

      - name: Upload real farol validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-farol-validation
          path: real-farol-validation.txt
          if-no-files-found: error

      - name: Build debug APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --console=plain > gradle-assemble.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -nE "(^e: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|CompilationErrorException)" gradle-assemble.log || true
            tail -400 gradle-assemble.log
          fi
          exit "$status"

      - name: Upload assemble failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-assemble-log
          path: gradle-assemble.log
          if-no-files-found: ignore

      - name: Validate manual app selection and optional cards
        run: |
          set -euo pipefail
          service="app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt"
          main="app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt"
          store="app/src/main/java/br/com/mapeiaia/rotacerta/SelectedRideAppStore.kt"
          maps="app/src/main/java/br/com/mapeiaia/rotacerta/GoogleMapsService.kt"
          catalog="app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutModule.kt"
          controller="app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt"
          engine="app/src/main/java/br/com/mapeiaia/rotacerta/ProximityAlertEngine.kt"

          for file in "$service" "$main" "$store" "$maps" "$catalog" "$controller" "$engine"; do
            test -f "$file"
          done

          # Aplicativos: instalacao zerada e leitura somente no pacote escolhido.
          grep -Fq 'manual_selection_no_legacy_fallback_0_1_127' "$store"
          grep -Fq 'SelectedRideAppStore.save(applicationContext, emptySet())' "$service"
          grep -Fq 'manual_selected_apps_gate_0_1_127' "$service"
          grep -Fq 'SelectedRideAppStore.read(applicationContext)' "$service"
          grep -Fq 'normalized in selectedPackages' "$service"
          grep -Fq 'Nenhum aplicativo vem marcado' "$main"
          grep -Fq 'Buscar aplicativos instalados' "$main"

          # Cards: nenhum modelo nasce pronto; cadastro manual existe e e opcional.
          grep -Fq 'manual_cards_preserved_0_1_127' "$service"
          grep -Fq 'manual_cards_observer_0_1_127' "$service"
          grep -Fq 'Modelos de cards opcionais' "$main"
          grep -Fq 'Nenhum modelo nasce cadastrado' "$main"
          grep -Fq 'Anexar modelos de cards (prints)' "$main"
          if grep -Fq 'manual_registered_card_gate_0_1_127' "$service"; then
            echo 'ERRO: modelo de card voltou a ser obrigatorio.'
            exit 1
          fi
          if grep -Fq 'removedTemplates126.forEach' "$service"; then
            echo 'ERRO: a inicializacao ainda apaga modelos do usuario.'
            exit 1
          fi

          # Rota: o mesmo passageiro/destino sobrevive a mudancas cosmeticas da lista.
          grep -Fq 'stable_card_signature_route_0_1_127' "$service"
          grep -Fq 'universal.screen.cosmetic_change ignored=true' "$service"
          grep -Fq 'fast_red_continues_exact_route_0_1_127' "$service"
          grep -Fq 'exact_route_continues=true' "$service"
          if grep -Fq $'return\n        } // subsecond_exact_red_lower_bound_0_1_125' "$service"; then
            echo 'ERRO: vermelho rapido ainda interrompe a rota exata.'
            exit 1
          fi

          # Desempenho: eventos imediatos e fallback de 120 ms preservados.
          grep -Fq 'const val SCAN_LOOP_MS = 120L' "$service"

          # Geocodificacao nao pode inventar Sao Paulo em endereco ambiguo.
          grep -Fq 'internal fun geocodeQueries' "$maps"
          grep -Fq 'containsExplicitLocality' "$maps"
          if grep -Fq 'defaultCity' "$maps" || grep -Fq 'São Paulo - SP, $country' "$maps"; then
            echo 'ERRO: vies fixo para Sao Paulo voltou a geocodificacao.'
            exit 1
          fi

          # Popup e alertas continuam modulares.
          grep -Fq 'modules.size == 15' "$catalog"
          grep -Fq 'BubbleShortcutCatalog.modules.forEach' "$controller"
          grep -Fq 'popupShownThisApproach' "$engine"

          cat > manual-optional-validation.txt <<'EOF'
          MANUAL_APP_SELECTION=approved
          NO_APP_PRESELECTED=approved
          OPTIONAL_CARD_MODELS=approved
          NO_DESTRUCTIVE_CARD_CLEANUP=approved
          STABLE_CARD_SIGNATURE=approved
          FAST_RED_EXACT_ROUTE_CONTINUES=approved
          FALLBACK_SCAN_INTERVAL_MS=120
          HARDCODED_SAO_PAULO_GEOCODING=removed
          DEBUG_WORKFLOW_RELEASE_PUBLICATION=disabled
          EOF
          cat manual-optional-validation.txt

      - name: Validate debug APK contents
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          tmp_dir="$(mktemp -d)"
          unzip -q "$apk" 'classes*.dex' -d "$tmp_dir"
          strings "$tmp_dir"/classes*.dex > apk-strings.txt

          for expected in \
            "Rota" \
            "Destino" \
            "Alertas" \
            "Locais" \
            "Radares" \
            "Cards cadastrados" \
            "Buscar aplicativos instalados" \
            "Nenhum aplicativo vem marcado" \
            "Modelos de cards opcionais" \
            "Anexar modelos de cards (prints)" \
            "manual_selection.ready selected=" \
            "universal.screen.cosmetic_change ignored=true" \
            "universal.fast_red provisional=true exact_route_continues=true"
          do
            grep -Fq -- "$expected" apk-strings.txt
          done

          {
            echo "APK=$apk"
            echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')"
            echo "APK_SIZE_BYTES=$(wc -c < "$apk")"
            cat manual-optional-validation.txt
          } > apk-validation.txt
          cat apk-validation.txt

      - name: Upload validations
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-validations
          path: |
            manual-optional-validation.txt
            apk-validation.txt
            real-farol-validation.txt
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
