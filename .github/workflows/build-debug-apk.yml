name: Build Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Run unit tests
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon --stacktrace --console=plain > gradle-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -nE "(^e: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|CompilationErrorException|BubbleShortcut|ProfessionalBubble|ProximityAlert)" gradle-test.log || true
            tail -400 gradle-test.log
          fi
          exit "$status"

      - name: Upload unit-test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-log
          path: gradle-test.log
          if-no-files-found: ignore

      - name: Run real farol route simulation
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          REAL_FAROL_REPORT: real-farol-validation.txt
        run: python3 scripts/real_farol_route_gate.py

      - name: Upload real farol validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-farol-validation
          path: real-farol-validation.txt
          if-no-files-found: error

      - name: Build debug APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --console=plain > gradle-assemble.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -nE "(^e: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|CompilationErrorException|BubbleShortcut|ProfessionalBubble|ProximityAlert)" gradle-assemble.log || true
            tail -400 gradle-assemble.log
          fi
          exit "$status"

      - name: Upload assemble failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-assemble-log
          path: gradle-assemble.log
          if-no-files-found: ignore

      - name: Validate professional reader and bubble architecture
        run: |
          set -euo pipefail
          service="app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt"
          main="app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt"
          controller="app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt"
          catalog="app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutModule.kt"
          position="app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutPositionPolicy.kt"
          engine="app/src/main/java/br/com/mapeiaia/rotacerta/ProximityAlertEngine.kt"
          trigger="app/src/main/java/br/com/mapeiaia/rotacerta/UniversalAddressTrigger.kt"
          modules=(
            app/src/main/java/br/com/mapeiaia/rotacerta/AlertBubbleShortcutModule.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/SavedPlaceBubbleShortcutModule.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/RideCardBubbleShortcutModule.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/DestinationBubbleShortcutModule.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/ReadingBubbleShortcutModule.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/WhatsAppBubbleShortcutModule.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/SettingsBubbleShortcutModule.kt
            app/src/main/java/br/com/mapeiaia/rotacerta/StopBubbleShortcutModule.kt
          )

          for file in "$service" "$main" "$controller" "$catalog" "$position" "$engine" "$trigger" "${modules[@]}"; do
            test -f "$file"
          done

          grep -Fq 'const val MINIMUM_VISIBLE_ADDRESSES = 2' "$trigger"
          grep -Fq 'UniversalAddressTrigger.evaluate(snapshotText)' "$service"
          grep -Fq 'hardClearUniversalTwoAddress' "$service"
          grep -Fq 'const val SCAN_LOOP_MS = 120L' "$service"
          grep -Fq 'bubble_instant_drag_0_1_116' "$service"
          grep -Fq 'newView.setOnClickListener { toggleResourceShortcuts() }' "$service"
          grep -Fq 'onShortcut = ::executeShortcutModule' "$service"
          grep -Fq 'BubbleShortcutCatalog.modules.joinToString' "$service"
          grep -Fq 'KEY_RUNTIME_SHORTCUTS_OPEN' "$service"
          grep -Fq 'BubbleShortcutAction.ToggleReading -> toggleLiveReadingFromBubble()' "$service"
          grep -Fq 'BubbleShortcutAction.OpenScreenWhatsApp -> capturePhoneAndOpenWhatsApp()' "$service"
          grep -Fq 'BubbleShortcutAction.StopApplication -> stopApplicationFromBubble()' "$service"
          grep -Fq 'Settings.ACTION_APPLICATION_DETAILS_SETTINGS' "$service"
          grep -Fq 'disableSelf()' "$service"
          grep -Fq 'bubble_reading_gate_0_1_118' "$service"
          grep -Fq 'openSavedPlaceEditor(place: SavedPlace)' "$service"
          grep -Fq '.putExtra(EXTRA_OPEN_BUBBLE_GROUP, BUBBLE_GROUP_ALERTS_VALUE)' "$service"

          grep -Fq 'interface BubbleShortcutModule' "$catalog"
          grep -Fq 'BubbleShortcutCatalog' "$catalog"
          grep -Fq 'modules.size == 8' "$catalog"
          grep -Fq 'BubbleShortcutCatalog.modules.forEach' "$controller"
          grep -Fq 'onShortcut(module.spec)' "$controller"
          grep -Fq 'contentDescription = spec.label' "$controller"
          grep -Fq 'BubbleShortcutPositionPolicy.place' "$controller"
          grep -Fq 'rightX + menuWidth' "$position"
          grep -Fq 'leftX >= safe' "$position"
          if grep -Fq 'data class BubbleShortcutActions' "$controller" || grep -Fq 'BubbleShortcutActions(' "$service"; then
            echo "ERRO: controlador ainda possui callbacks fixos."
            exit 1
          fi

          grep -Fq 'label = "Salvar alerta"' "${modules[0]}"
          grep -Fq 'displayLabel = "Alerta"' "${modules[0]}"
          grep -Fq 'defaultName = "Alerta"' "${modules[0]}"
          grep -Fq 'label = "Salvar local"' "${modules[1]}"
          grep -Fq 'displayLabel = "Local"' "${modules[1]}"
          grep -Fq 'defaultName = "Local salvo"' "${modules[1]}"
          grep -Fq 'label = "Salvar card"' "${modules[2]}"
          grep -Fq 'targetGroup = "destination"' "${modules[3]}"
          grep -Fq 'action = BubbleShortcutAction.ToggleReading' "${modules[4]}"
          grep -Fq 'targetGroup = "access"' "${modules[4]}"
          grep -Fq 'action = BubbleShortcutAction.OpenScreenWhatsApp' "${modules[5]}"
          grep -Fq 'targetGroup = "general"' "${modules[6]}"
          grep -Fq 'action = BubbleShortcutAction.StopApplication' "${modules[7]}"

          grep -Fq 'professional_bubble_home_0_1_118' "$main"
          grep -Fq 'Text("Operacao"' "$main"
          grep -Fq 'Text("Sistema"' "$main"
          grep -Fq 'Text("Acoes rapidas"' "$main"
          grep -Fq 'Text("Suporte"' "$main"
          grep -Fq 'ProfessionalBubbleItem("🟢", "WhatsApp"' "$main"
          grep -Fq 'ProfessionalBubbleItem("🚗", "Coletor"' "$main"
          grep -Fq 'ProfessionalBubbleItem("🧹", "Limpar"' "$main"
          grep -Fq 'ProfessionalBubbleItem("🛠️", "Depurar"' "$main"
          grep -Fq 'ProfessionalBubbleItem("⏹️", "Encerrar"' "$main"
          grep -Fq 'BUBBLE_GROUP_ACCESS -> {' "$main"
          grep -Fq 'Permissoes, leitura e GPS' "$main"
          grep -Fq 'DiagnosticLogStore.dump()' "$main"
          grep -Fq 'LINHA DO TEMPO COMPLETA DA EXECUCAO' "$main"
          if grep -Fq '"Ferramentas" to BUBBLE_GROUP_TOOLS' "$main"; then
            echo "ERRO: Ferramentas ainda aparece como categoria principal."
            exit 1
          fi
          if grep -Fq '"Leitura" to BUBBLE_GROUP_READING' "$main"; then
            echo "ERRO: Leitura ainda aparece como categoria principal."
            exit 1
          fi

          grep -Fq 'if (alert.type != SavedPlaceType.ProximityAlert)' "$controller"
          grep -Fq 'popupButton("Editar")' "$controller"
          grep -Fq 'popupButton("Excluir")' "$controller"
          grep -Fq 'popupButton("Confirmar")' "$controller"
          grep -Fq 'popupShownThisApproach' "$engine"
          grep -Fq 'onSavedPlacePopup(alert, distanceMeters)' "$engine"
          grep -Fq 'Local para voltar depois, como estacionamento' "$main"
          grep -Fq 'highlighted || draftName.trim() != place.name' "$main"

          cat > universal-two-address-validation.txt <<'EOF'
          UNIVERSAL_SCREEN_READING=enabled
          MINIMUM_RECOGNIZED_ADDRESSES=2
          SCREEN_CHANGE_INVALIDATION=immediate
          INSTANT_DRAG=preserved
          MAIN_BUBBLE_TAP=toggles_resource_shortcuts
          RESOURCE_SHORTCUTS=8
          SHORTCUT_MODULES=8_independent
          SHORTCUT_POSITION=adjacent_without_overlap
          READING_SHORTCUT=toggle_live_reading
          WHATSAPP_SHORTCUT=capture_phone_from_screen
          STOP_SHORTCUT=pause_and_open_android_app_details
          HOME_LAYOUT=professional_logical_sections
          HOME_READING=inside_permissions
          HOME_TOOLS_CATEGORY=removed
          HOME_QUICK_ACTIONS=whatsapp_collector_clipboard_debug
          DEBUG_REPORT=full_in_memory_timeline
          SAVE_ALERT=editable_proximity_alert
          SAVE_LOCAL=editable_gps_bookmark_only
          SAVED_LOCAL_PROXIMITY_POPUP=disabled
          ALERT_POPUP_ACTIONS=close_edit_delete
          ALERT_POPUP_REPEAT=once_per_approach
          EOF
          cp universal-two-address-validation.txt bubble-tap-validation.txt
          cat universal-two-address-validation.txt

      - name: Validate debug APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          {
            echo "APK: $apk"
            echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')"
            echo "APK_SIZE_BYTES=$(wc -c < "$apk")"
          } > apk-validation.txt
          tmp_dir="$(mktemp -d)"
          unzip -q "$apk" 'classes*.dex' -d "$tmp_dir"
          strings "$tmp_dir"/classes*.dex > apk-strings.txt
          for expected in \
            "Salvar alerta" \
            "Salvar local" \
            "Salvar card" \
            "WhatsApp da tela" \
            "Encerrar Rota Certa" \
            "Leitura pausada" \
            "Permissoes, leitura e GPS" \
            "Central de controle" \
            "LINHA DO TEMPO COMPLETA DA EXECUCAO" \
            "bubble.shortcuts.opened count=" \
            "bubble.shortcut.execute id=" \
            "proximity.popup.shown id=" \
            "Alerta excluido." \
            "universal.trigger source="
          do
            grep -Fq -- "$expected" apk-strings.txt || {
              echo "MISSING=$expected" >> apk-validation.txt
              cat apk-validation.txt
              exit 1
            }
            echo "FOUND=$expected" >> apk-validation.txt
          done
          cat universal-two-address-validation.txt >> apk-validation.txt
          cat apk-validation.txt

      - name: Upload validations
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-validations
          path: |
            universal-two-address-validation.txt
            bubble-tap-validation.txt
            apk-validation.txt
            real-farol-validation.txt
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish stable GitHub Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/pr5-stable-bubble-combined'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          stable_apk="rota-certa-stable-debug.apk"
          stable_sha="rota-certa-stable-debug.apk.sha256"
          tag="rota-certa-stable-debug"
          version_name="$(find app -maxdepth 1 -name 'version-*.gradle.kts' -printf '%f\n' | sed -E 's/^version-(.*)\.gradle\.kts$/\1/' | sort -V | tail -1)"
          version_code="$((1000 + GITHUB_RUN_NUMBER))"
          cp "$apk" "$stable_apk"
          sha256sum "$stable_apk" > "$stable_sha"
          cat > stable-release-notes.md <<EOF
          Rota Certa Stable Debug APK

          Version: ${version_name}
          VersionCode: ${version_code}
          Run: ${GITHUB_RUN_NUMBER}
          Commit: ${RELEASE_TARGET_SHA}

          Recursos 0.1.118:
          - Oito atalhos independentes ancorados ao redor da bolinha principal.
          - Leitura alterna imediatamente entre ativa e pausada.
          - WhatsApp captura telefone brasileiro visivel na tela.
          - Encerrar pausa leitura, alertas e abre os detalhes do aplicativo para confirmar Forcar interrupcao.
          - Home organizada por Operacao, Sistema, Registros, Acoes rapidas e Suporte.
          - Ferramentas removida como categoria e Leitura movida para Permissoes.
          - Diagnostico exporta a linha do tempo completa mantida em memoria.
          EOF
          cat universal-two-address-validation.txt >> stable-release-notes.md
          cat apk-validation.txt >> stable-release-notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Rota Certa Stable Debug" --notes-file stable-release-notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET_SHA" --title "Rota Certa Stable Debug" --notes-file stable-release-notes.md
          fi
          published=false
          for attempt in 1 2 3; do
            if gh release upload "$tag" "$stable_apk" "$stable_sha" --repo "$GITHUB_REPOSITORY" --clobber; then
              published=true
              break
            fi
            sleep "$((attempt * 5))"
          done
          test "$published" = true
