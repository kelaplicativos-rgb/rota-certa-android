name: Build Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Check Google Maps secret
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY secret is empty. APK will still build; configure the key inside the app."
          else
            echo "GOOGLE_MAPS_API_KEY secret found."
          fi

      - name: Record debug APK run start
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          mkdir -p .github
          {
            echo "Build Debug APK run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Artifact: pending"
            echo "Commit: ${CURRENT_SHA}"
          } > .github/latest-debug-apk-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest-debug-apk-run.txt
          git commit -m "Record debug APK run start" || exit 0
          git push

      - name: Run unit tests
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon --stacktrace --console=plain > gradle-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -nE "(^e: |error:|FAILED|MainActivity|LiveRideAccessibilityService|patchResourceGroups|patchLiveRideBubble)" gradle-test.log || tail -160 gradle-test.log
          fi
          exit "$status"

      - name: Build debug APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Record latest APK run link
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          mkdir -p .github
          {
            echo "Build Debug APK run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Artifact: rota-certa-debug-apk"
            echo "Commit: ${CURRENT_SHA}"
          } > .github/latest-debug-apk-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest-debug-apk-run.txt
          git commit -m "Record latest debug APK run" || exit 0
          git push
