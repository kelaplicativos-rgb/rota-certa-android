name: Build Corrected APK 0.1.146

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-debug-apk.yml
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: write

jobs:
  build:
    name: Build corrected APK 0.1.146
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.146-authorized-apps

    steps:
      - name: Checkout exact corrected source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || 'codex/unified-debug-log-0.1.139' }}
          fetch-depth: 0

      - name: Record exact source commit
        run: git rev-parse HEAD | tee validated-commit.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Verify committed source contract
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.1.146"' app/build.gradle.kts
          grep -q 'versionCode = 5070' app/build.gradle.kts
          grep -q 'Aplicativos e cards autorizados' app/src/main/java/br/com/mapeiaia/rotacerta/InstalledRideAppPickerActivity.kt
          grep -q 'removePackage' app/src/main/java/br/com/mapeiaia/rotacerta/ManualAppScreenCaptureStore.kt
          grep -q 'postDelayed(longPressAction, 1_500L)' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt
          ! grep -q 'onDoubleTap(event' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt
          ! grep -q 'Text("Salvar Casa")' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          ! test -e app/src/main/java/br/com/mapeiaia/rotacerta/RegisteredCardDecisionGate.kt
          ! test -e app/src/main/java/br/com/mapeiaia/rotacerta/RideCardTemplateMatcher.kt
          test -n "${GOOGLE_MAPS_API_KEY:-}"

      - name: Run unit tests
        run: gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee unit-tests.log

      - name: Run Android lint
        run: gradle lintDebug --no-daemon --stacktrace --console=plain 2>&1 | tee lint.log

      - name: Build corrected APK
        run: gradle clean assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee assemble.log

      - name: Validate package version signature and markers
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee aapt-badging.txt
          grep -q "package: name='br.com.mapeiaia.rotacerta'" aapt-badging.txt
          grep -q "versionCode='5070'" aapt-badging.txt
          grep -q "versionName='0.1.146'" aapt-badging.txt
          unzip -p "$APK" 'classes*.dex' | strings > dex-strings.txt
          grep -q 'Aplicativos e cards autorizados' dex-strings.txt
          grep -q 'Excluir somente este card' dex-strings.txt
          grep -q 'bubble.shortcut.long_press' dex-strings.txt
          ! grep -q 'bubble.shortcut.double_tap' dex-strings.txt
          cp "$APK" rota-certa-0.1.146-autorizados-validado.apk
          stat -c '%s' rota-certa-0.1.146-autorizados-validado.apk | tee apk-size-bytes.txt
          sha256sum rota-certa-0.1.146-autorizados-validado.apk | tee apk-sha256.txt

      - name: Upload validated APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.146-authorized-apps-validated
          path: |
            rota-certa-0.1.146-autorizados-validado.apk
            apk-sha256.txt
            apk-size-bytes.txt
            aapt-badging.txt
            apksigner.txt
            validated-commit.txt
            unit-tests.log
            lint.log
            assemble.log
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest
          retention-days: 90
          if-no-files-found: error

      - name: Publish stable GitHub Release
        run: |
          set -euo pipefail
          SOURCE_SHA="$(cat validated-commit.txt)"
          cat > release-notes.md <<EOF
          Rota Certa 0.1.146 — aplicativos e cards autorizados

          Commit validado: ${SOURCE_SHA}
          Package: br.com.mapeiaia.rotacerta
          VersionName: 0.1.146
          VersionCode: 5070

          Testes unitários, Android Lint, build, integridade ZIP, assinatura, package/version e marcadores DEX aprovados pelo workflow.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              rota-certa-0.1.146-autorizados-validado.apk \
              apk-sha256.txt apk-size-bytes.txt aapt-badging.txt apksigner.txt validated-commit.txt \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --title "Rota Certa 0.1.146 validado" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              rota-certa-0.1.146-autorizados-validado.apk \
              apk-sha256.txt apk-size-bytes.txt aapt-badging.txt apksigner.txt validated-commit.txt \
              --target "$SOURCE_SHA" --title "Rota Certa 0.1.146 validado" --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.146-validation-failure
          path: |
            validated-commit.txt
            unit-tests.log
            lint.log
            assemble.log
            app/build/reports
            app/build/test-results
          if-no-files-found: warn
