name: Finalize Rota Certa 0.1.168 documentation

on:
  push:
    branches:
      - agent/farol-unified-visual-0.1.168
    paths:
      - .github/workflows/repair-rota-certa-0.1.168-anchor.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/farol-unified-visual-0.1.168
          fetch-depth: 0

      - name: Record validated 0.1.168 delivery
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          status_path = Path('docs/PROJECT_STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          heading = '# Rota Certa — Estado do projeto\n\n'
          marker = '## 31/07/2026 — 0.1.168 (5290) — visão unificada validada'
          if not status.startswith(heading):
              raise SystemExit('cabeçalho de PROJECT_STATUS.md inesperado')
          if marker not in status:
              entry = '''## 31/07/2026 — 0.1.168 (5290) — visão unificada validada

- **Branch:** `agent/farol-unified-visual-0.1.168`; **PR:** #37, rascunho e sem merge na `main`.
- **Commit funcional validado:** `f66d8daefce26f5cc9f78d8c27c581bfd9734314`.
- **Pedido:** analisar os workflows anexados, localizar a primeira causa real, corrigir a 0.1.168 sem regressão do núcleo 0.1.167 e entregar um APK efetivamente validado.
- **Situação anterior:** os workflows 0.1.168 encerravam antes de testes, Lint e build. Após a primeira âncora, novas incompatibilidades do aplicador antigo apareciam em sequência; a suíte também revelou mistura entre dois cards, caminho de teste dependente do diretório e contrato legado que ainda exigia atraso fixo no OCR.
- **Causas comprovadas:**
  - a expressão do aplicador não aceitava o parâmetro válido chamado exatamente `text`;
  - o hash semântico não reconhecia `immediateTextChecklist13` no `analysisHash143`;
  - o fallback atual usa `Job`/corrotina, mas o aplicador procurava `Handler.postDelayed`;
  - o OCR real está em `AndroidServices.kt` e retorna `String`, enquanto a correção auxiliar procurava uma chamada direta ao ML Kit dentro do serviço de acessibilidade;
  - expressões com `\\s+` ao redor de `Pular` consumiam a quebra de linha e juntavam o início do card seguinte.
- **Correção aplicada:** executor idempotente e fechado para adaptar as âncoras ao código 0.1.167 real; hash semântico somente no hash de análise; remoção exclusiva do atraso artificial do fallback, preservando cancelamento, geração e filtros; integração espacial dentro do `OcrService` usando o mesmo resultado ML Kit, sem segunda leitura; limites horizontais `[ \\t]+` preservando quebras entre cards; contratos atualizados para execução pela raiz ou pelo módulo `app`.
- **Arquivos principais da entrega:**
  - `scripts/run_fix_farol_unified_visual_0168.py`;
  - `scripts/fix_farol_unified_visual_0168_compile.py`;
  - `.github/workflows/build-rota-certa-0.1.168-final.yml`;
  - `.github/workflows/build-rota-certa-0.1.168.yml`;
  - código materializado: `FarolUnifiedVisual0168.kt`, `AndroidServices.kt`, `LiveRideAccessibilityService.kt`, `RideTextParser.kt` e testes 0.1.168.
- **Fronteira protegida:** Manifest e permissões inalterados; hashes de `DecisionEngine.kt`, `GoogleMapsService.kt`, `FarolSelectedAppInputPolicy0166.kt` e `FarolRealtimeEventGate0167.kt` preservados; Casa/Alfinetes, Modo Trabalho e regra de somente card confirmado continuam vigentes.
- **Testes executados:** materialização completa 0.1.151–0.1.168 duas vezes; idempotência; fronteira exata; contratos visuais; **237 testes unitários e de contrato aprovados**; Android Lint aprovado; `clean assembleDebug` aprovado; integridade ZIP; Manifest; DEX; pacote, versão, versionCode e assinatura APK v2.
- **Workflow final:** `Build Rota Certa 0.1.168 Final`, run `30601624749`, job `91065374576`, todos os passos concluídos com sucesso.
- **Artifact:** `rota-certa-0.1.168-farol-visual-unificado-validated`, ID `8782207626`, retenção até 29/10/2026.
- **Pacote e versão validados:** `br.com.mapeiaia.rotacerta`, versão `0.1.168`, versionCode `5290`.
- **APK:** `rota-certa-0.1.168-farol-visual-unificado-validado.apk`, 55.894.891 bytes.
- **SHA-256 do APK:** `386cbf256e471bcb6ab2bc79c8564ff9826dbf52bec2fac5bb5a98fd2fe69de2`.
- **SHA-256 do ZIP do artifact:** `feef33784c0c111842976e645937fb8a32e08cc8265f8515102bdbfc4197553b`.
- **Assinatura:** APK Signature Scheme v2 válida; certificado `CN=Rota Certa Debug, O=Kel Aplicativos, C=BR`; certificado SHA-256 `d9ee577b5bb9a4c72bce115e974c9ecf1ec8c7382bcd034e88d433e01eb0e7fd`; RSA 2048 bits.
- **Pendência prática:** instalar em aparelho real e testar cards individuais e listas da Uber, 99, inDrive e de outro aplicativo selecionado, verificando mudança imediata para amarelo/verde/vermelho, limpeza ao sair do card e ausência de mistura entre ofertas. Build, testes e APK estão validados; conteúdo visual de terceiros e condições reais de acessibilidade/OCR ainda exigem aparelho.

'''
              status_path.write_text(heading + entry + status[len(heading):], encoding='utf-8')

          decisions_path = Path('docs/DECISIONS.md')
          decisions = decisions_path.read_text(encoding='utf-8')
          heading = '# Rota Certa — Decisões técnicas\n\n'
          marker = '## 31/07/2026 — OCR espacial único e limites de card preservados'
          if not decisions.startswith(heading):
              raise SystemExit('cabeçalho de DECISIONS.md inesperado')
          if marker not in decisions:
              entry = '''## 31/07/2026 — OCR espacial único e limites de card preservados

- **Decisão:** preservar o objeto estruturado `Text` do ML Kit dentro do `OcrService` até a ordenação por blocos e linhas; não executar uma segunda captura ou um segundo reconhecedor para obter geometria.
- **Motivo:** a arquitetura atual centraliza OCR em `AndroidServices.kt`. Integrar ali mantém uma única leitura, reduz CPU/memória e entrega ao parser texto espacialmente coerente para pop-ups e listas.
- **Decisão:** marcadores textuais em conteúdo achatado devem usar separadores horizontais `[ \\t]+`; `\\s+` não pode envolver ações como `Pular`, pois consome quebras de linha e pode unir cards distintos.
- **Decisão:** o primeiro fallback OCR não terá atraso fixo artificial. Ele continua orientado a evento, cancelável e protegido por pacote selecionado, sessão, geração, serviço pronto e prevenção de execução duplicada.
- **Decisão:** aplicadores de versão devem reconhecer identificadores Kotlin válidos e a arquitetura real da base materializada, falhando de forma fechada quando a âncora não for única.
- **Módulos afetados:** visão unificada 0.1.168, `OcrService`, entrada de processamento ao vivo, parser e contratos do pipeline imediato.
- **Condições para revisão:** somente se a API do ML Kit, o contrato de `OcrService` ou a estratégia de fallback forem substituídos; qualquer revisão deve preservar leitura única, cancelamento, isolamento por card e ausência de polling.

'''
              decisions_path.write_text(heading + entry + decisions[len(heading):], encoding='utf-8')
          PY

          git diff --check
          git diff -- docs/PROJECT_STATUS.md docs/DECISIONS.md

      - name: Commit documentation
        run: |
          set -euo pipefail
          git config user.name 'Rota Certa CI'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/PROJECT_STATUS.md docs/DECISIONS.md
          if git diff --cached --quiet; then
            echo 'Documentação já registrada.'
            exit 0
          fi
          git commit -m 'docs: registrar entrega validada da 0.1.168'
          git push origin HEAD:agent/farol-unified-visual-0.1.168
