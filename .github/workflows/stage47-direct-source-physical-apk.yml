name: Stage47 direct-source physical APK 0.1.239

on:
  pull_request:
    branches:
      - agent/stage47-r4-unified-occupancy-step6-validation-apk
    paths:
      - .github/workflows/stage47-direct-source-physical-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-direct-source-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOOGLE_MAPS_API_KEY: stage47_ci_dummy_key
      PROTECTED_FAROL_SHA256: 2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560
      EXPECTED_VERSION_CODE: '5532'
      EXPECTED_VERSION_NAME: '0.1.239'
    steps:
      - name: Checkout persisted PR source directly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify direct persisted-source authority
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          UI='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt'
          ACTIVITY='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt'
          TEST='app/src/test/java/br/com/mapeiaia/rotacerta/trips/TripTimelineExternalQuickPassengerStage47Test.kt'

          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          grep -Fq "versionCode = $EXPECTED_VERSION_CODE" app/build.gradle.kts
          grep -Fq "versionName = \"$EXPECTED_VERSION_NAME\"" app/build.gradle.kts
          test -s "$UI"
          test -s "$ACTIVITY"
          test -s "$TEST"
          grep -Fq 'timelineQuickPassengerOptions(entries, trips)' "$UI"
          grep -Fq 'ExternalTripCapacitySetup(entry, store, onChanged)' "$UI"
          grep -Fq 'external_seat_write_claimed=false' "$UI"
          grep -Fq 'canonicalTimelineProfileUuid(entry)' "$UI"
          grep -Fq 'findExistingTimelineBackingTrip(entry, store.trips())' "$UI"
          ! grep -Fq 'val options = entries.mapNotNull' "$UI"

          test ! -e stage47/source-patches/external-quick-passenger-direct-source.patch
          test ! -e .github/workflows/stage47-direct-source-external-quick-passenger-apply.yml

          CURRENT_HEAD="$(git rev-parse HEAD)"
          echo "direct_source_head=$CURRENT_HEAD"
          echo 'fixed_historical_source_checkout=false'
          echo 'stage47_materializer_used=false'
          echo 'farol_untouched=true'
          echo 'direct_source_authority=PASS'

      - name: Run focused direct-source tests
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripTimelineExternalQuickPassengerStage47Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripQuickPassengerStage47R4Step4Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripBlaBlaCollectorStage47R4Step5Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          echo 'direct_source_tests=PASS'

      - name: Assemble debug APK directly from branch source
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug \
            --no-daemon --max-workers=1 --no-parallel --stacktrace
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo 'direct_source_assemble_debug=PASS'

      - name: Inspect physical candidate
        run: |
          set -euo pipefail
          mkdir -p evidence
          APK='app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$AAPT"

          "$AAPT" dump badging "$APK" > evidence/aapt-badging.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" evidence/aapt-badging.txt

          : > evidence/dex-strings.txt
          while IFS= read -r dex; do
            unzip -p "$APK" "$dex" | strings >> evidence/dex-strings.txt
          done < <(zipinfo -1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')

          grep -Fq 'TIMELINE_EXTERNAL_CAPACITY_CONFIGURED' evidence/dex-strings.txt
          grep -Fq 'external_seat_write_claimed=false' evidence/dex-strings.txt
          grep -Fq 'Perfil/viagem:' evidence/dex-strings.txt
          grep -Fq 'Salvar capacidade interna' evidence/dex-strings.txt

          sha256sum "$APK" | tee evidence/apk-sha256.txt
          APK_SHA="$(awk '{print $1}' evidence/apk-sha256.txt)"
          FAROL_SHA="$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | awk '{print $1}')"
          test "$FAROL_SHA" = "$PROTECTED_FAROL_SHA256"

          cat > evidence/direct-source-physical-status.txt <<EOF
          stage47_direct_source_physical_apk=PASS
          version=$EXPECTED_VERSION_NAME/$EXPECTED_VERSION_CODE
          package=br.com.mapeiaia.rotacerta
          source_head=$(git rev-parse HEAD)
          direct_source=true
          fixed_historical_source_checkout=false
          stage47_materializer_used=false
          farol_sha256=$FAROL_SHA
          external_seat_write_claimed=false
          apk_sha256=$APK_SHA
          merge=false
          release=false
          latest=false
          EOF
          cat evidence/direct-source-physical-status.txt

      - name: Upload direct-source physical APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-stage47-direct-source-0.1.239
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            evidence/apk-sha256.txt
            evidence/aapt-badging.txt
            evidence/direct-source-physical-status.txt
          if-no-files-found: error
          retention-days: 7
