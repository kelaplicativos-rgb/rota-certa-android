name: Stage47 direct-source physical APK 0.1.249

on:
  pull_request:
    branches:
      - agent/stage47-r4-unified-occupancy-step6-validation-apk
    paths:
      - .github/workflows/stage47-direct-source-physical-apk.yml
      - app/build.gradle.kts
      - app/src/main/**
      - app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaHarvestAssociationTest.kt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-direct-source-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOOGLE_MAPS_API_KEY: stage47_ci_dummy_key
      PROTECTED_FAROL_SHA256: 2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560
      EXPECTED_VERSION_CODE: '5542'
      EXPECTED_VERSION_NAME: '0.1.249'
    steps:
      - name: Checkout persisted PR source directly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify deterministic direct persisted-source authority
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          AUTOMATION='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaManualSeatAutomation.kt'
          DYNAMIC='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt'
          WATCHDOG='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaHarvestNavigationWatchdogProvider.kt'
          MANIFEST='app/src/main/AndroidManifest.xml'
          ASSOCIATION_TEST='app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaHarvestAssociationTest.kt'

          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          grep -Fq "versionCode = $EXPECTED_VERSION_CODE" app/build.gradle.kts
          grep -Fq "versionName = \"$EXPECTED_VERSION_NAME\"" app/build.gradle.kts
          test -s "$AUTOMATION"
          test -s "$DYNAMIC"
          test -s "$WATCHDOG"
          test -s "$ASSOCIATION_TEST"

          for marker in \
            MHTML_ARCHIVE_TIMEOUT \
            MHTML_HARVEST_COMPLETE \
            HARVEST_PASSENGER_CAPTURED \
            HARVEST_EDIT_CAPTURED \
            SEAT_OPTIONS_CAPTURED \
            PASSENGER_TEL_INTERCEPTED \
            HARVEST_EVALUATION_TIMEOUT \
            HARVEST_USER_BACK_RECOVERY \
            HARVEST_STALE_CALLBACK_IGNORED \
            HARVEST_PAGE_IDENTITY_MISMATCH \
            association_conflict; do
            grep -Fq "$marker" "$AUTOMATION"
          done
          grep -Fq 'externalDialerOpened=false' "$AUTOMATION"
          grep -Fq 'navigationGeneration++' "$AUTOMATION"
          grep -Fq 'loadTrackedUrl(' "$AUTOMATION"
          grep -Fq 'fun passengerEvidenceKey(accountId: String, tripId: String, passengerKey: String)' "$AUTOMATION"
          grep -Fq 'enrichPassenger(tripId, passenger)' "$AUTOMATION"
          grep -Fq 'preservedIncomplete=0' "$AUTOMATION"
          grep -Fq 'deterministicHarvest=true' "$AUTOMATION"
          grep -Fq 'deterministicJoin=true' "$AUTOMATION"
          grep -Fq 'requiresSemanticProof' "$AUTOMATION"
          grep -Fq 'editHref: String = ""' "$AUTOMATION"
          grep -Fq 'tripIdFromEditHref(href) == target.tripId' "$AUTOMATION"
          grep -Fq 'tripIdFromOptionsHref(optionHref) == target.tripId' "$AUTOMATION"
          grep -Fq 'MAX_TRIP_ROSTER_READ_ATTEMPTS = 5' "$AUTOMATION"
          grep -Fq 'MAX_PASSENGER_PAGE_RELOAD_ATTEMPTS = 1' "$AUTOMATION"
          ! grep -Fq 'passengerEvidence[canonicalHref' "$AUTOMATION"
          ! grep -Fq 'Intent(Intent.ACTION_CALL' "$AUTOMATION"
          ! grep -Fq 'Intent(Intent.ACTION_DIAL' "$AUTOMATION"

          grep -Fq 'rosterContainers.length > 0 && !hasMore' "$DYNAMIC"
          grep -Fq 'HARVEST_NAVIGATION_WATCHDOG_ATTACHED' "$WATCHDOG"
          grep -Fq 'HARVEST_NAVIGATION_TIMEOUT' "$WATCHDOG"
          grep -Fq 'HARVEST_STALE_PAGE_FINISHED_IGNORED' "$WATCHDOG"
          grep -Fq 'NAVIGATION_TIMEOUT_MS = 12_000L' "$WATCHDOG"
          grep -Fq 'delegate.onPageFinished(webView, current)' "$WATCHDOG"
          grep -Fq 'syntheticPageFinished=true' "$WATCHDOG"
          grep -Fq 'externalNavigation=false' "$WATCHDOG"
          ! grep -Fq 'ACTION_CALL' "$WATCHDOG"
          ! grep -Fq 'ACTION_DIAL' "$WATCHDOG"
          grep -Fq 'BlaBlaHarvestNavigationWatchdogProvider' "$MANIFEST"

          test ! -e .github/workflows/stage47-apply-harvester-recovery.yml
          test ! -e .github/workflows/stage47-export-authoritative-source.yml
          test ! -e .github/patches/stage47-harvester-recovery.patch
          test ! -e .github/workflows/stage47-apply-roster-readiness-0.1.248.yml
          test ! -e .github/patches/stage47-roster-readiness-0.1.248.patch
          test ! -e stage47/source-patches/external-quick-passenger-direct-source.patch

          CURRENT_HEAD="$(git rev-parse HEAD)"
          echo "direct_source_head=$CURRENT_HEAD"
          echo 'direct_source=true'
          echo 'fixed_historical_source_checkout=false'
          echo 'stage47_materializer_used=false'
          echo 'deterministic_trip_page_identity=true'
          echo 'deterministic_passenger_trip_scope=true'
          echo 'stale_callback_fail_closed=true'
          echo 'unproven_roster_preserved=false'
          echo 'passenger_card_semantic_proof=true'
          echo 'real_edit_and_options_links_only=true'
          echo 'harvester_navigation_watchdog=true'
          echo 'harvester_evaluation_timeout=true'
          echo 'harvester_back_recovery=true'
          echo 'external_dialer_opened=false'
          echo 'farol_untouched=true'
          echo 'direct_source_authority=PASS'

      - name: Run focused direct-source tests with transient repository retry
        run: |
          set -euo pipefail
          passed=false
          for attempt in 1 2 3; do
            echo "direct_source_test_attempt=$attempt"
            if ./gradlew :app:testDebugUnitTest \
              --tests 'br.com.mapeiaia.rotacerta.trips.TripTimelineExternalQuickPassengerStage47Test' \
              --tests 'br.com.mapeiaia.rotacerta.trips.TripTimelineBaseDirectionStage47Test' \
              --tests 'br.com.mapeiaia.rotacerta.trips.TripQuickPassengerStage47R4Step4Test' \
              --tests 'br.com.mapeiaia.rotacerta.trips.TripBlaBlaCollectorStage47R4Step5Test' \
              --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaManualSeatAutomationStage47Test' \
              --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaHarvestAssociationTest' \
              --no-daemon --max-workers=1 --no-parallel --stacktrace; then
              passed=true
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 10)); fi
          done
          test "$passed" = true
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          echo 'direct_source_tests=PASS'

      - name: Assemble debug APK directly from branch source
        run: |
          set -euo pipefail
          passed=false
          for attempt in 1 2 3; do
            echo "direct_source_assemble_attempt=$attempt"
            if ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace; then
              passed=true
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 10)); fi
          done
          test "$passed" = true
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo 'direct_source_assemble_debug=PASS'

      - name: Inspect physical candidate
        run: |
          set -euo pipefail
          mkdir -p evidence
          APK='app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > evidence/aapt-badging.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" evidence/aapt-badging.txt

          : > evidence/dex-strings.txt
          while IFS= read -r dex; do
            unzip -p "$APK" "$dex" | strings >> evidence/dex-strings.txt
          done < <(zipinfo -1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')

          for marker in \
            MHTML_ARCHIVE_TIMEOUT \
            MHTML_HARVEST_COMPLETE \
            HARVEST_PASSENGER_CAPTURED \
            HARVEST_EDIT_CAPTURED \
            SEAT_OPTIONS_CAPTURED \
            PASSENGER_TEL_INTERCEPTED \
            HARVEST_EVALUATION_TIMEOUT \
            HARVEST_USER_BACK_RECOVERY \
            HARVEST_STALE_CALLBACK_IGNORED \
            HARVEST_PAGE_IDENTITY_MISMATCH \
            association_conflict \
            deterministicHarvest=true \
            deterministicJoin=true \
            preservedIncomplete=0 \
            HARVEST_NAVIGATION_WATCHDOG_ATTACHED \
            HARVEST_NAVIGATION_TIMEOUT \
            HARVEST_STALE_PAGE_FINISHED_IGNORED; do
            grep -Fq "$marker" evidence/dex-strings.txt
          done
          grep -Fq 'externalDialerOpened=false' evidence/dex-strings.txt
          grep -Fq 'cancel=false partialEvidencePreserved=true' evidence/dex-strings.txt
          grep -Fq 'syntheticPageFinished=true' evidence/dex-strings.txt
          grep -Fq 'externalNavigation=false' evidence/dex-strings.txt

          sha256sum "$APK" | tee evidence/apk-sha256.txt
          APK_SHA="$(awk '{print $1}' evidence/apk-sha256.txt)"
          FAROL_SHA="$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | awk '{print $1}')"
          test "$FAROL_SHA" = "$PROTECTED_FAROL_SHA256"

          cat > evidence/direct-source-physical-status.txt <<EOF
          stage47_direct_source_physical_apk=PASS
          version=$EXPECTED_VERSION_NAME/$EXPECTED_VERSION_CODE
          package=br.com.mapeiaia.rotacerta
          source_head=$(git rev-parse HEAD)
          direct_source=true
          fixed_historical_source_checkout=false
          stage47_materializer_used=false
          farol_sha256=$FAROL_SHA
          deterministic_trip_page_identity=true
          deterministic_passenger_trip_scope=true
          stale_callback_fail_closed=true
          unproven_roster_preserved=false
          passenger_card_semantic_proof=true
          real_edit_and_options_links_only=true
          navigation_timeout_ms=12000
          evaluation_timeout_ms=6000
          external_dialer_opened=false
          official_blablacar_write_api_claimed=false
          apk_sha256=$APK_SHA
          merge=false
          release=false
          latest=false
          EOF
          cat evidence/direct-source-physical-status.txt

      - name: Upload direct-source physical APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-stage47-deterministic-association-0.1.249
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            evidence/apk-sha256.txt
            evidence/aapt-badging.txt
            evidence/direct-source-physical-status.txt
          if-no-files-found: error
          retention-days: 7