name: Executor Canonical Agenda Timeline Parity 0.1.554

on:
  push:
    branches:
      - agent/canonical-agenda-timeline-parity-0.1.554
    paths:
      - .github/workflows/executor-session-hardening-0553-v3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-canonical-parity-0554:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/canonical-agenda-timeline-parity-0.1.554
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'val releaseVersionCode = 5_846' app/build.gradle.kts
          grep -F 'val releaseVersionName = "0.1.554"' app/build.gradle.kts
          grep -F 'canonicalSegmentAvailableSeats0494' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimeline.kt
          grep -F 'localAgendaMaterializesCanonicalSegmentAvailability' app/src/test/java/br/com/mapeiaia/rotacerta/trips/TimelineLocalPrimary0525Test.kt
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo 'ROTA_CERTA_GIT_BRANCH=agent/canonical-agenda-timeline-parity-0.1.554' >> "$GITHUB_ENV"

      - name: Focused canonical parity tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests br.com.mapeiaia.rotacerta.trips.TimelineLocalPrimary0525Test

      - name: Inherited full unit suite
        id: full_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest | tee full-unit-suite.log

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK identity and evidence
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee aapt-badging.txt
          grep -F "package: name='br.com.mapeiaia.rotacerta' versionCode='5846' versionName='0.1.554'" aapt-badging.txt
          mkdir -p release-0554
          cp "$APK" "release-0554/rota-certa-0.1.554-build-5846-${FINAL_SHA}.apk"
          sha256sum release-0554/*.apk | tee release-0554/apk-sha256.txt
          cp aapt-badging.txt release-0554/aapt-badging.txt
          cp full-unit-suite.log release-0554/full-unit-suite.log || true
          {
            echo "versionName=0.1.554"
            echo "versionCode=5846"
            echo "branch=agent/canonical-agenda-timeline-parity-0.1.554"
            echo "source_head=${FINAL_SHA}"
            echo "focused_canonical_parity_tests=PASS"
            echo "full_unit_suite=${{ steps.full_tests.outcome }}"
            echo "physical_device_validation=PENDING_SAMSUNG_SM-S911B_ANDROID_16"
          } | tee release-0554/build-evidence.txt

      - name: Upload verified APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.554-build-5846-canonical-parity
          path: release-0554/
          if-no-files-found: error
          retention-days: 14
