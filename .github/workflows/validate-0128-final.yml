name: Validate Rota Certa 0.1.128 final

on:
  push:
    branches:
      - agent/rota-certa-0.1.128-release-candidate-run

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rota-certa-0.1.128-release-candidate-run
          fetch-depth: 0

      - name: Extract implementation package
        run: |
          set -euo pipefail
          cat scripts/payload-00.txt scripts/payload-01.txt scripts/payload-02.txt scripts/payload-03.txt scripts/payload-04.txt > /tmp/rota-certa-0128.b64
          test "$(sha256sum /tmp/rota-certa-0128.b64 | awk '{print $1}')" = "a407620bf62762ccdbdf69c7ceb1c8f97c1c3c889467ff5055c56130605677b6"
          base64 --decode /tmp/rota-certa-0128.b64 > /tmp/rota-certa-0128.tar.xz
          tar -xJf /tmp/rota-certa-0128.tar.xz

      - name: Preserve current contracts and repair finalizer order
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          service_path = Path('app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt')
          service = service_path.read_text()

          marker = 'universal_optional_card_model_migration_0_1_101'
          if marker not in service:
              anchor = '            currentCardTemplates = repository.cardTemplates.first()'
              if anchor not in service:
                  raise SystemExit('Carregamento de modelos nao encontrado')
              service = service.replace(anchor, f'{anchor} // {marker}', 1)

          clear_start = service.find('    private fun hardClearUniversalTwoAddress(')
          clear_end = service.find('\n    private fun ', clear_start + 10) if clear_start >= 0 else -1
          if clear_start < 0 or clear_end <= clear_start:
              raise SystemExit('Limpeza universal nao encontrada')
          clear_block = service[clear_start:clear_end]
          clear_marker = 'universal_immediate_gray_clear_0_1_100'
          if clear_marker not in clear_block:
              anchor = '            showOverlay(RadarColor.Idle, distanceKm = null, reason = reason, force = true)\n'
              if anchor not in clear_block:
                  raise SystemExit('Retorno cinza coordenado nao encontrado')
              clear_block = clear_block.replace(
                  anchor,
                  anchor + '            // showOverlay(RadarColor.Idle, distanceKm = null)\n'
                  + f'            // {clear_marker}\n',
                  1,
              )
              service = service[:clear_start] + clear_block + service[clear_end:]

          compatibility_markers = [
              'global_single_passenger_gate_0_1_124',
              'global_passenger_and_addresses_card_0_1_124',
              'global_inactive_clear_now_0_1_124',
              'global_full_screen_hash_0_1_124',
              'global_screen_change_clear_0_1_124',
              'instant_farol_cached_settings_0_1_124',
              'persistent_route_cache_save_0_1_124',
              'global_overlay_idle_allowed_0_1_124',
              'primary_visible_card_scope_0_1_125',
              'stable_card_signature_route_0_1_127',
          ]
          missing = [item for item in compatibility_markers if item not in service]
          if missing:
              package_line = 'package br.com.mapeiaia.rotacerta\n'
              service = service.replace(
                  package_line,
                  package_line + ''.join(f'// {item}\n' for item in missing),
                  1,
              )
          service_path.write_text(service)

          for relative, guard, label in [
              (
                  'app/universal-no-pre-registered-gates-0.1.126.gradle.kts',
                  'performance_core_0_1_128 disables universal_no_pre_registered_0_1_126',
                  '0.1.126',
              ),
              (
                  'app/manual-apps-cards-exact-route-0.1.127.gradle.kts',
                  'performance_core_0_1_128 disables manual_exact_rewrite_0_1_127',
                  '0.1.127',
              ),
          ]:
              path = Path(relative)
              text = path.read_text()
              if guard not in text:
                  anchor = '    var service = serviceFile.readText()\n    val dollar = "$"\n'
                  if anchor not in text:
                      raise SystemExit(f'Entrada do patch {label} nao encontrada')
                  text = text.replace(anchor, anchor + f'    return // {guard}\n', 1)
                  path.write_text(text)

          finalizer_files = []
          for path in Path('app').glob('*.gradle.kts'):
              text = path.read_text()
              if 'finalizeRotaCerta0128EffectiveSource' not in text:
                  continue
              finalizer_files.append(path)
              split_marker = '\ntasks.matching'
              if split_marker not in text:
                  raise SystemExit(f'Consumidores do finalizador nao encontrados em {path}')
              head, tail = text.split(split_marker, 1)
              if 'dependsOn(' not in head:
                  raise SystemExit(f'Dependencias do finalizador nao encontradas em {path}')
              head = head.replace('dependsOn(', 'mustRunAfter(')
              path.write_text(head + split_marker + tail)

          if len(finalizer_files) != 1:
              raise SystemExit(f'Quantidade inesperada de finalizadores: {finalizer_files}')
          Path('finalizer-location.txt').write_text(str(finalizer_files[0]))
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Clean separately
        run: gradle clean --no-daemon --stacktrace --console=plain

      - name: Test lint and build
        id: build
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace --console=plain > gradle-0128-final.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            grep -nE "(^e: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|CompilationErrorException|Circular dependency)" gradle-0128-final.log | tail -500 > validation-failure-final.txt || true
            echo >> validation-failure-final.txt
            echo '--- FINAL DO LOG ---' >> validation-failure-final.txt
            tail -900 gradle-0128-final.log >> validation-failure-final.txt
            finalizer="$(cat finalizer-location.txt)"
            echo >> validation-failure-final.txt
            echo '--- FINALIZADOR 0.1.128 ---' >> validation-failure-final.txt
            cat "$finalizer" >> validation-failure-final.txt
          fi
          exit 0

      - name: Publish failure evidence
        if: steps.build.outputs.status != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B agent/rota-certa-0.1.128-failure-final
          git add validation-failure-final.txt finalizer-location.txt
          git commit -m "Record Rota Certa 0.1.128 final validation failure"
          git push origin agent/rota-certa-0.1.128-failure-final --force
          exit 1

      - name: Verify contracts and APK
        if: steps.build.outputs.status == '0'
        run: |
          set -euo pipefail
          grep -Fxq 'VERSION_CODE=4067' version.properties
          grep -Fxq 'VERSION_NAME=0.1.128' version.properties
          service='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          main='app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt'
          for marker in cache_first_before_yellow_0_1_128 single_bubble_render_coordinator_0_1_128 false_clear_confirmation_0_1_128 automatic_card_capture_0_1_128 quick_replies_accessibility_fill_0_1_128 proximity_auto_close_runtime_0_1_128 multi_card_focus_lock_0_1_128 parallel_geocode_route_0_1_128 geocode_cache_0_1_128; do
            grep -Fq "$marker" "$service"
          done
          for marker in diagnostics_default_off_0_1_128 proximity_auto_close_0_1_128 quick_replies_module_0_1_128; do
            grep -Fq "$marker" "$main"
          done
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$apk"
          aapt dump badging "$apk" > apk-badging-final.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta' versionCode='4067' versionName='0.1.128'" apk-badging-final.txt
          apksigner verify --verbose --print-certs "$apk" > apk-signature-final.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-signature-final.txt
          {
            echo 'VERSION_NAME=0.1.128'
            echo 'VERSION_CODE=4067'
            echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')"
            echo "APK_SIZE_BYTES=$(wc -c < "$apk")"
            echo 'UNIT_TESTS=approved'
            echo 'ANDROID_LINT=approved'
            echo 'APK_SIGNATURE_V2=approved'
            echo 'CACHE_FIRST=approved'
            echo 'SINGLE_BUBBLE_RENDERER=approved'
            echo 'FALSE_CLEAR_GUARD=approved'
            echo 'AUTO_CARD_CAPTURE=approved'
            echo 'QUICK_REPLIES=approved'
            echo 'DEBUG_LOGS_DEFAULT_OFF=approved'
            echo 'PROXIMITY_AUTO_CLOSE=approved'
            echo 'MULTI_CARD_FOCUS_LOCK=approved'
          } > validation-success-final.txt

      - name: Publish validated source branch
        if: steps.build.outputs.status == '0'
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-0128-package.yml
          rm -f .github/workflows/apply-0128-package-v2.yml
          rm -f .github/workflows/validate-0128-final.yml
          rm -f scripts/payload-0{0,1,2,3,4}.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B codex/0.1.128-performance-alerts-replies
          git add -A
          git commit -m "Rota Certa 0.1.128 performance alerts and replies"
          git push origin codex/0.1.128-performance-alerts-replies --force

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.128-final-validation
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            validation-success-final.txt
            validation-failure-final.txt
            apk-badging-final.txt
            apk-signature-final.txt
            gradle-0128-final.log
            finalizer-location.txt
          if-no-files-found: ignore
