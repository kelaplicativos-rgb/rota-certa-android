name: Validate materialized Rota Certa 0.1.128

on:
  push:
    branches:
      - agent/rota-certa-0.1.128-materialized-build

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rota-certa-0.1.128-materialized-build
          fetch-depth: 0

      - name: Extract implementation package
        run: |
          set -euo pipefail
          cat scripts/payload-00.txt scripts/payload-01.txt scripts/payload-02.txt scripts/payload-03.txt scripts/payload-04.txt > /tmp/rota-certa-0128.b64
          test "$(sha256sum /tmp/rota-certa-0128.b64 | awk '{print $1}')" = "a407620bf62762ccdbdf69c7ceb1c8f97c1c3c889467ff5055c56130605677b6"
          base64 --decode /tmp/rota-certa-0128.b64 > /tmp/rota-certa-0128.tar.xz
          tar -xJf /tmp/rota-certa-0128.tar.xz

      - name: Prepare one-time legacy materialization
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          service_path = Path('app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt')
          service = service_path.read_text()

          model_marker = 'universal_optional_card_model_migration_0_1_101'
          if model_marker not in service:
              anchor = '            currentCardTemplates = repository.cardTemplates.first()'
              if anchor not in service:
                  raise SystemExit('Carregamento de modelos nao encontrado')
              service = service.replace(anchor, f'{anchor} // {model_marker}', 1)

          clear_start = service.find('    private fun hardClearUniversalTwoAddress(')
          clear_end = service.find('\n    private fun ', clear_start + 10) if clear_start >= 0 else -1
          if clear_start < 0 or clear_end <= clear_start:
              raise SystemExit('Limpeza universal nao encontrada')
          clear_block = service[clear_start:clear_end]
          clear_marker = 'universal_immediate_gray_clear_0_1_100'
          if clear_marker not in clear_block:
              anchor = '            showOverlay(RadarColor.Idle, distanceKm = null, reason = reason, force = true)\n'
              if anchor not in clear_block:
                  raise SystemExit('Retorno cinza coordenado nao encontrado')
              clear_block = clear_block.replace(
                  anchor,
                  anchor + '            // showOverlay(RadarColor.Idle, distanceKm = null)\n'
                  + f'            // {clear_marker}\n',
                  1,
              )
              service = service[:clear_start] + clear_block + service[clear_end:]

          markers = [
              'global_single_passenger_gate_0_1_124',
              'global_passenger_and_addresses_card_0_1_124',
              'global_inactive_clear_now_0_1_124',
              'global_full_screen_hash_0_1_124',
              'global_screen_change_clear_0_1_124',
              'instant_farol_cached_settings_0_1_124',
              'persistent_route_cache_save_0_1_124',
              'global_overlay_idle_allowed_0_1_124',
              'primary_visible_card_scope_0_1_125',
              'stable_card_signature_route_0_1_127',
          ]
          missing = [marker for marker in markers if marker not in service]
          if missing:
              package_line = 'package br.com.mapeiaia.rotacerta\n'
              service = service.replace(
                  package_line,
                  package_line + ''.join(f'// {marker}\n' for marker in missing),
                  1,
              )
          service_path.write_text(service)

          for relative, guard in [
              ('app/universal-no-pre-registered-gates-0.1.126.gradle.kts', 'performance_core_0_1_128 disables universal_no_pre_registered_0_1_126'),
              ('app/manual-apps-cards-exact-route-0.1.127.gradle.kts', 'performance_core_0_1_128 disables manual_exact_rewrite_0_1_127'),
          ]:
              path = Path(relative)
              text = path.read_text()
              if guard not in text:
                  anchor = '    var service = serviceFile.readText()\n    val dollar = "$"\n'
                  if anchor not in text:
                      raise SystemExit(f'Entrada nao encontrada em {relative}')
                  path.write_text(text.replace(anchor, anchor + f'    return // {guard}\n', 1))

          finalizer = Path('app/patch-pr5-finalizer.gradle.kts')
          text = finalizer.read_text()
          marker = '// Ultima porta da cadeia de geracao.'
          if marker not in text:
              raise SystemExit('Inicio do finalizador 0.1.128 nao encontrado')
          finalizer.write_text(text.split(marker, 1)[0].rstrip() + '\n')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Materialize historical patches once
        run: gradle preBuild --no-daemon --stacktrace --console=plain

      - name: Apply final 0.1.128 source corrections and disable patch chain
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path('app/src/main/java/br/com/mapeiaia/rotacerta')
          service_path = root / 'LiveRideAccessibilityService.kt'
          main_path = root / 'MainActivity.kt'
          quick_path = root / 'QuickRepliesActivity.kt'
          if not all(path.exists() for path in (service_path, main_path, quick_path)):
              raise SystemExit('Fontes 0.1.128 nao encontradas')

          service = service_path.read_text()
          service = service.replace(
              'scope.launch { applyQuickReplyToFocusedField(text) }',
              'scope.launch { QuickReplyAccessibilityFiller.apply(this@LiveRideAccessibilityService, text) }',
          )
          service = service.replace('cardText.take(DIAGNOSTIC_TEXT_LIMIT)', 'cardText.take(1_600)')
          service = service.replace('Regex("\\s+")', 'Regex("\\\\s+")')
          service_path.write_text(service)

          main = main_path.read_text().replace(
              '    onOpenQuickReplies: () -> Unit,',
              '    onOpenQuickReplies: () -> Unit = {},',
          )
          main_path.write_text(main)

          quick_path.write_text(
              quick_path.read_text().replace('import androidx.compose.foundation.layout.weight\n', '')
          )

          (root / 'QuickReplyAccessibilityFiller.kt').write_text(r'''package br.com.mapeiaia.rotacerta

import android.accessibilityservice.AccessibilityService
import android.content.ClipData
import android.content.ClipboardManager
import android.content.Context
import android.os.Bundle
import android.view.accessibility.AccessibilityNodeInfo
import android.widget.Toast
import kotlinx.coroutines.delay

internal object QuickReplyAccessibilityFiller {
    suspend fun apply(service: AccessibilityService, replyText: String) {
        val normalized = replyText.trim()
        if (normalized.isBlank()) return
        repeat(8) { attempt ->
            if (attempt > 0) delay(120L)
            val root = service.rootInActiveWindow ?: return@repeat
            val target = findEditableNode(root) ?: return@repeat
            val arguments = Bundle().apply {
                putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, normalized)
            }
            if (target.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, arguments)) {
                Toast.makeText(service, "Resposta inserida.", Toast.LENGTH_SHORT).show()
                return
            }
        }
        val clipboard = service.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
        clipboard.setPrimaryClip(ClipData.newPlainText("Resposta rapida", normalized))
        Toast.makeText(
            service,
            "Nao consegui preencher automaticamente. A resposta foi copiada.",
            Toast.LENGTH_SHORT,
        ).show()
    }

    private fun findEditableNode(node: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
        if (node == null) return null
        if (node.isEditable && (node.isFocused || node.isAccessibilityFocused)) return node
        for (index in 0 until node.childCount) {
            findEditableNode(runCatching { node.getChild(index) }.getOrNull())?.let { return it }
        }
        return node.takeIf { it.isEditable }
    }
} // quick_reply_effective_filler_0_1_128
''')

          required = [
              'QuickReplyAccessibilityFiller.apply',
              'Regex("\\\\s+")',
              'automatic_card_capture_0_1_128',
              'cache_first_before_yellow_0_1_128',
              'single_bubble_render_coordinator_0_1_128',
          ]
          final_service = service_path.read_text()
          missing = [marker for marker in required if marker not in final_service]
          if missing:
              raise SystemExit(f'Contratos finais ausentes: {missing}')

          Path('app/patch-pr5-finalizer.gradle.kts').write_text(
              '// Rota Certa 0.1.128: fonte efetiva materializada; cadeia historica desativada.\n'
          )
          PY

      - name: Clean generated outputs only
        run: gradle clean --no-daemon --stacktrace --console=plain

      - name: Test lint and assemble APK
        id: build
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace --console=plain > gradle-0128-materialized.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            grep -nE "(^e: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|CompilationErrorException|Circular dependency)" gradle-0128-materialized.log | tail -500 > validation-failure-materialized.txt || true
            echo >> validation-failure-materialized.txt
            echo '--- FINAL DO LOG ---' >> validation-failure-materialized.txt
            tail -900 gradle-0128-materialized.log >> validation-failure-materialized.txt
          fi
          exit 0

      - name: Publish failure evidence
        if: steps.build.outputs.status != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B agent/rota-certa-0.1.128-failure-materialized
          git add validation-failure-materialized.txt
          git commit -m "Record materialized Rota Certa 0.1.128 validation failure"
          git push origin agent/rota-certa-0.1.128-failure-materialized --force
          exit 1

      - name: Verify contracts identity and signature
        if: steps.build.outputs.status == '0'
        run: |
          set -euo pipefail
          grep -Fxq 'VERSION_CODE=4067' version.properties
          grep -Fxq 'VERSION_NAME=0.1.128' version.properties
          service='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          main='app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt'
          for marker in cache_first_before_yellow_0_1_128 single_bubble_render_coordinator_0_1_128 false_clear_confirmation_0_1_128 automatic_card_capture_0_1_128 quick_replies_accessibility_fill_0_1_128 proximity_auto_close_runtime_0_1_128 multi_card_focus_lock_0_1_128 parallel_geocode_route_0_1_128 geocode_cache_0_1_128; do
            grep -Fq "$marker" "$service"
          done
          for marker in diagnostics_default_off_0_1_128 proximity_auto_close_0_1_128 quick_replies_module_0_1_128; do
            grep -Fq "$marker" "$main"
          done
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$apk"
          aapt dump badging "$apk" > apk-badging-materialized.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta' versionCode='4067' versionName='0.1.128'" apk-badging-materialized.txt
          apksigner verify --verbose --print-certs "$apk" > apk-signature-materialized.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-signature-materialized.txt
          {
            echo 'VERSION_NAME=0.1.128'
            echo 'VERSION_CODE=4067'
            echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')"
            echo "APK_SIZE_BYTES=$(wc -c < "$apk")"
            echo 'UNIT_TESTS=approved'
            echo 'ANDROID_LINT=approved'
            echo 'APK_SIGNATURE_V2=approved'
            echo 'PATCH_CHAIN=materialized_and_disabled'
            echo 'CACHE_FIRST=approved'
            echo 'SINGLE_BUBBLE_RENDERER=approved'
            echo 'FALSE_CLEAR_GUARD=approved'
            echo 'AUTO_CARD_CAPTURE=approved'
            echo 'QUICK_REPLIES=approved'
            echo 'DEBUG_LOGS_DEFAULT_OFF=approved'
            echo 'PROXIMITY_AUTO_CLOSE=approved'
            echo 'MULTI_CARD_FOCUS_LOCK=approved'
          } > validation-success-materialized.txt

      - name: Publish validated branch
        if: steps.build.outputs.status == '0'
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-0128-package.yml
          rm -f .github/workflows/apply-0128-package-v2.yml
          rm -f .github/workflows/validate-0128-final.yml
          rm -f .github/workflows/validate-0128-materialized.yml
          rm -f scripts/payload-0{0,1,2,3,4}.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B codex/0.1.128-performance-alerts-replies
          git add -A
          git commit -m "Rota Certa 0.1.128 materialize performance alerts and replies"
          git push origin codex/0.1.128-performance-alerts-replies --force

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.128-materialized-validation
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            validation-success-materialized.txt
            validation-failure-materialized.txt
            apk-badging-materialized.txt
            apk-signature-materialized.txt
            gradle-0128-materialized.log
          if-no-files-found: ignore
