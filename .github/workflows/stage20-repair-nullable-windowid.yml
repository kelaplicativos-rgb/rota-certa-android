name: Repair Stage20 nullable window IDs

on:
  push:
    branches:
      - agent/stage20-forensic-causality-0.1.201
    paths:
      - .github/workflows/stage20-repair-nullable-windowid.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make both diagnostic window IDs non-null
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_farol_forensic_causality_stage20.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'runCatching { event.windowId }.getOrDefault(0)': 'runCatching { event.windowId }.getOrNull() ?: 0',
              'runCatching { rootInActiveWindow?.windowId }.getOrDefault(0)': 'runCatching { rootInActiveWindow?.windowId }.getOrNull() ?: 0',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one {old!r}, found {count}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile scripts/apply_farol_forensic_causality_stage20.py
          python3 scripts/apply_farol_forensic_causality_stage20.py --self-test
          grep -Fq 'runCatching { event.windowId }.getOrNull() ?: 0' scripts/apply_farol_forensic_causality_stage20.py
          grep -Fq 'runCatching { rootInActiveWindow?.windowId }.getOrNull() ?: 0' scripts/apply_farol_forensic_causality_stage20.py
          git rm .github/workflows/stage20-repair-nullable-windowid.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply_farol_forensic_causality_stage20.py
          git commit -m 'Fix Stage20 nullable window ID probes'
          git push origin HEAD:agent/stage20-forensic-causality-0.1.201
