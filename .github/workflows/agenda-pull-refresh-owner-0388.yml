name: Agenda pull refresh owner 0.1.388

on:
  pull_request:
    branches:
      - agent/agenda-trip-outbox-0.1.387
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-pull-refresh-owner-0388-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/agenda-pull-refresh-owner-0.1.388'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: agenda_pull_refresh_ci_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record source identity version and protected FAROL
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref || github.ref_name }}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s\n' "$SOURCE_SHA" | tee source_head.txt
          printf '%s\n' "$SOURCE_BRANCH" | tee source_branch.txt
          echo "ROTA_CERTA_GIT_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_BRANCH=$SOURCE_BRANCH" >> "$GITHUB_ENV"

          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          test -s "$FAROL"
          sha256sum "$FAROL" | tee farol-before.sha256
          awk '{print $1}' farol-before.sha256 > farol-head.sha256
          grep -Fxq '884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a' farol-head.sha256

          git fetch origin agent/agenda-trip-outbox-0.1.387 --depth=1
          git show FETCH_HEAD:"$FAROL" | sha256sum | awk '{print $1}' > farol-base.sha256
          cmp -s farol-base.sha256 farol-head.sha256

          grep -Fq 'versionCode = 5681' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.388"' app/build.gradle.kts

      - name: Prove gesture ownership and deterministic-sync boundaries
        shell: bash
        run: |
          set -euo pipefail
          ACTIVITY='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt'
          TIMELINE='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt'
          GESTURE='app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaPullRefreshGesture0388.kt'
          OUTBOX='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripPublicationOutbox0387.kt'

          ! grep -Fq 'PullToRefreshBox(' "$ACTIVITY"
          ! grep -Fq 'PullToRefreshBox(' "$TIMELINE"
          grep -Fq 'TimelineRefreshGestureSurface0388(' "$ACTIVITY"
          grep -Fq 'onRefresh = requestFullTimelineRefresh' "$ACTIVITY"
          grep -Fq 'shouldStartAgendaFullRefresh0388(screen == TripScreen.TIMELINE, refreshAllRunning)' "$ACTIVITY"
          grep -Fq 'AGENDA_PULL_GESTURE_RECOGNIZED' "$ACTIVITY"
          grep -Fq 'state = listState' "$TIMELINE"
          grep -Fq 'PointerEventPass.Initial' "$GESTURE"
          grep -Fq 'touchSlop' "$GESTURE"
          grep -Fq 'BLOCKED_NOT_AT_TOP' "$GESTURE"
          grep -Fq 'BLOCKED_REFRESH_RUNNING' "$GESTURE"
          grep -Fq 'change.consume()' "$GESTURE"
          grep -Fq 'latestOnRefresh()' "$GESTURE"
          grep -Fq 'TripMutationCoordinator0387' "$OUTBOX"
          test "$(grep -Foc 'publicAgendaSyncRevision++' "$ACTIVITY")" -eq 1
          grep -Fq 'USER_SYNC_ALL' "$ACTIVITY"
          grep -Fq 'AGENDA_PULL_REFRESH_ALL_REQUESTED' "$ACTIVITY"
          grep -Fq 'timeline_pull_requested' "$ACTIVITY"
          grep -Fq 'TIMELINE_PUBLIC_BOOKING_RECONCILE_START' "$ACTIVITY"
          grep -Fq 'timeline_pull_dispatch_complete' "$ACTIVITY"

          git diff --name-only FETCH_HEAD...HEAD | tee changed-files.txt
          ! grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt' changed-files.txt
          ! grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerAdminUi.kt' changed-files.txt

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Run pull owner unit and retained Agenda regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaPullRefreshGesture0388Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaTouchUnfreeze0383Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaPassengerMainThread0384Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaSyncPanelScroll0385Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaSilentPublicSync0386Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaDeterministicTripOutbox0387Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaFailureEvidence0382Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaFailureEvidence0381Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaPerformance0380Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PublicAgendaIncrementalAvailability0375Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PublicAgendaSyncRegression0373Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PublicBooking0296Test'             --tests 'br.com.mapeiaia.rotacerta.trips.ReservationApproval0356Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PassengerOperationalStatus0350Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BookingExternalSeatSync0353Test'             --tests 'br.com.mapeiaia.rotacerta.trips.TripInventorySourceTruth0374Test'             --tests 'br.com.mapeiaia.rotacerta.TenantStorageFoundation0252Test'             --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Run Compose real-touch pull regression on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=1 --no-parallel --stacktrace
            APP_APK=app/build/outputs/apk/debug/app-debug.apk
            TEST_APK=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            test -s "$APP_APK"
            test -s "$TEST_APK"
            adb install -r "$APP_APK"
            adb install -r "$TEST_APK"
            adb shell pm list instrumentation | tee instrumentation-list.txt
            grep -Fq 'br.com.mapeiaia.rotacerta.test/androidx.test.runner.AndroidJUnitRunner' instrumentation-list.txt
            adb logcat -c
            set +e
            adb shell am instrument -w -r               -e class br.com.mapeiaia.rotacerta.trips.AgendaPullRefreshGesture0388InstrumentedTest               br.com.mapeiaia.rotacerta.test/androidx.test.runner.AndroidJUnitRunner               | tee instrumentation-output.txt
            STATUS=${PIPESTATUS[0]}
            adb logcat -d -v threadtime '*:W' | tee instrumentation-logcat.txt || true
            set -e
            test "$STATUS" -eq 0
            grep -Fq 'OK (9 tests)' instrumentation-output.txt

      - name: Lint Android app
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:lintDebug --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Assemble installable debug APK directly from app source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify final source FAROL and APK identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat source_head.txt)"
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          sha256sum "$FAROL" | tee farol-after.sha256
          cmp -s farol-before.sha256 farol-after.sha256
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk.sha256
          grep -E 'version(Code|Name) = ' app/build.gradle.kts | tee app-version.txt
          git diff --stat FETCH_HEAD...HEAD | tee source-diff-stat.txt
          if git status --porcelain --untracked-files=no | grep -q .; then
            echo "Tracked source changed during validation" >&2
            git status --short
            exit 1
          fi

      - name: Upload APK and pull-refresh audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.388-agenda-pull-refresh-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            source_head.txt
            source_branch.txt
            app-version.txt
            farol-base.sha256
            farol-head.sha256
            farol-before.sha256
            farol-after.sha256
            apk.sha256
            changed-files.txt
            source-diff-stat.txt
            instrumentation-list.txt
            instrumentation-output.txt
            instrumentation-logcat.txt
