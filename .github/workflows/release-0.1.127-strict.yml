name: Release 0.1.127 Strict

on:
  workflow_dispatch:
  push:
    branches:
      - codex/rota-certa-0.1.127-strict-final
    paths:
      - 'app/**'
      - '.github/workflows/release-0.1.127-strict.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/release-0.1.127-strict.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

concurrency:
  group: release-0127-strict-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Test, build, publish and verify 0.1.127
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'codex/rota-certa-0.1.127-strict-final')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepare monotonic version
        run: |
          set -euo pipefail
          gradle_run_number="$((5000 + GITHUB_RUN_NUMBER))"
          expected_version_code="$((1000 + gradle_run_number))"
          echo "GRADLE_RUN_NUMBER=$gradle_run_number" >> "$GITHUB_ENV"
          echo "EXPECTED_VERSION_CODE=$expected_version_code" >> "$GITHUB_ENV"

      - name: Run unit tests on clean sources
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          GITHUB_RUN_NUMBER="$GRADLE_RUN_NUMBER" gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Restore exact sources before APK build
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA"
          git clean -fd app/src
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Build exact APK from fresh sources
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          GITHUB_RUN_NUMBER="$GRADLE_RUN_NUMBER" gradle clean assembleDebug --no-daemon --stacktrace --console=plain

      - name: Validate generated strict contract
        run: |
          set -euo pipefail
          service="app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt"
          main="app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt"
          store="app/src/main/java/br/com/mapeiaia/rotacerta/SelectedRideAppStore.kt"
          maps="app/src/main/java/br/com/mapeiaia/rotacerta/GoogleMapsService.kt"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          metadata="app/build/outputs/apk/debug/output-metadata.json"

          test -f "$apk"
          test -f "$metadata"

          python3 - "$metadata" "$EXPECTED_VERSION_CODE" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          element = data['elements'][0]
          actual = int(element['versionCode'])
          expected = int(sys.argv[2])
          if actual != expected:
              raise SystemExit(f'versionCode incorreto: atual={actual} esperado={expected}')
          if element['versionName'] != '0.1.127':
              raise SystemExit(f"versionName incorreto: {element['versionName']}")
          Path('version-name.txt').write_text(element['versionName'])
          Path('version-code.txt').write_text(str(actual))
          PY

          grep -Fq 'manual_selection_no_legacy_fallback_0_1_127' "$store"
          grep -Fq 'SelectedRideAppStore.save(applicationContext, emptySet())' "$service"
          grep -Fq 'manual_selected_apps_gate_0_1_127' "$service"
          grep -Fq 'normalized in selectedPackages' "$service"
          grep -Fq 'Nenhum aplicativo vem marcado' "$main"
          grep -Fq 'Buscar aplicativos instalados' "$main"

          grep -Fq 'manual_registered_card_required_migration_0_1_127' "$service"
          grep -Fq 'manual_registered_card_gate_0_1_127' "$service"
          grep -Fq 'templates = packageCardTemplates' "$service"
          grep -Fq 'manual.card.gate accepted=false reason=no_template' "$service"
          grep -Fq 'manual.card.gate accepted=false reason=no_match' "$service"
          grep -Fq 'manual.card.gate accepted=true' "$service"
          grep -Fq 'manual_registered_card_freshness_0_1_127' "$service"
          grep -Fq 'Modelos de cards obrigatorios' "$main"
          grep -Fq 'Nenhum modelo nasce cadastrado' "$main"
          grep -Fq 'Anexar modelos de cards (prints)' "$main"

          grep -Fq 'saved_places_search_name_address_0_1_127' "$main"
          grep -Fq 'Buscar por nome ou endereco' "$main"
          grep -Fq 'place.name.lowercase(Locale.ROOT).contains(query)' "$main"
          grep -Fq 'place.address.lowercase(Locale.ROOT).contains(query)' "$main"
          grep -Fq 'Text("GPS")' "$main"
          grep -Fq 'Text("Salvar")' "$main"
          grep -Fq 'Text("Apagar")' "$main"

          grep -Fq 'const val SCAN_LOOP_MS = 350L' "$service"
          grep -Fq 'internal fun geocodeQueries' "$maps"
          grep -Fq 'containsExplicitLocality' "$maps"
          grep -Fq 'compile_final_cleanup_0_1_127' "$main"

          if grep -Fq 'const val SCAN_LOOP_MS = 120L' "$service"; then
            echo 'ERRO: polling de 120 ms voltou.'
            exit 1
          fi
          if grep -Fq 'removedTemplates126.forEach' "$service"; then
            echo 'ERRO: modelos ainda sao apagados na inicializacao.'
            exit 1
          fi
          if grep -Fq 'defaultCity' "$maps" || grep -Fq 'São Paulo - SP, $country' "$maps"; then
            echo 'ERRO: geocodificacao voltou a inventar Sao Paulo.'
            exit 1
          fi
          if grep -Pzo '@Composable\s*\n@Composable\s*\n' "$main" >/dev/null; then
            echo 'ERRO: @Composable duplicado.'
            exit 1
          fi

          tmp_dir="$(mktemp -d)"
          unzip -q "$apk" 'classes*.dex' -d "$tmp_dir"
          strings "$tmp_dir"/classes*.dex > apk-strings.txt
          for expected in \
            "Buscar aplicativos instalados" \
            "Nenhum aplicativo vem marcado" \
            "Modelos de cards obrigatorios" \
            "Anexar modelos de cards (prints)" \
            "Buscar por nome ou endereco" \
            "Nenhum local encontrado por nome ou endereco" \
            "manual.card.gate accepted=false reason=no_template" \
            "manual.card.gate accepted=false reason=no_match" \
            "manual.card.gate accepted=true" \
            "adaptive_fallback_scan_0_1_127" \
            "saved_places_search_name_address_0_1_127"
          do
            grep -Fq -- "$expected" apk-strings.txt
          done

          cp "$apk" rota-certa-stable-debug.apk
          sha256sum rota-certa-stable-debug.apk > rota-certa-stable-debug.apk.sha256
          wc -c < rota-certa-stable-debug.apk > apk-size.txt

          cat > strict-validation.txt <<'EOF'
          VERSION=0.1.127
          MANUAL_APP_SELECTION=required
          PRESELECTED_APPS=0
          REGISTERED_CARD_MODEL=required
          SAME_PACKAGE_MODEL_MATCH=required
          ROUTE_WITHOUT_MODEL=blocked
          SAVED_PLACES_SEARCH=name_and_address
          SAVED_PLACE_ACTIONS=edit_delete_gps
          FALLBACK_SCAN_INTERVAL_MS=350
          HARDCODED_SAO_PAULO_GEOCODING=removed
          DUPLICATE_COMPOSABLE=removed
          TEST_AND_APK_SOURCE_TREES=isolated_clean
          EOF

      - name: Publish stable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="rota-certa-stable-debug"
          version_name="$(cat version-name.txt)"
          version_code="$(cat version-code.txt)"
          apk_sha="$(awk '{print $1}' rota-certa-stable-debug.apk.sha256)"
          apk_size="$(cat apk-size.txt)"

          cat > release-notes.md <<EOF
          Rota Certa Stable Debug APK

          Version: ${version_name}
          VersionCode: ${version_code}
          Commit: ${TARGET_SHA}
          APK SHA-256: ${apk_sha}
          APK size: ${apk_size} bytes

          0.1.127:
          - Instalacao sem aplicativos de corrida selecionados.
          - Leitura, screenshot e OCR somente no aplicativo escolhido manualmente.
          - Nenhum modelo de card pre-cadastrado.
          - Card cadastrado do mesmo aplicativo obrigatorio para rota, verde ou vermelho.
          - Busca de Locais salvos e Alertas por nome ou endereco.
          - Resultado localizado pode ser editado, apagado ou aberto no GPS.
          - Geocodificacao sem tendencia fixa para Sao Paulo.
          - Ciclo de seguranca em 350 ms, mantendo eventos de acessibilidade imediatos.
          - Fontes finais sem anotacoes Compose duplicadas.
          - Testes e APK construidos em arvores de fonte limpas e independentes.
          EOF
          cat strict-validation.txt >> release-notes.md

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Rota Certa Stable Debug" --notes-file release-notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --title "Rota Certa Stable Debug" --notes-file release-notes.md
          fi
          gh release upload "$tag" rota-certa-stable-debug.apk rota-certa-stable-debug.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify published bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download rota-certa-stable-debug \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'rota-certa-stable-debug.apk' \
            --dir published \
            --clobber
          cmp --silent rota-certa-stable-debug.apk published/rota-certa-stable-debug.apk
          local_sha="$(sha256sum rota-certa-stable-debug.apk | awk '{print $1}')"
          published_sha="$(sha256sum published/rota-certa-stable-debug.apk | awk '{print $1}')"
          test "$local_sha" = "$published_sha"

          cat > publication-proof.txt <<EOF
          STABLE_RELEASE=approved
          VERSION_NAME=$(cat version-name.txt)
          VERSION_CODE=$(cat version-code.txt)
          COMMIT=${TARGET_SHA}
          APK_SHA256=${published_sha}
          APK_SIZE_BYTES=$(wc -c < published/rota-certa-stable-debug.apk)
          DOWNLOAD_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/rota-certa-stable-debug/rota-certa-stable-debug.apk
          EOF
          cat publication-proof.txt

      - name: Upload proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: release-0.1.127-strict-proof
          path: |
            published/rota-certa-stable-debug.apk
            rota-certa-stable-debug.apk.sha256
            strict-validation.txt
            release-notes.md
            publication-proof.txt
          if-no-files-found: error
