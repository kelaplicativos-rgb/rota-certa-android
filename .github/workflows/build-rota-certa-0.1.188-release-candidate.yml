name: Build Rota Certa 0.1.188 release candidate

on:
  pull_request:
    branches: [agent/fix-farol-runtime-0.1.187]
    paths:
      - .github/workflows/build-rota-certa-0.1.188-release-candidate.yml
      - scripts/build_rota_certa_0188_canonical.sh
      - scripts/harden_farol_real_device_0188.py
      - scripts/build_rota_certa_0188.sh
      - scripts/verify_farol_real_device_0188.py
      - patches/farol-real-device-0188.patch.gz.b64
      - docs/REAL_DEVICE_FAILURE_0187.md
  workflow_dispatch:

concurrency:
  group: rota-certa-0.1.188-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Verify protected source commit
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42"

      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
          path: patches

      - name: Verify cumulative patch commit
        working-directory: patches
        env:
          EXPECTED_PATCH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_PATCH_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and validate release candidate
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-0188-candidate
        run: |
          set -o pipefail
          bash ../patches/scripts/build_rota_certa_0188_canonical.sh ../patches 2>&1 | tee build-0.1.188-candidate.log

      - name: Upload failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.188-release-candidate-failure
          path: |
            source/build-0.1.188-candidate.log
            source/app/build/reports/tests/
            source/app/build/reports/lint-results-debug.html
          retention-days: 30
          if-no-files-found: warn

      - name: Upload validated CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.188-release-candidate
          path: source/artifact-0.1.188/
          retention-days: 90
          if-no-files-found: error

      - name: Publish isolated prerelease candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          APK_SOURCE='source/artifact-0.1.188/rota-certa-0.1.188-farol-real-device-validado-em-ci.apk'
          APK_CANDIDATE="${RUNNER_TEMP}/rota-certa-0.1.188-candidate.apk"
          cp "$APK_SOURCE" "$APK_CANDIDATE"
          EXPECTED_SHA="$(awk '{print $1}' source/artifact-0.1.188/sha256.txt)"
          ACTUAL_SHA="$(sha256sum "$APK_CANDIDATE" | awk '{print $1}')"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          TEST_COUNT="$(awk -F= '/^tests=/{print $2}' source/artifact-0.1.188/test-count.txt)"
          cat > "${RUNNER_TEMP}/candidate-notes.md" <<NOTES
          Rota Certa 0.1.188 — candidato de teste em aparelho

          Esta é uma prévia isolada. Não substitui o link permanente e não está aprovada para uso normal.

          - pacote: br.com.mapeiaia.rotacerta
          - versão: 0.1.188
          - versionCode: 5472
          - head validado em CI: ${VALIDATED_HEAD}
          - testes: ${TEST_COUNT}; falhas: 0
          - Android Lint: aprovado
          - clean assembleDebug: aprovado
          - assinatura APK v2: conferida
          - SHA-256: ${ACTUAL_SHA}

          Objetivo do teste físico: bloquear decisões sem card atual, capturar cards e pop-ups por janela/subárvore, preservar caixas do OCR, impedir mistura entre cards e usar somente o destino final confirmado.
          NOTES
          if gh release view ci-0.1.188 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete ci-0.1.188 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create ci-0.1.188 "$APK_CANDIDATE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VALIDATED_HEAD" \
            --title 'Rota Certa 0.1.188 — candidato de teste' \
            --notes-file "${RUNNER_TEMP}/candidate-notes.md" \
            --prerelease

      - name: Verify public candidate byte for byte
        run: |
          set -euo pipefail
          URL='https://github.com/kelaplicativos-rgb/rota-certa-android/releases/download/ci-0.1.188/rota-certa-0.1.188-candidate.apk'
          curl --fail --location --retry 6 --retry-all-errors --output downloaded-candidate.apk "$URL"
          test "$(sha256sum downloaded-candidate.apk | awk '{print $1}')" = "$(awk '{print $1}' source/artifact-0.1.188/sha256.txt)"

      - name: Register evidence, retire superseded workflows and comment PR
        if: success() && github.event_name == 'pull_request'
        working-directory: patches
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          VALIDATED_HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          TEST_COUNT="$(awk -F= '/^tests=/{print $2}' ../source/artifact-0.1.188/test-count.txt)"
          APK_SHA="$(awk '{print $1}' ../source/artifact-0.1.188/sha256.txt)"
          APK_SIZE="$(stat -c%s ../source/artifact-0.1.188/rota-certa-0.1.188-farol-real-device-validado-em-ci.apk)"
          python3 - "$VALIDATED_HEAD" "$RUN_ID" "$TEST_COUNT" "$APK_SHA" "$APK_SIZE" <<'PY'
          from pathlib import Path
          import sys
          head, run_id, tests, apk_sha, apk_size = sys.argv[1:]
          status_path = Path('docs/PROJECT_STATUS.md')
          decisions_path = Path('docs/DECISIONS.md')
          status = status_path.read_text(encoding='utf-8')
          decisions = decisions_path.read_text(encoding='utf-8')
          status_marker = '<!-- FAROL_0188_CI_PENDING_DEVICE_START -->'
          if status_marker not in status:
              status_path.write_text(f'''{status_marker}
          ## 06/08/2026 — 0.1.188 aprovada em CI, validação física obrigatória pendente

          - **Branch:** `agent/fix-farol-real-device-0.1.188`; **base:** `agent/fix-farol-runtime-0.1.187`.
          - **Head validado em CI:** `{head}`; **workflow run:** `{run_id}`.
          - **Versão:** `0.1.188`; **versionCode:** 5472; **pacote:** `br.com.mapeiaia.rotacerta`.
          - **Reprovação anterior:** a 0.1.187 pintou decisões sem tentativa reconhecida no Samsung SM-S911B/Android 16 e não é funcionalmente aprovada.
          - **Correção:** captura por janela/subárvore, OCR espacial, segmentação de cards e autorização obrigatória antes da rota; a recuperação antiga ficou somente diagnóstica.
          - **Testes CI:** tests={tests}; failures=0; Android Lint e `clean assembleDebug` aprovados.
          - **APK candidato:** `rota-certa-0.1.188-candidate.apk`, {apk_size} bytes; SHA-256 `{apk_sha}`.
          - **Link candidato:** https://github.com/kelaplicativos-rgb/rota-certa-android/releases/download/ci-0.1.188/rota-certa-0.1.188-candidate.apk
          - **Distribuição:** o link permanente não foi substituído; aprovação funcional depende do teste físico completo.
          <!-- FAROL_0188_CI_PENDING_DEVICE_END -->

          ''' + status, encoding='utf-8')
          decision_marker = '<!-- FAROL_0188_DECISION_START -->'
          if decision_marker not in decisions:
              decisions_path.write_text(f'''{decision_marker}
          ## 06/08/2026 — nenhuma rota sem card coerente atual

          - O pacote selecionado autoriza observar, mas nunca autoriza verde ou vermelho sozinho.
          - Acessibilidade e OCR preservam pacote, janela, limites e bloco de origem de cada texto.
          - Dois ou mais endereços só autorizam rota quando pertencem ao mesmo card/modal coerente.
          - O destino final é o último endereço confirmado dentro desse card, nunca o último endereço do texto global da tela.
          - Recuperação, cache, OCR ou modelo não podem criar decisão sem card atual confirmado.
          - Telas passivas, login, segurança, reconhecimento facial, status, documentos e carregamento falham fechado em amarelo, sem quilômetros.
          - Compilação e testes não substituem validação física do farol.
          <!-- FAROL_0188_DECISION_END -->

          ''' + decisions, encoding='utf-8')
          PY
          for superseded in \
            .github/workflows/build-rota-certa-0.1.188.yml \
            .github/workflows/build-rota-certa-0.1.188-final.yml \
            .github/workflows/build-rota-certa-0.1.188-canonical.yml; do
            if [[ -f "$superseded" ]]; then
              git rm "$superseded"
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATUS.md docs/DECISIONS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record 0.1.188 candidate pending device [skip ci]'
            git push origin "HEAD:${HEAD_REF}"
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "CI 0.1.188 concluída no run ${RUN_ID}. Candidato publicado sem substituir latest. SHA-256: ${APK_SHA}. Validação física ainda obrigatória."
