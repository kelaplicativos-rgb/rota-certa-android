name: Rota Certa 0.1.501 Agenda segment vacancies + passenger dots

on:
  push:
    branches:
      - agent/agenda-canonical-passenger-dots-sync-0.1.497
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-segment-vacancy-dots-0501-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GOOGLE_MAPS_API_KEY: agenda_privacy_timeline_firewall_0500_ci_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      BASE_AUTHORITY_SHA: a376f7286a126e03b248d02d1f8bebdee66425d2
      EXPECTED_VERSION_CODE: '5793'
      EXPECTED_VERSION_NAME: '0.1.501'

    steps:
      - name: Checkout exact triggering HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact source lineage and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_HEAD="$(git rev-parse HEAD)"
          test "$SOURCE_HEAD" = "$GITHUB_SHA"
          printf '%s\n' "$SOURCE_HEAD" | tee /tmp/source-head.txt
          printf '%s\n' "$GITHUB_REF_NAME" | tee /tmp/source-branch.txt
          echo "ROTA_CERTA_GIT_SHA=$SOURCE_HEAD" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_BRANCH=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

          grep -Fq "versionCode = $EXPECTED_VERSION_CODE" app/build.gradle.kts
          grep -Fq "versionName = \"$EXPECTED_VERSION_NAME\"" app/build.gradle.kts

          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          git diff --exit-code "$BASE_AUTHORITY_SHA" -- "$FAROL"
          git diff --exit-code "$BASE_AUTHORITY_SHA" -- trip-platform/firebase.json trip-platform/firestore.rules
          git diff --name-only "$BASE_AUTHORITY_SHA"...HEAD | tee /tmp/changed-files.txt
          ! grep -Fxq "$FAROL" /tmp/changed-files.txt
          ! grep -Fxq 'trip-platform/firebase.json' /tmp/changed-files.txt
          ! grep -Fxq 'trip-platform/firestore.rules' /tmp/changed-files.txt

          grep -Fq 'loadCanonicalTimelineState0494' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'BookingRealtimeEvents0356.changes.collect' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'POLL_RECOVERY' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          ! grep -Fq 'BlaBlaTimelineAdapter.merge(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          ! grep -Fq 'TripPhysicalRideConsolidator.consolidate(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          ! grep -Fq 'externalSnapshot' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'CANONICAL_NATIVE_FIREWALL' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripRemoteApi.kt
          grep -Fq 'BLABLACAR_BLOCK_ALL_0500' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripRemoteApi.kt
          grep -Fq 'selectCanonicalTripDocuments0495' trip-platform/functions/index.js
          grep -Fq 'canonicalDepartureStops0495' trip-platform/functions/index.js
          grep -Fq 'LEGACY_TRIP_SUPERSEDED' trip-platform/functions/index.js
          grep -Fq 'TIMELINE_CANONICAL_PASSENGER_MUTATION_0494' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          grep -Fq 'TIMELINE_CANONICAL_PASSENGER_ADD_0494' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripQuickPassengerUi.kt
          grep -Fq 'AGENDA_TIMELINE_CANONICAL_PULL_REFRESH_0499' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'USER_PULL_REFRESH' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'timelineTripHasCollectorProvenance0500' trip-platform/functions/index.js
          grep -Fq 'timelineBookingHasCollectorProvenance0500' trip-platform/functions/index.js
          grep -Fq 'collectorDerivedData: false' trip-platform/functions/index.js
          grep -Fq 'BookingSource.BLABLACAR' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'preserve_capacity_claims_project_canonical' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          sha256sum "$FAROL" | tee /tmp/farol.sha256

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate canonical backend and web contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/public/app.js
          node --check trip-platform/public/minha-area.js
          node --test \
            trip-platform/functions/test/timeline-canonical-backend-0494.test.js \
            trip-platform/functions/test/canonical-invalidation-0495.test.js \
            trip-platform/functions/test/backend-canonical-authority-0468.test.js \
            trip-platform/functions/test/canonical-trips-passenger-area-0491.test.js \
            trip-platform/functions/test/agenda-card-visual-parity-0473.test.js \
            trip-platform/functions/test/agenda-date-year-contract-0482.test.js \
            trip-platform/functions/test/agenda-public-segment-availability-0484.test.js \
            trip-platform/functions/test/agenda-public-read-only-0475.test.js \
            trip-platform/functions/test/agenda-public-timeline-reflection-0425.test.js \
            | tee /tmp/node-tests.log

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi

          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi

          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Run canonical Android regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.TimelineCanonicalBackend0494Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.CanonicalPassengerSegments0491Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalProjectionConvergence0408Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaPublicTimelineReflection0425Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PublicAgendaIncrementalAvailability0375Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PublicAgendaAutoSync0300Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PassengerOperationalStatus0350Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PassengerPublicAccess0342Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripTimelineCardActions0289Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace | tee /tmp/android-tests.log

          ./gradlew :app:compileDebugUnitTestKotlin \
            --no-daemon --max-workers=1 --no-parallel --stacktrace | tee /tmp/android-compile.log

      - name: Assemble exact-head installable APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./gradlew :app:assembleDebug \
            --no-daemon --max-workers=1 --no-parallel --stacktrace | tee /tmp/assemble.log

          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" | tee /tmp/zip-integrity.txt

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'Verified' /tmp/apksigner.txt

          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -Fq "$GITHUB_SHA" /tmp/dex-strings.txt

      - name: Configure Firebase deployment authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-deploy-sa.json
            chmod 600 /tmp/firebase-deploy-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-deploy-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-deploy-sa.json
            chmod 600 /tmp/firebase-deploy-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-deploy-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase deployment credential is missing."
            exit 3
          fi

      - name: Install Functions deployment dependencies
        shell: bash
        run: npm --prefix trip-platform/functions install --no-audit --no-fund

      - name: Deploy exact-head canonical backend and public Agenda
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force
          fi

      - name: Smoke live Agenda and authenticated passenger area
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://rota-certa-7ccc8.web.app
          curl --retry 10 --retry-delay 3 --fail --silent --show-error "$BASE/v1/health" | tee /tmp/live-health-0498.json
          grep -Fq '"ok":true' /tmp/live-health-0498.json

          curl --retry 10 --retry-delay 3 --fail --silent --show-error "$BASE/v1/public/agenda/ezequiel?verify=$GITHUB_SHA" | tee /tmp/live-public-agenda-0500.json
          grep -Fq '"segmentAvailability"' /tmp/live-public-agenda-0500.json
          grep -Fq '"passengerSeats"' /tmp/live-public-agenda-0500.json
          ! grep -Eiq '"(passengerName|passengerContact|passengerId|sourceReference|fareMinorUnits|paymentStatus|boardingAddress|dropoffAddress|bookings|blablaTripId|whatsapp)"[[:space:]]*:' /tmp/live-public-agenda-0500.json

          propagated=false
          for attempt in $(seq 1 18); do
            BUST="$GITHUB_SHA-$attempt-$(date +%s%N)"
            curl --retry 3 --retry-delay 2 --fail --silent --show-error "$BASE/app.js?v=$BUST" -o /tmp/live-app-0498.js
            curl --retry 3 --retry-delay 2 --fail --silent --show-error "$BASE/?v=$BUST" -o /tmp/live-index-0498.html
            curl --retry 3 --retry-delay 2 --fail --silent --show-error "$BASE/minha-area.js?v=$BUST" -o /tmp/live-minha-area-0498.js
            curl --retry 3 --retry-delay 2 --fail --silent --show-error "$BASE/minha-area.html?v=$BUST" -o /tmp/live-minha-area-0498.html
            if grep -Fq 'app.js?v=0.1.498' /tmp/live-index-0498.html &&
               grep -Fq 'minha-area.js?v=0.1.498' /tmp/live-minha-area-0498.html &&
               grep -Fq 'appendSegmentPassengerDots0489(passengers0489, segment.passengerSeats)' /tmp/live-app-0498.js &&
               grep -Fq 'Salvar alterações' /tmp/live-minha-area-0498.js &&
               grep -Fq 'Cancelar reserva' /tmp/live-minha-area-0498.js; then
              propagated=true
              break
            fi
            sleep 5
          done
          test "$propagated" = true

          grep -Fq 'function agendaTimezone0496' /tmp/live-app-0498.js
          grep -Fq 'function agendaDateParts0496' /tmp/live-app-0498.js
          grep -Fq 'function agendaTripTime0496' /tmp/live-app-0498.js
          grep -Fq 'agendaDateLabel0473(item.departureAtMillis, item.timezoneId)' /tmp/live-app-0498.js
          grep -Fq 'agendaLongDateLabel0480(item.departureAtMillis, item.timezoneId)' /tmp/live-app-0498.js
          grep -Fq 'appendSegmentPassengerDots0489(passengers0489, segment.passengerSeats)' /tmp/live-app-0498.js
          grep -Fq 'app.js?v=0.1.498' /tmp/live-index-0498.html
          grep -Fq 'minha-area.js?v=0.1.498' /tmp/live-minha-area-0498.html
          grep -Fq 'passengerMutationPath0498' /tmp/live-minha-area-0498.js
          grep -Fq 'method: "PUT"' /tmp/live-minha-area-0498.js
          grep -Fq 'method: "POST"' /tmp/live-minha-area-0498.js
          ! grep -Eiq '/v1/admin/|Administrar esta viagem|public-visibility' /tmp/live-app-0498.js
          ! grep -Eiq '/v1/admin/|Administrar esta viagem' /tmp/live-minha-area-0498.js
          printf 'LIVE_AGENDA_PASSENGER_AREA_0498=PASS sha=%s\n' "$GITHUB_SHA" | tee /tmp/live-smoke-0498.txt

      - name: Materialize APK and evidence after deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/0501
          APK='app/build/outputs/apk/debug/app-debug.apk'
          cp "$APK" "/tmp/0501/rota-certa-$EXPECTED_VERSION_NAME-agenda-segment-vacancies.apk"
          sha256sum "/tmp/0501/rota-certa-$EXPECTED_VERSION_NAME-agenda-segment-vacancies.apk" | tee /tmp/0501/apk.sha256
          cp /tmp/source-head.txt /tmp/source-branch.txt /tmp/changed-files.txt /tmp/farol.sha256 /tmp/0501/
          cp /tmp/node-tests.log /tmp/android-tests.log /tmp/android-compile.log /tmp/assemble.log /tmp/0501/
          cp /tmp/aapt.txt /tmp/apksigner.txt /tmp/zip-integrity.txt /tmp/dex-strings.txt /tmp/0501/
          cp /tmp/live-health-0498.json /tmp/live-public-agenda-0500.json /tmp/live-app-0498.js /tmp/live-index-0498.html /tmp/live-smoke-0498.txt /tmp/0501/
          cp /tmp/live-minha-area-0498.js /tmp/live-minha-area-0498.html /tmp/0501/

          cat > /tmp/0501/final-status.txt <<EOF
          canonical_trip_single_authority=PASS
          collector_to_agenda=ENABLED_EXISTING_CANONICAL_PATH
          public_passenger_segments=LIVE_CANONICAL_BOOKINGS
          public_segment_dots=ANONYMOUS_PASSENGER_SEATS
          public_segment_vacancies=COLLECTOR_PUBLIC_PROJECTION_PLUS_LIVE_PASSENGER_DELTA
          public_payload_allowlist=PASS
          public_passenger_pii=ABSENT
          public_driver_whatsapp=ABSENT
          incomplete_collector_snapshot=DOES_NOT_ZERO_VALID_OCCUPANCY
          timeline_provenance_policy=BLABLACAR_BLOCK_ALL_0500
          timeline_source=CANONICAL_NATIVE_FIREWALL
          collectorRead=false
          collectorFallback=false
          collectorDerivedData=false
          timeline_private_mirror=ABSENT
          timeline_blabla_trip_fields=ABSENT_FROM_SERVER_PAYLOAD
          timeline_blabla_bookings=FILTERED_FAIL_CLOSED
          canonical_identity_selector=ENFORCED
          canonical_revision_regression=REJECTED
          event_driven_timeline_refresh=PASS
          polling_role=RECOVERY_ONLY
          public_agenda_invalidation=TESTED
          timeline_export_schema=3.0
          farol_untouched=PASS
          package=br.com.mapeiaia.rotacerta
          version=$EXPECTED_VERSION_NAME/$EXPECTED_VERSION_CODE
          source_head=$GITHUB_SHA
          source_branch=$GITHUB_REF_NAME
          deployment=PASS
          merge=false
          release=false
          latest=false
          physical_approval=PENDING_SAMSUNG_SM_S911B_ANDROID_16
          EOF
          cat /tmp/0501/final-status.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.501-agenda-segment-vacancies-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0501
