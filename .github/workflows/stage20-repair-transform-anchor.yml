name: Repair Stage20 transform anchor

on:
  push:
    branches:
      - agent/stage20-forensic-causality-0.1.201
    paths:
      - .github/workflows/stage20-repair-transform-anchor.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace brittle showOverlay anchor
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_farol_forensic_causality_stage20.py')
          s = p.read_text(encoding='utf-8')
          label = "        'overlay origin',\n    )"
          label_at = s.find(label)
          if label_at < 0:
              raise SystemExit('overlay origin label not found')
          start = s.rfind('    service = replace_once(', 0, label_at)
          if start < 0:
              raise SystemExit('overlay replace_once start not found')
          end = label_at + len(label)
          old = s[start:end]
          required = [
              'private fun showOverlay',
              'val manager = windowManager ?: return',
              'val nextTextChecklist15 = formatBubbleDistanceKm(distanceKm)',
              'FarolForensicTraceStage20.callSite',
          ]
          for item in required:
              if item not in old:
                  raise SystemExit(f'unsafe overlay block: missing {item}')
          new = '''    service = replace_in_section(
              service,
              '    private fun showOverlay(color: RadarColor, distanceKm: Double? = null) {',
              '    private fun formatBubbleDistanceKm(',
              '        val nextTextChecklist15 = formatBubbleDistanceKm(distanceKm)\\n',
              '        val stage20Origin = if (color == RadarColor.Green || color == RadarColor.Red) {\\n'
              '            FarolForensicTraceStage20.callSite(Thread.currentThread().stackTrace)\\n'
              '        } else "showOverlay"\\n'
              '        val stage20Binding = currentStage20BindingSnapshot()\\n'
              '        val nextTextChecklist15 = formatBubbleDistanceKm(distanceKm)\\n',
              'overlay origin',
          )'''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          PY
          python3 scripts/apply_farol_forensic_causality_stage20.py --self-test
          python3 -m py_compile scripts/apply_farol_forensic_causality_stage20.py
          grep -Fq "'    private fun formatBubbleDistanceKm('," scripts/apply_farol_forensic_causality_stage20.py
          git rm .github/workflows/stage20-repair-transform-anchor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply_farol_forensic_causality_stage20.py
          git commit -m 'Fix Stage20 showOverlay transform anchor'
          git push origin HEAD:agent/stage20-forensic-causality-0.1.201
