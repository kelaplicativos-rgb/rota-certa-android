          new = '''    private fun startProximityAlertMonitor() {
        if (proximityAlertMonitorStarted || !serviceReady) return
        proximityAlertMonitorStarted = true
        traceEvent("proximity.loop started interval=${PROXIMITY_ALERT_LOOP_MS}ms")
        scope.launch {
            while (serviceReady) {
                val alerts = currentSavedPlaces.filter { it.type == SavedPlaceType.ProximityAlert }
                val radars = currentImportedRadars
                val shouldTrackLocation = alerts.isNotEmpty() || radars.isNotEmpty()
                updateProximityLocationTracking(shouldTrackLocation)
                if (shouldTrackLocation) {
                    val coordinate = lastProximityCoordinate ?: locationService.currentCoordinate()
                    if (coordinate != null) checkProximityAlerts(alerts, radars, coordinate)
                }
                delay(PROXIMITY_ALERT_LOOP_MS)
            }
            stopProximityLocationTracking()
        }
    }

    private fun updateProximityLocationTracking(shouldTrack: Boolean) {
        if (shouldTrack && !proximityLocationTrackingActive) {
            val started = locationService.startContinuousUpdates(
                onCoordinate = { coordinate ->
                    lastProximityCoordinate = coordinate
                    if (!serviceReady) return@startContinuousUpdates
                    val alerts = currentSavedPlaces.filter { it.type == SavedPlaceType.ProximityAlert }
                    val radars = currentImportedRadars
                    if (alerts.isNotEmpty() || radars.isNotEmpty()) {
                        scope.launch { checkProximityAlerts(alerts, radars, coordinate) }
                    }
                },
                onError = { error ->
                    proximityLocationTrackingActive = false
                    traceEvent("proximity.location_updates error=${error::class.java.simpleName}: ${error.message.orEmpty()}")
                },
            )
            proximityLocationTrackingActive = started
            if (started) {
                traceEvent("proximity.location_updates started interval=3000ms")
            } else {
                traceEvent("proximity.location_updates blocked reason=location_permission_missing")
            }
            return
        }
        if (!shouldTrack && proximityLocationTrackingActive) {
            stopProximityLocationTracking()
        }
    }

    private fun stopProximityLocationTracking() {
        if (!proximityLocationTrackingActive) return
        locationService.stopContinuousUpdates()
        proximityLocationTrackingActive = false
        lastProximityCoordinate = null
        traceEvent("proximity.location_updates stopped")
    }

    private fun checkProximityAlerts(alerts: List<SavedPlace>, radars: List<ImportedRadar>, coordinate: Coordinate) {
        proximityAlertEngine.check(
            alerts = alerts,
            radars = radars,
            coordinate = coordinate,
            settings = currentSettings,
        ) { diagnostic ->
            recordDiagnostic(stage = diagnostic.stage, reason = diagnostic.reason)
        }
    }
