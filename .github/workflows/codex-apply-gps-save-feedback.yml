          new = '''class DeviceLocationService(private val context: Context) {
    private val client = LocationServices.getFusedLocationProviderClient(context)
    private var activeLocationCallback: LocationCallback? = null
    private var lastKnownCoordinate: Coordinate? = null

    suspend fun currentCoordinate(): Coordinate? {
        if (!hasLocationPermission()) return null

        val location = client
            .getCurrentLocation(Priority.PRIORITY_BALANCED_POWER_ACCURACY, CancellationTokenSource().token)
            .await()
            ?: client.lastLocation.await()
            ?: return null

        return location.toCoordinate().also { lastKnownCoordinate = it }
    }

    fun latestCoordinate(): Coordinate? = lastKnownCoordinate

    fun startContinuousUpdates(
        onCoordinate: (Coordinate) -> Unit,
        onError: (Throwable) -> Unit = {},
    ): Boolean {
        if (activeLocationCallback != null) return true
        if (!hasLocationPermission()) return false

        val request = LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, ACTIVE_INTERVAL_MS)
            .setMinUpdateIntervalMillis(FASTEST_INTERVAL_MS)
            .setMaxUpdateDelayMillis(MAX_DELAY_MS)
            .setMinUpdateDistanceMeters(MIN_DISTANCE_METERS)
            .setWaitForAccurateLocation(false)
            .build()

        val callback = object : LocationCallback() {
            override fun onLocationResult(result: LocationResult) {
                result.lastLocation?.toCoordinate()?.let { coordinate ->
                    lastKnownCoordinate = coordinate
                    onCoordinate(coordinate)
                }
            }
        }
        activeLocationCallback = callback
        client.requestLocationUpdates(request, callback, Looper.getMainLooper())
            .addOnFailureListener { error ->
                if (activeLocationCallback == callback) activeLocationCallback = null
                onError(error)
            }
        return true
    }

    fun stopContinuousUpdates() {
        activeLocationCallback?.let { callback ->
            client.removeLocationUpdates(callback)
        }
        activeLocationCallback = null
    }

    private fun hasLocationPermission(): Boolean {
        val fine = ContextCompat.checkSelfPermission(context, Manifest.permission.ACCESS_FINE_LOCATION)
        val coarse = ContextCompat.checkSelfPermission(context, Manifest.permission.ACCESS_COARSE_LOCATION)
        return fine == PackageManager.PERMISSION_GRANTED || coarse == PackageManager.PERMISSION_GRANTED
    }

    private fun Location.toCoordinate(): Coordinate = Coordinate(latitude, longitude)

    private companion object {
        const val ACTIVE_INTERVAL_MS = 3_000L
        const val FASTEST_INTERVAL_MS = 1_500L
        const val MAX_DELAY_MS = 4_000L
        const val MIN_DISTANCE_METERS = 5f
    }
}
