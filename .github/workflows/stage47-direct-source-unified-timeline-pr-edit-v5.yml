name: Stage47 PR persist unified Timeline app source

on:
  pull_request:
    branches:
      - agent/stage47-r4-unified-occupancy-step6-validation-apk
    paths:
      - .github/workflows/stage47-direct-source-unified-timeline-pr-edit-v5.yml

permissions:
  contents: write

jobs:
  persist-app-source:
    if: github.event.pull_request.head.ref == 'agent/stage47-r4-step7-automatic-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROTECTED_FAROL_SHA256: 2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage47-r4-step7-automatic-identity
          fetch-depth: 1

      - name: Apply app/src wiring only
        shell: bash
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          python3 - <<'PY'
          from pathlib import Path

          def one(lines, stripped, start=0):
              hits = [i for i in range(start, len(lines)) if lines[i].strip() == stripped]
              if len(hits) != 1:
                  raise SystemExit(f'{stripped!r}: expected one match, found {len(hits)}')
              return hits[0]

          def first(lines, stripped, start=0):
              for i in range(start, len(lines)):
                  if lines[i].strip() == stripped:
                      return i
              raise SystemExit(f'{stripped!r}: no match')

          def save(path, lines):
              Path(path).write_text('\n'.join(lines) + '\n')

          activity = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt')
          a = activity.read_text().splitlines()
          i = one(a, 'var screen by remember { mutableStateOf(if (startCreating) TripScreen.CREATE else TripScreen.LIST) }')
          a[i:i+1] = [
              '    var screen by remember {',
              '        mutableStateOf(',
              '            when {',
              '                startCreating -> TripScreen.CREATE',
              '                initialTripId != null -> TripScreen.LIST',
              '                else -> TripScreen.TIMELINE',
              '            },',
              '        )',
              '    }',
          ]
          cancels = [j for j, line in enumerate(a) if line.strip() == 'onCancel = { screen = TripScreen.LIST },']
          if len(cancels) != 2:
              raise SystemExit(f'expected 2 cancel paths, found {len(cancels)}')
          for j in cancels:
              a[j] = a[j].replace('TripScreen.LIST', 'TripScreen.TIMELINE')
          created = one(a, 'message = "Viagem criada. Publique quando estiver pronta."')
          if a[created - 1].strip() != 'screen = TripScreen.LIST':
              raise SystemExit('create return marker missing')
          a[created - 1] = a[created - 1].replace('TripScreen.LIST', 'TripScreen.TIMELINE')
          sync = one(a, 'onRequestBlaBlaSync = { autoBlaBlaSyncToken++ },')
          ind = a[sync][:len(a[sync]) - len(a[sync].lstrip())]
          a[sync+1:sync+1] = [
              ind + 'onCreateTrip = { screen = TripScreen.CREATE },',
              ind + 'onPinShortcut = {',
              ind + '    val requested = TripShortcutInstaller.requestPinnedCreateShortcut(activity)',
              ind + '    message = if (requested) "Pedido de atalho enviado ao Android." else "O launcher não permite fixar atalhos automaticamente."',
              ind + '},',
              ind + 'onOpenOnlineSettings = { screen = TripScreen.SETTINGS },',
          ]
          back = one(a, 'onBack = { screen = TripScreen.LIST },')
          a[back] = a[back].replace('onBack = { screen = TripScreen.LIST }', 'onBack = { activity.finish() }')
          saved = one(a, 'store.saveOnlineSettings(it)')
          if a[saved + 1].strip() != 'screen = TripScreen.LIST':
              raise SystemExit('settings return marker missing')
          a[saved + 1] = a[saved + 1].replace('TripScreen.LIST', 'TripScreen.TIMELINE')
          new_btn = one(a, 'Button(onClick = { screen = TripScreen.CREATE }) { Text("Nova viagem") }')
          menu_start = new_btn - 1
          online_btn = one(a, 'OutlinedButton(onClick = { screen = TripScreen.SETTINGS }) { Text("Integração online") }', menu_start)
          menu_end = online_btn + 2
          if a[menu_end].strip() != 'val onlineSettings = store.onlineSettings()':
              raise SystemExit('LIST menu boundary missing')
          a[menu_start:menu_end] = [
              '                    OutlinedButton(onClick = { screen = TripScreen.TIMELINE }) {',
              '                        Text("Voltar à Timeline")',
              '                    }',
          ]
          empty = one(a, 'Text("Nenhuma viagem cadastrada. Crie a primeira para começar.")')
          a[empty] = a[empty].replace('Nenhuma viagem cadastrada. Crie a primeira para começar.', 'Nenhuma viagem local neste aparelho. A Timeline continua exibindo publicações sincronizadas.')
          save(activity, a)

          ui = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt')
          u = ui.read_text().splitlines()
          req = one(u, 'onRequestBlaBlaSync: () -> Unit,')
          ind = u[req][:len(u[req]) - len(u[req].lstrip())]
          u[req+1:req+1] = [ind + 'onCreateTrip: () -> Unit,', ind + 'onPinShortcut: () -> Unit,', ind + 'onOpenOnlineSettings: () -> Unit,']
          merged = one(u, 'val merged = remember(localEntries, collectorResponse) { BlaBlaTimelineAdapter.merge(localEntries, collectorResponse) }')
          u[merged+1:merged+1] = [
              '    val directionGeo = remember(merged, trips, appSettings) {',
              '        TripTimelineGeoResolver.resolveTrustedStops(',
              '            places = merged.flatMap { listOf(it.origin, it.destination) },',
              '            trustedStops = timelineTrustedDirectionStops(trips, appSettings),',
              '        )',
              '    }',
          ]
          actions = first(u, 'ResponsiveTripActions(listOf(')
          sync_action = one(u, 'ResponsiveTripAction(if (showSync) "Fechar sincronização" else "Sincronizar BlaBlaCar") { showSync = !showSync },', actions)
          u[sync_action:sync_action] = [
              '        ResponsiveTripAction("Nova viagem", onCreateTrip),',
              '        ResponsiveTripAction("Fixar atalho", onPinShortcut),',
              '        ResponsiveTripAction("Integração online", onOpenOnlineSettings),',
          ]
          radius_arg = one(u, 'homeRadiusKm = appSettings.homeRadiusKm,')
          u.insert(radius_arg + 1, '            directionGeo = directionGeo,')
          radius_param = one(u, 'homeRadiusKm: Double,')
          u.insert(radius_param + 1, '    directionGeo: Map<String, TimelineGeoPoint>,')
          old = one(u, 'val baseDirection = timelineBaseDirection(trip, homeCoordinate, homeRadiusKm)')
          if 'directionPrefix' not in u[old + 1] or '${entry.origin} → ${entry.destination}' not in u[old + 2]:
              raise SystemExit('old direction block missing')
          u[old:old+3] = [
              '            val baseDirection = timelineBaseDirectionLabel(entry, trip, directionGeo, homeCoordinate, homeRadiusKm)',
              '            baseDirection?.let { Text(it, style = MaterialTheme.typography.bodySmall) }',
              '            Text("${entry.origin} → ${entry.destination}", style = MaterialTheme.typography.titleMedium)',
          ]
          save(ui, u)

          build = Path('app/build.gradle.kts')
          text = build.read_text()
          if text.count('versionCode = 5532') != 1 or text.count('versionName = "0.1.239"') != 1:
              raise SystemExit('unexpected version markers')
          build.write_text(text.replace('versionCode = 5532', 'versionCode = 5533').replace('versionName = "0.1.239"', 'versionName = "0.1.240"'))
          PY
          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          test -z "$(git diff --name-only -- "$FAROL")"
          grep -Fq 'else -> TripScreen.TIMELINE' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'timelineBaseDirectionLabel(entry, trip, directionGeo' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'versionName = "0.1.240"' app/build.gradle.kts
          git diff --check

      - name: Commit app source without workflow writes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt \
            app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt \
            app/build.gradle.kts
          ! git diff --cached --name-only | grep -F '.github/workflows/'
          ! git diff --cached --name-only | grep -F 'LiveRideAccessibilityService.kt'
          git commit -m 'Timeline: unify agenda operational view'
          git push origin HEAD:agent/stage47-r4-step7-automatic-identity
          echo "source_head=$(git rev-parse HEAD)"
          echo 'direct_source=true'
          echo 'fixed_historical_source_checkout=false'
          echo 'stage47_materializer_used=false'
          echo 'farol_untouched=true'
