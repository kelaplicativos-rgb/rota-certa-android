name: Validate Stage47 trip calendar booking 0.1.227
on:
  pull_request:
    branches: [agent/stage46-visual-epoch-no-result-ocr-decontamination-0.1.219]
    paths:
      - '.github/workflows/stage47-trip-calendar-booking-0.1.227.yml'
      - 'scripts/run_stage47_trip_calendar_booking_ci.sh'
      - 'scripts/apply_stage47_*.py'
      - 'stage47/**'
      - 'trip-platform/**'
  workflow_dispatch:
concurrency:
  group: 'stage47-trip-calendar-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  validate-stage47-trip-calendar-booking:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GOOGLE_MAPS_API_KEY: '${{ secrets.GOOGLE_MAPS_API_KEY }}'
      GH_TOKEN: '${{ github.token }}'
    steps:
      - name: Checkout protected canonical source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          path: source
          fetch-depth: 1
      - name: Checkout current Stage47 patches
        uses: actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          path: patches
          fetch-depth: 1
      - name: Checkout pinned Stage18 recipe
        uses: actions/checkout@v4
        with:
          ref: aa4bd10847d41a3abd5d8a9cb186d6cfa8acc88c
          path: historical19
          fetch-depth: 1
      - name: Checkout pinned Stage32 recipe
        uses: actions/checkout@v4
        with:
          ref: a4443bb6c287fcf31a56f2a3c4ba8fc211fe1f79
          path: historical34
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Materialize Stage46 R8, add Stage47, validate backend and build APK
        run: |
          set -euo pipefail
          mkdir -p evidence
          bash patches/scripts/run_stage47_trip_calendar_booking_ci.sh source patches historical19 historical34 evidence
      - name: Capture materialized shortcut surface for Stage47 integration audit
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/materialized-shortcut-surface
          BASE="source/app/src/main/java/br/com/mapeiaia/rotacerta"
          if [[ -d "$BASE" ]]; then
            find "$BASE" -maxdepth 1 -type f \( -name '*Shortcut*.kt' -o -name 'BubbleShortcut*.kt' \) -exec cp '{}' evidence/materialized-shortcut-surface/ \;
            test -f "$BASE/MainActivity.kt" && cp "$BASE/MainActivity.kt" evidence/materialized-shortcut-surface/ || true
            {
              echo '=== SHORTCUT REGISTRY CONTEXT ==='
              grep -R -n -C 5 -E 'BubbleShortcutSpec|trip\.copy_confirmation|executeShortcut|ShortcutAction|open_module' "$BASE" --include='*.kt' | head -n 500 || true
            } | tee evidence/shortcut-context.txt
          fi
      - name: Upload Stage47 APK, trip platform and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.227-stage47-trip-calendar-booking
          path: evidence/
          if-no-files-found: error
          retention-days: 30
