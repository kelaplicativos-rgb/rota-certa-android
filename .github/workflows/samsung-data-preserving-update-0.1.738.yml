name: Rota Certa 0.1.738 Samsung update with preserved data

on:
  push:
    branches: [codex/samsung-data-preserving-update-0.1.738]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samsung-update-0738-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      ROTA_CERTA_GIT_SHA: ${{ github.sha }}
      ROTA_CERTA_GIT_BRANCH: codex/samsung-data-preserving-update-0.1.738
      OM_TAG: 2026.08.27-18-android
      OM_VERSION: 2026.08.27-18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check update regressions and source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 -B -m unittest discover -s scripts/tests -p test_apk_upgrade.py -v
          node --test trip-platform/functions/test/standalone-covers-remote-0736.test.js trip-platform/functions/test/blablacar-trip-query-remote-0737.test.js

      - name: Install Android native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Build the unchanged Organic Maps dependency
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 128 --branch "$OM_TAG" https://github.com/organicmaps/organicmaps.git "$RUNNER_TEMP/organicmaps"
          cd "$RUNNER_TEMP/organicmaps"
          git submodule update --init --recursive --depth 1 --jobs 8
          test "$(tools/unix/version.sh android_name)" = "$OM_VERSION"
          git rev-parse HEAD > "$RUNNER_TEMP/organicmaps-source.txt"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          ./gradlew :sdk:location:core:publishToMavenLocal :sdk:publishToMavenLocal :sdk:maps:world:publishToMavenLocal \
            -Parm64 -Pnjobs=2 --no-daemon --max-workers=2 --stacktrace \
            2>&1 | tee "$RUNNER_TEMP/organicmaps-build.log"

      - name: Test and build the exact release source
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          ./gradlew :app:verifyReleaseHistory :app:verifyAndroidUpdateContract :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaStandaloneRideCoversExport0734Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaRemoteTripQuery0737Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaDirectAccountCapture0608Test' \
            --no-daemon --max-workers=2 --stacktrace \
            2>&1 | tee "$RUNNER_TEMP/android-tests.log"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace \
            2>&1 | tee "$RUNNER_TEMP/apk-build.log"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Validate replacement of the installed 0.1.737 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/update-delivery"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/baseline.apk" \
            'https://rota-certa-7ccc8--apk-0737-43672e23f039-kr92jb9m.web.app/rota-certa-0.1.737-6028-consulta-html-remota-43672e23f039.apk'
          python3 -B scripts/verify_apk_upgrade.py \
            --baseline "$RUNNER_TEMP/baseline.apk" \
            --candidate app/build/outputs/apk/debug/app-debug.apk \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --version 0.1.738 --version-code 6029 --commit "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/update-delivery/update-proof.json"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/update-delivery/rota-certa-0.1.738-6029.apk"
          cmp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/update-delivery/rota-certa-0.1.738-6029.apk"
          sha256sum "$RUNNER_TEMP/update-delivery/rota-certa-0.1.738-6029.apk" > "$RUNNER_TEMP/update-delivery/apk-sha256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/update-delivery/source-commit.txt"

      - name: Enable KVM for the Android update test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify data retention through a real APK replacement
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            python3 -B scripts/test_apk_upgrade_on_device.py
            --baseline "$RUNNER_TEMP/baseline.apk"
            --candidate "$RUNNER_TEMP/update-delivery/rota-certa-0.1.738-6029.apk"
            --proof "$RUNNER_TEMP/update-delivery/update-proof.json"
            --report "$RUNNER_TEMP/update-delivery/data-preservation.json"

      - name: Deliver only the update-tested APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.738-update-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/update-delivery/
            ${{ runner.temp }}/android-tests.log
            ${{ runner.temp }}/apk-build.log
            ${{ runner.temp }}/organicmaps-source.txt
            app/build/test-results/testDebugUnitTest/

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: samsung-update-failure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/organicmaps-build.log
            ${{ runner.temp }}/android-tests.log
            ${{ runner.temp }}/apk-build.log
            ${{ runner.temp }}/update-delivery/*.json
            app/build/test-results/
