name: Codex Stable Full Repository Audit

on:
  pull_request:
    branches:
      - codex/pr5-stable-bubble-combined
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Inventory every tracked file and line
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          printf 'path\tbytes\tlines\tmime\tsha256\n' > audit/inventory.tsv
          git ls-files -z | while IFS= read -r -d '' path; do
            bytes=$(wc -c < "$path" | tr -d ' ')
            mime=$(file --brief --mime-type "$path" 2>/dev/null || printf 'unknown')
            if grep -Iq . "$path" 2>/dev/null || [ ! -s "$path" ]; then
              lines=$(wc -l < "$path" | tr -d ' ')
            else
              lines=0
            fi
            hash=$(sha256sum "$path" | cut -d' ' -f1)
            printf '%s\t%s\t%s\t%s\t%s\n' "$path" "$bytes" "$lines" "$mime" "$hash" >> audit/inventory.tsv
          done
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            echo "tracked_files=$(git ls-files | wc -l | tr -d ' ')"
            echo "text_lines=$(awk -F '\t' 'NR>1 {sum += $3} END {print sum+0}' audit/inventory.tsv)"
            echo "bytes=$(awk -F '\t' 'NR>1 {sum += $2} END {print sum+0}' audit/inventory.tsv)"
            echo "gradle_patch_files=$(git ls-files 'app/*.gradle.kts' | grep -Ev '^app/build.gradle.kts$' | wc -l | tr -d ' ')"
            echo "kotlin_main_files=$(git ls-files 'app/src/main/**/*.kt' | wc -l | tr -d ' ')"
            echo "kotlin_test_files=$(git ls-files 'app/src/test/**/*.kt' | wc -l | tr -d ' ')"
          } > audit/summary.properties
          git ls-files -z | tar --null -T - -czf audit/tracked-source-before-build.tar.gz

      - name: Repository-wide risk and architecture scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import json
          import pathlib
          import re

          root = pathlib.Path('.')
          findings = []
          patterns = [
              ('TODO_FIXME', re.compile(r'\b(?:TODO|FIXME|HACK|XXX)\b')),
              ('FORCE_UNWRAP', re.compile(r'!!')),
              ('GLOBAL_SCOPE', re.compile(r'\bGlobalScope\b')),
              ('BLOCKING_CALL', re.compile(r'\b(?:Thread\.sleep|runBlocking)\b')),
              ('EMPTY_CATCH', re.compile(r'catch\s*\([^)]*\)\s*\{\s*\}')),
              ('DEBUG_LOG', re.compile(r'\b(?:Log\.[vdiew]|println|printStackTrace)\s*\(')),
              ('SUPPRESSION', re.compile(r'@Suppress\s*\(')),
              ('POSSIBLE_SECRET', re.compile(r'(?i)(?:api[_-]?key|secret|token|password)\s*[=:]\s*[\"\'][^\"\']{4,}[\"\']')),
              ('SOURCE_MUTATION', re.compile(r'\b(?:writeText|appendText|delete\s*\(|copyTo\s*\()')),
              ('STRING_PATCH', re.compile(r'\.replace\s*\(')),
              ('BUILD_HOOK', re.compile(r'\b(?:preBuild|compileDebugKotlin|doFirst|doLast|mustRunAfter|dependsOn)\b')),
              ('WEBVIEW_JS_INTERFACE', re.compile(r'\b(?:addJavascriptInterface|javaScriptEnabled\s*=\s*true)\b')),
              ('FAST_POLLING', re.compile(r'(?i)(?:loop|interval|delay|timeout)[A-Z_a-z]*\s*=\s*(?:[1-9]\d?|1\d\d|2\d\d|300)L?\b')),
          ]
          suffixes = {'.kt', '.kts', '.java', '.xml', '.gradle', '.properties', '.pro', '.json', '.yml', '.yaml', '.md', '.txt', '.sh'}
          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts or 'build' in path.parts or 'audit' in path.parts:
                  continue
              if path.name == 'codex-stable-full-audit.yml':
                  continue
              if path.suffix.lower() not in suffixes and path.name not in {'gradlew', 'proguard-rules.pro'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for no, line in enumerate(text.splitlines(), 1):
                  for kind, pattern in patterns:
                      if pattern.search(line):
                          findings.append({'kind': kind, 'path': str(path), 'line': no, 'snippet': line.strip()[:700]})
          pathlib.Path('audit/static-findings.json').write_text(json.dumps(findings, ensure_ascii=False, indent=2), encoding='utf-8')
          counts = collections.Counter(item['kind'] for item in findings)
          with pathlib.Path('audit/static-findings.md').open('w', encoding='utf-8') as out:
              out.write('# Static findings\n\n')
              out.write(f'Total: {len(findings)}\n\n')
              for kind, count in sorted(counts.items()):
                  out.write(f'- {kind}: {count}\n')
              out.write('\n## Details\n\n')
              for item in findings:
                  safe = item['snippet'].replace('`', "'")
                  out.write(f"- `{item['kind']}` `{item['path']}:{item['line']}` — `{safe}`\n")
          PY

      - name: Verify clean task independently
        shell: bash
        run: |
          set -euo pipefail
          gradle clean --no-daemon --stacktrace --console=plain 2>&1 | tee audit/gradle-clean.log

      - name: Compile, test, lint and assemble effective source
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee audit/gradle-checks.log
          status=${PIPESTATUS[0]}
          echo "gradle_exit_code=$status" >> audit/summary.properties
          exit "$status"

      - name: Capture effective source and reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --short > audit/git-status-after-build.txt
          git diff -- app/src app/build.gradle.kts '*.gradle.kts' > audit/effective-build-patches.diff || true
          git diff --numstat -- app/src app/build.gradle.kts '*.gradle.kts' > audit/effective-build-patches-numstat.tsv || true
          tar -czf audit/effective-source-after-build.tar.gz app/src app/build.gradle.kts ./*.gradle.kts 2>/dev/null || true
          find app/build/reports -maxdepth 10 -type f -print 2>/dev/null | sort > audit/generated-reports.txt || true
          find app/build/outputs -maxdepth 10 -type f -print 2>/dev/null | sort > audit/generated-outputs.txt || true
          mkdir -p audit/collected
          cp -R app/build/reports audit/collected/ 2>/dev/null || true
          cp -R app/build/test-results audit/collected/ 2>/dev/null || true
          cp -R app/build/outputs/apk audit/collected/ 2>/dev/null || true

      - name: Validate generated APK identity and signature
        if: always()
        shell: bash
        run: |
          set +e
          apk=$(find app/build/outputs/apk -type f -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "No APK generated." | tee audit/apk-validation.txt
            exit 0
          fi
          {
            echo "path=$apk"
            echo "bytes=$(wc -c < "$apk" | tr -d ' ')"
            echo "sha256=$(sha256sum "$apk" | cut -d' ' -f1)"
            echo "dex_files=$(unzip -l "$apk" | awk '$4 ~ /^classes[0-9]*\.dex$/ {count++} END {print count+0}')"
            echo "native_abis=$(unzip -l "$apk" | awk '$4 ~ /^lib\/[^/]+\/.*\.so$/ {split($4,a,"/"); print a[2]}' | sort -u | paste -sd, -)"
            echo
            echo "--- apkanalyzer ---"
            apkanalyzer manifest application-id "$apk" 2>&1 || true
            apkanalyzer manifest version-code "$apk" 2>&1 || true
            apkanalyzer manifest version-name "$apk" 2>&1 || true
            echo
            echo "--- aapt badging ---"
            aapt dump badging "$apk" 2>&1 | head -40 || true
            echo
            echo "--- signature ---"
            apksigner verify --verbose --print-certs "$apk" 2>&1 || true
          } | tee audit/apk-validation.txt

      - name: Upload complete stable audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-stable-full-audit-${{ github.run_number }}
          path: audit/
          if-no-files-found: error
          retention-days: 30
