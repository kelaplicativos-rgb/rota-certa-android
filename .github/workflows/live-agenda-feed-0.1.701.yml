name: Rota Certa 0.1.701 Live Agenda Feed exact SHA

on:
  push:
    branches:
      - 'agent/live-agenda-feed-0.1.701'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-agenda-feed-0701-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate-build-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      ROTA_CERTA_GIT_SHA: ${{ github.sha }}
      ROTA_CERTA_GIT_BRANCH: 'agent/live-agenda-feed-0.1.701'
      BASE_SHA: '802e12ce7cb949d53dada25d9e904d4b618b5303'
      EXPECTED_VERSION_NAME: '0.1.701'
      EXPECTED_VERSION_CODE: '5992'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact source and isolated scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$ROTA_CERTA_GIT_SHA" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" | tee /tmp/source-sha.txt
          printf '%s\n' "$ROTA_CERTA_GIT_BRANCH" | tee /tmp/source-branch.txt

          grep -Fq 'val releaseVersionName = "0.1.701"' app/build.gradle.kts
          grep -Fq 'val releaseVersionCode = 5_992' app/build.gradle.kts
          grep -Fq '"version": "0.1.701"' app/src/main/assets/release_history.json
          grep -Fq 'createLiveAgendaFeed0701' trip-platform/functions/index.js
          grep -Fq 'agendaFeedRoute0701' trip-platform/functions/index.js
          grep -Fq 'live-agenda-feed-v1' trip-platform/functions/live-agenda-feed-0701.js
          grep -Fq 'X-Robots-Tag' trip-platform/functions/live-agenda-feed-0701.js
          grep -Fq 'no-store, no-cache' trip-platform/functions/live-agenda-feed-0701.js
          grep -Fq '/api/v1/agenda/**' trip-platform/firebase.json
          grep -Fq 'Pouso Alegre' trip-platform/functions/test/live-agenda-feed-0701.test.js

          # No Android runtime code is changed by this server/feed release.
          git diff --quiet "$BASE_SHA"...HEAD --             app/src/main/java             app/src/main/res             app/src/main/AndroidManifest.xml
          git diff --check "$BASE_SHA"...HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate live feed syntax and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/functions/live-agenda-feed-0701.js
          node --test trip-platform/functions/test/live-agenda-feed-0701.test.js | tee /tmp/live-feed-focused-tests.log
          npm --prefix trip-platform/functions install --no-audit --no-fund

      - name: Compare complete backend failures with exact 0.1.700
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/rc-base "$BASE_SHA"
          npm --prefix /tmp/rc-base/trip-platform/functions install --no-audit --no-fund

          set +e
          npm --prefix /tmp/rc-base/trip-platform/functions test > /tmp/node-base-full.log 2>&1
          BASE_EXIT=$?
          npm --prefix trip-platform/functions test > /tmp/node-head-full.log 2>&1
          HEAD_EXIT=$?
          set -e

          python3 - <<'PY'
          import pathlib, re
          pattern = re.compile(r"^not ok\s+\d+\s+-\s+(.+?)\s*$")
          def failures(path):
              result=set()
              for line in pathlib.Path(path).read_text(errors="replace").splitlines():
                  m=pattern.match(line.strip())
                  if m:
                      result.add(m.group(1))
              return result
          base=failures("/tmp/node-base-full.log")
          head=failures("/tmp/node-head-full.log")
          new=sorted(head-base)
          fixed=sorted(base-head)
          pathlib.Path("/tmp/node-new-failures.txt").write_text("\n".join(new)+("\n" if new else ""))
          pathlib.Path("/tmp/node-fixed-failures.txt").write_text("\n".join(fixed)+("\n" if fixed else ""))
          print(f"base_failures={len(base)} head_failures={len(head)} new_failures={len(new)} fixed={len(fixed)}")
          if new:
              print("\n".join(new))
              raise SystemExit(1)
          PY
          printf 'base_exit=%s\nhead_exit=%s\n' "$BASE_EXIT" "$HEAD_EXIT" | tee /tmp/node-regression-summary.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify release history and compare Android failures with 0.1.700
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew /tmp/rc-base/gradlew
          ./gradlew :app:verifyReleaseHistory --no-daemon --stacktrace | tee /tmp/release-history.log

          set +e
          (cd /tmp/rc-base && ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace) > /tmp/android-base-full.log 2>&1
          BASE_EXIT=$?
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace > /tmp/android-head-full.log 2>&1
          HEAD_EXIT=$?
          set -e

          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          def failures(root):
              result=set()
              d=pathlib.Path(root)/"app/build/test-results/testDebugUnitTest"
              if not d.exists():
                  return result
              for f in d.glob("*.xml"):
                  tree=ET.parse(f)
                  for case in tree.getroot().iter("testcase"):
                      if case.find("failure") is not None or case.find("error") is not None:
                          result.add(f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}")
              return result
          base=failures("/tmp/rc-base")
          head=failures(".")
          new=sorted(head-base)
          fixed=sorted(base-head)
          pathlib.Path("/tmp/android-new-failures.txt").write_text("\n".join(new)+("\n" if new else ""))
          pathlib.Path("/tmp/android-fixed-failures.txt").write_text("\n".join(fixed)+("\n" if fixed else ""))
          print(f"base_failures={len(base)} head_failures={len(head)} new_failures={len(new)} fixed={len(fixed)}")
          if new:
              print("\n".join(new))
              raise SystemExit(1)
          PY
          printf 'base_exit=%s\nhead_exit=%s\n' "$BASE_EXIT" "$HEAD_EXIT" | tee /tmp/android-regression-summary.txt

      - name: Assemble exact-head APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace | tee /tmp/assemble.log
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Prove APK identity, signature and embedded SHA
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" | tee /tmp/zip-integrity.txt

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt

          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -Fq "$GITHUB_SHA" /tmp/dex-strings.txt

          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          FINAL="rota-certa-0.1.701-5992-$SHORT_SHA.apk"
          cp "$APK" "$FINAL"
          APK_SHA256="$(sha256sum "$FINAL" | awk '{print $1}')"
          sha256sum "$FINAL" | tee /tmp/apk-sha256.txt
          stat -c '%s' "$FINAL" | tee /tmp/apk-size-bytes.txt
          echo "apk=$FINAL" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "package=br.com.mapeiaia.rotacerta"
            echo "versionName=$EXPECTED_VERSION_NAME"
            echo "versionCode=$EXPECTED_VERSION_CODE"
            echo "sourceSha=$GITHUB_SHA"
            echo "sourceBranch=$ROTA_CERTA_GIT_BRANCH"
            echo "deviceTarget=Samsung SM-S911B / Android 16"
            echo "liveAgendaFeed=JSON_XML"
            echo "segmentAvailability=MIN_ACROSS_CROSSED_LEGS"
            echo "feedPii=NONE"
            echo "cache=NO_STORE"
            echo "apkSha256=$APK_SHA256"
          } | tee /tmp/final-proof.txt

      - name: Upload exact-SHA APK before deployment
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-live-agenda-feed-0.1.701-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ steps.proof.outputs.apk }}
            /tmp/source-sha.txt
            /tmp/source-branch.txt
            /tmp/final-proof.txt
            /tmp/apk-sha256.txt
            /tmp/apk-size-bytes.txt
            /tmp/aapt.txt
            /tmp/apksigner.txt
            /tmp/zip-integrity.txt
            /tmp/live-feed-focused-tests.log
            /tmp/node-base-full.log
            /tmp/node-head-full.log
            /tmp/node-new-failures.txt
            /tmp/node-fixed-failures.txt
            /tmp/node-regression-summary.txt
            /tmp/android-base-full.log
            /tmp/android-head-full.log
            /tmp/android-new-failures.txt
            /tmp/android-fixed-failures.txt
            /tmp/android-regression-summary.txt
            /tmp/release-history.log
            /tmp/assemble.log

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy exact tripApi SHA
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          gcloud functions deploy tripApi \
            --gen2 \
            --project="$PROJECT" \
            --region=southamerica-east1 \
            --runtime=nodejs20 \
            --source=trip-platform/functions \
            --entry-point=tripApi \
            --trigger-http \
            --allow-unauthenticated \
            --clear-secrets \
            --update-env-vars="ROTA_CERTA_BACKEND_GIT_SHA=$GITHUB_SHA" \
            --quiet

      - name: Stage exact APK for direct install
        id: hosted
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trip-platform/public/downloads
          cp "${{ steps.proof.outputs.apk }}" "trip-platform/public/downloads/${{ steps.proof.outputs.apk }}"
          test "$(sha256sum "trip-platform/public/downloads/${{ steps.proof.outputs.apk }}" | awk '{print $1}')" = "${{ steps.proof.outputs.apk_sha256 }}"
          echo "url=https://rota-certa-7ccc8.web.app/downloads/${{ steps.proof.outputs.apk }}" >> "$GITHUB_OUTPUT"

      - name: Deploy Hosting with live feed route and exact APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
          chmod 600 /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          npx --yes firebase-tools@14.12.0 deploy \
            --only hosting \
            --project "$PROJECT" \
            --config trip-platform/firebase.json \
            --non-interactive

      - name: Smoke exact deployed feed and hosted APK
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rota-certa-7ccc8.web.app'

          curl --retry 20 --retry-delay 3 --fail --silent --show-error "$BASE/v1/health" | tee /tmp/live-health.json
          grep -Fq '"ok":true' /tmp/live-health.json
          grep -Fq "\"backendGitSha\":\"$GITHUB_SHA\"" /tmp/live-health.json

          curl --retry 20 --retry-delay 2 --fail --silent --show-error \
            -D /tmp/feed-xml-headers.txt \
            "$BASE/api/v1/agenda/ezequiel.xml" | tee /tmp/feed.xml
          grep -Fq '<agenda' /tmp/feed.xml
          grep -Fq 'schemaVersion="live-agenda-feed-v1"' /tmp/feed.xml
          grep -Fq 'motorista="ezequiel"' /tmp/feed.xml
          grep -Eqi '^content-type: application/xml' /tmp/feed-xml-headers.txt
          grep -Eqi '^cache-control: .*no-store' /tmp/feed-xml-headers.txt
          ! grep -Eqi 'passengerContact|whatsapp|telefone|email' /tmp/feed.xml

          curl --retry 20 --retry-delay 2 --fail --silent --show-error \
            "$BASE/v1/public/agenda-feed/ezequiel.json" | tee /tmp/feed.json
          grep -Fq '"schemaVersion":"live-agenda-feed-v1"' /tmp/feed.json
          grep -Fq '"driverUsername":"ezequiel"' /tmp/feed.json

          curl --retry 20 --retry-delay 2 --fail --silent --show-error \
            "$BASE/api/v1/agenda/ezequiel.xml?data=2026-10-02&origem=Pouso%20Alegre&destino=S%C3%A3o%20Paulo" \
            | tee /tmp/feed-query.xml
          grep -Fq '<agenda' /tmp/feed-query.xml

          curl --retry 10 --retry-delay 2 --fail --silent --show-error \
            "${{ steps.hosted.outputs.url }}" -o /tmp/live.apk
          test "$(sha256sum /tmp/live.apk | awk '{print $1}')" = "${{ steps.proof.outputs.apk_sha256 }}"

          {
            echo "backend_sha=$GITHUB_SHA"
            echo "feed_xml=PASS"
            echo "feed_json=PASS"
            echo "no_store=PASS"
            echo "no_pii=PASS"
            echo "hosted_apk=PASS"
            echo "hosted_apk_url=${{ steps.hosted.outputs.url }}"
          } | tee /tmp/live-deploy-proof.txt

      - name: Upload live deployment proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-live-agenda-deploy-proof-0.1.701-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/live-health.json
            /tmp/feed-xml-headers.txt
            /tmp/feed.xml
            /tmp/feed.json
            /tmp/feed-query.xml
            /tmp/live-deploy-proof.txt
