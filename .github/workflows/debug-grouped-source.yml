name: Debug Grouped Home Source

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - codex/pr5-stable-bubble-combined

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Generate transformed source
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon --stacktrace --console=plain > grouped-source-gradle.log 2>&1
          status=$?
          cp app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt grouped-main-source.kt
          echo "GRADLE_STATUS=$status" > grouped-source-status.txt
          nl -ba grouped-main-source.kt > grouped-main-numbered.txt
          exit 0
      - name: Upload transformed source
        uses: actions/upload-artifact@v4
        with:
          name: grouped-main-source
          path: |
            grouped-main-source.kt
            grouped-main-numbered.txt
            grouped-source-gradle.log
            grouped-source-status.txt
          if-no-files-found: error
