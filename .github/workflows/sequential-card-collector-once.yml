name: Sequential card collector persistence once

on:
  push:
    branches:
      - agent/passenger-timeline-geo-ux

permissions:
  contents: write

jobs:
  persist-sequential-source:
    if: github.event.head_commit.message == 'ci: run strict sequential collector persistence'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/passenger-timeline-geo-ux
          fetch-depth: 1
      - name: Persist reviewed sequential collector into app/src
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/sequential_card_patch.py
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          SOURCE='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt'
          test "$(sha256sum "$FAROL" | awk '{print $1}')" = '2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560'
          grep -Fq 'CARD_TRAVERSAL_START' "$SOURCE"
          grep -Fq 'CARD_TRAVERSAL_COMPLETE' "$SOURCE"
          grep -Fq 'CARD_TRAVERSAL_BLOCKED' "$SOURCE"
          grep -Fq 'fixedTripLimit=false' "$SOURCE"
          ! grep -Fq 'MAX_TRIPS' "$SOURCE"
          git config user.name 'rota-certa-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add "$SOURCE"
          git diff --cached --quiet && exit 0
          git commit -m 'collector: restore strict sequential card traversal'
          git push origin HEAD:agent/passenger-timeline-geo-ux
