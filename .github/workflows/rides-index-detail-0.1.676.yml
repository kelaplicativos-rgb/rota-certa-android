name: Rides index detail diagnostics 0.1.676 APK

on:
  push:
    branches:
      - 'agent/rides-index-detail-diagnostics-0.1.676'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rides-index-detail-0676-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_API_KEY: ''
      ROTA_CERTA_GIT_SHA: ${{ github.sha }}
      ROTA_CERTA_GIT_BRANCH: agent/rides-index-detail-diagnostics-0.1.676

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ROTA_CERTA_GIT_SHA"
          D='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDirectAccountCapture0608.kt'
          U='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt'
          grep -Fq 'releaseVersionName = "0.1.676"' app/build.gradle.kts
          grep -Fq 'releaseVersionCode = 5_967' app/build.gradle.kts
          grep -Fq '"version": "0.1.676"' app/src/main/assets/release_history.json
          grep -Fq 'tripLinks = initialTripLinks0676' "$D"
          grep -Fq 'BLABLACAR_RIDES_INDEX_LINKS_PERSISTED_0676' "$D"
          ! grep -Fq 'tripLinks = emptyList()' "$D"
          grep -Fq 'rebindParsedRidesToPersistedTripLinks0676' "$U"
          grep -Fq 'TRIP_DETAIL_LOAD_FAILED_0676' "$U"
          grep -Fq 'TRIP_DETAIL_PAYLOAD_DECODE_FAILED_0676' "$U"
          grep -Fq 'TRIP_DETAIL_ID_MISMATCH_0676' "$U"
          grep -Fq 'TRIP_DETAIL_DOM_EMPTY_0676' "$U"
          ! grep -Fq 'TRIP_DETAIL_HTML_UNVERIFIED' "$U"
          grep -Fq 'TARGETED_HTML_PRIVATE_PENDING_ACCEPTED_0675' "$U"
          git diff --check 97c71850b4482e67c83d0c89b69b8f470d9216c8 HEAD

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run rides index detail and inherited regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest             --tests 'br.com.mapeiaia.rotacerta.trips.RidesIndexDetailPipeline0676Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaDirectAccountCapture0608Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaRidesForensicEvidence0528Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaRidesPublicLinkCapture0582Test'             --tests 'br.com.mapeiaia.rotacerta.trips.TargetedHtmlPrivatePending0675Test'             --tests 'br.com.mapeiaia.rotacerta.trips.OperationalTripCardRefresh0663Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaPassengerArtifactCompleteness0658Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaPassengerPrivateHtml0657Test'             --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaHtmlStopTimes0672Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PassengerQuickOps0673Test'             --no-daemon --max-workers=2 --stacktrace | tee /tmp/android-0676-tests.log

      - name: Assemble exact source APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace | tee /tmp/android-0676-assemble.log
          test "$(git rev-parse HEAD)" = "$ROTA_CERTA_GIT_SHA"

      - name: Prove APK identity signing runtime markers and final SHA
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -s "$APK"
          unzip -t "$APK" | tee /tmp/android-0676-zip-integrity.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/android-0676-aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/android-0676-aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='5967'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='0.1.676'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/android-0676-apksigner.txt
          grep -Fq 'Verified' /tmp/android-0676-apksigner.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/android-0676-dex-strings.txt
          grep -Fq "$ROTA_CERTA_GIT_SHA" /tmp/android-0676-dex-strings.txt
          grep -Fq 'BLABLACAR_RIDES_INDEX_LINKS_PERSISTED_0676' /tmp/android-0676-dex-strings.txt
          grep -Fq 'BLABLACAR_TRIP_DETAIL_REJECTED_0676' /tmp/android-0676-dex-strings.txt
          grep -Fq 'TARGETED_HTML_PRIVATE_PENDING_ACCEPTED_0675' /tmp/android-0676-dex-strings.txt
          grep -Fq 'PASSENGER_QUICK_TRACKING_0674' /tmp/android-0676-dex-strings.txt

          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          FINAL="rota-certa-0.1.676-5967-$SHORT_SHA.apk"
          cp "$APK" "$FINAL"
          echo "apk=$FINAL" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "package=br.com.mapeiaia.rotacerta"
            echo "versionName=0.1.676"
            echo "versionCode=5967"
            echo "branch=agent/rides-index-detail-diagnostics-0.1.676"
            echo "commit=$ROTA_CERTA_GIT_SHA"
            echo "deviceTarget=Samsung SM-S911B / Android 16 / API 36"
            echo "ridesIndexTripLinks=EXACT_PERSISTED"
            echo "relativeHrefCanonicalization=ENABLED"
            echo "detailDiagnostics=LOAD_DECODE_ID_DOM"
            echo "sameCardRetry=PRESERVED"
            echo "privatePending0675=PRESERVED"
            echo "apk=$FINAL"
            echo "apk_sha256=$APK_SHA256"
          } | tee rides-index-detail-0676-proof.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-rides-index-detail-0.1.676-${{ github.sha }}
          path: |
            ${{ steps.proof.outputs.apk }}
            rides-index-detail-0676-proof.txt
            /tmp/android-0676-tests.log
            /tmp/android-0676-assemble.log
            /tmp/android-0676-aapt.txt
            /tmp/android-0676-apksigner.txt
            /tmp/android-0676-zip-integrity.txt
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30
