name: Agenda segment availability cards 0.1.580

on:
  push:
    branches:
      - agent/agenda-segment-availability-cards-0.1.580
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-segment-availability-cards-0.1.580-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_MAPS_API_KEY: segment_availability_validation_dummy_key
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact source and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --check f6a52215e7821810ebf8d6d8a37f6a75da0120be...HEAD
          grep -Fq 'val releaseVersionCode = 5_871' app/build.gradle.kts
          grep -Fq 'val releaseVersionName = "0.1.580"' app/build.gradle.kts
          grep -Fq '"version": "0.1.580"' app/src/main/assets/release_history.json
          grep -Fq 'Text("Vagas por trecho"' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'appendSegmentAvailability0580(card, item, stops)' trip-platform/public/public-agenda-shell-0569.js
          grep -Fq 'agendaSegments0580' trip-platform/public/index.html
          git rev-parse HEAD | tee validated-source-head.txt

      - name: Validate public Agenda JavaScript and privacy regressions
        shell: bash
        working-directory: trip-platform/functions
        run: |
          set -euo pipefail
          node --check index.js
          node --check ../public/public-agenda-shell-0569.js
          node --test             test/public-agenda-shell-0569.test.js             test/agenda-segment-cards-0580.test.js | tee ../../public-agenda-segment-tests.log

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1 | tee android-build-tools-dir.txt
          test -s android-build-tools-dir.txt

      - uses: gradle/actions/setup-gradle@v4

      - name: Run canonical segment and card regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest             --tests 'br.com.mapeiaia.rotacerta.trips.SegmentAvailabilityCards0580Test'             --tests 'br.com.mapeiaia.rotacerta.trips.TripSegmentSeatSync0292Test'             --tests 'br.com.mapeiaia.rotacerta.trips.TripUnifiedOccupancyStage47R4Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PublicAgendaSegments0311Test'             --tests 'br.com.mapeiaia.rotacerta.trips.TimelineAgendaCardParity0549Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PublicAgendaAutoSync0300Test'             --no-daemon --max-workers=1 --no-parallel --stacktrace | tee segment-availability-tests.log

      - name: Assemble exact debug APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace | tee assemble-debug.log
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee aapt-badging.txt
          grep -q "package: name='br.com.mapeiaia.rotacerta'" aapt-badging.txt
          grep -q "versionCode='5871'" aapt-badging.txt
          grep -q "versionName='0.1.580'" aapt-badging.txt
          cp "$APK" rota-certa-0.1.580-agenda-segment-availability.apk
          stat -c '%s' rota-certa-0.1.580-agenda-segment-availability.apk | tee apk-size-bytes.txt
          sha256sum rota-certa-0.1.580-agenda-segment-availability.apk | tee apk-sha256.txt

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.580-agenda-segment-availability-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            rota-certa-0.1.580-agenda-segment-availability.apk
            validated-source-head.txt
            public-agenda-segment-tests.log
            segment-availability-tests.log
            assemble-debug.log
            apksigner.txt
            aapt-badging.txt
            apk-size-bytes.txt
            apk-sha256.txt
            app/build/reports/tests/testDebugUnitTest

      - name: Confirm exact SHA artifact publication
        shell: bash
        run: |
          set -euo pipefail
          test -s rota-certa-0.1.580-agenda-segment-availability.apk
          test -s apk-sha256.txt
          test -s validated-source-head.txt
          test "$(cat validated-source-head.txt)" = "$GITHUB_SHA"
          echo "APK published for exact SHA $GITHUB_SHA"
