name: Stage47 one-shot apply harvester recovery

on:
  pull_request:
    branches:
      - agent/stage47-r4-unified-occupancy-step6-validation-apk
    paths:
      - .github/workflows/stage47-apply-harvester-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-focused-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current branch HEAD directly
        uses: actions/checkout@v4
        with:
          ref: agent/stage47-r4-step7-automatic-identity
          fetch-depth: 0
      - name: Apply only the proven harvester fix
        shell: bash
        run: |
          set -euo pipefail
          TARGET='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaManualSeatAutomation.kt'
          PATCH='.github/patches/stage47-harvester-recovery.patch'
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          EXPECTED_FAROL='2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560'
          BEFORE_FAROL="$(sha256sum "$FAROL" | awk '{print $1}')"
          test "$BEFORE_FAROL" = "$EXPECTED_FAROL"
          git apply --check "$PATCH"
          git apply "$PATCH"
          grep -q 'HARVEST_EVALUATION_TIMEOUT' "$TARGET"
          grep -q 'HARVEST_USER_BACK_RECOVERY' "$TARGET"
          grep -q 'EVALUATION_TIMEOUT_MS = 6_000L' "$TARGET"
          grep -q 'trip.passenger_roster_complete ||' "$TARGET"
          AFTER_FAROL="$(sha256sum "$FAROL" | awk '{print $1}')"
          test "$AFTER_FAROL" = "$EXPECTED_FAROL"
          mapfile -t CHANGED < <(git status --porcelain | sed 's/^...//')
          test "${#CHANGED[@]}" -eq 1
          test "${CHANGED[0]}" = "$TARGET"
          git diff --check -- "$TARGET"
      - name: Commit persisted app source only
        shell: bash
        run: |
          set -euo pipefail
          TARGET='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaManualSeatAutomation.kt'
          git config user.name 'kelaplicativos-rgb'
          git config user.email 'kel.aplicativos@gmail.com'
          git add -- "$TARGET"
          git diff --cached --check
          git commit -m 'fix(stage47): recover stalled harvester reads without losing cards'
          git push origin HEAD:agent/stage47-r4-step7-automatic-identity
