name: Verify Agenda scripts hub 0.1.560

on:
  push:
    branches:
      - agent/agenda-scripts-hub-0.1.560
  workflow_dispatch:

concurrency:
  group: agenda-scripts-hub-01560-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test integrated scripts flow
        run: |
          ./gradlew testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaScriptsHub0560Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaTripScriptExecutor0558Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalTripState0395Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TimelineLocalPrimary0525Test'

      - name: Verify single launcher and integrated Scripts route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          android = '{http://schemas.android.com/apk/res/android}'
          manifest_path = Path('app/src/main/AndroidManifest.xml')
          root = ET.parse(manifest_path).getroot()
          app = root.find('application')
          launchers = []
          for activity in app.findall('activity'):
              for intent_filter in activity.findall('intent-filter'):
                  actions = {node.get(android + 'name') for node in intent_filter.findall('action')}
                  categories = {node.get(android + 'name') for node in intent_filter.findall('category')}
                  if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in categories:
                      launchers.append(activity.get(android + 'name'))
          assert launchers == ['.MainActivity'], f'exactly MainActivity must be launcher; found {launchers}'
          nav = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaHeaderNavigation0396.kt').read_text()
          hub = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaScriptsHubActivity0560.kt').read_text()
          manifest = manifest_path.read_text()
          assert '.trips.AgendaScriptsHubActivity0560' in manifest, 'Scripts hub activity missing from manifest'
          assert 'AgendaScriptsHubActivity0560::class.java' in nav, 'Trips drawer does not route Scripts to hub'
          for label in ['Executor', 'Em andamento', 'Histórico', 'Navegador', 'Diagnóstico']:
              assert label in hub, f'missing Scripts submenu: {label}'
          PY

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-agenda-scripts-hub-0.1.560-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
