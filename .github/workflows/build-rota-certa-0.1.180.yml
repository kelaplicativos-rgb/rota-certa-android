name: Build Rota Certa 0.1.180

on:
  push:
    branches: [agent/per-shortcut-gesture-menu-0.1.180]
    paths:
      - .github/workflows/build-rota-certa-0.1.180.yml
      - scripts/build_rota_certa_0180.sh
      - scripts/fix_per_shortcut_gestures_0180.py.part00
      - scripts/fix_per_shortcut_gestures_0180.py.part01
      - scripts/fix_per_shortcut_gestures_0180.py.part02
      - scripts/fix_per_shortcut_gestures_0180.py.part03
  pull_request:
    branches: [agent/customizable-shortcut-grid-0.1.179]
    paths:
      - .github/workflows/build-rota-certa-0.1.180.yml
      - scripts/build_rota_certa_0180.sh
      - scripts/fix_per_shortcut_gestures_0180.py.part00
      - scripts/fix_per_shortcut_gestures_0180.py.part01
      - scripts/fix_per_shortcut_gestures_0180.py.part02
      - scripts/fix_per_shortcut_gestures_0180.py.part03
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-0180
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: codex/unified-debug-log-0.1.139
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Checkout cumulative patches
        uses: actions/checkout@v4
        with:
          ref: agent/per-shortcut-gesture-menu-0.1.180
          fetch-depth: 0
          persist-credentials: false
          path: patches

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test, lint and validate 0.1.180
        id: validate
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          bash ../patches/scripts/build_rota_certa_0180.sh ../patches 2>&1 | tee ../build-0.1.180.log

      - name: Upload validated APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.180-per-shortcut-gesture-menu-validated
          path: source/artifact-0.1.180/
          retention-days: 90
          if-no-files-found: error

      - name: Report validation on PR 50
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_OUTCOME: ${{ steps.validate.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          tail -n 100 build-0.1.180.log > build-tail-0.1.180.txt 2>/dev/null || true
          {
            echo "### Validação automática 0.1.180"
            echo
            echo "- Resultado da etapa principal: **${STEP_OUTCOME}**"
            echo "- Run: \`${RUN_ID}\`, tentativa \`${RUN_ATTEMPT}\`"
            echo "- SHA: \`${HEAD_SHA}\`"
            echo "- Link: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
            echo
            echo '<details><summary>Trecho final do log</summary>'
            echo
            echo '```text'
            cat build-tail-0.1.180.txt
            echo '```'
            echo '</details>'
          } > validation-comment-0.1.180.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/50/comments" \
            --method POST \
            --input validation-comment-0.1.180.md
