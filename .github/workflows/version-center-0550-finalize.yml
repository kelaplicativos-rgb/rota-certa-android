name: Version Center 0.1.550 finalize

on:
  push:
    branches: [agent/version-center-0.1.550]
    paths:
      - '.github/workflows/version-center-0550-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-center-0550-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/version-center-0.1.550

      - name: Prove version-center baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'val releaseVersionCode = 5_842' app/build.gradle.kts
          grep -Fq 'val releaseVersionName = "0.1.550"' app/build.gradle.kts
          grep -Fq 'dependsOn(verifyReleaseHistory)' app/build.gradle.kts
          grep -Fq '"version": "0.1.550"' app/src/main/assets/release_history.json
          grep -Fq '"build": 5842' app/src/main/assets/release_history.json
          grep -Fq 'BuildConfig → AppBuildInfo' app/src/main/java/br/com/mapeiaia/rotacerta/versioncenter/VersionCenterCard.kt
          grep -Fq 'Modifier.weight(1f)' app/src/main/java/br/com/mapeiaia/rotacerta/versioncenter/VersionCenterCard.kt
          grep -Fq 'import androidx.compose.foundation.layout.weight' app/src/main/java/br/com/mapeiaia/rotacerta/versioncenter/VersionCenterCard.kt
          test -s app/src/test/java/br/com/mapeiaia/rotacerta/versioncenter/VersionHistoryLogicTest.kt
          test -s .github/scripts/version_center_0550_materialize.py

      - name: Materialize About integration surgically
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/version_center_0550_materialize.py
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != 'app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt' ]]; then
            printf 'Unexpected materializer changes:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          grep -Fq 'br.com.mapeiaia.rotacerta.versioncenter.VersionCenterCard()' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          if grep -A30 -F 'private fun AboutRotaCertaCard() {' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt | grep -Fq 'Copiar informações da versão'; then
            echo 'Legacy About body still present after materialization.' >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Compile debug APK before commit
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Commit tested source and remove temporary machinery
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          git rm .github/scripts/version_center_0550_materialize.py .github/workflows/version-center-0550-finalize.yml
          git diff --cached --check
          git commit -m 'feat(version-center): integrate About center 0.1.550'
          git push origin HEAD:agent/version-center-0.1.550
          final_sha="$(git rev-parse HEAD)"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$final_sha" | tee /tmp/version-center-final-sha.txt

      - name: Rebuild APK with final source identity
        shell: bash
        env:
          ROTA_CERTA_GIT_SHA: ${{ steps.source.outputs.final_sha }}
          ROTA_CERTA_GIT_BRANCH: agent/version-center-0.1.550
        run: |
          set -euo pipefail
          ./gradlew :app:clean :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /tmp/version-center-apk.sha256

      - name: Build evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/version-center-0550
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/version-center-0550/rota-certa-0.1.550-debug.apk
          cp /tmp/version-center-apk.sha256 /tmp/version-center-0550/apk.sha256
          cp /tmp/version-center-final-sha.txt /tmp/version-center-0550/source-head.txt
          printf '%s\n' \
            'versionName=0.1.550' \
            'versionCode=5842' \
            'semanticSource=app/src/main/assets/release_history.json' \
            'objectiveBuildMetadata=BuildConfig->AppBuildInfo' \
            'aboutIntegration=VersionCenterCard' \
            'unitTests=passed' \
            'lintOutcome=${{ steps.lint.outcome }}' \
            > /tmp/version-center-0550/evidence.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-version-center-0.1.550-${{ steps.source.outputs.final_sha }}
          path: /tmp/version-center-0550
          retention-days: 14
