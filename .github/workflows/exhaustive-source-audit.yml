name: Exhaustive Source Audit

on:
  workflow_dispatch:
  push:
    branches:
      - codex/exhaustive-source-audit-20260726

permissions:
  contents: read

concurrency:
  group: exhaustive-source-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

jobs:
  audit:
    name: Audit every tracked file and materialized source
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Record immutable audit target
        run: |
          set -euo pipefail
          mkdir -p audit/meta audit/logs audit/diffs
          git rev-parse HEAD | tee audit/meta/audited-commit.txt
          git rev-parse --abbrev-ref HEAD | tee audit/meta/audited-branch.txt
          git status --short | tee audit/meta/status-at-start.txt
          git ls-files | sort > audit/meta/tracked-files.txt
          git ls-files -z | xargs -0 -r sha256sum > audit/meta/tracked-sha256-at-start.txt

      - name: Audit repository before Gradle mutation
        run: |
          set -euo pipefail
          python3 scripts/exhaustive_source_audit.py \
            --phase before-gradle \
            --output audit/before
          gzip -9 audit/before/full-text-index.txt
          gzip -9 audit/before/source-catalog.md

      - name: Materialize preBuild patches
        continue-on-error: true
        run: |
          set +e
          gradle :app:preBuild --no-daemon --stacktrace --console=plain > audit/logs/prebuild.log 2>&1
          status=$?
          echo "$status" > audit/meta/prebuild-exit-code.txt
          exit "$status"

      - name: Audit repository after preBuild
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/exhaustive_source_audit.py \
            --phase after-prebuild \
            --include-untracked \
            --compare-inventory audit/before/inventory.json \
            --output audit/after-prebuild
          gzip -9 audit/after-prebuild/full-text-index.txt
          gzip -9 audit/after-prebuild/source-catalog.md
          git status --short > audit/diffs/status-after-prebuild.txt
          git diff --stat > audit/diffs/diff-after-prebuild.stat.txt
          git diff --numstat > audit/diffs/diff-after-prebuild.numstat.tsv
          git diff --binary > audit/diffs/diff-after-prebuild.patch
          git ls-files --others --exclude-standard | sort > audit/diffs/untracked-after-prebuild.txt

      - name: Run unit tests
        continue-on-error: true
        run: |
          set +e
          gradle :app:testDebugUnitTest --no-daemon --stacktrace --console=plain > audit/logs/unit-tests.log 2>&1
          status=$?
          echo "$status" > audit/meta/unit-tests-exit-code.txt
          exit "$status"

      - name: Run Android Lint
        continue-on-error: true
        run: |
          set +e
          gradle :app:lintDebug --no-daemon --stacktrace --console=plain > audit/logs/lint.log 2>&1
          status=$?
          echo "$status" > audit/meta/lint-exit-code.txt
          exit "$status"

      - name: Assemble debug APK
        continue-on-error: true
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain > audit/logs/assemble.log 2>&1
          status=$?
          echo "$status" > audit/meta/assemble-exit-code.txt
          exit "$status"

      - name: Audit final source tree actually used by compilation
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/exhaustive_source_audit.py \
            --phase after-build \
            --include-untracked \
            --compare-inventory audit/before/inventory.json \
            --output audit/after-build
          gzip -9 audit/after-build/full-text-index.txt
          gzip -9 audit/after-build/source-catalog.md
          git status --short > audit/diffs/status-after-build.txt
          git diff --stat > audit/diffs/diff-after-build.stat.txt
          git diff --numstat > audit/diffs/diff-after-build.numstat.tsv
          git diff --binary > audit/diffs/diff-after-build.patch
          git ls-files --others --exclude-standard | sort > audit/diffs/untracked-after-build.txt

      - name: Collect test, Lint and APK evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p audit/evidence
          find app/build/test-results -type f -maxdepth 5 -print 2>/dev/null | sort > audit/evidence/test-result-files.txt || true
          find app/build/reports -type f -maxdepth 6 -print 2>/dev/null | sort > audit/evidence/report-files.txt || true
          find app/build/outputs -type f -maxdepth 8 -print 2>/dev/null | sort > audit/evidence/output-files.txt || true
          cp -R app/build/test-results audit/evidence/ 2>/dev/null || true
          cp -R app/build/reports audit/evidence/ 2>/dev/null || true
          cp -R app/build/outputs/lint-results-debug.* audit/evidence/ 2>/dev/null || true
          apk='app/build/outputs/apk/debug/app-debug.apk'
          if [ -f "$apk" ]; then
            sha256sum "$apk" > audit/evidence/apk-sha256.txt
            wc -c "$apk" > audit/evidence/apk-size.txt
            unzip -l "$apk" > audit/evidence/apk-files.txt
            unzip -t "$apk" > audit/evidence/apk-integrity.txt
            build_tools="${ANDROID_HOME}/build-tools/35.0.0"
            "$build_tools/aapt" dump badging "$apk" > audit/evidence/apk-badging.txt
            "$build_tools/apksigner" verify --verbose --print-certs "$apk" > audit/evidence/apk-signature.txt
            cp "$apk" audit/evidence/rota-certa-audited-debug.apk
          fi

      - name: Generate consolidated executive report
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('audit')
          before = json.loads((root/'before/summary.json').read_text())
          pre = json.loads((root/'after-prebuild/summary.json').read_text())
          final = json.loads((root/'after-build/summary.json').read_text())
          def status(name):
              path = root/f'meta/{name}-exit-code.txt'
              return path.read_text().strip() if path.exists() else 'not-run'
          lines = [
              '# Rota Certa — exhaustive source audit', '',
              f"- Audited commit: `{before['git_head']}`",
              f"- Audit branch: `{before['git_branch']}`",
              f"- Tracked files before Gradle: **{before['tracked_files']}**",
              f"- Total lines before Gradle: **{before['lines']}**",
              f"- Total bytes before Gradle: **{before['bytes']}**",
              f"- Text/binary files: **{before['text_files']} / {before['binary_files']}**",
              f"- Static findings before Gradle: **{before['findings']}**",
              f"- Gradle mutation scripts detected: **{before['gradle_mutation_scripts']}**",
              '', '## Materialization', '',
              f"- Files after preBuild: **{pre['files']}**",
              f"- Files after complete build: **{final['files']}**",
              f"- preBuild exit code: `{status('prebuild')}`",
              f"- Unit tests exit code: `{status('unit-tests')}`",
              f"- Lint exit code: `{status('lint')}`",
              f"- Assemble exit code: `{status('assemble')}`",
              '', '## Deliverables', '',
              '- `before/`: every tracked file inventoried before Gradle.',
              '- `after-prebuild/`: every tracked/untracked file inventoried after patch materialization.',
              '- `after-build/`: final source tree after tests, Lint and APK compilation.',
              '- `full-text-index.txt.gz`: every non-sensitive text file with every line numbered.',
              '- `inventory.tsv/json`: path, bytes, lines, hashes, delimiters and formatting metadata.',
              '- `source-catalog.md.gz`: file-by-file declarations and findings.',
              '- `findings.tsv/json`: line-numbered static findings.',
              '- `gradle-patch-map.tsv`: scripts that write/replace/apply source code.',
              '- `diffs/`: exact source changes caused by Gradle.',
              '- `logs/`: complete Gradle logs.',
              '- `evidence/`: test, Lint, APK content, integrity and signature evidence.',
              '',
              'Sensitive credential-like files are inventoried by path, size and SHA-256, but their raw content is omitted from the line-numbered index.',
          ]
          (root/'AUDIT-REPORT.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY

      - name: Upload exhaustive audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-exhaustive-source-audit
          path: audit/
          if-no-files-found: error
          retention-days: 30
