name: Agenda public frozen baseline 0.1.482

on:
  push:
    branches:
      - agent/agenda-expandable-itinerary-0.1.480
    paths:
      - 'trip-platform/public/**'
      - 'trip-platform/firebase.json'
      - 'trip-platform/firestore.rules'
      - 'trip-platform/functions/index.js'
      - 'trip-platform/functions/test/agenda-date-year-contract-0482.test.js'
      - 'trip-platform/functions/test/agenda-card-visual-parity-0473.test.js'
      - 'trip-platform/functions/test/agenda-public-read-only-0475.test.js'
      - 'trip-platform/functions/test/agenda-public-timeline-reflection-0425.test.js'
      - '.github/scripts/verify-agenda-public-freeze-0482.sh'
      - '.github/validation/agenda-public-0482-freeze.manifest'
      - '.github/validation/agenda-date-year-0482-contract.txt'
      - '.github/workflows/agenda-date-year-regression-guard-0482.yml'
  pull_request:
    paths:
      - 'trip-platform/public/**'
      - 'trip-platform/firebase.json'
      - 'trip-platform/firestore.rules'
      - 'trip-platform/functions/index.js'
      - 'trip-platform/functions/test/agenda-date-year-contract-0482.test.js'
      - 'trip-platform/functions/test/agenda-card-visual-parity-0473.test.js'
      - 'trip-platform/functions/test/agenda-public-read-only-0475.test.js'
      - 'trip-platform/functions/test/agenda-public-timeline-reflection-0425.test.js'
      - '.github/scripts/verify-agenda-public-freeze-0482.sh'
      - '.github/validation/agenda-public-0482-freeze.manifest'
      - '.github/validation/agenda-date-year-0482-contract.txt'
      - '.github/workflows/agenda-date-year-regression-guard-0482.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-surface-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enforce physically approved public freeze before any deploy
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/verify-agenda-public-freeze-0482.sh

      - name: Enforce canonical read-only and date contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            trip-platform/functions/test/agenda-date-year-contract-0482.test.js \
            trip-platform/functions/test/agenda-card-visual-parity-0473.test.js \
            trip-platform/functions/test/agenda-public-read-only-0475.test.js \
            trip-platform/functions/test/agenda-public-timeline-reflection-0425.test.js
