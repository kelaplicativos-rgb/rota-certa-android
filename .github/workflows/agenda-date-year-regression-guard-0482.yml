name: Agenda date-year regression guard 0.1.482

on:
  push:
    branches:
      - agent/agenda-expandable-itinerary-0.1.480
    paths:
      - 'trip-platform/public/app.js'
      - 'trip-platform/public/index.html'
      - 'trip-platform/functions/test/agenda-date-year-contract-0482.test.js'
      - 'trip-platform/functions/test/agenda-card-visual-parity-0473.test.js'
      - 'trip-platform/functions/test/agenda-public-read-only-0475.test.js'
      - '.github/validation/agenda-date-year-0482-contract.txt'
      - '.github/workflows/agenda-date-year-regression-guard-0482.yml'
  pull_request:
    branches:
      - agent/agenda-expandable-itinerary-0.1.480
    paths:
      - 'trip-platform/public/app.js'
      - 'trip-platform/public/index.html'
      - 'trip-platform/functions/test/agenda-date-year-contract-0482.test.js'
      - 'trip-platform/functions/test/agenda-card-visual-parity-0473.test.js'
      - 'trip-platform/functions/test/agenda-public-read-only-0475.test.js'
      - '.github/validation/agenda-date-year-0482-contract.txt'
      - '.github/workflows/agenda-date-year-regression-guard-0482.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  date-year-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enforce public date-year contract
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/public/app.js
          grep -Fq 'physicalApprovedSha=a6a76fc2122928bbbd4dad747027b24656895c18' .github/validation/agenda-date-year-0482-contract.txt
          grep -Fq 'compactOtherYear=YEAR_REQUIRED' .github/validation/agenda-date-year-0482-contract.txt
          grep -Fq 'expandedDate=FULL_YEAR_REQUIRED' .github/validation/agenda-date-year-0482-contract.txt
          node --test \
            trip-platform/functions/test/agenda-date-year-contract-0482.test.js \
            trip-platform/functions/test/agenda-card-visual-parity-0473.test.js \
            trip-platform/functions/test/agenda-public-read-only-0475.test.js
