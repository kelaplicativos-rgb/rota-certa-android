name: Agenda 0.1.297 deploy retry

on:
  push:
    branches:
      - agent/agenda-public-link-self-heal-0.1.297
    paths:
      - '.github/workflows/agenda-0297-deploy-retry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agenda-public-link-self-heal-0.1.297

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "Firebase service account secret is missing."
            exit 3
          fi

      - name: Install Functions dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix trip-platform/functions install --no-audit --no-fund

      - name: Deploy trip API
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api --non-interactive

      - name: Smoke production health
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 8 --retry-delay 5 --fail --silent --show-error https://rota-certa-7ccc8.web.app/v1/health | tee /tmp/health.json
          grep -Fq '"ok":true' /tmp/health.json
          grep -Fq '"service":"rota-certa-trips"' /tmp/health.json
