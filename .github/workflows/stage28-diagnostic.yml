name: Stage28 temporary compile diagnostics

on:
  push:
    branches:
      - agent/stage28-causal-latency-stale-activation-0.1.205
    paths:
      - '.github/workflows/stage28-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout protected canonical source
        uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          path: source
          fetch-depth: 1
      - name: Checkout Stage28 branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage28-causal-latency-stale-activation-0.1.205
          path: patches
          fetch-depth: 1
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Rebuild Stage18 through Stage28
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p bootstrap evidence
          gh run download 31612053591 --repo kelaplicativos-rgb/rota-certa-android --name rota-certa-stage19-materialized-stage18-source --dir bootstrap
          TGZ="$(find bootstrap -name stage18-materialized-source.tgz -print -quit)"
          test "$(sha256sum "$TGZ" | awk '{print $1}')" = "b6a81198842bdba9aa38fc6ec8643e4ec24bce4449e01ecc28f16940c4c977a7"
          rm -rf source/app/src/main/java source/app/src/test/java
          tar -xzf "$TGZ" -C source
          cat > source/app/src/main/res/xml/rota_certa_accessibility.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewTextChanged|typeWindowsChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="100" />
          XML
          python patches/scripts/apply_universal_visual_pipeline_stage19.py source
          python patches/scripts/apply_farol_forensic_causality_stage20.py source
          python patches/scripts/apply_farol_causal_corrections_stage21.py source
          python patches/scripts/apply_farol_visual_identity_stage23.py source
          python patches/scripts/apply_farol_reading_activation_stage26_materialized.py source
          python patches/scripts/apply_farol_causal_latency_stage28_v2.py source
      - name: Capture Stage28 Gradle diagnostics
        id: gradle
        continue-on-error: true
        working-directory: source
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest --tests br.com.mapeiaia.rotacerta.FarolCausalLatencyStage28Test --stacktrace --info 2>&1 | tee ../evidence/stage28-gradle-diagnostic.log
          STATUS=${PIPESTATUS[0]}
          echo "$STATUS" > ../evidence/gradle-exit-code.txt
          exit "$STATUS"
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage28-temporary-gradle-diagnostics
          path: evidence/
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failure status
        if: steps.gradle.outcome == 'failure'
        run: exit 1
