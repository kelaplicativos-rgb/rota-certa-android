name: Rota Certa Agenda admin observability MATCH 0.1.417

on:
  push:
    branches:
      - agent/agenda-admin-observability-match-0.1.417
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-admin-observability-match-0417-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GOOGLE_MAPS_API_KEY: agenda_0417_ci_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify source identity and protected scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          grep -Fq 'versionCode = 5710' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.417"' app/build.gradle.kts
          printf '%s\n' "${{ github.sha }}" > source_head.txt
          printf '%s\n' "${{ github.ref_name }}" > source_branch.txt
          git diff --name-only b71af5ce0b8436dba398f1b8296c2c9725e10d1a...HEAD > changed-files.txt
          if grep -Eq 'LiveRideAccessibilityService\.kt|FarolNotification|Farol' changed-files.txt; then
            echo "Protected FAROL scope changed unexpectedly."
            cat changed-files.txt
            exit 4
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate backend and public administration contracts
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix trip-platform/functions install --no-audit --no-fund
          node --check trip-platform/functions/index.js
          node --check trip-platform/functions/agenda-admin-0417.js
          node --check trip-platform/public/app.js
          node --check trip-platform/public/admin-0417.js
          node --test trip-platform/functions/test/agenda-admin-observability-0417.test.js
          node --test trip-platform/functions/test/public-capacity-fidelity-0303.test.js
          node --test trip-platform/functions/test/public-combined-capacity-0369.test.js

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - name: Set up Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Run focused Android contracts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaAdminObservability0417Test'             --tests 'br.com.mapeiaia.rotacerta.trips.PublicMirrorAttestation0411Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaNavigationNotificationsProfiles0416Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaGlobalNotificationBubble0416Test'             --tests 'br.com.mapeiaia.rotacerta.trips.AgendaCanonicalTripState0395Test'             --tests 'br.com.mapeiaia.rotacerta.trips.TripUnifiedInventory0372Test'             --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Compile all debug unit tests
        run: ./gradlew :app:compileDebugUnitTestKotlin --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Assemble exact SHA APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test "$(git rev-parse HEAD)" = "$(cat source_head.txt)"
          sha256sum app/build/outputs/apk/debug/app-debug.apk > apk.sha256
          grep -E 'version(Code|Name) = ' app/build.gradle.kts > app-version.txt

      - name: Configure Firebase deployment authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-deploy-sa.json
            chmod 600 /tmp/firebase-deploy-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-deploy-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-deploy-sa.json
            chmod 600 /tmp/firebase-deploy-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-deploy-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase credential is missing."
            exit 3
          fi

      - name: Deploy exact SHA Agenda backend and hosting
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force
          fi

      - name: Smoke live administration and MATCH contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://rota-certa-7ccc8.web.app
          curl --retry 8 --retry-delay 3 --fail --silent --show-error "$BASE/v1/health" | tee /tmp/health.json
          grep -Fq '"ok":true' /tmp/health.json
          CODE="$(curl --retry 4 --retry-delay 2 --silent --show-error -o /tmp/admin-probe.json -w '%{http_code}' "$BASE/v1/admin/overview")"
          test "$CODE" = "401"
          BUST="$(date +%s%N)"
          curl --retry 8 --retry-delay 3 --fail --silent --show-error "$BASE/admin-0417.js?v=$BUST" -o /tmp/live-admin.js
          grep -Fq 'X-Rota-Certa-Admin-Session' /tmp/live-admin.js
          grep -Fq 'admin_update_now' trip-platform/functions/agenda-admin-0417.js
          grep -Fq 'public-attestation' trip-platform/functions/index.js
          echo "LIVE_ADMIN_MATCH_CONTRACT=PASS"
          echo "SOURCE_HEAD=${{ github.sha }}"

      - name: Upload exact SHA APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.417-agenda-admin-match-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            source_head.txt
            source_branch.txt
            app-version.txt
            apk.sha256
            changed-files.txt
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
