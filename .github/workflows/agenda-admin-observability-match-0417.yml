name: Rota Certa 0.1.450 BlaBlaCar public URL attestation

on:
  push:
    branches:
      - agent/blablacar-public-url-attestation-0.1.450
  pull_request:
    branches:
      - agent/blablacar-orchestrator-ui-0.1.449
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blablacar-public-url-attestation-0450-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: orchestrator_0449_ci_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify lineage version UI contract and protected FAROL
        shell: bash
        run: |
          set -euo pipefail
          BASE=cd43f0dc4c73ff3bd5735266815786a2d835e3a1
          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref || github.ref_name }}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$BASE" HEAD
          grep -Fq 'versionCode = 5743' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.450"' app/build.gradle.kts
          test -f app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDateScopeScriptSelection0449.kt
          grep -Fq 'dateScopeSelectedAccountIds0449' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq 'BlaBlaDateScopeScriptCatalog0449.groups.forEach' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq 'group.requests.forEach' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq '32 scripts registrados • 22 CAPTURE • 8 NAVIGATION • 2 REMOTE_WRITE' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq 'check(selectableRequests.size == 32)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDateScopeScriptSelection0449.kt
          grep -Fq 'Text("Só vagas")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq 'Text("URL pública")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripBlaBlaCollectorUi.kt
          grep -Fq 'EXTRA_ENABLED_SCRIPTS_0449' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          grep -Fq 'selectiveScriptSync0449' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaCollectorSessionModule.kt
          git diff --name-only "$BASE"..HEAD | tee /tmp/changed-files.txt
          if git diff --name-only "$BASE"..HEAD | grep -Eq 'LiveRideAccessibilityService\.kt|FarolNotification|Farol'; then
            echo "Protected FAROL scope changed unexpectedly."
            exit 4
          fi
          printf '%s\n' "$SOURCE_SHA" > /tmp/source-head.txt
          printf '%s\n' "$SOURCE_BRANCH" > /tmp/source-branch.txt

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate canonical public URL backend contracts
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix trip-platform/functions install --no-audit --no-fund
          node --check trip-platform/functions/index.js
          node --check trip-platform/functions/agenda-admin-0417.js
          node --test trip-platform/functions/test/agenda-public-timeline-reflection-0425.test.js
          node --test trip-platform/functions/test/agenda-readback-forensics-0421.test.js
          node --test trip-platform/functions/test/agenda-admin-observability-0417.test.js
          node --test trip-platform/functions/test/public-blablacar-link-0409.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Focused orchestrator regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          export ROTA_CERTA_GIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          export ROTA_CERTA_GIT_BRANCH="${{ github.event.pull_request.head.ref || github.ref_name }}"
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaOrchestratorScriptSelection0449Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaDatePeriodSync0377Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaCaptureOrchestrator0368Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaNetworkPublicLink0423Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaPublicLinkCanonical0409Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PublicMirrorAttestation0411Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaReadbackForensics0421Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaPrivateMirror0434Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaAdminObservability0417Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaHeadlessCollector0401Test.sourceAccessProbeIsBoundedSoExactTripCannotHangAfterPageFinished' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaTemporaryRestriction0426Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Compile lint and assemble exact SHA
        shell: bash
        run: |
          set -euo pipefail
          export ROTA_CERTA_GIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          export ROTA_CERTA_GIT_BRANCH="${{ github.event.pull_request.head.ref || github.ref_name }}"
          ./gradlew :app:compileDebugUnitTestKotlin --no-daemon --max-workers=1 --no-parallel --stacktrace
          ./gradlew :app:lintDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace

          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta'" /tmp/aapt.txt
          grep -Fq "versionCode='5743'" /tmp/aapt.txt
          grep -Fq "versionName='0.1.450'" /tmp/aapt.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -Fq "${{ github.event.pull_request.head.sha || github.sha }}" /tmp/dex-strings.txt
          sha256sum "$APK" > /tmp/apk.sha256

      - name: Configure Firebase deployment authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-deploy-sa.json
            chmod 600 /tmp/firebase-deploy-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-deploy-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-deploy-sa.json
            chmod 600 /tmp/firebase-deploy-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-deploy-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase credential is missing."
            exit 3
          fi

      - name: Deploy exact SHA Agenda service
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api --non-interactive --force --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api --non-interactive --force
          fi

      - name: Live Agenda health smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://rota-certa-7ccc8.web.app
          curl --retry 8 --retry-delay 3 --fail --silent --show-error "$BASE/v1/health" | tee /tmp/health.json
          grep -Fq '"ok":true' /tmp/health.json
          grep -Fq 'normalizeCanonicalBoundBlaBlaPublicUrl0423' trip-platform/functions/index.js
          grep -Fq 'PUBLIC_URL_PRECONDITION' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicMirrorAttestationCoordinator0411.kt
          echo "BLABLACAR_PUBLIC_URL_ATTESTATION_0450_LIVE=PASS"
          echo "SOURCE_HEAD=${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Stage exact SHA artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/0450
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/0450/rota-certa-0.1.450-blablacar-public-url-attestation.apk
          cp /tmp/source-head.txt /tmp/0450/source-head.txt
          cp /tmp/source-branch.txt /tmp/0450/source-branch.txt
          cp /tmp/changed-files.txt /tmp/0450/changed-files.txt
          cp /tmp/apk.sha256 /tmp/0450/apk.sha256
          cp /tmp/aapt.txt /tmp/0450/aapt.txt
          cp /tmp/apksigner.txt /tmp/0450/apksigner.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.450-blablacar-public-url-attestation-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0450
