name: Validate Rota Certa 0.1.139

on:
  pull_request:
    branches:
      - codex/grid-double-tap-shortcuts-alerts
  push:
    branches:
      - codex/unified-debug-log-0.1.139
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-0-1-139-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepare evidence
        run: mkdir -p validation/logs validation/evidence

      - name: Verify unified diagnostic contract
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.1.139"' app/build.gradle.kts
          grep -q '4_000' app/build.gradle.kts
          grep -q 'Gerar relatório para depuração' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          grep -q 'Log de depuração' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          grep -q 'MAX_EVENTS = 2_000' app/src/main/java/br/com/mapeiaia/rotacerta/UnifiedDebugLog.kt
          grep -q 'ACCESSIBILITY_EVENT' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'ManualTechnicalReportBuilder.build' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          ! grep -q 'Gerar e baixar relatorio' app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt
          ! grep -RInE 'AIza[0-9A-Za-z_-]{20,}' app/src app/build.gradle.kts

      - name: Run unit tests twice with immutable sources
        run: |
          set -euo pipefail
          before="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          gradle clean testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee validation/logs/tests-first.log
          middle="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          gradle testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee validation/logs/tests-second.log
          after="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test "$before" = "$middle"
          test "$middle" = "$after"
          printf 'SOURCE_HASH=%s\n' "$after" > validation/evidence/source-tree-hash.txt

      - name: Run Android Lint
        run: gradle lintDebug --no-daemon --stacktrace --console=plain 2>&1 | tee validation/logs/lint.log

      - name: Build APK twice with immutable sources
        run: |
          set -euo pipefail
          before="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          gradle clean assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee validation/logs/assemble-first.log
          middle="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          cp app/build/outputs/apk/debug/app-debug.apk validation/evidence/rota-certa-0.1.139-first.apk
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee validation/logs/assemble-second.log
          after="$(find app/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test "$before" = "$middle"
          test "$middle" = "$after"
          cp app/build/outputs/apk/debug/app-debug.apk validation/evidence/rota-certa-0.1.139.apk
          unzip -tq validation/evidence/rota-certa-0.1.139.apk
          sha256sum validation/evidence/rota-certa-0.1.139.apk > validation/evidence/apk-sha256.txt

      - name: Validate package version and signature
        run: |
          set -euo pipefail
          APK=validation/evidence/rota-certa-0.1.139.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee validation/evidence/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee validation/evidence/aapt-badging.txt
          grep -q "package: name='br.com.mapeiaia.rotacerta'" validation/evidence/aapt-badging.txt
          grep -q "versionName='0.1.139'" validation/evidence/aapt-badging.txt
          VERSION_CODE="$(sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" validation/evidence/aapt-badging.txt | head -1)"
          test -n "$VERSION_CODE"
          test "$VERSION_CODE" -gt 3002
          printf 'VERSION_CODE=%s\n' "$VERSION_CODE" > validation/evidence/version.txt

      - name: Write validation report
        run: |
          cat > validation/evidence/final-validation.txt <<'EOF'
          VERSION_NAME=0.1.139
          DEBUG_LOG_ON_OFF=approved
          CIRCULAR_MEMORY_2000=approved
          CONTINUOUS_DISK_LOGGING=disabled
          SENSITIVE_DATA_MASKING=approved
          ACCESSIBILITY_EVENTS_BEFORE_FILTERS=approved
          SINGLE_REPORT_GENERATOR=approved
          OLD_REPORTS_UNIFIED=approved
          TESTS_TWICE=approved
          SOURCE_IMMUTABLE=approved
          LINT=approved
          APK_BUILT_TWICE=approved
          APK_SIGNATURE=approved
          EOF

      - name: Upload validated APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.139-validated
          path: |
            validation/evidence
            validation/logs
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: error

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.139-validation-failure
          path: |
            validation
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
