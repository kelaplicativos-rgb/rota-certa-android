name: Apply bubble actions once

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/apply-bubble-actions-once.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git show 3856309885b1df0e7e961254a6085ed2830ad510:.github/workflows/apply-bubble-actions-once.yml \
            | sed -n "/<<'PATCH64'/,/^PATCH64$/p" \
            | sed '1d;$d' \
            | base64 -d > /tmp/bubble-actions.patch
          git apply --check /tmp/bubble-actions.patch
          git apply /tmp/bubble-actions.patch
          rm .github/workflows/apply-bubble-actions-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt .github/workflows/apply-bubble-actions-once.yml
          git commit -m "Apply bubble quick actions and saved places"
          git push
