name: Runtime Bubble UI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - codex/pr5-stable-bubble-combined

permissions:
  contents: read

jobs:
  runtime-ui:
    name: Install, tap and verify bubbles on Android
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepare runtime evidence directory
        run: |
          mkdir -p runtime-ui
          echo "RUNTIME_STAGE=prepared" > runtime-ui/progress.txt
          echo "HEAD_SHA=${GITHUB_SHA}" >> runtime-ui/progress.txt

      - name: Build APK for runtime simulation
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: gradle assembleDebug --no-daemon --stacktrace --console=plain

      - name: Install Android emulator image
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-34;default;x86_64"
          echo no | avdmanager create avd --force --name rota-runtime --package "system-images;android-34;default;x86_64" --device pixel_2
          emulator -version > runtime-ui/emulator-version.txt 2>&1 || true

      - name: Start emulator and run real taps
        id: runtime
        continue-on-error: true
        env:
          RUNTIME_UI_DIR: runtime-ui
          RUNTIME_APK: app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euxo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm | tee runtime-ui/kvm.txt
          else
            echo "KVM_NOT_AVAILABLE" | tee runtime-ui/kvm.txt
          fi
          nohup emulator @rota-runtime \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            -accel auto \
            > runtime-ui/emulator.log 2>&1 &
          echo $! > runtime-ui/emulator.pid
          bash scripts/runtime_bubble_ui_test_bounded.sh

      - name: Upload real Android screenshots and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-bubble-ui-validation
          path: runtime-ui/
          if-no-files-found: error

      - name: Require successful runtime simulation
        if: always()
        run: |
          echo "Runtime action outcome: ${{ steps.runtime.outcome }}"
          test "${{ steps.runtime.outcome }}" = "success"
          test -f runtime-ui/runtime-validation.txt
          grep -Fq 'IN_APP_TOGGLE=approved' runtime-ui/runtime-validation.txt
          grep -Fq 'FLOATING_RUNTIME=approved' runtime-ui/runtime-validation.txt
          test -s runtime-ui/app-before.png
          test -s runtime-ui/app-after.png
          test -s runtime-ui/home-bubble.png
          test -s runtime-ui/floating-menu.png
