name: Runtime Bubble UI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - codex/pr5-stable-bubble-combined

permissions:
  contents: read

jobs:
  runtime-ui:
    name: Install, drag and verify resource shortcuts on Android
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepare runtime evidence directory
        run: |
          mkdir -p runtime-ui "$ANDROID_AVD_HOME"
          echo "RUNTIME_STAGE=prepared" > runtime-ui/progress.txt
          echo "HEAD_SHA=${GITHUB_SHA}" >> runtime-ui/progress.txt

      - name: Build APK for runtime simulation
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: gradle assembleDebug --no-daemon --stacktrace --console=plain

      - name: Install Android emulator image and libraries
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libpulse0 libgl1 libx11-6 libxcomposite1 libxcursor1 libxi6 libxtst6 libnss3
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-34;default;x86_64"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name rota_runtime --package "system-images;android-34;default;x86_64" --device pixel_2

      - name: Start emulator and run shortcut smoke test
        id: runtime
        continue-on-error: true
        env:
          RUNTIME_UI_DIR: runtime-ui
          RUNTIME_APK: app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -uo pipefail
          EMULATOR_BIN="$ANDROID_SDK_ROOT/emulator/emulator"
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm | tee runtime-ui/kvm.txt
          else
            echo "KVM_NOT_AVAILABLE" | tee runtime-ui/kvm.txt
          fi
          "$EMULATOR_BIN" @rota_runtime \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            -accel auto \
            > runtime-ui/emulator.log 2>&1 &
          emulator_pid=$!
          cleanup() {
            adb emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" >/dev/null 2>&1 || true
            wait "$emulator_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          set +e
          timeout --signal=TERM --kill-after=20s 480s bash scripts/runtime_bubble_shortcuts_smoke_117.sh > >(tee runtime-ui/runtime-script.log) 2>&1
          runtime_status=$?
          set -e
          echo "RUNTIME_SCRIPT_EXIT=$runtime_status" >> runtime-ui/progress.txt
          exit "$runtime_status"

      - name: Upload Android screenshots and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-bubble-shortcuts-validation
          path: runtime-ui/
          if-no-files-found: error

      - name: Require successful shortcut runtime simulation
        if: always()
        run: |
          echo "Runtime action outcome: ${{ steps.runtime.outcome }}"
          test "${{ steps.runtime.outcome }}" = "success"
          test -f runtime-ui/runtime-validation.txt
          grep -Fq 'INSTANT_DRAG=approved' runtime-ui/runtime-validation.txt
          grep -Fq 'DRAG_OPENED_HOME=false' runtime-ui/runtime-validation.txt
          grep -Fq 'MAIN_TAP=opened_resource_shortcuts' runtime-ui/runtime-validation.txt
          grep -Fq 'RESOURCE_SHORTCUTS=6' runtime-ui/runtime-validation.txt
          grep -Fq 'SHORTCUT_MENU=lightweight' runtime-ui/runtime-validation.txt
          grep -Fq 'SAVE_ALERT_ACTION=visible' runtime-ui/runtime-validation.txt
          grep -Fq 'SAVE_LOCAL_ACTION=visible' runtime-ui/runtime-validation.txt
          grep -Fq 'FLOATING_RUNTIME=approved' runtime-ui/runtime-validation.txt
          test -s runtime-ui/bubble-drag-response-ms.txt
          drag_ms="$(cat runtime-ui/bubble-drag-response-ms.txt)"
          test "$drag_ms" -le 1200
          test -s runtime-ui/shortcuts.png
