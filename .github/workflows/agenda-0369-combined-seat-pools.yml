name: Rota Certa 0.1.376 materialize and validate diagnostic evidence

on:
  push:
    branches:
      - agent/fix-public-sync-single-flight-0.1.373
  pull_request:
    branches:
      - agent/blablacar-capture-orchestrator-0.1.368
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agenda-combined-seat-pools-0369
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Materialize validated diagnostic tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "81fdb4f28139283584a68198d4a747c641e62d5e"
          git show 693e753f5670354fe8d210137a9e6bbf0b2148ca:.github/workflows/agenda-0369-combined-seat-pools.yml > .github/workflows/agenda-0369-combined-seat-pools.yml
          gzip -t .github/diag-0376.patch.gz
          gzip -dc .github/diag-0376.patch.gz > /tmp/diag0376.patch
          git apply --check -p2 /tmp/diag0376.patch
          git apply -p2 /tmp/diag0376.patch
          printf '%s' '' | base64 -d > /tmp/extra0376.patch
          git apply --check /tmp/extra0376.patch
          git apply /tmp/extra0376.patch
          rm -f .github/diag-0376.patch.gz .github/workflows/diag-0376-materialize.yml
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | awk '{print $1}')" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          grep -Fq 'versionCode = 5669' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.376"' app/build.gradle.kts
          test -f app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaFailureEvidence.kt
          test -f app/src/test/java/br/com/mapeiaia/rotacerta/trips/AgendaFailureEvidence0376Test.kt
          grep -Fq 'messageCaptured=true_sanitized_bounded' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace.kt
          ! grep -Fq 'messageCaptured=false' app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncCrashTrace.kt
          ! grep -Eq 'reason=\$\{[^}]*\.javaClass\.simpleName|exception=\$\{[^}]*\.javaClass\.simpleName' app/src/main/java/br/com/mapeiaia/rotacerta/trips/{AgendaTrace.kt,PublicAgendaAutoSync0300.kt,PublicBookingSync0296.kt,TripRemoteApi.kt,TripTimelineUi.kt}
          git config user.name "kelaplicativos-rgb"
          git config user.email "kel.aplicativos@gmail.com"
          git add -A
          git diff --cached --name-status
          git commit -m "diag: preserve public sync failure evidence"

      - name: Prove source, free-seat contract and FAROL isolation
        shell: bash
        run: |
          set -euo pipefail
          BASE=3533dfa1b2d54a863b07d42f43974242fcf94ccf
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          grep -Fq 'versionCode = 5669' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.376"' app/build.gradle.kts

          # Canonical rule: quota creates inventory; occupancy consumes it once per segment.
          grep -Fq 'bookingOccupancyIdentityKey' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt
          grep -Fq 'operationalInventoryCapacity' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt
          grep -Fq 'blablaQuotaSeats' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt
          grep -Fq 'rotaCertaQuotaSeats' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt
          ! grep -Fq 'externalConfirmedPeakSeats' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt
          grep -Fq 'capacitySource=blablacar_quota_plus_rota_certa_quota' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          ! grep -Fq 'blablacar_remaining_plus_external_peak_plus_rota_certa' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'source.published_seats?.takeIf { it in 0..999 }' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'Vagas disponibilizadas no Rota Certa' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          ! grep -Fq 'Capacidade de passageiros' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          ! grep -Fq 'Capacidade do veículo' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'prefs[rotaCertaSeatAllocation] ?: 0' app/src/main/java/br/com/mapeiaia/rotacerta/Repositories.kt
          ! grep -Fq 'prefs[rotaCertaSeatAllocation] ?: prefs[vehicleCapacity]' app/src/main/java/br/com/mapeiaia/rotacerta/Repositories.kt
          grep -Fq 'Inventário operacional' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'LOTADO' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'Total disponível' trip-platform/public/app.js
          grep -Fq 'blablaAvailableSeats' trip-platform/functions/index.js
          grep -Fq 'rotaCertaAvailableSeats' trip-platform/functions/index.js
          grep -Fq 'totalAvailableSeats' trip-platform/functions/index.js

          # Collection stays read-only in the normal synchronization path.
          grep -Fq 'AUTOMATIC_PUBLISHED_SEAT_LOOKUP: Boolean = true' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaHarvestPolicy.kt
          grep -Fq 'BlaBlaBrowserRequest.SEAT_OPTIONS' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          ! grep -Fq 'executeRemoteWrite(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          ! grep -Fq 'BlaBlaBrowserRequest.SEAT_CHANGE' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          ! grep -Fq 'BlaBlaBrowserRequest.SEAT_SAVE' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt

          # No return to the removed physical-capacity authority or double external write.
          ! grep -Fq 'combinedAgendaAvailableSeats' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          ! grep -Fq 'capacity = binding.capacity' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'externalSeatMutation=false' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicBookingSync0296.kt
          grep -Fq 'EXTERNAL_SEAT_WRITE_SKIPPED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaReliableSeatSync.kt
          test -f app/src/test/java/br/com/mapeiaia/rotacerta/trips/TripUnifiedInventory0372Test.kt
          test -f app/src/test/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaSyncRegression0373Test.kt
          test -f app/src/test/java/br/com/mapeiaia/rotacerta/trips/TripInventorySourceTruth0374Test.kt
          grep -Fq 'recordOrigin: TripRecordOrigin = TripRecordOrigin.LOCAL' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt
          grep -Fq '.filter(Trip::isCanonicalLocalPublishSource)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'Channel.CONFLATED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaSyncCoordinator0373.kt
          grep -Fq 'CAPACITY_PUBLIC_SYNC_IDENTICAL_SKIPPED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaSyncCoordinator0373.kt
          grep -Fq 'publicAgendaSyncCoordinator.request(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          ! grep -Fq 'TripApp.publicAgendaEffect' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'it.isCanonicalLocalPublishSource()' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicBookingSync0296.kt

          # FAROL remains outside this PR.
          test "$(git diff --name-only "$BASE"..HEAD -- app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt 'app/src/main/java/br/com/mapeiaia/rotacerta/Farol*.kt' | wc -l)" -eq 0
          git diff --name-only "$BASE"..HEAD | tee /tmp/changed-files.txt
          sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt > /tmp/farol.sha256

      - name: Public capacity backend regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test trip-platform/functions/test/public-search-capacity-0356.test.js
          node --test trip-platform/functions/test/public-capacity-fidelity-0303.test.js
          node --test trip-platform/functions/test/public-combined-capacity-0369.test.js
          node --test trip-platform/functions/test/public-incremental-capacity-0375.test.js
      - name: Configure Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          test -n "$APP_ID"
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and installable APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref || github.ref_name }}"
          export ROTA_CERTA_GIT_SHA="$SOURCE_SHA"
          export ROTA_CERTA_GIT_BRANCH="$SOURCE_BRANCH"
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace | tee /tmp/gradle.txt

          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cmp -s /tmp/farol.sha256 <(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt)
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta'" /tmp/aapt.txt
          grep -Fq "versionCode='5669'" /tmp/aapt.txt
          grep -Fq "versionName='0.1.376'" /tmp/aapt.txt

          mkdir -p /tmp/0376
          cp "$APK" /tmp/0376/rota-certa-0.1.376-public-sync-diagnostics.apk
          sha256sum /tmp/0376/rota-certa-0.1.376-public-sync-diagnostics.apk | tee /tmp/0376/apk.sha256
          cp /tmp/aapt.txt /tmp/0376/aapt.txt
          cp /tmp/apksigner.txt /tmp/0376/apksigner.txt
          cp /tmp/gradle.txt /tmp/0376/gradle.txt
          cp /tmp/changed-files.txt /tmp/0376/changed-files.txt
          cp /tmp/farol.sha256 /tmp/0376/farol.sha256
          git rev-parse HEAD > /tmp/0376/source-head.txt
          {
            echo "branch=$SOURCE_BRANCH"
            echo "commit=$SOURCE_SHA"
            echo "versionName=0.1.376"
            echo "versionCode=5669"
          } > /tmp/0376/build-metadata.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/0376/dex-strings.txt
          grep -Fq "$SOURCE_SHA" /tmp/0376/dex-strings.txt
          grep -Fq 'Sobre o Rota Certa' /tmp/0376/dex-strings.txt

      - name: Push validated diagnostic commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/fix-public-sync-single-flight-0.1.373

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.376-public-sync-diagnostics
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0376
