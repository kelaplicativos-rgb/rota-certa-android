name: Rota Certa 0.1.372 Unified trip inventory

on:
  push:
    branches:
      - agent/agenda-combined-seat-pools-0.1.369
  pull_request:
    branches:
      - agent/blablacar-capture-orchestrator-0.1.368
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-combined-seat-pools-0369
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove source, free-seat contract and FAROL isolation
        shell: bash
        run: |
          set -euo pipefail
          BASE=736705c5a8297d553a6d17e01856886bf228492d
          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          grep -Fq 'versionCode = 5665' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.372"' app/build.gradle.kts

          # Canonical rule: BlaBla current remaining seats + Rota Certa allocation,
          # normalized into one trip inventory and one segment engine.
          grep -Fq 'bookingOccupancyIdentityKey' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt
          grep -Fq 'operationalInventoryCapacity' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt
          grep -Fq 'blablaAvailableSeats' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt
          grep -Fq 'rotaCertaAvailableSeats' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripDomain.kt
          grep -Fq 'capacitySource=blablacar_remaining_plus_external_peak_plus_rota_certa' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'source.published_seats?.takeIf { it in 0..999 }' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'Vagas disponibilizadas no Rota Certa' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          ! grep -Fq 'Capacidade de passageiros' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          ! grep -Fq 'Capacidade do veículo' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'prefs[rotaCertaSeatAllocation] ?: 0' app/src/main/java/br/com/mapeiaia/rotacerta/Repositories.kt
          ! grep -Fq 'prefs[rotaCertaSeatAllocation] ?: prefs[vehicleCapacity]' app/src/main/java/br/com/mapeiaia/rotacerta/Repositories.kt
          grep -Fq 'Total disponível' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'Total disponível' trip-platform/public/app.js
          grep -Fq 'blablaAvailableSeats' trip-platform/functions/index.js
          grep -Fq 'rotaCertaAvailableSeats' trip-platform/functions/index.js
          grep -Fq 'totalAvailableSeats' trip-platform/functions/index.js

          # Collection stays read-only in the normal synchronization path.
          grep -Fq 'AUTOMATIC_PUBLISHED_SEAT_LOOKUP: Boolean = true' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaHarvestPolicy.kt
          grep -Fq 'BlaBlaBrowserRequest.SEAT_OPTIONS' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          ! grep -Fq 'executeRemoteWrite(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          ! grep -Fq 'BlaBlaBrowserRequest.SEAT_CHANGE' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          ! grep -Fq 'BlaBlaBrowserRequest.SEAT_SAVE' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt

          # No return to the removed physical-capacity authority or double external write.
          ! grep -Fq 'combinedAgendaAvailableSeats' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          ! grep -Fq 'capacity = binding.capacity' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicAgendaAutoSync0300.kt
          grep -Fq 'externalSeatMutation=false' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicBookingSync0296.kt
          grep -Fq 'EXTERNAL_SEAT_WRITE_SKIPPED' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaReliableSeatSync.kt
          test -f app/src/test/java/br/com/mapeiaia/rotacerta/trips/TripUnifiedInventory0372Test.kt

          # FAROL remains outside this PR.
          test "$(git diff --name-only "$BASE"..HEAD -- app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt 'app/src/main/java/br/com/mapeiaia/rotacerta/Farol*.kt' | wc -l)" -eq 0
          git diff --name-only "$BASE"..HEAD | tee /tmp/changed-files.txt
          sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt > /tmp/farol.sha256

      - name: Public capacity backend regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test trip-platform/functions/test/public-search-capacity-0356.test.js
          node --test trip-platform/functions/test/public-capacity-fidelity-0303.test.js
          node --test trip-platform/functions/test/public-combined-capacity-0369.test.js
      - name: Configure Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          test -n "$APP_ID"
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and installable APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref || github.ref_name }}"
          export ROTA_CERTA_GIT_SHA="$SOURCE_SHA"
          export ROTA_CERTA_GIT_BRANCH="$SOURCE_BRANCH"
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace | tee /tmp/gradle.txt

          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cmp -s /tmp/farol.sha256 <(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt)
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta'" /tmp/aapt.txt
          grep -Fq "versionCode='5665'" /tmp/aapt.txt
          grep -Fq "versionName='0.1.372'" /tmp/aapt.txt

          mkdir -p /tmp/0372
          cp "$APK" /tmp/0372/rota-certa-0.1.372-unified-trip-inventory.apk
          sha256sum /tmp/0372/rota-certa-0.1.372-unified-trip-inventory.apk | tee /tmp/0372/apk.sha256
          cp /tmp/aapt.txt /tmp/0372/aapt.txt
          cp /tmp/apksigner.txt /tmp/0372/apksigner.txt
          cp /tmp/gradle.txt /tmp/0372/gradle.txt
          cp /tmp/changed-files.txt /tmp/0372/changed-files.txt
          git rev-parse HEAD > /tmp/0372/source-head.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/0372/dex-strings.txt
          grep -Fq "$SOURCE_SHA" /tmp/0372/dex-strings.txt
          grep -Fq 'Sobre o Rota Certa' /tmp/0372/dex-strings.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.372-unified-trip-inventory
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0372
