name: Inspect shortcut customization 0.1.179

on:
  push:
    branches: [agent/customizable-shortcut-grid-0.1.179]
    paths:
      - .github/workflows/inspect-shortcut-customization-0.1.179.yml
      - scripts/inspect_shortcut_customization_0179.sh
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: codex/unified-debug-log-0.1.139
          fetch-depth: 0
          path: source

      - name: Checkout cumulative patches
        uses: actions/checkout@v4
        with:
          ref: agent/customizable-shortcut-grid-0.1.179
          fetch-depth: 0
          path: patches

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Materialize 0.1.178 and collect shortcut sources
        working-directory: source
        run: bash ../patches/scripts/inspect_shortcut_customization_0179.sh ../patches

      - name: Upload inspection bundle
        uses: actions/upload-artifact@v4
        with:
          name: inspection-shortcut-customization-0.1.179
          path: source/inspection-shortcut-customization-0179.tar.gz
          retention-days: 7
          if-no-files-found: error
