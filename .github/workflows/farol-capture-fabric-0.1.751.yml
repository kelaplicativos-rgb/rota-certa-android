name: Rota Certa 0.1.751 FAROL Capture Fabric exact SHA

on:
  push:
    branches:
      - 'agent/farol-capture-fabric-0.1.751'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      ROTA_CERTA_GIT_SHA: ${{ github.sha }}
      ROTA_CERTA_GIT_BRANCH: 'agent/farol-capture-fabric-0.1.751'
      BASE_SHA: '94059079585aa2e4d3794e4b761ad9210550e676'
      EXPECTED_VERSION_NAME: '0.1.751'
      EXPECTED_VERSION_CODE: '6042'
      OM_VERSION: '2026.08.27-18'
      OM_SOURCE_SHA: '3ef379196cca434cf17f4ee684f16aa99fd8985e'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore pinned Organic Maps SDK cache
        id: om-sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/app/organicmaps/sdk
          key: organicmaps-sdk-${{ runner.os }}-${{ env.OM_SOURCE_SHA }}-android36-ndk29-arm64

      - name: Build exact pinned Organic Maps SDK on cache miss
        if: steps.om-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash tools/ci/build-organicmaps-sdk.sh

      - name: Save pinned Organic Maps SDK cache immediately
        if: steps.om-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/app/organicmaps/sdk
          key: organicmaps-sdk-${{ runner.os }}-${{ env.OM_SOURCE_SHA }}-android36-ndk29-arm64

      - name: Verify pinned Organic Maps SDK dependency
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.m2/repository/app/organicmaps/sdk/location-core/$OM_VERSION/location-core-$OM_VERSION.pom"
          test -s "$HOME/.m2/repository/app/organicmaps/sdk/sdk/$OM_VERSION/sdk-$OM_VERSION.pom"
          test -s "$HOME/.m2/repository/app/organicmaps/sdk/maps-world/$OM_VERSION/maps-world-$OM_VERSION.pom"

      - name: Prove exact source scope and 0.1.751 contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'val releaseVersionName = "0.1.751"' app/build.gradle.kts
          grep -Fq 'val releaseVersionCode = 6_042' app/build.gradle.kts
          grep -Fq '"version": "0.1.751"' app/src/main/assets/release_history.json
          grep -Fq 'FAROL_ORGANIC_OFFLINE_ROAD_PRIMARY_0749' app/src/main/java/br/com/mapeiaia/rotacerta/OrganicMapsOfflineRoadRouter0749.kt
          grep -Fq 'FAROL_ORGANIC_ROAD_CACHE_HIT_0749' app/src/main/java/br/com/mapeiaia/rotacerta/OrganicMapsOfflineRoadRouter0749.kt
          grep -Fq 'FAROL_ORGANIC_ROAD_CONFIRMED_0749' app/src/main/java/br/com/mapeiaia/rotacerta/OrganicMapsOfflineRoadRouter0749.kt
          grep -Fq 'FAROL_GOOGLE_ROAD_FALLBACK_0749' app/src/main/java/br/com/mapeiaia/rotacerta/OrganicMapsOfflineRoadRouter0749.kt
          grep -Fq 'FAROL_PAIR_DESTINATION_AUTHORITY_0749' app/src/main/java/br/com/mapeiaia/rotacerta/FarolPairDestinationAuthority0749.kt
          grep -Fq 'PARTIAL_A_CANNOT_REPLACE_B_0749' app/src/main/java/br/com/mapeiaia/rotacerta/FarolPairDestinationAuthority0749.kt
          grep -Fq 'offlineFirstDrivingDistancesFromAddressKm0749' app/src/main/java/br/com/mapeiaia/rotacerta/GoogleMapsService.kt
          grep -Fq 'cachedOfflineFirstDrivingDistancesFromAddressKm0749' app/src/main/java/br/com/mapeiaia/rotacerta/GoogleMapsService.kt
          grep -Fq 'pickupToHomeKm = exactHomeStage637' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -Fq 'pickupToAlternativeKm = exactPinStage637' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -Fq 'FAROL_ROAD_KM_FINALITY_0713' app/src/main/java/br/com/mapeiaia/rotacerta/FarolRoadKmFinality0713.kt
          grep -Fq 'ORGANIC_MAPS_EMBEDDED_RUNTIME_0711' app/src/main/java/br/com/mapeiaia/rotacerta/OrganicMapsEmbedded0711.kt
          grep -Fq 'ORGANIC_MAPS_DIRECT_DOWNLOAD_0750' app/src/main/java/br/com/mapeiaia/rotacerta/OrganicMapsDirectMapDownloader0750.kt
          grep -Fq 'ORGANIC_MAPS_BRAZIL_DIRECT_0750' app/src/main/java/br/com/mapeiaia/rotacerta/OrganicMapsDirectMapDownloader0750.kt
          grep -Fq 'ORGANIC_MAPS_REGION_DIRECT_0750' app/src/main/java/br/com/mapeiaia/rotacerta/OrganicMapsDirectMapDownloader0750.kt
          grep -Fq 'FAROL_CAPTURE_FABRIC_0751' app/src/main/java/br/com/mapeiaia/rotacerta/FarolCaptureFabric0751.kt
          grep -Fq 'flagIncludeNotImportantViews' app/src/main/res/xml/rota_certa_accessibility.xml
          grep -Fq 'takeScreenshotOfWindow' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -Fq 'FAROL_EMPTY_ACCESSIBILITY_WINDOW_OCR_0751' app/src/main/java/br/com/mapeiaia/rotacerta/FarolCaptureFabric0751.kt
          grep -Fq 'FAROL_GEOCODE_HEDGE_STARTED_0751' app/src/main/java/br/com/mapeiaia/rotacerta/FarolCaptureFabric0751.kt
          grep -Fq 'ORGANIC_MAPS_MOBILE_DATA_DOWNLOAD_ENABLED_0751' app/src/main/java/br/com/mapeiaia/rotacerta/OrganicMapsDirectMapDownloader0750.kt
          grep -Fq 'Baixar mapa do Brasil' app/src/main/java/br/com/mapeiaia/rotacerta/OfflineNavigationActivity0708.kt
          grep -Fq 'Baixar mapa da minha região' app/src/main/java/br/com/mapeiaia/rotacerta/OfflineNavigationActivity0708.kt
          git diff --check "$BASE_SHA"...HEAD
          printf '%s\n' "$GITHUB_SHA" | tee /tmp/source-sha.txt
          printf '%s\n' "$ROTA_CERTA_GIT_BRANCH" | tee /tmp/source-branch.txt

      - name: Verify update identity and focused 0.1.751 contracts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:verifyReleaseHistory :app:verifyAndroidUpdateContract --no-daemon --stacktrace | tee /tmp/release-contract.log
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.FarolCaptureFabric0751Test' \
            --tests 'br.com.mapeiaia.rotacerta.FarolCaptureFabric0751ContractTest' \
            --tests 'br.com.mapeiaia.rotacerta.OrganicMapsDirectMapDownloader0750Test' \
            --tests 'br.com.mapeiaia.rotacerta.OrganicMapsOfflineRoadRouter0749Test' \
            --tests 'br.com.mapeiaia.rotacerta.FarolPairDestinationAuthority0749Test' \
            --tests 'br.com.mapeiaia.rotacerta.FarolRoadKmFinality0713Test' \
            --tests 'br.com.mapeiaia.rotacerta.FarolInstantAddressPresence0748Test' \
            --tests 'br.com.mapeiaia.rotacerta.FarolStage46ImmediateAddressRouteR7Test' \
            --tests 'br.com.mapeiaia.rotacerta.FarolVisualAuthority0740ContractTest' \
            --no-daemon --max-workers=2 --stacktrace | tee /tmp/focused-0749.log

      - name: Run permanent FAROL regression contracts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.ReadingProximity0545ContractTest' \
            --tests 'br.com.mapeiaia.rotacerta.ReadingGeocodeResilience0547ContractTest' \
            --tests 'br.com.mapeiaia.rotacerta.FarolSealed0547RegressionContractTest' \
            --tests 'br.com.mapeiaia.rotacerta.FarolStage44SemanticFinalLeaseTest' \
            --tests 'br.com.mapeiaia.rotacerta.FarolStage46ImmediateAddressRouteR7Test' \
            --tests 'br.com.mapeiaia.rotacerta.FarolEdge0634Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace | tee /tmp/sealed-farol-regression.log

      - name: Compare complete Android failures with exact 0.1.748 base
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/rc-base "$BASE_SHA"
          chmod +x /tmp/rc-base/gradlew
          set +e
          (cd /tmp/rc-base && ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace) > /tmp/android-base-full.log 2>&1
          BASE_EXIT=$?
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace > /tmp/android-head-full.log 2>&1
          HEAD_EXIT=$?
          set -e
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          def failures(root):
              result=set()
              d=pathlib.Path(root)/"app/build/test-results/testDebugUnitTest"
              if not d.exists(): return result
              for f in d.glob("*.xml"):
                  try: tree=ET.parse(f)
                  except Exception: continue
                  for case in tree.getroot().iter("testcase"):
                      if case.find("failure") is not None or case.find("error") is not None:
                          result.add(f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}")
              return result
          base=failures("/tmp/rc-base")
          head=failures(".")
          new=sorted(head-base)
          pathlib.Path("/tmp/android-new-failures.txt").write_text("\n".join(new)+("\n" if new else ""))
          print(f"base_failures={len(base)} head_failures={len(head)} new_failures={len(new)}")
          if new:
              print("\n".join(new))
              raise SystemExit(1)
          PY
          printf 'base_exit=%s\nhead_exit=%s\n' "$BASE_EXIT" "$HEAD_EXIT" | tee /tmp/android-regression-summary.txt

      - name: Assemble exact-head APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace | tee /tmp/assemble.log
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Prove APK identity and compiled contracts
        id: proof
        shell: bash
        run: |
          set -Eeuo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -s "$APK"
          unzip -t "$APK" > /tmp/zip-integrity.txt 2>&1
          unzip -l "$APK" > /tmp/apk-files.txt
          grep -Eq 'lib/arm64-v8a/liborganicmaps\.so' /tmp/apk-files.txt
          grep -Eq 'assets/World\.mwm' /tmp/apk-files.txt
          grep -Eq 'assets/WorldCoasts\.mwm' /tmp/apk-files.txt

          "$APKANALYZER" apk summary "$APK" | tee /tmp/apkanalyzer-summary.txt
          read -r APP_ID VERSION_CODE VERSION_NAME < /tmp/apkanalyzer-summary.txt
          test "$APP_ID" = "br.com.mapeiaia.rotacerta"
          test "$VERSION_CODE" = "$EXPECTED_VERSION_CODE"
          test "$VERSION_NAME" = "$EXPECTED_VERSION_NAME"

          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt

          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -Fq "$GITHUB_SHA" /tmp/dex-strings.txt
          grep -Fq 'FAROL_ORGANIC_OFFLINE_ROAD_PRIMARY_0749' /tmp/dex-strings.txt
          grep -Fq 'FAROL_ORGANIC_ROAD_CACHE_HIT_0749' /tmp/dex-strings.txt
          grep -Fq 'FAROL_ORGANIC_ROAD_CONFIRMED_0749' /tmp/dex-strings.txt
          grep -Fq 'FAROL_GOOGLE_ROAD_FALLBACK_0749' /tmp/dex-strings.txt
          grep -Fq 'FAROL_PAIR_DESTINATION_AUTHORITY_0749' /tmp/dex-strings.txt
          grep -Fq 'PARTIAL_A_CANNOT_REPLACE_B_0749' /tmp/dex-strings.txt
          grep -Fq 'FAROL_ROAD_KM_FINALITY_0713' /tmp/dex-strings.txt
          grep -Fq 'ORGANIC_MAPS_EMBEDDED_RUNTIME_0711' /tmp/dex-strings.txt
          grep -Fq 'ORGANIC_MAPS_DIRECT_DOWNLOAD_0750' /tmp/dex-strings.txt
          grep -Fq 'ORGANIC_MAPS_BRAZIL_DIRECT_0750' /tmp/dex-strings.txt
          grep -Fq 'ORGANIC_MAPS_REGION_DIRECT_0750' /tmp/dex-strings.txt
          grep -Fq 'FAROL_CAPTURE_FABRIC_0751' /tmp/dex-strings.txt
          grep -Fq 'FAROL_EMPTY_ACCESSIBILITY_WINDOW_OCR_0751' /tmp/dex-strings.txt
          grep -Fq 'FAROL_WINDOW_SCREENSHOT_DISPATCH_0751' /tmp/dex-strings.txt
          grep -Fq 'FAROL_GEOCODE_HEDGE_STARTED_0751' /tmp/dex-strings.txt
          grep -Fq 'ORGANIC_MAPS_MOBILE_DATA_DOWNLOAD_ENABLED_0751' /tmp/dex-strings.txt

          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          FINAL="rota-certa-0.1.751-6042-$SHORT_SHA.apk"
          cp "$APK" "$FINAL"
          APK_SHA256="$(sha256sum "$FINAL" | awk '{print $1}')"
          sha256sum "$FINAL" | tee /tmp/apk-sha256.txt
          stat -c '%s' "$FINAL" | tee /tmp/apk-size-bytes.txt
          echo "apk=$FINAL" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "package=br.com.mapeiaia.rotacerta"
            echo "versionName=$EXPECTED_VERSION_NAME"
            echo "versionCode=$EXPECTED_VERSION_CODE"
            echo "sourceSha=$GITHUB_SHA"
            echo "sourceBranch=$ROTA_CERTA_GIT_BRANCH"
            echo "deviceTarget=Samsung SM-S911B / Android 16"
            echo "organicMapsRoadPrimary=true"
            echo "organicMapsDirectDownload=true"
            echo "organicMapsBrazilDirectDownload=true"
            echo "organicMapsCurrentRegionDirectDownload=true"
            echo "captureFabric0751=true"
            echo "windowSpecificScreenshotApi34=true"
            echo "includeNotImportantViews=true"
            echo "emptyAccessibilityImmediateOcr=true"
            echo "offlineGeocodeBudgetMs=180"
            echo "hedgedGeocodeDeadlineMs=1250"
            echo "publicNominatimSkippedWhenGoogleAvailable=true"
            echo "mobileDataMapDownloadEnabledOnExplicitRequest=true"
            echo "offlineRoadBudgetMs=350"
            echo "persistentOfflineRoadCache=true"
            echo "googleFallback=true"
            echo "pairDestinationBProtected=true"
            echo "haversinePublicKm=false"
            echo "organicMapsSdk=$OM_VERSION"
            echo "verifyAndroidUpdateContract=PASS"
            echo "apkSha256=$APK_SHA256"
          } | tee /tmp/final-proof.txt

      - name: Persist CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-ci-evidence-0.1.751-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/source-sha.txt
            /tmp/source-branch.txt
            /tmp/release-contract.log
            /tmp/focused-0749.log
            /tmp/sealed-farol-regression.log
            /tmp/android-base-full.log
            /tmp/android-head-full.log
            /tmp/android-new-failures.txt
            /tmp/android-regression-summary.txt
            /tmp/assemble.log
            /tmp/final-proof.txt
            /tmp/apk-sha256.txt
            /tmp/apk-size-bytes.txt
            /tmp/aapt.txt
            /tmp/apksigner.txt
            /tmp/apkanalyzer-summary.txt

      - name: Upload exact-SHA APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-farol-capture-fabric-0.1.751-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ steps.proof.outputs.apk }}
            /tmp/source-sha.txt
            /tmp/source-branch.txt
            /tmp/final-proof.txt
            /tmp/apk-sha256.txt
            /tmp/apk-size-bytes.txt
            /tmp/aapt.txt
            /tmp/apksigner.txt
            /tmp/apkanalyzer-summary.txt
            /tmp/focused-0749.log
            /tmp/sealed-farol-regression.log
            /tmp/android-regression-summary.txt
