name: Agenda 0.1.302 public link debug

on:
  push:
    branches:
      - agent/agenda-public-link-debug-0.1.302
    paths:
      - '.github/workflows/agenda-0302-public-link-debug.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripRemoteApi.kt'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/PublicBookingSync0296.kt'
      - 'app/src/test/java/br/com/mapeiaia/rotacerta/trips/PublicLinkDebug0302Test.kt'
      - 'trip-platform/functions/index.js'
      - 'trip-platform/functions/test/public-link-debug-0302.test.js'
      - 'trip-platform/public/app.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agenda-public-link-debug-0.1.302
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate public web and backend contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/public/app.js
          node --test trip-platform/functions/test/*.test.js
          grep -Fq 'PUBLIC_LINK_OPENED' trip-platform/public/app.js
          grep -Fq 'PUBLIC_RESERVATION_CREATED' trip-platform/functions/index.js
          grep -Fq 'tripPublicDebugEvents' trip-platform/functions/index.js
          grep -Fq '/v1/driver/public-debug' trip-platform/functions/index.js
          ! grep -A45 -F 'function tracePublicAction' trip-platform/public/app.js | grep -Eq 'passengerName|passengerContact|cancellationToken|bookingId'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test lint and build APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace | tee /tmp/gradle.txt
          test -s app/build/outputs/apk/debug/app-debug.apk
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"

      - name: Verify APK metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta'" /tmp/aapt.txt
          grep -Fq "versionCode='5595'" /tmp/aapt.txt
          grep -Fq "versionName='0.1.302'" /tmp/aapt.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agenda-0302
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/agenda-0302/rota-certa-0.1.302-public-link-debug.apk
          cp /tmp/apk.sha256 /tmp/agenda-0302/apk.sha256
          cp /tmp/aapt.txt /tmp/agenda-0302/aapt.txt
          cp /tmp/apksigner.txt /tmp/agenda-0302/apksigner.txt
          cp /tmp/gradle.txt /tmp/agenda-0302/gradle.txt
          git rev-parse HEAD > /tmp/agenda-0302/source-head.txt
          printf "%s\n" \
            "versionName=0.1.302" \
            "publicLinkDebug=true" \
            "publicDebugPii=false" \
            "remoteDebugImportedIntoUnifiedReport=true" \
            "firebaseHostingAndTripApiDeploy=true" > /tmp/agenda-0302/contract.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.302-public-link-debug
          if-no-files-found: error
          retention-days: 30
          path: /tmp/agenda-0302

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agenda-public-link-debug-0.1.302

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf "%s" "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf "%s" "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo "Firebase deployment credential is missing."
            exit 3
          fi

      - name: Install Functions dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix trip-platform/functions install --no-audit --no-fund

      - name: Deploy public portal and trip API
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force --token "$FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest deploy --project "$PROJECT" --only functions:trip-api,hosting --non-interactive --force
          fi

      - name: Smoke production public debug route
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 8 --retry-delay 5 --fail --silent --show-error https://rota-certa-7ccc8.web.app/v1/health | tee /tmp/health.json
          grep -Fq '"ok":true' /tmp/health.json
          CODE="$(curl --retry 4 --retry-delay 3 --silent --show-error -o /tmp/public-debug.out -w "%{http_code}" -X POST https://rota-certa-7ccc8.web.app/v1/public/debug/events -H "Content-Type: application/json" --data '{"event":"PUBLIC_LINK_OPENED","sessionId":"ci-smoke-invalid-target"}')"
          test "$CODE" = "204"
