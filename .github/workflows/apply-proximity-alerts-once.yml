name: Apply proximity alerts patch

on:
  push:
    paths:
      - .github/workflows/apply-proximity-alerts-once.yml
      - .github/patches/proximity-alerts-f3b97ac.patch.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and remove temporary files
        run: |
          set -euo pipefail
          base64 -d .github/patches/proximity-alerts-f3b97ac.patch.b64 > /tmp/proximity-alerts.patch
          git apply --check /tmp/proximity-alerts.patch
          git apply /tmp/proximity-alerts.patch
          rm .github/patches/proximity-alerts-f3b97ac.patch.b64
          rm .github/workflows/apply-proximity-alerts-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt app/src/main/java/br/com/mapeiaia/rotacerta/Repositories.kt .github/patches/proximity-alerts-f3b97ac.patch.b64 .github/workflows/apply-proximity-alerts-once.yml
          git commit -m "Add spoken proximity alerts"
          git push
