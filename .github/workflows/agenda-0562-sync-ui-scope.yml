name: Agenda 0.1.562 sync UI scope

on:
  push:
    branches:
      - agent/agenda-sync-visual-scope-0.1.562
    paths:
      - '.github/workflows/agenda-0562-sync-ui-scope.yml'
      - '.github/scripts/agenda_0562_sync_ui_scope.py'
      - '.github/scripts/agenda_0562_sync_ui_scope_finalize.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agenda-0562-sync-ui-scope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/agenda-sync-visual-scope-0.1.562

      - name: Prove exact 0.1.561 baseline and root-cause anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          build = Path('app/build.gradle.kts').read_text()
          activity = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt').read_text()
          timeline = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt').read_text()
          scope = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/AgendaSyncUiScope0562.kt').read_text()
          history = Path('app/src/main/assets/release_history.json').read_text()
          checks = {
              'baseline version code': 'val releaseVersionCode = 5_852' in build,
              'baseline version name': 'val releaseVersionName = "0.1.561"' in build,
              'old boolean owner': 'var timelineGlobalRefreshBusy0540 by rememberSaveable { mutableStateOf(false) }' in activity,
              'global header': '📡 Atualizando todas…' in activity,
              'raw any-pending root cause': '): Boolean = audits.any { it?.pending == true }' in timeline,
              'raw global callback': 'globalRefreshBusyCallback0540.value(globalRadarBusyFromStore0540)' in timeline,
              'card origin': 'origin = BlaBlaCommandOrigin0407.CARD' in timeline,
              'global origin': 'origin = BlaBlaCommandOrigin0407.SYSTEM_RECONCILIATION' in timeline,
              'explicit single ownership model': 'activeSingleTripOperationId: String?' in scope,
              'no 0.1.562 history yet': '"version": "0.1.562"' not in history,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('baseline invariant failed: ' + ', '.join(failed))
          print('baseline invariants: PASS')
          PY

      - name: Materialize scoped synchronization state
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/agenda_0562_sync_ui_scope.py
          python3 .github/scripts/agenda_0562_sync_ui_scope_finalize.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          build = Path('app/build.gradle.kts').read_text()
          timeline = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt').read_text()
          history = Path('app/src/main/assets/release_history.json').read_text()
          checks = {
              'version code 5853': 'val releaseVersionCode = 5_853' in build,
              'version name 0.1.562': 'val releaseVersionName = "0.1.562"' in build,
              'one history record': history.count('"version": "0.1.562"') == 1,
              'global operation authority': 'activeGlobalOperationId0562' in timeline,
              'accepted global command ownership': 'acceptedCommandIds0562 += command0540.commandId' in timeline,
              'durable global readback': 'freshGlobalAudits0562' in timeline,
              'single accepted command ownership': 'activeSingleTripOperationId0562 = command.commandId' in timeline,
              'single scope matching': 'activeSingleTripOperationId = activeSingleTripOperationId0562' in timeline,
              'local single indicator': 'Text(if (singleTripRefreshPending0562) "📡 …" else "📡")' in timeline,
              'exact card event': 'AGENDA_EXACT_CARD_SYNC_STARTED' in timeline,
              'single state log': 'scope=SINGLE_TRIP tripIdentityPresent=true' in timeline,
              'global state log': 'scope=ALL_TRIPS trigger=REFRESH_ALL' in timeline,
              'idle state log': 'scope=IDLE trigger=' in timeline,
          }
          failed = [name for name, ok in checks.items() if not ok]
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
              'app/build.gradle.kts',
              'app/src/main/assets/release_history.json',
              'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt',
          }
          if changed != expected:
              failed.append(f'changed files mismatch expected={sorted(expected)} actual={sorted(changed)}')
          if failed:
              raise SystemExit('materialized invariant failed: ' + '; '.join(failed))
          print('materialized invariants: PASS')
          print('changed files:', *sorted(changed), sep='\n- ')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Focused synchronization-scope tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests br.com.mapeiaia.rotacerta.trips.AgendaSyncUiScope0562Test \
            --no-daemon --stacktrace

      - name: Full unit suite and debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk.sha256

      - name: Scoped lint safety check
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:lintDebug --no-daemon --stacktrace
          lint_exit=$?
          set -e
          lint_txt='app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt'
          if [ "$lint_exit" -ne 0 ]; then
            test -s "$lint_txt"
            if grep -E '(AgendaSyncUiScope0562|TripTimelineUi)\.kt:[0-9]+: Error:' "$lint_txt"; then
              echo 'ERROR: lint found an error inside sync-scope correction' >&2
              exit 1
            fi
          fi

      - name: Write validation evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'ROTA CERTA 0.1.562 — AGENDA SYNC UI SCOPE'
            echo 'scopeModel=NONE|SINGLE_TRIP|ALL_TRIPS'
            echo 'globalAuthority=explicit user refresh-all operation'
            echo 'globalMembership=accepted commandId set'
            echo 'singleAuthority=explicit accepted card commandId'
            echo 'singleIdentity=BlaBlaTripTarget0407.strongIdentityKey'
            echo 'backgroundPromotesSingle=false'
            echo 'backgroundPromotesGlobal=false'
            echo 'cardPendingPromotesGlobal=false'
            echo 'globalOwnPendingKeepsHeader=true'
            echo 'globalIgnoresUnrelatedPending=true'
            echo 'recreationUsesDurableCommandStatus=true'
            echo 'focusedTests=PASS'
            echo 'fullUnitSuite=PASS'
            echo 'assembleDebug=PASS'
            cat /tmp/apk.sha256
          } | tee /tmp/agenda-0562-validation.txt

      - name: Commit tested source and remove one-shot materializers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/agenda_0562_sync_ui_scope.py \
                 .github/scripts/agenda_0562_sync_ui_scope_finalize.py \
                 .github/workflows/agenda-0562-sync-ui-scope.yml
          git add app/build.gradle.kts \
                  app/src/main/assets/release_history.json \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          git commit -m 'fix(agenda): scope sync indicator by operation 0.1.562'
          git push origin HEAD:agent/agenda-sync-visual-scope-0.1.562
          git rev-parse HEAD | tee /tmp/source-head.txt

      - name: Package validation artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agenda-0562
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/agenda-0562/rota-certa-0.1.562-debug.apk
          cp /tmp/apk.sha256 /tmp/agenda-0562/apk.sha256
          cp /tmp/agenda-0562-validation.txt /tmp/agenda-0562/validation.txt
          cp /tmp/source-head.txt /tmp/agenda-0562/source-head.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.562-sync-ui-scope
          path: /tmp/agenda-0562
          if-no-files-found: error
          retention-days: 14
