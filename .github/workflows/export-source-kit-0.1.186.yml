name: Export Rota Certa 0.1.186 source kit

on:
  pull_request:
    branches: [agent/fix-indrive-card-isolation-0.1.185]
    paths:
      - .github/workflows/export-source-kit-0.1.186.yml
  workflow_dispatch:

concurrency:
  group: export-source-kit-0.1.186-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: codex/unified-debug-log-0.1.139
          fetch-depth: 1
          persist-credentials: false
          path: source

      - name: Checkout cumulative patches
        uses: actions/checkout@v4
        with:
          ref: agent/shortcut-audio-links-text-correction-0.1.186
          fetch-depth: 1
          persist-credentials: false
          path: patches

      - name: Prepare source kit
        run: |
          set -euo pipefail
          rm -rf source/.git patches/.git
          mkdir -p source-kit
          mv source source-kit/protected-source
          mv patches source-kit/cumulative-patches
          find source-kit -type f -print0 | sort -z | xargs -0 sha256sum > source-kit/sha256.txt

      - name: Upload source kit
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.186-source-kit
          path: source-kit/
          retention-days: 14
          if-no-files-found: error
