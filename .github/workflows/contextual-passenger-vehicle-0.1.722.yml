name: Rota Certa 0.1.722 contextual passenger vehicle exact SHA

on:
  push:
    branches:
      - 'agent/contextual-passenger-vehicle-0.1.722'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contextual-passenger-vehicle-0722-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      ROTA_CERTA_GIT_SHA: ${{ github.sha }}
      ROTA_CERTA_GIT_BRANCH: 'agent/contextual-passenger-vehicle-0.1.722'
      BASE_SHA: '74c359c3d34bf87524b3e6d98bc1caecdbfd6ca9'
      EXPECTED_VERSION_NAME: '0.1.722'
      EXPECTED_VERSION_CODE: '6013'
      OM_TAG: '2026.08.27-18-android'
      OM_VERSION: '2026.08.27-18'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Build exact Organic Maps SDK locally
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 128 --branch "$OM_TAG" https://github.com/organicmaps/organicmaps.git /tmp/organicmaps
          cd /tmp/organicmaps
          git submodule update --init --recursive --depth 1 --jobs 8
          test "$(tools/unix/version.sh android_name)" = "$OM_VERSION"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          chmod +x ./gradlew
          ./gradlew \
            :sdk:location:core:publishToMavenLocal \
            :sdk:publishToMavenLocal \
            :sdk:maps:world:publishToMavenLocal \
            -Parm64 -Pnjobs=2 \
            --no-daemon --max-workers=2 --stacktrace \
            | tee /tmp/organicmaps-sdk-build.log

      - name: Prove exact source and preserved 0.1.717 contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'val releaseVersionName = "0.1.722"' app/build.gradle.kts
          grep -Fq 'val releaseVersionCode = 6_013' app/build.gradle.kts
          grep -Fq '"version": "0.1.722"' app/src/main/assets/release_history.json
          grep -Fq 'UNIVERSAL_SEARCH_PREPARED_INDEX_0718' app/src/main/java/br/com/mapeiaia/rotacerta/trips/UniversalTripSearch0687.kt
          grep -Fq 'term.windowed(size = 3' app/src/main/java/br/com/mapeiaia/rotacerta/trips/UniversalTripSearch0687.kt
          grep -Fq "EEEE, dd 'de' MMMM 'de' yyyy" app/src/main/java/br/com/mapeiaia/rotacerta/trips/UniversalTripSearch0687.kt
          grep -Fq 'Ex.: qui., 15 de outubro; Dom. 04 Out; Gabriela' app/src/main/java/br/com/mapeiaia/rotacerta/trips/UniversalTripSearch0687.kt
          grep -Fq 'manageTripListState0718.scrollToItem' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt
          grep -Fq 'index.search("qui., 15 de outubro")' app/src/test/java/br/com/mapeiaia/rotacerta/trips/UniversalTripSearch0687Test.kt
          grep -Fq 'index.search("Dom. 04 Out")' app/src/test/java/br/com/mapeiaia/rotacerta/trips/UniversalTripSearch0687Test.kt
          grep -Fq 'CARRO_DO_DIA_SAVED_0717' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'Text("Limpar senha")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerAdminUi.kt
          grep -Fq 'FAROL_ADDRESS_RECOVERY_0716' app/src/main/java/br/com/mapeiaia/rotacerta/FarolAddressRecovery0716.kt
          grep -Fq 'MESSAGE_VEHICLE_AUTHORITY_0719' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          grep -Fq 'TENANT_MESSAGE_STORE_AUTHORITY_0719' app/src/main/java/br/com/mapeiaia/rotacerta/RotaCertaTools0172.kt
          grep -Fq 'TRIP_DETAIL_NOT_READY_0721' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          grep -Fq 'return !loadingActive && summary && boundControl' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          grep -Fq 'BLABLACAR_TRIP_DETAIL_DEFERRED_RECOVERED_0721' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          ! grep -Fq 'if (ready || pass + 1 >= PREPARE_PASSES_0605)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaUnifiedHtmlCapture0605.kt
          grep -Fq '"source": "/api/agenda/**"' trip-platform/firebase.json
          grep -Fq '"source": "/api/v1/agenda/**"' trip-platform/firebase.json
          grep -Fq 'parts.length === 3 && parts[0] === "api" && parts[1] === "agenda"' trip-platform/functions/index.js
          grep -Fq 'feedFile0701 = parts[parts.length - 1]' trip-platform/functions/index.js
          grep -Fq 'CONTEXTUAL_PASSENGER_VEHICLE_0722' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          grep -Fq 'vehicleBlockAppearsOnlyWhenPassengerNeedsToIdentifyCar' app/src/test/java/br/com/mapeiaia/rotacerta/trips/PassengerMessageVehicle0719Test.kt
          ! grep -Fq 'everyPredefinedPassengerMessageCarriesTheSameVehicleBlock' app/src/test/java/br/com/mapeiaia/rotacerta/trips/PassengerMessageVehicle0719Test.kt
          git diff --check "$BASE_SHA"...HEAD
          printf '%s\n' "$GITHUB_SHA" | tee /tmp/source-sha.txt
          printf '%s\n' "$ROTA_CERTA_GIT_BRANCH" | tee /tmp/source-branch.txt

      - name: Validate backend XML contract
        shell: bash
        run: |
          set -euo pipefail
          node --check trip-platform/functions/index.js
          node --check trip-platform/functions/live-agenda-feed-0701.js
          node --test trip-platform/functions/test/live-agenda-feed-0701.test.js | tee /tmp/live-agenda-feed-tests.log
          node - <<'NODE' | tee /tmp/agenda-route-contract.log
          const fs = require("fs");
          const assert = require("assert");
          const firebase = JSON.parse(fs.readFileSync("trip-platform/firebase.json", "utf8"));
          const rewrites = firebase.hosting.rewrites || [];
          assert(rewrites.some(r => r.source === "/api/agenda/**" && r.function && r.function.functionId === "tripApi"));
          assert(rewrites.some(r => r.source === "/api/v1/agenda/**" && r.function && r.function.functionId === "tripApi"));
          assert(rewrites.some(r => r.source === "/v1/**" && r.function && r.function.functionId === "tripApi"));
          const index = fs.readFileSync("trip-platform/functions/index.js", "utf8");
          assert(index.includes('(parts.length === 3 && parts[0] === "api" && parts[1] === "agenda")'));
          assert(index.includes('feedFile0701 = parts[parts.length - 1]'));
          console.log("agenda_route_contract=PASS");
          NODE
          npm --prefix trip-platform/functions install --no-audit --no-fund

      - name: Verify release and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:verifyReleaseHistory --no-daemon --stacktrace | tee /tmp/release-history.log
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.UniversalTripSearch0687Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PhysicalVehicleAuthority0717Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PassengerMessageVehicle0719Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PassengerPasswordRecovery0650Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.PassengerOperationalIntegrity0714Test' \
            --tests 'br.com.mapeiaia.rotacerta.FarolAddressRecovery0716Test' \
            --tests 'br.com.mapeiaia.rotacerta.FarolRoadKmFinality0713Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TimelineCardOpenRefresh0707Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.RidesIndexDetailPipeline0676Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripDetailReadiness0721Test' \
            --no-daemon --max-workers=2 --stacktrace \
            | tee /tmp/focused-android-0722.log

      - name: Compare complete Android failures with exact 0.1.721 base
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/rc-base "$BASE_SHA"
          chmod +x /tmp/rc-base/gradlew
          set +e
          (cd /tmp/rc-base && ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace) > /tmp/android-base-full.log 2>&1
          BASE_EXIT=$?
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace > /tmp/android-head-full.log 2>&1
          HEAD_EXIT=$?
          set -e
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          def failures(root):
              result=set()
              d=pathlib.Path(root)/"app/build/test-results/testDebugUnitTest"
              if not d.exists():
                  return result
              for f in d.glob("*.xml"):
                  try:
                      tree=ET.parse(f)
                  except Exception:
                      continue
                  for case in tree.getroot().iter("testcase"):
                      if case.find("failure") is not None or case.find("error") is not None:
                          result.add(f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}")
              return result
          base=failures("/tmp/rc-base")
          head=failures(".")
          new=sorted(head-base)
          fixed=sorted(base-head)
          pathlib.Path("/tmp/android-new-failures.txt").write_text("\n".join(new)+("\n" if new else ""))
          pathlib.Path("/tmp/android-fixed-failures.txt").write_text("\n".join(fixed)+("\n" if fixed else ""))
          print(f"base_failures={len(base)} head_failures={len(head)} new_failures={len(new)} fixed={len(fixed)}")
          if new:
              print("\n".join(new))
              raise SystemExit(1)
          PY
          printf 'base_exit=%s\nhead_exit=%s\n' "$BASE_EXIT" "$HEAD_EXIT" | tee /tmp/android-regression-summary.txt

      - name: Assemble exact-head APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace | tee /tmp/assemble.log
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Prove APK identity
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" | tee /tmp/zip-integrity.txt
          unzip -l "$APK" | tee /tmp/apk-files.txt
          grep -Eq 'lib/arm64-v8a/liborganicmaps\.so' /tmp/apk-files.txt
          grep -Eq 'assets/World\.mwm' /tmp/apk-files.txt
          grep -Eq 'assets/WorldCoasts\.mwm' /tmp/apk-files.txt

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt

          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -Fq "$GITHUB_SHA" /tmp/dex-strings.txt
          grep -Fq 'Busca indexada instant' /tmp/dex-strings.txt
          grep -Fq 'qui., 15 de outubro' /tmp/dex-strings.txt
          grep -Fq 'CARRO_DO_DIA_SAVED_0717' /tmp/dex-strings.txt
          grep -Fq 'FAROL_ADDRESS_RECOVERY_0716' /tmp/dex-strings.txt
          grep -Fq 'TRIP_DETAIL_NOT_READY_0721' /tmp/dex-strings.txt
          grep -Fq 'BLABLACAR_TRIP_DETAIL_DEFERRED_RECOVERED_0721' /tmp/dex-strings.txt

          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          FINAL="rota-certa-0.1.722-6013-$SHORT_SHA.apk"
          cp "$APK" "$FINAL"
          APK_SHA256="$(sha256sum "$FINAL" | awk '{print $1}')"
          sha256sum "$FINAL" | tee /tmp/apk-sha256.txt
          echo "apk=$FINAL" >> "$GITHUB_OUTPUT"
          {
            echo "package=br.com.mapeiaia.rotacerta"
            echo "versionName=$EXPECTED_VERSION_NAME"
            echo "versionCode=$EXPECTED_VERSION_CODE"
            echo "sourceSha=$GITHUB_SHA"
            echo "sourceBranch=$ROTA_CERTA_GIT_BRANCH"
            echo "deviceTarget=Samsung SM-S911B / Android 16"
            echo "preparedNgramIndex0718=true"
            echo "anyPositionSubstring=true"
            echo "ptBrHumanDateAliases=true"
            echo "queryExample1=qui., 15 de outubro"
            echo "queryExample2=Dom. 04 Out"
            echo "directExactTripScroll=true"
            echo "base0718RegressionDiff=true"
            echo "messageVehicleAuthority0719=true"
            echo "contextualPassengerVehicle0722=true"
            echo "vehicleOnlyOneHourAndAtLocation=true"
            echo "tenantMessageStoreUnified=true"
            echo "tripDetailFailClosed0721=true"
            echo "visibleLoadingRejected0721=true"
            echo "notReadyRetryable0721=true"
            echo "deferredFreshWebViewRetry0721=true"
            echo "durableAgendaXml0720Preserved=true"
            echo "apkSha256=$APK_SHA256"
          } | tee /tmp/final-proof.txt

      - name: Upload exact-SHA APK and proof
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-contextual-passenger-vehicle-0.1.722-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ steps.proof.outputs.apk }}
            /tmp/source-sha.txt
            /tmp/source-branch.txt
            /tmp/final-proof.txt
            /tmp/apk-sha256.txt
            /tmp/aapt.txt
            /tmp/apksigner.txt
            /tmp/zip-integrity.txt
            /tmp/apk-files.txt
            /tmp/focused-android-0722.log
            /tmp/android-base-full.log
            /tmp/android-head-full.log
            /tmp/android-new-failures.txt
            /tmp/android-fixed-failures.txt
            /tmp/android-regression-summary.txt
            /tmp/release-history.log
            /tmp/assemble.log
            /tmp/organicmaps-sdk-build.log
