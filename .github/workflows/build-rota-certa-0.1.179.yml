name: Build Rota Certa 0.1.179

on:
  push:
    branches: [agent/customizable-shortcut-grid-0.1.179]
    paths:
      - .github/workflows/build-rota-certa-0.1.179.yml
      - scripts/build_rota_certa_0179.sh
      - patches/customizable-shortcut-grid-0179.patch.part00
      - patches/customizable-shortcut-grid-0179.patch.part01
      - patches/customizable-shortcut-grid-0179.patch.part02
      - patches/customizable-shortcut-grid-0179.patch.part03
  pull_request:
    branches: [agent/radar-edit-delete-dismiss-0.1.178]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: codex/unified-debug-log-0.1.139
          fetch-depth: 0
          path: source

      - name: Checkout cumulative patches
        uses: actions/checkout@v4
        with:
          ref: agent/customizable-shortcut-grid-0.1.179
          fetch-depth: 0
          path: patches

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test, lint and validate 0.1.179
        working-directory: source
        run: bash ../patches/scripts/build_rota_certa_0179.sh ../patches

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.179-customizable-shortcut-grid-validated
          path: source/artifact-0.1.179/
          retention-days: 90
          if-no-files-found: error
