name: Validate Stage38 maximum forensics 0.1.210
on:
  pull_request:
    branches: [agent/stage36-farol-core-authority-0.1.209]
    paths:
      - '.github/workflows/stage38-maximum-forensics-0.1.210.yml'
      - 'scripts/apply_stage38_*.py'
      - 'stage38/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate-stage38:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GOOGLE_MAPS_API_KEY: '${{ secrets.GOOGLE_MAPS_API_KEY }}'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32da54cd112c8ecb8b43b40c5cdb87ef13c4ec42
          path: source
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          path: patches
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore exact materialized Stage32 runtime
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          mkdir -p bootstrap evidence
          gh run download 31703841694 --repo kelaplicativos-rgb/rota-certa-android --name rota-certa-stage34-bootstrap-materialized-stage32-source --dir bootstrap
          TGZ=$(find bootstrap -name stage32-materialized-source.tgz -print -quit)
          test -f "$TGZ"
          test "$(sha256sum "$TGZ" | awk '{print $1}')" = aa251a173e425b075f5f0508d6f042b4881949ed76e3f638f10ccab63417c5e3
          rm -rf source/app/src/main/java source/app/src/test/java
          tar -xzf "$TGZ" -C source
          grep -q 'versionCode = 5491' source/app/build.gradle.kts
          grep -q 'versionName = "0.1.207"' source/app/build.gradle.kts

      - name: Materialize exact Stage34 base
        run: |
          set -euo pipefail
          python patches/scripts/apply_stage34_semantic.py source
          python patches/scripts/apply_stage34_precollect.py source
          python patches/scripts/apply_stage34_binding.py source
          python patches/scripts/apply_stage34_test_semantic_contract.py source
          python patches/scripts/apply_stage34_test_candidate_contract.py source
          python patches/scripts/apply_stage34_test_frame_contract.py source
          cp patches/stage34/FarolStage34Test.kt source/app/src/test/java/br/com/mapeiaia/rotacerta/FarolStage34Test.kt
          python patches/scripts/apply_stage34_test_root_fix.py source
          grep -q 'versionCode = 5492' source/app/build.gradle.kts
          grep -q 'versionName = "0.1.208"' source/app/build.gradle.kts

      - name: Materialize exact Stage36 base
        run: |
          set -euo pipefail
          python patches/scripts/apply_stage36_prepare.py source
          python patches/scripts/apply_stage36_farol_core.py source
          python patches/scripts/apply_stage36_report_compile_fix.py source
          cp patches/stage36/FarolStage36Test.kt source/app/src/test/java/br/com/mapeiaia/rotacerta/FarolStage36Test.kt
          cp patches/stage36/FarolStage36FreshnessTest.kt source/app/src/test/java/br/com/mapeiaia/rotacerta/FarolStage36FreshnessTest.kt
          cp patches/stage36/FarolStage36RuntimeTest.kt source/app/src/test/java/br/com/mapeiaia/rotacerta/FarolStage36RuntimeTest.kt
          python patches/scripts/apply_stage36_test_runtime_fix.py source
          grep -q 'versionCode = 5493' source/app/build.gradle.kts
          grep -q 'versionName = "0.1.209"' source/app/build.gradle.kts
          grep -q 'FAROL_SINGLE_RUNTIME_AUTHORITY_STAGE36' source/app/src/main/java/br/com/mapeiaia/rotacerta/FarolRuntimeAuthorityStage36.kt

      - name: Materialize Stage38 maximum forensics
        run: |
          set -euo pipefail
          python patches/scripts/apply_stage38_parser.py source
          python patches/scripts/apply_stage38_evaluation.py source
          python patches/scripts/apply_stage38_acquisition.py source
          python patches/scripts/apply_stage38_ocr_request.py source
          python patches/scripts/apply_stage38_ocr_result.py source
          python patches/scripts/apply_stage38_downstream.py source
          python patches/scripts/apply_stage38_report.py source
          cp patches/stage38/FarolStage38Test.kt source/app/src/test/java/br/com/mapeiaia/rotacerta/FarolStage38Test.kt
          grep -q 'versionCode = 5494' source/app/build.gradle.kts
          grep -q 'versionName = "0.1.210"' source/app/build.gradle.kts
          grep -q 'FAROL_MAXIMUM_FORENSICS_STAGE38' source/app/src/main/java/br/com/mapeiaia/rotacerta/FarolMaximumForensicsStage38.kt
          grep -q 'ELAPSED_REALTIME_NANOS_STAGE38' source/app/src/main/java/br/com/mapeiaia/rotacerta/FarolMaximumForensicsStage38.kt

      - name: Stage38 static forensic audit
        run: |
          set -euo pipefail
          python - <<'PY' | tee evidence/stage38-static.txt
          from pathlib import Path
          root=Path('source/app/src/main/java/br/com/mapeiaia/rotacerta')
          svc=(root/'LiveRideAccessibilityService.kt').read_text()
          parser=(root/'UniversalScreenAddressParser.kt').read_text()
          stage21=(root/'FarolCausalCorrectionStage21.kt').read_text()
          helper=(root/'FarolMaximumForensicsStage38.kt').read_text()
          report=(root/'ManualTechnicalReportBuilder.kt').read_text()
          required = [
              'S38_ACCESSIBILITY_EVENT_RECEIVED','S38_ACTIVATION_STATE','S38_SEMANTIC_GATE',
              'S38_PRECOLLECT_ADMISSION','S38_ACCESSIBILITY_NODE_VISITED','S38_ACCESSIBILITY_BLOCK',
              'S38_SCREENSHOT_REQUEST','S38_SCREENSHOT_CALLBACK','S38_SCREENSHOT_BITMAP_READY',
              'S38_OCR_EXTRACT_START','S38_OCR_EXTRACT_END','S38_OCR_BLOCK','S38_OCR_CLUSTER',
              'S38_OCR_EVALUATION_RULE','S38_CANDIDATE_SEMANTIC_VALIDATION','S38_CANDIDATE_BOUND',
              'S38_CACHE_RESULT','S38_GOOGLE_ROUTE_START','S38_GOOGLE_ROUTE_END',
              'S38_FINAL_PAINT_PREPARE','S38_FINAL_PAINT_APPLIED','S38_OVERLAY_RENDER_REQUEST',
              'S38_OVERLAY_RENDER_APPLIED','S38_BUBBLE_MOTION_EVENT',
          ]
          for marker in required:
              assert marker in svc, marker
          assert 'forensicExplainStage38' in parser
          assert 'forensicExplainEvaluationStage38' in stage21
          assert 'FarolMaximumForensicsStage38.exportReport()' in report
          assert 'EVENT_DRIVEN_NO_POLLING_STAGE38' in helper
          assert 'DIAGNOSTIC_ONLY_NO_BEHAVIOR_AUTHORITY_STAGE38' in helper
          assert 'MAX_EVENTS = 32_768' in helper
          for bad in ('Thread.sleep(', 'SystemClock.sleep(', 'scheduleAtFixedRate(', 'fixedRateTimer(', 'Timer('):
              assert bad not in helper, bad
          assert 'takeScreenshot(' not in helper
          assert 'extractStructuredText(' not in helper
          assert 'drivingDistancesFromAddressKm(' not in helper
          assert 'stage36RuntimeAuthority.bindDestination' in svc
          assert 'drivingDistancesFromAddressKm(' in svc
          assert 'FAROL_SINGLE_RUNTIME_AUTHORITY_STAGE36' in (root/'FarolRuntimeAuthorityStage36.kt').read_text()
          print('stage38_static=PASS')
          PY

      - name: Verify exact 936 tests
        run: |
          python - <<'PY' | tee evidence/test-inventory.txt
          from pathlib import Path
          n=sum(p.read_text(encoding='utf-8').count('@Test') for p in Path('source/app/src/test/java').rglob('*.kt'))
          print('total_at_test='+str(n))
          assert n==936,n
          PY

      - name: Stage38 deterministic 20
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests br.com.mapeiaia.rotacerta.FarolStage38Test | tee ../evidence/stage38-tests.log
          python - <<'PY' | tee ../evidence/stage38-count.txt
          import xml.etree.ElementTree as E
          r=E.parse('app/build/test-results/testDebugUnitTest/TEST-br.com.mapeiaia.rotacerta.FarolStage38Test.xml').getroot()
          v={k:int(r.attrib.get(k,0)) for k in ('tests','failures','errors','skipped')}
          print(v)
          assert v=={'tests':20,'failures':0,'errors':0,'skipped':0},v
          PY

      - name: Regression Stage36 to Stage19
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest \
            --tests br.com.mapeiaia.rotacerta.FarolStage36Test \
            --tests br.com.mapeiaia.rotacerta.FarolStage36FreshnessTest \
            --tests br.com.mapeiaia.rotacerta.FarolStage36RuntimeTest \
            --tests br.com.mapeiaia.rotacerta.FarolStage34Test \
            --tests br.com.mapeiaia.rotacerta.FarolStage32Test \
            --tests br.com.mapeiaia.rotacerta.FarolPresenceAuthorityStage30Test \
            --tests br.com.mapeiaia.rotacerta.FarolCausalLatencyStage28Test \
            --tests br.com.mapeiaia.rotacerta.FarolReadingActivationStage26Test \
            --tests br.com.mapeiaia.rotacerta.FarolVisualIdentityStage23Test \
            --tests br.com.mapeiaia.rotacerta.FarolCausalCorrectionStage21Test \
            --tests br.com.mapeiaia.rotacerta.FarolForensicTraceStage20Test \
            --tests br.com.mapeiaia.rotacerta.FarolUniversalVisualPipelineStage19Test | tee ../evidence/regression.log

      - name: Complete suite exact 936
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --rerun-tasks testDebugUnitTest | tee ../evidence/full-tests.log
          python - <<'PY' | tee ../evidence/full-count.txt
          from pathlib import Path
          import xml.etree.ElementTree as E
          t=f=e=s=0
          for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              r=E.parse(p).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          print(t,f,e,s)
          assert (t,f,e,s)==(936,0,0,0),(t,f,e,s)
          PY

      - name: Lint and clean assemble
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon lintDebug | tee ../evidence/lint.log
          ./gradlew --no-daemon clean assembleDebug | tee ../evidence/assemble.log

      - name: Validate APK
        run: |
          set -euo pipefail
          A=source/app/build/outputs/apk/debug/app-debug.apk
          O=evidence/Rota-Certa-Stage38-0.1.210.apk
          cp "$A" "$O"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          SIGN=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$AAPT" dump badging "$O" | tee evidence/badging.txt
          grep -q "package: name='br.com.mapeiaia.rotacerta' versionCode='5494' versionName='0.1.210'" evidence/badging.txt
          "$SIGN" verify --verbose --print-certs "$O" | tee evidence/signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' evidence/signature.txt
          unzip -t "$O" | tee evidence/zip.txt
          mkdir -p evidence/dex
          unzip -Z1 "$O" | grep -E '^classes([0-9]+)?\.dex$' | tee evidence/dex-inventory.txt
          while IFS= read -r dex; do unzip -p "$O" "$dex" > "evidence/dex/$dex"; done < evidence/dex-inventory.txt
          cat evidence/dex/classes*.dex > evidence/all-classes.dex
          for m in FAROL_MAXIMUM_FORENSICS_STAGE38 ELAPSED_REALTIME_NANOS_STAGE38 EVENT_DRIVEN_NO_POLLING_STAGE38 DIAGNOSTIC_ONLY_NO_BEHAVIOR_AUTHORITY_STAGE38 EVENT_TO_PIXEL_TO_OCR_TO_ADDRESS_TO_ROUTE_TO_PAINT_STAGE38 FAROL_SINGLE_RUNTIME_AUTHORITY_STAGE36 FAROL_SINGLE_CARD_LEASE_STAGE34 FAROL_SEMANTIC_CARD_GENERATION_STAGE32 FAROL_FORENSIC_CAUSALITY_STAGE20; do
            grep -a -q "$m" evidence/all-classes.dex
          done
          sha256sum "$O" | tee evidence/apk-sha256.txt
          echo 'apk_validation=PASS' | tee evidence/apk-validation.txt

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.210-stage38-maximum-forensics-final
          path: evidence/
          if-no-files-found: error
          retention-days: 30
