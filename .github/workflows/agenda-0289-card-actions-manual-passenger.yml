name: Agenda 0.1.289 persistent card actions

on:
  push:
    branches:
      - agent/agenda-profile-card-colors-0.1.288
    paths:
      - '.github/workflows/agenda-0289-card-actions-manual-passenger.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agenda-0289-persistent-card-actions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/agenda-profile-card-colors-0.1.288

      - name: Prove exact Agenda baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 5581' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.288"' app/build.gradle.kts
          grep -Fq 'if (rawRows.isEmpty()) return' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          grep -Fq 'TripBlaBlaTripActionRow(entry, onSyncExactCard)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          grep -Fq 'TimelineDirectionState.OUTBOUND -> "↑ IDA"' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineBaseDirection.kt
          grep -Fq 'TimelineDirectionState.INBOUND -> "↓ VOLTA"' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineBaseDirection.kt
          test -f .github/scripts/agenda_0289_card_actions_manual_passenger.py
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"

      - name: Materialize minimal card action flow
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/agenda_0289_card_actions_manual_passenger.py
          git diff --check
          grep -Fq 'versionCode = 5582' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.289"' app/build.gradle.kts
          grep -Fq 'TripBlaBlaTripActionRow(entry, onSyncExactCard, onAddManualPassenger)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          grep -Fq 'Text("👤➕")' app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt
          grep -Fq 'TimelineCardQuickPassengerDialog(' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt
          grep -Fq 'showExistingPassengers = true' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripGlobalPassengerFlow0256.kt
          grep -Fq 'BlaBlaReliableSeatSyncBridge.targetForTimeline(entry)' app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripGlobalPassengerFlow0256.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt').read_text()
          action = p.index('TripBlaBlaTripActionRow(entry, onSyncExactCard, onAddManualPassenger)')
          empty_return = p.index('if (rawRows.isEmpty()) return')
          assert action < empty_return, 'card actions must render before empty passenger return'
          PY

      - name: Protect FAROL and exact scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | cut -d' ' -f1)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/changed.txt
          printf '%s\n' \
            'app/build.gradle.kts' \
            'app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt' \
            'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripGlobalPassengerFlow0256.kt' \
            'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt' \
            'app/src/test/java/br/com/mapeiaia/rotacerta/trips/TripTimelineCardActions0289Test.kt' | sort > /tmp/expected.txt
          cmp /tmp/expected.txt /tmp/changed.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Focused regressions and debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests br.com.mapeiaia.rotacerta.trips.TripTimelineCardActions0289Test \
            --tests br.com.mapeiaia.rotacerta.trips.BlaBlaReliableSeatSync0271Test \
            --tests br.com.mapeiaia.rotacerta.trips.TripTimelineExternalQuickPassengerStage47Test \
            --tests br.com.mapeiaia.rotacerta.trips.TripTimelineBaseDirectionStage47Test \
            :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk.sha256

      - name: Commit tested source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/PassengerTimelineUi.kt \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripGlobalPassengerFlow0256.kt \
                  app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt \
                  app/src/test/java/br/com/mapeiaia/rotacerta/trips/TripTimelineCardActions0289Test.kt
          git commit -m 'feat(agenda): keep card actions and add direct passenger flow 0.1.289'
          git push origin HEAD:agent/agenda-profile-card-colors-0.1.288
          git rev-parse HEAD | tee /tmp/source-head.txt

      - name: Prepare APK evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agenda-0289
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/agenda-0289/rota-certa-0.1.289-debug.apk
          cp /tmp/apk.sha256 /tmp/agenda-0289/apk.sha256
          cp /tmp/source-head.txt /tmp/agenda-0289/source-head.txt
          printf '%s\n' \
            'versionName=0.1.289' \
            'versionCode=5582' \
            'emptyCardActionsPersistent=true' \
            'directBlaBlaTripShortcut=true' \
            'manualPassengerCardShortcut=👤➕' \
            'manualPassengerSaveRunsReliableSeatDecrease=true' \
            'manualPassengerRemoveReturnsVerifiedSeatDecrease=true' \
            'gpsDirectionArrowOutbound=↑ IDA' \
            'gpsDirectionArrowInbound=↓ VOLTA' \
            'farolUntouched=true' > /tmp/agenda-0289/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-agenda-0.1.289-card-actions-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/agenda-0289
