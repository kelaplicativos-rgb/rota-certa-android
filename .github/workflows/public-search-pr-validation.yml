name: Consulta Publica PR validation

on:
  pull_request:
    branches:
      - agent/passenger-timeline-geo-ux
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record source and FAROL
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee source_head.txt
          sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | tee farol-before.sha256
          test "$(cut -d' ' -f1 farol-before.sha256)" = "884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and assemble direct source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Verify protected FAROL and APK
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | tee farol-after.sha256
          cmp -s farol-before.sha256 farol-after.sha256
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk.sha256
          grep -E 'version(Code|Name) = ' app/build.gradle.kts | tee app-version.txt

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: consulta-publica-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            source_head.txt
            app-version.txt
            farol-before.sha256
            farol-after.sha256
            apk.sha256
