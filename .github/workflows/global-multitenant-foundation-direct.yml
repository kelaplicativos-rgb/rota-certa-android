name: Global multi-tenant foundation direct-source 0.1.252

on:
  push:
    branches:
      - agent/global-multitenant-foundation
  pull_request:
    branches:
      - agent/stage47-r4-step7-automatic-identity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-direct-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOOGLE_MAPS_API_KEY: tenant_foundation_ci_dummy_key
      PROTECTED_FAROL_SHA256: 2d87d9219ce1aed9b1b032bd0d4790f6e20d0040819cb20c2dfdcd58a169d560
      EXPECTED_VERSION_CODE: '5545'
      EXPECTED_VERSION_NAME: '0.1.252'
    steps:
      - name: Checkout branch source directly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify source authority and protected FAROL
        run: |
          set -euo pipefail
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          TENANT='app/src/main/java/br/com/mapeiaia/rotacerta/TenantIdentity.kt'
          STORE='app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripStore.kt'
          SETTINGS='app/src/main/java/br/com/mapeiaia/rotacerta/Repositories.kt'
          FINANCE='app/src/main/java/br/com/mapeiaia/rotacerta/FinancialRepository.kt'
          TRACKING='app/src/main/java/br/com/mapeiaia/rotacerta/WorkTrackingRepository.kt'
          TEST='app/src/test/java/br/com/mapeiaia/rotacerta/TenantStorageFoundation0252Test.kt'

          test "$(sha256sum "$FAROL" | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"
          for file in "$TENANT" "$STORE" "$SETTINGS" "$FINANCE" "$TRACKING" "$TEST"; do test -s "$file"; done
          grep -Fq "versionCode = $EXPECTED_VERSION_CODE" app/build.gradle.kts
          grep -Fq "versionName = \"$EXPECTED_VERSION_NAME\"" app/build.gradle.kts
          grep -Fq 'provisionalLocal' "$TENANT"
          grep -Fq 'claimCurrentLegacyStorage' "$TENANT"
          grep -Fq 'activeScope()' "$STORE"
          grep -Fq 'tenantScope.key(KEY_TRIPS)' "$STORE"
          grep -Fq 'tenantScope.keyAlias(KEY_ALIAS_BASE)' "$STORE"
          grep -Fq 'activeScope()' "$SETTINGS"
          grep -Fq 'tenantScope.key(base)' "$SETTINGS"
          grep -Fq 'finance-entries-${tenantScope.namespace}.jsonl' "$FINANCE"
          grep -Fq 'work-tracking-points-${tenantScope.namespace}.jsonl' "$TRACKING"
          ! grep -Fq 'replace("R$"' "$FINANCE"
          ! grep -Fq 'Locale("pt", "BR")' "$FINANCE"

          echo "source_head=$(git rev-parse HEAD)"
          echo 'direct_source=true'
          echo 'historical_sha_checkout=false'
          echo 'materializer_used=false'
          echo 'farol_untouched=true'
          echo 'tenant_foundation_present=true'

      - name: Run tenant and regression tests directly on app source
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.TenantStorageFoundation0252Test' \
            --tests 'br.com.mapeiaia.rotacerta.FinanceSummaryCalculatorTest' \
            --tests 'br.com.mapeiaia.rotacerta.ValueFinanceRegression160Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripUnifiedOccupancyStage47R4Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.TripQuickPassengerStage47R4Step4Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.Stage47Reliability0251Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"

      - name: Assemble debug APK directly from app/src
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          test "$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | awk '{print $1}')" = "$PROTECTED_FAROL_SHA256"

          mkdir -p evidence
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          "$AAPT" dump badging "$APK" > evidence/aapt-badging.txt
          PACKAGE_LINE="$(grep '^package:' evidence/aapt-badging.txt | head -n1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"
          sha256sum "$APK" | tee evidence/apk-sha256.txt

          cat > evidence/tenant-foundation-status.txt <<EOF
          global_multitenant_foundation_direct_source=PASS
          version=$EXPECTED_VERSION_NAME/$EXPECTED_VERSION_CODE
          source_head=$(git rev-parse HEAD)
          direct_source=true
          historical_sha_checkout=false
          materializer_used=false
          farol_sha256=$(sha256sum app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt | awk '{print $1}')
          tenant_identity_foundation=true
          trip_store_tenant_scoped=true
          settings_repository_tenant_scoped=true
          finance_repository_tenant_scoped=true
          work_tracking_repository_tenant_scoped=true
          existing_installation_legacy_keys_preserved=true
          subscription_backend_implemented=false
          full_tenant_storage_coverage=false
          physical_ui_validation=false
          merge=false
          release=false
          latest=false
          EOF

      - name: Upload direct-source tenant foundation APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-global-multitenant-foundation-0.1.252
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            evidence/apk-sha256.txt
            evidence/aapt-badging.txt
            evidence/tenant-foundation-status.txt
          if-no-files-found: error
          retention-days: 7
