name: Generated Farol Critical Path Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Materialize final sources
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: ./gradlew :app:preBuild --stacktrace
      - name: Pack critical path evidence
        if: always()
        run: |
          mkdir -p generated-critical-path
          cp app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt generated-critical-path/ || true
          cp app/src/main/java/br/com/mapeiaia/rotacerta/GoogleMapsService.kt generated-critical-path/ || true
          cp app/src/main/java/br/com/mapeiaia/rotacerta/FarolCriticalPathPolicy.kt generated-critical-path/ || true
          cp app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideRouteCache.kt generated-critical-path/ || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-farol-critical-path
          path: generated-critical-path
          if-no-files-found: error
          retention-days: 7
