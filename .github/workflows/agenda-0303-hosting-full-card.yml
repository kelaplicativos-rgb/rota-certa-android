name: Rota Certa 0.1.541 public Agenda preview proof

on:
  push:
    branches:
      - agent/build-public-reserve-blablacar-0.1.541
    paths:
      - '.github/workflows/agenda-0303-hosting-full-card.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-agenda-preview-0541-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FUNCTIONAL_SHA: 0f727e58bf22fd0d6ad9e8e6c58c101c2cf58d3c
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      PREVIEW_CHANNEL: reserve-blablacar-0541

    steps:
      - name: Checkout helper HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prove exact 0.1.541 public source and tests
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$FUNCTIONAL_SHA^{commit}"
          git diff --exit-code "$FUNCTIONAL_SHA" -- \
            app/build.gradle.kts \
            trip-platform/public/app.js \
            trip-platform/public/index.html \
            trip-platform/functions/test/agenda-public-read-only-0475.test.js
          grep -Fq 'versionCode = 5833' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.541"' app/build.gradle.kts
          grep -Fq '/app.js?v=0.1.541-reserve-blablacar0541' trip-platform/public/index.html
          grep -Fq 'reserve0541.textContent = "🟢 Reservar vaga"' trip-platform/public/app.js
          grep -Fq 'validatedBlaBlaReservationUrl0541(item?.blablaPublicUrl)' trip-platform/public/app.js
          grep -Fq 'reserve0541.href = reservationHref0541' trip-platform/public/app.js
          grep -Fq 'AGENDA_RESERVATION_PUBLICATION_OPENED_0541' trip-platform/public/app.js
          ! grep -Fq 'Fazer reserva com o motorista' trip-platform/public/app.js
          node --check trip-platform/public/app.js
          node --test trip-platform/functions/test/agenda-public-read-only-0475.test.js

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
          else
            echo 'Firebase credential is missing.' >&2
            exit 3
          fi

      - name: Deploy exact public source to preview channel only
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          cd trip-platform
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            npx --yes firebase-tools@latest hosting:channel:deploy "$PREVIEW_CHANNEL" \
              --project "$PROJECT" --expires 1d --non-interactive --token "$FIREBASE_TOKEN" | tee /tmp/firebase-preview.txt
          else
            npx --yes firebase-tools@latest hosting:channel:deploy "$PREVIEW_CHANNEL" \
              --project "$PROJECT" --expires 1d --non-interactive | tee /tmp/firebase-preview.txt
          fi
          PREVIEW_URL="$(grep -oE 'https://[A-Za-z0-9._-]+\.web\.app' /tmp/firebase-preview.txt | tail -1)"
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          printf '%s\n' "$PREVIEW_URL" > /tmp/preview-url.txt

      - name: Smoke preview assets and prove WhatsApp CTA is gone
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PREVIEW_URL:-}"
          curl --retry 8 --retry-delay 2 --fail --silent --show-error "$PREVIEW_URL/app.js?sha=$GITHUB_SHA" > /tmp/live-app.js
          grep -Fq 'reserve0541.textContent = "🟢 Reservar vaga"' /tmp/live-app.js
          grep -Fq 'validatedBlaBlaReservationUrl0541(item?.blablaPublicUrl)' /tmp/live-app.js
          grep -Fq 'reserve0541.href = reservationHref0541' /tmp/live-app.js
          grep -Fq 'AGENDA_RESERVATION_PUBLICATION_OPENED_0541' /tmp/live-app.js
          ! grep -Fq 'Fazer reserva com o motorista' /tmp/live-app.js
          curl --retry 8 --retry-delay 2 --fail --silent --show-error "$PREVIEW_URL/ezequiel?sha=$GITHUB_SHA" > /tmp/live-index.html
          grep -Fq '/app.js?v=0.1.541-reserve-blablacar0541' /tmp/live-index.html
          printf '%s\n' \
            'functionalBranch=agent/public-reserve-blablacar-0.1.541' \
            'functionalSha=0f727e58bf22fd0d6ad9e8e6c58c101c2cf58d3c' \
            'versionName=0.1.541' \
            'versionCode=5833' \
            'deployment=PREVIEW_ONLY' \
            'productionHosting=UNCHANGED' \
            "previewUrl=$PREVIEW_URL" \
            'cta=🟢 Reservar vaga' \
            'whatsappReservationCta=false' \
            'reservationAuthority=BLABLACAR' \
            > /tmp/preview-proof.txt

      - name: Upload preview proof
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.541-public-agenda-preview-proof
          path: |
            /tmp/preview-url.txt
            /tmp/preview-proof.txt
            /tmp/firebase-preview.txt
          retention-days: 2
          if-no-files-found: error
