name: Validate Rota Certa 0.1.145

on:
  push:
    branches:
      - codex/unified-debug-log-0.1.139
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-rota-certa-0145-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply complete correction
        run: python scripts/apply_long_press_shortcuts_0145.py

      - name: Verify correction contract
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.1.145"' app/build.gradle.kts
          grep -q 'versionCode = 5060' app/build.gradle.kts
          grep -q 'preserveRecentValidatedCard144' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'postDelayed(longPressAction, 1_500L)' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt
          grep -q 'bubble.shortcut.long_press' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt
          ! grep -q 'onDoubleTap(event' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutOverlayController.kt
          test -n "${GOOGLE_MAPS_API_KEY:-}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Run Android Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build APK first pass
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Save first APK
        run: cp app/build/outputs/apk/debug/app-debug.apk /tmp/rota-certa-first.apk

      - name: Build APK second pass
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Validate APK package version and signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          BADGING=$($AAPT dump badging "$APK" | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='br.com.mapeiaia.rotacerta'"
          echo "$BADGING" | grep -q "versionCode='5060'"
          echo "$BADGING" | grep -q "versionName='0.1.145'"
          cp "$APK" rota-certa-0.1.145-validado.apk
          sha256sum rota-certa-0.1.145-validado.apk | tee rota-certa-0.1.145-sha256.txt

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.145-validated
          path: |
            rota-certa-0.1.145-validado.apk
            rota-certa-0.1.145-sha256.txt
          retention-days: 90
          if-no-files-found: error
