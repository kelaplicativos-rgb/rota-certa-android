name: Validate farol single-flight 0.1.143

on:
  push:
    branches:
      - codex/unified-debug-log-0.1.139
  pull_request:
    branches:
      - codex/grid-double-tap-shortcuts-alerts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-farol-0143-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply farol single-flight correction
        run: python scripts/apply_farol_single_flight_0143.py

      - name: Verify correction contract
        run: |
          grep -q 'versionName = "0.1.143"' app/build.gradle.kts
          grep -q 'versionCode = 5040' app/build.gradle.kts
          grep -q 'BUBBLE_DUPLICATE_EVENT_IGNORED' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'preserveRouteInFlight143' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'single_flight_accessibility_analysis_0_1_143' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          ! grep -q 'análise anterior cancelada por evento mais recente' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Run Android Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build APK first pass
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Save first APK hash
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /tmp/first-apk.sha256

      - name: Build APK second pass
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Validate APK package version and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          BADGING=$($AAPT dump badging "$APK" | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='br.com.mapeiaia.rotacerta'"
          echo "$BADGING" | grep -q "versionCode='5040'"
          echo "$BADGING" | grep -q "versionName='0.1.143'"
          cp "$APK" rota-certa-0.1.143-validado.apk
          sha256sum rota-certa-0.1.143-validado.apk | tee rota-certa-0.1.143-sha256.txt

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.143-validated
          path: |
            rota-certa-0.1.143-validado.apk
            rota-certa-0.1.143-sha256.txt
          retention-days: 90
          if-no-files-found: error
