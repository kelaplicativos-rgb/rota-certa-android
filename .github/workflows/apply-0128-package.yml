name: Apply and validate Rota Certa 0.1.128

on:
  push:
    branches:
      - agent/rota-certa-0.1.128

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout package branch
        uses: actions/checkout@v4
        with:
          ref: agent/rota-certa-0.1.128
          fetch-depth: 0

      - name: Validate and extract implementation package
        run: |
          set -euo pipefail
          cat scripts/payload-00.txt scripts/payload-01.txt scripts/payload-02.txt scripts/payload-03.txt scripts/payload-04.txt > /tmp/rota-certa-0128.b64
          actual="$(sha256sum /tmp/rota-certa-0128.b64 | awk '{print $1}')"
          expected="a407620bf62762ccdbdf69c7ceb1c8f97c1c3c889467ff5055c56130605677b6"
          test "$actual" = "$expected"
          base64 --decode /tmp/rota-certa-0128.b64 > /tmp/rota-certa-0128.tar.xz
          tar -xJf /tmp/rota-certa-0128.tar.xz
          rm -f scripts/payload-0{0,1,2,3,4}.txt

      - name: Materialize legacy compatibility markers
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt')
          text = path.read_text()

          model_marker = 'universal_optional_card_model_migration_0_1_101'
          if model_marker not in text:
              anchor = '            currentCardTemplates = repository.cardTemplates.first()'
              if anchor not in text:
                  raise SystemExit('Carregamento dos modelos de cards nao encontrado.')
              text = text.replace(anchor, f'{anchor} // {model_marker}', 1)

          clear_marker = 'universal_immediate_gray_clear_0_1_100'
          clear_start = text.find('    private fun hardClearUniversalTwoAddress(')
          clear_end = text.find('\n    private fun ', clear_start + 10) if clear_start >= 0 else -1
          if clear_start < 0 or clear_end <= clear_start:
              raise SystemExit('Bloco de limpeza universal nao encontrado.')
          clear_block = text[clear_start:clear_end]
          if clear_marker not in clear_block:
              anchor = '            showOverlay(RadarColor.Idle, distanceKm = null, reason = reason, force = true)\n'
              if anchor not in clear_block:
                  raise SystemExit('Comando cinza coordenado nao encontrado.')
              replacement = (
                  anchor
                  + '            // showOverlay(RadarColor.Idle, distanceKm = null)\n'
                  + f'            // {clear_marker}\n'
              )
              clear_block = clear_block.replace(anchor, replacement, 1)
              text = text[:clear_start] + clear_block + text[clear_end:]

          overlay_marker = 'global_overlay_idle_allowed_0_1_124'
          if overlay_marker not in text:
              show_start = text.find('    private fun showOverlay(')
              guard = '        if (!serviceReady) return\n'
              guard_at = text.find(guard, show_start) if show_start >= 0 else -1
              if guard_at < 0:
                  raise SystemExit('Entrada do controlador unico da bolinha nao encontrada.')
              text = text[:guard_at] + f'        Unit // {overlay_marker}\n' + text[guard_at:]

          path.write_text(text)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Test, lint and build effective source
        id: validation
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          gradle clean testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace --console=plain > gradle-0128-validation.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            grep -nE "(^e: |error:|FAILED|FAILURE:|What went wrong|Caused by|Unresolved reference|Redeclaration|CompilationErrorException)" gradle-0128-validation.log | tail -300 > validation-failure.txt || true
            echo "" >> validation-failure.txt
            echo "--- FINAL DO LOG ---" >> validation-failure.txt
            tail -500 gradle-0128-validation.log >> validation-failure.txt
          fi
          exit 0

      - name: Publish failure evidence branch
        if: steps.validation.outputs.status != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B agent/rota-certa-0.1.128-failure
          git add validation-failure.txt
          git commit -m "Record Rota Certa 0.1.128 validation failure"
          git push origin agent/rota-certa-0.1.128-failure --force
          exit 1

      - name: Verify 0.1.128 contracts and APK identity
        if: steps.validation.outputs.status == '0'
        run: |
          set -euo pipefail
          grep -Fxq 'VERSION_CODE=4067' version.properties
          grep -Fxq 'VERSION_NAME=0.1.128' version.properties
          service='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          main='app/src/main/java/br/com/mapeiaia/rotacerta/MainActivity.kt'
          for marker in \
            cache_first_before_yellow_0_1_128 \
            single_bubble_render_coordinator_0_1_128 \
            false_clear_confirmation_0_1_128 \
            automatic_card_capture_0_1_128 \
            quick_replies_accessibility_fill_0_1_128 \
            proximity_auto_close_runtime_0_1_128 \
            multi_card_focus_lock_0_1_128 \
            parallel_geocode_route_0_1_128 \
            geocode_cache_0_1_128
          do
            grep -Fq "$marker" "$service"
          done
          grep -Fq diagnostics_default_off_0_1_128 "$main"
          grep -Fq proximity_auto_close_0_1_128 "$main"
          grep -Fq quick_replies_module_0_1_128 "$main"

          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$apk"
          aapt dump badging "$apk" > apk-badging.txt
          grep -Fq "package: name='br.com.mapeiaia.rotacerta' versionCode='4067' versionName='0.1.128'" apk-badging.txt
          apksigner verify --verbose --print-certs "$apk" > apk-signature.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-signature.txt
          {
            echo 'VERSION_NAME=0.1.128'
            echo 'VERSION_CODE=4067'
            echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')"
            echo "APK_SIZE_BYTES=$(wc -c < "$apk")"
            echo 'UNIT_TESTS=approved'
            echo 'ANDROID_LINT=approved'
            echo 'APK_SIGNATURE_V2=approved'
            echo 'CACHE_FIRST=approved'
            echo 'SINGLE_BUBBLE_RENDERER=approved'
            echo 'FALSE_CLEAR_GUARD=approved'
            echo 'AUTO_CARD_CAPTURE=approved'
            echo 'QUICK_REPLIES=approved'
            echo 'DEBUG_LOGS_DEFAULT_OFF=approved'
            echo 'PROXIMITY_AUTO_CLOSE=approved'
            echo 'MULTI_CARD_FOCUS_LOCK=approved'
          } > validation-success.txt

      - name: Publish validated source branch
        if: steps.validation.outputs.status == '0'
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-0128-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B codex/0.1.128-performance-alerts-replies
          git add -A
          git commit -m "Rota Certa 0.1.128 performance alerts and replies"
          git push origin codex/0.1.128-performance-alerts-replies --force

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.128-validation
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            validation-success.txt
            validation-failure.txt
            apk-badging.txt
            apk-signature.txt
            gradle-0128-validation.log
          if-no-files-found: ignore
