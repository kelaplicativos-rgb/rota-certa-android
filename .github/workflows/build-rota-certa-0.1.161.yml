name: Build Rota Certa 0.1.161

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-rota-certa-0.1.161.yml
      - .github/validation/rota-certa-0.1.161.txt
      - scripts/fix_failed_card_autocapture_0161.py
      - scripts/fix_failed_card_autocapture_0161_rerun.py

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout correction source
        uses: actions/checkout@v4
        with:
          ref: codex/unified-debug-log-0.1.139
          fetch-depth: 0
          path: source

      - name: Checkout isolated patch branch
        uses: actions/checkout@v4
        with:
          ref: codex/rota-certa-0.1.159-validation
          fetch-depth: 0
          path: patches

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Materialize stable source through 0.1.160
        working-directory: source
        run: |
          set -euo pipefail
          python scripts/fix_99_overlay_state_0151.py
          python scripts/fix_selected_package_state_0152.py
          python scripts/fix_transient_launcher_clear_0154.py
          python scripts/fix_bounded_empty_read_preservation_0155.py
          python scripts/fix_passive_churn_and_launcher_race_0156.py
          python scripts/fix_subsecond_farol_0157.py
          python scripts/remove_collector_completely_0158.py
          python scripts/run_value_finance_0159.py
          python scripts/fix_value_finance_0160.py
          python scripts/fix_value_finance_0160_compile.py

      - name: Snapshot protected 0.1.160 source
        working-directory: source
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json

          roots = [Path('app')]
          snapshot = {}
          for root in roots:
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  snapshot[path.as_posix()] = sha256(path.read_bytes()).hexdigest()
          Path('/tmp/rota-certa-0160-source-snapshot.json').write_text(
              json.dumps(snapshot, sort_keys=True, indent=2), encoding='utf-8'
          )
          PY
          cp app/src/main/AndroidManifest.xml /tmp/AndroidManifest-0.1.160.xml
          grep -q 'versionName = "0.1.160"' app/build.gradle.kts
          grep -q 'versionCode = 5210' app/build.gradle.kts

      - name: Apply isolated failed-card recovery 0.1.161
        working-directory: source
        run: |
          set -euo pipefail
          python ../patches/scripts/fix_failed_card_autocapture_0161.py .
          python ../patches/scripts/fix_failed_card_autocapture_0161_rerun.py .

      - name: Verify exact change boundary
        working-directory: source
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json

          before = json.loads(Path('/tmp/rota-certa-0160-source-snapshot.json').read_text(encoding='utf-8'))
          after = {}
          for path in sorted(p for p in Path('app').rglob('*') if p.is_file()):
              after[path.as_posix()] = sha256(path.read_bytes()).hexdigest()

          modified = sorted(path for path in before.keys() & after.keys() if before[path] != after[path])
          added = sorted(after.keys() - before.keys())
          deleted = sorted(before.keys() - after.keys())

          expected_modified = sorted([
              'app/build.gradle.kts',
              'app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt',
          ])
          expected_added = sorted([
              'app/src/main/java/br/com/mapeiaia/rotacerta/FailedCardCaptureStore0161.kt',
              'app/src/main/java/br/com/mapeiaia/rotacerta/FailedCardRecovery0161.kt',
              'app/src/test/java/br/com/mapeiaia/rotacerta/FailedCardAutoCaptureContract0161Test.kt',
              'app/src/test/java/br/com/mapeiaia/rotacerta/FailedCardRecovery0161Test.kt',
          ])
          assert modified == expected_modified, (modified, expected_modified)
          assert added == expected_added, (added, expected_added)
          assert deleted == [], deleted
          print('Modified:', *modified, sep='\n- ')
          print('Added:', *added, sep='\n- ')
          PY
          cmp -s /tmp/AndroidManifest-0.1.160.xml app/src/main/AndroidManifest.xml

      - name: Verify isolated 0.1.161 contracts
        working-directory: source
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.1.161"' app/build.gradle.kts
          grep -q 'versionCode = 5220' app/build.gradle.kts
          grep -q 'FailedCardAutoCaptureGate0161' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'BUBBLE_FAILED_CARD_CAPTURE_STARTED' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'FailedCardTechnicalCaptureStore0161.save' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'TransientOverlayPackagePolicy0161.shouldPreferSelectedRoot' app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt
          grep -q 'com.google.android.projection.gearhead' app/src/main/java/br/com/mapeiaia/rotacerta/FailedCardRecovery0161.kt
          grep -q 'MAX_CAPTURES = 6' app/src/main/java/br/com/mapeiaia/rotacerta/FailedCardCaptureStore0161.kt
          grep -q 'MAX_MODELS_PER_PACKAGE = 4' app/src/main/java/br/com/mapeiaia/rotacerta/FailedCardCaptureStore0161.kt
          grep -q 'PassengerValueBubbleShortcutModule' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutModule.kt
          grep -q 'FinanceBubbleShortcutModule' app/src/main/java/br/com/mapeiaia/rotacerta/BubbleShortcutModule.kt
          grep -q 'android:name=".FinancialActivity"' app/src/main/AndroidManifest.xml
          test "$(grep -c '<service' app/src/main/AndroidManifest.xml)" -eq 2
          test ! -e app/src/main/java/br/com/mapeiaia/rotacerta/BlaBlaCarCollectorActivity.kt
          test ! -d app/src/main/java/br/com/mapeiaia/rotacerta/coletor
          ! grep -R -n -E 'BlaBlaCarCollector|CollectorBubbleShortcutModule|OpenCollector|displayLabel = "Coletor"|label = "Coletor"' app/src/main app/src/test
          ! grep -R -n 'while (' app/src/main/java/br/com/mapeiaia/rotacerta/FailedCardRecovery0161.kt app/src/main/java/br/com/mapeiaia/rotacerta/FailedCardCaptureStore0161.kt
          python - <<'PY'
          from pathlib import Path
          source = Path('app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt').read_text(encoding='utf-8')
          start = source.index('private fun requestScreenshotAnalysis')
          end = source.index('private fun collectVisibleText', start)
          section = source[start:end]
          forbidden = (
              'speak(',
              'textToSpeech',
              'announceForAccessibility',
              'FinancialActivity',
              'PassengerValue',
              'showOverlay(',
              'resetToIdle(',
          )
          for token in forbidden:
              assert token not in section, token
          assert 'universalRouteJob?.isActive == true' in section
          assert 'bitmap0161' in section and 'recycle()' in section
          assert 'screenshotInProgress.set(false)' in section
          assert 'failedCardAutoCaptureGate0161.finish' in section
          PY
          test -n "${GOOGLE_MAPS_API_KEY:-}"

      - name: Unit and contract tests
        working-directory: source
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Android lint
        working-directory: source
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build APK
        working-directory: source
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Validate APK and compare release boundary
        working-directory: source
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee rota-certa-0.1.161-assinatura.txt
          grep -qi 'd9ee577b5bb9a4c72bce115e974c9ecf1ec8c7382bcd034e88d433e01eb0e7fd' rota-certa-0.1.161-assinatura.txt
          BADGING=$($AAPT dump badging "$APK" | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='br.com.mapeiaia.rotacerta'"
          echo "$BADGING" | grep -q "versionCode='5220'"
          echo "$BADGING" | grep -q "versionName='0.1.161'"
          $AAPT dump xmltree "$APK" AndroidManifest.xml > apk-manifest-tree.txt
          grep -q 'FinancialActivity' apk-manifest-tree.txt
          test "$(grep -c 'E: service' apk-manifest-tree.txt)" -eq 2
          for dex in $(zipinfo -1 "$APK" | grep -E '^classes([0-9]+)?\.dex$'); do unzip -p "$APK" "$dex"; done | strings > dex-strings.txt
          grep -q 'FailedCardRecoveryEngine0161' dex-strings.txt
          grep -q 'FailedCardTechnicalCaptureStore0161' dex-strings.txt
          grep -q 'BUBBLE_FAILED_CARD_CAPTURE_STARTED' dex-strings.txt
          grep -q 'com.google.android.projection.gearhead' dex-strings.txt
          grep -q 'PassengerValueFormatter' dex-strings.txt
          grep -q 'FinancialActivity' dex-strings.txt
          grep -E 'BlaBlaCarCollector|CollectorBubbleShortcutModule|OpenCollector' dex-strings.txt && exit 1 || true
          cp "$APK" rota-certa-0.1.161-farol-autocaptura-validado.apk
          sha256sum rota-certa-0.1.161-farol-autocaptura-validado.apk | tee rota-certa-0.1.161-sha256.txt
          printf 'Base protegida: Rota Certa 0.1.160 (5210)\nNova versão: Rota Certa 0.1.161 (5220)\nManifesto: idêntico à 0.1.160\nComponentes novos: nenhum\nPermissões novas: nenhuma\nServiços: 2 (inalterado)\n' > rota-certa-0.1.161-comparacao.txt

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.161-farol-auto-capture-validated
          path: |
            source/rota-certa-0.1.161-farol-autocaptura-validado.apk
            source/rota-certa-0.1.161-sha256.txt
            source/rota-certa-0.1.161-assinatura.txt
            source/rota-certa-0.1.161-comparacao.txt
          retention-days: 90
          if-no-files-found: error
