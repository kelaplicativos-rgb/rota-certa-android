name: Agenda trip detail timeout 0.1.389

on:
  push:
    branches:
      - agent/agenda-trip-detail-timeout-0.1.389
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-trip-detail-timeout-0389-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_MAPS_API_KEY: agenda_trip_detail_timeout_ci_dummy_key
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record exact source version and protected FAROL
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ github.sha }}"
          SOURCE_BRANCH="${{ github.ref_name }}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s\n' "$SOURCE_SHA" | tee source_head.txt
          printf '%s\n' "$SOURCE_BRANCH" | tee source_branch.txt
          echo "ROTA_CERTA_GIT_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "ROTA_CERTA_GIT_BRANCH=$SOURCE_BRANCH" >> "$GITHUB_ENV"

          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          test -s "$FAROL"
          sha256sum "$FAROL" | tee farol-head.sha256
          grep -Fq '884c5ae40740df76efd61b22a2bd4200592479a14b03a68cfb65afc75947408a' farol-head.sha256

          git fetch origin agent/agenda-pull-refresh-owner-0.1.388 --depth=1
          git show FETCH_HEAD:"$FAROL" | sha256sum | awk '{print $1}' > farol-base.sha256
          awk '{print $1}' farol-head.sha256 > farol-current.sha256
          cmp -s farol-base.sha256 farol-current.sha256

          grep -Fq 'versionCode = 5682' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.389"' app/build.gradle.kts

      - name: Prove causal timeout scope
        shell: bash
        run: |
          set -euo pipefail
          DYNAMIC='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt'
          ORCH='app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaBrowserOrchestrator.kt'
          TEST='app/src/test/java/br/com/mapeiaia/rotacerta/trips/AgendaTripDetailTimeout0389Test.kt'
          grep -Fq 'BLABLA_TRIP_DETAIL_CAPTURE_TIMEOUT_MS_0389 = 10_000L' "$DYNAMIC"
          grep -Fq 'BlaBlaBrowserRequest.TRIP_DETAIL -> BLABLA_TRIP_DETAIL_CAPTURE_TIMEOUT_MS_0389' "$DYNAMIC"
          grep -Fq 'timeoutMs = blaBlaDynamicCollectionTimeoutMs0389(request)' "$DYNAMIC"
          grep -Fq 'if (timeoutMs > 0L)' "$ORCH"
          grep -Fq 'BROWSER_REQUEST_TIMEOUT' "$ORCH"
          grep -Fq 'callback(null)' "$ORCH"
          grep -Fq 'reason=detail_dom_unreadable' "$DYNAMIC"
          grep -Fq 'CARD_TRAVERSAL_QUARANTINED' "$DYNAMIC"
          grep -Fq 'resume_ride_list_after_quarantine' "$DYNAMIC"
          test -s "$TEST"

          git diff --name-only dbb2a7c8d3738e5e127bac4804ba865dbe46e260...HEAD | tee changed-files.txt
          ! grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt' changed-files.txt
          ! grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripTimelineUi.kt' changed-files.txt
          ! grep -Fxq 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/TripsActivity.kt' changed-files.txt

      - name: Configure Firebase Android app
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json
            exit 0
          fi
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
            chmod 600 /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          fi
          PROJECT="${FIREBASE_PROJECT_ID:-rota-certa-7ccc8}"
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" --token "$FIREBASE_TOKEN" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json --token "$FIREBASE_TOKEN"
          else
            test -s /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx --yes firebase-tools@latest apps:list ANDROID --project "$PROJECT" > /tmp/apps.txt
            APP_ID="$(grep -oE '1:[0-9]+:android:[A-Za-z0-9]+' /tmp/apps.txt | head -1)"
            test -n "$APP_ID"
            npx --yes firebase-tools@latest apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out app/google-services.json
          fi
          grep -Fq '"package_name": "br.com.mapeiaia.rotacerta"' app/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Run causal and retained regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaTripDetailTimeout0389Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaBrowserOrchestrator0318Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaCaptureOrchestrator0368Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaPullRefreshGesture0388Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaTouchUnfreeze0383Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaPassengerMainThread0384Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaSyncPanelScroll0385Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaSilentPublicSync0386Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.AgendaDeterministicTripOutbox0387Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaDatePeriodSync0377Test' \
            --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Lint Android app
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:lintDebug --no-daemon --max-workers=1 --no-parallel --stacktrace

      - name: Assemble installable APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify final source FAROL and APK identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat source_head.txt)"
          FAROL='app/src/main/java/br/com/mapeiaia/rotacerta/LiveRideAccessibilityService.kt'
          sha256sum "$FAROL" | tee farol-after.sha256
          cmp -s farol-head.sha256 farol-after.sha256
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk.sha256
          grep -E 'version(Code|Name) = ' app/build.gradle.kts | tee app-version.txt
          test "$(grep -Foc 'versionCode = 5682' app/build.gradle.kts)" -eq 1
          test "$(grep -Foc 'versionName = "0.1.389"' app/build.gradle.kts)" -eq 1
          if git status --porcelain --untracked-files=no | grep -q .; then
            echo "Tracked source changed during validation" >&2
            git status --short
            exit 1
          fi

      - name: Upload exact-SHA APK and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.389-trip-detail-timeout-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            source_head.txt
            source_branch.txt
            app-version.txt
            farol-base.sha256
            farol-current.sha256
            farol-head.sha256
            farol-after.sha256
            apk.sha256
            changed-files.txt
