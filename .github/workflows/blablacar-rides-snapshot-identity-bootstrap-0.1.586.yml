name: BlaBla rides snapshot identity bootstrap 0.1.586

on:
  push:
    branches:
      - agent/rides-snapshot-identity-bootstrap-0.1.586
    paths:
      - '.github/workflows/blablacar-rides-snapshot-identity-bootstrap-0.1.586.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/assets/release_history.json'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt'
      - 'app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaRidesSnapshot0526.kt'
      - 'app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaRidesSnapshot0526Test.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blablacar-rides-snapshot-identity-bootstrap-0586-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: rides_snapshot_identity_bootstrap_0586_ci_dummy_key
      EXPECTED_VERSION_CODE: '5877'
      EXPECTED_VERSION_NAME: '0.1.586'
      BASE_SHA: '6901736f166d175079519f460849560acbf4676e'

    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove surgical diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check "$BASE_SHA"...HEAD
          git diff --name-only "$BASE_SHA"...HEAD | sort > /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/blablacar-rides-snapshot-identity-bootstrap-0.1.586.yml
          app/build.gradle.kts
          app/src/main/assets/release_history.json
          app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaRidesSnapshot0526.kt
          app/src/test/java/br/com/mapeiaia/rotacerta/trips/BlaBlaRidesSnapshot0526Test.kt
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt
          grep -Fq 'val releaseVersionCode = 5_877' app/build.gradle.kts
          grep -Fq 'val releaseVersionName = "0.1.586"' app/build.gradle.kts
          grep -Fq 'AUTHENTICATED_TRIP_DRIVER_PROFILE_UUID_LINK' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaDynamicAccounts.kt
          grep -Fq 'IDENTITY_BOOTSTRAP_TRIP_MISMATCH' app/src/main/java/br/com/mapeiaia/rotacerta/trips/BlaBlaRidesSnapshot0526.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          test -d "$SDK_ROOT/platforms/android-35"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          test -n "$BUILD_TOOLS"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run identity, session and multiprofile regression tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=1 --no-parallel \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaRidesSnapshot0526Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaCarSessionKeeper0552Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaMultiAccountIsolation0584Test' \
            --tests 'br.com.mapeiaia.rotacerta.trips.BlaBlaMultiAccountAdoption0585Test'

      - name: Assemble exact-head APK
        shell: bash
        run: |
          set -euo pipefail
          export ROTA_CERTA_GIT_SHA="$GITHUB_SHA"
          export ROTA_CERTA_GIT_BRANCH="$GITHUB_REF_NAME"
          ./gradlew :app:assembleDebug --no-daemon --max-workers=1 --no-parallel
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/aapt.txt
          PACKAGE_LINE="$(grep '^package:' /tmp/aapt.txt | head -1)"
          grep -Fq "name='br.com.mapeiaia.rotacerta'" <<< "$PACKAGE_LINE"
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$PACKAGE_LINE"
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$PACKAGE_LINE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/apksigner.txt
          grep -Fq 'Verified' /tmp/apksigner.txt
          mkdir -p /tmp/0586
          SHORT_SHA="${GITHUB_SHA:0:12}"
          FINAL="/tmp/0586/rota-certa-$EXPECTED_VERSION_NAME-$EXPECTED_VERSION_CODE-$SHORT_SHA.apk"
          cp "$APK" "$FINAL"
          sha256sum "$FINAL" | tee /tmp/0586/apk.sha256
          cp /tmp/aapt.txt /tmp/apksigner.txt /tmp/0586/

      - uses: actions/upload-artifact@v4
        with:
          name: rota-certa-0.1.586-5877-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: /tmp/0586
