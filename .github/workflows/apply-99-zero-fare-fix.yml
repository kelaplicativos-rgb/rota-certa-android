name: Apply 99 Zero Fare Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-99-zero-fare-fix.yml'

permissions:
  contents: write
  actions: read

jobs:
  apply:
    name: Apply zero fare parser fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Patch parser and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          perl -0pi -e 's/lines\.take\(index\)\.asReversed\(\)\.firstOrNull \{ isPrimaryFareLine\(it\) \}/lines.take(index).asReversed().firstOrNull { isPrimaryFareLine(it) \&\& !isZeroFareLine(it) }/' app/src/main/java/br/com/mapeiaia/rotacerta/RideTextParser.kt
          grep -F 'lines.take(index).asReversed().firstOrNull { isPrimaryFareLine(it) && !isZeroFareLine(it) }' app/src/main/java/br/com/mapeiaia/rotacerta/RideTextParser.kt
          rm -f .github/workflows/apply-99-zero-fare-fix.yml
          git add -A
          git commit -m "Ignore zero fare before 99 map addresses"
          git push origin HEAD:main

# trigger after workflow registration
