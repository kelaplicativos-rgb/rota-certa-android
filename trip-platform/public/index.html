<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Rota Certa — Agenda de Viagens</title>
  <style>
    :root{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#171717;background:#f5f6f8;
      --ink:#171717;--muted:#5d626a;--line:#dde0e5;
    }
    *{box-sizing:border-box}
    html{font-size:18px}
    body{margin:0;background:#f5f6f8}
    main{max-width:760px;margin:0 auto;padding:22px 16px 80px}
    .hidden{display:none!important}
    .topNav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px}
    .brand{font-size:18px;font-weight:900;letter-spacing:.06em}
    .pageTitle{font-size:32px;line-height:1.15;margin:18px 0 6px;font-weight:900}
    .lead{font-size:20px;line-height:1.45;color:var(--muted);margin:4px 0 18px}
    .card{background:#fff;border-radius:24px;padding:22px;margin-top:16px;box-shadow:0 5px 22px #0000000b;border:1px solid #ebedf0}
    .error{color:#9b1c1c;font-weight:800;font-size:20px}
    .muted{color:var(--muted);font-size:18px;line-height:1.5}
    .agendaTrip{position:relative;display:block;color:inherit;border:2px solid var(--line);border-radius:26px;padding:22px;margin-top:18px;background:#fff;cursor:pointer}
    .agendaTrip:focus-visible{outline:3px solid #1186d8;outline-offset:3px}
    .agendaTripFull{background:#f0f1f3;color:#7c8189}
    .agendaCanonicalVisual0473{display:block;color:var(--ink)}
    .agendaCanonicalVisual0473 .agendaDate0473{font-size:31px;line-height:1.08;font-weight:950;margin:0 0 24px;letter-spacing:-.02em}
    .agendaJourney0473{display:grid;grid-template-columns:82px 28px minmax(0,1fr);grid-template-rows:minmax(68px,auto) minmax(58px,auto);column-gap:10px;align-items:start}
    .agendaJourneyTime0473{grid-column:1;display:grid;gap:4px;align-content:start;line-height:1.05}
    .agendaJourneyStart0473{grid-row:1}
    .agendaJourneyEnd0473{grid-row:2}
    .agendaJourneyTime0473 strong{font-size:26px;font-weight:950;letter-spacing:-.025em}
    .agendaJourneyDuration0473{font-size:20px;line-height:1.05;font-weight:850;color:var(--muted)}
    .agendaJourneyRail0473{grid-column:2;grid-row:1 / 3;position:relative;display:grid;grid-template-rows:20px 1fr 20px;justify-items:center;align-self:stretch;min-height:118px;padding:2px 0 4px}
    .agendaJourneyDot0473{width:16px;height:16px;border:4px solid #58718d;border-radius:50%;background:#fff;z-index:2}
    .agendaJourneyLine0473{width:5px;background:#58718d;min-height:58px;margin:-1px 0}
    .agendaJourneyCity0473{grid-column:3;font-size:29px;line-height:1.12;font-weight:950;letter-spacing:-.018em;padding:0 0 10px;overflow-wrap:anywhere}
    .agendaJourneyStartCity0473{grid-row:1}
    .agendaJourneyEndCity0473{grid-row:2}
    .agendaExpandedItinerary0480{display:none}
    .agendaTripExpanded0480 .agendaJourney0473{display:none}
    .agendaTripExpanded0480 .agendaExpandedItinerary0480{display:block}
    .agendaExpandedStop0480{display:grid;grid-template-columns:82px 28px minmax(0,1fr);column-gap:10px;align-items:stretch;min-height:66px}
    .agendaExpandedStopTime0480{grid-column:1;display:grid;gap:5px;align-content:start;line-height:1.05;padding-top:1px}
    .agendaExpandedStopTime0480 strong{font-size:25px;font-weight:950;letter-spacing:-.025em}
    .agendaExpandedDuration0480{font-size:19px;line-height:1.05;font-weight:850;color:var(--muted)}
    .agendaExpandedStopRail0480{grid-column:2;display:flex;flex-direction:column;align-items:center;align-self:stretch;min-height:66px;padding-top:3px}
    .agendaExpandedStopDot0480{width:16px;height:16px;border:4px solid #58718d;border-radius:50%;background:#fff;flex:0 0 auto;z-index:2}
    .agendaExpandedStopLine0480{width:5px;flex:1 1 auto;min-height:38px;background:#58718d;margin-top:2px}
    .agendaExpandedStopBody0480{grid-column:3;min-width:0;padding:0 0 20px}
    .agendaExpandedStopCity0480{display:block;font-size:28px;line-height:1.12;font-weight:950;letter-spacing:-.018em;overflow-wrap:anywhere}
    .agendaExpandedStopAddress0480{margin-top:5px;font-size:20px;line-height:1.28;font-weight:650;color:#243142;overflow-wrap:anywhere}
    .agendaExpandedStopLast0480{min-height:48px}
    .agendaExpandedStopLast0480 .agendaExpandedStopBody0480{padding-bottom:4px}
    .agendaExpandHint0480{margin-top:12px;text-align:center;font-size:14px;line-height:1.2;font-weight:900;color:#176f98}
    .agendaBottom0473{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:nowrap}
    .agendaOccupancy0473{display:flex;align-items:center;gap:12px;min-width:0}
    .agendaCar0473{display:inline-flex;align-items:center;justify-content:center;width:44px;min-width:44px;height:44px;font-size:25px;filter:grayscale(1);opacity:.78}
    .agendaPassengerStack0473{display:flex;align-items:center;min-width:0;padding-left:4px}
    .agendaPassengerDot0473,.agendaPassengerMore0473{width:44px;height:44px;border-radius:50%;border:3px solid #1186d8;background:#f5f8fb;margin-left:-10px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff;font-size:0}
    .agendaPassengerDot0473:first-child,.agendaPassengerMore0473:first-child{margin-left:0}
    .agendaPassengerDot0473{background:radial-gradient(circle at 50% 34%,#9aacbd 0 18%,transparent 19%),radial-gradient(ellipse at 50% 88%,#9aacbd 0 35%,transparent 36%),#f4f7fa}
    .agendaPassengerMore0473{background:#176f98;color:#fff;font-size:17px;font-weight:950}
    .agendaPassengerEmpty0473{font-size:14px;font-weight:850;color:var(--muted);white-space:nowrap}
    .agendaCardSummary0473{display:grid;justify-items:end;gap:3px;text-align:right;min-width:0}
    .agendaCardAvailability0473{font-size:14px;line-height:1.2;font-weight:850;color:var(--muted)}
    .agendaCardPrice0473{font-size:21px;line-height:1.1;font-weight:950;white-space:nowrap}
    .fullWord{margin-top:16px;font-size:21px;font-weight:950}
    @media(max-width:480px){
      html{font-size:17px}
      .pageTitle{font-size:30px}
      .agendaCanonicalVisual0473 .agendaDate0473{font-size:29px}
      .agendaJourney0473{grid-template-columns:70px 24px minmax(0,1fr);column-gap:8px}
      .agendaJourneyTime0473 strong{font-size:23px}
      .agendaJourneyDuration0473{font-size:18px}
      .agendaJourneyCity0473{font-size:25px}
      .agendaExpandedStop0480{grid-template-columns:70px 24px minmax(0,1fr);column-gap:8px}
      .agendaExpandedStopTime0480 strong{font-size:22px}
      .agendaExpandedDuration0480{font-size:17px}
      .agendaExpandedStopCity0480{font-size:24px}
      .agendaExpandedStopAddress0480{font-size:18px}
      .agendaPassengerDot0473,.agendaPassengerMore0473{width:40px;height:40px}
      .agendaCar0473{width:38px;min-width:38px}
      .agendaCardAvailability0473{font-size:12px}
      .agendaCardPrice0473{font-size:19px}
    }
  </style>
</head>
<body>
<main>
  <div class="topNav">
    <div class="brand">ROTA CERTA</div>
  </div>

  <section id="loading" class="card">Carregando viagens…</section>
  <section id="error" class="card error hidden" role="alert"></section>

  <section id="agenda" class="hidden">
    <h1 class="pageTitle">Próximas viagens</h1>
    <p id="driverName" class="lead"></p>
    <div id="agendaTrips" aria-live="polite"></div>
  </section>
</main>
<script src="/app.js?v=0.1.480" defer></script>
</body>
</html>
